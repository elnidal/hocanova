<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Hoca Nova taşındı</title>
<style>
  :root{--bg:#F1F0F7;--ink:#1B1E3A;--muted:#62668A;--brand:#3B4BD8}
  @media (prefers-color-scheme:dark){:root{--bg:#12142A;--ink:#ECEDF8;--muted:#A3A6C8;--brand:#8E9BFF}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:600 17px/1.5 system-ui,sans-serif;padding:16px;text-align:center}
  a{color:var(--brand)} small{color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>🦉 Hoca Nova yeni adresinde</h1>
  <p>İlerlemen taşınıyor… <br><small>Açılmazsa: <a id="go" href="https://lgsingilizce.app/">lgsingilizce.app</a></small></p>
</main>
<script>
// Eski adresteki tarayıcı verisini (ilerleme + Supabase oturumu) # içinde yeni adrese taşır. Biçim: app/src/migrate.js ile aynı.
(async () => {
  const NEW = 'https://lgsingilizce.app'
  const target = NEW + location.pathname + location.search
  try { for (const r of await navigator.serviceWorker?.getRegistrations?.() || []) await r.unregister() } catch {}
  let data = {}
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i)
      if (k.startsWith('hikayenglish.') || k.startsWith('sb-')) data[k] = localStorage.getItem(k)
    }
  } catch {}
  if (!data['hikayenglish.lgs.app.v1']) return location.replace(target + location.hash)
  const b64u = bytes => { let s = ''; for (const b of bytes) s += String.fromCharCode(b); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '') }
  const raw = new TextEncoder().encode(JSON.stringify({ data, hash: location.hash }))
  let enc
  if (typeof CompressionStream === 'function') {
    const gz = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer())
    enc = 'g' + b64u(gz)
  } else enc = 'r' + b64u(raw)
  location.replace(target + '#tasi=' + enc)
})()
</script>
</body>
</html>
