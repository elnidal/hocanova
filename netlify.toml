# ESKİ: uygulama artık Cloudflare'de (lgsingilizce.app). Netlify'daki hocanova sitesi yalnız app/migrate taşıma sayfasını sunar (npm run deploy:eski-adres).
[build]
  publish = "app/dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
