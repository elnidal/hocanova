# Hikayenglish LGS — Hikâye Motoru · DÜNYA
# Uygulamadan bağımsız, kalıcı hikâye evreni: dünya, karakterler, süreklilik kayıtları.
# Kaynak kısaltmaları: u01d03 = content/days/u01_day_03.yaml (s/c = hikâye/sahne satırı), SB1/SB2 = story_bible.md / story_bible_u02.md
# "kanon" = Ü1–Ü2 metinlerinde gerçekten geçti · "öneri" = henüz yazılmadı, season.yaml'daki plan; yazılınca kanona taşınır.
# Bu dosya yalnız yazılmış (status ≥ draft) günlerden sonra güncellenir; yazarlar buradakiyle çelişen olay yazamaz.

schema_version: 1
updated: 2026-10-15
canon_through: "Ü2 Gün 16"

world:
  city: İzmir
  city_note: >-
    Ü1–Ü2'de şehir adı yalnız bir kez geçti (Bora: "the best cake in İzmir", u01d03 s19); SB1 "şehir belirtilmez" diyordu.
    Motor bundan sonra İzmir'i açıkça kullanır (Ü7 Turizm için doğal zemin). İzmir'e aykırı ayrıntı yazılmaz (kar, kayak vb. şehirde değil).
