  - "Grubun türü: pop-rock uzlaşması; ilk şarkı 'pure rock' (Ü2 G4). Provalar cumartesi öğleden sonra Duru'nun evinde. Grup adı yalnız bir soru kökünde 'The Sleepy Cats' olarak geçti (u02d04, kesinleşmedi)."
  - "Kaan City Gym'e yazıldı (koç Cem Abi), pazartesi–çarşamba–cuma antrenman; 2 Aralık'ta okul basketbol takımı seçmeleri vardı — SONUCU HENÜZ YAZILMADI."
  - "Bora cumartesi sabahları karate (Gül Hanım), pazar doğa yürüyüşü sever; bireysel sporcu."
  - "Selin her gün 6.30'da kalkar; okula Ece'yle yürür; okul çıkışı babası 3.40'ta alır."
  - "Elif'in hayran olduğu şarkıcı kurmaca Luna Ray; konseri iptal oldu (Ü2 G15)."
  - "Ü2 G16 sunum: 40 öğrenciye soruldu; en rahatlatıcı etkinlik uyumak, en sevilen bilim kurgu; Kaan–Bora–Duru'nun grafiği ters yansıdı, Duru düzeltti."
