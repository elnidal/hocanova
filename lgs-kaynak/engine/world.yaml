  - "Bora'nın kendi bagetleri var: DrumStar'dan Star Sticks (indirimli, iade edilemez; kartı annesi kullandı). Davul seti hâlâ Ahmet Amca'nın."
  - "Ü5 G9: Elif'e kırıcı bir yorum geldi; grup cevap vermedi, raporladı, Murat Bey'e ve Elif'in annesine söyledi. Dünyadan destek geldi; Elif Kanadalı blogger/vlogger Mia ile (annesinin onayıyla, kişisel bilgi vermeden) arkadaş oldu."
