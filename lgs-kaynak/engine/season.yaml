  - unit: 3
    title: In the Kitchen
    status: yazildi
    month: "Aralık sonu–Ocak (yarıyıl tatilinden önceki haftalar)"
    days_estimate: "11 (yazıldı: u03_day_01…11)"
    items: 60
    items_file: lgs-pilot/content/unit_03_items.yaml
    item_themes: [pişirme yöntemleri (9), hazırlama fiilleri (17), tat ve lezzet (10), mutfak araçları ve ölçü (6), tarif dili (10), yemek kültürü ve ifadeler (8)]
    frame: >-
      Okulun "Küçük Şefler Yarışması" (İngilizce adı Junior Chef Contest): her takım bir ana yemek ve bir tatlıdan oluşan menü hazırlar,
      tarifi İngilizce tarif kartı olarak yazar (Murat Bey'in şartı) ve jüriye sunar. Takımlar: Ece–Selin–Elif / Kaan–Bora–Duru.
      Jüri: Murat Bey, kantinci teyze ve sürpriz bir konuk. Denemeler Ece'nin ve Duru'nun evinde, yetişkin gözetiminde.
    naming_note: "Türkçe anlatıda 'yemek yarışması/mutfak yarışması' DEME: 'yemek', 'mutfak', 'tatlı', 'önce/sonra' Ü3 birimlerinin karşılığı (rules.yaml R12 unit3_risk)."
    conflict: >-
      Ece takımı: Ece 'şapka pasta'nın intikamını almak için kusursuz katlı pasta ister; Selin tarife gram gram uyar; Elif doğaçlama yapar
      (fazla biber, tuz) → tarif kavgası. Kaan takımı: Kaan fırını ısıtmadan, süreyi beklemeden her şeyi aceleye getirir; Bora sorumluluk
      alır mı yine bahane mi bulur; Duru 'fark etmez' der ama menüyü kimse seçemeyince karar onda. Orta düğüm: provada Fıstık hamuru/peyniri yer.
      Kriz: yarışmadan bir gün önce Kaan takımının denemesi yanar, Ece takımının pastası çöker.
    arcs:
      kaan: "Açılışta seçme sonucu (öneri): basketbol takımına yedek olarak girdi. Ünite boyunca 'How long?' sorusunun cevabını öğrenir: zamanlayıcıyı kurar ve sabırla bekler (kantin kuyruğunda zorla beklemişti, u02d09; bu kez kendi seçimi). Final: fırın kapağını erken açmaz."
      bora: "Annesi sabahları erken çıktığı için kendi kahvaltısını yapmayı çoktan öğrenmiş: grubun gizli aşçısı (öneri, u01d13 s09 ile uyumlu). İlk kez bahane yerine 'Leave it to me' der; yanmış denemenin sorumluluğunu üstlenir."
      ece: "Pasta yine şapkaya benzer; bu kez ilk gülen kendisi olur: 'Şapka pasta' takımın maskotu olur. Mükemmeliyetçilikten ilk küçük adım."
      duru: "Menü kilitlenince 'fark etmez'i bırakır: 'No. We make my mum's dish.' — müzik türü dışındaki ilk net kararı (rock inadı Ü2 G4'te yazıldı). Tadına bakan, en iyi damak (taste-tester)."
      selin: "Tarifin dışına çıkmaz; finalde bir malzeme eksilince ilk kez doğaçlama yapar ve işe yarar."
      elif: "Mutfakta şarkı söyleyen doğaçlamacı; takımı uzlaştırır; Pamuk jürinin önüne fırlar (küçük kaos)."
    comedy_engine: "Kaan'ın acelesi × fırın süresi; Fıstık'ın zamanlaması; Ege'nin 'gurme' tavırları (simit/kruvasan geri dönüşü); kantinci teyzenin jüri ciddiyeti"
    side_characters: [Murat Bey (jüri), kantinci teyze (jüri), Ege (kendini 'gurme eleştirmen' ilan eden izleyici), Duru'nun annesi, Ece'nin annesi, Ahmet Amca (matkap yerine koku şikâyeti)]
    finale: >-
      Yarışma günü: Ece'nin pastası yine şapka gibi, ama tadı jüriyi büyüler; Kaan zamanlayıcıyı bekler, Bora'nın sade ev yapımı yemeği
      Ege'yi bile ikna eder ('OK… maybe homemade is pretty good' — Ü2 simit sahnesinin yankısı). İki takım da bir ödül alır
      (lezzet / takım çalışması); asıl sürpriz: kantinci teyze Bora'nın tarifini kantin menüsüne ekler. Ünite finali LGS soruları: tarif sıralama, menü tablosu.
    hook_next: "Kutlamada Duru ile Elif çalar; pastane sahibi videoyu görür ve 'bizde çalar mısınız?' diye arayacağını söyler — ama yarıyıl tatili başlıyor ve herkes dağılıyor."
    open_threads_closed: [OT1 (Kaan'ın seçme sonucu)]

