arcs:   # sezon boyu karakter yayları; ünite satırları bunları adım adım ilerletir
  kaan:  {from: "hep geç, hep acele", to: "LGS sabahı sınav binasının önünde herkesten önce", engine: "zamanlayıcı, alarm, otobüs, 'Me? Late? Never!'"}
  bora:  {from: "bahaneci ('Sorry, I can't')", to: "güvenilir ('Leave it to me' / sorumluluk alan)", engine: "olmayan kedi, felaket selfie, şık giyinme, dans"}
  ece:   {from: "mükemmeliyetçi planlayıcı", to: "kusuru kabul eden lider ('Mükemmel değil ama bizim')", engine: "plan defteri, şapka pasta, aşırı fotoğraf"}
  duru:  {from: "'It doesn't matter'", to: "kararlı ('It matters to me')", engine: "puf/kanepe, Fıstık, kuru espri, ani ciddiyet"}
