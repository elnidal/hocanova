# Hikayenglish LGS — Hikâye Motoru · SEZON PLANI (10 ünite, Eylül → Haziran LGS)
# Ü1–Ü2: yazıldı (kanon) · Ü3: havuz hazır, Story Bible bekliyor · Ü4–Ü10: kelime listesi yok → olaylar temaya uygun ama ESNEK.
# Kelime listesi gelince ünite satırı ayrıntılandırılır: olaylar birimlere göre değişebilir, karakter yayı ve kanon değişmez.
# Ay = hikâye içi zaman (okul takvimine paralel). Gün sayıları yalnız tahmin: tekil birim ÷ ~6.
# Dil oranı (Plan §5): Ü1–3 Türkçe anlatı + İngilizce konuşma · Ü4–7 konuşmalar ve mesajlar çoğunlukla İngilizce, anlatı Türkçe ve kısa · Ü8–10 metin büyük ölçüde İngilizce, LGS okuma düzeyi.

schema_version: 1
updated: 2026-10-15
