schema_version: 1
unit: 3
title: In the Kitchen
status: taslak
summary_tr: 'Ünite, bir yemeğin nasıl yapıldığını adım adım anlatmayı ve anlamayı öğretir. Sınav omurgası üç parçadır: (1) tarif fiilleri ve pişirme yöntemleri (peel, chop, slice, mix, pour, boil, fry,
  bake…), (2) süreç dili: emir kipi ve sıralama sözcükleri (First… Then… After that… Finally…), (3) tat sıfatları ve basit soru kalıpları (How much / How many / How long, Do you prefer … or …?). LGS bu
  üniteden genellikle bir tarif metni, karışık verilmiş adımlar, bir tercih tablosu ya da mutfakta geçen kısa bir diyalog verir; öğrenciden doğru sırayı, eksik adımı, metinde cevabı olmayan soruyu ya da
  uygun cevabı bulmasını ister. Yiyecek adları sınavda neredeyse hiç sorulmaz; asıl puan fiillerde, sıralamada ve soru kalıplarındadır.'
curriculum:
  outcomes:
  - code: E8.3.L1
    text_tr: 'Dinleme: Bir sürecin kısa, açık ve basit anlatımlarının ana fikrini anlar.'
  - code: E8.3.SI1
    text_tr: 'Karşılıklı konuşma: Bir şeyin nasıl yapıldığıyla ilgili konuda soru sorar, cevap verir, fikir ve bilgi alışverişinde bulunur.'
  - code: E8.3.SP1
    text_tr: 'Sözlü anlatım: Bir süreci basitçe anlatır.'
  - code: E8.3.R1
    text_tr: 'Okuma: Bir süreçle ilgili kısa metinlerin genel anlamını anlar.'
  - code: E8.3.R2
    text_tr: 'Okuma: Metindeki bilinmeyen sözcüklerin anlamını bağlamdan tahmin eder.'
  - code: E8.3.W1
    text_tr: 'Yazma: Bağlaçlar (first, then, finally…) kullanarak bir süreci anlatan basit ifade ve cümleler yazar.'
  functions:
  - id: F1
    name_tr: Basit süreçleri anlatma (Describing simple processes)
    exponents:
    - It's easy to make an omelette.
    - Let me tell you how to make an omelette.
    - First, put some oil into a pan and heat it.
    - Second, mix two eggs in a bowl. Then add some salt.
    - After that, add some cheese and milk.
    - Finally, pour the mixture into the hot pan.
    - Bake it for 30 minutes until it is golden.
    responses:
    - That sounds easy!
    - What do I do after that?
    - Sorry, can you repeat the second step?
    items:
    - U3-045
    - U3-052
    - U3-050
    - U3-048
    - U3-018
    - U3-020
    - U3-006
    - U3-041
    - U3-038
    - U3-001
    - U3-002
    - U3-004
    - U3-019
    - U3-022
    - U3-010
    lgs_weight: yüksek
    note_tr: Ünitenin ana işlevi. Programın örnek dili (useful language) omlet tarifi üzerinden kurulmuş. Sınavda karışık adımları sıralama, eksik adımı bulma ve tarif metninden bilgi çıkarma biçiminde
      gelir.
  - id: F2
    name_tr: Tercih belirtme (Expressing preferences)
    exponents:
    - Do you prefer cooking pizza or pasta?
    - I love cooking and eating pizza.
    - I usually prefer cooking pasta.
    - I prefer baked potatoes to fried ones.
    - I'm in the mood for something sweet.
    responses:
    - I prefer pasta. It's quicker.
    - Pizza, of course! I'm crazy about it.
    - I don't mind. Both are delicious.
    items:
    - U3-053
    - U3-058
    - U3-028
    - U3-030
    - U3-034
    - U3-035
    - U3-001
    - U3-004
    lgs_weight: orta
    note_tr: prefer (U1-018), like/love/enjoy + -ing ve be crazy about (Ü2) burada yemek bağlamında tekrar eder. Tercih tablosu (kim hangi pişirme yöntemini seviyor) sorularının dilidir. "Do you prefer
      A or B?" sorusuna "Yes, I do" cevabı yanlıştır.
  - id: F3
    name_tr: Basit soru sorma, bilgi isteme (Making simple inquiries)
    exponents:
    - Do I use two or three eggs?
    - What can I use to cook soup?
    - What should I use to cook soup?
    - How much sugar do I need?
    - How many eggs do we need?
    - How long does it take?
    - How long should I bake it?
    - Can I use butter instead of oil?
    responses:
    - Two eggs are enough.
    - You can use a saucepan.
    - About two tablespoons.
    - It takes about twenty minutes.
    - Bake it for half an hour.
    items:
    - U3-047
    - U3-042
    - U3-039
    - U3-041
    - U3-040
    - U3-048
    - U3-006
    lgs_weight: yüksek
    note_tr: 'Diyalog tamamlama sorularının çekirdeği. Cevaptaki bilgi türü (sayı / miktar / süre / araç) hangi soru kelimesinin gerektiğini söyler: "Three." → How many; "Two cups." → How much; "Twenty
      minutes." → How long; "A frying pan." → What … use.'
  - id: F4
    name_tr: Yemeği ve tadı değerlendirme (tamamlayıcı işlev)
    exponents:
    - This soup is too salty.
    - It tastes a bit sour.
    - Mmm, it's delicious! Can I have the recipe?
    - This dessert is worth trying.
    - I don't like fried food. It's too greasy.
    responses:
    - Thanks! It's my grandmother's recipe.
    - Really? I'll add some water then.
    - Have some more!
    items:
    - U3-027
    - U3-028
    - U3-029
    - U3-030
    - U3-031
    - U3-032
    - U3-033
    - U3-034
    - U3-035
    - U3-036
    - U3-059
    - U3-057
    lgs_weight: orta
    note_tr: Programda ayrı bir işlev olarak geçmiyor; ünitenin kelime listesindeki tat sıfatlarından türetilmiş tamamlayıcı başlıktır. Sınavda durum-tepki ve eş anlam sorularında tat sıfatları sık çeldirici
      olarak kullanılır.
