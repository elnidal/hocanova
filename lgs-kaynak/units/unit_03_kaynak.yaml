cross_unit:
- item: U3-053 be in the mood for
  links_to: U2-015 be crazy about · U2-016 be into · U2-007 like
  note_tr: 'Ü2''nin beğeni dili yemek bağlamında devam eder: ''I''m crazy about pizza, but today I''m in the mood for pasta.'''
- item: F2 Tercih belirtme
  links_to: U1-018 prefer
  note_tr: prefer Ü1'de öğretildi; burada 'prefer A to B' ve 'Do you prefer A or B?' kalıplarıyla yemek tercihlerinde tekrar eder.
- item: U3-058 have a sweet tooth
  links_to: U2-009 be fond of
  note_tr: '''I''m fond of sweets'' ile ''I have a sweet tooth'' aynı anlama gelir; eş anlam sorusunda birbirine bağlanabilir.'
- item: U3-034 spicy · U3-030 greasy
  links_to: U2-013 can't stand · U2-014 hate
  note_tr: 'Hoşlanmama dili: ''I can''t stand spicy food.'' ''I hate greasy chips.'''
- item: U3-057 enjoy your meal
  links_to: U1-097 full · U1-099 stuffed
  note_tr: 'Yemek sahnesinin kapanışı: ''Would you like some more?'' – ''No, thanks. I''m full / I''m stuffed!'''
- item: U3-028 delicious / tasty / yummy
  links_to: U1-022 Sounds + SIFAT
  note_tr: 'Tarif dinlerken tepki: ''Sounds delicious!'' ''Sounds yummy!'''
- item: U3-059 worth trying
  links_to: U2-079 recommend · U2-080 suggest
  note_tr: 'Tavsiye dili: ''I recommend the lentil soup. It''s worth trying.'''
- item: U3-039 cup · U3-042 teaspoon / tablespoon
  links_to: U2-089 all / most / half / a few / none
  note_tr: 'half Ü2''de grafik dili olarak öğretildi; burada ölçüde geçer: half a cup of milk, half a teaspoon of salt.'
- item: U3-045 first / then / finally
  links_to: U2-043 daily routine · U2-052 once / twice
  note_tr: Günlük rutin anlatımındaki sıralama burada sürece taşınır; 'stir twice', 'turn it once' gibi sıklık ifadeleri tarifte de geçer.
- item: F2 tercih tablosu
  links_to: U2-003 survey · U2-090 more than / less than / the most
  note_tr: 'Ü2''nin anket ve grafik dili yemek tercihi tablolarında aynen kullanılır: ''Most students prefer baked potatoes.'''
- item: U3-051 serve · expressions (Would you like some more?)
  links_to: U1-026 Would you like to …? · U1-017 offer
  note_tr: 'İkram etme = teklif dili: ''Would you like some dessert?'' Kabul/ret kalıpları Ü1''den gelir.'
- item: U3-050 recipe
  links_to: U1-043 share · U2-058 share on social media
  note_tr: '''Can you share the recipe?'' ''She shared her recipe on social media.'''
story_hooks:
