- situation_tr: Gün 2 önerisi · Kek denemesi. Ece, Ü1'de 'şapkaya benzeyen' pastanın rövanşını almak ister; grup kekin malzemelerini ölçer. Bir çay kaşığı kabartma tozu yerine yanlışlıkla bir yemek kaşığı
