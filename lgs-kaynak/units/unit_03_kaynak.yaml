  b: after
  note_tr: '+ V-ing: before cooking / after cooking'
traps:
- about: steam
  item: U3-008
  kind: cok_anlamli
  trap_tr: İsim olarak 'buhar', fiil olarak 'buharda pişirmek'. Öğrenci 'steamed fish'i 'buharlı balık' sanabilir.
  tip_tr: 'Tarif cümlesinde başta geliyorsa fiildir: Steam the vegetables = Sebzeleri buharda pişir (buğulama).'
- about: cover
  item: U3-012
  kind: cok_anlamli
  trap_tr: '''Kitap kapağı'' anlamı bilindiği için tarifte ''cover the pan'' yanlış anlaşılır.'
  tip_tr: Mutfakta cover = üstünü örtmek, kapağını kapatmak (cover with a lid).
- about: crack
  item: U3-013
  kind: cok_anlamli
  trap_tr: İsim 'çatlak', fiil 'kırmak'. 'Crack an egg' yumurtayı çatlatmak değil, kırıp içini dökmektir.
  tip_tr: Yumurtayla birlikte gördüğünde 'kır' diye çevir.
- about: season
  item: U3-021
  kind: cok_anlamli
  trap_tr: Herkes 'mevsim' olarak bilir; tarifte fiil olarak 'tuz, baharatla tatlandırmak' anlamındadır.
  tip_tr: '''Season with salt and pepper'' = tuz ve karabiberle tatlandır. Cümle başında ve ''with'' ile geliyorsa fiildir.'
- about: spread
  item: U3-023
  kind: cok_anlamli
  trap_tr: '''Yaymak'' anlamı bilinir; ekmeğe tereyağı, reçel ''sürmek'' de spread''dir. Bir kaynak ''dökmek'' vermiş: yanlış (dökmek = pour).'
  tip_tr: Kahvaltıda spread = sürmek; sıvı için pour.
- about: bitter / spicy / hot
  item: U3-027
  kind: turkce_etkisi
  trap_tr: Türkçede 'acı' hem kahvenin, ilacın acısı hem biberin acısıdır; İngilizcede ikiye ayrılır.
  tip_tr: Kahve, bitter çikolata, ilaç → bitter. Biber, acı sos → spicy / hot.
- about: sweet / dessert
  item: U3-035
  kind: turkce_etkisi
  trap_tr: Türkçede 'tatlı' hem tat sıfatı hem yemek sonrası yiyecektir; İngilizcede sweet sıfat, dessert isimdir.
  tip_tr: '''What''s for dessert?'' = Tatlı ne var? ''It''s too sweet'' = Fazla tatlı.'
- about: cup
  item: U3-039
  kind: cok_anlamli
  trap_tr: '''Fincan'' dışında tariflerde ölçü birimidir: a cup of flour = bir su bardağı (ölçü) un.'
  tip_tr: Malzeme listesinde 'cup' görürsen ölçü olarak oku; How much sorusunun cevabıdır.
- about: dish
  item: U3-056
  kind: cok_anlamli
  trap_tr: dish = yemek ya da tabak; 'do the dishes' ise bulaşık yıkamak.
  tip_tr: '''A traditional Turkish dish'' = geleneksel bir Türk yemeği; ''wash the dishes'' = bulaşık.'
- about: pepper
  item: U3-049
  kind: cok_anlamli
  trap_tr: pepper hem biber (sebze) hem karabiber (baharat). 'Salt and pepper' karabiberdir.
  tip_tr: green/red/bell pepper = biber; black pepper ya da salt and pepper = karabiber; chilli flakes = pul biber.
- about: a bunch of
  item: U3-037
  kind: cok_anlamli
  trap_tr: '''Bir demet'' (maydanoz, çiçek, üzüm salkımı) yanında gündelik dilde ''bir sürü'' anlamı da var: a bunch of friends.'
  tip_tr: Mutfakta demet/salkım; insanlarla gelirse 'bir sürü'.
- about: dice
  item: U3-010
  kind: cok_anlamli
  trap_tr: 'İsim olarak ''zar'' (oyun zarı) bilinir; tarifte fiil: küp küp doğramak.'
  tip_tr: 'Zar küp şeklindedir: dice the potatoes = patatesleri zar gibi küp küp doğra.'
- about: saucepan
  item: U3-041
  kind: kaynak_hatasi
  trap_tr: Bir kaynak 'saucepan = sos tavası' vermiş. Doğrusu saplı tencere.
  tip_tr: 'Sauce kelimesine aldanma: saucepan''de çorba da makarna da pişer.'
- about: taste
  item: U3-036
  kind: dilbilgisi
  trap_tr: taste hem isim (tat) hem fiil (tadına bakmak; tadı … olmak). 'It tastes good' yapısında sıfat gelir, zarf değil.
  tip_tr: It tastes delicious (✓) / It tastes deliciously (✗). Taste the soup = çorbanın tadına bak.
- about: How much / How many / How long
  item: U3-047
  kind: dilbilgisi
  trap_tr: Türkçedeki tek 'ne kadar' üç soruya ayrılır; seçeneklerde birbirinin yerine konur.
  tip_tr: Sayı → How many, miktar/fiyat → How much, süre → How long. Cevaba bakarak seç.
- about: dessert / desert
  item: U3-055
  kind: benzer_yazilis
  trap_tr: dessert (tatlı) ile desert (çöl) tek harfle ayrılır; okunuşları da farklıdır (dessert vurgusu ikinci hecede).
  tip_tr: 'Tatlıyı hep iki kez istersin: dessert''te iki s var.'
- about: flour / flower
  item: U3-046
  kind: benzer_yazilis
  trap_tr: flour (un) ve flower (çiçek) aynı okunur.
  tip_tr: Tarifte, kek ve ekmek bağlamında daima flour = un.
- about: recipe / receipt
  item: U3-050
  kind: benzer_yazilis
  trap_tr: recipe (tarif) ile receipt (fiş, makbuz) karışır; recipe üç hecelidir (/ˈres.ɪ.pi/).
  tip_tr: Recipe mutfakta, receipt kasada.
- about: cook / cooker
  kind: sahte_dost
  trap_tr: cooker 'aşçı' değildir; İngiliz İngilizcesinde ocak/fırınlı ocaktır. Aşçı = cook ya da chef.
  tip_tr: My mum is a good cook = Annem iyi aşçıdır. Turn off the cooker = Ocağı kapat.
- about: toast / tost
  kind: sahte_dost
  trap_tr: İngilizcede toast kızarmış ekmek dilimidir; Türkçedeki kaşarlı tost İngiltere'de 'toastie' ya da 'cheese toastie'dir. Bir kaynak 'toast = tost' vermiş.
  tip_tr: '''A slice of toast with butter'' = tereyağlı kızarmış ekmek.'
- about: kızartmak
  item: U3-004
  kind: turkce_etkisi
  trap_tr: 'Türkçedeki ''kızartmak'' İngilizcede dört fiile ayrılır: fry (yağda), roast (fırında, ateşte), grill (ızgarada), toast (ekmeği kızartmak).'
  tip_tr: 'Pişirme ortamını sor: yağ → fry, fırın → roast/bake, ızgara → grill.'
- about: karıştırmak
  item: U3-018
  kind: turkce_etkisi
  trap_tr: Türkçede 'karıştırmak' aynı zamanda 'birbirine karıştırmak, ayırt edememek' demektir; bu anlamda mix değil 'mix up' ya da 'confuse' kullanılır.
  tip_tr: Mix the eggs = yumurtaları karıştır. I always mix up these words = Bu kelimeleri hep karıştırırım.
- about: fırın
  item: U3-040
  kind: turkce_etkisi
  trap_tr: Türkçede 'fırın' hem mutfak fırını hem ekmek fırını (dükkân); İngilizcede oven ve bakery ayrıdır.
  tip_tr: Put it in the oven ↔ Buy bread from the bakery.
- about: tasty / tasteful
  item: U3-028
  kind: benzer_yazilis
  trap_tr: tasty yiyecek için 'lezzetli'; tasteful ise 'zevkli' (dekorasyon, kıyafet).
  tip_tr: Yemek tasty, ev tasteful olur.
- about: hot
  item: U3-034
  kind: cok_anlamli
  trap_tr: hot hem 'sıcak' hem 'acı (biber)' demektir; 'hot soup' bağlama göre sıcak ya da acı çorba olabilir.
  tip_tr: Kesinlik için acı = spicy, sıcak = hot / warm.
- about: bitter = çikolatalı
  item: U3-027
  kind: kaynak_hatasi
  trap_tr: 'Bir okul listesi ''bitter = çikolatalı'' vermiş. Türkçedeki ''bitter çikolata''dan gelen bir yanlış: bitter = acı (tat).'
  tip_tr: Bitter chocolate = bitter (acı) çikolata; bitter tek başına çikolata demek değildir.
- about: rice flour / cornstarch = mısır unu
  kind: kaynak_hatasi
  trap_tr: Bir kaynak 'rice flour' ve 'cornstarch' için 'mısır unu' yazmış. rice flour = pirinç unu; cornstarch = mısır nişastası (İngiliz İngilizcesinde cornflour).
  tip_tr: Yiyecek adları TANIMA düzeyinde; yine de yanlış karşılık ezberlenmesin.
- about: cranberry = yaban mersini
  kind: kaynak_hatasi
  trap_tr: Bir kaynak cranberry'yi 'yaban mersini' diye vermiş; yaban mersini blueberry'dir, cranberry turna yemişidir.
  tip_tr: 'Blue = mavi: blueberry mavi yaban mersini.'
- about: powdered sugar = toz şeker · tomato sauce = salça
  kind: kaynak_hatasi
  trap_tr: Görsel listede powdered sugar 'toz şeker', tomato sauce 'salça' verilmiş. powdered sugar = pudra şekeri (toz şeker = sugar / granulated sugar); salça = tomato paste, tomato sauce = domates sosu.
  tip_tr: Hikâyede kullanılırsa düzeltilmiş anlam kullanılmalı.
- about: pepper = pul biber · workshop = seminer · extract = aktarmak · warm = sıcak
  kind: kaynak_hatasi
  trap_tr: 'Okul listesinde: pepper ''pul biber'' (doğrusu biber/karabiber; pul biber = chilli flakes), workshop ''seminer'' (atölye), extract ''aktarmak'' (mutfakta öz, özüt: vanilla extract), warm ''sıcak''
    (ılık; serve warm = ılık servis edin).'
  tip_tr: Kaynak listeleri yalnız karşılaştırma içindir; hedef anlamlar items dosyasındakidir.
- about: dish / meal
  item: U3-056
  kind: cok_anlamli
  trap_tr: İkisi de "yemek" diye çevrilir.
  tip_tr: dish = tabakta sunulan yemek (a Turkish dish), meal = öğün (breakfast is the first meal). do the dishes = bulaşık yıkamak.
- about: put … into / add … to
  item: U3-061
  kind: dilbilgisi
  trap_tr: 'Fiil bilinir ama edat şaşırılır: "put it to the oven".'
  tip_tr: put + into/in (içine), add + to (-e). Sınavda en sık çıkan iki tarif fiili.
lgs_focus:
  what_is_tested:
  - Karışık verilen tarif adımlarını mantık ve sıralama sözcükleriyle doğru sıraya koyma (process order).
  - Tarif metninden bilgi çıkarma; metinde cevabı olmayan soruyu bulma (malzeme, miktar, süre, sunum).
  - Diyalog tamamlama - How much / How many / How long, should/can ile danışma soruları ve cevapları.
  - Tercih tablosu ya da grafiği okuma - kim hangi yemeği, hangi pişirme yöntemini tercih ediyor?
  - Görsel ya da tanım ile tarif fiilini eşleştirme (peel, slice, pour, grate, whisk…).
  - Tat sıfatları ve eş anlamlılar (delicious = tasty = yummy; greasy = oily).
  - Durum-tepki - yemek ikram edildiğinde, tarif istendiğinde, tat beğenilmediğinde ne söylenir?
  - Mesaj/not çıkarımı - anneden gelen 'yemeği hazırla' notunda yapılacak ve yapılmayacak işler.
  question_patterns:
  - type: process_order
    description_tr: Bir tarifin adımları karışık verilir (genelde 4-5 cümle); doğru sıra sorulur.
    sample_stem: Put the steps for making mashed potatoes in the correct order. I. Mash them with some butter and milk. II. Peel the potatoes and cut them into pieces. III. Boil them for twenty minutes.
      IV. Drain the water.
    sample_options:
    - II – III – IV – I
    - III – II – I – IV
    - II – IV – III – I
    - I – II – III – IV
    distractor_logic_tr: 'Çeldiriciler mantık zincirini bozar: süzmeden kaynatmak, soymadan pişirmek ya da son adımı (mash) başa almak. İlk adım çoğunlukla hazırlık fiilidir (peel, wash, preheat).'
    items:
    - U3-019
    - U3-002
    - U3-014
    - U3-017
    - U3-045
    - U3-052
  - type: dialogue_complete
    description_tr: Mutfakta geçen kısa diyalogda bir boşluk; cevaba uygun soru kalıbı seçilir.
    sample_stem: 'Selin: I want to make pancakes for breakfast. ______ Mum: Two are enough. Don''t forget to add a cup of milk.'
    sample_options:
    - How many eggs do I use?
    - How much sugar do I add?
    - How long should I cook them?
    - Which pan do you prefer?
    distractor_logic_tr: Hepsi tarifle ilgili geçerli sorulardır; yalnız biri cevaptaki 'Two are enough' (sayı, sayılabilen) bilgisine uyar. How much / How long en güçlü çeldiricilerdir.
    items:
    - U3-047
    - U3-039
  - type: gap_fill
    description_tr: Tarif cümlesinde fiil boşluğu; anlamca ve bağlamca uygun fiil seçilir.
    sample_stem: First, ______ the oven to 180°C. Then put the cake mixture into a pan and bake it for 35 minutes.
    sample_options:
    - preheat
    - peel
    - squeeze
    - freeze
    distractor_logic_tr: 'Çeldiriciler aynı temadan (tarif fiilleri) gelir ama nesneyle uyuşmaz: fırın soyulmaz, sıkılmaz, dondurulmaz. Öğrenciden fiil + nesne eşleşmesini (collocation) bilmesi beklenir.'
    items:
    - U3-006
    - U3-040
    - U3-019
    - U3-025
    - U3-003
  - type: synonym
    description_tr: Altı çizili sözcüğün eş anlamlısı ya da anlamı sorulur.
    sample_stem: 'Kaan: My grandma''s homemade lemonade is really tasty! Which word is closest in meaning to ''tasty''?'
    sample_options:
    - delicious
    - bitter
    - greasy
    - fresh
    distractor_logic_tr: Çeldiriciler aynı alandan tat sıfatlarıdır; fresh limonata için anlamlı olduğundan en güçlü çeldiricidir ama eş anlamlı değildir.
    items:
    - U3-028
    - U3-027
    - U3-030
    - U3-029
    - U3-031
  - type: situation
    description_tr: Bir durum anlatılır; karakterin ne söyleyeceği sorulur.
    sample_stem: Elif gives you a slice of her homemade cake. You taste it and love it. What do you say?
    sample_options:
    - Mmm, it's yummy! Can I have the recipe?
    - It's too salty for me, sorry.
    - Sorry, I can't. I have to study.
    - How long does it take to get there?
    distractor_logic_tr: Biri olumsuz tat yorumu (durumla çelişir), biri Ü1'den daveti reddetme kalıbı, biri bağlam dışı How long sorusu. Doğru cevap hem beğeniyi hem uygun bir tepkiyi içerir.
    items:
    - U3-028
    - U3-050
    - U3-031
    - U3-022
  - type: table_graph
    description_tr: Birkaç kişinin pişirme yöntemi ya da yemek tercihleri tablo (✓/✗) ile verilir; doğru ya da yanlış ifade sorulur.
    sample_stem: 'The table shows four friends'' favourite ways of cooking. Ece: bake ✓, fry ✗, grill ✗ · Kaan: bake ✗, fry ✓, grill ✓ · Bora: bake ✗, fry ✗, grill ✓ · Duru: bake ✓, fry ✗, grill ✓. According
      to the table, which of the following is true?'
    sample_options:
    - Ece and Duru both like baking.
    - Kaan doesn't like grilling.
    - Bora likes frying the most.
    - Nobody likes frying.
    distractor_logic_tr: Çeldiriciler tablodaki bir hücreyi ters okur ya da 'nobody / everybody / the most' gibi genellemelerle tuzak kurar. Her seçenek tek tek tabloyla karşılaştırılmalı.
    items:
    - U3-001
    - U3-004
    - U3-005
  - type: text_infer
    description_tr: Kısa bir tarif metni verilir; metinde cevabı olan ya da olmayan soru, ya da doğru bilgi sorulur.
    sample_stem: Grandma's Lentil Soup. Ingredients - one cup of red lentils, an onion, four cups of water, a teaspoon of pepper, salt. First, chop the onion and fry it in a saucepan. Then add the lentils
      and the water. Boil it for thirty minutes. Finally, season it with salt and pepper and serve it hot. Which question is NOT answered in the recipe?
    sample_options:
    - How many people does it serve?
    - How long do we boil the soup?
    - How much water do we need?
    - Do we serve it hot or cold?
    distractor_logic_tr: Yanlış şıklar metinde açıkça cevaplanan sorulardır (süre, miktar, sunum). Öğrenci metni tarar; kişi sayısı, sıcaklık ya da fiyat gibi verilmemiş bilgiyi bulur.
    items:
    - U3-050
    - U3-048
    - U3-010
    - U3-004
    - U3-041
    - U3-002
    - U3-021
    - U3-051
    - U3-045
    - U3-047
  - type: odd_one_out
    description_tr: Bir gruba uymayan sözcük sorulur (pişirme yöntemi / hazırlama fiili / tat sıfatı / araç).
    sample_stem: Which of the following is NOT a way of cooking?
    sample_options:
    - whisk
    - roast
    - steam
    - grill
    distractor_logic_tr: Hepsi mutfak fiilidir; ayırt edici olan ısı kullanılıp kullanılmadığıdır. whisk hazırlama fiilidir (çırpmak), diğerleri pişirme yöntemidir.
    items:
    - U3-026
    - U3-007
    - U3-008
    - U3-005
  - type: message_infer
    description_tr: Bir mesaj, not ya da e-posta verilir; yapılacak / yapılmayacak iş ya da yazarın amacı sorulur.
    sample_stem: Mum's note to Bora - Hi Bora, I'll be home late. Please boil the pasta for ten minutes and drain it. Don't add the sauce, I'll make it when I come. And don't forget to turn off the cooker!
      Love, Mum. What should Bora NOT do?
    sample_options:
    - Add the sauce to the pasta.
    - Boil the pasta.
    - Drain the pasta.
    - Turn off the cooker.
    distractor_logic_tr: 'Çeldiriciler notta istenen işlerdir. ''Don''t add'' ve ''don''t forget to'' ayrımı tuzaktır: ikincisi aslında yapılması istenen bir iştir.'
    items:
    - U3-002
    - U3-014
    - U3-045
  - type: dialogue_complete
    description_tr: Seçenekli tercih sorusuna uygun cevap seçilir.
    sample_stem: 'Duru: Do you prefer baked or fried potatoes? Selin: ______'
    sample_options:
    - Baked ones. Fried food is too greasy for me.
    - Yes, I do. I love potatoes.
    - Twice a week, I think.
    - In the oven for forty minutes.
    distractor_logic_tr: '''Yes, I do'' seçenekli soruya Yes/No cevabıdır; sıklık (Ü2) ve süre cevapları farklı soru türlerine aittir.'
    items:
    - U3-001
    - U3-004
    - U3-030
  priority_items:
  - U3-045
  - U3-047
  - U3-050
  - U3-048
  - U3-052
