- situation_tr: Gün 3 önerisi · Gizli aşçı. Takım Bora'nın kahvaltıda omlet yapamayacağını sanır; Bora (sabahları kendi kahvaltısını hazırlar) programın omlet tarifini adım adım, sakin sakin yapar. Asıl
