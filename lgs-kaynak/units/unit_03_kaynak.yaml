grammar:
- id: G1
  name_tr: Emir kipi (talimat verme)
  form: 'Fiil (yalın) + nesne · Olumsuz: Don''t + fiil · Kibar: Please + fiil'
  examples:
  - Peel the potatoes and cut them into small pieces.
  - Pour the milk into a bowl.
  - Don't open the oven door for the first 20 minutes.
  - Please pass me the salt.
  explain_tr: Tarifte özne yazılmaz; cümle doğrudan fiille başlar. Türkçedeki "Patatesleri soyun" yapısının karşılığıdır. Olumsuz talimat "Don't + fiil" ile kurulur. Aynı anlamda "You peel the potatoes…"
    da denebilir ama tariflerde emir kipi standarttır.
  common_errors:
  - wrong: Peeling the potatoes.
    right: Peel the potatoes.
    why_tr: Talimat -ing ile değil, fiilin yalın hâliyle verilir.
  - wrong: Not add salt.
    right: Don't add salt.
    why_tr: Olumsuz emir "Don't" ile kurulur; "not" tek başına cümle başına gelmez.
  - wrong: Don't to open the oven.
    right: Don't open the oven.
    why_tr: Don't'tan sonra "to" gelmez.
  - wrong: Peels the potatoes.
    right: Peel the potatoes.
    why_tr: Emir kipinde fiile -s eklenmez; özne yok.
  lgs_note: 'Sıralama ve eksik adım sorularındaki her seçenek bir emir cümlesidir. Cümlenin başındaki fiili tanımak (peel, boil, drain, serve) adımın tarifte nereye düştüğünü gösterir: hazırlık fiilleri
    başta, serve / enjoy sonda.'
  items:
  - U3-010
  - U3-012
  - U3-013
  - U3-014
  - U3-018
  - U3-019
  - U3-020
  - U3-022
  - U3-024
  - U3-051
- id: G2
  name_tr: Sıralama sözcükleri (sequencers) ve before / after / until
  form: First(ly) / Second(ly) → Then / Next / After that → Finally / Lastly · before / after + V-ing · until + cümle
  examples:
  - First, wash your hands. Then, chop the onions.
  - After that, fry them in a pan for five minutes.
  - Finally, serve the soup hot.
  - Wash the vegetables before cutting them.
  - Bake the cake until it is golden brown.
  explain_tr: 'Sıralama sözcükleri cümle başına gelir ve genelde virgülle ayrılır. First/Firstly ilk adımı, Finally/Lastly son adımı işaretler; Then, Next ve After that aradaki adımları bağlar ve birbirinin
    yerine kullanılabilir. before/after''dan sonra fiil gelirse -ing alır. until "-e kadar" demektir: Stir until it boils = Kaynayana kadar karıştır.'
  common_errors:
  - wrong: At last, serve the soup.
    right: Finally, serve the soup.
    why_tr: '"At last" uzun bir beklemenin sonunda gelen "nihayet" demektir; tarifteki son adım "Finally" ya da "Lastly" ile verilir.'
  - wrong: After boil the pasta, drain it.
    right: After boiling the pasta, drain it.
    why_tr: after/before'dan sonra fiil -ing alır (ya da tam cümle gelir - After you boil the pasta…).
  - wrong: After, add the salt.
    right: After that, add the salt.
    why_tr: '"After" tek başına zarf olarak cümle başına gelmez (Türkçedeki "Sonra, …" etkisi); "After that" ya da "Then" denir.'
  lgs_note: Sıralama sorularında önce "First" ve "Finally" içeren cümleyi bul, sonra mantık zincirini kur (soy → doğra → pişir → süz → servis et). "Then / Next / After that" tek başına sıra belirlemez;
    içerik mantığına bak (süzmeden önce kaynatmak gerekir).
  items:
  - U3-045
  - U3-052
  - U3-050
- id: G3
  name_tr: Süreç anlatımı kalıpları
  form: It's easy to make + yemek · Let me tell you how to make + yemek · You need + malzeme · It takes + süre
  examples:
  - It's easy to make a fruit salad.
  - Let me tell you how to make menemen.
  - You need three eggs, two tomatoes and a green pepper.
  - It takes about 15 minutes.
  - How do you make lemonade?
  explain_tr: Bir tarifi anlatırken önce yemeğin adı ve zorluğu (It's easy to make…), sonra malzemeler (You need… / Ingredients:), ardından adımlar ve süre verilir. "It takes + süre" yapısı Türkçedeki "…
    sürer" demektir; özne "it"tir, kişi değil.
  common_errors:
  - wrong: It is easy making a fruit salad.
    right: It's easy to make a fruit salad.
    why_tr: '"It''s easy" kalıbından sonra to + fiil gelir.'
  - wrong: I take 15 minutes to cook it. (kastedilen - pişirmesi 15 dakika sürer)
    right: It takes 15 minutes to cook it.
    why_tr: '"Sürmek" anlamında özne "it" olur.'
  - wrong: Tell me how can I make it.
    right: Tell me how I can make it.
    why_tr: Cümle içindeki soruda düz cümle sırası kullanılır.
  lgs_note: 'Tarif metni ve ilan sorularında başlık + malzeme listesi + adımlar düzenini tanımak, "Which question is NOT answered?" türü sorularda hız kazandırır: metinde süre, kişi sayısı ya da sıcaklık
    var mı diye tek tek kontrol edilir.'
  items:
  - U3-050
  - U3-048
  - U3-052
  - U3-047
- id: G4
  name_tr: How much / How many / How long
  form: How many + sayılabilen çoğul isim? · How much + sayılamayan isim? · How long + does it take / should I + fiil?
  examples:
  - How many eggs do we need? Three.
  - How much flour do I need? Two cups.
  - How long does it take? About forty minutes.
  - How long should I boil the eggs? For ten minutes.
  - How much is this cake? It's 50 lira.
  explain_tr: 'Türkçedeki "ne kadar" üç ayrı İngilizce soruya ayrılır: sayı için How many (kaç tane), miktar ya da fiyat için How much, süre için How long. How many''den sonra isim çoğul olur (eggs, tomatoes);
    How much''tan sonra isim tekil kalır (flour, milk, sugar).'
  common_errors:
  - wrong: How much eggs do we need?
    right: How many eggs do we need?
    why_tr: egg sayılabilir; sayılabilen isimler How many ile sorulur.
  - wrong: How many sugar do I add?
    right: How much sugar do I add?
    why_tr: sugar sayılamaz.
  - wrong: How much does it take? (süre sormak için)
    right: How long does it take? → Twenty minutes.
    why_tr: Süre How long ile sorulur; How much tek başına miktar ya da fiyat sorar ("How much time …?" doğrudur ama sınav kalıbı How long).
  - wrong: How many egg do we need?
    right: How many eggs do we need?
    why_tr: How many'den sonra isim çoğul olur.
  lgs_note: 'Diyalog tamamlamada boşluktan sonraki cevaba bak: sayı + çoğul isim → How many; ölçü + sayılamayan isim (two cups of flour) → How much; süre (for 20 minutes) → How long. Bu üç soru kalıbı birbirinin
    en güçlü çeldiricisidir.'
  items:
  - U3-047
  - U3-042
  - U3-039
- id: G5
  name_tr: Sayılabilen / sayılamayan isimler ve ölçü sözcükleri
  form: a/an + tekil sayılabilen · some/any + sayılamayan veya çoğul · ölçü + of + sayılamayan (a cup of flour, a slice of bread)
  examples:
  - Add an egg and some milk.
  - We need two cups of flour and a teaspoon of baking powder.
  - Is there any sugar in the cupboard?
  - Buy a bunch of parsley and a loaf of bread, please.
  - Put a slice of cheese on each piece of toast.
  explain_tr: 'Un, şeker, süt, tuz, su, tereyağı, ekmek, pirinç gibi sayılamayan isimler çoğul olmaz ve "a" almaz; sayıları ölçü sözcüğüyle verilir: a cup of, a glass of, a bowl of, a teaspoon/tablespoon
    of, a slice of, a piece of, a bunch of, a bottle of, a kilo of. Yumurta, domates, soğan gibi sayılabilen isimler doğrudan sayıyla kullanılır. some olumlu cümlede, any soru ve olumsuzda tercih edilir.'
  common_errors:
  - wrong: Add two flours.
    right: Add two cups of flour.
    why_tr: flour sayılamaz; ölçü sözcüğü gerekir.
  - wrong: a bread / breads
    right: a loaf of bread / a slice of bread / some bread
    why_tr: bread İngilizcede sayılamaz (Türkçede "iki ekmek" denir; Türkçe etkisi).
  - wrong: a bunch of parsleys
    right: a bunch of parsley
    why_tr: Sayılamayan isim ölçü sözcüğünden sonra da tekil kalır.
  - wrong: some informations / some advices
    right: some information / some advice
    why_tr: Türkçede sayılabilen bazı kavramlar İngilizcede sayılamaz; mutfak dışında da aynı kural.
  lgs_note: Malzeme listesi ve alışveriş notu sorularında "a cup of", "a teaspoon of" gibi ölçüler okunur; "How much" ile eşleşir. Boşluk doldurmada "a bunch of / a slice of / a cup of" seçenekleri isimle
    uyumuna göre elenir (a slice of bread, a bunch of grapes).
  items:
  - U3-037
  - U3-039
  - U3-042
  - U3-038
  - U3-022
  - U3-046
  - U3-043
- id: G6
  name_tr: Tercih belirtme (prefer, like/love + -ing)
  form: Do you prefer A or B? · I prefer A (to B) · I prefer + V-ing · like / love / enjoy + V-ing · be in the mood for + isim/V-ing
  examples:
  - Do you prefer cooking pizza or pasta?
  - I usually prefer cooking pasta.
  - I prefer grilled fish to fried fish.
  - I love baking cakes at the weekend.
  - I'm in the mood for some ice cream.
  explain_tr: '"A mı B mi?" sorusuna seçimle cevap verilir, Yes/No ile değil. Karşılaştırmalı tercihte prefer A to B kullanılır ("B''ye göre A''yı tercih ederim"). prefer, like, love, enjoy fiillerinden
    sonra eylem gelirse genellikle -ing kullanılır (Ü2 tekrarı).'
  common_errors:
  - wrong: Do you prefer pizza or pasta? — Yes, I do.
    right: Do you prefer pizza or pasta? — Pasta, please. / I prefer pasta.
    why_tr: Seçenekli soru Yes/No ile cevaplanmaz.
  - wrong: I prefer grilled fish than fried fish.
    right: I prefer grilled fish to fried fish.
    why_tr: prefer ile "than" değil "to" kullanılır.
  - wrong: I'm in the mood of pizza.
    right: I'm in the mood for pizza.
    why_tr: Kalıp "in the mood for"dur.
  lgs_note: Tablo sorularında tik/çarpı işaretinden "who prefers what" çıkarılır. Diyalogda "Do you prefer A or B?" sorusunun cevabı seçeneklerden biri olmalı; "Yes, I do" çeldiricisi sık kullanılır.
  items:
  - U3-053
  - U3-058
  - U3-001
  - U3-004
  - U3-005
- id: G7
  name_tr: Basit danışma soruları (should / can / Do I …?)
  form: What should/can I use to + fiil? · Should I + fiil? · Can I use A instead of B? · Do I use A or B?
  examples:
  - What should I use to cook soup? — Use a saucepan.
  - Should I add more salt? — No, it's salty enough.
  - Can I use olive oil instead of butter? — Yes, you can.
  - Do I use two or three eggs? — Three, if they're small.
  explain_tr: 'Tarif yaparken bilgi istemenin en basit yolları: should (yapmalı mıyım?), can (-ebilir miyim?) ve seçenekli "Do I use…?" soruları. instead of "yerine" demektir ve ardından isim gelir.'
  common_errors:
  - wrong: What should I use for cook soup?
    right: What should I use to cook soup?
    why_tr: Amaç "to + fiil" ile verilir; for'dan sonra fiil yalın gelmez.
  - wrong: Can I use olive oil instead butter?
    right: Can I use olive oil instead of butter?
    why_tr: Kalıp instead of'tur.
  - wrong: Should I to add sugar?
    right: Should I add sugar?
    why_tr: should'dan sonra to gelmez.
  lgs_note: Durum-tepki ve diyalog tamamlamada 'hangi soruyu sorar?' biçiminde gelir; cevaptaki araç/malzeme bilgisi soruyu belirler.
  items:
  - U3-041
  - U3-040
  - U3-038
  - U3-047
- id: G8
  name_tr: Geçmiş zaman ortacı sıfat olarak (boiled eggs, grated cheese) · tanıma düzeyi
  form: V3 (-ed / düzensiz) + isim · boiled, fried, grilled, roasted, mashed, grated, sliced, chopped, frozen, preheated
  examples:
  - I'd like two boiled eggs and some grated cheese.
  - Put the cake into a preheated oven.
  - Mashed potatoes are my favourite side dish.
  - We use frozen peas in this recipe.
  explain_tr: 'Tarif fiillerinin üçüncü hâli isimden önce sıfat gibi kullanılır ve "…ılmış/…ilmiş" anlamı verir: boiled egg = haşlanmış yumurta, fried potatoes = kızarmış patates, frozen = donmuş (freeze
    düzensizdir). Menülerde ve malzeme listelerinde çok sık görülür.'
  common_errors:
  - wrong: freezed vegetables
    right: frozen vegetables
    why_tr: freeze düzensiz fiildir (freeze – froze – frozen).
  - wrong: a boil egg
    right: a boiled egg
    why_tr: Sıfat görevinde -ed'li biçim kullanılır.
  lgs_note: Okuma metinlerinde ve menü/tablo sorularında tanımak yeterli; LGS bunu dilbilgisi sorusu olarak sormaz.
  items:
  - U3-002
  - U3-004
  - U3-005
  - U3-007
  - U3-017
  - U3-015
  - U3-003
  - U3-006
  - U3-022
  - U3-010
- id: G9
  name_tr: Geniş zaman edilgen (Simple Present Passive) · tanıma düzeyi
  form: isim + am/is/are + V3 (+ by / with / in …)
  examples:
  - Pasta is boiled in salty water.
  - Baklava is made with thin layers of dough, nuts and syrup.
  - Turkish coffee is served with a glass of water.
  - These cookies are baked at 180°C.
  explain_tr: 'Önemli olan işi yapan kişi değil, işin kendisi olduğunda kullanılır: "Makarna tuzlu suda haşlanır." Kültür metinlerinde (bir ülkenin yemeği nasıl yapılır, nasıl sunulur) sık geçer. 8. sınıf
    düzeyinde üretmek beklenmez; okuduğunu anlamak yeterlidir.'
  common_errors:
  - wrong: Pasta boils in salty water by the cook.
    right: Pasta is boiled in salty water.
    why_tr: Edilgen yapı be + V3 ile kurulur.
  - wrong: Turkish coffee is serve with water.
    right: Turkish coffee is served with water.
    why_tr: be'den sonra fiilin üçüncü hâli gelir.
  lgs_note: Programın örnek dilinde yer almaz; ancak yemek kültürü okuma metinlerinde (is made, is served, is cooked) görülebilir. Soru, yapının adını değil metnin anlamını sorar.
  items:
  - U3-051
  - U3-054
  - U3-002
  - U3-001
expressions:
- en: Enjoy your meal!
  tr: Afiyet olsun!
  use: Yemek sunulurken ya da yemeğe başlanırken; garson, ev sahibi ya da masadaki biri söyler.
  reply:
  - Thank you!
  - Thanks, you too!
  item: U3-057
  register: nötr
- en: Bon appétit!
  tr: Afiyet olsun! (Fransızcadan)
  use: Yemeğe başlarken; biraz daha şık ya da şakacı bir ton.
  reply:
  - Thank you!
  - Bon appétit!
  item: U3-057
  register: nötr
- en: Help yourself.
  tr: Buyurun, kendiniz alın.
  use: Ev sahibi misafire masadaki yemekten istediği kadar almasını söylerken.
  reply:
  - Thanks, it looks delicious!
  register: gündelik
- en: Would you like some more?
  tr: Biraz daha ister misin?
  use: Ev sahibi tabağı biten misafire sorar.
  reply:
  - Yes, please. It's delicious!
  - No, thanks. I'm full.
  register: nötr
- en: Can I have the recipe?
  tr: Tarifini alabilir miyim?
  use: Beğenilen bir yemekten sonra yapan kişiye iltifat olarak.
  reply:
  - Of course! It's really easy.
  - Sorry, it's a family secret!
  item: U3-050
  register: gündelik
- en: It's easy to make. Let me tell you how.
  tr: Yapması kolay. Nasıl yapıldığını anlatayım.
  use: Tarif anlatmaya başlarken.
  reply:
  - Great, I'm listening.
  - Wait, let me get a pen!
  item: U3-045
  register: nötr
- en: What are the ingredients?
  tr: Malzemeler neler?
  use: Bir tarif öğrenirken ilk soru.
  reply:
  - You need flour, eggs, milk and sugar.
  item: U3-048
  register: nötr
- en: How long does it take?
  tr: Ne kadar sürer?
  use: Hazırlık ya da pişirme süresini sorarken.
  reply:
  - About half an hour.
  - It takes twenty minutes in the oven.
  item: U3-047
  register: nötr
- en: I'm in the mood for pizza.
  tr: Canım pizza istiyor.
  use: Ne yemek istediğini söylerken; arkadaşlar ve aile arasında.
  reply:
  - Me too! Let's order one.
  - Again? We had pizza yesterday!
  item: U3-053
  register: gündelik
- en: I have a sweet tooth.
  tr: Tatlıya düşkünümdür.
  use: Tatlıyı çok sevdiğini söylerken (deyim; kelimesi kelimesine "tatlı diş" değildir).
  reply:
  - Me too! Let's get some baklava.
  - No wonder you love chocolate!
  item: U3-058
  register: gündelik
- en: It's worth trying.
  tr: Denemeye değer.
  use: Bir yemeği, restoranı ya da tarifi tavsiye ederken.
  reply:
  - OK, I'll try it.
  - Really? It looks strange!
  item: U3-059
  register: nötr
- en: Mmm, yummy!
  tr: Mmm, nefis!
  use: Bir şeyi tadınca; çocuksu ve samimi.
  reply:
  - I told you!
  - Have some more!
  item: U3-028
  register: gündelik
- en: It's too salty / sweet / spicy for me.
  tr: Benim için fazla tuzlu / tatlı / acı.
  use: Tadı fazla bulduğunu kibarca söylerken; too olumsuz anlam taşır.
  reply:
  - Oh, sorry! Have some water.
  - Next time I'll add less salt.
  item: U3-032
  register: nötr
- en: Serve hot. / Serve cold.
  tr: Sıcak servis edin. / Soğuk servis edin.
  use: Tarifin son satırında ya da paket üzerinde.
  item: U3-051
  register: resmi
- en: It's a piece of cake.
  tr: Çocuk oyuncağı, çok kolay.
  use: Bir işin çok kolay olduğunu söylerken (deyim; mutfakla ilgisi yok).
  reply:
  - Easy for you to say!
  register: gündelik
- en: It's not my cup of tea.
  tr: Bana göre değil, pek sevmem.
  use: Bir şeyden hoşlanmadığını kibarca söylerken (deyim).
  reply:
  - Really? I love it!
  item: U3-039
  register: gündelik
- en: Too many cooks spoil the broth.
  tr: 'Bir işe çok kişi karışırsa iş bozulur. (Türkçe yakın karşılık: Horozu çok olan köyde sabah geç olur.)'
  use: Herkes aynı işe karışınca, şakayla.
  register: gündelik
