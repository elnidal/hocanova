  b: stale
  note_tr: taze ↔ bayat (ekmek, kek); meyve için 'rotten' (çürük)
- a: homemade
  b: shop-bought / ready-made
  note_tr: ev yapımı ↔ hazır, dükkândan alınmış
- a: raw
  b: cooked
  note_tr: çiğ ↔ pişmiş
- a: sweet
  b: sour / bitter / salty
  note_tr: tatlıya tek bir zıt yok; tat bağlamına göre değişir
- a: spicy
  b: mild
  note_tr: acılı ↔ acısız, hafif
- a: healthy
  b: unhealthy
