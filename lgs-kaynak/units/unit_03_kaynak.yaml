  difference_tr: Üçü de 'lezzetli'. delicious en güçlü ve en yaygın olanı; tasty nötr; yummy çocuksu ve samimi (arkadaşa, aileye).
  items:
  - U3-028
- words:
  - greasy
  - oily
  - fatty
  difference_tr: 'greasy olumsuz: fazla yağlı, yağ içinde (greasy chips). oily: sıvı yağ içeren (oily fish). fatty: hayvansal yağı çok olan (fatty meat).'
  items:
  - U3-030
- words:
  - mix
  - stir
  - blend
  - combine
  - whisk
  difference_tr: 'mix genel ''karıştırmak''. stir: kaşıkla döndürerek karıştırmak (çorba, çay). blend: blenderda pürüzsüz hâle getirmek. combine: malzemeleri bir araya getirmek. whisk: hızla çırpmak (yumurta,
    krema).'
  items:
  - U3-018
  - U3-011
  - U3-026
- words:
  - cut
  - chop
  - dice
  - slice
  difference_tr: 'cut genel ''kesmek''. chop: iri, düzensiz parçalara doğramak. dice: küçük küpler. slice: ince, düz dilimler (ekmek, domates).'
  items:
  - U3-010
  - U3-022
- words:
  - pan
  - frying pan
  - saucepan
  - pot
  difference_tr: 'pan / frying pan: tava. saucepan: saplı, kapaklı tencere (sos tavası değil). pot: büyük, iki kulplu tencere.'
  items:
  - U3-041
- words:
  - taste
  - flavour
  difference_tr: 'taste: tat duyusu ve genel tat (It has a sweet taste); ayrıca fiil ''tadına bakmak''. flavour: belirli bir aroma (strawberry flavour). flavour İngiliz, flavor Amerikan yazımı.'
  items:
  - U3-036
- words:
  - meal
  - dish
  - course
  difference_tr: 'meal: öğün (breakfast, lunch, dinner). dish: tek bir yemek ya da tabak. course: menünün bölümü (main course, dessert).'
  items:
  - U3-056
  - U3-060
- words:
  - bake
  - roast
  difference_tr: 'İkisi de fırında pişirmek. bake: kek, ekmek, kurabiye gibi hamur işleri. roast: et, tavuk, sebze; ayrıca ateşte kavurmak (roasted chestnuts).'
  items:
  - U3-001
  - U3-007
- words:
  - boil
  - steam
  difference_tr: 'boil: suyun içinde kaynatmak, haşlamak. steam: suyun buharında pişirmek (buğulama).'
  items:
  - U3-002
  - U3-008
opposites:
- a: freeze
  b: melt
  note_tr: dondurmak ↔ eritmek
