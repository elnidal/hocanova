mini_lessons:
- type: hafiza_kancasi
  text_tr: 'dessert mi desert mi? Tatlıyı hep iki kez istersin: dessert''te iki ''s'' var. Tek s''li desert çöldür.'
  refs:
  - U3-055
- type: hafiza_kancasi
  text_tr: 'dice''ın bir anlamı da ''zar''. Zar küp şeklindedir: dice the potatoes = patatesleri zar gibi küp küp doğra.'
  refs:
  - U3-010
- type: hafiza_kancasi
  text_tr: 'flour (un) ile flower (çiçek) aynı okunur. Tarifteyse hep un: pastaya çiçek koymuyoruz!'
  refs:
  - U3-046
- type: mini_dilbilgisi
  text_tr: 'Ne kadar? üçe ayrılır: How many eggs (kaç tane), How much milk (ne kadar miktar), How long (ne kadar süre). Cevaba bak, soruyu bul.'
  refs:
  - U3-047
- type: mini_dilbilgisi
  text_tr: 'Tarifte özne yok, fiil başta: ''Peel the potatoes.'' Olumsuzu ''Don''t'': ''Don''t open the oven!'''
  refs:
  - U3-019
  - U3-040
- type: tuzak
  text_tr: 'Son adım ''Finally'' ya da ''Lastly'' ile gelir. ''At last'' tarifte değil, uzun beklemenin sonunda kullanılır: ''At last, the pizza is here!'''
  refs:
  - U3-045
- type: kelime_ailesi
  text_tr: '-y eki isimden tat sıfatı yapar: salt → salty, spice → spicy, taste → tasty, oil → oily, grease → greasy, fat → fatty, yum → yummy.'
  refs:
  - U3-032
  - U3-034
  - U3-028
  - U3-030
- type: kelime_ailesi
  text_tr: 'pre- ''önceden'' demektir: preheat = önceden ısıtmak. Aynı ek: preview (ön izleme), prepare (hazırlamak).'
  refs:
  - U3-006
- type: tuzak
  text_tr: 'Türkçedeki ''acı'' İngilizcede ikiye ayrılır: kahve, ilaç bitter; biber, sos spicy ya da hot.'
  refs:
  - U3-027
  - U3-034
- type: tuzak
  text_tr: '''Kızartmak'' dört fiil: yağda fry, fırında roast, ızgarada grill, ekmeği toast. Kızartmanın ortamını düşün.'
  refs:
  - U3-004
  - U3-007
  - U3-005
- type: tuzak
  text_tr: cooker aşçı değil, ocaktır! Aşçı cook ya da chef. 'My dad is a great cook.'
  refs:
  - U3-040
  - U3-041
- type: mini_dilbilgisi
  text_tr: 'Un, şeker, süt sayılmaz; ölçüyle sayılır: a cup of flour, a teaspoon of sugar, a glass of milk. ''Two flours'' yok!'
  refs:
  - U3-039
  - U3-042
  - U3-046
- type: ilginc_bilgi
  text_tr: tsp = teaspoon (yaklaşık 5 ml), tbsp = tablespoon (yaklaşık 15 ml). Yani 1 yemek kaşığı ≈ 3 çay kaşığı. İngilizce tariflerde bu kısaltmalar çok kullanılır.
  refs:
  - U3-042
- type: lgs_taktigi
  text_tr: 'Sıralama sorusu: önce First ve Finally cümlelerini bul, sonra ''süzmeden önce kaynatmak gerekir'' gibi mantık zinciriyle ortayı diz. İlk adımı farklı şıkları hemen ele.'
  refs:
  - U3-045
  - U3-052
- type: lgs_taktigi
  text_tr: '''Do you prefer A or B?'' sorusuna ''Yes, I do'' cevabı tuzaktır. Seçenekli soruya seçimle cevap verilir: ''B, because…'''
  refs:
  - U3-053
- type: hafiza_kancasi
  text_tr: have a sweet tooth kelimesi kelimesine 'tatlı bir dişim var' değil, 'tatlıya düşkünüm' demektir. Tatlıyı çok seven bir dişin olduğunu hayal et.
  refs:
  - U3-058
- type: ilginc_bilgi
  text_tr: cuisine Fransızcadan gelir ve 'kuizin' (/kwɪˈziːn/) diye okunur. Turkish cuisine = Türk mutfağı (yemek kültürü); evdeki mutfak odası ise kitchen.
  refs:
  - U3-054
- type: ilginc_bilgi
  text_tr: Türk kahvesi kültürü ve geleneği 2013'te UNESCO İnsanlığın Somut Olmayan Kültürel Mirası listesine girdi. Okuma metinlerinde 'Turkish coffee is served with a glass of water' gibi edilgen cümlelerle
    karşına çıkabilir.
  refs:
  - U3-054
  - U3-051
- type: tuzak
  text_tr: recipe (tarif, 're-si-pi' diye üç hece) ile receipt (fiş, makbuz) karışmasın. Recipe mutfakta, receipt kasada.
  refs:
  - U3-050
- type: kelime_ailesi
  text_tr: homemade = ev yapımı, handmade = el yapımı. Ev yapımı reçel homemade, el örgüsü kazak handmade.
  refs:
  - U3-031
open_questions:
- 'Kazanım kodları ve metinleri: E8.3.R1, E8.3.R2 ve E8.3.W1 bir 2024/2025 MEB ortak yazılı dağılım tablosunda (Sakarya ÖDM) doğrulandı. E8.3.L1, E8.3.SI1 ve E8.3.SP1 yalnız bir okulun 2017-2018 yıllık
  planında görüldü; resmî 2018 öğretim programı PDF''inin 8. sınıf bölümüne erişilemedi (mufredat.meb.gov.tr kopyası kesik geldi). Resmî metinle karşılaştırılmalı.'
- İşlevler (Describing simple processes, Expressing preferences, Making simple inquiries) ve F1-F3 exponent'lerindeki omlet örnekleri aynı 2017-2018 yıllık plandan alındı; 2015-2016 eski programda (Unit
  3 Cooking) da aynı üç işlev vardı. Resmî 2018 programın 'useful language' bölümüyle birebir kontrol edilmedi.
- F4 (Yemeği ve tadı değerlendirme) programda ayrı bir işlev olarak bulunamadı; kelime listesinden türetilmiş tamamlayıcı başlık olarak eklendi. Editör kaldırabilir.
- Simple Present Passive (G9) programın örnek dilinde görülmedi; görev tanımı gereği tanıma düzeyinde eklendi. Ders kitabında geçip geçmediği kontrol edilmeli.
- LGS'de bu üniteden yıllara göre soru sayısı yalnız bir üçüncü taraf sitede bulundu (2020 - 2, 2021 - 2, 2022 - 1, 2023 - 2, 2024 - 1); MEB kaynağıyla doğrulanmadı, 2025 verisi yok. Plan gereği çıkmış
  soru analizi (lgs_seen) ayrıca yapılmalı.
- 'Havuz çalışma kitabındaki HEDEF sayfası openpyxl ile okunduğunda yalnız başlık satırı geldi (formül/önbellek değeri yok); öğretim birimleri items dosyasından alındı. ÇEKİRDEK havuz satırı 49, items dosyasında
  core sınıfı 42 birim: fark, araç/aile birleştirmesinden geliyor (7 birleştirme).'
- Items dosyasında U3-036 varyantı Amerikan yazımıyla 'flavor', display ise İngiliz yazımıyla 'taste / flavour'. Program kaynakları 'flavor' yazıyor; uygulama eşleştirmesinde iki yazım da kabul edilmeli.
- 'Editör kararı için aday birimler: ''raw'' (çiğ), ''remove'', ''until'' ve ''cooker/stove'' TANIMA''da; LGS okuma metinlerinde geçebilirler. ''a piece of cake'' deyimi kaynaklarda yok, yalnız expressions''a
  eklendi.'
