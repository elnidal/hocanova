- situation_tr: 'Ege''nin kibarsızlığı: Ege, konser salonunu kendi adına arar, ''Who are you?'' diye başlar, sekreter onu bekletir ve bir türlü bağlamaz.'
  items:
  - U4-052
  - U4-007
  - U4-012
  - U4-031
  comedy_tr: Ece aynı numarayı arar, 'This is Ece calling. Could you put me through, please?' der ve hemen bağlanır.
- situation_tr: 'Konser akşamı: telefonlar sessize alınır; Kaan''ın telefonu en sessiz şarkıda çalar ve ekranda ''Wrong number?'' yazan bilinmeyen numara görünür.'
  items:
  - U4-013
  - U4-032
  - U4-006
  - U4-050
  comedy_tr: 'Arayan, Gün 4''teki teyzedir: ''I''m at the door, where is the concert?'''
mini_lessons:
- type: hafiza_kancasi
  text_tr: hang + up = yukarı astım, bitti (kapat) · hang + on = bekle, devam · hang + out = dışarı, takıl (Ü2).
  refs:
  - U4-006
  - U4-007
- type: tuzak
  text_tr: engaged telefonda 'meşgul'; parmağında yüzükle 'engaged' olan biri ise nişanlı. Telefonda The line is engaged = The line is busy.
  refs:
  - U4-016
- type: tuzak
  text_tr: extension yalnız 'uzatma' değil; iş yerlerinde 'dahili numara'. 'Extension 214, please.' = 214'e bağlar mısınız?
  refs:
  - U4-017
- type: mini_dilbilgisi
  text_tr: 'Telefonda ''Ben Ali'' = ''This is Ali.'' Aranan kişinin kendisiysen: ''Speaking.'' (Benim.)'
  refs:
  - U4-031
- type: mini_dilbilgisi
  text_tr: 'Zamir ortaya girer: call ME back, put YOU through, pick IT up. ''call back me'' yanlış.'
  refs:
  - U4-001
  - U4-012
  - U4-011
- type: mini_dilbilgisi
  text_tr: 'Telefon çaldı, karar şimdi: I''ll take that! Önceden plan: I''m going to call Grandma on Sunday.'
  refs:
  - U4-022
  - U4-029
- type: lgs_taktigi
  text_tr: 'Telefon diyaloğunda rol bul: ''Can I take a message?'' telefonu açanın, ''Can I leave a message?'' arayanın cümlesi.'
  refs:
  - U4-009
- type: lgs_taktigi
  text_tr: 'Memo sorusunda üç soru sor: Kim aradı? Kimi aradı? Ne istedi? Şıkların çoğu bu üçünden birini ters çevirir.'
  refs:
  - U4-010
  - U4-001
- type: tuzak
  text_tr: 'I''m afraid her zaman korku değildir: ''I''m afraid he isn''t available.'' = Maalesef müsait değil.'
  refs:
  - U4-023
- type: kelime_ailesi
  text_tr: call → caller (arayan) · send → sender (gönderen) · receive → receiver (alıcı; ahize). -er eki 'yapan kişi/alet' yapar.
  refs:
  - U4-002
  - U4-018
- type: kelime_ailesi
  text_tr: 'understand → misunderstand → misunderstanding. mis- = yanlış: misspell (yanlış yazmak), misunderstand (yanlış anlamak).'
  refs:
  - U4-051
- type: kelime_ailesi
  text_tr: polite ↔ impolite; available ↔ unavailable. im-/un- olumsuz yapar.
  refs:
  - U4-052
  - U4-014
- type: tuzak
  text_tr: return a product = iade; return ticket = gidiş-dönüş. 'Return' gördüğünde nesnesine bak.
  refs:
  - U4-041
- type: hafiza_kancasi
  text_tr: 'book bir kitapsa okunur, bir oda ise ayırtılır: book a room, book a table, book a ticket.'
  refs:
  - U4-035
- type: ilginc_bilgi
  text_tr: Türkiye'de tek acil çağrı numarası 112'dir; polis, ambulans ve itfaiye aynı numaradan ulaşılır (dial 112).
  refs:
  - U4-005
- type: ilginc_bilgi
  text_tr: Telefonun patenti 1876'da Alexander Graham Bell adına alındı; ilk telefon konuşması da aynı yıl yapıldı.
  refs:
  - U4-047
- type: lgs_taktigi
  text_tr: '''then'' ile biten cümle bir karardır: ''We''ll meet at six, then.'' Sıralama sorusunda son satırlara yakışır.'
  refs:
  - U4-029
- type: mini_dilbilgisi
  text_tr: 'Mesaj ilet: tell/ask + kişi + TO + fiil. ''Could you tell him to call me?'' Olumsuz: ''tell her not to be late''.'
  refs:
  - U4-009
  - U4-001
- type: hafiza_kancasi
  text_tr: 'call center (Amerikan yazımı) = call centre (İngiliz yazımı). İkisi de aynı: çağrı merkezi.'
  refs:
  - U4-036
open_questions:
- '''Sorry, wrong number.'' hiçbir kaynakta yok (yalnız Claude önerisi); öncelik 2 olarak eklendi. Kullanıcı tutmak istiyor mu?'
- Bilet ayrıntıları (single/return ticket, departure/arrival time, ticket price) Ü7 Tourism'e, social networks/security risks/application ayrıntısı Ü5 The Internet'e bırakıldı. Bu ertelemeler onaylanıyor
  mu?
- urgent/emergency ve arrange tek kaynak olduğu için TANIMA'ya indi; 'It's urgent' telefon dilinde doğal. Tekrar öğretim birimi yapılsın mı?
- MEB programının kelime listesinde 'hold line' yazıyor; doğal kullanım 'hold the line'. Ünitede bu biçimde verildi.
- Kırklareli İl MEM soru dağılım tablosunda E8.4.R1 için '1 2 1 2 2 1', E8.4.W1 için '1 1 1 1' rakamları etiketsiz; hangi sınav/dönem sütunları olduğu doğrulanamadı. Bu ünitenin geçmiş LGS'lerde kaç soruyla
  geldiği de doğrulanmadı.
- Güncel MEB Yayınları ders kitabının (W2) baskı yılı egitimsistem.com sayfasından doğrulanamadı; içerik okuma metinleri (burglary, misunderstanding, low battery) güncel kitaba göre yeniden kontrol edilmeli.
- Gün gruplaması önerisi konser omurgasına dayanıyor (world.yaml OT4–OT6); Story Bible u04 yazılınca pilot_day alanları items dosyasına işlenecek.
