schema_version: 1
unit: 4
title: On the Phone
status: taslak
summary_tr: 'Ünite, telefonda konuşmanın baştan sona akışını öğretir: arayanın kendini tanıtması ve birini istemesi (This is … / May I speak to …?), bekletme ve bağlama (Hold on / Hang on, I''ll put you
  through), kişiye ulaşılamaması (I''m afraid he isn''t available at the moment), mesaj bırakma ve alma (Would you like to leave a message?), geri dönüş sözü (I''ll call you back / I''ll get back to you)
  ve konuşmayı kapatma. Programın ikinci işlevi konuşma anında verilen karardır (The phone rings — I''ll take that. / We''ll meet at the café, then.): ünitenin taşıdığı dilbilgisi, ani karar bildiren will''dir.
  Üçüncü ayak çağrı merkezi ve randevu dilidir: şikâyet, iade, teslimat, rezervasyon, onaylama. LGS''de bu ünite en çok diyalog tamamlama (boşluğa uygun telefon cümlesi), telefon notu / mesaj çıkarımı ve
  konuşma cümlelerini sıraya koyma olarak beklenir; engaged, extension, available, hold on, put through gibi telefon anlamı Türkçeden farklı olan sözcükler şıklarda belirleyicidir.'
curriculum:
  outcomes:
  - code: E8.4.L1
    text_tr: 'Dinleme: Telefon konuşmasıyla ilgili ifadeleri ve kelimeleri tanır.'
  - code: E8.4.L2
    text_tr: 'Dinleme: Bir telefon konuşmasını takip eder.'
  - code: E8.4.SI1
    text_tr: 'Karşılıklı konuşma: Soru sorup cevaplayarak basit bir telefon görüşmesi yapar.'
  - code: E8.4.SP1
    text_tr: 'Sözlü anlatım: Konuşma sırasında verdiği kararları ifade eder.'
  - code: E8.4.R1
    text_tr: 'Okuma: İlgili kelimeleri içeren kısa ve basit metinleri anlar. (LGS''de doğrudan ölçülen ana kazanım)'
  - code: E8.4.W1
    text_tr: 'Yazma: Kısa ve basit konuşmalar (diyaloglar) yazar.'
  functions:
  - id: F1
    name_tr: Telefon konuşmasını başlatmak, kendini tanıtmak ve birini istemek (Following phone conversations)
    exponents:
    - Hello! This is Ece calling. Is Duru in?
    - May I speak to Mr Demir, please?
    - Could I speak to the manager, please?
    - Is Selin there?
    - Hello, City Concert Hall. How can I help you?
    - Who's calling, please?
    responses:
    - Speaking. (Benim.)
    - Yes, just a moment. I'll get her.
    - Who's calling, please?
    - I'm afraid she isn't available at the moment.
    - Sorry, you've got the wrong number.
    items:
    - U4-031
    - U4-026
    - U4-011
    - U4-013
    - U4-002
    - U4-020
    - U4-032
    - U4-042
    lgs_weight: yüksek
    note_tr: Programın 'Useful Language' örneklerinin ilk satırları bu işlevdir (This is … calling, is … in? / May I speak to …? / Is … there?). Telefonda kendini 'I am …' ile değil 'This is …' ile tanıtmak
      sınanır.
  - id: F2
    name_tr: Bekletmek ve bağlamak (Holding and putting through)
    exponents:
    - Can you hold on a moment, please?
    - Hang on a minute; I'll get him.
    - Just a minute, please.
    - I'll put you through to the sales department.
    - Can you put me through to extension 214, please?
    - Please hold the line.
    responses:
    - Sure, I'll hold.
    - Thank you.
    - Sorry, the line is engaged. Would you like to hold?
    items:
    - U4-007
    - U4-012
    - U4-017
    - U4-016
    - U4-042
    - U4-003
    lgs_weight: yüksek
    note_tr: Programın kelime listesinde hang on, hold (the) line, put someone through, extension, engaged, connect birlikte geçer. Sekreter–arayan diyalogları bu işlevin tipik bağlamıdır.
  - id: F3
    name_tr: Kişiye ulaşılamaması; mesaj bırakmak ve almak (Taking and leaving messages)
    exponents:
    - I'm afraid he is not available at the moment. He has gone out.
    - Sorry, she's on the other line.
    - Would you like to leave a message?
    - Can I take a message?
    - Could you tell him to call me back, please?
    - Can you ask her to get back to me as soon as possible?
    responses:
    - Yes, please. Could you tell him that the rehearsal is at five?
    - No, thanks. I'll call back later.
    - OK, I'll give her the message.
    - Let me take a memo.
    items:
    - U4-023
    - U4-014
    - U4-009
    - U4-010
    - U4-001
    - U4-016
    lgs_weight: yüksek
    note_tr: 'Telefon notu (memo) okuma soruları bu işlevden üretilir: kim aradı, kimi aradı, ne istedi, ne zaman geri aranacak.'
  - id: F4
    name_tr: Hat sorunu, duyamamak ve tekrar istemek (Problems on the line)
    exponents:
    - Sorry, it's a bad line. I can't hear you very well.
    - Could you speak a little louder, please?
    - Can you repeat that, please?
    - I beg your pardon?
    - How do you spell your surname?
    responses:
    - Sure. I said the concert is on Friday.
    - It's D-E-M-İ-R.
    - Let me call you back. Maybe the line will be better.
    items:
    - U4-015
    - U4-019
    - U4-001
    - U4-006
    - U4-005
    lgs_weight: orta
    note_tr: Güncel MEB kitabında (W2) 'It's a bad line', 'Could you please repeat that?', 'Can you spell?' geçiyor; kaynak listelerde louder, repeat, I beg your pardon var.
  - id: F5
    name_tr: Konuşma anında verilen kararı bildirmek (Stating decisions taken at the time of speaking)
    exponents:
    - '[The phone rings.] I''ll take that.'
    - Hang on a minute; I'll get her.
    - I'll see you at the café tomorrow, then.
    - We'll meet next Saturday, then.
    - I'm sorry to hear that. We'll meet up later, then.
    - I'll get back to you in an hour.
    responses:
    - OK, see you then!
    - Great. Talk to you soon.
    - Fine. I'll wait for your call.
    items:
    - U4-022
    - U4-029
    - U4-027
    - U4-049
    - U4-001
    - U4-025
    lgs_weight: yüksek
    note_tr: Programın açık işlevi. 'then' (o hâlde) ile biten will cümleleri konuşmanın sonunda varılan kararı gösterir; sıralama sorularında son satır adayıdır.
  - id: F6
    name_tr: 'Çağrı merkezi ve hizmet: şikâyet, iade, teslimat, rezervasyon, randevu'
    exponents:
    - I'm calling about my order. It hasn't been delivered yet.
    - I'd like to make a complaint.
    - I'd like to return this product. It doesn't work.
    - I'd like to book a room for two nights.
    - I'd like to make an appointment with Dr Aksoy.
    - Can you confirm my reservation, please?
    responses:
    - I'm sorry about that. Can I have your order number, please?
    - Of course. For which day?
    - Your appointment is confirmed for Monday at 10 a.m.
    - I'll put you through to customer service.
    items:
    - U4-036
    - U4-038
    - U4-024
    - U4-040
    - U4-041
    - U4-039
    - U4-035
    - U4-033
    - U4-037
    - U4-034
    - U4-020
    lgs_weight: orta
    note_tr: Programın önerilen ödevi bir çağrı merkezi canlandırmasıdır (W1). Kaynak listelerdeki 'book a flight ticket, single/return ticket' gibi bilet ayrıntıları Ü7 Tourism'e bırakıldı.
  - id: F7
    name_tr: Konuşmayı bitirmek; iyi dilek ve üzüntü bildirmek
    exponents:
    - Thanks for calling.
    - I'll talk to you soon.
    - Take care. Bye!
    - What's wrong? You sound tired.
    - I'm sorry to hear that. Get well soon!
    - Let's keep in touch.
    responses:
    - You too. Bye!
    - Thanks. I feel a bit better now.
    - Sure, I'll text you.
    items:
    - U4-028
    - U4-030
    - U4-025
    - U4-008
    - U4-004
    - U4-006
    lgs_weight: orta
    note_tr: B listesindeki 'what's wrong with you, get well soon, I'm sorry to hear that, take care' ile programdaki 'I'm sorry to hear that' bu işlevin kaynağı.
