traps:
- about: engaged
  item: U4-016
  kind: cok_anlamli
  trap_tr: Öğrenci 'engaged'i yalnız 'nişanlı' bilir; telefonda 'The line is engaged' = hat meşgul.
  tip_tr: Telefon bağlamında engaged = busy. Kişi için kullanılırsa nişanlı.
- about: extension
  item: U4-017
  kind: kaynak_hatasi
  trap_tr: Okul listesi (I) 'extension = ek süre' veriyor. Bu ünitede extension 'dahili numara'dır (extension 214).
  tip_tr: 'Telefonda bir sayıyla birlikte geçerse dahili hat: ''Can you put me through to extension 214?'''
- about: ring
  item: U4-013
  kind: cok_anlamli
  trap_tr: '''ring'' isim olarak yüzük; fiil olarak (telefon) çalmak ve telefonla aramak (I''ll ring you).'
  tip_tr: 'Fiil kalıbına bak: The phone is ringing / Give me a ring = beni ara.'
- about: I'm afraid
  item: U4-023
  kind: turkce_etkisi
  trap_tr: Kaynak B 'korkarım ki' diye çeviriyor; Türkçede tuhaf. Kalıp korku değil kibar 'maalesef' bildirir.
  tip_tr: I'm afraid + olumsuz haber = maalesef. 'I'm afraid of dogs' ise gerçek korku.
- about: hang up / hang on / hang out
  item: U4-006
  kind: benzer_yazilis
  trap_tr: 'Üçü de hang ile başlar: hang up = kapatmak, hang on = beklemek, hang out = takılmak (Ü2).'
  tip_tr: up = bitti (kapat), on = devam (bekle), out = dışarı (arkadaşlarla takıl).
- about: pick up
  item: U4-011
  kind: cok_anlamli
  trap_tr: pick up Ü2'de 'birini arabayla almak' (My dad picks me up) ve 'yerden almak' anlamında geçti; burada telefonu açmak.
  tip_tr: Nesne 'the phone' ya da çalan telefon ise açmak.
- about: get back
  item: U4-001
  kind: cok_anlamli
  trap_tr: get back = (eve) geri dönmek; get back to someone = birine dönüş yapmak, geri aramak. B listesi yalnız 'geri dönmek' veriyor.
  tip_tr: Ardından 'to + kişi' geliyorsa telefonla/mesajla dönüş.
- about: return
  item: U4-041
  kind: cok_anlamli
  trap_tr: return = geri dönmek; return a product = iade etmek; return ticket = gidiş-dönüş bileti (tek yön değil).
  tip_tr: Nesnesi ürünse iade; bilet ise gidiş-dönüş.
- about: book
  item: U4-035
  kind: cok_anlamli
  trap_tr: Fiil olarak 'book a room/table/ticket' = ayırtmak, rezervasyon yapmak.
  tip_tr: book'tan sonra a room / a table / a ticket geliyorsa fiil.
- about: bill
  item: U4-034
  kind: cok_anlamli
  trap_tr: Bill bir isim de olabilir; çağrı merkezi bağlamında fatura (phone bill), restoranda hesap.
  tip_tr: Önünde 'the / my / phone' varsa fatura.
- about: available
  item: U4-014
  kind: cok_anlamli
  trap_tr: Kaynak A 'uygun' veriyor; kişi için 'müsait, telefona gelebilir', eşya/hizmet için 'mevcut, satışta'.
  tip_tr: 'Özne kişi ise müsait: ''He isn''t available at the moment.'''
- about: receiver
  item: U4-018
  kind: cok_anlamli
  trap_tr: receiver hem mesajın alıcısı hem telefonun ahizesi (pick up the receiver).
  tip_tr: Fiil 'pick up / put down' ise ahize.
- about: application
  item: U4-043
  kind: cok_anlamli
  trap_tr: application = telefon uygulaması (app) ama 'başvuru' anlamı da var (job application).
  tip_tr: Telefon, indir (download) kelimeleriyle geçiyorsa uygulama.
- about: Speaking.
  item: U4-031
  kind: turkce_etkisi
  trap_tr: '''Speaking'' telefonda ''Benim'' demektir; öğrenci ''konuşuyorum'' sanıp şıkkı eler.'
  tip_tr: May I speak to X? — Speaking. = Telefondaki X'in kendisi.
- about: This is … / I am …
  item: U4-031
  kind: turkce_etkisi
  trap_tr: '''Ben Ece'' telefonda ''I am Ece'' diye çevrilir; doğal kalıp ''This is Ece''.'
  tip_tr: Telefonda kendini tanıtırken This is / It's.
- about: call me back / call back me
  item: U4-001
  kind: dilbilgisi
  trap_tr: Zamir phrasal verb'ün sonuna konarak 'call back me' denir (yanlış).
  tip_tr: 'Zamir ortaya: call me back, put you through, pick it up.'
- about: tell him call me
  item: U4-009
  kind: dilbilgisi
  trap_tr: 'Mesaj iletirken ''to'' unutulur: ''Could you tell him call me?'''
  tip_tr: tell/ask + kişi + TO + fiil.
- about: matter
  item: U4-030
  kind: cok_anlamli
  trap_tr: matter isim olarak 'madde, konu'; What's the matter? = Ne oldu, sorun ne? It doesn't matter (Ü1) = önemli değil.
  tip_tr: Soru kalıbı olarak sorun soruyor.
- about: memo / memory
  item: U4-010
  kind: benzer_yazilis
  trap_tr: memo (kısa not) ile memory (hafıza) karışır.
  tip_tr: take a memo = not almak; memo kısa, kâğıda yazılan nottur.
- about: percent, local authority, anymore (okul listesi)
  kind: kaynak_hatasi
  trap_tr: 'Kaynak I: percent = ''yüzme'' (doğrusu yüzde), local authority = ''muhtar'' (yerel yönetim), anymore = ''bundan sonra'' (not … anymore = artık … değil).'
  tip_tr: Bu sözcükler öğretilmiyor ama hikâyede geçerse doğru anlamla kullanılır.
- about: printing machine, single ticket (ingilizcele)
  kind: kaynak_hatasi
  trap_tr: 'Kaynak A: printing machine = ''yazıcı'' (doğrusu baskı makinesi, matbaa; yazıcı = printer); single ticket = ''tek kişilik bilet'' (doğrusu tek yön bilet).'
  tip_tr: 'single ticket ↔ return ticket: tek yön ↔ gidiş-dönüş (Ü7''de öğretilecek).'
- about: headquarter, waste time (ingilizceciyiz)
  kind: kaynak_hatasi
  trap_tr: 'Kaynak B: ''headquarter'' yazımı yanlış (headquarters, sonu -s); waste time = ''zaman harcamak'' değil ''zamanı boşa harcamak''.'
  tip_tr: spend time (Ü1) = vakit geçirmek; waste time = boşa harcamak.
- about: bored ↔ boring
  item: U4-054
  kind: dilbilgisi
  trap_tr: '"I am boring" = "Ben sıkıcı biriyim" olur.'
  tip_tr: '-ed: kişinin hissi (I am bored/scared/surprised); -ing: şeyin etkisi (a boring call). bored LGS 2018 dahil 4 kez çıktı.'
lgs_focus:
  what_is_tested:
  - 'Diyalog tamamlama: telefon konuşmasında boşluğa uygun cümle (Speaking. / Hold on, please. / Would you like to leave a message? / I''ll call back later.).'
  - 'Telefon notu, mesaj ya da e-posta çıkarımı: kim aradı, kimi aradı, neden aradı, ne istedi, geri aranacak mı.'
  - 'Diyalog sıralama: karışık verilen telefon cümlelerini doğru sıraya koyma (selamlama → kişi isteme → bekletme/ulaşılamama → mesaj → kapanış).'
  - 'Durum–tepki: ''Telefon çalıyor ve kardeşin duş alıyor; ne dersin?'' gibi durumda anlık karar cümlesi (I''ll take that).'
  - 'Anlam: telefon anlamı Türkçeden farklı sözcükler (engaged, extension, available, hold on, put through, hang up).'
  - 'Çağrı merkezi/randevu metinleri: müşterinin sorunu ve istenen çözüm (return, deliver, complaint, appointment, confirm).'
  question_patterns:
  - type: dialogue_complete
    description_tr: Sekreter–arayan diyaloğunda boşluğa uygun cümle.
    sample_stem: 'Secretary: Good morning, Blue Sky Travel. How can I help you? — Mr Aksoy: Hello, could I speak to Ms Kaya, please? — Secretary: ______ — Mr Aksoy: Yes, please. Could you tell her to call
      me back after lunch?'
    sample_options:
    - I'm afraid she isn't available at the moment. Would you like to leave a message?
    - Speaking. What can I do for you?
    - Hold on, please. I'll put you through.
    - Sorry, you've got the wrong number.
    distractor_logic_tr: Boşluktan SONRAKİ 'Yes, please. Could you tell her…' bir mesaj teklifine cevaptır; yalnız ilk şık mesaj teklifi içerir. 'Speaking' sekreterin Ms Kaya olduğunu söyler (çelişki);
      'I'll put you through' sonrasında mesaj gerekmez; 'wrong number' konuşmayı bitirir.
    items:
    - U4-023
    - U4-009
    - U4-031
    - U4-012
    - U4-032
    - U4-042
  - type: message_infer
    description_tr: Telefon notu (memo) okuma; kim, kimi, ne istedi.
    sample_stem: 'MEMO — To: Duru · From: Ece · Time: 4.15 p.m. · Message: Ece called. The concert hall is booked for Friday. She can''t hear you on your mobile because of the bad line. She asked you to
      call her back on her home phone before 8 p.m. — Which of the following is TRUE according to the memo?'
    sample_options:
    - Duru should call Ece before eight o'clock.
    - Ece will call Duru again at 4.15.
    - Duru booked the concert hall for Friday.
    - Ece's home phone was engaged all afternoon.
    distractor_logic_tr: Çeldiriciler kişileri ters çevirir (kim kimi arayacak; salonu kim ayırttı), notun saatini (4.15) geri arama saati gibi gösterir ya da metinde olmayan bir bilgi ekler (engaged).
      'asked you to call her back' = Duru arayacak.
    items:
    - U4-010
    - U4-001
    - U4-035
    - U4-015
    - U4-016
  - type: process_order
    description_tr: Karışık telefon cümlelerini sıraya koyma.
    sample_stem: Put the sentences in the correct order to make a phone conversation. (I) Hang on a minute. I'll get him. (II) Hello, this is Selin. Is Kaan there? (III) Thanks. (IV) Hi Selin. Yes, he is.
      — Which is the correct order?
    sample_options:
    - II – IV – I – III
    - IV – II – III – I
    - II – I – IV – III
    - I – II – IV – III
    distractor_logic_tr: 'Telefon akışı: kendini tanıtma ve kişi isteme → cevap → bekletme → teşekkür. Çeldiriciler ''Hang on''u istekten önceye ya da ''Yes, he is'' cevabından önceye alır.'
    items:
    - U4-031
    - U4-026
    - U4-007
    - U4-022
  - type: situation
    description_tr: Durum verilir; anlık karar cümlesi seçilir.
    sample_stem: You are at home with your little brother. The phone rings, but your mum is in the garden. What do you say?
    sample_options:
    - I'll take that!
    - I'm going to call Mum next week.
    - Sorry, the line is engaged.
    - Can you put me through, please?
    distractor_logic_tr: Konuşma anında verilen karar will ile kurulur. 'going to … next week' önceden plan; 'engaged' ve 'put me through' arayanın cümleleridir, telefonu açacak kişinin değil.
    items:
    - U4-022
    - U4-016
    - U4-012
  - type: synonym
    description_tr: Diyalogdaki altı çizili ifadenin anlamı.
    sample_stem: — Can I speak to Mr Demir, please? — Hang on, please. I'll see if he is in his office. — The underlined expression means ______.
    sample_options:
    - wait a moment
    - end the call
    - call again later
    - speak more loudly
    distractor_logic_tr: '''hang up'' (kapat = end the call) benzer yazılış tuzağı; ''call again later'' call back''in anlamı; ''speak more loudly'' bad line bağlamından gelir.'
    items:
    - U4-007
    - U4-006
    - U4-001
    - U4-015
  - type: text_infer
    description_tr: Çağrı merkezi konuşmasından müşterinin sorununu ve isteğini çıkarma.
    sample_stem: 'Operator: Thank you for calling Tekno Customer Service. How can I help you? — Ali: Hi, I''m calling about the headphones I ordered last week. They were delivered yesterday, but the left
      side doesn''t work. I''d like to return them. — Operator: I''m sorry to hear that. Could you tell me your order number? — What is Ali''s purpose for calling?'
    sample_options:
    - He wants to give back a product that is broken.
    - He wants to learn the price of new headphones.
    - His order has not been delivered yet.
    - He wants to make an appointment with a technician.
    distractor_logic_tr: '''They were delivered yesterday'' teslimat sorununu eler; ''return them'' = give back. Çeldiriciler metindeki sözcükleri (order, delivered) yanlış duruma bağlar.'
    items:
    - U4-036
    - U4-038
    - U4-024
    - U4-039
    - U4-041
    - U4-025
    - U4-020
  - type: dialogue_complete
    description_tr: Konuşmanın sonunda verilen karar (then).
    sample_stem: 'Bora: Hi Kaan! Are you coming to the rehearsal at five? — Kaan: Sorry, I can''t. I''m ill and I have to stay in bed. — Bora: Oh, I''m sorry to hear that. ______ — Kaan: Great. See you
      on Saturday!'
    sample_options:
    - We'll meet on Saturday morning, then.
    - I had a great time at the rehearsal.
    - Could you put me through to Kaan?
    - I'm afraid the line is engaged.
    distractor_logic_tr: Kaan'ın cevabı 'See you on Saturday' kararın Cumartesi olduğunu gösterir; yalnız ilk şık bir karar bildirir. Diğerleri zaman (geçmiş), rol (arayan) ya da durum (hat meşgul) bakımından
      çelişir.
    items:
    - U4-029
    - U4-025
    - U4-027
    - U4-049
