grammar:
- id: G1
  name_tr: 'Telefonda kimlik: This is … / Speaking. / Is … there?'
  form: This is + ad (+ calling). · Is + ad + there/in? · Speaking. · Who's calling, please?
  examples:
  - Hello, this is Kaan. Is Bora there?
  - — May I speak to Selin? — Speaking.
  - Who's calling, please? — It's Elif, her classmate.
  explain_tr: 'Telefonda kendini tanıtırken ''This is …'' ya da ''It''s …'' kullanılır; karşıdakini görmediğimiz için ''I am …'' doğal değildir. Aranan kişi telefonu açtıysa ''Speaking.'' der: ''Benim,
    buyurun.'' anlamındadır. Karşıdakinin kim olduğunu ''Who are you?'' diye sormak kabadır; ''Who''s calling, please?'' denir.'
  common_errors:
  - wrong: Hello, I am Ece. Is Duru at home?
    right: Hello, this is Ece. Is Duru there?
    why_tr: Türkçedeki 'Ben Ece' doğrudan çevrilmiş. Telefonda 'this is' kalıptır.
  - wrong: Who are you?
    right: Who's calling, please?
    why_tr: '''Who are you?'' telefonda kaba ve şaşkın bir soru gibi durur.'
  - wrong: — May I speak to Selin? — I am speaking.
    right: — May I speak to Selin? — Speaking.
    why_tr: '''Speaking'' tek başına kalıptır; ''I am speaking'' ''şu an konuşuyorum'' demek olur.'
  lgs_note: 'Diyalogda boşluğa ''Speaking.'' ya da ''Who''s calling, please?'' getirilir. ''Speaking'' cevabından sonra arayan doğrudan konusuna geçer: ipucu budur.'
  items:
  - U4-031
  - U4-026
- id: G2
  name_tr: 'Kibar rica: Can / Could / May I …? · Can / Could you …?'
  form: 'May/Could/Can I + V1 …? (izin) · Could/Can you + V1 …, please? (rica) · Cevap: Sure. / Of course. / I''m afraid …'
  examples:
  - May I speak to Mrs Yılmaz, please?
  - Could you hold on a moment, please?
  - Can you tell her to call me back?
  - Could I leave a message?
  explain_tr: '''May I'' en resmî, ''Could I'' kibar, ''Can I'' gündelik izin isteğidir. Karşıdakinden bir şey yapmasını isterken ''Could you / Can you'' kullanılır. Kibar olumsuz cevap ''I''m afraid …''
    ile başlar (Maalesef …).'
  common_errors:
  - wrong: May you hold on?
    right: Could you hold on, please?
    why_tr: '''May'' karşıdakinden rica etmek için kullanılmaz; yalnız kendi adımıza izin isterken (May I…?).'
  - wrong: Can I speak with Mr Demir? — No.
    right: — Can I speak to Mr Demir? — I'm afraid he isn't available at the moment.
    why_tr: Tek kelimelik 'No' telefonda kaba kaçar; 'I'm afraid…' ile gerekçe verilir.
  lgs_note: Şıklardaki 'May I / Could you' ayrımı kim kimden ne istiyor sorusuyla çözülür. Kibar–kaba ayrımı 'polite' sözcüğüyle sorulabilir.
  items:
  - U4-026
  - U4-007
  - U4-019
  - U4-023
  - U4-052
- id: G3
  name_tr: 'Konuşma anında karar: will (I''ll …) — be going to ile karşılaştırma'
  form: I'll / We'll + V1 (konuşma anında verilen karar) · …, then. (o hâlde) · be going to + V1 (önceden verilmiş plan, tanıma)
  examples:
  - '[The phone rings.] — I''ll take that!'
  - — Duru isn't here. — OK, I'll call back later.
  - — I can't come today, I'm ill. — I'm sorry to hear that. We'll meet next week, then.
  - — Is the line engaged again? — Yes. I'll send her a message.
  explain_tr: 'Karar konuşma sırasında, bir duruma tepki olarak veriliyorsa will kullanılır: telefon çalar → ''I''ll take that''; kişi yoktur → ''I''ll call back''. Cümle sonundaki ''then'' (o zaman, o
    hâlde) kararın önceki cümleye dayandığını gösterir. Önceden planlanmış iş için be going to kullanılır (I''m going to visit my grandma on Sunday): bu ayrım LGS''de tanıma düzeyinde.'
  common_errors:
  - wrong: The phone is ringing. — I take it.
    right: The phone is ringing. — I'll take it.
    why_tr: Türkçedeki geniş zaman ('Ben bakarım') Simple Present'e çevrilince hata olur; anlık karar için will gerekir.
  - wrong: — He's not available. — OK, I'm calling back later.
    right: — He's not available. — OK, I'll call back later.
    why_tr: Present Continuous şu anki eylem ya da kesin plan bildirir; konuşma anındaki karar will ile kurulur.
  - wrong: We meet next Saturday, then.
    right: We'll meet next Saturday, then.
    why_tr: Karar bildiren 'then' cümlesinde will düşürülmez.
  lgs_note: Programın açık işlevi (E8.4.SP1). Diyalog sonunda varılan kararı soran sorularda doğru şık genellikle 'I'll … / We'll …, then' cümlesidir; çeldirici, kararı değil önceki durumu tekrar eden cümledir.
  items:
  - U4-022
  - U4-029
  - U4-001
  - U4-049
  - U4-027
- id: G4
  name_tr: Telefon phrasal verb'leri ve nesnenin yeri
  form: call + nesne + back · put + nesne + through (to …) · pick + it/the phone + up · get back to + nesne · hang up / hold on / hang on (nesnesiz)
  examples:
  - Can you ask him to call me back?
  - Please hold on. I'll put you through to the manager.
  - She picked up the phone and said 'Speaking.'
  - I'll get back to you in an hour.
  - Don't hang up! I haven't finished.
  explain_tr: 'Nesne zamir (me, you, him, her, it) ise iki parçanın ARASINA girer: call me back, put you through, pick it up. ''get back to'' ve ''contact'' gibi fiillerde kişi sondadır. hang up, hold on,
    hang on nesne almaz: telefonu kapatmak için ''hang up the phone'' da denir ama ''hang up him'' denmez.'
  common_errors:
  - wrong: Please call back me.
    right: Please call me back.
    why_tr: Zamir phrasal verb'ün ortasına girer.
  - wrong: I'll get back you tomorrow.
    right: I'll get back to you tomorrow.
    why_tr: '''get back to someone'' kalıbındaki ''to'' düşmez.'
  - wrong: Can you contact with me?
    right: Can you contact me? / Can you get in touch with me?
    why_tr: Fiil olarak contact edat almaz; 'with' yalnız 'get in touch with' ve isim kullanımında (contact with someone).
  lgs_note: Gap-fill ve eş anlam sorularında 'call back = get back to', 'hold on = hang on' eşleşmeleri; 'hang up' ↔ 'hang on' karışıklığı çeldirici olarak kullanılır.
  items:
  - U4-001
  - U4-012
  - U4-011
  - U4-006
  - U4-007
  - U4-004
- id: G5
  name_tr: 'Mesaj iletme: tell / ask + kişi + to V1 · Could you tell him (that) …?'
  form: Could you tell/ask + kişi + to + V1? · Could you tell + kişi + (that) + cümle? · Please tell + kişi + not to + V1.
  examples:
  - Could you tell him to call me back?
  - Can you ask her to bring the guitar?
  - Could you tell Ece that the rehearsal is at five?
  - Please tell Bora not to be late.
  explain_tr: 'Başkasına iletilecek istek ''tell/ask + kişi + to + fiil'' kalıbıyla kurulur; olumsuzu ''not to''. Bilgi iletilecekse ''tell + kişi + (that) + cümle'' kullanılır. Telefon notları (memo) bu
    kalıbı tersinden okutur: ''Kaan called. He asked you to call him back.'''
  common_errors:
  - wrong: Could you tell him call me?
    right: Could you tell him to call me?
    why_tr: İkinci fiilden önce 'to' gerekir.
  - wrong: Please tell her don't be late.
    right: Please tell her not to be late.
    why_tr: Olumsuz istek 'not to + V1' ile iletilir.
  lgs_note: 'Mesaj notu sorularında ''Who should call whom?'' türü çıkarım: memo''daki ''asked you to call him back'' arayanın geri aranmak istediğini gösterir.'
  items:
  - U4-009
  - U4-010
  - U4-001
- id: G6
  name_tr: Neden ulaşılamıyor? Present Continuous ve tanıma düzeyinde Present Perfect
  form: He/She is + V-ing (at the moment / right now) · He has gone out. / She has just left. (tanıma)
  examples:
  - I'm afraid she's talking on the other line at the moment.
  - Sorry, he's having a meeting right now.
  - I'm afraid he isn't available. He has gone out.
  - She has just left the office. Can I take a message?
  explain_tr: 'Aranan kişinin şu an ne yaptığı Present Continuous ile söylenir (at the moment, right now). Programdaki ''He has gone out'' Present Perfect''tir: 8. sınıfta öğretilmez, kalıp olarak tanınır
    (''çıktı, şu an burada değil'').'
  common_errors:
  - wrong: She talks on the other line now.
    right: She is talking on the other line now.
    why_tr: Şu an süren eylem için Simple Present değil Present Continuous.
  - wrong: He has gone out yesterday.
    right: He went out yesterday. / He has gone out.
    why_tr: Belirli geçmiş zaman sözcüğü (yesterday) Present Perfect ile kullanılmaz; kalıp olduğu gibi öğrenilir.
  lgs_note: Diyalog tamamlamada 'I'm afraid he isn't available' cümlesinin devamı bir gerekçedir (He's in a meeting / He has gone out); şıklarda gerekçeyle çelişen cümle elenir.
  items:
  - U4-023
  - U4-014
  - U4-009
expressions:
- en: This is … (calling).
  tr: Ben … (arıyorum).
  use: Arayan kendini tanıtır.
  reply:
  - Hi …! How are you?
  - Who would you like to speak to?
  item: U4-031
  register: nötr
- en: Speaking.
  tr: Benim, buyurun.
  use: Aranan kişi telefonu kendisi açtığında.
  reply:
  - Oh, hi! It's Ece. I'm calling about the concert.
  item: U4-031
  register: nötr
- en: Who's calling, please?
  tr: Kim arıyor acaba?
  use: Telefonu açan, arayanı soruyor; sekreterler sık kullanır.
  reply:
  - It's Kaan, her classmate.
  - This is Mr Demir from City Concert Hall.
  item: U4-031
  register: nötr
- en: May I speak to …, please? / Could I speak to …?
  tr: … ile görüşebilir miyim?
  use: Birini istemek; 'May' en resmî.
  reply:
  - Speaking.
  - Hold on, please. I'll get him.
  - I'm afraid she isn't available at the moment.
  item: U4-026
  register: resmi
- en: Is … there? / Is … in?
  tr: … orada mı? / … evde mi?
  use: Arkadaş ya da aile evini ararken gündelik soru.
  reply:
  - Yes, hang on a minute.
  - No, he has gone out.
  item: U4-026
  register: gündelik
- en: Hold on, please. / Hang on a minute.
  tr: Bekleyin lütfen. / Bir dakika.
  use: Karşıdakini hatta bekletmek; hang on daha gündelik.
  reply:
  - Sure.
  - OK, I'll hold.
  item: U4-007
  register: nötr
- en: I'll put you through.
  tr: Sizi bağlıyorum.
  use: Sekreter ya da santral arayanı istenen kişiye bağlar.
  reply:
  - Thank you.
  item: U4-012
  register: resmi
- en: The line is engaged / busy.
  tr: Hat meşgul.
  use: Aranan hat başka bir görüşmede.
  reply:
  - OK, I'll hold.
  - I'll call back later, then.
  item: U4-016
  register: nötr
- en: I'm afraid he isn't available at the moment.
  tr: Maalesef şu anda müsait değil.
  use: Kibarca olumsuz haber vermek.
  reply:
  - Can I leave a message?
  - OK, I'll call back later.
  item: U4-023
  register: nötr
- en: Would you like to leave a message?
  tr: Mesaj bırakmak ister misiniz?
  use: Aranan kişi yokken telefonu açan sorar.
  reply:
  - Yes, please. Could you tell her to call me back?
  - No, thanks. I'll call back later.
  item: U4-009
  register: nötr
- en: Can I take a message?
  tr: Mesajınızı alayım mı? / Not alayım mı?
  use: Aynı durum; telefonu açan not alır.
  reply:
  - Yes, please. Tell him the rehearsal is at five.
  item: U4-009
  register: nötr
- en: Could you tell him to call me back?
  tr: Beni geri aramasını söyler misiniz?
  use: Mesaj bırakırken.
  reply:
  - Sure. What's your number?
  - Of course. I'll give him the message.
  item: U4-001
  register: nötr
- en: I'll get back to you.
  tr: Size dönüş yaparım.
  use: Bilgi verdikten sonra geri dönmeyi söz vermek.
  reply:
  - Great, thanks.
  - OK, I'll wait for your call.
  item: U4-001
  register: nötr
- en: It's a bad line. I can't hear you very well.
  tr: Hat kötü, seni pek iyi duyamıyorum.
  use: Ses kesik geliyorsa.
  reply:
  - Let me call you back.
  - Can you hear me now?
  item: U4-015
  register: gündelik
- en: Can you repeat that, please? / I beg your pardon?
  tr: Tekrar eder misiniz? / Efendim?
  use: Duyamadığında ya da anlamadığında; 'I beg your pardon' daha resmî.
  reply:
  - Sure. I said …
  item: U4-019
  register: nötr
- en: How can I help you? / May I help you?
  tr: Size nasıl yardımcı olabilirim?
  use: Çağrı merkezi, otel, mağaza telefonu açarken.
  reply:
  - I'm calling about my order.
  - I'd like to book a room.
  item: U4-020
  register: resmi
- en: I'm calling about …
  tr: … hakkında arıyorum.
  use: Arama nedenini söylemek.
  reply:
  - Of course. Can I have your name, please?
  item: U4-024
  register: nötr
- en: Sorry, wrong number.
  tr: Pardon, yanlış numara.
  use: Yanlış kişiyi aradığında ya da biri seni yanlışlıkla aradığında.
  reply:
  - No problem.
  item: U4-032
  register: gündelik
- en: I'll take that. / I'll get it.
  tr: (Telefona) ben bakarım.
  use: Telefon çalınca anında verilen karar.
  reply:
  - Thanks!
  item: U4-022
  register: gündelik
- en: Hang on a minute; I'll get him.
  tr: Bir dakika, onu çağırayım.
  use: Telefonu açan, istenen kişiyi çağırmaya gider.
  reply:
  - Thanks.
  item: U4-022
  register: gündelik
- en: We'll meet at the café tomorrow, then.
  tr: O zaman yarın kafede buluşuruz.
  use: Konuşmanın sonunda ortak karar.
  reply:
  - Great. See you!
  item: U4-029
  register: gündelik
- en: What's wrong? / What's the matter?
  tr: Ne oldu? Neyin var?
  use: Karşıdakinin sesinden bir sorun sezince.
  reply:
  - I've got a cold.
  - My phone is broken.
  item: U4-030
  register: gündelik
- en: I'm sorry to hear that.
  tr: Buna üzüldüm.
  use: Kötü bir haber duyunca.
  reply:
  - Thanks.
  item: U4-025
  register: nötr
- en: Get well soon!
  tr: Geçmiş olsun!
  use: Hasta birine.
  reply:
  - Thank you.
  item: U4-025
  register: gündelik
- en: Thanks for calling. / Talk to you soon. / Take care.
  tr: Aradığın için sağ ol. / Görüşürüz. / Kendine iyi bak.
  use: Konuşmayı kapatırken.
  reply:
  - You too. Bye!
  item: U4-028
  register: gündelik
- en: Let's keep in touch.
  tr: Görüşmeyi bırakmayalım.
  use: Uzaklaşan bir arkadaşla vedalaşırken.
  reply:
  - Sure! I'll text you every week.
  item: U4-008
  register: gündelik
- en: Sorry to disturb you, but …
  tr: Rahatsız ettiğim için kusura bakmayın ama …
  use: Geç saatte ya da meşgul birini ararken kibar giriş.
  reply:
  - No problem. How can I help?
  item: U4-053
  register: resmi
- en: I guess so.
  tr: Sanırım öyle.
  use: Tam emin olmadan onaylamak.
  item: U4-021
  register: gündelik
