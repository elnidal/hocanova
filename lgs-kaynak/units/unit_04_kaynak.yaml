synonym_sets:
- words:
  - hold on
  - hang on
  - just a minute / just a moment
  - hold the line
  difference_tr: Hepsi 'bekleyin' der. hang on ve just a minute gündelik; hold the line ve Could you hold on, please? sekreter/çağrı merkezi dili.
  items:
  - U4-007
- words:
  - call back
  - get back to
  - ring back
  difference_tr: call back = geri aramak; get back to someone = dönüş yapmak (aramak ya da e-posta olabilir); ring back İngiliz İngilizcesi.
  items:
  - U4-001
  - U4-013
- words:
  - contact
  - get in touch with
  - reach
  difference_tr: contact (edatsız fiil) daha resmî; get in touch with gündelik; reach = ulaşabilmek (I couldn't reach him).
  items:
  - U4-004
- words:
  - engaged
  - busy
  difference_tr: Telefon hattı için ikisi de 'meşgul'. busy kişi için de kullanılır (Ü1); engaged kişi için 'nişanlı' demektir.
  items:
  - U4-016
- words:
  - pick up
  - answer
  difference_tr: pick up the phone = ahizeyi kaldırmak, açmak; answer the phone = telefona cevap vermek. Sınavda eş anlamlı.
  items:
  - U4-011
- words:
  - I'm afraid
  - Unfortunately
  - Sorry, but
  difference_tr: Olumsuz haberi yumuşatan girişler; I'm afraid burada korku bildirmez.
  items:
  - U4-023
- words:
  - Can you repeat that?
  - Pardon? / I beg your pardon?
  - Sorry? / Excuse me?
  - What did you say?
  difference_tr: Duyamadığında tekrar isteme. I beg your pardon en resmî; What? kaba kaçabilir.
  items:
  - U4-019
- words:
  - book
  - reserve
  - make a reservation
  difference_tr: Hepsi 'ayırtmak'. book en gündelik; reserve ve make a reservation otel/restoran dilinde.
  items:
