- '"Making complaints" MEB programında ayrı işlev mi? Doğrulanan tek işlev "Expressing obligation" (ingilizcepedia günlük planı); şikâyet kalıpları ders kitabı s.98''e dayanıyor.'
- '"don''t have to" ders kitabı cevap sayfasında görülmedi (mustn''t s.103 var); birim LGS değerinden dolayı eklendi, kullanıcı onayı bekliyor.'
- Ders kitabı s.102 cevap sayfasında yok; o sayfanın kalıpları eksik olabilir.
- 'cook (A1) sınav sıklığı (7) ve cook/cooker tuzağı nedeniyle TUZAK birimi yapıldı: kullanıcı BİLİNEN tercih ederse 49 birim.'
