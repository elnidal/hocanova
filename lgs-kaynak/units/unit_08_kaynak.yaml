traps:
- about: don't have to / mustn't
  item: U8-040
  kind: dilbilgisi
  trap_tr: İkisi de "olumsuz zorunluluk" sanılır.
  tip_tr: don't have to = gerek yok; mustn't = yasak.
- about: dish / dishes
  item: U8-006
  kind: cok_anlamli
  trap_tr: dish yemek / tabak (U3-056); the dishes bulaşık.
  tip_tr: wash / do the dishes gördüğünde "bulaşık" düşün.
- about: cook / cooker
  item: U8-004
  kind: sahte_dost
  trap_tr: cooker aşçı sanılır; aslında ocak / fırındır. Aşçı = cook.
  tip_tr: My mother is a good cook = annem iyi yemek yapar.
- about: make the bed
  item: U8-011
  kind: turkce_etkisi
  trap_tr: '"Yatak yapmak / yatağı yapmak" gibi çevrilir; kaynak I "Yatağı yapmak" yazmış.'
  tip_tr: Sabah yatağı düzeltmek, toplamak.
- about: hang out / hang out the laundry / hang on
  item: U8-020
  kind: cok_anlamli
  trap_tr: hang out takılmak (U2-004), hang out the laundry çamaşır sermek, hang on beklemek (U4-007).
  tip_tr: 'Nesneye bak: the laundry / the washing varsa çamaşır.'
- about: dust
  item: U8-015
  kind: cok_anlamli
  trap_tr: dust isim (toz); fiil olarak "toz yapmak" değil "tozunu almak".
  tip_tr: dust the shelves = rafların tozunu almak.
- about: iron
  item: U8-021
  kind: cok_anlamli
  trap_tr: iron "demir" bilinir; ev işi bağlamında ütü / ütülemek.
  tip_tr: iron the clothes; okunuş /ˈaɪən/.
- about: empty
  item: U8-008
  kind: cok_anlamli
  trap_tr: empty sıfat "boş" bilinir; fiil "boşaltmak".
  tip_tr: empty the dishwasher / the bin.
- about: water
  item: U8-024
  kind: cok_anlamli
  trap_tr: 'water fiil olabilir: sulamak.'
  tip_tr: water the plants.
- about: flat
  item: U8-027
  kind: cok_anlamli
  trap_tr: flat "düz" bilinir; ev bağlamında apartman dairesi.
  tip_tr: We live in a flat on the third floor.
- about: relative
  item: U8-028
  kind: sahte_dost
  trap_tr: relatif / göreceli sanılır.
  tip_tr: relatives = akrabalar.
- about: borrow / lend
  item: U8-031
  kind: turkce_etkisi
  trap_tr: Türkçede ikisi de "ödünç"; yön karışır.
  tip_tr: borrow FROM (alırsın), lend TO (verirsin).
- about: diary / dairy / daily
  item: U8-032
  kind: benzer_yazilis
  trap_tr: diary günlük (defter), dairy süt ürünleri, daily günlük (her gün).
