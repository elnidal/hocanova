lgs_focus:
  what_is_tested:
  - Ailenin ev işi çizelgesi / tablosundan kim neyi, ne sıklıkla yapıyor (has to, is responsible for)
  - Resim–ev işi kalıbı eşleştirme (vacuum, mop, iron, mow the lawn, hang out the laundry)
  - 'Zorunluluk anlamı: have to / must / don''t have to / mustn''t'
  - Ev işleri hakkında beğeni / şikâyet içeren mesaj veya diyalog
  - Ev işi anketi grafiği (how often, enjoy, hate)
  question_patterns:
  - type: table_graph
    description_tr: Bir ailenin haftalık ev işi tablosu; kim neyden sorumlu ya da kim neyi yapmak zorunda değil.
    sample_stem: 'According to the chart, which of the following is TRUE? (Tablo: Mum – cook the meals; Ali – take out the garbage; Ece – set the table, water the plants)'
    sample_options:
    - Ece is responsible for two chores.
    - Ali has to cook the meals.
    - Mum doesn't have to do any chores.
    - Ali waters the plants.
    distractor_logic_tr: Çeldiriciler kişi–iş eşlemesini değiştirir ya da "doesn't have to" ile ters anlam kurar.
    items:
    - U8-034
    - U8-035
    - U8-016
    - U8-005
    - U8-024
    - U8-004
  - type: situation
    description_tr: Durum verilir, uygun zorunluluk cümlesi seçilir.
    sample_stem: It's Saturday and Kerem's dad has already done the laundry. What can his dad say to him?
    sample_options:
    - You don't have to do the laundry today.
    - You mustn't do the laundry today.
    - You have to do the laundry today.
    - You must do the laundry twice.
    distractor_logic_tr: mustn't (yasak) ile don't have to (gerek yok) karışıklığı.
    items:
    - U8-040
    - U8-018
  - type: picture_match
    description_tr: Dört resim ve dört ev işi kalıbı; eşleşmeyen ya da doğru eşleşen bulunur.
    sample_stem: 'Which chore is shown in the picture? (Resim: elinde ütü olan çocuk)'
    sample_options:
    - iron the clothes
    - fold the clothes
    - hang out the laundry
    - separate the laundry
    distractor_logic_tr: Aynı temanın (çamaşır) diğer kalıpları.
    items:
    - U8-021
    - U8-022
    - U8-020
    - U8-019
  - type: dialogue_complete
    description_tr: Şikâyet ya da sorumluluk diyaloğunda boşluk.
    sample_stem: 'A: Why are you so angry? B: ---- I always have to wash the dishes. A: Don''t make a fuss. We take turns.'
    sample_options:
    - It's not fair!
    - That's a good idea!
    - I'll do my best.
    - You're welcome!
    distractor_logic_tr: Bağlamdan kopuk ama kalıp olarak tanıdık ifadeler.
    items:
    - U8-043
    - U8-044
    - U8-037
    - U8-006
  - type: message_infer
    description_tr: 'Buzdolabı notu / mesaj: anne çocuktan ne yapmasını istiyor.'
    sample_stem: 'Note: ''Deniz, please empty the dishwasher and feed the cat before I come home. You don''t have to cook. – Mum'' What does Mum want Deniz to do?'
    sample_options:
    - Empty the dishwasher and feed the cat.
    - Cook dinner and feed the cat.
    - Load the dishwasher and cook.
    - Go shopping and cook.
    distractor_logic_tr: load ↔ empty karışıklığı; don't have to cook'un yanlış okunması.
    items:
    - U8-008
    - U8-026
    - U8-036
    - U8-040
  - type: table_graph
    description_tr: 'Ev işi anketi: öğrencilerin en çok / en az sevdiği işler.'
    sample_stem: According to the survey, which chore do most students hate?
    sample_options:
    - ironing the clothes
    - watering the plants
    - feeding the pets
    - setting the table
    distractor_logic_tr: Grafikteki en düşük ve en yüksek değerlerin ters okunması.
    items:
    - U8-021
    - U8-024
    - U8-026
    - U8-005
