grammar:
- id: G1
  name_tr: 'Zorunluluk: have to / must'
  form: I/You/We/They have to + V1 · He/She has to + V1 · must + V1 (tüm kişiler) · Do/Does … have to …? · had to (geçmiş)
  examples:
  - I have to take out the garbage every evening.
  - She has to look after her little brother on Saturdays.
  - Do you have to make your bed? – Yes, I do.
  - We must cooperate on chores.
  explain_tr: have to dışarıdan gelen zorunluluk ya da kural (annem istiyor, okul kuralı); must konuşanın kendisinin gerekli gördüğü (I must study harder) ya da yazılı kural. Sınavda ikisi çoğunlukla aynı
    anlamda (zorunda olmak) kullanılır. must çekimlenmez, to almaz.
  common_errors:
  - wrong: She have to iron the clothes.
    right: She has to iron the clothes.
    why_tr: he/she/it ile has to.
  - wrong: I must to tidy my room.
    right: I must tidy my room.
    why_tr: must yalın fiil alır.
  - wrong: Do you must help your parents?
    right: Do you have to help your parents?
    why_tr: must ile do kullanılmaz; soruda have to tercih edilir.
  lgs_note: Ev işi tablosu sorularında "has to / doesn't have to" ile kim neyi yapmak zorunda bilgisi sorulur; çeldiriciler kişiyi ya da günü değiştirir.
  items:
  - U8-035
  - U8-034
- id: G2
  name_tr: don't have to ≠ mustn't
  form: don't / doesn't have to + V1 = gerek yok · mustn't + V1 = yasak
  examples:
  - It's Sunday. You don't have to get up early.
  - You mustn't touch the iron. It's hot!
  - Selin doesn't have to wash the dishes today; it's her brother's turn.
  explain_tr: 'Olumlu hâlleri benzer olsa da olumsuzları zıt anlamlıdır: don''t have to "zorunda değilsin, istersen yap"; mustn''t "yapma, yasak".'
  common_errors:
  - wrong: You mustn't cook tonight, I've already ordered pizza.
    right: You don't have to cook tonight.
    why_tr: Yasak değil, gerek yok.
  lgs_note: Durum–anlam sorusunda "Which sentence means it is not necessary?" tipinde doğrudan sorulabilir; mustn't şıkkı en güçlü çeldiricidir.
  items:
  - U8-040
  - U8-035
- id: G3
  name_tr: 'Sorumluluk: be responsible for / be in charge of + isim / V-ing'
  form: be responsible for / be in charge of + noun / V-ing · Whose responsibility is …? – It's my/his … responsibility.
  examples:
  - I'm responsible for taking out the garbage.
  - My dad is in charge of the grocery shopping.
  - Whose responsibility is feeding the cat? – It's Elif's responsibility.
  explain_tr: 'Edattan (for / of) sonra fiil gelirse -ing alır. responsibility isim: It''s my responsibility.'
  common_errors:
  - wrong: I'm responsible for take out the garbage.
    right: I'm responsible for taking out the garbage.
    why_tr: Edattan sonra V-ing.
  - wrong: I'm responsible of the dog.
    right: I'm responsible for the dog. / I'm in charge of the dog.
    why_tr: responsible for, in charge of.
  lgs_note: 'Okuma ve tablo sorularının ana yapısı: "Who is responsible for mowing the lawn?" cevabı tablodan bulunur.'
  items:
  - U8-034
  - U8-037
- id: G4
  name_tr: Beğeni fiilleri + V-ing ve sıklık zarfları (Ü2 tekrarı)
  form: like / love / enjoy / don't mind / hate / can't stand + V-ing · always / usually / often / sometimes / rarely / never
  examples:
  - I enjoy watering the plants.
  - My brother can't stand ironing.
  - I usually set the table, but I never do the washing up.
  explain_tr: Beğeni fiilinden sonraki ev işi kalıbı -ing alır (enjoy watering). Sıklık zarfı ana fiilden önce, be fiilinden sonra gelir.
  common_errors:
  - wrong: I don't mind to load the dishwasher.
    right: I don't mind loading the dishwasher.
    why_tr: don't mind + V-ing.
  - wrong: I make always my bed.
    right: I always make my bed.
    why_tr: Sıklık zarfı ana fiilden önce.
  lgs_note: Anket/grafik sorularında "How often does Ali do the laundry?" ve "Which chore does she enjoy most?" birlikte sorulur.
  items:
  - U8-024
  - U8-021
  - U8-008
  - U8-005
  - U8-006
- id: G5
  name_tr: want / ask someone to do something
  form: want / ask / tell + kişi (me, us, him) + to V1
  examples:
  - My mum wants me to tidy up my room.
  - Our teacher wants us to return the books on time.
  - Dad asked me to feed the cat.
  explain_tr: Birinin başkasından bir şey yapmasını istemesi; zorunluluğun dolaylı anlatımı. Türkçedeki "-mesini istemek" yapısı İngilizcede that cümlesiyle kurulmaz.
  common_errors:
  - wrong: My mum wants that I tidy my room.
    right: My mum wants me to tidy my room.
    why_tr: want + nesne + to V1.
  - wrong: She wants me tidy my room.
    right: She wants me to tidy my room.
    why_tr: to unutulmaz.
  lgs_note: Mesaj / not sorularında "What does Mum want Ali to do?" sorusu bu yapıyla gelir.
  items:
  - U8-036
  - U8-041
  - U8-026
- id: G6
  name_tr: too much / too many (şikâyet)
  form: too many + sayılabilen çoğul · too much + sayılamayan · too + sıfat
  examples:
  - I have too many tasks this week!
  - There's too much laundry in the basket.
  - This room is too untidy.
  explain_tr: too "gereğinden fazla" anlamında olumsuzluk ve şikâyet taşır; very yalnız "çok" demektir. laundry, furniture, homework sayılamaz → too much.
  common_errors:
  - wrong: I have too much chores.
    right: I have too many chores.
    why_tr: chores sayılabilir çoğul.
  - wrong: There are too many furnitures.
    right: There is too much furniture.
    why_tr: furniture sayılamaz.
  lgs_note: Şikâyet diyaloğunda boşluğa "too many tasks" gelir; çeldirici "too much tasks" ya da olumlu bir cümledir.
  items:
  - U8-042
  - U8-033
  - U8-018
