schema_version: 1
unit: 8
title: Chores
status: taslak
summary_tr: Ünite, ev işlerini, sorumlulukları ve zorunlulukları konuşmayı öğretir. Programın işlevi zorunluluk bildirmedir (Do you have to help your parents? – Yes, I must set the table every evening.);
  kazanımlar sorumluluklardan söz etmeyi (I'm responsible for taking out the garbage.) ve ev işleriyle ilgili beğeni ve şikâyeti de kapsar (I don't like doing the laundry. / I have too many tasks!). Kelime
  gövdesi "fiil + nesne" ev işi kalıplarıdır (set the table, load the dishwasher, make the bed, vacuum the house, mow the lawn, hang out the laundry); beğeni fiilleri ve sıklık zarfları Ü2'den, -ed duygu
  sıfatları Ü4'ten tekrar edilir. LGS'de ünite en çok aile ev işi çizelgesi / tablosu okuma, "Who is responsible for …?" çıkarımı, resim–ev işi eşleştirme ve "don't have to / mustn't" anlam farkı olarak
  gelir.
curriculum:
  outcomes:
  - code: E8.8.L1
    text_tr: 'Dinleme: İnsanların sorumluluklarını anlatan kısa bir konuşmanın ana noktalarını belirler.'
  - code: E8.8.L2
    text_tr: 'Dinleme: Çeşitli sözlü metinlerde zorunlulukları, beğenileri ve beğenmedikleri anlar.'
  - code: E8.8.L3
    text_tr: 'Dinleme: Kısa, olgusal konuşmalarda konu değişimini izler.'
  - code: E8.8.SI1
    text_tr: 'Karşılıklı konuşma: Doğrudan bilgi alışverişi gerektiren basit, rutin görevlerde etkileşim kurar.'
  - code: E8.8.SI2
    text_tr: 'Karşılıklı konuşma: Sorumluluklar hakkında konuşur.'
  - code: E8.8.SP1
    text_tr: 'Sözlü anlatım: Zorunluluklarını, beğendiklerini ve beğenmediklerini basit ifadelerle anlatır. (Dağılım tablosunda 1 soru)'
  - code: E8.8.R1
    text_tr: 'Okuma: Sorumluluklarla ilgili kısa ve basit metinleri anlar. (LGS''de doğrudan ölçülen kazanım; dağılım tablosunda 2 soru)'
  - code: E8.8.W1
    text_tr: 'Yazma: Duyguları ve sorumlulukları hakkında kısa, basit şiir / öykü yazar.'
  functions:
  - id: F1
    name_tr: Zorunluluk bildirmek (Expressing obligation)
    exponents:
    - Do you have to help your parents in housework?
    - I must help my parents to set the table.
    - I have to take out the garbage every evening.
    - You don't have to cook. Dad is doing it today.
    - You mustn't leave your clothes on the floor.
    responses:
    - Yes, I do. I have to make my bed every morning.
    - No, I don't. My brother is in charge of that.
    - Well, I must help my brother to do his homework.
    items:
    - U8-035
    - U8-040
    - U8-036
    - U8-005
    - U8-016
    - U8-011
    lgs_weight: yüksek
    note_tr: Programın açık işlevi (ingilizcepedia 29. hafta planı). Ders kitabında mustn't (s.103) ve want someone to (s.106) da var; don't have to ders kitabı cevaplarında görülmedi ama LGS'nin klasik
      anlam tuzağı.
  - id: F2
    name_tr: Sorumluluklardan söz etmek (Talking about responsibilities)
    exponents:
    - Who is responsible for doing the shopping in your family?
    - Whose responsibility is washing the dishes?
    - What are you in charge of at home?
    - Whose turn is it to feed the cat?
    responses:
    - I'm responsible for dusting the shelves.
    - It's my mother's responsibility.
    - I'm in charge of watering the plants.
    - It's Selin's turn. We take turns.
    items:
    - U8-034
    - U8-037
    - U8-001
    - U8-002
    - U8-015
    - U8-024
    - U8-026
    - U8-003
    lgs_weight: yüksek
    note_tr: Kazanım SI2 ve R1. Okuma sorularının çoğu bir ailenin ev işi tablosundan "Who is responsible for …?" bilgisini ister.
  - id: F3
    name_tr: Ev işleri hakkında beğeni ve beğenmeme (Expressing likes and dislikes)
    exponents:
    - Which chore do you like doing?
    - Which task do you find enjoyable?
    - I like setting the table because I like decorating it.
    - I can't stand ironing the clothes.
    - I don't mind loading the dishwasher.
    responses:
    - I enjoy watering the plants. It's relaxing.
    - I hate taking out the rubbish. It smells awful!
    - I have fun when I take my dog for a walk.
    items:
    - U8-005
    - U8-021
    - U8-008
    - U8-024
    - U8-016
    - U8-025
    lgs_weight: orta
    note_tr: Kazanım SP1. Beğeni fiilleri (like, enjoy, don't mind, can't stand, hate + V-ing) Ü2'de öğretildi (U2-007…U2-016); bu ünitede ev işi kalıplarıyla tekrar edilir.
  - id: F4
    name_tr: Şikâyet etmek (Making complaints)
    exponents:
    - I don't like it when I have too many tasks.
    - It's not fair! Why do I always have to wash the dishes?
    - My room is always a mess because my brother never tidies up.
    - I'm fed up with doing the laundry.
    responses:
    - Don't make a fuss. We take turns.
    - OK, you don't have to do it today.
    - You're right. Let's share the chores equally.
    items:
    - U8-042
    - U8-043
    - U8-044
    - U8-010
    - U8-037
    - U8-040
    lgs_weight: orta
    note_tr: Ayrı bir işlev olarak doğrulanamadı (bkz. open_questions); ders kitabı s.98 "I don't like when I have too many tasks" cümlesine dayanır.
