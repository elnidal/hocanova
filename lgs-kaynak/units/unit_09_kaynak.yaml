grammar:
- id: G1
  name_tr: 'Simple Past: buluş ve keşif anlatımı'
  form: Özne + V2 (+ nesne) + in + yıl · Who + V2 …? · What / When did + özne + V1 …?
  examples:
  - Edison invented the light bulb in 1879.
  - Who discovered penicillin? – Alexander Fleming did.
  - When did Gutenberg invent the printing press?
  explain_tr: Geçmişte bitmiş buluş ve keşifler Simple Past ile anlatılır. Who özne olduğunda did kullanılmaz (Who invented …?); diğer soru kelimelerinde did + V1 gelir.
  common_errors:
  - wrong: Who did invent the telephone?
    right: Who invented the telephone?
    why_tr: Who özne ise yardımcı fiil yok.
  - wrong: When did Bell invented the telephone?
    right: When did Bell invent the telephone?
    why_tr: did varsa fiil yalın.
  - wrong: Edison invented the light bulb at 1879.
    right: Edison invented the light bulb in 1879.
    why_tr: Yıl için in.
  lgs_note: Bilim insanı – buluş – yıl tablosu sorularında "Which of the following is TRUE?"; çeldiriciler buluş ile kişiyi ya da yılı değiştirir.
  items:
  - U9-036
  - U9-020
  - U9-019
  - U9-004
- id: G2
  name_tr: Simple Past ile Present Continuous karşıtlığı
  form: 'Geçmiş: V2 (in 1928, years ago, last century) · Şimdi: am / is / are + V-ing (now, at the moment, currently, these days)'
  examples:
  - Fleming discovered penicillin in 1928, and now scientists are developing new medicines.
  - Researchers found some fossils last year; now they are working on them in the labs.
  - People used typewriters in the past, but today we are typing on smartphones.
  explain_tr: 'Kazanımın merkezi: aynı metinde geçmişte olan (bitmiş) ile şu an süren eylem. Zaman ifadesi hangi zamanın seçileceğini gösterir.'
  common_errors:
  - wrong: Now scientists work on a new vaccine.
    right: Now scientists are working on a new vaccine.
    why_tr: 'Şu an süren eylem: am / is / are + V-ing.'
  - wrong: In 1876 Bell is inventing the telephone.
    right: In 1876 Bell invented the telephone.
    why_tr: 'Geçmiş yıl: Simple Past.'
  lgs_note: Boşluk doldurma ve metin çıkarımında zaman ifadesi (in 1928 / now) doğru şıkkı belirler.
  items:
  - U9-039
  - U9-010
  - U9-008
- id: G3
  name_tr: Geçmiş zaman edilgen yapı (tanıma düzeyi)
  form: was / were + V3 (+ by + kişi) · The telephone was invented by Bell.
  examples:
  - The light bulb was invented by Edison.
  - Penicillin was discovered by Fleming in 1928.
  - The first books were printed on the printing press.
  explain_tr: Buluş öne çıkarılırken edilgen kullanılır; yapanı by ile verilir. Ü3'teki Simple Present Passive (is / are + V3) ile aynı mantık. LGS düzeyinde tanımak yeterli.
  common_errors:
  - wrong: The telephone invented by Bell.
    right: The telephone was invented by Bell.
    why_tr: was / were unutulmaz.
  - wrong: Penicillin was discover by Fleming.
    right: Penicillin was discovered by Fleming.
    why_tr: Edilgende V3.
  lgs_note: Okuma metninde edilgen cümle soruda etken olarak sorulur (Who invented …?); by'dan sonraki kişi cevaptır.
  items:
  - U9-037
  - U9-036
  - U9-019
- id: G4
  name_tr: 'Biyografi kalıpları: be born, pass away, at the age of'
  form: was / were born in + yer / yıl · grew up in … · studied … at … · died / passed away in … at the age of …
  examples:
  - Marie Curie was born in Warsaw in 1867.
  - She studied physics and chemistry in Paris.
  - Einstein passed away in 1955, at the age of 76.
  explain_tr: be born her zaman edilgendir ("doğdum" = I was born). pass away, die'ın kibar karşılığıdır. Yaş için at the age of.
  common_errors:
  - wrong: I born in 2012.
    right: I was born in 2012.
    why_tr: be born.
  - wrong: He died in the age of 76.
    right: He died at the age of 76.
    why_tr: at the age of.
  lgs_note: Biyografi paragrafından "Which of the following is NOT mentioned?" ya da kronoloji sorusu.
  items:
  - U9-038
  - U9-030
  - U9-029
- id: G5
  name_tr: Neden–sonuç bağlaçları
  form: because + cümle · because of / thanks to + isim · so / that's why / as a result + sonuç cümlesi
  examples:
  - Thanks to the printing press, books became cheaper.
  - The experiment failed because of a small mistake.
  - Vaccines protect us from diseases. That's why they are important.
  - He worked hard. As a result, he won the Nobel Prize.
  explain_tr: 'because ve because of farkı: cümle mi isim mi geliyor. thanks to olumlu sonuç (sayesinde) için. so / that''s why / as a result sonucu verir.'
  common_errors:
  - wrong: because of it was dangerous
    right: because it was dangerous
    why_tr: Cümleden önce because.
  - wrong: Thanks to the virus, many people got ill.
    right: Because of the virus, many people got ill.
    why_tr: thanks to olumlu sonuç için.
  lgs_note: Metin çıkarımında "Why …?" sorusunun cevabı bu bağlaçlardan sonra gelir; çeldirici sonucu neden gibi verir.
  items:
  - U9-040
  - U9-009
- id: G6
  name_tr: 'Sayılamayan isimler: knowledge, information, research, equipment'
  form: knowledge / information / research + tekil fiil · a piece of information
  examples:
  - Scientists share their knowledge.
  - This information is very useful.
  - They did a lot of research on DNA.
  explain_tr: Türkçede "bilgiler, araştırmalar" çoğul olabilir ama İngilizcede bu isimler sayılamaz; -s almaz, a / an almaz.
  common_errors:
  - wrong: He gained many knowledges.
    right: He gained a lot of knowledge.
    why_tr: knowledge sayılamaz.
  - wrong: She did a research.
    right: She did some research. / She did a study.
    why_tr: research sayılamaz.
  lgs_note: Doğrudan sorulmaz; ama şıklarda "informations" gibi biçimler yanlış seçenek olarak görülebilir.
  items:
  - U9-016
