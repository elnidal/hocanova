  kind: kaynak_hatasi
  trap_tr: B "make experiment" yazmış.
  tip_tr: do / conduct / carry out an experiment.
- about: discoverer = kâşif (A, B)
  kind: kaynak_hatasi
  trap_tr: A ve B discoverer'a "kâşif / kaşif" demiş.
  tip_tr: discoverer = keşfeden; kâşif çoğunlukla explorer (U6-055).
lgs_focus:
  what_is_tested:
  - 'Bilim insanı biyografisi / buluş metni: kim, ne zaman, ne icat etti / keşfetti'
  - Bilim insanı – buluş – yıl tablosu okuma
  - Geçmiş (Simple Past) ile şimdi (Present Continuous) karşıtlığı içeren metin çıkarımı
  - 'Neden–sonuç: Why …? sorusu (thanks to, because of, as a result)'
  - 'Kelime anlamı: experiment, result, achievement, award, cure, discover / invent ayrımı'
  question_patterns:
  - type: table_graph
    description_tr: Bilim insanı – buluş – yıl tablosu; doğru bilgi seçilir.
    sample_stem: 'According to the table, which of the following is TRUE? (Tablo: Edison – light bulb – 1879; Bell – telephone – 1876; Fleming – penicillin – 1928)'
    sample_options:
    - The telephone was invented before the light bulb.
    - Fleming invented the telephone.
    - Penicillin was discovered in 1879.
    - Edison discovered penicillin.
    distractor_logic_tr: Kişi–buluş–yıl eşlemesi kaydırılır; invent / discover karıştırılır.
    items:
    - U9-036
    - U9-037
    - U9-020
    - U9-026
  - type: text_infer
    description_tr: Kısa biyografi paragrafı; belirtilmeyen bilgi bulunur.
    sample_stem: 'Read the text: ''Aziz Sancar was born in Mardin in 1946. He studied medicine in Istanbul. Later, he did research on DNA repair in the USA and won the Nobel Prize in Chemistry in 2015.''
      Which question is NOT answered in the text?'
    sample_options:
    - How many children does he have?
    - Where was he born?
    - What did he study?
    - When did he win the Nobel Prize?
    distractor_logic_tr: Metinde açıkça cevaplanan biyografi soruları.
    items:
    - U9-038
    - U9-006
    - U9-030
    - U9-002
  - type: gap_fill
    description_tr: Geçmiş ve şimdi karşıtlığı; zaman ifadesine göre fiil.
    sample_stem: Fleming ---- penicillin in 1928, and today scientists ---- on new medicines.
    sample_options:
    - discovered / are working
    - discovers / worked
    - is discovering / work
    - discovered / worked
    distractor_logic_tr: Zaman ifadesini (in 1928 / today) göz ardı eden zaman eşleşmeleri.
    items:
    - U9-039
    - U9-010
    - U9-026
  - type: dialogue_complete
    description_tr: Bilim şenliği diyaloğunda boşluk.
    sample_stem: 'A: What are you working on? B: ---- A: Wow! I wonder if it works. B: Let''s find out!'
    sample_options:
    - We're doing an experiment with magnets.
    - I invented it last year.
    - I'm sorry to hear that.
    - It was discovered by Newton.
    distractor_logic_tr: Zamanı ya da işlevi uymayan tanıdık cümleler.
    items:
    - U9-010
    - U9-008
    - U9-017
    - U9-015
  - type: situation
    description_tr: 'Neden–sonuç: olumlu sonucun nedeni.'
    sample_stem: Many diseases disappeared ---- vaccines.
    sample_options:
    - thanks to
    - because
    - so
    - as a result
    distractor_logic_tr: because (cümle ister), so / as a result (sonuç bildirir).
    items:
    - U9-040
    - U9-028
    - U9-027
  - type: synonym
    description_tr: Altı çizili kelimenin anlamı.
    sample_stem: '''Marie Curie''s achievements changed science.'' The underlined word is closest in meaning to ----.'
    sample_options:
    - successes
    - experiments
    - mistakes
    - awards
    distractor_logic_tr: Aynı temanın kelimeleri (experiment, award) anlamca yakın görünür.
    items:
    - U9-029
    - U9-008
    - U9-030
  priority_items:
  - U9-001
  - U9-008
  - U9-009
  - U9-029
  - U9-030
  - U9-026
  - U9-027
  - U9-036
  - U9-037
  - U9-038
  - U9-039
  - U9-040
  - U9-010
  - U9-019
  - U9-011
  - U9-005
  - U9-002
  - U9-006
  - U9-022
  - U9-042
  tactics:
  - Biyografi metninde tarihleri ve yerleri önceden işaretle; soru çoğunlukla bunlardan gelir.
  - 'Boşlukta zaman ifadesine bak: in 1928 / last century → V2; now / at the moment / today → am / is / are + V-ing.'
  - 'invent (olmayanı yapmak) ile discover (var olanı bulmak) farkı: penicillin, gravity, America discover; telephone, light bulb invent.'
  - Edilgen cümlede by'dan sonraki kişi buluşun sahibidir.
  - Why …? sorusunda because, thanks to, that's why kelimelerinin çevresini oku.
  exam_vocabulary:
  - en: Which question is NOT answered in the text?
    tr: Metinde hangi sorunun cevabı yoktur?
  - en: according to the table
    tr: tabloya göre
  - en: best describes
    tr: en iyi tanımlar
  - en: closest in meaning
    tr: anlamca en yakın
  - en: in chronological order
    tr: kronolojik sırayla
