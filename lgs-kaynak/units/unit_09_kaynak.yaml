traps:
- about: experiment / experience / expert
  item: U9-008
  kind: benzer_yazilis
  trap_tr: Üçü karıştırılır.
  tip_tr: experiment = deney, experience = deneyim (U6-027), expert = uzman (U5-039).
- about: matter
  item: U9-013
  kind: cok_anlamli
  trap_tr: What's the matter? (Ne oldu?) ve It doesn't matter (Önemli değil) bilinir; bilimde madde.
  tip_tr: Bilim metninde matter = madde (solid, liquid, gas).
- about: medicine
  item: U9-006
  kind: cok_anlamli
  trap_tr: Yalnız "ilaç" bilinir.
  tip_tr: study medicine = tıp okumak; take medicine = ilaç almak.
- about: chemist
  item: U9-002
  kind: cok_anlamli
  trap_tr: İngiliz İngilizcesinde chemist's = eczane.
  tip_tr: Bilim metninde kimyager.
- about: physics / physician
  item: U9-003
  kind: sahte_dost
  trap_tr: physician fizikçi sanılır; aslında doktordur.
  tip_tr: fizikçi = physicist.
- about: found / find
  item: U9-022
  kind: benzer_yazilis
  trap_tr: found yalnız find'ın geçmişi sanılır.
  tip_tr: found–founded–founded = kurmak; find–found–found = bulmak.
- about: realize
  item: U9-046
  kind: turkce_etkisi
  trap_tr: Türkçedeki "realize etmek" (gerçekleştirmek) ile karışır.
  tip_tr: realize = farkına varmak.
- about: fact / opinion
  item: U9-014
  kind: cok_anlamli
  trap_tr: fact "gerçek" diye çevrilince real / true ile karışır.
  tip_tr: fact = kanıtlanabilir bilgi; opinion = görüş.
- about: space
  item: U9-005
  kind: cok_anlamli
  trap_tr: space yalnız uzay sanılır.
  tip_tr: There is no space = yer yok; travel to space = uzaya gitmek.
- about: brilliant
  item: U9-007
  kind: cok_anlamli
  trap_tr: Kaynaklarda yalnız "parlak".
  tip_tr: a brilliant scientist = çok zeki; a brilliant idea = harika.
- about: wonder / wander
  item: U9-017
  kind: benzer_yazilis
  trap_tr: wonder (merak etmek) ve wander (dolaşmak) karışır.
  tip_tr: I wonder why … = Merak ediyorum, neden …
- about: discuss about
  item: U9-011
  kind: dilbilgisi
  trap_tr: Türkçe "hakkında tartışmak" etkisiyle discuss about yazılır.
  tip_tr: discuss the results (edatsız).
- about: be born
  item: U9-038
  kind: dilbilgisi
  trap_tr: I born in … yazılır.
  tip_tr: I was born in …
- about: thanks to / because of
  item: U9-040
  kind: dilbilgisi
  trap_tr: thanks to olumsuz sonuçta da kullanılır.
  tip_tr: 'Olumlu sonuç: thanks to; nötr / olumsuz: because of.'
- about: award / reward
  item: U9-030
  kind: benzer_yazilis
  trap_tr: İkisi de "ödül" çevrilir.
  tip_tr: Nobel = award / prize; ev işi karşılığı = reward (U8).
- about: record
  item: U9-045
  kind: cok_anlamli
  trap_tr: record yalnız "rekor" sanılır.
  tip_tr: record the results = sonuçları kaydetmek.
- about: artifical (A)
  item: U9-021
  kind: kaynak_hatasi
  trap_tr: A "Artifical" yazmış.
  tip_tr: Doğrusu artificial.
- about: transform (A)
  kind: kaynak_hatasi
  trap_tr: A "transform = dönüşüm" yazmış.
  tip_tr: transform = dönüştürmek; dönüşüm = transformation.
- about: range (A)
  kind: kaynak_hatasi
  trap_tr: A "range = sıra" yazmış.
  tip_tr: range = aralık, yelpaze, çeşit (a wide range of …).
- about: physic (B)
