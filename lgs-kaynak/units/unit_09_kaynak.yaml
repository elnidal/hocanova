schema_version: 1
unit: 9
title: Science
status: taslak
summary_tr: Ünite, bilimsel buluşları, bilim insanlarını ve deneyleri konuşmayı öğretir. Programın işlevi geçmiş olayları anlatmaktır (Archimedes invented the water screw.); kazanımlar şu an ve geçmişte
  olan eylemleri birlikte anlatan metinleri de kapsar (Newton discovered gravity, and now scientists are exploring the solar system.). Çatı kelimelerin çoğu (invent U4, discover U7, explore U6, research
  U5, improve / develop U6) önceki ünitelerde öğretildi; bu ünite onları biyografi ve buluş metinlerinde tekrar eder, yeni olarak deney ve tıp dilini (experiment, observe, result, cure, disease), ödül ve
  başarı dilini (achievement, award / Nobel Prize) ve Simple Past – Present Continuous karşıtlığını, edilgen yapıyı (was invented by) tanıma düzeyinde ekler. LGS'de ünite en çok bilim insanı biyografisi
  / buluş metni okuma, "Who invented …?" bilgi eşleştirme, tablo (bilim insanı – buluş – yıl) ve neden–sonuç çıkarımı olarak gelir.
curriculum:
  outcomes:
  - code: E8.9.SP (kod doğrulanamadı)
    text_tr: 'Sözlü anlatım: Bilimsel başarılar hakkında basit biçimde bilgi sunar.'
  - code: E8.9.R (kod doğrulanamadı)
    text_tr: 'Okuma: Şu anda ve geçmişte olan eylemleri anlatan kısa ve basit metinleri anlar. (LGS''de doğrudan ölçülen kazanım türü)'
  - code: E8.9.R (kod doğrulanamadı)
    text_tr: 'Okuma: Bilimle ilgili kısa metinlerde ana fikri ve destekleyici ayrıntıları belirler.'
  - code: E8.9.W (kod doğrulanamadı)
    text_tr: 'Yazma: Bilimsel başarıları kısa bir paragrafta basitçe anlatır.'
  functions:
  - id: F1
    name_tr: 'Geçmiş olayları anlatmak: buluşlar ve keşifler (Talking about past events)'
    exponents:
    - Archimedes invented the water screw.
    - Who invented the telephone?
    - Alexander Graham Bell invented the telephone in 1876.
    - What did Marie Curie discover?
    - Fleming discovered penicillin in 1928.
    responses:
    - Graham Bell did.
    - She discovered radium.
    - He is the inventor of the light bulb.
    items:
    - U9-036
    - U9-020
    - U9-004
    - U9-019
    - U9-026
    lgs_weight: yüksek
    note_tr: Programın doğrulanan işlevi (ingilizcepedia 32. hafta planı). invent (U4-047) ve discover (U7-039) önceki ünitelerde; bu ünitede kalıp olarak tekrar edilir.
  - id: F2
    name_tr: Şu an olanla geçmişte olanı karşılaştırmak (actions happening now and in the past)
    exponents:
    - Researchers found some new fossils, and now they are working on them in the labs.
    - Newton discovered gravity, and now scientists are exploring the solar system.
    - What are scientists working on at the moment?
    - These days, engineers are developing artificial intelligence.
    responses:
    - They're working on a new vaccine.
    - They're doing experiments on Mars rocks.
    items:
    - U9-039
    - U9-010
    - U9-008
    - U9-021
    - U9-028
    lgs_weight: yüksek
    note_tr: Kazanım metninde açıkça var ("actions happening currently and in the past"); Simple Past ile Present Continuous aynı metinde.
  - id: F3
    name_tr: Bilim insanı biyografisi anlatmak (describing scientists' lives)
    exponents:
    - Where was he born?
    - When did she die?
    - He died in 1955, at the age of 76.
    - Aziz Sancar won the Nobel Prize in Chemistry in 2015.
    - Why did Aziz Sancar get the Nobel Prize?
    responses:
    - He was born in Germany in 1879.
    - She passed away in 1934.
    - Because he did important research on DNA repair.
    items:
    - U9-038
    - U9-030
    - U9-029
    - U9-002
    - U9-035
    - U9-032
    lgs_weight: yüksek
    note_tr: Soru kalıpları sayfasındaki biyografi soruları (R). Okuma sorularının çoğu bir biyografi paragrafından tarih / yer / buluş bilgisi ister.
  - id: F4
    name_tr: Süreç ve neden–sonuç anlatmak (cause and effect; passive recognition)
    exponents:
    - The printing press was invented by Gutenberg.
    - Thanks to vaccines, many diseases disappeared.
    - The experiment failed. As a result, they tried again.
    - Penicillin cures infections. That's why it is important.
    responses:
    - So, it changed the world.
    - Because of this invention, people could read more books.
    items:
    - U9-037
    - U9-040
    - U9-009
    - U9-026
    - U9-027
    lgs_weight: orta
    note_tr: Ders kitabı işlev listesinde ayrı başlık olarak doğrulanamadı; edilgen yapı ve "cause and effect" çıkmış tablosunda ve okuma metinlerinde geçiyor (bkz. open_questions).
