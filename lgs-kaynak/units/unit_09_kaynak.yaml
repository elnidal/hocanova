mini_lessons:
- type: tuzak
  text_tr: invent = olmayan bir şeyi ilk kez yapmak (telephone, light bulb); discover = var olanı bulmak (penicillin, gravity, radium).
  refs:
  - U9-036
  - U9-004
  - U9-020
- type: mini_dilbilgisi
  text_tr: 'Who özne ise did yok: Who invented the telephone? Ama: When did Bell invent it?'
  refs:
  - U9-036
- type: mini_dilbilgisi
  text_tr: 'Edilgen geçmiş: was / were + V3 + by. The light bulb was invented by Edison.'
  refs:
  - U9-037
- type: tuzak
  text_tr: experiment = deney, experience = deneyim, expert = uzman. Üçü aynı harflerle başlar, anlamları farklı.
  refs:
  - U9-008
- type: mini_dilbilgisi
  text_tr: Doğdum = I was born (I born değil). Öldü (kibar) = passed away. Yaşında = at the age of.
  refs:
  - U9-038
- type: lgs_taktigi
  text_tr: Boşlukta "in 1928" görürsen V2, "now / at the moment" görürsen am / is / are + V-ing seç.
  refs:
  - U9-039
- type: mini_dilbilgisi
  text_tr: because + cümle, because of + isim; thanks to = sayesinde (olumlu sonuç).
  refs:
  - U9-040
- type: tuzak
  text_tr: matter bilimde "madde"; What's the matter? = Ne oldu?; It doesn't matter = Önemli değil.
  refs:
  - U9-013
- type: kelime_ailesi
  text_tr: science → scientist → scientific; chemistry → chemist → chemical; physics → physicist (physician = doktor!).
  refs:
  - U9-001
  - U9-002
  - U9-003
- type: tuzak
  text_tr: found–founded = kurmak; find–found = bulmak. He founded a company ≠ He found a company.
  refs:
  - U9-022
  - U9-015
- type: ilginc_bilgi
  text_tr: Aziz Sancar, 2015 Nobel Kimya Ödülü'nü DNA onarımı araştırmalarıyla Tomas Lindahl ve Paul Modrich ile paylaştı.
  refs:
  - U9-030
  - U9-002
- type: tuzak
  text_tr: realize = farkına varmak; Türkçedeki "realize etmek" (gerçekleştirmek) ile karıştırma.
  refs:
  - U9-046
open_questions:
- W (ingilizcedilbilgisi.net 9. ünite kelime listesi, ~330 satır) erişilemedi; havuz A + B + çıkmış tablosu + R ile kuruldu. Liste yapıştırılırsa eksik ÇEKİRDEK adayı kontrol edilmeli.
- E8.9 kazanım kodları doğrulanamadı; kazanım metinleri ingilizcepedia 32. hafta günlük planından (kodsuz) alındı.
- Edilgen yapı (was invented by) ve neden–sonuç bağlaçları programda ayrı işlev olarak doğrulanamadı; okuma metinleri ve çıkmış tablosuna (cause and effect, as a result of) dayanıyor.
- Ünitenin çatı kelimeleri (invent, discover, explore, research, improve) önceki ünitelerde olduğu için birim sayısı 46. invent / discover ailelerini Ü9'da ayrı "tekrar birimi" yapmak ister misiniz?
- Sınırda kalan tek kaynaklılar TANIMA bırakıldı (transform, generate, durable, milestone, store information, compass, typewriter); istenirse birime çevrilebilir.
