schema_version: 1
unit: 7
title: Tourism
status: taslak
summary_tr: Ünite, turistik yerleri tanıtma ve gezi deneyimini konuşma üzerine kuruludur. Programın işlevleri yerleri betimleme (What is Mardin like? – It is an ancient and charming city), karşılaştırma,
  deneyimden söz etme (Have you ever been to Cappadocia? – Yes, I have. / No, I have never been there), tercih bildirme ve gerekçe sunmadır (I'd rather visit historic sites because they are usually more
  interesting). Kelime gövdesi yer türleri (seaside, countryside, square, port, island), konaklama (accommodation, all-inclusive, bed and breakfast, guesthouse), tarih ve mimari (ancient, architecture,
  construction, conquer, emperor, heritage) ve betimleme sıfatlarıdır (incredible, enormous, remarkable, charming, crowded). Karşılaştırma ve tercih yapıları Ü6'da öğretildi; bu ünitede yeni yerler ve sıfatlarla
  tekrar edilir. LGS'de ünite en çok tatil broşürü/ilanı okuma, iki ya da üç şehri karşılaştıran tablo, kartpostal/e-posta çıkarımı ve "Have you ever been …? / What do you think about …?" diyaloğu tamamlama
  olarak gelir.
curriculum:
  outcomes:
  - code: E8.7.L1
    text_tr: 'Dinleme: Kısa ve basit sözlü metinlerdeki belirli bilgiyi anlar ve çıkarır.'
  - code: E8.7.SI1
    text_tr: 'Karşılıklı konuşma: Turizm hakkında bilgi alışverişinde bulunur.'
  - code: E8.7.SI2
    text_tr: 'Karşılıklı konuşma: En sevdiği turistik yerleri ayrıntı vererek anlatır.'
  - code: E8.7.SP1
    text_tr: 'Sözlü anlatım: Belirli turistik yerlere ilişkin tercihlerini bildirir ve gerekçesini söyler.'
  - code: E8.7.R1
    text_tr: 'Okuma: Turizmle ilgili çeşitli metinlerde belirli bilgiyi bulur. (LGS''de doğrudan ölçülen kazanım; ilçe dağılım tablosunda 3+1 soru)'
  - code: E8.7.W1
    text_tr: 'Yazma: En sevdiği turistik yer(ler) için broşür, reklam ya da kartpostal tasarlar.'
  functions:
  - id: F1
    name_tr: Yerleri betimlemek (Describing places)
    exponents:
    - What is Mardin like?
    - What's the weather like in Antalya in summer?
    - What's the climate like?
    - What is Şanlıurfa famous for?
    - What are the tourist attractions?
    - Where is it located?
    responses:
    - It's an ancient city with magnificent architecture.
    - It is hot and sunny. The climate is Mediterranean.
    - It's famous for its delicious kebab and historic sites.
    - There is an enormous square and a beautiful fountain.
    - It's located in the south-east of Turkey.
    items:
    - U7-059
    - U7-056
    - U7-027
    - U7-001
    - U7-026
    - U7-030
    - U7-031
    - U7-023
    - U7-024
    - U7-050
    - U7-055
    lgs_weight: yüksek
    note_tr: Broşür ve şehir tanıtım metinlerinin dili. What is … like? sorusunun cevabı sıfattır (Do you like …? değil).
  - id: F2
    name_tr: Deneyimden söz etmek (Talking about experiences)
    exponents:
    - Have you ever been to Cappadocia?
    - Have you ever been abroad?
    - Did you enjoy your trip?
    - How long did you stay there?
    - What did you do while you were there?
    - What did you like the most about it?
    responses:
    - Yes, I have. I went there last summer.
    - No, I haven't. I've never been abroad.
    - Yes, it was incredible!
    - We stayed there for a week.
    - We went sightseeing and bought souvenirs.
    - The hospitality of the local people.
    items:
    - U7-057
    - U7-058
    - U7-004
    - U7-003
    - U7-005
    - U7-008
    - U7-045
    - U7-053
    - U7-049
    lgs_weight: yüksek
    note_tr: Programda "Talking about experiences" (Grade 8.7.1) olarak geçer. Have you ever been …? sabit kalıp olarak öğretilir; ayrıntı Simple Past ile verilir (Yes, I have. I went there in 2023).
  - id: F3
    name_tr: Tercih bildirmek ve gerekçe sunmak (Expressing preferences / Giving reasons)
    exponents:
    - Which one do you prefer, visiting historic sites or going to the seaside?
    - Do you prefer sightseeing or a beach vacation?
    - Would you rather stay in a hotel or a guesthouse?
    - What type of places do you prefer? Why?
    responses:
    - I'd rather visit historic sites because they are usually more interesting.
    - I prefer rural places. I think they are peaceful.
    - I prefer staying in a guesthouse because it is cheaper.
    - I'd rather go to the seaside because I love sunbathing.
    items:
    - U7-018
    - U7-020
    - U7-016
    - U7-005
    - U7-002
    - U7-012
    lgs_weight: yüksek
    note_tr: Yapılar Ü6'da öğretildi (U6-035 prefer … to, U6-036 would rather, U6-037 Why – Because). Bu ünitede yer ve konaklama türleriyle tekrar edilir.
  - id: F4
    name_tr: Karşılaştırma yapmak (Making comparisons)
    exponents:
    - Antalya is more crowded than Mardin in summer.
    - Istanbul is the most crowded city in Turkey.
    - Phuket has more accommodation options than Mostar.
    - Which city is cheaper?
    responses:
    - Mardin is quieter and more charming.
    - I think the seaside is more relaxing than the city.
    items:
    - U7-052
    - U7-055
    - U7-013
    - U7-019
    - U7-018
    - U7-028
    lgs_weight: yüksek
    note_tr: Karşılaştırma ve üstünlük Ü6'da (U6-033, U6-034). LGS'de en sık iki-üç şehri karşılaştıran tablo olarak gelir.
  - id: F5
    name_tr: Görüş bildirmek (Stating personal opinions)
    exponents:
    - What do you think about Rome?
    - To me, everybody should definitely go there.
    - In my opinion, it is a must-see place.
    - I guess / I suppose / I believe …
    responses:
    - To me, it's a fascinating city.
    - I think it's worth seeing.
    items:
    - U7-060
    - U7-061
    - U7-054
    lgs_weight: orta
    note_tr: 'MEB Useful Language: What do you think about Rome? In my opinion (U2-005) ve I guess (U4-021) önceki ünitelerde.'
