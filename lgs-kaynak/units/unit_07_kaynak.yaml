grammar:
- id: G1
  name_tr: 'Deneyim sorma: Have you ever been to …? (kalıp düzeyi)'
  form: Have you ever been to + yer? – Yes, I have. / No, I haven't. · I have been to … · I have never been to …
  examples:
  - Have you ever been to Ephesus? – Yes, I have. I went there last year.
  - Have you ever been abroad? – No, I haven't. I've never been abroad.
  - I have been to England twice.
  explain_tr: Hayatında herhangi bir zaman bir yere gidip gitmediğini sorar; ne zaman olduğu söylenmez. Zaman söylenince Simple Past'a geçilir (I went there in 2024). 8. sınıf programında Present Perfect
    dilbilgisi konusu yok; bu yüzden kalıp olarak ezberlenir, have/has + V3 kuralı öğretilmez.
  common_errors:
  - wrong: Have you ever gone to Rome?
    right: Have you ever been to Rome?
    why_tr: been to = gidip dönmüş; gone to = gitti, hâlâ orada.
  - wrong: Have you ever been to abroad?
    right: Have you ever been abroad?
    why_tr: abroad zarftır, to almaz.
  - wrong: Yes, I have been. I have been there last year.
    right: Yes, I have. I went there last year.
    why_tr: last year gibi geçmiş zaman ifadesi Simple Past ister.
  lgs_note: Diyalog tamamlamada "Have you ever been to …?" sorusuna "Yes, I have / No, I haven't" ve ardından Simple Past ayrıntı gelir; çeldiriciler "Yes, I do / Yes, I did" olur.
  items:
  - U7-057
  - U7-004
- id: G2
  name_tr: 'Betimleme sorusu: What is … like?'
  form: What is/are + yer/şey + like? → It is/They are + sıfat
  examples:
  - What's Safranbolu like? – It's a charming town with old mansions.
  - What's the weather like in Bodrum? – It's hot and sunny.
  - What's the climate like in Erzurum? – It's cold in winter.
  explain_tr: 'like burada "sevmek" değil, edat ("gibi"): "… nasıl bir yer/şey?" Cevap sıfatla verilir. "What do you like?" (neyi seversin) ile karıştırılır.'
  common_errors:
  - wrong: What is Safranbolu like? – Yes, I like it.
    right: It's a charming and historic town.
    why_tr: Soru betimleme ister, beğeni değil.
  - wrong: How is the climate like?
    right: What is the climate like? / How is the weather?
    why_tr: like ile What kullanılır; How ile like birlikte kullanılmaz.
  lgs_note: Broşür ve kartpostal sorularında "What is the weather like?" ve "What is the climate?" cevabı metinden bulunur.
  items:
  - U7-059
  - U7-027
- id: G3
  name_tr: 'Geçmiş geziyi anlatma: Simple Past'
  form: Did you + V1 …? / How long did you stay? / Where did you stay? · We visited / stayed / tried / bought / took …
  examples:
  - Did you enjoy your trip? – Yes, it was unforgettable.
  - We stayed in a guesthouse for three nights.
  - We tasted local dishes and bought souvenirs.
  explain_tr: 'Kartpostal, gezi blogu ve diyaloglarda bitmiş gezi Simple Past ile anlatılır. Sık düzensiz fiiller: go-went, see-saw, buy-bought, take-took, eat-ate, fly-flew, spend-spent, leave-left.'
  common_errors:
  - wrong: Did you enjoyed your trip?
    right: Did you enjoy your trip?
    why_tr: did varsa fiil yalın kalır.
  - wrong: We buyed souvenirs.
    right: We bought souvenirs.
    why_tr: buy düzensizdir.
  lgs_note: Gezi metni sorularında "Where did they stay? / What did they taste? / How long did they stay?" bilgisi metinde aranır.
  items:
  - U7-058
  - U7-003
  - U7-008
  - U7-046
- id: G4
  name_tr: Tarih metinlerinde edilgen yapı (tanıma düzeyi)
  form: was/were + V3 (by …) · be located in
  examples:
  - The Colosseum was built in 80 AD.
  - Istanbul was conquered by Mehmed II in 1453.
  - Ephesus is located near Selçuk.
  - The city was abandoned after an earthquake.
  explain_tr: Okuma metinleri yapının kim tarafından değil, ne zaman yapıldığını söylerken edilgen kullanır. Öğrencinin yapıyı üretmesi gerekmez; "was built = inşa edildi" diye tanıması yeter.
  common_errors:
  - wrong: The Colosseum built in 80 AD.
    right: The Colosseum was built in 80 AD.
    why_tr: Yapı kendini inşa etmez; edilgen was + V3.
  lgs_note: Metin sorularında "When was it built? / Who conquered the city?" bilgisi edilgen cümlede saklıdır.
  items:
  - U7-032
  - U7-036
  - U7-026
  - U7-038
  - U7-041
- id: G5
  name_tr: Yerleri karşılaştırma ve tercih (Ü6 tekrarı)
  form: A is more + sıfat / sıfat-er than B · the most / the -est · prefer + V-ing · would rather + V1 + because …
  examples:
  - The countryside is more peaceful than the city.
  - Istanbul is the most crowded city in Turkey.
  - I'd rather stay in a bed and breakfast because it's cheaper than a hotel.
  explain_tr: Yeni sıfatlar (crowded, charming, enormous, remarkable) Ü6 yapılarıyla kullanılır. crowded → more crowded (the most crowded); -ed ile biten sıfat -er almaz.
  common_errors:
  - wrong: Antalya is crowdeder than Mardin.
    right: Antalya is more crowded than Mardin.
    why_tr: -ed ile biten sıfat more alır.
  - wrong: I'd rather to visit museums.
    right: I'd rather visit museums.
    why_tr: would rather + yalın fiil.
  lgs_note: Tablo sorusunda iki şehrin nüfus, fiyat, sıcaklık değerleri karşılaştırılır; çeldiriciler karşılaştırmayı ters kurar.
  items:
  - U7-052
  - U7-055
  - U7-050
  - U7-028
  - U7-018
  - U7-019
- id: G6
  name_tr: be famous for · worth + V-ing · birleşik sıfatlar
  form: be famous for + isim · be worth + V-ing · must-see / all-inclusive (birleşik sıfat, tire ile)
  examples:
  - Konya is famous for its whirling dervishes.
  - Pamukkale is definitely worth visiting.
  - Ephesus is a must-see place.
  - We stayed in an all-inclusive hotel.
  explain_tr: famous for "… ile ünlü" (for + isim); famous as "… olarak ünlü". worth'ten sonra fiil -ing alır (U3-059 worth trying ile aynı). İsimden önce gelen birleşik sıfat tireyle yazılır.
  common_errors:
  - wrong: Şanlıurfa is famous with its kebab.
    right: Şanlıurfa is famous for its kebab.
    why_tr: Türkçe "ile" with'e çevrilmez.
  - wrong: It is worth to see.
    right: It is worth seeing.
    why_tr: worth + V-ing.
