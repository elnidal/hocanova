mini_lessons:
- type: mini_dilbilgisi
  text_tr: been to = gidip dönmüş; gone to = gitmiş, hâlâ orada. "Have you ever been to Paris?" ama "Where is Ali? – He has gone to Paris."
  refs:
  - U7-057
- type: tuzak
  text_tr: 'What is İzmir like? "İzmir''i sever misin?" değil, "İzmir nasıl bir yer?" demektir. Cevap sıfat: It''s lively and charming.'
  refs:
  - U7-059
- type: tuzak
  text_tr: 'abroad zarftır: go abroad, live abroad, study abroad. "go to abroad" yanlış.'
  refs:
  - U7-004
- type: kelime_ailesi
  text_tr: 'attract (çekmek) → attraction (gezilecek yer) → attractive (çekici). Mıknatıs gibi turist çeken yer: tourist attraction.'
  refs:
  - U7-001
- type: hafiza_kancasi
  text_tr: 'accommodation çok büyük bir kelime, çünkü içinde iki oda var: çift c, çift m.'
  refs:
  - U7-013
- type: tuzak
  text_tr: 'square = kare; ama şehirde meydan: Times Square, Konak Square. busy = meşgul; ama yer için kalabalık: a busy street.'
  refs:
  - U7-023
  - U7-052
- type: mini_dilbilgisi
  text_tr: 'Tarih metinlerinde "was built / was conquered / is located" kalıplarını tanı: "inşa edildi / fethedildi / bulunur". Üretmen gerekmez.'
  refs:
  - U7-032
  - U7-036
  - U7-026
- type: tuzak
  text_tr: climate = bir yerin yıllar boyunca havası (Mediterranean climate); weather = bugünkü hava (The weather is rainy today).
  refs:
  - U7-027
- type: lgs_taktigi
  text_tr: Broşür sorusunda "NOT mentioned" varsa her şıkkın broşürde karşılığını işaretle; işaretsiz kalan şık cevaptır.
  refs:
  - U7-009
- type: mini_dilbilgisi
  text_tr: famous for + isim (famous for its handicrafts); worth + V-ing (worth visiting). Türkçe "ile ünlü" yüzünden "famous with" yazma.
  refs:
  - U7-056
  - U7-061
- type: ilginc_bilgi
  text_tr: Efes Antik Kenti 2015'te UNESCO Dünya Mirası Listesi'ne alındı; büyük tiyatrosu yaklaşık 25.000 kişiliktir.
  refs:
  - U7-040
  - U7-030
  - U7-010
- type: tuzak
  text_tr: 'ancient ≠ old: ancient binlerce yıllık (ancient city), old günlük eski (old building). Kaynak listelerde ikisi de "eski" yazıyor.'
  refs:
  - U7-030
open_questions:
- Have you ever been to …? KALIP birimi yapıldı (Ü6'da TANIMA idi). Present Perfect dilbilgisi olarak öğretilmeden sabit kalıp olarak kalsın mı? Kalırsa Ü6 kararı da güncellenmeli.
- MEB programının resmî PDF'i açılamadı; kazanım kodları (E8.7.L1, SI1, SI2, SP1, R1, W1) öğretmen planları ve ilçe dağılım tablosundan doğrulandı, metinler oradan çevrildi. Tam Useful Language listesi
  resmî programdan kontrol edilmeli.
- Çıkmış kelime tablosu 2013–2019 TEOG ve 2018–2019 LGS'yi kapsıyor (ingilizcedilbilgisi.net). 2020–2025 LGS soruları doğrulanmadı.
- charming ve temperature kaynak listelerde yok; yalnız çıkmış kelime tablosundan eklendi (charming ayrı birim, temperature climate birimine bağlı). Onaylanıyor mu?
- destination (U6-041) ve historic sites (U6-045) Ü7'nin merkez kelimeleri ama Ü6'da öğretildi; ÖNCEKİ ÜNİTE sayıldı. Ü7'de ayrı birim istenir mi?
- season.yaml Ü7 çerçevesindeki Saat Kulesi, Kemeraltı (bazaar), Asansör ve ruins kaynaklarda yok; birim yapılmadı.
- Hikâye/gün dosyası yazılmadı (kullanıcı kararı); story_hooks yalnız durum fikri, gün gruplaması yok.
