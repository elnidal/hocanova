traps:
- about: square
  item: U7-023
  kind: cok_anlamli
  trap_tr: square "kare" diye bilinir.
  tip_tr: 'Şehir bağlamında meydan: Times Square, Konak Square.'
- about: busy street
  item: U7-052
  kind: cok_anlamli
  trap_tr: busy = meşgul (U1-004).
  tip_tr: 'Yer için busy = kalabalık, hareketli: a busy street.'
- about: country
  item: U7-018
  kind: cok_anlamli
  trap_tr: country = ülke.
  tip_tr: 'the country / the countryside = kırsal kesim: live in the country.'
- about: What is … like?
  item: U7-059
  kind: dilbilgisi
  trap_tr: '"like" sevmek sanılır, cevap "Yes, I like it" verilir.'
  tip_tr: 'Soru betimleme ister: cevap sıfat.'
- about: been to / gone to
  item: U7-057
  kind: dilbilgisi
  trap_tr: İkisi de "gitti" sanılır.
  tip_tr: been to = gidip döndü; gone to = gitti, şu an orada.
- about: abroad
  item: U7-004
  kind: dilbilgisi
  trap_tr: '"go to abroad" (Türkçe "yurt dışına").'
  tip_tr: 'abroad zarftır: go abroad, live abroad.'
- about: travel
  item: U7-003
  kind: dilbilgisi
  trap_tr: '"I had a nice travel."'
  tip_tr: 'Sayılabilir isim olarak trip: I had a nice trip.'
- about: climate / weather
  item: U7-027
  kind: cok_anlamli
  trap_tr: İkisi de "hava" diye çevrilir.
  tip_tr: climate = uzun süreli iklim; weather = bugünkü hava.
- about: historic / historical
  kind: benzer_yazilis
  trap_tr: İkisi de "tarihi".
  tip_tr: historic = tarihte önemli (historic site, U6-045); historical = tarihle ilgili (historical architecture, historical novel).
- about: ancient / old
  item: U7-030
  kind: turkce_etkisi
  trap_tr: İkisi de "eski".
  tip_tr: ancient binlerce yıllık (ancient city); old günlük eski (old building).
- about: date back to
  item: U7-041
  kind: cok_anlamli
  trap_tr: date = tarih / randevu.
  tip_tr: 'date back to = geçmişi …-e uzanır: It dates back to 3000 BC.'
- about: famous for / famous with
  item: U7-056
  kind: turkce_etkisi
  trap_tr: '"… ile ünlü" → famous with.'
  tip_tr: famous for its kebab.
- about: spectator / visitor
  item: U7-010
  kind: cok_anlamli
  trap_tr: İkisi de "gelen kişi".
  tip_tr: spectator gösteriyi izler (amfitiyatroda 25.000 spectators); visitor yeri gezer.
- about: accommodation (yazım)
  item: U7-013
  kind: benzer_yazilis
  trap_tr: '"accomodation" yazımı yaygın.'
  tip_tr: 'çift c, çift m: acCoMModation; sayılamaz.'
- about: souvenir (kaynak I)
  item: U7-008
  kind: kaynak_hatasi
  trap_tr: I listesi "hatırat" diyor.
  tip_tr: souvenir = hediyelik eşya, gezi hatırası.
- about: natural heritage (kaynak I)
  item: U7-040
  kind: kaynak_hatasi
  trap_tr: I listesi "kültürel miras" diyor.
  tip_tr: natural heritage = doğal miras; cultural heritage = kültürel miras.
- about: magnificent / fragrant / truly / locate (kaynak I)
  kind: kaynak_hatasi
  trap_tr: magnificent = "büyüleyici", fragrant = "hoş", truly = "doğru biçimde", locate = "yerleşmek".
  tip_tr: muhteşem; güzel kokulu; gerçekten; konumlanmak / yerini bulmak.
- about: would rather (kaynak B)
  kind: kaynak_hatasi
  trap_tr: B listesi "tercih etmek" diyor.
  tip_tr: would rather = -meyi yeğlemek; yapısı prefer'den farklı (would rather + V1).
- about: bed and breakfast
  item: U7-015
  kind: turkce_etkisi
  trap_tr: Kelime kelime "yatak ve kahvaltı".
  tip_tr: Oda + kahvaltı veren küçük otel, pansiyon.
lgs_focus:
  what_is_tested:
  - 'Tatil broşürü / otel ilanı: fiyat, konaklama türü, etkinlikler, en iyi zaman → doğru bilgi ya da "verilmeyen bilgi" (en sık)'
  - İki-üç şehri karşılaştıran tablo (nüfus, sıcaklık, turistik yer, konaklama) → doğru karşılaştırma cümlesi
  - 'Kartpostal / e-posta / gezi blogu: nerede kaldı, ne yaptı, hava nasıl, ne aldı → çıkarım'
  - 'Diyalog tamamlama: Have you ever been to …? / What is it like? / What do you think about …? / Which one do you prefer? Why?'
  - 'Kelime anlamı: fascinating, charming, ancient, accommodation, sightseeing, souvenir, climate'
  - 'Tercih + gerekçe: kişinin söylediği nedene uygun tatil türü'
  question_patterns:
  - type: text_infer
    description_tr: Otel/tur broşürü → hangisi broşürde verilmemiştir / doğrudur.
    sample_stem: 'Sunny Bay Resort — All-inclusive · 5 nights · 400 € per person · Activities: water sports, boat trips, folk dance shows · Best time to visit: May–September. Which of the following is NOT
      mentioned in the brochure?'
    sample_options:
    - How to get to the resort
    - The price of the holiday
    - The type of accommodation
    - Recreational activities
    distractor_logic_tr: Üç şık broşürdeki satırların eş anlamlısıdır (price ↔ 400 €, accommodation ↔ all-inclusive, activities); doğru cevap ulaşım (transportation) satırının olmamasıdır.
    items:
    - U7-009
    - U7-014
    - U7-013
    - U7-012
    - U7-011
    - U7-047
  - type: table_graph
    description_tr: Şehirleri karşılaştıran tablo → doğru karşılaştırma.
    sample_stem: 'Table — Mardin: population 870,000, average summer temperature 34°C, famous for ancient architecture · Bodrum: population 200,000, 30°C, famous for seaside and cruises · Safranbolu: population
      70,000, 28°C, famous for old mansions. According to the table, which of the following is TRUE?'
    sample_options:
    - Bodrum is more crowded than Safranbolu.
    - Safranbolu is hotter than Mardin in summer.
    - Mardin is famous for its seaside.
    - Bodrum has the biggest population.
    distractor_logic_tr: Çeldiriciler karşılaştırmayı ters kurar (hotter), özelliği yanlış şehre verir (seaside) ya da üstünlüğü yanlış satıra bağlar.
    items:
    - U7-028
    - U7-027
    - U7-052
    - U7-056
    - U7-030
    - U7-033
    - U7-020
  - type: dialogue_complete
    description_tr: Deneyim sorusu → uygun cevap.
    sample_stem: 'Selin: Have you ever been to Cappadocia? — Kaan: ______ We stayed in a cave hotel for three nights. — Selin: Wow! Did you enjoy it?'
    sample_options:
    - Yes, I have. I went there last spring.
    - No, I haven't. I've never been there.
    - Yes, I do. I love it.
    - I'd rather go to the seaside.
    distractor_logic_tr: Arkadan gelen "We stayed …" bilgisi olumsuz cevabı eler; "Yes, I do" yardımcı fiil uyumsuz; tercih cümlesi soruyu cevaplamaz.
    items:
    - U7-057
    - U7-058
  - type: message_infer
    description_tr: Kartpostal → yazar hakkında hangisi söylenebilir.
    sample_stem: Hi Duru! Greetings from Mostar! I'm staying in a small guesthouse near the old bridge. The weather is warm and sunny. Yesterday we went sightseeing and I bought some handmade souvenirs.
      The local people are so hospitable! Wish you were here. – Ece. According to the postcard, Ece ______.
    sample_options:
    - thinks the people in Mostar are welcoming
    - is staying in an all-inclusive hotel
    - complains about the weather
    - has been to Mostar before
    distractor_logic_tr: hospitable ↔ welcoming eşleşmesi doğru cevaptır; guesthouse ↔ all-inclusive konaklama türü karıştırılır; sunny ↔ complain çelişir; "daha önce gitti" bilgisi metinde yok.
    items:
    - U7-016
    - U7-005
    - U7-008
    - U7-045
    - U7-046
  - type: situation
    description_tr: Gerekçe → uygun tatil tercihi.
    sample_stem: Bora hates crowded places and loves nature. He wants a quiet holiday. Which of the following is the best place for him?
    sample_options:
    - a guesthouse in the countryside
    - a hotel near the busiest square in the city
    - an all-inclusive resort with loud parties
    - a cruise with 3,000 passengers
    distractor_logic_tr: Çeldiricilerin hepsi "crowded" kavramının eş anlamlısını taşır (busiest, loud, 3,000 passengers).
    items:
    - U7-018
    - U7-016
    - U7-052
    - U7-023
    - U7-006
  - type: synonym
    description_tr: Altı çizili kelimenin anlamı.
    sample_stem: The Great Wall of China is an enormous structure. It is about 21,000 km long. The underlined word is closest in meaning to ______.
    sample_options:
    - huge
    - ancient
    - crowded
    - charming
    distractor_logic_tr: Diğer şıklar aynı metne uyabilecek sıfatlardır (ancient da doğru olabilir ama anlamca eş değil); uzunluk bilgisi "büyüklük" ipucudur.
    items:
    - U7-050
    - U7-030
    - U7-055
