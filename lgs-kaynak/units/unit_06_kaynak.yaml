schema_version: 1
unit: 6
title: Adventures
status: taslak
summary_tr: 'Ünite, macera ve ekstrem sporlar üzerinden üç işlevi öğretir: karşılaştırma (I think bungee jumping is more dangerous and challenging than canoeing), tercih bildirme (Which one do you prefer?
  / Would you rather go rafting or caving? – I''d rather go caving) ve gerekçe sunma (Why? – Because it is more amusing). Kelime gövdesi spor adları (skydiving, paragliding, scuba diving, caving, rock climbing),
  tehlike–güvenlik dili (dangerous, take risks, accident, survive, safety equipment, helmet, life jacket) ve macera sıfatlarıdır (challenging, amusing, disappointing, mysterious, magnificent). Dilbilgisi
  yükü karşılaştırma ve üstünlük sıfatlarıdır (-er/more … than, the -est/the most; good–better–the best), yanında prefer A to B, would rather + yalın fiil ve because. LGS''de bu ünite en çok iki etkinliği
  karşılaştıran tablo/grafik, tercih diyaloğu tamamlama, bir sporu tanıtan kısa metin (gereken ekipman, yaş, tehlike) ve "hangisi doğru karşılaştırma?" soruları olarak gelir.'
curriculum:
  outcomes:
  - code: E8.6.SP1
    text_tr: 'Sözlü anlatım: Basit betimleyici dil kullanarak spor ve oyunları karşılaştırır. (doğrulandı: öğretmen günlük planı, ingilizcepedia)'
  - code: E8.6.R1
    text_tr: 'Okuma: Maceralarla ilgili kısa ve basit metinlerde ana noktaları bulur. (doğrulandı; LGS''de doğrudan ölçülen kazanım)'
  - code: E8.6.(L/SI/W)
    text_tr: Dinleme, karşılıklı konuşma ve yazma kazanımları (maceralarla ilgili tartışmaları izleme, kısa karşılaştırma paragrafı yazma) program özetinde var; kodları ve tam metinleri doğrulanmadı (open_questions).
  functions:
  - id: F1
    name_tr: Karşılaştırma yapmak (Making simple comparisons)
    lgs_weight: yüksek
    exponents:
    - I think bungee jumping is more dangerous and challenging than canoeing.
    - I think extreme sports are more exciting than indoor sports.
    - I think underwater hockey is safer than surfing.
    - Paragliding is less dangerous than base jumping.
    - Skydiving is the most exciting sport for me.
    - What's your craziest dream adventure?
    responses:
    - I agree. It's also more expensive.
    - I don't think so. Canoeing is more challenging.
    - Really? For me, caving is the most frightening one.
    items:
    - U6-033
    - U6-034
    - U6-011
    - U6-028
    - U6-031
    - U6-032
    - U6-002
    note_tr: Programın açıkça verdiği Useful Language bu işlevdir. Sıfatlar ünitenin kendi sıfatlarıdır (dangerous, challenging, amusing) ve Ü1/Ü2'den gelenler (exciting, boring, fascinating). Ü2'deki more
      than / less than (U2-090) sayı/anket diliydi; burada sıfatla kurulur.
  - id: F2
    name_tr: Tercih bildirmek (Expressing preferences)
    lgs_weight: yüksek
    exponents:
    - Which one do you prefer, rafting or canoeing?
    - Which extreme sports do you prefer?
    - What do you prefer doing on summer holidays?
    - Would you rather ride a horse or ride a camel?
    - Which one would you rather do?
    responses:
    - I prefer rafting to canoeing.
    - I prefer doing water sports.
    - I'd rather ride a camel.
    - I'd rather go caving than go skydiving.
    - Neither. I'd rather stay in the tent!
    items:
    - U6-035
    - U6-036
    - U6-004
    note_tr: 'prefer Ü1''de kelime olarak öğretildi (U1-018); yeni olan prefer A to B ve would rather + yalın fiil yapılarıdır. Kalıp listesinde (K) 8 ayrı tercih sorusu var: ünitenin en sık işlevi.'
  - id: F3
    name_tr: Gerekçe sunmak, açıklama yapmak (Giving reasons / explanations)
    lgs_weight: yüksek
    exponents:
    - Why do you prefer it?
    - Why did you like it?
    - What's the best way to get there? Why?
    - Why do you think he is an adventurer?
    responses:
    - Because it is more amusing.
    - Because I like taking risks.
    - Because it's safer and cheaper than flying.
    - I mean, he always tries new and dangerous things.
    items:
    - U6-037
    - U6-033
    - U6-012
    note_tr: Gerekçe neredeyse her zaman karşılaştırma içerir (Because it is more …). Açıklama kalıpları I mean / In other words Ü5'te öğretildi (U5-054), burada tekrar.
  - id: F4
    name_tr: Bir macera etkinliği hakkında bilgi sormak ve vermek
    lgs_weight: orta
    exponents:
    - What kind of sport is it?
    - What do you need for this sport?
    - What qualifications does a person need to start it?
    - How old should a person be to attend it?
    - What are the possible dangers of this sport?
    - How much does it cost?
    - What is the aim of it?
    responses:
    - It's an extreme water sport.
    - You need a helmet, a life jacket and a paddle.
    - You don't need any experience. An instructor helps you.
    - You should be over 12.
    - You can fall or drown, so you must follow the instructor.
    - It costs about 20 dollars.
    items:
    - U6-038
    - U6-022
    - U6-047
    - U6-046
    - U6-051
    - U6-048
    - U6-013
    note_tr: K listesindeki soru bankası; LGS'de "bir sporu tanıtan ilan/broşür → hangi bilgi verilmemiştir?" sorularının iskeleti.
