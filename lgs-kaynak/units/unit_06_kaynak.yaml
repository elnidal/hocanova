traps:
- about: challenging
  item: U6-028
  kind: kaynak_hatasi
  trap_tr: Kaynak I "iddialı" diyor.
  tip_tr: challenging = zorlayıcı, zorlu (ama denemeye değer). challenge = meydan okuma.
- about: life jacket
  item: U6-026
  kind: kaynak_hatasi
  trap_tr: Kaynak I "can simidi" diyor.
  tip_tr: life jacket = can yeleği; can simidi = lifebuoy.
- about: mysterious
  item: U6-029
  kind: kaynak_hatasi
  trap_tr: Kaynak I "gizli" diyor.
  tip_tr: mysterious = gizemli; gizli = secret.
- about: qualifications
  item: U6-047
  kind: kaynak_hatasi
  trap_tr: Kaynak I "özellik" diyor.
  tip_tr: qualification = nitelik, yeterlik (yaş, deneyim, belge); özellik = feature.
- about: flashlight
  item: U6-025
  kind: kaynak_hatasi
  trap_tr: Kaynak C "flaş" da diyor.
  tip_tr: flashlight = el feneri (İngiliz İngilizcesinde torch); fotoğraf flaşı = flash.
- about: glacier
  item: U6-040
  kind: kaynak_hatasi
  trap_tr: Kaynak C "buz dağı" da diyor.
  tip_tr: glacier = buzul (karada); buz dağı = iceberg (denizde).
- about: take place
  item: U6-056
  kind: turkce_etkisi
  trap_tr: Kaynak I "yer almak" diyor; kelime kelime çeviri yanıltır.
  tip_tr: 'take place = gerçekleşmek, yapılmak: The race takes place in May.'
- about: land
  item: U6-018
  kind: cok_anlamli
  trap_tr: Kaynak I yalnız "kara" veriyor; safe landing için "güvenli".
  tip_tr: 'isim: kara, toprak · fiil: iniş yapmak (The paraglider landed safely).'
- about: fall
  item: U6-015
  kind: cok_anlamli
  trap_tr: fall Amerikan İngilizcesinde "sonbahar".
  tip_tr: 'Bu ünitede düşmek: fall – fell – fallen. fall down / fall off.'
- about: equipment
  item: U6-022
  kind: dilbilgisi
  trap_tr: Türkçede "ekipmanlar" denir.
  tip_tr: 'equipment sayılamaz: ❌ equipments, ❌ an equipment → ✓ some equipment / a piece of equipment.'
- about: prefer … to
  item: U6-035
  kind: dilbilgisi
  trap_tr: more … than alışkanlığıyla "prefer … than" denir.
  tip_tr: prefer A to B; would rather A than B.
- about: would rather
  item: U6-036
  kind: dilbilgisi
  trap_tr: 'would like to ile karışır: "I''d rather to go".'
  tip_tr: would rather + yalın fiil (to yok, -ing yok).
- about: more + -er
  item: U6-033
  kind: dilbilgisi
  trap_tr: '"more safer", "more better".'
  tip_tr: 'Ya -er ya more; düzensizler: good–better–the best, bad–worse–the worst.'
- about: experience / experiment
  item: U6-027
  kind: benzer_yazilis
  trap_tr: experiment = deney (bilim fuarı).
  tip_tr: experience = deneyim, yaşantı.
- about: gain
  item: U6-052
  kind: turkce_etkisi
  trap_tr: Türkçe "kazanmak" üç İngilizce fiile karşılık gelir.
  tip_tr: gain experience / confidence; win a race; earn money.
- about: climb
  item: U6-009
  kind: benzer_yazilis
  trap_tr: b okunmaz.
  tip_tr: /klaɪm/; climber /ˈklaɪmə/.
- about: disappointing / disappointed
  item: U6-032
  kind: dilbilgisi
  trap_tr: '"I am disappointing" yanlış anlam verir.'
  tip_tr: Şey -ing, kişi -ed (Ü4 U4-054).
- about: go rafting
  item: U6-004
  kind: turkce_etkisi
  trap_tr: '"Raftinge gitmek" → ❌ go to rafting.'
  tip_tr: 'go + V-ing: go rafting, go caving.'
- about: present
  kind: cok_anlamli
  trap_tr: 'K: "What can we buy as a present?" — present = hediye; ayrıca şimdiki (present tense) ve sunmak (fiil, Ü2 sunum).'
  tip_tr: 'Bağlama bak: buy a present = hediye almak.'
- about: take adventure / risk order
  kind: kaynak_hatasi
  trap_tr: Kaynak I'da doğal olmayan ifadeler.
  tip_tr: 'Doğrusu: go on an adventure; risk order anlamsız (TANIMA, kullanılmaz).'
- about: skydiving
  item: U6-006
  kind: kaynak_hatasi
  trap_tr: Kaynak I ve C "gökyüzü dalışı" (kelime kelime çeviri).
  tip_tr: Türkçede "serbest paraşüt" ya da "uçaktan paraşütle atlama".
- about: base jumping
  item: U6-005
  kind: kaynak_hatasi
  trap_tr: Kaynak A yalnız "bir yerden atlama" diyor.
  tip_tr: base jumping = bina, anten, köprü ya da uçurumdan paraşütle atlama; bungee jumping = esnek iple atlama.
lgs_focus:
  what_is_tested:
  - 'İki ya da daha çok etkinliği karşılaştırma: tablo/grafik → doğru karşılaştırma ya da üstünlük cümlesi (en sık)'
  - 'Tercih diyaloğu: Which one do you prefer? / Would you rather …? → uygun cevap + gerekçe'
  - 'Bir sporu ya da macera turunu tanıtan ilan/broşür: yaş, ekipman, fiyat, eğitmen, en iyi zaman → doğru bilgi / verilmeyen bilgi'
  - 'Maceracı ya da ekstrem spor metni: ana fikir, çıkarım (deneyim, risk, başarı)'
  - 'Kelime anlamı: challenging, take place, aim, qualification, magnificent'
  - 'Durum–tepki: tehlikeli bir duruma uyarı, teşekküre cevap (My pleasure)'
  question_patterns:
  - type: table_graph
    description_tr: İki-dört etkinliği yıldızla puanlayan tablo (danger, cost, excitement) → doğru karşılaştırma cümlesi.
    sample_stem: 'Table — Rafting: danger ★★, cost ★★★, fun ★★★ · Caving: danger ★★★, cost ★, fun ★★ · Paragliding: danger ★★★, cost ★★★, fun ★★★. According to the table, which of the following is TRUE?'
    sample_options:
    - Caving is cheaper than rafting.
    - Rafting is more dangerous than caving.
    - Paragliding is less expensive than caving.
    - Caving is the most amusing activity.
    distractor_logic_tr: Çeldiriciler aynı sıfatı ters yönde kurar (more ↔ less) ya da üstünlüğü yanlış etkinliğe verir; öğrenci her şıkta iki satırı ve sütunu tek tek karşılaştırmalı.
    items:
    - U6-033
    - U6-034
    - U6-046
    - U6-011
    - U6-031
  - type: dialogue_complete
    description_tr: Tercih sorusu → boşluk → gerekçe akışı.
    sample_stem: 'Ali: Would you rather go scuba diving or go on a jeep safari? — Ece: ______ — Ali: Why? — Ece: Because I can''t swim very well.'
    sample_options:
    - I'd rather go on a jeep safari.
    - Yes, I would. It's great.
    - I'd rather go scuba diving.
    - I prefer swimming to running.
    distractor_logic_tr: Gerekçe (yüzemiyorum) suya giren seçeneği eler; "Yes, I would" evet–hayır cevabı (soru seçim sorusu); son şık yüzmeyi tercih ediyor, gerekçeyle çelişir.
    items:
    - U6-036
    - U6-037
    - U6-008
    - U6-004
  - type: message_infer
    description_tr: Bir macera etkinliği ilanı/broşürü (yaş, ekipman, fiyat, eğitmen) → hangi bilgi verilmemiştir / hangisi doğrudur?
    sample_stem: 'POSTER — Blue River Rafting Club: Age: 12+ · No experience needed: our instructors help you. · We provide helmets and life jackets. · Price: 300 TL per person. Which question is NOT answered
      in the poster?'
    sample_options:
    - How long does the tour take?
    - How old should a person be?
    - Do I need any qualifications?
    - How much does it cost?
    distractor_logic_tr: Doğru şık metinde olmayan bilgiyi sorar; diğerleri metindeki bilgiyle birebir eşleşir (12+ → yaş, no experience → nitelik).
    items:
    - U6-047
    - U6-048
    - U6-022
    - U6-023
    - U6-026
    - U6-046
  - type: text_infer
    description_tr: Bir maceracıyı ya da ekstrem sporu anlatan kısa metin → ana fikir / çıkarım.
    sample_stem: 'Text: "Deniz started rock climbing at 15. At first, she was inexperienced and fell many times, but she never gave up. Now she is an instructor and helps beginners." What can we infer about
      Deniz?'
    sample_options:
    - She succeeded because she worked hard.
    - She stopped climbing after an accident.
    - She has never fallen.
    - She prefers swimming to climbing.
    distractor_logic_tr: Çeldiriciler metindeki kelimeyi (fell, accident) yanlış bağlamda kullanır ya da metinde olmayan tercih bilgisi verir.
    items:
    - U6-009
    - U6-027
    - U6-015
    - U6-049
    - U6-048
  - type: synonym
    description_tr: Altı çizili kelimeye en yakın anlam (challenging, take place, aim, magnificent).
    sample_stem: The race takes place in Fethiye every September. The underlined phrase "takes place" is closest in meaning to ______.
    sample_options:
    - happens
    - finishes
    - moves
    - costs
    distractor_logic_tr: '"place" kelimesinden yer/taşınma çağrışımı (moves) ve ilan dilinden gelen cost çeldiricileri.'
    items:
    - U6-056
    - U6-028
    - U6-051
    - U6-030
  - type: situation
    description_tr: Durum → uygun tepki/cümle (tercih belirtme, risk konusunda uyarı, teşekküre cevap).
    sample_stem: Your friend wants to go paragliding today, but the wind is very strong. What do you say?
    sample_options:
    - It's too windy. It's safer to wait for tomorrow.
    - My pleasure. Have a good flight!
    - I'd rather go paragliding today.
    - Paragliding is the cheapest sport.
    distractor_logic_tr: Durumun ana bilgisi (güçlü rüzgâr → tehlike) yalnız ilk şıkta karşılanır; My pleasure teşekküre cevaptır.
    items:
    - U6-054
    - U6-007
    - U6-011
    - U6-057
  - type: odd_one_out
    description_tr: Kategoriye uymayanı bulma (ekipman / spor / sıfat).
    sample_stem: Which one is NOT a piece of safety equipment?
    sample_options:
    - waterfall
    - helmet
    - life jacket
    - knee pads
    distractor_logic_tr: 'Tek doğa kelimesi; diğerleri ekipman. equipment sayılamaz: "a piece of" kalıbı kökte geçer.'
    items:
    - U6-022
    - U6-023
    - U6-026
    - U6-043
