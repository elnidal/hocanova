  tactics:
  - Tabloda her şıkkı iki hücre karşılaştırarak kontrol et; "more" mi "less" mi, sıfat olumlu mu olumsuz mu?
  - the most / the least şıkkında bütün satırlara bak; yalnız iki satır yetmez.
  - Would you rather A or B? sorusunun cevabı A ya da B'dir; Yes/No ile başlayan şık genellikle çeldiricidir.
  - 'Boşluktan sonraki Why? / Because … satırını oku: gerekçe hangi seçeneği gösteriyor?'
  - İlan sorularında "NOT mentioned / NOT answered" kelimesini daire içine al; metinde olanları tek tek ele.
  - prefer gördüysen to, would rather gördüysen yalın fiil + than arıyorsun.
  - 'Sıfatı Türkçeye çevirerek düşünme: challenging olumlu da olabilir (zor ama değer).'
  exam_vocabulary:
  - en: According to the table / chart
    tr: tabloya / grafiğe göre
  - en: Which of the following is TRUE / FALSE?
    tr: Aşağıdakilerden hangisi doğrudur / yanlıştır?
  - en: compare
    tr: karşılaştırmak
  - en: NOT mentioned
    tr: değinilmemiştir
  - en: preference
    tr: tercih
  - en: infer
    tr: çıkarım yapmak
  - en: closest in meaning
    tr: anlamca en yakın
  - en: the underlined word
    tr: altı çizili kelime
cross_unit:
- item: U6-035 prefer … to
  links_to: U1-018 prefer
  note_tr: Kelime Ü1'de; yapı (prefer A to B, prefer + V-ing) burada.
- item: U6-033 -er / more … than
  links_to: U2-090 more than / less than / the most / the least
  note_tr: Ü2 sayı/anket dili; Ü6 sıfatla karşılaştırma. Grafik soruları ikisini birleştirir.
- item: U6-031 amusing, U6-032 disappointing
  links_to: U1-096 exciting, U1-095 boring, U2-077 fascinating, U2-083 entertaining, U4-054 -ed duygular
  note_tr: Karşılaştırma cümlelerinin sıfat havuzu; -ing / -ed ayrımı.
- item: U6-011 dangerous
  links_to: U5-011 safe / safety
  note_tr: Karşıt çift; safer than / more dangerous than.
- item: U6-004 go rafting …
  links_to: U2-036 team sport, U2-037 individual sport, U2-038 do karate, U2-039 hiking
  note_tr: go / play / do ayrımının devamı; spor türleri.
- item: U6-037 Why …? – Because …
  links_to: U5-054 I mean … / In other words
  note_tr: Gerekçe ve açıklama birlikte kullanılır.
- item: U6-046 cost
  links_to: U3-047 How long / How much / How many
  note_tr: How much does it cost? fiyat sorusu; How long does it take? süre.
- item: U6-048 instructor
  links_to: U5-039 expert
  note_tr: Uzman ve eğitmen; experienced instructor.
- item: U6-047 qualifications
  links_to: U1-003 attend, U1-015 join
  note_tr: How old should a person be to attend it? (K)
- item: U6-041 destination, U6-045 historic places, U6-042 scenery
  links_to: Ünite 7 Tourism
  note_tr: Yer tanıtma dilinin başlangıcı; Ü7'de tekrar edilecek.
- item: U6-034 the best time / way
  links_to: Ünite 7 Tourism
  note_tr: What's the best time to visit? Ü7'de turizm sorusu olarak döner.
- item: U6-027 experience
  links_to: U1-079 laid-back, U1-090 self-disciplined (kişilik)
  note_tr: Maceracı karakter tanımı (adventurous, brave) Ü1 kişilik sıfatlarıyla birleşir.
story_hooks:
- situation_tr: 'Gün 1 önerisi: Murat Bey Ü5 finalinde duyurduğu iki günlük bahar doğa kampının broşürünü dağıtır: ''Spring Adventure Camp''. Derste bir dergi sayfası okunur: ''Are you an adrenaline seeker?''
    testi. Kaan 10/10 alır (''I love danger!''), Selin 2/10 (''I love plans.''). Murat Bey sorar: ''What kind of adventure is good for beginners?'''
  items:
  - U6-001
  - U6-002
  - U6-003
  - U6-011
  - U6-027
  - U6-038
  comedy_tr: Bora testi dürüst doldurur, puanı 5 çıkar; 'Half adventurer, half sofa.'
- situation_tr: 'Gün 2 önerisi: Broşürde dört etkinlik var; Ece tahtaya karşılaştırma tablosu çizer (danger / fun / difficulty). Sınıf, dergideki ekstrem sporlarla kıyaslar: ''Bungee jumping is more dangerous
    than the climbing wall.'' Kaan skydiving ister; Murat Bey: ''Not at a school camp!'''
  items:
  - U6-033
  - U6-005
  - U6-006
  - U6-007
  - U6-012
  - U6-028
  comedy_tr: Kaan her etkinliğe 'not challenging enough' der; Duru 'Sleeping is the least dangerous sport' diye ekler.
- situation_tr: 'Gün 3 önerisi: Ece WhatsApp grubunda ''Would you rather …?'' anketi açar: rafting mi caving mi, zip-line mı kano mu. Herkes tercihini ve gerekçesini yazar; Elif''in cevabı: ''I''d rather
    sing at the campfire.'' Geçen yılın kampını anlatan bir video yorumları: ''amusing'' / ''disappointing''.'
  items:
  - U6-035
  - U6-036
  - U6-037
  - U6-004
  - U6-031
  - U6-032
  comedy_tr: 'Bora''nın her cevabının gerekçesi böcekler: ''Because there are fewer bugs.'''
- situation_tr: 'Gün 4 önerisi: Kamp malzeme listesi (Ece''nin 4 sayfalık listesi). Spor mağazasında: kask, dizlik, ip, el feneri, can yeleği; ''How much does it cost?'' Selin''in babası fiyatları karşılaştırır.
    Eğitmen ekibin e-postası: ''We provide all safety equipment.'''
  items:
  - U6-022
  - U6-023
  - U6-024
  - U6-025
  - U6-026
  - U6-046
  comedy_tr: Ece listesine 'equipments' yazar; Selin kırmızı kalemle düzeltir. Kaan üç el feneri alır, pili almayı unutur.
- situation_tr: 'Gün 5 önerisi: Kampa varış (veliler internetten aldığı gidiş-dönüş biletle otobüs). Eğitmen Deniz Hoca güvenlik brifingi verir: hangi nitelikler gerekiyor, kazalar nasıl önlenir, düşerseniz
    ne yaparsınız. Okuma köşesi: bir dağcının hayatta kalma hikâyesi (dergi metni) ve ''rate of death'' tablosu.'
  items:
  - U6-048
  - U6-047
  - U6-013
  - U6-015
  - U6-014
  - U6-021
  comedy_tr: Kaan brifing sırasında kaskı ters takar; Deniz Hoca 'Safety first, style second.'
- situation_tr: 'Gün 6 önerisi: Tırmanma duvarı. Bora tepeye bakıp bahane uydurmadan ''I''m scared'' der, yine de dener; amacı yarıya kadar çıkmak, sonunda tepeye ulaşır. Selin zip-line''a ilk binen olur:
    ''I always follow the plan. Today the plan is fear.'' Eğitmen: ''You gained confidence and improved fast.'''
  items:
  - U6-009
  - U6-016
  - U6-049
  - U6-051
  - U6-050
  - U6-052
  comedy_tr: Kaan herkesten önce tırmanmak ister ama ipi bekleyemez; ekip ipini beklemeyi öğrenir.
- situation_tr: 'Gün 7 önerisi: Gölde kano; rüzgâr çıkar, eğitmen etkinliği kısaltır ve herkes güvenle kıyıya iner. Murat Bey''in gençliğinde yaptığı tüplü dalışı anlatması: ''Under the water you feel the
    freedom.'' Can yeleği neden şart: suda boğulma riskine dair kısa bilgi notu.'
  items:
  - U6-010
  - U6-054
  - U6-017
  - U6-018
  - U6-053
  - U6-008
  comedy_tr: Kaan kanoyu tek başına kıyıya çekmeye çalışır, kano yerinden kıpırdamaz; Duru molada uyur.
- situation_tr: 'Gün 8 önerisi: Gece yürüyüşü; grup kısa süre yolu kaybeder, Duru sakin kalıp yönü seçer, eğitmenin feneri görünür (güvenle çözülür). Kamp ateşinde Deniz Hoca ''mysterious'' hikâyeler anlatır:
    buzulda donma tehlikesi, uçurum kenarında kamp kuran dağcılar, köpekbalığı saldırısı efsaneleri (gerçek olaylar abartılmaz).'
  items:
  - U6-029
  - U6-039
  - U6-019
  - U6-020
  - U6-040
  comedy_tr: 'Bora''nın böcek paniği: karanlıkta ''Something attacked me!'' — bir yaprak.'
- situation_tr: 'Gün 9 önerisi: Okulda ''Dream Adventure Map'' panosu: herkes bir hayal varış noktası seçer ve tanıtır (şelale, dağ yolu, buzul manzarası). Elif Kanadalı arkadaşı Mia''ya (Ü5) kampı anlatır
    ve Mia''nın gönderdiği şelale fotoğrafına ''magnificent'' der.'
  items:
  - U6-041
  - U6-042
  - U6-043
  - U6-044
  - U6-055
  - U6-030
  comedy_tr: 'Duru''nun hayal varış noktası: ''A hammock. Anywhere.'''
- situation_tr: 'Gün 10 önerisi (final): Kamp ateşi turu sınıfta tekrarlanır: ''the most exciting thing I did at camp''; herkes birbirinin cesaretini sayar. Murat Bey Ü7 kancasını verir: Nisan''da yurt
    dışından ortak bir sınıf İzmir''e geliyor, tarihi yerleri gezdirecek rehber sizsiniz; tur bir cumartesi gerçekleşecek. Elif teşekkür eden Bora''ya ''My pleasure.'' Ünite finali: 4 LGS tarzı soru.'
  items:
  - U6-034
  - U6-045
  - U6-056
  - U6-057
  comedy_tr: Ece'nin 4 sayfalık planından tek bir madde uygulanmıştır; en iyi anı plansız çıkan yağmurlu gece olur.
- situation_tr: 'Ek durum: Kaan ve Bora hangi sporun "en tehlikeli" olduğunu tartışır; Selin internetten veriye bakmayı önerir (Ü5 kuralı: first search, then share). Karşılaştırma ve üstünlük cümleleri
    tablodan okunur.'
  items:
  - U6-033
  - U6-034
  - U6-011
  - U6-021
  comedy_tr: Kaan'ın kaynağı bir aksiyon filmi çıkar.
- situation_tr: 'Ek durum: Ece''nin kuzeni Ege, kampın ''disappointing'' olacağını iddia eder; dönüşte gelen fotoğraflara ''OK, magnificent'' demek zorunda kalır.'
  items:
  - U6-032
  - U6-030
  - U6-042
  comedy_tr: Ege yorumunu üç kez düzenler.
mini_lessons:
- type: mini_dilbilgisi
  text_tr: Tek heceli sıfat -er/-est alır (safe → safer → the safest); iki heceli -y ile biten -ier/-iest (crazy → crazier → the craziest); uzun sıfat more/the most (dangerous → more dangerous → the most
    dangerous).
  refs:
  - U6-033
  - U6-034
- type: tuzak
  text_tr: good → better → the best; bad → worse → the worst. "more better" yok.
  refs:
  - U6-033
  - U6-034
- type: mini_dilbilgisi
  text_tr: prefer A to B — to ile; would rather A than B — than ile ve yalın fiil.
  refs:
  - U6-035
  - U6-036
- type: lgs_taktigi
  text_tr: Would you rather …? bir seçim sorusudur; cevap "Yes" değil, seçeneklerden biridir.
  refs:
  - U6-036
- type: hafiza_kancasi
  text_tr: 'BASE jumping: Building, Antenna, Span (köprü), Earth (uçurum) — atlanan dört yer türünün baş harfleri.'
  refs:
  - U6-005
- type: ilginc_bilgi
  text_tr: 'SCUBA aslında kısaltmadır: Self-Contained Underwater Breathing Apparatus (kendi havasını taşıyan su altı solunum aygıtı).'
  refs:
  - U6-008
- type: kelime_ailesi
  text_tr: adventure (macera) → adventurer (maceracı kişi) → adventurous (maceraperest). -er kişi, -ous sıfat yapar (danger → dangerous, mystery → mysterious).
  refs:
  - U6-001
  - U6-011
  - U6-029
- type: tuzak
  text_tr: 'equipment sayılamaz: a piece of equipment, some equipment. ❌ equipments.'
  refs:
  - U6-022
- type: hafiza_kancasi
  text_tr: 'frostbite = frost (ayaz, kırağı) + bite (ısırmak): soğuğun "ısırması", parmak ve kulakta donma.'
  refs:
  - U6-020
- type: tuzak
  text_tr: glacier karada yavaş akan buz kütlesi (buzul); denizde yüzen buz dağı iceberg.
  refs:
  - U6-040
- type: tuzak
  text_tr: 'take place "yer almak" değil "gerçekleşmek": The festival takes place in June.'
  refs:
  - U6-056
- type: tuzak
  text_tr: 'Türkçe "kazanmak": gain (deneyim, güven), win (yarış), earn (para).'
  refs:
  - U6-052
- type: ilginc_bilgi
  text_tr: 'Türkiye''de macera rotaları: Kapadokya sıcak hava balonu, Fethiye Ölüdeniz–Babadağ yamaç paraşütü, Antalya Köprülü Kanyon rafting.'
  refs:
  - U6-004
  - U6-007
- type: mini_dilbilgisi
  text_tr: 'go + V-ing: go rafting, go caving, go scuba diving — to yok. Top oyunları play, dövüş sporları ve yoga do (Ü2).'
  refs:
  - U6-004
- type: kelime_ailesi
  text_tr: experience (deneyim) → experienced (deneyimli) → inexperienced (deneyimsiz). in- ön eki "olumsuz" yapar.
  refs:
  - U6-027
- type: tuzak
  text_tr: disappointing (hayal kırıklığı yaratan şey) ↔ disappointed (hayal kırıklığına uğrayan kişi).
  refs:
  - U6-032
- type: hafiza_kancasi
  text_tr: climb'da b okunmaz (/klaɪm/), tıpkı comb (tarak) ve thumb (başparmak) gibi.
  refs:
  - U6-009
- type: lgs_taktigi
  text_tr: 'Tablo sorusunda less … than şıklarını atlama: doğru cevap çoğu zaman ters yönden kurulmuş karşılaştırmadır.'
  refs:
  - U6-033
open_questions:
- MEB programının Ünite 6 kazanım kodları yalnız E8.6.SP1 ve E8.6.R1 olarak doğrulandı (öğretmen planı). Dinleme/karşılıklı konuşma/yazma kodları ve tam Useful Language listesi (would rather örneği dahil)
  resmî program PDF'inden kontrol edilmeli.
- Bu ünitenin kaynaklarında "sınavlarda çıkmış kelimeler" tablosu yok; LGS 2018–2025 Ü6 soruları (özellikle karşılaştırma tabloları) doğrulanmadı. Ders kitabı listesindeki tablo varsa paylaşılırsa exam
  alanı eklenir.
- Sezon çerçevesindeki zip-line, campfire, tent, hammock, climbing wall kaynaklarda yok; birim yapılmadı. Hikâyede İngilizce olarak (öğretilmeden) kullanılması ya da 1–2 birim eklenmesi kullanıcı kararı.
- Have you ever …? (Present Perfect) TANIMA yapıldı; season.yaml finali "the most exciting thing I've ever done" diyor. Bu cümle kalıp olarak kalsın mı, yoksa finalde "the most exciting thing at camp" mı
  denmeli?
- life jacket tek kaynaklı (I) ama kano sahnesi için tutuldu; present/gift BİLİNEN'e indirildi. Onaylanıyor mu?
- Tehlike birimleri (drown, attack, frostbite, death) karakterlerin başına gelmeyecek; okuma metni, belgesel ve eğitmen anlatımında geçecek (season.yaml safety). Bu yaklaşım uygun mu?
