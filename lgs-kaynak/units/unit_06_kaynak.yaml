grammar:
- id: G1
  name_tr: Karşılaştırma sıfatları (Comparatives)
  form: kısa sıfat + -er + than · more / less + uzun sıfat + than · good → better, bad → worse, far → farther
  examples:
  - Canoeing is safer than rafting.
  - I think bungee jumping is more dangerous and challenging than canoeing.
  - Caving is less exciting than skydiving, but it's more mysterious.
  - The weather today is worse than yesterday, so we can't go paragliding.
  explain_tr: İki şeyi karşılaştırırken kullanılır. Tek heceli sıfatlar -er alır (safe → safer, big → bigger, cheap → cheaper); -y ile biten iki heceliler -ier (easy → easier, crazy → crazier); diğer iki
    ve daha çok heceliler more alır (more dangerous, more amusing). less "daha az" demektir ve her sıfatla more gibi kullanılır. than "-den/-dan"dır.
  common_errors:
  - wrong: Rafting is more safer than caving.
    right: Rafting is safer than caving.
    why_tr: -er ve more birlikte kullanılmaz.
  - wrong: Skydiving is more good than diving.
    right: Skydiving is better than diving.
    why_tr: 'good düzensizdir: better.'
  - wrong: Paragliding is exciting than canoeing.
    right: Paragliding is more exciting than canoeing.
    why_tr: Türkçede "-den heyecanlı" denir; İngilizcede more şart.
  - wrong: It is more dangerous from base jumping.
    right: It is more dangerous than base jumping.
    why_tr: '"-den" = than (from değil).'
  lgs_note: 'En sık biçim: iki etkinliği puanlayan tablo (danger / cost / excitement yıldızları) → "Which of the following is TRUE?" Şıklarda sıfat doğru ama yön ters (safer ↔ more dangerous) çeldiricisi.
    less … than sıkça doğru şıkkı gizler.'
  items:
  - U6-033
  - U6-011
  - U6-028
  - U6-031
- id: G2
  name_tr: Üstünlük sıfatları (Superlatives)
  form: the + kısa sıfat-est · the most / the least + uzun sıfat · the best, the worst · (in / of …)
  examples:
  - Base jumping is the most dangerous sport in the list.
  - What's your craziest dream adventure?
  - Spring is the best time to visit the waterfall.
  - For me, caving is the least frightening activity of all.
  explain_tr: Üç ya da daha çok şey arasında "en …" demek için. the unutulmaz. -er/-est yazım kuralları karşılaştırmayla aynıdır (crazy → the craziest, big → the biggest). Grup in (in the world, in our
    class) ya da of (of all, of the three) ile verilir.
  common_errors:
  - wrong: It is most exciting sport.
    right: It is the most exciting sport.
    why_tr: the zorunlu.
  - wrong: the most best
    right: the best
    why_tr: Düzensiz biçim most almaz.
  - wrong: the dangerousest
    right: the most dangerous
    why_tr: Uzun sıfat -est almaz.
  lgs_note: Anket/tablo sorularında "the most popular / the least expensive activity" doğru eşleşmesi; ayrıca "the best time / way to …" bilgi sorusu (ilan metni).
  items:
  - U6-034
  - U6-041
  - U6-042
- id: G3
  name_tr: prefer ile tercih
  form: prefer + isim / V-ing (+ to + isim / V-ing) · prefer to + V1 · Which (one) do you prefer, A or B?
  examples:
  - I prefer rafting to canoeing.
  - She prefers climbing to swimming.
  - Which one do you prefer, skydiving or paragliding?
  - What do you prefer doing on summer holidays?
  explain_tr: 'Karşılaştırılan ikinci şey to ile gelir: prefer A to B = A''yı B''ye tercih etmek. Fiil kullanılırsa her iki tarafta da -ing (prefer climbing to swimming). Üçüncü tekil şahısta prefers.'
  common_errors:
  - wrong: I prefer rafting than canoeing.
    right: I prefer rafting to canoeing.
    why_tr: prefer ile than değil to.
  - wrong: He prefer caving.
    right: He prefers caving.
    why_tr: Simple Present 3. tekil -s.
  - wrong: I prefer climb to swim.
    right: I prefer climbing to swimming.
    why_tr: to burada edat; fiil -ing alır.
  lgs_note: 'Diyalogda "Which one do you prefer?" sorusuna uygun cevap: tercih + gerekçe (I prefer X because it is more …). Çeldirici: kişinin bir önceki cümlede sevmediğini söylediği etkinliği "tercih"
    eden şık.'
  items:
  - U6-035
  - U6-037
- id: G4
  name_tr: would rather ile tercih
  form: would rather ('d rather) + V1 (+ than + V1) · Would you rather + V1 + or + V1? · I'd rather not.
  examples:
  - I'd rather go caving than go skydiving.
  - Would you rather ride a horse or ride a camel?
  - Which one would you rather do? – I'd rather try the climbing wall.
  - I'd rather not swim in the cold lake.
  explain_tr: would rather, prefer ile aynı işi görür ama arkasından yalın fiil gelir; karşılaştırma than ile yapılır (prefer'deki to değil). Kısa biçimi I'd rather; olumsuzu I'd rather not.
  common_errors:
  - wrong: I'd rather to go rafting.
    right: I'd rather go rafting.
    why_tr: to yok.
  - wrong: I'd rather going rafting.
    right: I'd rather go rafting.
    why_tr: -ing yok.
  - wrong: I'd rather rafting to canoeing.
    right: I'd rather go rafting than go canoeing.
    why_tr: would rather fiil ister ve than ile karşılaştırır.
  - wrong: I don't would rather …
    right: I'd rather not …
    why_tr: Olumsuz not ile.
  lgs_note: Would you rather A or B? sorusunun cevabı A ya da B'den biri + gerekçe olmalı; 'Yes, I would' çeldiricisi tipik (evet–hayır sorusu değil).
  items:
  - U6-036
  - U6-035
- id: G5
  name_tr: 'Gerekçe: Why …? – Because …'
  form: Why + do/does/did + özne + fiil …? – Because + özne + fiil … · …, so …
  examples:
  - Why do you prefer kayaking? – Because it is more amusing.
  - Why did you like it? – Because the scenery was magnificent.
  - It's windy today, so we can't go paragliding.
  explain_tr: because sebep, so sonuç bildirir. Cevapta because'tan sonra tam cümle gelir. Gerekçede çoğunlukla karşılaştırma vardır (more exciting, safer, cheaper).
  common_errors:
  - wrong: Because more amusing.
    right: Because it is more amusing.
    why_tr: Özne ve fiil gerekli (konuşmada kısaltılsa da sınavda tam).
  - wrong: It's windy, because we can't fly.
    right: It's windy, so we can't fly.
    why_tr: Sonuç so ile.
  lgs_note: 'Diyalogda Why? sorusundan sonraki boşluk: because ile başlayan, konuşmanın önceki bilgisiyle tutarlı şık. because ↔ so karışıklığı çeldiricisi.'
  items:
  - U6-037
  - U6-054
- id: G6
  name_tr: 'Etkinlik fiilleri: go + V-ing / go on a … / join a …'
  form: go + V-ing (go rafting, go caving, go scuba diving) · go on a jeep safari · join a motorcycle tour · fly in a hot-air balloon
  examples:
  - We went rafting in Köprülü Canyon last summer.
  - Would you rather go caving or go on a jeep safari?
  - My uncle joined a motorcycle tour across Anatolia.
  explain_tr: Hareketli, açık havada yapılan etkinlikler go + V-ing ile söylenir (to yok). Ü2'deki play (top oyunları) ve do (karate, yoga) ayrımının devamı.
  common_errors:
  - wrong: We went to rafting.
    right: We went rafting.
    why_tr: go + V-ing kalıbında to yok.
  - wrong: I play skydiving.
    right: I go skydiving.
    why_tr: play top oyunları için.
  lgs_note: 'Boşluk doldurma: go / play / do eşleşmesi; ilan metninde "Join our tour!" gibi çağrılar.'
  items:
  - U6-004
  - U6-008
  - U6-010
- id: G7
  name_tr: -ing / -ed sıfatlar (amusing, disappointing, challenging)
  form: şey/etkinlik → -ing (amusing, disappointing, exciting) · kişinin duygusu → -ed (amused, disappointed, excited)
  examples:
  - The trip was disappointing because it rained all day.
  - We were disappointed because it rained all day.
  - Canoeing is challenging but amusing.
  explain_tr: Ü4'te -ed duygular öğretildi (U4-054). Etkinliği anlatan sıfat -ing, insanın hissettiği -ed.
  common_errors:
  - wrong: I am very disappointing.
    right: I am very disappointed.
    why_tr: Kişi -ed hisseder; "I am disappointing" = ben hayal kırıklığı yaratan biriyim.
  lgs_note: 'Mesaj/yorum çıkarımı: "The concert was disappointing" → yazar memnun değil.'
  items:
  - U6-031
  - U6-032
  - U6-028
- id: G8
  name_tr: 'Deneyim soruları (tanıma düzeyi): Have you ever …? + geçmiş zaman'
  form: Have you ever + V3? – Yes, I have. / No, I haven't. · When did you last do it? Where did you do it?
  examples:
  - Have you ever experienced any dangers?
  - Have you ever tried rock climbing? – Yes, I have. I tried it last year.
  - When did you last do it? – Two years ago.
  explain_tr: Present Perfect 8. sınıf programında yok; ders kitabı soruları kalıp olarak tanınır. Ayrıntılar (ne zaman, nerede) Simple Past ile anlatılır.
  common_errors:
  - wrong: Did you ever try rafting? – Yes, I have.
    right: Have you ever tried rafting? – Yes, I have.
    why_tr: Soru ve kısa cevap aynı yardımcı fiille.
  lgs_note: 'Yalnız tanıma: kısa cevabı (Yes, I have / No, I haven''t) eşleştirme. Üretim beklenmez.'
  items:
  - U6-027
expressions:
- en: Which one do you prefer, A or B?
  tr: Hangisini tercih edersin, A mı B mi?
  use: tercih sorma
  register: nötr
  reply:
  - I prefer A (to B) because …
  item: U6-035
- en: Would you rather … or …?
  tr: … mı yoksa … mı yeğlersin?
  use: iki seçenek arasında tercih sorma; oyun gibi sorulabilir
  register: gündelik
  reply:
  - I'd rather …
  - Neither! I'd rather stay at home.
  item: U6-036
- en: I'd rather not.
  tr: Pek istemem / Yapmasam daha iyi.
  use: kibarca istemediğini söyleme
  register: gündelik
  item: U6-036
- en: I think … is more … than …
  tr: Bence … -den daha …
  use: karşılaştırarak görüş bildirme
  register: nötr
  reply:
  - I agree.
  - I don't think so.
  item: U6-033
- en: What's your craziest dream adventure?
  tr: En çılgın macera hayalin ne?
  use: tanışma/sohbet sorusu
  register: gündelik
  reply:
  - I guess my craziest dream is …
  item: U6-034
- en: Because it is more amusing / exciting / challenging.
  tr: Çünkü daha eğlenceli / heyecanlı / zorlayıcı.
  use: tercihe gerekçe
  register: nötr
  item: U6-037
- en: What kind of sport is it?
  tr: Ne tür bir spor?
  use: bir sporu tanıtma
  register: nötr
  reply:
  - It's a water sport / an extreme sport / an individual sport.
  item: U6-038
- en: How much does it cost? – It costs about … .
  tr: Ne kadar tutuyor? – Yaklaşık … tutuyor.
  use: fiyat sorma
  register: nötr
  item: U6-046
- en: What do you need for this sport?
  tr: Bu spor için neye ihtiyacın var?
  use: ekipman sorma
  register: nötr
  reply:
  - You need a helmet, a rope and …
  item: U6-022
- en: What qualifications does a person need?
  tr: Bir kişinin hangi niteliklere ihtiyacı var?
  use: şartları sorma (yaş, deneyim, sağlık)
  register: nötr
  reply:
  - You don't need any experience.
  - You should be a good swimmer.
  item: U6-047
- en: What are the possible dangers?
  tr: Olası tehlikeler neler?
  use: risk sorma
  register: nötr
  reply:
  - You can fall / drown / get frostbite.
  item: U6-011
- en: What's the best time to visit / the best way to get there?
  tr: Ziyaret için en iyi zaman / oraya gitmenin en iyi yolu ne?
  use: yer tanıtma, gezi planı
  register: nötr
  reply:
  - In spring.
  - By bus. It's cheaper.
  item: U6-034
- en: My pleasure.
  tr: Rica ederim / Ne demek, benim için zevkti.
  use: teşekküre cevap (Thank you so much!)
  register: nötr
  item: U6-057
- en: take risks
  tr: risk almak
  use: 'macera karakteri anlatma: Adventurers like taking risks.'
  register: nötr
  item: U6-012
- en: feel the freedom
  tr: özgürlüğü hissetmek
  use: paragliding/skydiving deneyimi anlatma
  register: nötr
  item: U6-053
- en: It takes place in …
  tr: … -de gerçekleşir / yapılır.
  use: etkinlik/yarışma tanıtımı (ilan metni)
  register: nötr
  item: U6-056
