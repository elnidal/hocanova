  difference_tr: entertaining insanı eğlendiren (film, gösteri); fun eğlenceli (etkinlik, kişi); enjoyable keyifli; relaxing rahatlatıcı; educational öğretici. Kaynak D 'fun = entertaining' der; yakın ama
    aynı değil.
