traps:
- about: like
  item: U2-007
  kind: cok_anlamli
  trap_tr: Ünite 1'de 'What is he like?' = 'Nasıl biri?' (like = gibi). Bu ünitede 'Do you like…?' = 'sever misin?'.
  tip_tr: '''What is she like?'' kişilik sorar; ''What does she like?'' zevklerini sorar. ''does'' varsa ''sevmek''tir.'
- about: can't stand
  item: U2-013
  kind: cok_anlamli
  trap_tr: stand = ayakta durmak; öğrenci 'ayakta duramıyorum' diye çevirir.
  tip_tr: can't stand + isim/-ing = katlanamamak. 'I can't stand rap' müzikle ilgilidir, bacakla değil.
- about: don't mind
  item: U2-011
  kind: kaynak_hatasi
  trap_tr: Kaynak D 'mind = umursamak' der. Öğrenci 'I don't mind' cümlesini 'umursamıyorum, bana ne' gibi kaba bir tavır sanır.
  tip_tr: I don't mind = fark etmez / benim için sorun değil (nötr, kibar). Olumsuz bir duygu değildir; beğeni skalasının ortasıdır.
- about: terrific
  item: U2-075
  kind: sahte_dost
  trap_tr: terror/terrible çağrışımıyla 'korkunç' sanılır.
  tip_tr: terrific = müthiş, harika (olumlu). terrible = berbat (olumsuz). Diyalogda 'terrific' diyen kişi memnundur.
- about: smart clothes
  item: U2-065
  kind: cok_anlamli
  trap_tr: smart = akıllı; 'akıllı kıyafet' gibi anlaşılır.
  tip_tr: Kıyafet için smart = şık, özenli. smart clothes ↔ casual clothes.
- about: genre / type
  item: U2-021
  kind: cok_anlamli
  trap_tr: type hem 'tür' (isim) hem 'klavyede yazmak' (fiil). genre okunuşu yazılışından çok farklı.
  tip_tr: What type/kind of music…? = hangi tür. genre /ˈʒɒnrə/ 'jonra' gibi okunur.
- about: train
  item: U2-033
  kind: cok_anlamli
  trap_tr: train = tren (isim) bilinir; fiil olarak 'antrenman yapmak' kaçırılır.
  tip_tr: 'Özneden sonra fiil yerinde ise antrenmandır: ''Kaan trains every day.'' Türkçedeki ''antrenman'' sözcüğü de buradan.'
- about: look fit / fit
  item: U2-034
  kind: cok_anlamli
  trap_tr: fit = formda; ama 'These jeans don't fit' = 'bu kot üstüme olmuyor'.
  tip_tr: look fit, keep fit → sağlık/spor. fit + kıyafet → beden uyması.
- about: rest
  item: U2-040
  kind: cok_anlamli
  trap_tr: rest = dinlenmek; 'the rest (of)' = geri kalanı. Grafik sorularında 'the rest of the students' çıkabilir.
  tip_tr: the + rest + of → geri kalan. Fiil yerinde → dinlenmek.
- about: pick up
  item: U2-048
  kind: cok_anlamli
  trap_tr: pick up = yerden almak; ama 'My dad picks me up after school' = 'babam beni okuldan (arabayla) alır'.
  tip_tr: pick + kişi + up → birini bir yerden almak. pick up + eşya → yerden almak.
- about: hang out
  item: U2-004
  kind: turkce_etkisi
  trap_tr: hang = asmak; 'dışarı asmak' gibi saçma çeviriler. Kaynak B 'hang around = gezinmek' der, nüans kaçar.
  tip_tr: hang out (with) = arkadaşlarla takılmak, vakit geçirmek; amaçsız ve keyifli zaman.
- about: queue
  item: U2-053
  kind: benzer_yazilis
  trap_tr: Yazılışı okunuşundan çok farklı (/kjuː/, 'kyu'). Amerikan İngilizcesinde 'line' denir.
  tip_tr: Q harfi gibi okunur; geri kalan 'ueue' sessizdir. wait in a queue = sırada beklemek.
- about: pretty
  item: U2-071
  kind: cok_anlamli
  trap_tr: Kaynaklar yalnızca 'sevimli' verir. 'pretty good / pretty boring' içinde pretty = oldukça.
  tip_tr: pretty + sıfat → oldukça. pretty + isim → güzel, sevimli (a pretty dress).
- about: nervous
  item: U2-059
  kind: kaynak_hatasi
  trap_tr: Kaynak D 'nervous = gergin, sinirli' der; Türkçedeki 'sinirli' (kızgın) anlamı yanlıştır.
  tip_tr: nervous = gergin, heyecanlı, tedirgin (sınav, sahne öncesi). Kızgın için angry / annoyed.
- about: ridiculous
  item: U2-060
  kind: kaynak_hatasi
  trap_tr: Kaynak C 'tuhaf/rezalet' ve 'rezil/kötü' verir.
  tip_tr: ridiculous = saçma, gülünç (absürt). 'Kötü' için awful, 'tuhaf' için strange/weird.
- about: be realistic / realistic
  item: U2-085
  kind: kaynak_hatasi
  trap_tr: 'Kaynak D ''realistic: gerçek olaylar'', C ''gerçeğe uygun kitap türü'' der (eski kitaptaki kitap türü listesi). Havuzda bu satırlar ''be realistic'' ile birleştirildi.'
  tip_tr: be realistic = gerçekçi olmak (hayaller ve hedefler için). Kitap türü olarak 'realistic fiction' ayrı, TANIMA düzeyinde.
- about: pay attention
  item: U2-041
  kind: kaynak_hatasi
  trap_tr: Kaynak C 'pay attention = ilgilenmek' der.
  tip_tr: pay attention (to) = dikkat etmek. 'İlgilenmek' = be interested in (U1-038).
- about: casual
  item: U2-064
  kind: kaynak_hatasi
  trap_tr: Kaynak D 'casual = günlük, sıradan' der; 'sıradan' anlamı ordinary'dir.
  tip_tr: casual clothes = günlük, rahat kıyafet. ordinary = sıradan (U2-070).
- about: snob
  item: U2-069
  kind: kaynak_hatasi
  trap_tr: Kaynak C 'ukala' der; ukala bilgiçlik taslayan (know-it-all) kişidir.
  tip_tr: snob = züppe, kendini üstün gören (para, marka, statü yüzünden).
- about: sensitive / sensible
  item: U2-086
  kind: sahte_dost
  trap_tr: sensible 'sensitif/hassas' gibi görünür ama 'mantıklı, aklı başında' demektir.
  tip_tr: sensitive = duyarlı, hassas. sensible = mantıklı.
- about: comfortable / relaxed / casual
  item: U2-068
  kind: turkce_etkisi
  trap_tr: Türkçedeki tek 'rahat' sözcüğü İngilizcede dört farklı sözcükle karşılanır.
  tip_tr: 'Koltuk/kıyafet: comfortable · kişi: relaxed / laid-back (U1-079) · giyim tarzı: casual.'
- about: advise / advice
  item: U2-081
  kind: benzer_yazilis
  trap_tr: 'Tek harf farkı: advise (fiil, ''z'' sesi) – advice (isim, ''s'' sesi).'
  tip_tr: 'C = isim (advice), S = fiil (advise). ''an advice'' denmez: some advice.'
- about: hardly ever + olumsuz fiil
  item: U2-051
  kind: dilbilgisi
  trap_tr: '''I don''t hardly ever…'' gibi çift olumsuz kurulur.'
  tip_tr: hardly ever, rarely, seldom, never zaten olumsuz anlam taşır; fiil olumlu kalır.
- about: most / the most
  item: U2-089
  kind: dilbilgisi
  trap_tr: '''The most students…'' yazılır; ''çoğu'' ile ''en çok'' karışır.'
  tip_tr: Most students = öğrencilerin çoğu. the most popular = en popüler.
- about: be crazy about / drive someone crazy
  item: U2-015
  kind: cok_anlamli
  trap_tr: 'İkisinde de crazy var: be crazy about = bayılmak (olumlu), it drives me crazy = beni çıldırtıyor (olumsuz).'
  tip_tr: about varsa sevgi; drive varsa sinir.
- about: terrible / awful kaynak listeleri
  item: U2-078
  kind: turkce_etkisi
  trap_tr: Türkçede 'korkunç güzel' gibi kullanımlar olduğundan awful/terrible bazen olumlu sanılır.
  tip_tr: awful ve terrible İngilizcede olumsuzdur (berbat). Olumlu coşku için awesome / terrific.
- about: desert / dessert (kaynak X)
  kind: kaynak_hatasi
  trap_tr: Kaynak X 'desert = tatlı' yazar; desert çöl demektir. Ünite 3'te dessert (U3-055) öğretilecek.
  tip_tr: 'dessert''te iki s var: tatlıyı herkes iki kez ister.'
lgs_focus:
  what_is_tested:
  - 'Tablo/grafik okuma: anket sonuçları ya da kişilerin etkinlik sıklığı tablosundan doğru/yanlış yargı seçme (most, half, a few, none, once a week, never).'
  - 'Diyalog tamamlama: beğeni/fikir sorusuna uygun cevap ya da cevaba uygun soru (How often…? — Twice a week).'
  - 'Kısa metin çıkarımı: bir gencin blog yazısı, anket raporu ya da mesajından kişinin zevk ve rutinlerini çıkarma.'
  - 'Anlam: beğeni kalıplarının derecesi (can''t stand ↔ crazy about) ve değerlendirme sıfatlarının olumlu/olumsuz yönü (terrific, unbearable, ridiculous).'
  - 'Eş anlam: be fond of = be keen on; rarely = seldom; trendy = fashionable.'
  - Sıklık zarfının cümledeki yeri ve tablodaki karşılığı.
  question_patterns:
  - type: table_graph
    description_tr: Dört gencin hangi etkinliği ne sıklıkla yaptığını gösteren tablo; tabloya göre doğru cümle seçilir.
    sample_stem: 'The table shows how often four teenagers do some activities. Work out — Ada: every day, Can: never, Ela: twice a week, Arda: once a week. Play the guitar — Ada: never, Can: every day,
      Ela: once a week, Arda: never. Which of the following is TRUE according to the table?'
    sample_options:
    - Arda works out more often than he plays the guitar.
    - Can is fond of working out, so he does it every day.
    - Ela plays the guitar more often than she works out.
    - Ada and Arda never work out.
    distractor_logic_tr: Çeldiriciler kişi ya da etkinlik değiştirir (Can'in sporu ile gitarı karıştırılır), sıklığı tersine çevirir ya da 'never' sözcüğünü yanlış kişiye bağlar. Her şık için tabloda tek
      hücreyi kontrol et.
    items:
    - U2-044
    - U2-052
    - U2-009
    - U2-032
  - type: table_graph
    description_tr: Sınıf anketinin yüzde/sayı grafiği; miktar sözcüğüne çeviri sınanır.
    sample_stem: 'Our class survey: 30 students. Pop music: 18 · Rock: 6 · Jazz: 3 · Folk: 3 · Classical: 0. Which of the following is NOT correct according to the survey?'
    sample_options:
    - Half of the students prefer rock music.
    - Most of the students like pop music.
    - None of the students chose classical music.
    - Only a few students like jazz.
    distractor_logic_tr: Doğru şık yanlış olanı arar (NOT). 6/30 'half' değildir. Öğrenciler 'Most' (18/30 > yarı) ve 'a few' (3/30) eşiklerini tartmadan geçer. Soru kökündeki NOT'u kaçırmak en sık hata.
    items:
    - U2-089
    - U2-090
    - U2-003
  - type: dialogue_complete
    description_tr: Kısa diyalogda beğeni derecesine uygun cümle seçme.
    sample_stem: 'Ece: Do you want to go to the folk music concert on Saturday? — Duru: ______ I like folk, but I prefer rock. If you want to go, I''ll come with you.'
    sample_options:
    - I don't mind.
    - I can't stand folk music.
    - I'm crazy about folk music!
    - I never listen to music.
    distractor_logic_tr: Devamdaki 'I like folk, but I prefer rock … I'll come' nötr-olumlu bir tavır kurar. can't stand ve never çelişir; crazy about ise 'prefer rock' ile uyuşmaz. Boşluktan SONRAKİ cümle
      anahtardır.
    items:
    - U2-011
    - U2-013
    - U2-015
    - U1-018
  - type: dialogue_complete
    description_tr: Cevaba uygun soru seçme (How often / What do you do / What about you).
    sample_stem: 'Kaan: ______ — Bora: Three times a week. I have karate lessons on Mondays, Wednesdays and Fridays.'
    sample_options:
    - How often do you do karate?
    - What time do you do karate?
    - Where do you do karate?
    - Why do you like karate?
    distractor_logic_tr: Cevaptaki 'three times a week' sıklık bildirir. 'on Mondays…' gün bilgisi 'What time/When' çeldiricisini besler; asıl ipucu 'times a week'tir.
    items:
    - U2-052
    - U2-038
    - U2-044
  - type: message_infer
    description_tr: Bir gencin blog yazısı ya da e-postasından çıkarım.
    sample_stem: Hi! I'm Elif. I'm really into music. I sing in a band with my best friend and we practise twice a week. I'm not keen on sports, but I go hiking with my family once a month because it's
      relaxing. To be honest, I can't stand getting up early at weekends. — Which of the following is TRUE about Elif?
    sample_options:
    - She enjoys hiking because it helps her relax.
    - She practises with her band every day.
    - She is fond of doing sports.
    - She likes getting up early on Saturdays.
    distractor_logic_tr: Doğru şık metni başka sözcüklerle söyler (relaxing → helps her relax). Çeldiriciler sıklığı büyütür (twice a week → every day), olumsuz kalıbı olumluya çevirir (not keen on → fond
      of) ya da can't stand'i tersine okur.
    items:
    - U2-016
    - U2-010
    - U2-013
    - U2-018
    - U2-039
    - U2-091
    - U2-052
  - type: situation
    description_tr: Durum verilir, söylenebilecek en uygun cümle seçilir.
    sample_stem: Your friend shows you a new pair of shoes. You think they are very modern and popular, and you really like them. What do you say?
    sample_options:
    - Wow, they're really trendy! I love them.
    - To be honest, they look ridiculous.
    - I don't mind. They're ordinary.
    - They're unbearable. I can't stand them.
    distractor_logic_tr: Durumdaki 'modern and popular' + 'really like' trendy + love'a gider. Diğerleri olumsuz ya da nötr sıfatlarla (ridiculous, ordinary, unbearable) kutbu bozar.
    items:
    - U2-062
    - U2-060
    - U2-070
    - U2-088
    - U2-011
  - type: synonym
    description_tr: Altı çizili kalıba anlamca en yakın ifade.
    sample_stem: Selin is fond of reading the news online. The underlined phrase is closest in meaning to ______.
    sample_options:
    - is keen on
    - can't stand
    - doesn't mind
    - is annoyed by
    distractor_logic_tr: Çeldiriciler aynı skaladan ama farklı derecelerden seçilir; 'doesn't mind' nötr olduğu için en çekici yanlıştır.
    items:
    - U2-009
    - U2-010
    - U2-013
    - U2-011
    - U2-042
  - type: gap_fill
    description_tr: Sıklık zarfı ya da beğeni fiiliyle anlamlı boşluk doldurma.
    sample_stem: Kaan is late for almost every lesson. He ______ arrives on time.
    sample_options:
    - hardly ever
    - always
    - usually
    - often
    distractor_logic_tr: Bağlam 'neredeyse her derse geç' diyor; olumlu sıklık zarfları çelişir. Öğrenci 'on time'ı atlayıp 'late' ile always'i eşleştirebilir.
    items:
    - U2-051
    - U2-044
  - type: odd_one_out
    description_tr: Anlamca gruba uymayan sözcük.
    sample_stem: Which word is different from the others in meaning?
    sample_options:
    - awful
    - terrific
    - awesome
    - impressive
    distractor_logic_tr: terrific 'terrible'a benzediği için yanlışlıkla olumsuz seçilir; aslında olumlu olan üçlünün parçasıdır.
    items:
    - U2-078
    - U2-075
    - U2-074
    - U2-076
