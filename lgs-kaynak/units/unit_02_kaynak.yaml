  tactics:
  - Tablo/grafik sorusunda önce kökteki TRUE/NOT/CANNOT sözcüğünü daire içine al; sonra her şık için tabloda tek hücre kontrol et.
  - 'Miktar eşikleri: all %100 · most > %50 · half = %50 · a few = küçük sayı · none = 0. Rakamı önce bu sözcüklerden birine çevir.'
  - 'Diyalog boşluğunda boşluktan SONRAKİ cümleyi oku: ''but I prefer…'', ''so I go every day'' gibi devam, tavrın derecesini gösterir.'
  - How often → sıklık cevabı (once/twice/every/never); What time/When → saat/gün. Şıktaki soru sözcüğünü cevapla eşleştir.
  - 'Paraphrase avı: doğru şık metindeki bilgiyi farklı sözcükle verir (relaxing → helps her relax; can''t stand → hates). Metindeki sözcüğün aynısını taşıyan şıkka hemen atlama.'
  - 'Sıfatları + / – diye işaretle: terrific, awesome, impressive, fascinating (+) · awful, unbearable, ridiculous, annoying (–) · ordinary (nötr). Kutbu uymayan şıkları ele.'
  - Olumsuz zarflar (hardly ever, rarely, seldom, never) ile 'not' bir arada görürsen o şık büyük olasılıkla dilbilgisi açısından yanlış.
  exam_vocabulary:
  - en: Which of the following is TRUE / NOT true …?
    tr: Aşağıdakilerden hangisi doğrudur / doğru değildir?
  - en: according to the table / chart / graph / survey
    tr: tabloya / çizelgeye / grafiğe / ankete göre
  - en: complete the dialogue / the missing part
    tr: diyaloğu / eksik bölümü tamamlayınız
  - en: Which of the following CANNOT be said …?
    tr: Aşağıdakilerden hangisi söylenemez?
  - en: It is clear that …
    tr: … olduğu açıktır
  - en: How often …?
    tr: Ne sıklıkla …?
  - en: results
    tr: sonuçlar
  - en: participant(s)
    tr: katılımcı(lar)
  - en: percent / per cent (%)
    tr: yüzde
  - en: the most / the least popular
    tr: en popüler / en az popüler
  - en: preference(s)
    tr: tercih(ler)
  - en: free-time activities
    tr: boş zaman etkinlikleri
  - en: is closest in meaning to …
    tr: … anlamca en yakındır
  - en: the best response
    tr: en uygun cevap/tepki
  - en: mentioned / not mentioned
    tr: değinilen / değinilmeyen
  - en: both … and … / neither … nor …
    tr: hem … hem … / ne … ne …
  - en: except
    tr: hariç
  - en: in the correct order
    tr: doğru sırayla
cross_unit:
- item: U2-007 like
  links_to: U1-080 like (gibi)
  note_tr: 'Aynı sözcük, iki ünitede iki anlam: ''What is he like?'' (nasıl biri) ↔ ''What does he like?'' (neyi sever).'
- item: U2-011 don't mind
  links_to: U1-014 It doesn't matter.
  note_tr: İkisi de 'fark etmez'. It doesn't matter durum için, I don't mind kişinin tavrı için; diyalog sorularında yer değiştirebilir.
- item: U2-006 what about you?
  links_to: U1-024 What about …?
  note_tr: U1'de 'What about going to the cinema?' öneridir; burada 'What about you?' karşı sorudur.
- item: U2-005 In my opinion / I believe
  links_to: U1-042 same opinion
  note_tr: opinion kelimesi U1'de tanıtıldı; burada fikir bildirme kalıbına dönüşür.
- item: U2-062 trendy
  links_to: U1-072 fashionable
  note_tr: Eş anlamlı; eş anlam sorusu için hazır çift.
- item: U2-068 comfortable
  links_to: U1-079 laid-back
  note_tr: 'Türkçedeki ''rahat''ın iki karşılığı: eşya/kıyafet ↔ kişilik.'
- item: U2-010 be keen on / U2-016 be into
  links_to: U1-038 interested in
  note_tr: Aynı edat + -ing mantığı; be interested in tekrarı bu ünitede doğal.
- item: U2-081 advise
  links_to: U1-035 give advice
  note_tr: 'Fiil/isim çifti: advise ↔ advice.'
- item: U2-055 chat online
  links_to: U1-029 chat / U1-046 text
  note_tr: Arkadaşlık ünitesinin iletişim fiilleri sosyal medya bağlamında tekrar eder.
- item: U2-058 share on social media
  links_to: U1-043 share
  note_tr: share U1'de duygu/eşya paylaşmaktı; burada içerik paylaşmak.
- item: U2-004 hang out
  links_to: U1-044 spend time
  note_tr: spend time with friends ≈ hang out with friends (hang out daha gündelik).
- item: U2-086 sensitive
  links_to: U1-070 caring / U1-093 understanding
  note_tr: Kişilik sıfatları ailesi; karakter tanımı sorularında birlikte çıkar.
- item: U2-084 follow the rules
  links_to: U1-071 fair
  note_tr: 'İyi genç/iyi arkadaş değerleri: kurallara uymak, adil olmak.'
- item: U2-091 relaxing / U2-083 entertaining
  links_to: U1-095 boring / U1-096 exciting / U1-100 thrilling
  note_tr: -ing değerlendirme sıfatları U1'de başladı; bu ünitede sayı ve incelik artıyor.
- item: U2-074 awesome / U2-075 terrific
  links_to: U1-022 Sounds + SIFAT!
  note_tr: '''Sounds terrific!'' davete olumlu cevap kalıbı; iki ünitenin birleştiği yer.'
- item: U2-044 sıklık zarfları
  links_to: U1-075 He/She is always in a hurry.
  note_tr: be + always sırası U1'de kalıp olarak görüldü; burada kural olarak öğretilir.
- item: U2-013 can't stand
  links_to: U1-021 Sorry, I can't …
  note_tr: 'Aynı ''can''t'' iki işlev: reddetme (U1) ↔ katlanamama (U2).'
- item: U2-089 all / most / half
  links_to: U3-047 How much / How many
  note_tr: Miktar dili Ünite 3'te sayılan/sayılamayan isimlerle devam eder.
- item: U2-015 be crazy about
  links_to: U3-058 have a sweet tooth / U3-053 be in the mood for
  note_tr: Beğeni ve istek ifadeleri yemek bağlamında devam eder.
- item: U2-079 recommend
  links_to: U3-059 worth trying
  note_tr: Tavsiye dili tarif ve restoran bağlamında tekrar eder.
- item: U2-008 enjoy
  links_to: U3-057 enjoy your meal
  note_tr: 'enjoy''un kalıplaşmış kullanımı: afiyet olsun.'
- item: dessert (kaynak X hatası)
  links_to: U3-055 dessert
  note_tr: Ünite 2 kaynak listesindeki 'desert = tatlı' yazım hatası, Ünite 3 öğretiminde düzeltilmeli.
