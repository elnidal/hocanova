mini_lessons:
- type: mini_dilbilgisi
  text_tr: 'enjoy, don''t mind, can''t stand her zaman -ing ister: I enjoy dancing. like, love ve hate ise ikisini de kabul eder: I like dancing / I like to dance.'
  refs:
  - U2-008
  - U2-011
  - U2-013
  - U2-007
  - U2-014
- type: hafiza_kancasi
  text_tr: terrific ≠ terrible! terrific harika, terrible berbat. Yazılışları kardeş ama biri gülümser, biri surat asar.
  refs:
  - U2-075
  - U2-078
- type: lgs_taktigi
  text_tr: 'Grafik sorusunda rakamı sözcüğe çevir: 30 kişide 18 → most, 15 → half, 3 → a few, 0 → none. ''Half'' tam yarıdır; 16 kişi half değil, ''more than half''tır.'
  refs:
  - U2-089
  - U2-090
- type: tuzak
  text_tr: smart clothes 'akıllı kıyafet' değil, şık kıyafettir. Düğüne smart, parka casual giyilir.
  refs:
  - U2-065
  - U2-064
- type: mini_dilbilgisi
  text_tr: 'Sıklık zarfı ana fiilin önüne, am/is/are''nin arkasına: I always walk to school · Kaan is always late.'
  refs:
  - U2-044
- type: hafiza_kancasi
  text_tr: hardly ever = 'hard' + 'ever', 'zor zahmet bir kere'. Neredeyse never demektir; yanına 'not' koyma.
  refs:
  - U2-051
  - U2-049
  - U2-050
- type: kelime_ailesi
  text_tr: '-ing veren, -ed hisseden: The film is boring → I am bored. The noise is annoying → I am annoyed.'
  refs:
  - U2-030
  - U2-042
  - U2-091
- type: lgs_taktigi
  text_tr: 'Beğeni skalasını sırala: can''t stand ≈ hate < dislike < don''t mind < like < enjoy / be fond of / be keen on < love < be crazy about. Diyalogda tavır derecesini buna göre seç.'
  refs:
  - U2-013
  - U2-014
  - U2-012
  - U2-011
  - U2-007
  - U2-008
  - U2-009
  - U2-010
  - U2-015
- type: ilginc_bilgi
  text_tr: 'teenager sözcüğü İngilizce sayılardaki ''-teen'' ekinden gelir: thirTEEN''den nineTEEN''e kadar olan yaşlar, yani 13-19.'
  refs:
  - U2-001
- type: hafiza_kancasi
  text_tr: 'queue ''kyu'' diye okunur: Q harfini söyle, geri kalan dört harf (ueue) sırada sessizce bekler.'
  refs:
  - U2-053
- type: kelime_ailesi
  text_tr: 'awesome ve awful aynı kökten (awe: hayranlık karışık korku) gelir ama bugün zıt anlamlıdır: awesome harika, awful berbat.'
  refs:
  - U2-074
  - U2-078
- type: tuzak
  text_tr: sensitive = duyarlı, hassas. sensible = mantıklı. 'Sensible' sensitif değildir!
  refs:
  - U2-086
- type: lgs_taktigi
  text_tr: How often sorusunun cevabı sıklıktır (once a week, hardly ever), saat değil. Şıklarda 'At 6 o'clock' görürsen o, What time sorusunun cevabıdır.
  refs:
  - U2-044
  - U2-052
- type: mini_dilbilgisi
  text_tr: 'Sporda üç fiil: top oyunlarına play (play football), -ing''li etkinliklere go (go hiking, go swimming), dövüş sporu ve bireysel egzersize do (do karate, do yoga).'
  refs:
  - U2-038
  - U2-039
  - U2-036
  - U2-037
- type: ilginc_bilgi
  text_tr: 'genre Fransızcadan gelir ve ''jonra'' gibi okunur. Gündelik konuşmada aynı anlamda ''type'' ya da ''kind'' de denir: What kind of music do you like?'
  refs:
  - U2-021
- type: tuzak
  text_tr: 'I don''t mind kaba değil, kibardır: ''fark etmez, benim için sorun değil.'' Olumsuz bir duygu taşımaz.'
  refs:
  - U2-011
- type: tuzak
  text_tr: 'advise fiil, advice isim. Ezber: Sesli söyle, advi-Z-e fiildir (vız vız iş yapar), advi-C-e isimdir. ''an advice'' denmez: some advice.'
  refs:
  - U2-081
- type: ilginc_bilgi
  text_tr: 'İngiliz ve Amerikan İngilizcesi: queue ↔ line, film ↔ movie, favourite ↔ favorite, trainers ↔ sneakers. LGS metinlerinde ikisi de çıkabilir.'
  refs:
  - U2-053
  - U2-073
- type: mini_dilbilgisi
  text_tr: 'he/she/it ile fiile -s: Selin follows the news. Ama does/doesn''t geldiyse -s gider: Does she follow…? She doesn''t like…'
  refs:
  - U2-054
  - U2-048
- type: hafiza_kancasi
  text_tr: 'Türkçedeki ''pikap'' (kamyonet) İngilizce pickup''tan gelir; pick up ''alıp yüklemek, almak'' demek. Bu ünitede: arabayla birini almak. My dad picks me up after school.'
  refs:
  - U2-048
open_questions:
- Kazanımlar (E8.2.L1, SI1, SP1, SP2, R1, W1) ve işlevler (Expressing likes and dislikes · Expressing preferences · Stating personal opinions / Making simple inquiries) okul yıllık planı ve il ÖDM belgeleri
  üzerinden doğrulandı; mufredat.meb.gov.tr'deki program PDF'inin kendisi açılıp okunmadı.
- Programın Ünite 2 işlev listesinde sıklık zarfları ve grafik dili ayrı işlev olarak geçmiyor (yalnız örnek cümlelerde 'usually', 'rarely/seldom', 'never' ve önerilen bağlamlarda 'Questionnaires, Tables,
  Reports' var). F6 ve G5-G7 bu yüzden ders kitabı ve LGS soru tipine dayanıyor.
- Tavsiye fiilleri (recommend, suggest, advise) programda bu üniteye bağlı değil; F7 düşük ağırlıkla tutuldu. Editör bu işlevi çıkarmak isteyebilir.
- 2018 programının 2027 LGS'de hâlâ geçerli olduğu görev tanımından alındı; Türkiye Yüzyılı Maarif Modeli programının 8. sınıfa hangi yıl geçtiği ayrıca doğrulanmadı.
- LGS'de Ünite 2'den kaç soru geldiği resmî olarak ilan edilmiyor; question_patterns geçmiş sınav kopyası değil, LGS biçimine göre özgün örneklerdir. MEB'in Teen Life örnek soruları bu dosya için incelenmedi.
- Kaynak X (212.xlsx) ÖZET sayfasının kaynak tablosunda ayrı kod olarak yok (C satırında '+ 212.xlsx eki' diye anılıyor) ama HAVUZ'da ayrı kod olarak kullanılıyor; kodlama birleştirilmeli.
- 'Havuz ÖZET sayfasında ''Öncelik 2: 33'' yazıyor; HEDEF sayfasında sayınca 31 çıkıyor (61 + 31 = 92). ÖZET''teki 33 güncellenmeli.'
- 'HAVUZ''da ''every day'' satırı C kaynağı için ''her hafta'' karşılığını gösteriyor; C listesinde ''every day: her gün'' ve ''every week: her hafta'' ayrı satırlar. Birleştirme hatası (öğretim birimini
  etkilemiyor).'
- Havuzda 'social media' satırındaki K notu 'takipçi' yanlış (social media = sosyal medya); öğretim birimi U2-058'i etkilemiyor.
