schema_version: 1
unit: 2
title: Teen Life
status: taslak
summary_tr: 'Ünite, gençlerin boş zamanını, düzenli etkinliklerini ve zevklerini konu alır: müzik ve film türleri, spor, sosyal medya, moda ve günlük rutin. Sınav omurgası üç ayaklıdır: (1) beğeni/tercih
  bildirme (like, love, enjoy, don''t mind, dislike, hate, can''t stand, be fond of, be keen on, be crazy about, be into + V-ing / isim) ve fikir belirtme (In my opinion, I think, To be honest); (2) sıklık
  zarfları ve ifadeleri (always … never, hardly ever, once/twice a week) ile Simple Present; (3) anket, tablo ve grafik dili (most, half, a few, none; more than, the most, the least). LGS''de bu ünite en
  çok tablo/grafik okuma, diyalog tamamlama ve kısa metin (blog, anket raporu) çıkarımı olarak gelir; değerlendirme sıfatları (terrific, ridiculous, unbearable, trendy, snob) şıklarda ve metinlerde anlam
  bilgisi ister.'
curriculum:
  outcomes:
  - code: E8.2.L1
    text_tr: 'Dinleme: Gençlerin düzenli etkinlikleriyle ilgili ifade ve kalıpları anlar.'
  - code: E8.2.SI1
    text_tr: 'Karşılıklı konuşma: Gençlerin düzenli etkinlikleri hakkında konuşur.'
  - code: E8.2.SP1
    text_tr: 'Sözlü anlatım: Neyi tercih ettiğini, neyi sevip neyi sevmediğini ifade eder.'
  - code: E8.2.SP2
    text_tr: 'Sözlü anlatım: Günlük etkinlikleri basit biçimde anlatır.'
  - code: E8.2.R1
    text_tr: 'Okuma: Gençlerin düzenli etkinlikleriyle ilgili kısa ve basit metinleri anlar. (LGS''de doğrudan ölçülen ana kazanım)'
  - code: E8.2.W1
    text_tr: 'Yazma: Gençlerin düzenli etkinlikleri hakkında kısa ve basit bir paragraf yazar.'
  functions:
  - id: F1
    name_tr: Beğeni ve beğenmeme bildirme (Expressing likes and dislikes)
    exponents:
    - I love/like/enjoy going to concerts.
    - I hate/dislike shopping with my parents.
    - I'm fond of / keen on camping.
    - I'm crazy about rap. / I'm really into jazz.
    - I never listen to pop music; I can't stand it.
    - I don't mind doing the washing-up.
    - Do you like playing computer games?
    responses:
    - Yes, I love it! / Yes, I'm crazy about it.
    - It's OK. I don't mind it.
    - Not really. / No, I can't stand it.
    - Me too. / So do I.
    - Me neither. / Neither do I.
    items:
    - U2-007
    - U2-008
    - U2-009
    - U2-010
    - U2-011
    - U2-012
    - U2-013
    - U2-014
    - U2-015
    - U2-016
    - U2-017
    lgs_weight: yüksek
    note_tr: Programdaki örnek cümlelerin çoğu bu işleve aittir. Şıklarda beğeni derecesi (can't stand ↔ crazy about) ve -ing yapısı sınanır.
  - id: F2
    name_tr: Tercih bildirme (Expressing preferences)
    exponents:
    - I prefer hip-hop concerts. I think they're terrific.
    - I prefer reading the news online.
    - I prefer team sports to individual sports.
    - Which do you prefer, rock or jazz?
    responses:
    - I prefer rock. It's more energetic.
    - I don't mind. Both are fine.
    - Neither. I'm into classical music.
    items:
    - U1-018
    - U2-011
    - U2-036
    - U2-037
    - U2-021
    lgs_weight: orta
    note_tr: prefer Ünite 1'de öğretildi (U1-018); burada 'prefer A to B' ve 'prefer + V-ing' kalıbıyla tekrar edilir.
  - id: F3
    name_tr: Kişisel fikir belirtme (Stating personal opinions)
    exponents:
    - In my opinion, casual clothes are more comfortable.
    - I think it's unbearable.
    - I believe teenagers need more free time.
    - From my point of view, social media is a waste of time.
    - To be honest, that film was awful.
    - What do you think about rap music?
    responses:
    - I agree with you. / You're right.
    - I don't agree. I think it's fascinating.
    - Really? I find it boring.
    items:
    - U2-005
    - U2-018
    - U2-060
    - U2-075
    - U2-076
    - U2-077
    - U2-078
    - U2-088
    lgs_weight: yüksek
    note_tr: Diyalog tamamlama sorularında boşluk genellikle fikir cümlesidir; doğru şık, karşı tarafın verdiği gerekçeyle uyumlu sıfatı içerir.
  - id: F4
    name_tr: Düzenli etkinlikler hakkında basit soru sorma (Making simple inquiries)
    exponents:
    - What do you do in the evenings?
    - What do you do in your free time?
    - How often do you go to the gym?
    - Do you ever go hiking?
    - What about you?
    responses:
    - I usually do my homework, but I also listen to music.
    - Twice a week, on Tuesdays and Fridays.
    - Hardly ever. I'm not keen on walking.
    - I rarely/seldom go to the theatre.
    items:
    - U2-002
    - U2-006
    - U2-044
    - U2-049
    - U2-050
    - U2-051
    - U2-052
    lgs_weight: yüksek
    note_tr: How often sorusunun cevabı sıklık zarfı ya da 'once/twice/three times a week' olmalıdır; şıklarda 'At 7 o'clock' gibi zaman cevabı çeldiricidir.
  - id: F5
    name_tr: Günlük rutini ve düzenli etkinlikleri anlatma
    exponents:
    - I always get up at 7 and my dad picks me up after school.
    - She regularly follows the news.
    - Most of the time, I hang out with my friends at weekends.
    - He works out at the gym three times a week.
    responses:
    - Really? I hardly ever get up before 9 at weekends.
    - That sounds like a busy daily routine!
    items:
    - U2-043
    - U2-045
    - U2-046
    - U2-047
    - U2-048
    - U2-054
    - U2-004
    - U2-032
    lgs_weight: orta
    note_tr: E8.2.SP2 ve E8.2.W1 ile örtüşür; LGS'de blog/günlük metninden bilgi çıkarma biçiminde gelir.
  - id: F6
    name_tr: Anket ve grafik sonuçlarını yorumlama
    exponents:
    - Most of the students like pop music.
    - Half of them go to the gym regularly.
    - Only a few teenagers listen to jazz.
    - None of them listen to classical music.
    - More students like football than basketball.
    - Classical music is the least popular genre.
    responses:
    - So, pop is the most popular genre in our class.
    - That's surprising! I thought more people liked rock.
    items:
    - U2-003
    - U2-089
    - U2-090
    - U2-023
    - U2-025
    lgs_weight: yüksek
    note_tr: Programın işlev listesinde ayrı başlık olarak yok; programın önerdiği bağlamlardan (Questionnaires, Tables, Reports) ve ders kitabı etkinliklerinden gelir. LGS'de tablo/grafik sorusunun dili
      budur, bu yüzden yüksek ağırlık verildi.
  - id: F7
    name_tr: Öneride bulunma ve tavsiye isteme (film, kitap, etkinlik)
    exponents:
    - Can you recommend a good science fiction film?
    - I suggest watching this documentary. It's educational.
    - My teacher advised me to read more.
    - You should try hiking. It's relaxing.
    responses:
    - Thanks, I'll watch it this weekend.
    - Hmm, I'm not into documentaries.
    items:
    - U2-079
