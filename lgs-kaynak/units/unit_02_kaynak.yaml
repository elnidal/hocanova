grammar:
- id: G1
  name_tr: Beğeni fiilleri + V-ing (like, love, enjoy, hate, dislike, don't mind, can't stand)
  form: Özne + like / love / enjoy / dislike / hate / don't mind / can't stand + V-ing ya da isim
  examples:
  - I enjoy listening to jazz in the evenings.
  - My brother can't stand waiting in a queue.
  - Do you mind lending me your guitar? — No, I don't mind.
  - She loves taking selfies, but she hates sharing them.
  explain_tr: 'Beğeni bildiren fiillerden sonra ikinci bir eylem gelirse fiil -ing alır. like, love ve hate ''to + fiil'' de alabilir (I like to read), anlam neredeyse aynıdır. enjoy, don''t mind, can''t
    stand ve dislike ise yalnızca -ing alır. enjoy tek başına kalamaz, nesne ister: ''I enjoyed it.'''
  common_errors:
  - wrong: I enjoy to play basketball.
    right: I enjoy playing basketball.
    why_tr: enjoy'dan sonra 'to' gelmez; Türkçedeki 'oynamaktan' yapısı -ing ile karşılanır.
  - wrong: I can't stand to get up early.
    right: I can't stand getting up early.
    why_tr: can't stand yalnızca -ing alır (LGS düzeyinde bunu kural olarak bil).
  - wrong: I enjoyed very much.
    right: I enjoyed it very much.
    why_tr: enjoy geçişlidir; neyden keyif aldığını söylemek zorundasın.
  - wrong: I don't mind to wait.
    right: I don't mind waiting.
    why_tr: don't mind + -ing.
  lgs_note: Boşluk doldurma ve diyalog sorularında fiil biçimi (playing/to play) sınanabilir; daha sık sınanan, fiilin anlam derecesidir (don't mind = nötr, can't stand = çok olumsuz).
  items:
  - U2-007
  - U2-008
  - U2-011
  - U2-012
  - U2-013
  - U2-014
- id: G2
  name_tr: Edatlı beğeni kalıpları + isim / V-ing (be fond of, be keen on, be crazy about, be into)
  form: Özne + am/is/are + fond of / keen on / crazy about / into / interested in + isim ya da V-ing
  examples:
  - Elif is crazy about a famous singer.
  - I'm not keen on doing karate.
  - Kaan is fond of playing basketball.
  - Are you into science fiction?
  explain_tr: 'Bu kalıplarda ''be'' fiili ve edat zorunludur; edattan sonraki fiil her zaman -ing alır. Güç sırası kabaca: be crazy about (bayılmak) > be fond of / be keen on (çok sevmek, meraklı olmak)
    > be into (gündelik: ilgisi olmak). Olumsuzda ''not keen on'' kibarca ''pek sevmem'' demektir.'
  common_errors:
  - wrong: I fond of music.
    right: I'm fond of music.
    why_tr: fond bir sıfattır; 'be' olmadan cümle kurulmaz. Türkçede 'düşkünüm' tek kelime olduğu için 'am' unutulur.
  - wrong: She is keen on to dance.
    right: She is keen on dancing.
    why_tr: Edattan (on, of, about, into) sonra fiil -ing olur.
  - wrong: He is crazy for football.
    right: He is crazy about football.
    why_tr: 'Edat kalıbın parçasıdır: crazy about, fond of, keen on, interested in.'
  - wrong: I'm interesting in jazz.
    right: I'm interested in jazz.
    why_tr: İlgiyi duyan kişi -ed alır; interesting, şeyin kendisini anlatır.
  lgs_note: Eş anlam sorularında 'be fond of = be keen on = like a lot' ve 'be into = be interested in' eşleşmeleri çıkar.
  items:
  - U2-009
  - U2-010
  - U2-015
  - U2-016
- id: G3
  name_tr: 'Tercih: prefer A to B / prefer + V-ing'
  form: prefer + isim/V-ing + to + isim/V-ing · Which do you prefer, A or B?
  examples:
  - I prefer pop music to rock music.
  - Bora prefers individual sports to team sports.
  - She prefers reading the news online.
  explain_tr: Karşılaştırmalı tercihte 'than' değil 'to' kullanılır. Kişi 3. tekil ise prefers olur.
  common_errors:
  - wrong: I prefer jazz than rap.
    right: I prefer jazz to rap.
    why_tr: prefer kalıbında 'than' yerine 'to'; Türkçedeki '-e göre/-den' karışıklığı.
  - wrong: He prefer hiking.
    right: He prefers hiking.
    why_tr: Simple Present'ta he/she/it -s alır.
  lgs_note: prefer Ünite 1'den tanıdık; bu ünitede tercih diyaloglarında ve anket metinlerinde geçer.
  items:
  - U1-018
  - U2-036
  - U2-037
- id: G4
  name_tr: 'Simple Present: düzenli etkinlikler ve rutin'
  form: I/You/We/They + V · He/She/It + V-s/-es · Do/Does + özne + V? · don't/doesn't + V
  examples:
  - Selin follows the news every morning.
  - Does Kaan work out regularly? — Yes, he does.
  - My dad picks me up after school.
  - Teenagers don't usually wear formal clothes at weekends.
  explain_tr: Alışkanlık, rutin ve genel doğruları anlatır. Soru ve olumsuzda does/doesn't geldiğinde fiil yalın kalır.
  common_errors:
  - wrong: She doesn't likes rap.
    right: She doesn't like rap.
    why_tr: -s yükünü 'does' alır; ana fiil yalın kalır.
  - wrong: Does he goes to the gym?
    right: Does he go to the gym?
    why_tr: Soruda da aynı kural.
  - wrong: My sister watch TV every evening.
    right: My sister watches TV every evening.
    why_tr: 3. tekil öznede -s/-es unutulmamalı.
  lgs_note: Metin sorularında 3. tekil kişi hakkında anlatım yapılır; doğru şık genellikle metindeki bilginin farklı sözcüklerle (paraphrase) söylenmiş hâlidir.
  items:
  - U2-043
  - U2-048
  - U2-054
- id: G5
  name_tr: 'Sıklık zarfları: sıra ve cümledeki yer'
  form: always (%100) > usually > often > sometimes > rarely/seldom/hardly ever > never (%0) · zarf + ana fiil · am/is/are + zarf
  examples:
  - Kaan is always late for school.
  - I usually hang out with my friends on Saturdays.
  - Bora hardly ever reads books.
  - We rarely go to classical music concerts.
  explain_tr: 'Sıklık zarfı ana fiilden önce, ''be'' fiilinden (am/is/are) sonra gelir. Yardımcı fiil varsa yardımcı fiil ile ana fiil arasına girer: ''I don''t usually…'', ''Do you often…?''. sometimes
    ve usually cümle başına da gelebilir. rarely, seldom, hardly ever ve never zaten olumsuz anlamlıdır; fiil olumlu kalır.'
  common_errors:
  - wrong: I go always to the gym.
    right: I always go to the gym.
    why_tr: Türkçede zarf serbest dolaşır; İngilizcede ana fiilden önce durur.
  - wrong: He always is happy.
    right: He is always happy.
    why_tr: be fiilinden sonra gelir.
  - wrong: I don't never eat fast food.
    right: I never eat fast food.
    why_tr: Çift olumsuz olmaz; never/hardly ever zaten 'hiç/neredeyse hiç' demektir.
  - wrong: I hardly go to the cinema. (= neredeyse hiç anlamında)
    right: I hardly ever go to the cinema.
    why_tr: Sıklık için kalıp 'hardly ever'dır.
  lgs_note: Tablo sorularında işaret sayısı ↔ zarf eşleştirmesi sınanır (7 gün = always/every day, 0 = never). Ölçekte rarely ve seldom aynı basamaktadır.
  items:
  - U2-044
  - U2-049
  - U2-050
  - U2-051
  - U2-045
  - U2-046
  - U2-047
- id: G6
  name_tr: 'Sıklık ifadeleri: once / twice / … times + a day/week/month; every …'
  form: once / twice / three times + a + day/week/month/year · every + day/week/Monday · on + günler (on Fridays)
  examples:
  - I go hiking twice a month.
  - Duru walks Fıstık three times a day.
  - We have band practice every Saturday.
  explain_tr: Bu ifadeler cümlenin sonuna gelir. 'Bir kez' once, 'iki kez' twice; üçten sonra 'number + times'. 'Haftada' karşılığı 'a week'tir (in a week değil).
  common_errors:
  - wrong: I go to the gym two times in a week.
    right: I go to the gym twice a week.
    why_tr: Türkçedeki 'haftada' → a week; 'two times' yanlış değil ama 'twice' doğal ve sınavdaki biçimdir.
  - wrong: How many times do you go swimming? — At 5 o'clock.
    right: How often do you go swimming? — Once a week.
    why_tr: Sıklık sorusu 'How often'dır; cevap saat değil sıklık olmalıdır.
  lgs_note: Tablo sorularında 'once a week' ile 'every day' gibi farklar üzerinden doğru/yanlış cümle seçtirilir.
  items:
  - U2-052
  - U2-044
- id: G7
  name_tr: 'Anket ve grafik dili: miktar sözcükleri ve karşılaştırma'
  form: All / Most / Half / Some / A few / None + of the + çoğul isim (+ çoğul fiil) · more/less + isim + than · the most / the least + sıfat/isim
  examples:
  - Most of the students enjoy pop music.
  - Half of the teenagers in the survey work out regularly.
  - Only a few students listen to jazz.
  - None of my classmates likes folk music.
  - Football is more popular than basketball in our class.
  - Rap is the least popular genre.
  explain_tr: 'Oranlar: all = %100, most = yarıdan fazla, half = %50, some = bir kısmı, a few = az sayıda, none = %0. ''about / nearly'' = yaklaşık. Bir sınıfın %60''ı ''most'' (çoğu), %10''u ''a few''
    (birkaçı) olarak anlatılır. ''None of'' sonrası fiil tekil ya da çoğul olabilir; sınavda ikisi de kabul görür.'
  common_errors:
  - wrong: Most of students like rap.
    right: Most of the students like rap. / Most students like rap.
    why_tr: '''of'' kullanılırsa ardından ''the/my/these'' gelir.'
  - wrong: The most students like pop.
    right: Most students like pop.
    why_tr: '''the most'' en çok (üstünlük) demektir; ''çoğu'' anlamında ''most'' tek başına kullanılır.'
  - wrong: None of them don't like football.
    right: None of them like(s) football.
    why_tr: None zaten olumsuz; fiil olumlu kalır.
  - wrong: Basketball is popular than tennis.
    right: Basketball is more popular than tennis.
    why_tr: Uzun sıfatlarda karşılaştırma 'more … than' ile yapılır.
  lgs_note: 'Grafik sorusunun özü: rakamı doğru miktar sözcüğüne çevirmek. ''Half'' = tam yarı; 15/30 half, 16/30 ''more than half/most''.'
  items:
  - U2-089
  - U2-090
  - U2-003
- id: G8
  name_tr: Fikir bildirme kalıpları ve noktalama
  form: In my opinion, … · I think (that) … · I believe (that) … · From my point of view, … · To be honest, …
  examples:
  - In my opinion, smart clothes are not comfortable.
  - To be honest, I can't stand horror films.
  - I believe hiking is relaxing.
  explain_tr: Hepsi 'bence' anlamına yakındır. In my opinion / From my point of view / To be honest cümle başındayken virgülle ayrılır; I think / I believe virgül almaz.
  common_errors:
  - wrong: According to me, jazz is boring.
    right: In my opinion, jazz is boring.
    why_tr: '''Bana göre''nin kelimesi kelimesine çevirisi doğal değildir; according to başkalarının görüşü/kaynak için kullanılır (according to the survey).'
  - wrong: In my opinion, I think rap is awesome.
    right: In my opinion, rap is awesome. / I think rap is awesome.
    why_tr: İki fikir kalıbı üst üste gereksiz tekrar olur.
  - wrong: To be honestly, …
    right: To be honest, …
    why_tr: 'Kalıp sabittir: to be honest.'
  lgs_note: according to soru köklerinde 'metne/grafiğe göre' anlamında çok geçer; öğrencinin kendi fikri için kullanılmaz.
  items:
  - U2-005
  - U2-018
- id: G9
  name_tr: -ed / -ing sıfatları (annoyed / annoying, relaxed / relaxing)
  form: duyguyu yaşayan kişi → -ed (annoyed, bored, interested) · duyguyu veren şey/kişi → -ing (annoying, boring, interesting)
  examples:
  - The noisy neighbour is annoying. Duru is annoyed.
  - Hiking is relaxing, so I feel relaxed after it.
  - This documentary is educational and entertaining.
  explain_tr: 'Türkçede ''sıkıcı / sıkılmış'', ''sinir bozucu / sinirlenmiş'' farkı aynı mantıktır: -ing = -ıcı, -ed = -mış.'
  common_errors:
  - wrong: I am boring in the history lesson.
    right: I am bored in the history lesson.
    why_tr: '''I am boring'' ''ben sıkıcı biriyim'' demektir.'
  - wrong: The loud music makes me annoying.
    right: The loud music makes me annoyed.
    why_tr: Duyguyu yaşayan kişi -ed alır.
  lgs_note: Sıfat seçimi soruları ve metindeki duygu çıkarımı (Duru is annoyed → mutsuz/rahatsız) için.
  items:
  - U2-030
  - U2-042
  - U2-091
  - U2-083
  - U2-082
- id: G10
  name_tr: recommend / suggest / advise kalıpları
  form: recommend/suggest + V-ing · recommend + isim (+ to someone) · advise + someone + to V · advice (isim, sayılamaz)
  examples:
  - Murat Bey recommended this book to us.
  - I suggest watching a science fiction film tonight.
  - The coach advised Kaan to rest after training.
  explain_tr: 'advise fiildir (s ile, /z/ sesi), advice isimdir (c ile, /s/ sesi) ve sayılamaz: a piece of advice.'
  common_errors:
  - wrong: She suggested me a film.
    right: She suggested a film to me.
    why_tr: suggest kişiyi doğrudan nesne almaz.
  - wrong: He gave me an advise.
    right: He gave me some advice.
    why_tr: İsim advice'tır ve 'an' almaz.
  - wrong: I recommend you to watch it.
    right: I recommend watching it. / I recommend that you watch it.
    why_tr: LGS düzeyinde güvenli kalıp recommend + V-ing ya da isim.
  lgs_note: Düşük ağırlık; okuma metinlerinde tanıma düzeyinde yeterli.
  items:
  - U2-079
  - U2-080
  - U2-081
expressions:
- en: What do you do in your free time?
  tr: Boş zamanında ne yaparsın?
  use: Birinin hobilerini sorarken; anketin klasik ilk sorusu.
  reply:
  - I usually hang out with my friends.
  - I'm into music, so I play the guitar.
  item: U2-002
  register: nötr
- en: How often do you …?
  tr: Ne sıklıkla …?
  use: Bir etkinliğin sıklığını sorarken.
  reply:
  - Twice a week.
  - Hardly ever.
  - Every day after school.
  item: U2-044
  register: nötr
- en: What about you? / How about you?
  tr: Ya sen?
  use: Kendi cevabını verdikten sonra soruyu karşı tarafa yöneltirken.
  reply:
  - Me too.
  - Not me. I prefer rock.
  item: U2-006
  register: gündelik
- en: I don't mind.
  tr: Fark etmez. / Benim için sorun değil.
  use: Seçenekler arasında tercihin olmadığında ya da bir şeye razı olduğunda.
  reply:
  - Great, let's watch the comedy then.
  - Are you sure?
  item: U2-011
  register: nötr
- en: I can't stand it!
  tr: Ona katlanamıyorum! / Hiç çekemem!
  use: Çok güçlü hoşnutsuzluk; arkadaşlar arasında.
  reply:
  - Really? I quite like it.
  - Me neither! It's so annoying.
  item: U2-013
  register: gündelik
- en: I'm crazy about …
  tr: …'e bayılıyorum.
  use: Çok sevdiğin bir şey için coşkulu konuşurken.
  reply:
  - Me too! It's awesome.
  - Really? I'm not keen on it.
  item: U2-015
  register: gündelik
- en: I'm not really into …
  tr: … pek bana göre değil.
  use: Kibarca ilgisizlik bildirirken.
  reply:
  - What are you into, then?
  - No problem. What about pop?
  item: U2-016
  register: gündelik
- en: It's not my cup of tea.
  tr: Bana hitap etmiyor. / Benim tarzım değil.
  use: İngiliz İngilizcesinde kibar 'sevmem' deyimi; bir müzik türü, film ya da etkinlik için.
  reply:
  - Fair enough. What do you like?
  item: U2-012
  register: gündelik
- en: To be honest, …
  tr: Açıkçası, … / Dürüst olmak gerekirse, …
  use: Karşı tarafın duymak istemeyebileceği bir fikri yumuşatarak söylerken.
  reply:
  - That's OK. Tell me.
  - I see your point.
  item: U2-018
  register: nötr
- en: In my opinion, … / From my point of view, …
  tr: Bence, … / Bana göre, …
  use: Fikrini açıkça belirtirken; yazılı metinlerde ve sunumlarda da uygun.
  reply:
  - I agree with you.
  - I'm afraid I don't agree.
  item: U2-005
  register: resmi
- en: Me too. / So do I.
  tr: Ben de.
  use: Olumlu bir cümleye katılırken (I love jazz. — So do I.).
  reply: []
  register: gündelik
- en: Me neither. / Neither do I.
  tr: Ben de (değil).
  use: Olumsuz bir cümleye katılırken (I don't like rap. — Me neither.).
  reply: []
  register: gündelik
- en: It drives me crazy.
  tr: Beni deli ediyor, çıldırtıyor.
  use: Sinir bozucu bir şey için; 'be crazy about' (bayılmak) ile karıştırılmamalı.
  reply:
  - I know! It's so annoying.
  - Just ignore it.
  item: U2-030
  register: gündelik
- en: That's ridiculous!
  tr: Bu çok saçma!
  use: Mantıksız ya da gülünç bir fikir veya görünüm için.
  reply:
  - No, it isn't! It's trendy.
  - I know, but it's funny.
  item: U2-060
  register: gündelik
- en: Sounds terrific! / That's awesome!
  tr: Kulağa müthiş geliyor! / Bu müthiş!
  use: Bir öneriye ya da habere coşkuyla karşılık verirken.
  reply:
  - I knew you'd like it!
  item: U2-075
  register: gündelik
- en: Can you recommend a good …?
  tr: İyi bir … önerebilir misin?
  use: Film, kitap, şarkı tavsiyesi isterken.
  reply:
  - I'd recommend this one. It's fascinating.
  - You should watch a science fiction film.
  item: U2-079
  register: nötr
- en: You look fit!
  tr: Formda görünüyorsun!
  use: Spor yapan birine iltifat ederken.
  reply:
  - Thanks! I work out three times a week.
  item: U2-034
  register: gündelik
- en: Let's hang out after school.
  tr: Okuldan sonra takılalım.
  use: Arkadaşa gündelik buluşma önerirken.
  reply:
  - Sounds good!
  - Sorry, I can't. I have karate.
  item: U2-004
  register: gündelik
- en: No way!
  tr: Olmaz! / İmkânı yok! / Hadi canım!
  use: Güçlü ret ya da şaşkınlık; arkadaşlar arası.
  register: gündelik
