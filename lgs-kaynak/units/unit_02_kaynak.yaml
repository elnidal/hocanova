  - U2-075
  - U2-076
  - U2-077
- words:
  - awful
  - terrible
  - unbearable
  - ridiculous
  difference_tr: awful/terrible = berbat (kalite); unbearable = katlanılmaz (sıcak, gürültü, ödev yükü); ridiculous = saçma, gülünç (fikir, kıyafet).
  items:
