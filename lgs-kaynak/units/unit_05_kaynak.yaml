  - U5-014
- id: G6
  name_tr: 'Güvenlik kuralları: emir kipi, Don''t …, avoid + V-ing, before + V-ing'
  form: V1 … (Keep your password secret.) · Don't + V1 … · Never + V1 … · Avoid + V-ing · Before + V-ing, … · Be careful with …
  examples:
  - Don't share your personal information with strangers.
  - Never click on a 'free offer' from an unknown account.
  - Avoid using dangerous sites.
  - Before downloading a file, check it with an adult.
  - Log out of your account on public computers.
  explain_tr: Kural ve tavsiye listeleri emir kipiyle yazılır; olumsuzu Don't ya da Never ile. avoid'den sonra fiil -ing alır (avoid using). before ve after edat olarak kullanıldığında da fiil -ing alır
    (Before downloading …). obey the rules = kurallara uymak (follow the rules ile aynı, Ü2).
  common_errors:
  - wrong: Avoid to use dangerous sites.
    right: Avoid using dangerous sites.
    why_tr: avoid + V-ing; to yok.
  - wrong: Not share your password.
    right: Don't share your password.
    why_tr: Olumsuz emir Don't + V1 ile kurulur.
  - wrong: Before download a file, …
    right: Before downloading a file, … / Before you download a file, …
    why_tr: before'dan sonra ya -ing ya da tam cümle gelir.
  lgs_note: 'Güvenlik metni sorularında ''Which of the following is NOT suggested?'' tipi beklenir: metindeki Don''t cümlesini olumluya çeviren şık (Share your address) doğru cevaptır.'
