schema_version: 1
unit: 5
title: The Internet
status: taslak
summary_tr: 'Ünite, internetin günlük dilini ve internet alışkanlıklarını konuşmayı öğretir: hesap açma ve giriş (sign up, log in / log out, password), bilgisayar eylemleri (click, type, download / upload,
  attach, delete), sosyal medya (post, comment, follower, notification, social networking sites), internet güvenliği (personal information, stranger, avoid, obey the rules) ve internet alışveriş bilgileri
  (discount, refundable, expiry date). MEB programındaki işlev "kabul etme, reddetme ve bahane sunma"dır (Would you like to join our WhatsApp group? / Why don''t we chat online at two? / I''m sorry, but
  I can''t. My internet is broken.); bu işlev Ü1''in tekrarıdır, yenisi açıklama isteme ve verme kalıplarıdır (What do you mean? Do you mean the Internet connection? / I mean … / In other words …). Dilbilgisi
  yükü hafiftir: alışkanlık bildiren Simple Present ve sıklık ifadeleri (How often / How many hours a day … ? / per week), anket–grafik dili (percent, most, average), internet fiillerinin edatları (log
  in to, comment on, search for) ve güvenlik kurallarında emir kipi. LGS''de bu ünite en çok internet kullanımı grafiği/anketi, internet güvenliği ya da alışkanlık metni, internet reklamı / bilet / alışveriş
  ekranı çıkarımı ve kabul–red diyaloğu tamamlama olarak gelir.'
curriculum:
  outcomes:
  - code: E8.5.L1
    text_tr: 'Dinleme: Sözlü metinlerin ana fikrini anlar.'
  - code: E8.5.L2
    text_tr: 'Dinleme: İlgili ifade ve kelimeleri anlar.'
  - code: E8.5.SI1
    text_tr: 'Karşılıklı konuşma: İnternet alışkanlıkları hakkında konuşur.'
  - code: E8.5.SI2
    text_tr: 'Karşılıklı konuşma: İnternet hakkında bilgi alışverişinde bulunur.'
  - code: E8.5.SP1
    text_tr: 'Sözlü anlatım: Bir dizi kalıp ve basit cümleyle bahane sunar, teklifleri kabul eder ve reddeder.'
  - code: E8.5.R1
    text_tr: 'Okuma: İnternet alışkanlıklarıyla ilgili kısa ve basit metinlerde ana fikri belirler. (LGS''de doğrudan ölçülen kazanım)'
  - code: E8.5.R2
    text_tr: 'Okuma: Çeşitli metinlerde internetle ilgili belirli bilgiyi bulur. (LGS''de doğrudan ölçülen kazanım)'
  - code: E8.5.W1
    text_tr: 'Yazma: İnternet alışkanlıklarını anlatan basit bir paragraf yazar.'
  functions:
  - id: F1
    name_tr: Teklif ve öneriyi kabul etmek, reddetmek, bahane sunmak (Accepting and refusing / Making excuses)
    exponents:
    - Would you like to join our WhatsApp group?
    - Why don't we chat online at two o'clock? I want to tell you something important.
    - I'm visiting the museum online this afternoon. Would you like to join us?
    - Do you want to watch the live stream with us tonight?
    responses:
    - Yes, sure. / That sounds great.
    - No, thanks. I'm really busy.
    - I'm sorry, but I can't. My internet is broken.
    - Thanks for asking, but I'm afraid I can't.
    - That's very kind of you, but I'm busy.
    - No, thanks. I don't really like using social media accounts.
    items:
    - U5-059
    - U5-056
    - U5-015
    - U5-020
    - U5-035
    lgs_weight: yüksek
    note_tr: 'Programın tek açık işlevi (W1). Davet kalıpları ve ''Sorry, I can''t'' Ü1''de öğretildi (U1-026, U1-021, U1-022); bu ünitede yeni olan öneri kalıbı Why don''t we …? ve kibar red girişleridir.
      Bahanenin içeriği internettir: bağlantı yok, internet bozuk, bilgisayar çalışmıyor.'
  - id: F2
    name_tr: Açıklama istemek ve vermek; anlamadığını söylemek (Asking for and giving clarification)
    exponents:
    - What do you mean?
    - Do you mean the Internet connection?
    - What do you mean by that exactly?
    - What does 'SNS' stand for?
    - Can you explain what it means, please?
    - Sorry, I can't follow you.
    responses:
    - I mean, is your PC online or offline?
    - What I mean is that there isn't a connection sign on the screen.
    - In other words, you can't connect to the Internet.
    - It stands for 'social networking site'.
    - Oh, I got it. Thanks!
    items:
    - U5-057
    - U5-054
    - U5-058
    - U5-055
    - U5-020
    - U5-021
    - U5-026
    lgs_weight: yüksek
    note_tr: Programın Useful Language satırı (What do you mean? Do you mean the Internet connection? — Yes. It isn't working properly.) bu işlevi bahane diyaloğunun içine yerleştirir. Kaynak listeler (P,
      B, C) I mean, In other words, What I mean is …, I can't follow you, I got it kalıplarını ekler.
  - id: F3
    name_tr: İnternet alışkanlıkları hakkında soru sormak ve anlatmak (Talking about Internet habits)
    exponents:
    - What do you use the Internet for?
    - How often do you use the Internet?
    - How many hours a day do you spend on social media?
    - Which device do you usually prefer when you use the Internet?
    - Who uses the Internet in your family mostly?
    - How do you connect to the Internet?
    responses:
    - I often use the Internet for doing research and chatting with friends.
    - Every day. About two hours a day.
    - I usually use my mum's tablet.
    - My grandfather! He reads online news all day.
    - By phone and tablet.
    items:
    - U5-047
    - U5-040
    - U5-045
    - U5-044
    - U5-038
    - U5-051
    - U5-036
    lgs_weight: yüksek
    note_tr: Kazanımların çoğu (E8.5.SI1, R1, W1) alışkanlık anlatımıdır. Ders kitabındaki 'Are you an Internet addict?' testi ve internet kullanım grafikleri bu işlevi okuma sorusuna çevirir.
  - id: F4
    name_tr: 'İnternet hakkında bilgi alışverişi: hesap, paylaşım ve güvenlik (Exchanging information about the Internet)'
    exponents:
    - You must create an account to log in.
    - Don't share your personal information and password.
    - Before downloading a file, check it with an adult.
    - Refuse unknown people's friend requests.
    - Be careful with what you share on the Internet.
    - Avoid using dangerous sites.
    responses:
    - OK, I'll change my password right now.
    - Good idea. I never accept friend requests from strangers.
    - Thanks, I didn't know that.
    items:
    - U5-002
    - U5-006
    - U5-009
    - U5-010
    - U5-013
    - U5-005
    - U5-003
    - U5-008
    - U5-011
    - U5-019
    - U5-034
    lgs_weight: yüksek
    note_tr: Ders kitabında (W2) güvenlik kuralları doğru/yanlış eşleştirme olarak işlenir (Share your address with strangers. ✗ / Keep your password secret except from your family members. ✓). LGS'de 'Which
      of the following is NOT a piece of advice in the text?' tipine çok uygundur.
  - id: F5
    name_tr: İnternetten alışveriş ve bilet ekranlarını anlamak (Online shopping)
    exponents:
    - This ticket is non-refundable.
    - Get a 20 percent discount on all products this week!
    - Please enter the cardholder's name and the expiry date.
    - Click the button to complete your order.
    responses:
    - Can I get my money back if I don't like it?
    - Is it refundable?
    - OK, I'll ask my mum to enter her card details.
    items:
