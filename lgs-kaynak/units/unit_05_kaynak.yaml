open_questions:
- Görev metninde Ünite 5 işlevleri 'Making simple inquiries / Stating personal opinions' olarak tahmin edilmişti; MEB 2018 programında (W1) Ünite 5'in işlevi yalnız 'Accepting and refusing / Making excuses'.
  Açıklama kalıpları (What do you mean? Do you mean …?) programın Useful Language'ında var; 'In other words' ve 'I can't follow you' yalnız kaynak listelerinde. Bu yorum onaylanıyor mu?
- Programın sırasında Ünite 5 15.–18. haftalara (Aralık–Ocak) konuyor; sezon planı Şubat–Mart diyor. Hikâye zamanı Safer Internet Day (9 Şubat 2027) ile uyumlu olduğu için Şubat korunabilir; okul takvimiyle
  çelişki kullanıcı kararı.
- Sezon çatışması için gereken 'hack / hacker', 'link', 'fake news', 'cyberbullying', 'report' kaynaklarda yok; birim yapılmadı. Hikâyede İngilizce olarak kullanılması (öğretilmeden) ya da 1–2 birim eklenmesi
  kullanıcı kararı.
- Çıkmış kelime tablosu (P) 2013–2020 TEOG/LGS'yi kapsıyor; 2021–2026 LGS soruları doğrulanmadı. P'nin hangi siteden alındığı bilinmiyor.
- Ders kitabı (W2) bilgileri egitimsistem.com cevap sayfasından; baskı yılı ve güncel kitapla birebirliği doğrulanamadı.
- ingilizcele.com listesi (görevde örnek kaynak) içerik telifi nedeniyle tam alınamadı; yerine ingilizcebankasi.com (C) kullanıldı. C listesi eski kitap tabanlı (donanım sahnesi).
- 'Gün gruplaması season.yaml çerçevesine dayanıyor; Story Bible u05 yazılınca pilot_day alanları items dosyasına işlenecek. Türkçe anlatıda ''Güvenli İnternet haftası'' adı R12 nedeniyle kullanılmamalı
  (güvenli = U5-011 karşılığı): <en>Safer Internet Week</en> önerildi.'
- Bilet sözcükleri (one-way, round trip) iki bağımsız kaynakta Ü5 altında geçtiği için Ü5'e geri alındı (U5-060); Ü7'de tekrar edilir.
