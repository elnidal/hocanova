    - U5-044
    lgs_weight: orta
    note_tr: Kaynak P ve B'deki bilet, indirim ve kart bilgileri bir internet alışveriş ekranı sahnesi taşır. Tek yön / gidiş-dönüş bilet ayrıntısı Ü7 Tourism'e bırakıldı (Ü4 kararıyla tutarlı).
