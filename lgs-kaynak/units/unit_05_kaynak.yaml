grammar:
- id: G1
  name_tr: 'Öneri ve teklif: Why don''t we …? · Would you like to …? — kabul, red, bahane'
  form: Why don't we + V1 …? · Would you like to + V1 …? → Sure. / That sounds great. · I'm sorry, but I can't. + bahane · Thanks for asking, but I'm afraid I can't. · That's very kind of you, but …
  examples:
  - Why don't we chat online at two o'clock?
  - Would you like to join our WhatsApp group? — Yes, sure!
  - I'm sorry, but I can't. My internet is broken.
  - Thanks for asking, but I'm afraid I can't. I have a lot of homework.
  explain_tr: 'Why don''t we …? biçim olarak olumsuz sorudur ama anlamı öneridir: ''… yapalım mı?''. Cevap ''Because …'' değil, kabul ya da red olur. Kibar red üç parçalıdır: teşekkür ya da iltifat (Thanks
    for asking / That''s very kind of you) + but + I''m afraid I can''t / I''m busy + bahane. Bahane çoğunlukla Simple Present ya da Present Continuous ile söylenir (My internet isn''t working. / I''m studying
    for the exam).'
  common_errors:
  - wrong: — Why don't we chat online? — Because I'm busy.
    right: — Why don't we chat online? — Sorry, I can't. I'm busy.
    why_tr: Soru gerçek bir 'neden' sorusu değil, öneridir; 'Because' ile cevaplanmaz.
  - wrong: Why don't we to chat online?
    right: Why don't we chat online?
    why_tr: Why don't we'den sonra yalın fiil gelir; 'to' yok.
  - wrong: Thanks for asking, and I can't.
    right: Thanks for asking, but I can't.
    why_tr: 'Teşekkürle reddin arasında zıtlık var: but.'
  lgs_note: 'Diyalog tamamlamada boşluktan sonra bahane geliyorsa (My internet is broken) boşluğa kibar red girişi gelir; sonra ''Great! See you then.'' geliyorsa kabul. Kabul–red ayrımını soran ''Which
    one is a refusal?'' tipinde ''Thanks for asking, but…'' tuzaklıdır: teşekkür ettiği hâlde reddeder.'
  items:
  - U5-059
  - U5-056
  - U5-015
- id: G2
  name_tr: 'Açıklama isteme ve verme: mean, stand for, in other words'
  form: What do you mean (by that)? · Do you mean + isim/cümle? · What does X mean? · What does X stand for? · I mean, … · What I mean is (that) … · In other words, …
  examples:
  - — My internet is broken. — What do you mean? Do you mean the Internet connection?
  - I mean, is your PC online or offline?
  - What does 'SNS' stand for? — It stands for 'social networking site'.
  - She never logs out of her account. In other words, anyone can use it.
  explain_tr: 'Karşıdakinin sözünü anlamadığında What do you mean? sorulur; tahminini kontrol etmek için Do you mean …? Kendi sözünü açarken I mean / What I mean is …; aynı şeyi daha basit söylerken In
    other words. Bir kısaltmanın açılımı stand for ile sorulur. ''mean'' burada fiildir; Ü1''deki sıfat ''mean'' (cimri, kaba) değildir. Soruda yardımcı fiil does/do olduğu için ''mean'' çekimsiz kalır:
    What does it mean?'
  common_errors:
  - wrong: What does it means?
    right: What does it mean?
    why_tr: does'tan sonra fiil yalın kalır.
  - wrong: What do you mean with that?
    right: What do you mean by that?
    why_tr: Kalıptaki edat 'by'dır; Türkçedeki 'onunla' etkisi.
  - wrong: What is SNS stand for?
    right: What does SNS stand for?
    why_tr: stand for fiildir; soru does ile kurulur.
  lgs_note: 'Altı çizili ''In other words'' ya da ''I mean'' cümlesi bir önceki cümlenin YENİDEN söylenişidir: eş anlam sorusunda doğru şık önceki cümleyle aynı bilgiyi verir, yeni bilgi ekleyen şık elenir.'
  items:
  - U5-057
  - U5-054
  - U5-058
  - U5-055
- id: G3
  name_tr: 'Alışkanlık bildirme: Simple Present + sıklık ifadeleri (How often / How many hours a day …?)'
  form: How often do you + V1 …? → every day / twice a week / three times a day · How many hours a day do you spend + on X / V-ing? · I use the Internet for + V-ing / isim · I use it to + V1
  examples:
  - How often do you check your notifications? — About ten times a day!
  - How many hours a day do you spend on social media?
  - I often use the Internet for doing research and online shopping.
  - My dad uses the Internet to pay the bills.
  - I post a video on our channel twice a week.
  explain_tr: 'Alışkanlık Simple Present ile anlatılır; üçüncü tekil şahısta -s (She checks, He spends). Sıklık sorusu How often, süre sorusu How many hours (a day/a week) ile kurulur. ''a day / a week''
    = ''günde / haftada'' (per day / per week ile aynı). Amaç için ''for + V-ing ya da isim'' veya ''to + V1'' kullanılır. Sıklık zarflarının yeri (always, usually, often) Ü2''de öğretildi: ana fiilden
    önce, be''den sonra.'
  common_errors:
  - wrong: I use the Internet for do research.
    right: I use the Internet for doing research. / I use the Internet to do research.
    why_tr: for'dan sonra fiil -ing alır; yalın fiil için to gerekir.
  - wrong: How many hours do you spend in the Internet?
    right: How many hours do you spend on the Internet?
    why_tr: İnternet için 'on the Internet' (ve 'online'); in değil.
  - wrong: My sister check her e-mails every day.
    right: My sister checks her e-mails every day.
    why_tr: Üçüncü tekil şahısta -s unutulur.
  lgs_note: Anket metinlerinde 'twice a week', 'three hours a day' gibi ifadeler tabloyla karşılaştırılır; 'once a day' ile 'once a week' ayrımı en sık çeldiricidir.
  items:
  - U5-047
  - U5-040
  - U5-044
  - U5-038
  - U5-045
- id: G4
  name_tr: 'Anket ve grafik dili: percent, most / half / few, average, increase'
  form: X percent of + çoğul isim + çoğul fiil · Most / Half / A few of the students + V1 · The average … is … · The number of … increases / is increasing
  examples:
  - Sixty percent of the students use the Internet for chatting.
  - Most of them spend more than two hours a day online.
  - The average user checks social media ten times a day.
  - Internet usage is increasing worldwide.
  explain_tr: Grafik ve anket cümlelerinde yüzde ve çoğunluk sözcükleri kullanılır. percent tekil yazılır (60 percent; 'percents' denmez). 'X percent of the students' çoğul fiil alır (use), 'X percent of
    the class' tekil olabilir. most, half, a few, none Ü2'de öğretildi (U2-089); burada internet verisiyle tekrar edilir. average = ortalama; increase = artmak (karşıtı decrease).
  common_errors:
  - wrong: Sixty percents of the students …
    right: Sixty percent of the students …
    why_tr: percent sayıdan sonra tekil kalır.
  - wrong: Most of student use the Internet.
    right: Most of the students use the Internet. / Most students use the Internet.
    why_tr: most of'tan sonra the + çoğul isim gelir.
  - wrong: The usage of the Internet are increasing.
    right: The usage of the Internet is increasing.
    why_tr: Özne 'usage' tekildir; of the Internet onu değiştirmez.
  lgs_note: 'Grafik sorularında ''Which of the following is TRUE according to the chart?'' — yüzdeleri sözcüklere çevir: %50 = half, %70–90 = most, %10–20 = a few. Çeldirici, en yüksek ve en düşük değerleri
    yer değiştirir.'
  items:
  - U5-044
  - U5-037
  - U5-041
  - U5-045
  - U5-048
- id: G5
  name_tr: İnternet fiilleri ve edatları
  form: log in to / log out of · sign up for · click on · comment on · post on · upload to / download from · search for · connect to · subscribe to · attach a file to an e-mail
  examples:
  - I can't log in to my account. I forgot my password.
  - Click on the button and sign up for the course.
  - Bora commented on Elif's video.
  - Don't download files from unknown websites.
  - Search for 'Safer Internet Day' on the search engine.
  explain_tr: İnternet fiillerinin çoğu sabit bir edatla kullanılır. log in to (giriş yapmak), log out of (çıkış yapmak), comment on (yoruma yazmak), search for (aramak), subscribe to (abone olmak). download
    from (… -den indirmek) ile upload to (… -e yüklemek) yön bakımından karşıttır. Türkçedeki hâl ekleri birebir çevrilince edat yanlışları çıkar.
  common_errors:
  - wrong: I commented his photo.
    right: I commented on his photo.
    why_tr: comment fiil olarak 'on' ister.
  - wrong: I'm searching my phone. (telefonumu arıyorum)
    right: I'm searching for my phone. / I'm looking for my phone.
    why_tr: search + nesne = o yerin içini aramak (search my bag = çantamı aramak); aranan şey 'for' ile gelir.
  - wrong: I uploaded the video from the Internet to my phone.
    right: I downloaded the video from the Internet to my phone.
    why_tr: İnternetten cihaza = download; cihazdan internete = upload.
  lgs_note: 'Gap-fill sorularında edat ya da yön ipucudur: ''from the website'' → download, ''to my channel'' → upload. sign in (giriş) ile sign up (kayıt) şıklarda birlikte gelir.'
