  tactics:
  - 'Diyalogda boşluktan SONRAKİ cümleyi oku: ''Yes. It isn''t working properly.'' bir ''Do you mean …?'' sorusuna, ''Great! See you then.'' bir kabule, ''OK, maybe next time.'' bir redde cevaptır.'
  - 'Kabul–red sorusunda ''Thanks'' kelimesine aldanma: ''Thanks for asking, but…'' bir RED''dir; but''tan sonrası belirleyicidir.'
  - Grafik sorusunda önce yüzdeleri sözcüğe çevir (%50 half, %70+ most, %10–20 a few, %0 none); sonra şıklardaki en büyük / en küçük iddiayı kontrol et.
  - Güvenlik metni sorusunda (NOT suggested) metindeki Don't / Never cümlelerini işaretle; bunları olumluya çeviren şık cevaptır.
  - 'Yön ipucu: ''from the Internet / website'' → download; ''to my channel / account'' → upload. Yeni hesap → sign up; var olan hesaba → log in / sign in.'
  - In other words / I mean ile başlayan şık yeni bilgi eklemez; önceki cümleyi özetler.
  exam_vocabulary:
  - en: Which of the following is TRUE according to the chart/survey?
    tr: Grafiğe/ankete göre aşağıdakilerden hangisi doğrudur?
  - en: Which of the following is NOT suggested/mentioned in the text?
    tr: Metinde hangisi önerilmemiş/söz edilmemiştir?
  - en: What is the main idea of the text?
    tr: Metnin ana fikri nedir?
  - en: Which of the following best completes the conversation?
    tr: Konuşmayı en iyi tamamlayan hangisidir?
  - en: Which one is a refusal / an acceptance?
    tr: Hangisi bir ret / bir kabuldür?
  - en: What does the underlined expression mean?
    tr: Altı çizili ifade ne anlama gelir?
  - en: survey / questionnaire / participants
    tr: anket / anket formu / katılımcılar
  - en: according to
    tr: … -e göre
cross_unit:
- item: U5-059
  links_to: U1-008 How about …? · U1-024 What about …? · U1-026 Would you like to …?
  note_tr: Ü1 davet kalıplarına 'Why don't we …?' eklenir; cevaplar aynı (Sounds great / Sorry, I can't).
- item: U5-056
  links_to: U1-021 Sorry, I can't … · U1-007 excuse · U4-023 I'm afraid …
  note_tr: 'Kibar red: Ü1 özür ve bahane + Ü4 ''I''m afraid'' birleşir.'
- item: U5-015
  links_to: U1-007 excuse
  note_tr: Programın bahane örneği 'My internet is broken'; Bora'nın eski bahane alışkanlığına (kedi) gönderme.
- item: U5-057
  links_to: U1-083 mean (sıfat)
  note_tr: 'Aynı sözcük: Ü1''de ''cimri, kaba'', Ü5''te ''demek istemek''. Tuzak kartı ikisini yan yana koyar.'
- item: U5-020
  links_to: U4-003 connect (connection) · U2-055 chat online · U2-056 surf the internet
  note_tr: Bağlantı ve çevrim içi etkinlikler Ü2 ve Ü4'te başladı; Ü5 online/offline ve connection sign ile tamamlar.
- item: U5-035
  links_to: U2-058 share on social media · U1-043 share
  note_tr: Paylaşım Ü1–Ü2'de öğretildi; Ü5 social networking sites, post, comment ile genişletir.
- item: U5-047
  links_to: U2-044 sıklık zarfları · U2-052 once / twice … times · U2-046 mostly
  note_tr: Alışkanlık soruları Ü2'nin sıklık dilini internet bağlamında tekrar eder.
- item: U5-044
  links_to: U2-089 all / most / half / a few / none · U2-090 more than / the most
  note_tr: Ü2 anket–grafik dili burada yüzde ve ortalama ile genişler.
- item: U5-008
  links_to: U2-084 follow the rules
  note_tr: obey the rules = follow the rules.
- item: U5-016
  links_to: U2-056 surf the internet
  note_tr: browse the Internet = surf the Internet; yeni olan browser (tarayıcı) ismi.
- item: U5-032
  links_to: U1-033 friendship · U4-008 keep in touch
  note_tr: 'Çıkmış kelimeler make new friends ve keep in touch: internetle arkadaşlık Ü1 ve Ü4''e bağlanır.'
- item: U5-051
  links_to: U4-041 return / change a product · U4-039 deliver · U4-040 make a complaint
  note_tr: Ü4'teki çağrı merkezi iadesi Ü5'te internet alışverişi (refundable, discount) ile birleşir.
- item: U5-052
  links_to: Ü7 Tourism
  note_tr: Ü5 G10'da öğretildi (U5-060, internetten bilet alma); Ü7 Tourism'de tekrar edilir.
- item: U5-046
  links_to: U1-076 helpful
  note_tr: useful (şey için) ↔ helpful (kişi için de).
- item: U5-011
  links_to: U1-059 reliable
  note_tr: Güvenilir kaynak (reliable source) sahte haber sahnesinde Ü1 sözcüğüyle kurulur.
