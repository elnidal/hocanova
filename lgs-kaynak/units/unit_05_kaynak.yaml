traps:
- about: sign in / sign up
  item: U5-006
  kind: kaynak_hatasi
  trap_tr: Kaynak P 'sign in / sign up = kaydolmak, hesap açmak' veriyor. sign in = giriş yapmak; yalnız sign up = kaydolmak.
  tip_tr: in = içeri gir (giriş), up = yeni hesap 'kur' (kayıt).
- about: post
  item: U5-034
  kind: cok_anlamli
  trap_tr: post 'posta, postalamak' olarak bilinir; sosyal medyada 'paylaşmak' ve 'gönderi'. Kaynak B 'postalamak, göndermek' veriyor.
  tip_tr: on social media / on Instagram ile geliyorsa paylaşmak.
- about: type
  item: U5-024
  kind: cok_anlamli
  trap_tr: type isim olarak 'tür' (What type of music?), fiil olarak klavyeyle yazmak (type your password).
  tip_tr: Ardından password, name, message geliyorsa yazmak.
- about: broken
  item: U5-015
  kind: turkce_etkisi
  trap_tr: broken yalnız 'kırık' bilinir; internet ve cihaz için 'bozuk, çalışmıyor' demektir.
  tip_tr: My internet is broken = It isn't working properly.
- about: stranger
  item: U5-013
  kind: sahte_dost
  trap_tr: '''yabancı'' çevirisi ''başka ülkeden biri'' gibi anlaşılır; stranger tanımadığın kişidir. Başka ülkeden biri foreigner.'
  tip_tr: Ailende ya da tanıdıklarında olmayan herkes stranger olabilir, aynı mahalleden bile.
- about: information
  item: U5-042
  kind: dilbilgisi
  trap_tr: 'information sayılamaz: ''informations'', ''an information'' yanlış.'
  tip_tr: some information / a piece of information. advice ve content da sayılamaz.
- about: mean (fiil) / mean (sıfat)
  item: U5-057
  kind: cok_anlamli
  trap_tr: Ü1'de mean 'cimri, kaba' sıfatıydı (U1-083); burada 'demek istemek, kastetmek'.
  tip_tr: 'do/does ile soru kuruluyorsa fiil: What do you mean?'
- about: follow
  item: U5-055
  kind: cok_anlamli
  trap_tr: follow sosyal medyada 'takip etmek'; 'I can't follow you' ise 'seni anlayamıyorum'.
  tip_tr: Konuşma içinde açıklamadan sonra geliyorsa anlamak.
- about: I got it
  item: U5-055
  kind: turkce_etkisi
  trap_tr: '''aldım'' diye çevrilir; kalıp olarak ''anladım''.'
  tip_tr: Açıklamanın ardından gelen I got it = I understand.
- about: Why don't we …?
  item: U5-059
  kind: dilbilgisi
  trap_tr: Olumsuz soru gibi görünür, öğrenci 'Because …' ile cevap verir; oysa öneridir.
  tip_tr: 'Why don''t we = Let''s. Cevap: Sure! / Sorry, I can''t.'
- about: turn on / turn off / open
  item: U5-023
  kind: turkce_etkisi
  trap_tr: Türkçede 'bilgisayarı açmak' ve 'kapıyı açmak' aynı fiil; İngilizcede cihaz için turn on, kapı için open.
  tip_tr: 'Elektrikle çalışan şey: turn on / turn off.'
- about: download / upload
  item: U5-019
  kind: benzer_yazilis
  trap_tr: 'Yön karışır: down = internetten bana, up = benden internete.'
  tip_tr: Video kanala YÜKLENİR (upload), oyun telefona İNDİRİLİR (download).
- about: influencer
  item: U5-031
  kind: kaynak_hatasi
  trap_tr: Kaynak P influencer = 'etkileyen' veriyor; kullanılan anlam 'sosyal medya fenomeni, çok takipçili kişi'. influential (etkili) sıfattır.
  tip_tr: -er = kişi (influencer), -ial = sıfat (influential).
- about: expiry date
  item: U5-050
  kind: kaynak_hatasi
  trap_tr: P ve B 'son kullanma tarihi' veriyor; ürünlerde doğru, kredi kartında 'son geçerlilik tarihi' demek.
  tip_tr: Kart formunda expiry date = kartın geçerli olduğu son ay/yıl.
- about: seen / seem (ingilizceciyiz)
  kind: kaynak_hatasi
  trap_tr: Kaynak B 'seen = görünmek' veriyor; seen 'see' fiilinin üçüncü hâli (görüldü), görünmek = seem.
  tip_tr: Mesajlaşmada 'Seen' = görüldü bilgisi.
- about: browser, attachment (ingilizcebankasi)
  kind: kaynak_hatasi
  trap_tr: 'Kaynak C: browser = ''internet açar'' (doğrusu tarayıcı), attachment = ''eklenti'' (e-postada doğrusu ek, ekli dosya; eklenti = add-on).'
  tip_tr: e-mail with an attachment = ekli e-posta.
- about: engaged in / engaged
  kind: benzer_yazilis
  trap_tr: Kaynak B 'engaged in = ile uğraşmak' veriyor; Ü4'te engaged 'hat meşgul' (U4-016). Öğrenci karıştırabilir.
  tip_tr: Telefonda hat meşgul; 'be engaged in an activity' bir işle meşgul olmak (bu ünitede öğretilmiyor).
- about: graduate ceremony (ingilizceciyiz)
  kind: kaynak_hatasi
  trap_tr: Doğru biçim graduation ceremony (mezuniyet töreni).
  tip_tr: graduate fiil/kişi, graduation tören.
- about: LOL
  item: U5-061
  kind: kaynak_hatasi
  trap_tr: Kaynak listesinde LOL = "Lots of love".
  tip_tr: Günümüzde yaygın anlamı "laughing out loud" (çok komik). Sınavda kısaltma "stand for" ile sorulur.
- about: one-way / round-trip
  item: U5-060
  kind: turkce_etkisi
  trap_tr: round trip "yuvarlak gezi" sanılır.
  tip_tr: round trip = gidiş-dönüş, one-way = tek yön. Bilet + refundable/non-refundable ile birlikte gelir.
lgs_focus:
  what_is_tested:
  - 'Grafik / tablo okuma: öğrencilerin internet kullanım amaçları, saatleri, cihazları (percent, most, half, a few, per day).'
  - 'Okuma: internet alışkanlığı ya da bağımlılık metni, güvenlik kuralları listesi; ana fikir ve ''hangisi önerilmemiştir'' tipi.'
  - 'Diyalog tamamlama: öneri/davet → kabul, red ya da bahane (Why don''t we …? / I''m sorry, but I can''t. My internet is broken.).'
  - 'Açıklama kalıpları: ''What do you mean?'' sorusuna uygun cevap, ''In other words'' ile verilen yeniden söyleyiş.'
  - 'İlan / ekran çıkarımı: internet alışveriş sayfası, indirim, iade koşulu (refundable), kayıt formu (sign up, password).'
  - 'Anlam: internet fiilleri ve yön (download / upload, log in / log out, sign in / sign up) ve çıkmış kelimeler (online / offline, social networking sites, search, information, make new friends).'
  question_patterns:
  - type: dialogue_complete
    description_tr: Öneri → bahaneyle red → açıklama isteme akışında boşluk.
    sample_stem: 'Ece: Why don''t we watch the live concert online tonight? — Bora: I''m sorry, but I can''t. My internet is broken. — Ece: ______ — Bora: Yes. There isn''t a connection sign on the screen.'
    sample_options:
    - What do you mean? Do you mean the Internet connection?
    - Great! See you at eight, then.
    - How often do you watch concerts online?
    - Would you like to join our WhatsApp group?
    distractor_logic_tr: Boşluktan SONRAKİ 'Yes. There isn't a connection sign' bir evet–hayır sorusuna cevaptır ve bağlantıdan söz eder; yalnız ilk şık bunu sorar. 'Great! See you' kabul sonrası cümledir
      (Bora reddetti); alışkanlık sorusu ve davet akışla ilgisiz.
    items:
    - U5-057
    - U5-059
    - U5-015
    - U5-020
    - U5-021
  - type: table_graph
    description_tr: Öğrencilerin internet kullanım amaçları grafiği.
    sample_stem: 'A class survey: What do students use the Internet for? — Doing research 70% · Chatting with friends 90% · Online shopping 10% · Watching videos 50% · Playing online games 40%. — Which
      of the following is TRUE according to the survey?'
    sample_options:
    - Half of the students use the Internet for watching videos.
    - Most of the students do online shopping.
    - Doing research is the most popular activity.
    - A few students chat with their friends online.
    distractor_logic_tr: 'Yüzdeleri sözcüklere çevir: %50 = half (doğru), %10 = a few (most değil), en yüksek %90 sohbettir (research değil), %90 most demektir (a few değil). Çeldiriciler uç değerleri yer
      değiştirir.'
    items:
    - U5-044
    - U5-047
    - U5-038
    - U5-051
  - type: text_infer
    description_tr: Güvenlik kuralları metni; önerilmeyeni bulma.
    sample_stem: 'SAFER INTERNET WEEK — Our class rules: Keep your password secret except from your family. Never share your address or phone number with strangers. Ignore friend requests from unknown people.
      Before downloading a file, check it with an adult. Log out of your account on school computers. — Which of the following is NOT suggested in the text?'
    sample_options:
    - Accept friend requests from people you don't know.
    - Ask an adult before you download something.
    - Don't give your personal information to strangers.
    - Log out when you finish using a school computer.
    distractor_logic_tr: Doğru şık metindeki 'Ignore friend requests from unknown people' kuralını tersine çevirir. Diğer üç şık metindeki kuralların farklı sözcüklerle söylenişidir (check it with an adult
      = ask an adult; address/phone = personal information).
    items:
    - U5-009
    - U5-013
    - U5-005
    - U5-019
    - U5-007
    - U5-010
    - U5-011
  - type: message_infer
    description_tr: İnternet alışveriş ilanı / ekranı.
    sample_stem: 'DRUM WORLD ONLINE — Weekend offer: 30% discount on all drumsticks! Free delivery for orders over 500 TL. Please note: Sale products are non-refundable. To order, sign up and enter the
      cardholder''s name and the expiry date of the card. — Which of the following is TRUE according to the advertisement?'
    sample_options:
    - You can't get your money back for sale products.
    - Drumsticks are 30% more expensive at the weekend.
    - You don't need an account to order.
    - All orders have free delivery.
    distractor_logic_tr: non-refundable = parası iade edilmez. Çeldiriciler discount'u zam gibi gösterir, 'sign up' şartını yok sayar, '500 TL üzeri' koşulunu genelleştirir.
    items:
    - U5-049
    - U5-052
    - U5-012
    - U5-050
    - U5-051
  - type: situation
    description_tr: Durum verilir; kibar red cümlesi seçilir.
    sample_stem: Your friend invites you to an online game tournament on Saturday, but you have a piano lesson. What do you say?
    sample_options:
    - Thanks for asking, but I'm afraid I can't. I have a piano lesson.
    - That sounds great! What time does it start?
    - Why don't we play the game on Saturday?
    - I often use the Internet for playing games.
    distractor_logic_tr: Durum red istiyor; ikinci şık kabul, üçüncü yeni bir öneri (aynı etkinliği önermek), dördüncü alışkanlık bildirimi.
    items:
    - U5-056
    - U5-059
    - U5-047
  - type: synonym
    description_tr: Altı çizili ifadenin anlamı / yeniden söyleyiş.
    sample_stem: Kaan spends six hours a day online and feels angry when he can't connect. In other words, ______.
    sample_options:
    - he may be an Internet addict
    - he never uses social networking sites
    - his internet is working properly
    - he is an expert on computers
    distractor_logic_tr: 'In other words aynı bilgiyi özetler: çok uzun süre + bağlanamayınca öfke = bağımlılık belirtisi. Diğer şıklar metinle çelişir ya da metinde olmayan bir bilgi ekler.'
    items:
    - U5-054
    - U5-036
    - U5-045
    - U5-026
    - U5-039
  - type: gap_fill
    description_tr: İnternet fiilinin yönü / türü.
    sample_stem: I made a video of our rehearsal. I'm going to ______ it to our channel tonight, so our followers can watch it.
    sample_options:
    - upload
    - download
    - log out
    - delete
    distractor_logic_tr: '''to our channel'' cihazdan internete yönü gösterir: upload. download ters yön; log out ve delete takipçilerin izlemesiyle çelişir.'
    items:
    - U5-025
    - U5-019
    - U5-007
    - U5-018
    - U5-030
