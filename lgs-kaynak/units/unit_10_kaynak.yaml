grammar:
- id: G1
  name_tr: will ile tahmin (be going to karşılaştırması)
  form: 'Özne + will / won''t + V1 · I think / I believe / I''m sure + özne + will … · What do you think will happen …? · Kanıt varsa: am / is / are going to + V1'
  examples:
  - I think there will be more droughts in the future.
  - Scientists believe sea levels will rise by 2100.
  - Look at the sky! It's going to rain.
  explain_tr: Görüşe dayalı gelecek tahmini will ile yapılır; zaman ifadeleri in the future, in 2050, by 2100, soon. Gözle görülen bir kanıt varsa (kara bulutlar) be going to daha doğaldır. LGS düzeyinde
    will ana yapıdır.
  common_errors:
  - wrong: It will happens.
    right: It will happen.
    why_tr: will'den sonra yalın fiil.
  - wrong: I don't think it won't rain.
    right: I don't think it will rain.
    why_tr: 'Olumsuzluk bir kez: I don''t think + will.'
  - wrong: What do you think will be happen?
    right: What do you think will happen?
    why_tr: be gereksiz.
  lgs_note: Diyalog tamamlamada "What do you think will happen …?" sorusunun cevabı will içeren tahmin şıkkıdır; çeldiriciler geçmiş zaman ya da öneri cümlesidir.
  items:
  - U10-039
  - U10-043
  - U10-026
- id: G2
  name_tr: If / When + Present Simple, … will … (sonuç)
  form: 'If / When + özne + V1 (-s), özne + will + V1 · Ana cümle önce gelirse virgül yok: There will be floods if it rains heavily.'
  examples:
  - If we cut down forests, there will be more landslides.
  - When an earthquake strikes, buildings shake.
  - If we don't save water, we will have a water shortage.
  explain_tr: 'Koşul ve sonuç: if yan cümlesi şimdiki geniş zamanda, sonuç cümlesi will ile. when kesin olacak durumda (olduğunda), if olası durumda (olursa). Genel doğrularda iki taraf da geniş zaman olabilir.'
  common_errors:
  - wrong: If we will cut down trees, …
    right: If we cut down trees, …
    why_tr: if yan cümlesinde will yok.
  - wrong: If it rains, there is will be a flood.
    right: If it rains, there will be a flood.
    why_tr: there will be.
  lgs_note: Metin çıkarımında "What will happen if …?" sorusu; doğru şık metindeki sonuç cümlesidir.
  items:
  - U10-040
  - U10-029
  - U10-030
  - U10-004
- id: G3
  name_tr: Neden–sonuç fiilleri ve bağlaçları
  form: X causes / leads to + isim · because + cümle · because of + isim · so / that's why / as a result + sonuç
  examples:
  - Air pollution causes health problems.
  - Deforestation leads to floods and landslides.
  - The farmers lost their crops because of the drought.
  - It didn't rain for months, so the rivers dried up.
  explain_tr: cause hem isim (the cause of the fire) hem fiil (cause a fire); lead to = yol açmak. Bağlaçlar U9-040'ta öğretildi, burada çevre metinlerinde tekrar edilir.
  common_errors:
  - wrong: Pollution causes to health problems.
    right: Pollution causes health problems.
    why_tr: cause edatsız; lead to ise to ile.
  - wrong: because of it didn't rain
    right: because it didn't rain
    why_tr: Cümleden önce because.
  lgs_note: Neden mi sonuç mu? Çeldirici sonucu neden gibi verir; okun yönüne bak (drought → crop loss).
  items:
  - U10-042
  - U10-034
  - U10-028
  - U10-029
- id: G4
  name_tr: should / shouldn't ile öneri ve çözüm
  form: Özne + should / shouldn't + V1 · Why don't we + V1? · We must + V1 (güçlü zorunluluk)
  examples:
  - We should use renewable energy.
  - We shouldn't waste water.
  - Why don't we plant trees in the school garden?
  explain_tr: should tavsiye ve öneri bildirir; must / have to (U8-035) zorunluluk. Çevre metinlerinin "What should we do?" kısmı bu kalıpla yazılır.
  common_errors:
  - wrong: We should to recycle.
    right: We should recycle.
    why_tr: should + yalın fiil, to yok.
  - wrong: We should recycling.
    right: We should recycle.
    why_tr: -ing değil, yalın fiil.
  lgs_note: '"Which of the following is NOT a suggestion to save energy?" türü sorular; çeldirici çevreye zarar veren eylem.'
  items:
  - U10-041
  - U10-036
  - U10-035
  - U10-037
- id: G5
  name_tr: 'Emir kipi: güvenlik talimatları'
  form: V1 (+ nesne)! · Don't + V1! · Stay away from + isim · Stay + sıfat (Stay calm!)
  examples:
  - Stay calm and don't panic.
  - Drop, cover and hold on!
  - Stay away from windows. Don't use the lift.
  explain_tr: 'Deprem tatbikatı ve broşür talimatları emir kipiyle yazılır; Ü3 tarif dilindeki emir kipinin aynısı. AFAD talimatı: Çök – Kapan – Tutun.'
  common_errors:
  - wrong: Not use the lift!
    right: Don't use the lift!
    why_tr: Olumsuz emir Don't ile.
  - wrong: Stay away windows!
    right: Stay away from windows!
    why_tr: stay away from.
  lgs_note: Broşür / poster sorusunda "Which of the following is NOT mentioned in the brochure?"; görsel eşleştirme (picture_match).
  items:
  - U10-019
  - U10-016
  - U10-023
- id: G6
  name_tr: 'Sayılamayan isimler ve tekil-çoğul tuzakları: news, pollution, species, phenomena'
  form: The news is … · a piece of news · one species / two species · phenomenon (tekil) – phenomena (çoğul)
  examples:
  - 'The news is very good: everyone is safe.'
  - Many animal species are in danger.
  - A rainbow is a beautiful natural phenomenon.
  explain_tr: news -s ile biter ama tekil ve sayılamazdır. species tekil ve çoğulda aynıdır. phenomena çoğuldur (Türkçedeki "fenomen" ile karıştırma).
  common_errors:
  - wrong: The news are bad.
    right: The news is bad.
    why_tr: news tekil fiil alır.
  - wrong: a natural phenomena
    right: a natural phenomenon
    why_tr: a ile tekil biçim.
  lgs_note: Doğrudan sorulmaz; şıklarda yanlış biçim olarak görülebilir.
  items:
  - U10-020
  - U10-032
  - U10-001
