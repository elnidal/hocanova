traps:
- about: save
  item: U10-036
  kind: cok_anlamli
  trap_tr: save yalnız "kurtarmak" bilinir.
  tip_tr: save water / energy = tasarruf etmek; save money = biriktirmek; save lives = hayat kurtarmak.
- about: waste
  item: U10-033
  kind: cok_anlamli
  trap_tr: İsim mi fiil mi karışır.
  tip_tr: Don't waste water = israf etme (fiil); toxic waste = zehirli atık (isim).
- about: protect / prevent
  item: U10-018
  kind: benzer_yazilis
  trap_tr: İkisi de pro-/pre- ile başlar.
  tip_tr: protect = korumak (protect animals); prevent = önlemek (prevent fires).
- about: lightning / lighting
  item: U10-006
  kind: benzer_yazilis
  trap_tr: Yazılışları neredeyse aynı.
  tip_tr: lightning = yıldırım; lighting = aydınlatma.
- about: hurricane / tornado
  item: U10-005
  kind: kaynak_hatasi
  trap_tr: B ikisine de "kasırga" diyor.
  tip_tr: tornado = hortum (karada); hurricane = kasırga (okyanusta).
- about: collapse building (B)
  item: U10-010
  kind: kaynak_hatasi
  trap_tr: B "collapse building = binayı yıkmak" yazmış.
  tip_tr: 'collapse nesnesiz: The building collapsed (çöktü). Yıkmak = destroy / knock down.'
- about: damage / destroy
  item: U10-009
  kind: cok_anlamli
  trap_tr: İkisi de "zarar" diye çevrilebilir.
  tip_tr: damage = hasar (onarılabilir, U8-046); destroy = tamamen yok etmek.
- about: news
  item: U10-020
  kind: dilbilgisi
  trap_tr: -s yüzünden çoğul sanılır.
  tip_tr: The news is …; a piece of news.
- about: environment
  item: U10-031
  kind: turkce_etkisi
  trap_tr: Türkçe "çevre" sosyal çevreyi de kapsar.
  tip_tr: environment = doğal çevre; sosyal çevre = people around you / social circle.
- about: greenhouse
  item: U10-027
  kind: sahte_dost
  trap_tr: '"Yeşil ev" diye çevrilir.'
  tip_tr: greenhouse = sera; greenhouse gases = sera gazları.
- about: phenomenon / phenomena
  item: U10-001
  kind: turkce_etkisi
  trap_tr: Türkçe "fenomen" (ünlü kişi) anlamı akla gelir.
  tip_tr: Ünitede doğa olayı; phenomena çoğul.
- about: measure
  item: U10-017
  kind: cok_anlamli
  trap_tr: measure yalnız "ölçmek" bilinir.
  tip_tr: take measures = önlem almak.
- about: strike
  item: U10-008
  kind: cok_anlamli
  trap_tr: strike = grev de demek.
  tip_tr: An earthquake struck … = deprem vurdu; strike–struck–struck.
- about: cause
  item: U10-042
  kind: dilbilgisi
  trap_tr: cause to + isim yazılır.
  tip_tr: cause + isim (cause floods); lead to + isim.
- about: if … will
  item: U10-040
  kind: dilbilgisi
  trap_tr: Türkçe "kesersek … olacak" etkisiyle if cümlesine will konur.
  tip_tr: If we cut … , there will be …
- about: I am agree
  item: U10-044
  kind: turkce_etkisi
  trap_tr: '"Katılıyorum" → I am agree.'
  tip_tr: I agree (with you).
- about: predict / guess
  item: U10-043
  kind: cok_anlamli
  trap_tr: İkisi de "tahmin etmek" çevrilir.
  tip_tr: predict bilgiye dayalı, guess bilmeden.
- about: natural forces (A)
  item: U10-001
  kind: kaynak_hatasi
  trap_tr: A "natural forces = doğal afetler" yazmış.
  tip_tr: natural forces = doğal güçler; doğal afet = natural disaster.
- about: plate (A)
  item: U10-014
  kind: kaynak_hatasi
  trap_tr: A "plate = tabaka, katman" yazmış.
  tip_tr: Yer biliminde plate = levha (tectonic plates); layer = katman.
- about: heat (A)
  kind: kaynak_hatasi
  trap_tr: A "heat = ısıtma" yazmış.
  tip_tr: heat = ısı, sıcaklık; ısıtmak (U3-006).
- about: occasion (A)
  kind: kaynak_hatasi
  trap_tr: A "occasion = ortam" yazmış.
  tip_tr: occasion = durum, fırsat, özel gün.
- about: vary (A)
  kind: kaynak_hatasi
  trap_tr: A "vary = çeşitlendirmek" yazmış.
  tip_tr: vary = değişmek, farklılık göstermek (U9-042 ailesi).
- about: volcano eruption (A)
  item: U10-003
  kind: kaynak_hatasi
  trap_tr: A "volcano eruption" yazmış.
  tip_tr: volcanic eruption.
- about: acre (B)
  kind: kaynak_hatasi
  trap_tr: B "acre = dönüm" yazmış.
  tip_tr: 1 acre ≈ 4 dönüm (≈4047 m²).
- about: take care (B)
  kind: kaynak_hatasi
  trap_tr: B "take care = ilgilenmek" yazmış.
  tip_tr: ilgilenmek = take care of (U8-025); Take care! = Kendine iyi bak.
- about: AFAD (A)
  item: U10-016
  kind: kaynak_hatasi
  trap_tr: A "Türkiye Acil Durum Yönetimi Başkanlığı" yazmış.
  tip_tr: 'Resmî ad: Afet ve Acil Durum Yönetimi Başkanlığı.'
lgs_focus:
  what_is_tested:
  - 'Afet / çevre haberi, broşür ya da blog okuma: neden, sonuç, önlem'
  - will ile tahmin içeren diyalog tamamlama
  - If / because / so ile sonuç çıkarımı
  - 'Durum–tepki: afet anında / çevreyi korumak için ne yapılmalı (should, emir kipi)'
  - 'Kelime anlamı: drought, flood, landslide, avalanche, shortage, pollution, prevent, precaution, save'
  question_patterns:
  - type: dialogue_complete
    description_tr: Tahmin sorusuna uygun cevap.
    sample_stem: 'A: What do you think will happen if we keep cutting down forests? B: ----'
    sample_options:
    - I think there will be more floods and landslides.
    - I planted a tree last week.
    - Yes, I agree. Thank you.
    - Because it rained a lot yesterday.
    distractor_logic_tr: Geçmiş zaman, teşekkür ya da neden cümlesi; tahmin (will) yok.
    items:
    - U10-039
    - U10-029
    - U10-004
  - type: text_infer
    description_tr: Kısa çevre metni; sonuç çıkarımı.
    sample_stem: 'Read the text: ''It didn''t rain in the region for eight months. The rivers dried up and farmers couldn''t grow crops. Now people use water carefully and take short showers.'' What is
      the main problem in the text?'
    sample_options:
    - drought
    - flood
    - avalanche
    - earthquake
    distractor_logic_tr: Aynı kümenin diğer afetleri; flood zıt durum.
    items:
    - U10-007
    - U10-034
    - U10-036
    - U10-030
  - type: situation
    description_tr: Tatbikat / güvenlik durumunda doğru davranış.
    sample_stem: Your school is doing an earthquake drill. The alarm rings. What should you do?
    sample_options:
    - Drop, cover and hold on under your desk.
    - Run to the lift quickly.
    - Stand next to the windows.
    - Go back to get your phone.
    distractor_logic_tr: Talimatlarda yasaklanan davranışlar (lift, windows).
    items:
    - U10-019
    - U10-016
    - U10-017
  - type: message_infer
    description_tr: 'Broşür / poster: belirtilmeyen bilgi.'
    sample_stem: 'Poster: ''Prepare an emergency kit: water, a torch, a first aid kit, a whistle and some food.'' Which item is NOT on the poster?'
    sample_options:
    - a tablet
    - a torch
    - a whistle
    - water
    distractor_logic_tr: Posterde açıkça geçen maddeler.
    items:
    - U10-016
    - U10-023
  - type: gap_fill
    description_tr: Neden–sonuç fiili / bağlacı.
    sample_stem: Greenhouse gases ---- global warming, so we should use clean energy.
    sample_options:
    - cause
    - prevent
    - protect
    - save
    distractor_logic_tr: Ünitenin olumlu eylem fiilleri anlamı tersine çevirir.
    items:
    - U10-042
    - U10-027
    - U10-026
    - U10-037
  - type: odd_one_out
    description_tr: Çevreyi korumaya yönelik olmayan eylem.
    sample_stem: Which of the following does NOT help the environment?
    sample_options:
    - leaving the lights on all day
    - recycling paper and glass
    - using energy-saving light bulbs
    - taking short showers
    distractor_logic_tr: Doğru öneriler; aykırı olan israf.
    items:
    - U10-035
    - U10-036
    - U10-033
