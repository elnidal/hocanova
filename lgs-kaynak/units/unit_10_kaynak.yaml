schema_version: 1
unit: 10
title: Natural Forces
status: taslak
summary_tr: 'Son ünite doğal afetleri, iklim ve çevre sorunlarını konuşmayı öğretir. Programın iki işlevi gelecekle ilgili tahmin yapmak (What do you think will happen if we can''t reduce the greenhouse
  effect?) ve neden–sonuç anlatmaktır (People cut down trees, so the soil slides.). Yeni kelimelerin omurgası afet adları (earthquake, flood, landslide, avalanche, drought, hurricane, tornado, tsunami),
  çevre sorunları (global warming, pollution, deforestation, shortage) ve hazırlık / çözüm dilidir (emergency kit, take precautions, prevent, recycle, save, renewable energy). damage (U8), warn (U8), survive
  (U6), climate (U7), reduce ve result (U9) önceki ünitelerden tekrar edilir. LGS''de ünite en çok afet / çevre haberi ya da broşür okuma, "Which of the following is a precaution …?" türü durum soruları,
  will ile tahmin ve If / because / so ile sonuç çıkarımı olarak gelir. Afet konusu hassastır: içerikte korkutucu ayrıntı yok, vurgu hazırlık ve dayanışma.'
curriculum:
  outcomes:
  - code: E8.10.L (kod doğrulanamadı)
    text_tr: 'Dinleme: Doğal afetler ve doğa olaylarıyla ilgili kısa metinlerde belirli bilgileri tanır (breaking news etkinliği).'
  - code: E8.10.SP (kod doğrulanamadı)
    text_tr: 'Sözlü anlatım: Doğal afetlerin gelecekteki etkileri hakkında tahminlerde bulunur; neden ve sonuçları konuşur.'
  - code: E8.10.R (kod doğrulanamadı)
    text_tr: 'Okuma: Doğal güçler ve afetlerle ilgili metinlerde belirli bilgileri bulur; neden–sonuç ilişkilerini anlar. (LGS''de doğrudan ölçülen kazanım türü)'
  - code: E8.10.W (kod doğrulanamadı)
    text_tr: 'Yazma: Bir doğal afet ya da çevre sorunu hakkında tahmin ve öneri içeren kısa bir metin yazar.'
  functions:
  - id: F1
    name_tr: Tahmin yapmak (Making predictions)
    exponents:
    - What do you think will happen when an earthquake strikes?
    - What do you think will happen if we can't reduce the greenhouse effect?
    - I believe forests will disappear because we cut down too many trees.
    - In 2050, there will be less water in the world.
    - Look at those dark clouds! It's going to rain.
    responses:
    - I think buildings will shake.
    - Sea levels will rise and some animals will become extinct.
    - I don't think so. People will use renewable energy.
    items:
    - U10-039
    - U10-026
    - U10-032
    - U10-043
    - U10-037
    lgs_weight: yüksek
    note_tr: Programın doğrulanan işlevi (learner.net, ingilizcepedia). Kanıta dayalı tahminde be going to (ingilizcepedia).
  - id: F2
    name_tr: Neden ve sonuç anlatmak (Discussing reasons and results)
    exponents:
    - People cut down trees and don't plant new ones, so the soil slides.
    - If people destroy forests, the temperature will rise.
    - Global warming causes droughts.
    - Deforestation leads to landslides.
    - Many farmers lost their crops because of the drought.
    responses:
    - That's why we should plant more trees.
    - As a result, there is a water shortage.
    items:
    - U10-040
    - U10-042
    - U10-029
    - U10-007
    - U10-030
    lgs_weight: yüksek
    note_tr: Programın doğrulanan işlevi. so / because of / that's why / as a result Ü9'da öğretildi (U9-040), burada tekrar edilir.
  - id: F3
    name_tr: Önlem ve çözüm önermek (suggesting precautions and solutions)
    exponents:
    - We should reduce heat-trapping gases.
    - Why don't we prepare an earthquake emergency kit?
    - We should recycle paper and plastic.
    - We shouldn't waste water.
    responses:
    - That's a good idea.
    - I agree with you.
    - I don't agree. We should use public transport instead.
    items:
    - U10-041
    - U10-016
    - U10-017
    - U10-035
    - U10-036
    - U10-033
    - U10-044
    lgs_weight: yüksek
    note_tr: Ders kitabı eşleştirme etkinliği (s. 129); Why don't we …? U5-059.
  - id: F4
    name_tr: Afetleri ve doğa olaylarını tanımlamak (describing natural disasters)
    exponents:
    - An earthquake is the shaking of the surface of the Earth.
    - A tsunami is an extremely big wave.
    - The roof of the house collapsed after the earthquake.
    - The earthquake had a magnitude of 6.2 on the Richter scale.
    responses:
    - Luckily, nobody was injured.
    - Rescue teams helped the people in the area.
    items:
    - U10-002
    - U10-003
    - U10-014
    - U10-013
    - U10-010
    - U10-022
    lgs_weight: orta
    note_tr: ingilizcepedia Useful Language; tanım cümleleri "X is …" kalıbıyla.
