expressions:
- en: Would you like to come over?
  tr: Bize/bana uğramak ister misin?
  use: Arkadaşı eve davet ederken; kibar ama sıcak.
  reply:
  - Sure, that sounds fun!
  - Sorry, I can't. I have to study.
