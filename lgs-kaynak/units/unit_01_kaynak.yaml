- id: G4
  name_tr: Sebep ve açıklama — because / but / so; have to ile mazeret
  form: cümle + because + özne + fiil · cümle + but + karşıt cümle · cümle + so + sonuç · I have to / I need to + V1
  examples:
  - I can't come to your party because I have to study for my exam.
  - I wanted to come, but my mum said no.
  - I was ill, so I missed the school trip.
  - She doesn't have to bring anything. We have lots of food.
  explain_tr: because sebep, so sonuç bildirir; ikisi aynı ilişkiyi ters yönden kurar (I was tired, so I stayed at home = I stayed at home because I was tired). Mazeret söylerken en sık yapı "I have to
    + V1" (zorundayım). "because of" ardından cümle değil isim gelir (because of the rain); ünitede tanıma düzeyinde.
  common_errors:
  - wrong: I can't come because of I am busy.
    right: I can't come because I am busy.
    why_tr: because of'tan sonra isim gelir; cümle için yalnız because.
  - wrong: Because I am busy. I can't come.
    right: I can't come because I am busy.
    why_tr: Yazıda because'lu yan cümle tek başına cümle olmaz; ana cümleye bağlanır.
  - wrong: I must to study.
    right: I have to study. / I must study.
    why_tr: must'tan sonra to gelmez; have to'da gelir.
  - wrong: I was tired, because I went to bed early.
    right: I was tired, so I went to bed early.
    why_tr: Sonuç bildirilecekse so; because sebebi gösterir. Türkçedeki "-dığı için / bu yüzden" yönüne dikkat.
  lgs_note: 'En sık soru: "Why can''t Bora attend the party?" Cevap metinde because''tan ya da "I have to …"tan hemen sonradır. Bağlaç boşluğu sorusunda because/so/but üçlüsü şıklarda birlikte bulunur.'
  items:
  - U1-021
  - U1-007
  - U1-004
  - U1-003
  - U1-002
- id: G5
  name_tr: Özür dileme — I'm sorry (for) / I apologise for + V-ing / isim
  form: I'm sorry (that) + cümle · Sorry for + V-ing / isim · I apologise (to sb) for + V-ing / isim
  examples:
  - I'm sorry for being late.
  - Sorry, I didn't reply to your message. My phone was broken.
  - I apologise for missing your party.
  - Ege apologised to Ece for his rude words.
  explain_tr: apologise daha resmi ve yazı dilindedir (mektup, e-posta), "I'm sorry" günlük konuşmada. apologise fiili kişi için "to", sebep için "for" alır. for'dan sonra fiil gelirse -ing olur. İngiliz
    yazımı apologise, Amerikan yazımı apologize; sınav metinlerinde ikisi de görülebilir.
  common_errors:
  - wrong: I apologise you.
    right: I apologise to you.
    why_tr: Türkçedeki "senden özür dilerim" yapısı doğrudan çevrilmez; apologise TO someone.
  - wrong: I'm sorry for be late.
    right: I'm sorry for being late.
    why_tr: Edattan (for) sonra fiil -ing alır.
  - wrong: I apologise for I missed the party.
    right: I apologise for missing the party.
    why_tr: for'dan sonra cümle değil -ing'li fiil gelir.
  lgs_note: 'W1 kazanımının konusu olan "katılamama mektubu" okuma sorusu olarak gelebilir: mektupta özür + sebep + telafi (I''ll visit you next week) vardır; sorular sebebe ve telafi önerisine odaklanır.'
  items:
  - U1-002
  - U1-007
  - U1-021
- id: G6
  name_tr: Planlı gelecek mazereti — Present Continuous (I'm visiting …)
  form: özne + am/is/are + V-ing + gelecek zaman ifadesi (tomorrow, on Saturday, this weekend)
  examples:
  - Sorry, I can't come. My cousin is coming tomorrow.
  - I'm visiting my grandparents this weekend.
  - We're having a barbecue on Sunday. Would you like to come?
  explain_tr: Önceden kararlaştırılmış, takvimdeki planlar için Present Continuous kullanılır. Programın örnek diyaloğundaki "my cousin is coming tomorrow" bu yapıdır. Cümlede "tomorrow, on Saturday" gibi
    bir gelecek ifadesi varsa yapı şu an değil gelecek planı anlatır.
  common_errors:
  - wrong: My cousin comes tomorrow, so I can't join you.
    right: My cousin is coming tomorrow, so I can't join you.
    why_tr: Kişisel, ayarlanmış plan için Present Continuous daha doğal.
  - wrong: I visiting my aunt on Saturday.
    right: I'm visiting my aunt on Saturday.
    why_tr: am/is/are yardımcı fiili düşmez.
  lgs_note: 'Tanıma düzeyinde yeterli: öğrenci "I''m meeting my cousin on Saturday" cümlesini "meşgulüm, gelemem" sebebi olarak okuyabilmeli. Tablo/takvim sorularında (Who is free on Saturday?) işe yarar.'
  items:
  - U1-004
  - U1-021
  - U1-009
- id: G7
  name_tr: Kişiyi tanımlama — What is he like? / What does he like? / What does he look like?
  form: What is/are + özne + like? → özne + be + kişilik sıfatı · özne + be + a/an + sıfat + friend
  examples:
  - What is your best friend like? — She's patient and understanding.
  - What is Kaan like? — He's outgoing, but he is always in a hurry.
  - Duru is a loyal friend. She is always there for me.
  - What does Bora like? — He likes football.
  explain_tr: 'Buradaki like "sevmek" değil "gibi" demektir; soru "O nasıl biri?" diye kişiliği sorar. Aynı like, "like a brother" (bir kardeş gibi) yapısında da geçer. Üç soru üç farklı cevap ister: What
    is he like? → kişilik; What does he like? → sevdiği şeyler; What does he look like? → dış görünüş.'
  common_errors:
  - wrong: What is he like? — He likes basketball.
    right: What is he like? — He's friendly and honest.
    why_tr: like'ı "sevmek" sanmak en klasik hatadır; "is" varsa kişilik sorulur.
  - wrong: How is your best friend? (kişiliği sormak için)
    right: What is your best friend like?
    why_tr: '"How is he?" sağlığını/hâlini sorar (Nasıl, iyi mi?).'
  - wrong: She is very loyalty.
    right: She is very loyal.
    why_tr: be + very'den sonra sıfat gelir; loyalty isimdir.
  lgs_note: Diyalogda "What is X like?" sorusunun cevabı kişilik sıfatı olan şıktır; "He likes …" ve "He is tall" şıkları kalıcı çeldiricilerdir. Kişilik sıfatı + tanım eşleştirmesi ünitenin ikinci büyük
    soru tipidir.
  items:
  - U1-080
  - U1-087
  - U1-086
  - U1-075
  - U1-037
- id: G8
  name_tr: Sıklık zarfı always ile tanımlama — He is always …
  form: özne + be + always + sıfat/edat öbeği · özne + always + fiil
  examples:
  - He is always in a hurry.
  - She is always there for me.
  - Selin always keeps her promises.
  explain_tr: always (her zaman) be fiilinden sonra, diğer fiillerden önce gelir. Bu yapı bir kişinin kalıcı alışkanlığını, yani kişiliğini anlatır; bu yüzden kişilik sorularında ipucudur (always keeps
    her promises → reliable). Sıklık zarflarının tamamı Ünite 2'de işlenir.
  common_errors:
  - wrong: He always is in a hurry.
    right: He is always in a hurry.
    why_tr: be fiilinden sonra gelir.
  - wrong: She keeps always her promises.
    right: She always keeps her promises.
    why_tr: Ana fiilden önce gelir.
  lgs_note: Metinde "always / never" ile anlatılan davranış, şıklardaki kişilik sıfatının kanıtıdır (never tells lies → honest; never shares → mean/self-centred).
  items:
  - U1-075
  - U1-037
- id: G9
  name_tr: Sabit edatlı fiil ve öbekler — count on, rely on, get on well with, interested in, argue with
  form: fiil/sıfat + sabit edat + nesne · count/rely/depend ON sb · get on well WITH sb · be interested IN sth · argue WITH sb ABOUT sth · apologise TO sb FOR sth · introduce A TO B
  examples:
  - You can count on me. I'll help you.
  - I get on well with my classmates.
  - Elif is interested in music.
  - Kaan argued with Bora about the match.
  - Ece introduced Elif to her friends.
  explain_tr: 'Bu öbeklerde edat anlamın parçasıdır ve Türkçedeki hâl ekiyle örtüşmez: "-e güvenmek" → rely ON, "biriyle anlaşmak" → get on well WITH, "-e ilgi duymak" → interested IN. Edatlar öbekle birlikte
    ezberlenmeli.'
  common_errors:
  - wrong: You can trust on me.
    right: You can trust me. / You can count on me.
    why_tr: trust edatsız kullanılır; count/rely/depend on alır.
  - wrong: I'm interested about music.
    right: I'm interested in music.
    why_tr: interested her zaman "in" alır.
  - wrong: I get on well to my sister.
    right: I get on well with my sister.
    why_tr: '"ile" anlamında with.'
  - wrong: I'd like to join to your team.
    right: I'd like to join your team.
    why_tr: join edatsız kullanılır (Türkçedeki "-e katılmak" eki yanıltır).
  - wrong: Did you attend to the party?
    right: Did you attend the party?
    why_tr: attend (katılmak) edat almaz.
  lgs_note: Eş anlam sorusunda "count on = rely on = depend on = trust" dörtlüsü tek grup gibi gelir. Boşluk sorusunda edat bilgisi doğru şıkkı ayırır.
