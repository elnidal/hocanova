- id: G11
  name_tr: Tercih bildirme — prefer A to B / I'd prefer to …
  form: prefer + isim/V-ing + to + isim/V-ing · I'd prefer to + V1 · It doesn't matter (to me).
  examples:
  - I prefer picnics to cinemas.
  - I prefer staying at home to going out on rainy days.
  - I'd prefer to go on Sunday.
  - Cinema or picnic? — It doesn't matter to me.
  explain_tr: 'prefer A to B: "A''yı B''ye tercih ederim"; karşılaştırmada "than" değil "to" kullanılır. "I''d prefer to" belirli bir durum için tercihtir. "It doesn''t matter" kayıtsızlık değil, kibar
    bir esneklik bildirir.'
  common_errors:
  - wrong: I prefer tea than coffee.
    right: I prefer tea to coffee.
    why_tr: prefer'la "than" değil "to".
  - wrong: I'd prefer go home.
    right: I'd prefer to go home.
    why_tr: I'd prefer'dan sonra to + V1.
  lgs_note: Bu ünitede düşük ağırlık; Ünite 2 (Teen Life) tercih kalıplarının ön çalışması.
