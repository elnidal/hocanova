- words:
  - calm
  - laid-back
  difference_tr: calm "sakin, telaşsız" (anlık ya da kalıcı); laid-back "kafası rahat, hiçbir şeyi dert etmeyen" kişilik tipi; hafif "fazla rahat" çağrışımı olabilir.
  items:
  - U1-069
  - U1-079
- words:
  - Would you like to …?
  - Do you want to …?
  difference_tr: İkisi de davet. Would you like to daha kibar; Do you want to arkadaşlar arasında daha gündelik.
  items:
  - U1-026
  - U1-006
- words:
  - How about …?
  - What about …?
  difference_tr: Öneride birbirinin yerine kullanılır (+ -ing / isim). "What about you?" ise yalnız karşı soru olarak yaygındır.
  items:
  - U1-008
  - U1-024
- words:
  - I'd love to.
  - That would be great.
  - Why not?
  - Sounds great!
  difference_tr: Hepsi kabul. I'd love to en sıcak; Why not? en rahat/gündelik; That would be great teklif karşısında minnet içerir.
  items:
  - U1-011
  - U1-023
  - U1-025
  - U1-022
- words:
  - reply
  - answer
  - respond
  difference_tr: reply ve respond "cevap vermek" (reply to a message); answer edatsız (answer the phone, answer me). respond daha resmi (havuzda öncelik 2).
  items:
  - U1-020
- words:
  - chat
