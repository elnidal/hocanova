mini_lessons:
- type: mini_dilbilgisi
  text_tr: Would you like TO + fiil (Would you like to come?) · How about + -ing ya da isim (How about coming? / How about pizza?). İkisini karıştırmamak diyalog sorularında bir puandır.
  refs:
  - U1-026
  - U1-008
- type: lgs_taktigi
  text_tr: Boşluktan sonra bir ENGEL geliyorsa (I have to…, I'm busy…) cevap reddir; olumlu bir plan ya da soru geliyorsa (What time?, I'll bring…) kabuldür.
  refs:
  - U1-021
  - U1-019
  - U1-011
- type: tuzak
  text_tr: '"I''d love to" kabul gibi başlar ama ardından "but" geliyorsa nazik bir reddir. Cevabın sonunu okumadan şık işaretleme.'
  refs:
  - U1-011
  - U1-021
- type: tuzak
  text_tr: '"Why not?" soru işaretine rağmen kabuldür: "Neden olmasın, olur!". "Are you busy?" sorusuna "No, not at all." ise "hiç değilim, müsaitim" demektir.'
  refs:
  - U1-025
  - U1-004
- type: hafiza_kancasi
  text_tr: reliable = rely (güvenmek) + able (-ebilir) = güvenilebilir. un- eklersen tersi - unreliable.
  refs:
  - U1-059
  - U1-060
  - U1-068
- type: kelime_ailesi
  text_tr: count on = rely on = depend on = trust. Dördü de güvenmek; yalnız trust edat almaz (I trust you).
  refs:
  - U1-051
  - U1-060
  - U1-052
  - U1-067
- type: tuzak
  text_tr: '"What is he like?" = O nasıl biri? (kişilik) · "What does he like?" = Neyi sever? · "What does he look like?" = Neye benziyor, görünüşü nasıl? Üç soru, üç cevap.'
