  tactics:
  - Diyalog boşluğunda önce boşluktan SONRAKİ cümleyi oku; engel (I have to, I'm busy, but) varsa red, plan ya da soru (What time?) varsa kabul seç.
  - Cevap "I'd love to / Sure / Why not" ise boşluk bir davettir; "Do you like …?" ile başlayan şıkkı ele.
  - Kişilik sorusunda sıfatı değil kanıtı ara - always/never ile anlatılan davranış hangi sıfatın tanımı?
  - Olumlu davranış anlatılıyorsa olumsuz sıfatları (mean, jealous, stubborn, self-centred) hemen ele; kalan 2 şık arasında kanıtla seç.
  - Davet kartında zaman/yer/istek (bring …, reply by …) bilgilerini işaretle; doğru şık metni aynen değil eş anlamlıyla tekrar eder.
  - NOT/CANNOT/EXCEPT kelimesini daire içine al; bu sorularda üç şık doğrudur, yanlış olanı ararsın.
  - '"Why not?" kabuldür, "No, not at all." (Are you busy? sorusuna) müsait demektir; ikisi de olumsuz görünen olumlu cevaplardır.'
  - Güven kümesi (count on, rely on, depend on, trust) tek anlam sayılır; eş anlam sorusunda bu dört kelimeden biri varsa öteki çoğunlukla doğru şıktır.
  exam_vocabulary:
  - en: Which of the following best completes the dialogue?
    tr: Aşağıdakilerden hangisi diyaloğu en iyi tamamlar?
  - en: according to the invitation / text / chart
    tr: davete / metne / grafiğe göre
  - en: Which of the following is true / NOT true?
    tr: Aşağıdakilerden hangisi doğrudur / doğru değildir?
  - en: Which of the following CANNOT be inferred?
    tr: Aşağıdakilerden hangisi çıkarılamaz?
  - en: Which word best describes …?
    tr: … kişisini en iyi hangi kelime tanımlar?
  - en: closest in meaning to
    tr: anlamca en yakın
  - en: the underlined word(s)
    tr: altı çizili kelime(ler)
  - en: What does … say to …?
    tr: … , …'e ne der?
  - en: Why can't … attend the party?
    tr: … neden partiye katılamıyor?
  - en: refuse / accept the invitation
    tr: daveti reddetmek / kabul etmek
  - en: Which of the following is NOT a way of …?
    tr: Aşağıdakilerden hangisi … yollarından biri değildir?
  - en: mentioned / not mentioned
    tr: bahsedilen / bahsedilmeyen
  - en: respond / response
    tr: cevap vermek / cevap
  - en: suitable / appropriate
    tr: uygun
  - en: in order
    tr: sırayla
