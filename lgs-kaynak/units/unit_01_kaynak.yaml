    - U1-055
    lgs_weight: yüksek
    note_tr: Programda ayrı bir işlev başlığı olarak yazmaz; R1 kazanımının ("arkadaşlık hakkında kısa metinler") içeriğidir. LGS'de kişilik sıfatı + tanım eşleştirme ve "Which of the following is true
      about …'s friend?" biçimiyle sık gelir; bu yüzden ağırlığı yüksek tutuldu.
  - id: F6
    name_tr: Yiyecek-içecek teklif etme ve cevap verme
    exponents:
    - Would you like some fruit juice?
    - Would you like another piece of cake?
    - Do you want some more pizza?
    responses:
    - Yes, I'd love some.
    - No, thanks. I'm full.
    - No, thanks. I'm stuffed.
    items:
    - U1-026
    - U1-017
    - U1-011
    - U1-097
    - U1-099
    lgs_weight: orta
    note_tr: Programın örnek diyaloğunda geçer (Would you like some fruit juice? — No, thanks. I'm full/stuffed). "Would you like + isim" (some juice) ile "Would you like to + fiil" (to come) ayrımı burada
      öğretilir.
  - id: F7
    name_tr: Tercih ve görüş bildirme (plan yaparken)
    exponents:
    - I prefer the cinema to the picnic.
    - I'd prefer to stay at home.
    - It doesn't matter to me. You choose.
    - We have the same opinion about it.
    responses:
    - OK, cinema then!
    - Fine. Let's go to the picnic next week.
