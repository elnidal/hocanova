- 'MEB 2018 programının Ünite 1 kazanımları ve useful language örnekleri resmî program PDF''inden (mufredat.meb.gov.tr) değil, ikincil kaynaklardan doğrulandı: Bursa ve Burdur İl MEM 8. sınıf konu-soru
  dağılım tabloları (2023) ve bir okulun 2017-18 yıllık planı. Kodlar ve metinler iki bağımsız kaynakta tutarlı; yine de resmî PDF ile bir kez karşılaştırılmalı.'
- Bazı yıllık planlarda R1 ile R2 birleşik görünüyor (ör. "R1 - invitation letters, cards and e-mails" tek madde); il MEM tablolarında ayrı (R1 arkadaşlık metinleri, R2 davet mektupları). Dosyada ayrı yazıldı.
- F5 (kişiyi tanımlama), F6 (yiyecek teklifi) ve F7 (tercih) programda ayrı işlev başlığı değil; F6 programın örnek diyaloğundan, F5 R1 kazanımından türetildi, F7 Ü2/Ü3 işlevi. Ağırlıklar (yüksek/orta/düşük)
  LGS soru biçimlerinden yapılan editoryal tahmindir, istatistik değil.
- 2027 LGS'de İngilizce sorularının ünitelere dağılımı (Ünite 1'den kaç soru) ve sınav kapsamının hangi üniteleri içereceği doğrulanmadı; MEB'in o yıl yayımlayacağı kapsam duyurusuna bakılmalı.
- '"2027 LGS hâlâ 2018 programından; 8. sınıf Maarif Modeli''ne 2027-2028''de geçiyor" bilgisi havuz çalışma kitabının bulgusundan alındı; bu dosyada ayrıca doğrulanmadı.'
- Kaynak D (212.xlsx) Ünite 1 ile Ünite 2'yi karıştırıyor ve bir satırı kaymış (reunion / jealous); jealous'un Türkçe karşılığı bu yüzden yalnız C'ye dayanıyor.
- ONCEKI_UNITE sınıfı Ünite 1 için boş (önceki ünite yok); 7. sınıftan gelen kelimeler BILINEN altında.
- U1-089 birim dosyasında Amerikan yazımıyla (self-centered) duruyor; İngiliz yazımı tercihine göre self-centred'e çevrilip çevrilmeyeceği editör kararı.
