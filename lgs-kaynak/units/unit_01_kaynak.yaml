synonym_sets:
- words:
  - count on
  - rely on
  - depend on
  - trust
  difference_tr: Dördü de "güvenmek". trust edatsız ve genel (I trust you); count on / rely on "zor anda bel bağlamak" vurgusu taşır; depend on ayrıca "-e bağlı olmak" demektir (It depends on the weather).
  items:
  - U1-051
  - U1-060
  - U1-052
  - U1-067
- words:
  - buddy
  - mate
  - close friend
  - true friend
  difference_tr: buddy ve mate gündelik "kanka, ahbap" (mate İngiliz İngilizcesinde çok yaygın); close friend "yakın arkadaş"; true friend "gerçek, sadık dost" ve değer yüklü.
  items:
  - U1-028
  - U1-040
  - U1-030
  - U1-047
- words:
  - attend
  - join
  difference_tr: attend bir etkinliğe/toplantıya/derse "katılmak, gitmek" (daha resmi); join bir gruba ya da kişilere "katılmak, aralarına girmek" (Join us!). İkisi de edatsız.
  items:
  - U1-003
  - U1-015
- words:
  - support
  - back up
  difference_tr: İkisi de "destek olmak". back up gündelik ve özellikle bir tartışmada "arka çıkmak" (Duru backed Bora up); support daha genel.
  items:
  - U1-063
  - U1-049
- words:
  - full
  - stuffed
  difference_tr: full "tok, doydum"; stuffed "tıka basa doydum" (daha güçlü, gündelik).
  items:
  - U1-097
  - U1-099
- words:
  - exciting
  - thrilling
  difference_tr: 'thrilling, exciting''in daha güçlüsü: "nefes kesen, çok heyecanlı" (roller coaster, maç sonu).'
  items:
