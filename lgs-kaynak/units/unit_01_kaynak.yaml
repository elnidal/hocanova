- item: U1-095
  links_to: U2-030
  note_tr: boring / exciting / thrilling (Ü1) ↔ annoying, fascinating, impressive, entertaining (Ü2); değerlendirme sıfatları büyür.
- item: U1-098
  links_to: U2-092
  note_tr: fun ↔ enjoyable / entertaining (Ü2). funny ile karışmayı Ü2'de de izle.
- item: U1-079
  links_to: U2-091
  note_tr: laid-back / calm (kişi) ↔ relaxing (etkinlik, Ü2). -ing/-ed sıfat ayrımına bağlanır.
- item: U1-077
  links_to: U2-018
  note_tr: honest (dürüst) ↔ "To be honest" (U2-018, açıkçası) görüş bildirme kalıbı.
- item: U1-097
  links_to: U3-057
  note_tr: '"No, thanks. I''m full." (Ü1 ikram) ↔ "Enjoy your meal" ve yemek değerlendirme (Ü3). Ü3''te sofra diyaloğu sürer.'
- item: U1-026
  links_to: U3-053
  note_tr: Would you like some …? (ikram) ↔ be in the mood for (canı istemek, Ü3); yiyecek teklif ve tercih diyalogları.
- item: U1-008
  links_to: U2-008
  note_tr: How about + -ing ↔ like/love/enjoy + -ing (Ü2). Fiilden/edattan sonra -ing kuralının ilk karşılaşması Ü1'de.
