grammar:
- id: G1
  name_tr: Davet ve teklif kalıpları — Would you like to …? / Do you want to …?
  form: Would you like to + V1 …? · Would you like + (some/a) isim? · Do you want to + V1 …?
  examples:
  - Would you like to come to my birthday party?
  - Would you like some lemonade?
  - Do you want to play basketball after school?
  - Would you like to join us for a picnic on Sunday?
  explain_tr: 'Davet ederken "Would you like to" + fiilin yalın hâli kullanılır; bir şey ikram ederken "Would you like" + isim. "Would you like to" daha kibar; "Do you want to" arkadaşlar arasında daha
    gündelik. "Would you like …?" ile "Do you like …?" farklıdır: ilki davet/teklif (ister misin?), ikincisi genel zevk sorusu (sever misin?).'
  common_errors:
  - wrong: Would you like come to my party?
    right: Would you like to come to my party?
    why_tr: Davette fiilden önce "to" gelir.
  - wrong: Do you like to come to my party on Saturday?
    right: Would you like to come to my party on Saturday?
    why_tr: '"Do you like" sevip sevmediğini sorar; belirli bir davet için "Would you like" gerekir.'
  - wrong: Would you like coming to the cinema?
    right: Would you like to come to the cinema?
    why_tr: -ing, How about'tan sonra gelir; Would you like'tan sonra to + V1.
  - wrong: Would you like to come? — Yes, I would like.
    right: Would you like to come? — Yes, I'd love to. / Yes, I'd like to.
    why_tr: Kısa cevapta "to" düşmez (I'd love to.).
  lgs_note: 'Diyalog tamamlamada boşluk çoğu zaman davet cümlesidir: cevap "I''d love to, but …" ise boşluk "Would you like to …?" ya da "Do you want to …?" ile başlar. Şıklarda "Do you like …?" çeldirici
    olarak sık konur.'
  items:
  - U1-026
  - U1-006
  - U1-010
  - U1-011
  - U1-013
- id: G2
  name_tr: Öneri kalıpları — How about / What about + -ing ya da isim; Let's + V1
  form: How about / What about + V-ing / isim? · Let's + V1. · Why don't we + V1?
  examples:
  - How about going to the cinema tonight?
  - What about a pizza party on Friday?
  - Let's meet at the bus stop at 5.
  - Why don't we invite Elif, too?
  explain_tr: 'How about ve What about "… ne dersin?" anlamında öneri yapar ve ardından ya -ing''li fiil ya da isim gelir. "What about you?" ise öneri değil, karşı sorudur: "Peki ya sen?". Let''s ve Why
    don''t we''dan sonra fiil yalın gelir.'
  common_errors:
  - wrong: How about go to the park?
    right: How about going to the park?
    why_tr: How about'tan sonra fiil -ing alır (Türkçedeki "gitmeye ne dersin" gibi isimleşir).
  - wrong: Let's to watch a film.
    right: Let's watch a film.
    why_tr: Let's'ten sonra "to" gelmez.
  - wrong: Let's going to the beach.
    right: Let's go to the beach.
    why_tr: Let's + yalın fiil.
  lgs_note: Şıklarda How about'tan sonraki fiil biçimi tek başına bir soru yapmaz; ama "How about + -ing" kalıbını tanımak, diyalogda öneri cümlesini ve onu izleyen kabul/red cevabını bulmayı hızlandırır.
  items:
  - U1-008
  - U1-024
- id: G3
  name_tr: Kabul ve red cevapları — Sounds + sıfat, I'd love to, Sorry, I can't …
  form: 'Kabul: (That) sounds + sıfat! / I''d love to. / That would be great. / Why not? · Red: Sorry, I can''t (+ V1). / I''d love to, but + sebep.'
  examples:
  - That sounds great! What time should I come?
  - I'd love to, but I'm going to the dentist on Saturday.
  - Sorry, I can't. I have to look after my little brother.
  - Why not? I have nothing to do this weekend.
  explain_tr: '"I''d love to" tek başına kabuldür; ardından "but" geliyorsa redde döner. "Sounds" burada "kulağa … geliyor" demektir ve ardından isim değil sıfat gelir (sounds fun, sounds good). "Why not?"
    bu bağlamda soru değil, "Neden olmasın, olur!" anlamında kabuldür.'
  common_errors:
  - wrong: It sounds funny! I'll come.
    right: It sounds fun! I'll come.
    why_tr: funny = komik; davet için "eğlenceli" anlamında fun gerekir.
  - wrong: Sounds greatly!
    right: Sounds great!
    why_tr: sound (kulağa gelmek) fiilinden sonra zarf değil sıfat gelir.
  - wrong: I'd love to. But I can't come. (kabul sanmak)
    right: I'd love to, but I can't come. (red)
    why_tr: Cümlenin sonu belirleyicidir; "but" sonrasındaki engel cevabı red yapar.
  lgs_note: Soru "Which of the following is NOT an acceptance / refusal?" biçiminde gelebilir. "I'd love to, but …" redde, "Why not?" kabulde sayılır; çeldiriciler bu iki tersine okumayı hedefler.
  items:
