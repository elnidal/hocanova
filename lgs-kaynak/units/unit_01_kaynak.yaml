  register: gündelik
- en: That would be great.
  tr: Harika olur.
  use: Bir teklifi ya da öneriyi kabul ederken.
  item: U1-023
  register: nötr
- en: Why not?
  tr: Neden olmasın? (Olur!)
  use: Bir öneriyi rahatça kabul ederken; soru değil.
  item: U1-025
  register: gündelik
- en: Sorry, I can't. I have to …
  tr: Üzgünüm, yapamam. …mam gerekiyor.
  use: Daveti sebep vererek reddederken.
  reply:
  - That's OK. Maybe next time.
  - What a pity!
  item: U1-021
  register: nötr
- en: I'd love to, but …
  tr: Çok isterdim ama …
  use: Kırmadan reddederken; ardından sebep gelir.
  reply:
  - No problem. Next time!
  item: U1-011
  register: nötr
- en: I'm afraid I can't.
  tr: Maalesef gelemem / yapamam.
  use: Kibar, biraz daha resmi red. "korkmak" anlamı yok.
  reply:
  - Never mind.
  register: nötr
- en: Maybe next time.
  tr: Belki bir dahaki sefere.
  use: Reddedilen davete anlayışla cevap verirken ya da reddi yumuşatırken.
  register: gündelik
- en: I apologise for …
  tr: … için özür dilerim.
  use: Yazılı/resmi özür; mektup ve e-postada.
  reply:
  - Don't worry about it.
  - That's all right.
  item: U1-002
  register: resmi
- en: It doesn't matter.
  tr: Fark etmez / Önemli değil.
  use: Seçenekler arasında tercih yapmayınca ya da birinin özrüne karşılık verirken.
  item: U1-014
  register: nötr
- en: I have nothing to do.
  tr: Yapacak bir şeyim yok.
  use: Boş olduğunu söylerken; davete açık olduğunu ima eder.
  item: U1-009
  register: gündelik
- en: Are you busy tomorrow evening?
  tr: Yarın akşam meşgul müsün?
  use: Davetten önce uygunluk sorarken.
  reply:
  - No, not at all. Why?
  - Yes, I am. Sorry.
  item: U1-004
  register: nötr
- en: No, not at all.
  tr: Hayır, hiç değil (müsaitim).
  use: '"Are you busy?" gibi bir soruya olumsuz yani müsait cevap verirken.'
  register: gündelik
- en: No, thanks. I'm full.
  tr: Hayır, teşekkürler. Doydum.
  use: Yiyecek teklifini kibarca geri çevirirken. Daha güçlüsü "I'm stuffed."
  item: U1-097
  register: nötr
- en: Yes, I'd love some.
  tr: Evet, biraz alırım.
  use: Yiyecek/içecek teklifini kabul ederken (some + sayılamayan).
  item: U1-011
  register: nötr
- en: As soon as possible
  tr: Bir an önce, mümkün olan en kısa sürede
  use: Acil bir istek; mesajlarda kısaltması ASAP.
  item: U1-094
  register: nötr
- en: You can count on me.
  tr: Bana güvenebilirsin.
  use: Birine destek sözü verirken.
  item: U1-051
  register: gündelik
- en: She is always there for me.
  tr: O hep yanımda.
  use: Bir arkadaşın zor zamanlarda yanında olduğunu anlatırken.
  item: U1-037
  register: nötr
- en: You're fun to be with.
  tr: Seninle vakit geçirmek çok eğlenceli.
  use: Arkadaşa iltifat ederken; doğum günü kartı, mesaj.
  item: U1-048
  register: gündelik
- en: He is always in a hurry.
  tr: Hep acelesi var.
  use: Sürekli koşturan, geç kalan birini anlatırken.
  item: U1-075
  register: nötr
- en: We have a lot in common.
  tr: Birçok ortak noktamız var.
  use: Benzer ilgi alanları olan arkadaşları anlatırken.
  item: U1-036
  register: nötr
- en: A friend in need is a friend indeed.
  tr: Dost kara günde belli olur.
  use: Arkadaşlık metinlerinde, posterlerde sık geçen atasözü; okuma metninde tanıma düzeyi.
  register: nötr
- en: Thanks for the invitation.
  tr: Davetin için teşekkürler.
  use: Davete cevap verirken (kabul ya da redden önce).
