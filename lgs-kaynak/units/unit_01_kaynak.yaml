traps:
- about: excuse
  item: U1-007
  kind: cok_anlamli
  trap_tr: Ünitede isim "bahane, mazeret" (a good excuse); ama "Excuse me" kalıbı "affedersiniz, pardon" demek.
  tip_tr: Önünde a/an/my varsa ya da "make an excuse" geçiyorsa bahane; "Excuse me" ile başlıyorsa nezaket sözü.
- about: miss
  item: U1-016
  kind: cok_anlamli
  trap_tr: miss hem "kaçırmak" (miss the bus/party) hem "özlemek" (I miss you).
  tip_tr: Nesne bir olay ya da taşıt ise (bus, film, party, lesson) kaçırmak; kişi ya da yer ise genelde özlemek.
- about: text
  item: U1-046
  kind: cok_anlamli
  trap_tr: text fiil olarak "mesaj atmak" (Text me!); isim olarak "metin" (Read the text.).
  tip_tr: Özneden sonra ya da me/him/her'den önce geliyorsa fiildir. LGS yönergesinde "the text" hep "metin"dir.
- about: back up
  item: U1-049
  kind: cok_anlamli
  trap_tr: back up (fiil) "destek olmak, arka çıkmak"; backup (isim) "yedek" (a backup plan). E kaynağının örnek cümlesi ikinci anlamı kullanıyor.
  tip_tr: Kişiyle birlikte (back me up, back Bora up) "destek"; plan/dosyayla birlikte "yedek".
- about: lie
  item: U1-056
  kind: cok_anlamli
  trap_tr: lie "yalan, yalan söylemek"; lie down "uzanmak". Geçmiş biçimleri farklı (lied / lay).
  tip_tr: Yanında down ya da on the sofa varsa uzanmak; "to sb" ya da "tell a" varsa yalan.
- about: fair
  item: U1-071
  kind: kaynak_hatasi
  trap_tr: Kaynak C ve D "fair = dürüst" yazmış; doğrusu "adil". Aynı listelerde "book fair / science fair" (fuar) de var.
  tip_tr: Kişi için fair = adil (a fair teacher, That's not fair!); "dürüst" honest'tır. Önünde book/science/job varsa fuar.
- about: funny
  item: U1-073
  kind: kaynak_hatasi
  trap_tr: E kaynağı "funny = eğlenceli" yazmış; funny "komik, güldüren". "Eğlenceli" fun'dır.
  tip_tr: Bir etkinlik "fun", güldüren kişi/şaka "funny". "The party was funny" denirse parti komikti (garipti) anlamına kayar.
- about: like
  item: U1-080
  kind: cok_anlamli
  trap_tr: Ünitenin hedefi "gibi" anlamındaki like (What is he like? / like a brother); öğrenci refleksle "sevmek" diye okur.
  tip_tr: '"What is/are … like?" kalıbında like her zaman "gibi"dir ve kişilik sorar.'
- about: mean
  item: U1-083
  kind: kaynak_hatasi
  trap_tr: A kaynağı yalnız "anlamına gelmek" (fiil) vermiş; ünitedeki hedef kişilik sıfatı "cimri, kaba".
  tip_tr: '"be mean / a mean person / Don''t be mean" sıfat; "What does it mean?" fiil.'
- about: full
  item: U1-097
  kind: cok_anlamli
  trap_tr: full hem "dolu" hem "tok". Ünitede hedef "tok" (No, thanks. I'm full.).
  tip_tr: Özne kişi ise (I'm full) tok; kap/yer ise (The bus is full) dolu. Türkçedeki "doydum" ile "Ben doluyum" çevirisini karıştırma.
- about: close friend
  item: U1-030
  kind: benzer_yazilis
  trap_tr: close sıfat "yakın" /kləʊs/; fiil "kapatmak" /kləʊz/. Yazılış aynı, okunuş farklı.
  tip_tr: Önünde a/very, ardında friend/to varsa sıfat (yakın).
- about: caring
  item: U1-070
  kind: kaynak_hatasi
  trap_tr: C kaynağı "caring = yardımsever" yazmış; caring "şefkatli, ilgili". Yardımsever helpful.
  tip_tr: caring duygusal ilgiyi (hasta arkadaşı arayan), helpful somut yardımı (ödevde yardım eden) anlatır.
- about: supportive
  item: U1-092
  kind: kaynak_hatasi
  trap_tr: C ve D "supportive = yardımcı" yazmış; doğrusu "destekleyici".
  tip_tr: supportive kişi arkadaşını cesaretlendirir, arkasında durur; "yardımcı/yardımsever" helpful'dır.
- about: true friend
  item: U1-047
  kind: kaynak_hatasi
  trap_tr: C kaynağı "doğru arkadaş" yazmış; Türkçede doğal karşılık "gerçek arkadaş / gerçek dost".
  tip_tr: true burada "doğru" değil "gerçek, hakiki" anlamında.
- about: self-disciplined
  item: U1-090
  kind: kaynak_hatasi
  trap_tr: E kaynağı sıfatın yanına isim biçimini (self-discipline) karşılık gibi yazmış.
  tip_tr: self-discipline = öz disiplin (isim); self-disciplined = öz disiplinli (sıfat).
- about: relatable / reliable
  item: U1-059
  kind: kaynak_hatasi
  trap_tr: E kaynağı "relatable = güvenilir" yazmış; relatable "kendini onunla özdeşleştirebileceğin" demek. Kastedilen reliable.
  tip_tr: reliable = rely (güvenmek) + -able. Benzer yazılışlı relatable'ı sınavda görmezsin.
- about: desert / dessert
  kind: kaynak_hatasi
  trap_tr: C ve D "desert = tatlı" yazmış; desert "çöl", tatlı dessert (çift s). Ünite 3'te dessert öğretiliyor.
  tip_tr: 'Tatlıyı iki kez istersin: deSSert.'
- about: take things seriously
  kind: kaynak_hatasi
  trap_tr: A kaynağında "take things serious" yazıyor; doğrusu "take things seriously" (fiili niteleyen zarf).
  tip_tr: take + nesne + seriously = ciddiye almak.
- about: attach great importance
  kind: kaynak_hatasi
  trap_tr: C kaynağı "attach great = çok önemsemek" diye eksik ifade vermiş.
  tip_tr: Tam kalıp "attach great importance to sth" (bir şeye büyük önem vermek); tanıma düzeyi.
- about: elicit
  kind: kaynak_hatasi
  trap_tr: C kaynağı "elicit = öğrenmek" yazmış; elicit "(bilgi, cevap) ortaya çıkarmak, almak". Ders kitabının yönerge dili.
  tip_tr: Öğrenciye gerekmez; listelerde görünce öğretme.
- about: body
  kind: kaynak_hatasi
  trap_tr: C kaynağı "body part = ana bölüm" yazmış; mektup/e-postanın "gövde" bölümü kastediliyor. "body part" normalde "vücut parçası".
  tip_tr: Mektup bölümleri - greeting, body, closing. W1 mektup yazımı bağlamından geliyor.
- about: sympathetic
  kind: sahte_dost
  trap_tr: Kişilik anlatırken Türkçedeki "sempatik" için sympathetic kullanılır sanılır; sympathetic "anlayış gösteren, halden anlayan" demek.
  tip_tr: '"Sempatik, sevimli" için friendly, nice, likeable.'
- about: argue / discuss
  item: U1-027
  kind: turkce_etkisi
  trap_tr: Türkçedeki "tartışmak" iki İngilizce fiile karşılık gelir; argue "kavgalı tartışmak, atışmak", discuss "bir konuyu görüşmek".
  tip_tr: Öfke ve ses yükselmesi varsa argue; plan/konu konuşuluyorsa discuss (discuss edat almaz - discuss about değil).
- about: join / attend
  item: U1-015
  kind: turkce_etkisi
  trap_tr: '"-e katılmak" eki yüzünden "join to / attend to" denir.'
  tip_tr: join us, join the club, attend the party - edatsız.
- about: apologise to
  item: U1-002
  kind: turkce_etkisi
  trap_tr: '"Senden özür dilerim" çevirisiyle "apologise you / apologise from you" denir.'
  tip_tr: apologise TO sb FOR sth.
- about: trust / count on
  item: U1-067
  kind: dilbilgisi
  trap_tr: count on / rely on / depend on edat aldığı için "trust on" da sanılır.
  tip_tr: trust edatsızdır - I trust you.
- about: Do you like …? / Would you like …?
  item: U1-026
  kind: dilbilgisi
  trap_tr: İki soru tek harf gibi görünür ama anlam farklı - Do you like = sever misin? (genel), Would you like = ister misin? (davet/teklif).
  tip_tr: Belirli bir zaman (on Saturday, tonight) ya da ikram varsa Would you like.
- about: I'd love to, but …
  item: U1-011
  kind: dilbilgisi
  trap_tr: '"I''d love to" ile başlayan cümle kabul sanılır; "but" ile devam ediyorsa red.'
  tip_tr: Cevabı sonuna kadar oku; "but / unfortunately / I have to" görürsen red.
- about: self-centered / self-centred
  item: U1-089
  kind: benzer_yazilis
  trap_tr: Birim dosyasında Amerikan yazımı (self-centered) var; İngiliz yazımı self-centred. İkisi de doğru.
  tip_tr: Sınav metninde iki yazımı da görebilirsin; anlam aynı (bencil).
- about: How is he? / What is he like?
  item: U1-080
  kind: turkce_etkisi
  trap_tr: Türkçedeki "O nasıl biri?" sorusundaki "nasıl" yüzünden How is he? denir; o soru hâl hatır sorar.
  tip_tr: Kişilik → What is he like? · Hâl/sağlık → How is he?
lgs_focus:
  what_is_tested:
  - Davet–cevap diyaloğunu tamamlama (Would you like to …? / How about …? ve uygun kabul ya da red cevabı).
  - Bir cevabın kabul mü red mi olduğunu ayırma; "I'd love to, but …" gibi yumuşak redleri tanıma.
  - Davet kartı, parti ilanı, e-posta ya da grup mesajından bilgi çıkarma (zaman, yer, kim gelemiyor, neden).
  - Red/özür mesajındaki sebebi bulma (because …, I have to …).
  - Kısa tanım ya da davranıştan kişilik sıfatını çıkarma (keeps secrets → reliable; never shares → mean).
  - Arkadaşlık nitelikleri metni/anketi okuma (Which quality is the most important for …?) ve tablo yorumlama.
  - Güven kümesinde eş anlam (count on = rely on = trust) ve keep/break a promise, keep a secret öbekleri.
  - '"What is he like?" sorusuna uygun cevap.'
  question_patterns:
  - type: dialogue_complete
    description_tr: Kısa bir davet diyaloğunda boşluğa uygun cümle seçilir. Boşluk çoğu zaman davetin kendisi ya da cevaptır.
    sample_stem: 'Kaan: Hi Selin! I''m having a pizza party at my house on Friday evening. ________

      Selin: I''d love to! What time should I come?

      Which of the following best completes the dialogue?'
    sample_options:
    - Would you like to come?
    - Do you like pizza?
    - Where do you live?
    - Did you enjoy the party?
    distractor_logic_tr: '"Do you like pizza?" konuyla aynı kelimeyi taşır ama davet değildir; "Did you enjoy …?" zaman uyumsuz (geçmiş); "Where do you live?" cevapla ilgisiz. Doğru şık cevabın (I''d love
      to!) davet istediğini görmekle bulunur.'
    items:
    - U1-026
    - U1-011
    - U1-006
  - type: dialogue_complete
    description_tr: Cevabın ortasındaki boşluk; sonrasında gelen cümle kabul mü red mi olduğunu ele verir.
    sample_stem: 'Ece: Do you want to come to the cinema with us on Saturday?

      Bora: ________ I have to visit my grandmother in the hospital.

      Which of the following best completes the dialogue?'
    sample_options:
    - I'm sorry, but I can't.
    - Sure, that sounds fun!
    - Yeah, why not?
    - That would be great.
    distractor_logic_tr: Üç çeldirici de kabul kalıbıdır; boşluktan sonraki "I have to …" engel bildirdiği için yalnız red uyar. Öğrenci boşluktan sonrasını okumazsa kabul şıklarından birini seçer.
    items:
    - U1-021
    - U1-022
    - U1-025
    - U1-023
  - type: message_infer
    description_tr: Davet kartı, parti ilanı ya da e-posta okunur; zaman/yer/etkinlik/istek hakkında doğru bilgi sorulur.
    sample_stem: 'Hi everyone,

      It''s my 14th birthday next Sunday! I''m having a picnic in Kültürpark at 2 p.m.

      We''ll play games and have a barbecue. Please bring your own drinks.

      Reply by Thursday, please!

      Duru

      According to the invitation, which of the following is true?'
    sample_options:
    - The guests should answer before Friday.
    - The picnic will start in the morning.
    - Duru will bring drinks for everybody.
    - The party is at Duru's house.
    distractor_logic_tr: Çeldiriciler metindeki kelimeleri (drinks, party, 2 p.m.) yanlış bilgiyle eşler. Doğru şık metindeki "Reply by Thursday" cümlesinin eş anlamlı ifadesidir (answer before Friday);
      doğru şık metni tekrar etmez, yeniden ifade eder.
    items:
    - U1-020
    - U1-012
    - U1-013
  - type: message_infer
    description_tr: Katılamama mesajı/e-postası okunur, sebep ya da telafi önerisi sorulur (W1 ve R2 kazanımı).
    sample_stem: 'Dear Ece,

      Thank you very much for the invitation. I''d love to come to your party, but I can''t.

      My cousin is getting married on Saturday and we are going to Ankara. I''m really sorry.

      Can I come over next week with a small present?

      Love, Selin

      Why can''t Selin attend the party?'
    sample_options:
    - She is going to a wedding.
    - She doesn't like parties.
    - She has to study for an exam.
    - She is ill at home.
    distractor_logic_tr: Çeldiriciler tipik mazeretlerdir (sınav, hastalık) ve metinde yoktur; "doesn't like parties" ise "I'd love to come" ile çelişir. Doğru şık "getting married" ifadesini "wedding"
      ile yeniden söyler.
    items:
    - U1-003
    - U1-002
    - U1-005
    - U1-012
  - type: trait_match
    description_tr: Kısa bir davranış tarifinden kişilik sıfatı çıkarılır.
    sample_stem: '"My friend Kaan never tells my secrets to others and always keeps his promises.

      I can always count on him."

      Which word best describes Kaan?'
    sample_options:
    - reliable
    - stubborn
    - jealous
    - outgoing
    distractor_logic_tr: Çeldiriciler gerçek kişilik sıfatlarıdır ama metinde kanıtı yoktur; outgoing olumlu olduğu için en güçlü çeldiricidir. Kanıt öbekleri (keeps promises, count on) doğrudan reliable'a
      işaret eder.
    items:
    - U1-059
    - U1-055
    - U1-054
    - U1-051
    - U1-091
    - U1-078
    - U1-084
  - type: situation
    description_tr: Bir durum verilir, o durumda söylenecek en uygun cümle sorulur.
    sample_stem: 'Your friend invites you to her birthday party, but you have a basketball match at the same time.

      What do you say to her?'
    sample_options:
    - I'd love to come, but I have a match that day.
    - Thanks! I'll be there on time.
    - How about a birthday party?
    - Sure, that sounds great!
    distractor_logic_tr: İki şık kabuldür ve durumla çelişir; "How about a birthday party?" öneri olduğu için yanlış işlevdir. Durumdaki "but you have …" kısmı red + sebep gerektirir.
    items:
    - U1-011
    - U1-021
    - U1-008
    - U1-022
  - type: synonym
    description_tr: Cümledeki altı çizili ifadeye anlamca en yakın ifade sorulur.
    sample_stem: '"You can always rely on Selin. She never lets you down."

      Which of the following is closest in meaning to the underlined words "rely on"?'
    sample_options:
    - count on
    - argue with
    - get bored of
    - introduce
    distractor_logic_tr: Çeldiriciler aynı biçimde (fiil + edat) ama anlamca ilgisizdir; argue with zıt yönde bir ilişki bildirir. Öğrenci güven kümesini (count on, rely on, depend on, trust) grup olarak
      biliyorsa saniyeler sürer.
    items:
    - U1-060
    - U1-051
    - U1-052
    - U1-067
  - type: table_graph
    description_tr: Bir anket ya da tablo (öğrencilerin arkadaşlıkta önem verdiği özellikler, kim hangi gün müsait) okunur ve yorumlanır.
    sample_stem: 'Students in 8/A answered the question "What is the most important quality of a good friend?"

      honest: 12 students · loyal: 8 students · funny: 6 students · generous: 4 students

      Which of the following is true according to the results?'
    sample_options:
    - The biggest group of students thinks a good friend should tell the truth.
    - Being funny is more important than being loyal for the students.
    - Generous is the most popular answer.
    - Loyal is the least popular answer.
    distractor_logic_tr: Çeldiriciler karşılaştırmayı ters kurar (more/most/least). Doğru şık "honest" kelimesini değil anlamını (tell the truth) kullanır; öğrenci hem sayı hem anlam bilgisini birleştirmek
      zorundadır.
    items:
    - U1-077
    - U1-081
    - U1-073
    - U1-074
  - type: odd_one_out
    description_tr: Şıklardan biri ötekilerden farklı işlevde/anlamdadır (ör. kabul cümleleri arasında bir red).
    sample_stem: Which of the following is NOT a way of accepting an invitation?
    sample_options:
    - Thanks, but I'm busy that day.
    - Why not?
    - That would be great.
    - Sounds awesome!
    distractor_logic_tr: '"Why not?" soru biçiminde olduğu için öğrenciye yanlış gelebilir; oysa kabuldür. Doğru şık "Thanks" ile olumlu başlar ama "but I''m busy" ile reddeder; ilk kelimeye bakan öğrenci
      yanılır.'
    items:
    - U1-025
    - U1-023
    - U1-022
    - U1-004
  - type: text_infer
    description_tr: Bir arkadaşlık blogu/mektubu okunur, yazarın arkadaşı hakkında ne düşündüğü ya da metinde hangi bilginin olmadığı sorulur.
    sample_stem: '"Elif and I met last month, but we already have a lot in common. We both love music and dogs.

      We get on well and we never argue. When I feel alone, she texts me and we chat for hours."

      Which of the following CANNOT be inferred from the text?'
    sample_options:
    - They have known each other for years.
    - They have similar interests.
    - Elif is a supportive friend.
    - They communicate by phone.
    distractor_logic_tr: CANNOT soruları olumsuz okunmalı; üç şık metinden çıkarılabilir (a lot in common → similar interests, texts me when I feel alone → supportive). Doğru şık "met last month" ile çelişir.
    items:
    - U1-036
    - U1-034
    - U1-027
    - U1-031
