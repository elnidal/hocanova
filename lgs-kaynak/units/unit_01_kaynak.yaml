- id: G10
  name_tr: -ing / -ed sıfatlar — boring/bored, exciting/excited, interesting/interested
  form: şey/olay + is + V-ing sıfat (boring, exciting, thrilling) · kişi + is/feels + V-ed sıfat (bored, excited, interested)
  examples:
  - The film was boring, so I felt bored.
  - The roller coaster was thrilling!
  - I'm very excited about the school trip.
  explain_tr: -ing'li sıfat bir şeyin nasıl olduğunu (sebep), -ed'li sıfat kişinin ne hissettiğini (sonuç) anlatır. "I'm boring" "sıkıcı biriyim" demektir, "sıkıldım" değil.
  common_errors:
  - wrong: I'm boring. Let's do something.
    right: I'm bored. Let's do something.
    why_tr: Sıkılan kişi bored; boring sıkıcı olan şeydir.
  - wrong: I'm interesting in football.
    right: I'm interested in football.
    why_tr: Duygu bildiren kişi -ed sıfatını kullanır.
  lgs_note: Grafik/tablo sorularında etkinliklerin "boring / exciting / fun" olarak değerlendirildiği anketler gelir; bu sıfatların derecesi (thrilling > exciting) yorum sorusunda belirleyici olabilir.
