schema_version: 1
unit: 1
title: Friendship
status: taslak
summary_tr: 'Ünite, arkadaşlar arasındaki gündelik iletişimi öğretir: davet etmek, daveti kabul etmek ya da kibarca reddetmek, özür dileyip sebep göstermek, basit sorular sormak (Are you busy …?) ve bir
  arkadaşın nasıl biri olduğunu anlatmak. Sınavın omurgası iki şeydir: (1) davet–cevap diyaloğunu tamamlamak ve bir cevabın kabul mü red mi olduğunu anlamak; (2) bir arkadaşı anlatan kısa metinden ya da
  mesajdan kişilik sıfatını (reliable, loyal, honest, supportive, mean …) çıkarmak. Bunlara güven/söz/sır ifadeleri (keep a promise, count on, rely on) ve "What is he like?" sorusu eklenir. Kalıplar sınırlıdır
  ve her yıl aynı aileden gelir; öğrenci kalıpları ve 25 civarı kişilik sıfatını sağlam bilirse bu ünitenin soruları hızlı çözülür.'
curriculum:
  outcomes:
  - code: E8.1.L1
    text_tr: Gündelik konulardaki kısa konuşmalarda belirli bilgiyi anlar (teklif/daveti kabul etme ve reddetme, özür dileme, basit sorular sorma gibi). Dinleme LGS'de ölçülmez.
  - code: E8.1.SI1
    text_tr: Yapılandırılmış durumlarda ve kısa konuşmalarda makul bir rahatlıkla etkileşim kurar (teklif/daveti kabul etme ve reddetme, özür dileme, basit sorular sorma). LGS'de diyalog tamamlama sorularının
      dayanağıdır.
  - code: E8.1.SP1
    text_tr: Basit sorular sormak, açıklama yapmak ve sebep göstermek için kısa bir konuşma kurgular.
  - code: E8.1.R1
    text_tr: Arkadaşlık hakkındaki kısa ve basit metinleri anlar.
  - code: E8.1.R2
    text_tr: Kısa ve basit davet mektuplarını, kartlarını ve e-postalarını anlar.
  - code: E8.1.W1
    text_tr: Bir davete cevap olarak partiye neden katılamayacağını anlatan, özür dileyen kısa ve basit bir mektup yazar. Yazma LGS'de ölçülmez; ama bu tür bir mektup okuma sorusu olarak gelebilir.
  functions:
  - id: F1
    name_tr: Davet etme ve öneride bulunma
    exponents:
    - Would you like to come over tomorrow?
    - Would you like to come to my birthday party on Saturday?
    - Do you want to join us at the cinema?
    - How about a party at my house this Saturday?
    - How about going to the park after school?
    - What about watching a film tonight?
    - Let's meet in front of the school at 6.
    responses:
    - Sure, that sounds fun!
    - I'd love to.
    - Sorry, I can't. I have to study for my exam.
    items:
    - U1-026
    - U1-006
    - U1-008
    - U1-024
    - U1-013
    - U1-012
    - U1-005
    - U1-015
    lgs_weight: yüksek
    note_tr: 'Programın "Functions and Useful Language" bölümündeki örneklerin çoğu bu işlevden. LGS''de en sık biçim: davet cümlesi verilir, boşluğa uygun cevap ya da cevaba uygun davet sorulur.'
  - id: F2
    name_tr: Daveti / teklifi kabul etme
    exponents:
    - Sure, that sounds fun!
    - Sure, it sounds good / great / awesome.
    - Yeah, that would be great.
    - Yeah, why not?
    - I'd love to.
    - Of course! What time?
    - Thanks for the invitation. I'll be there.
    responses:
    - Great! See you at 7, then.
    - I'll text our friends to come over at 7 o'clock, then.
    items:
    - U1-001
    - U1-011
    - U1-022
    - U1-023
    - U1-025
    - U1-010
    - U1-012
    lgs_weight: yüksek
    note_tr: 'Kabul cevapları genelde kısa ve olumlu ünlemlerle (Sure, Yeah, Of course) başlar ve ardından bir plan ya da soru gelir (What time? / I''ll bring the cake.). Sounds + sıfat kalıbında sıfat
      her zaman olumlu: fun, good, great, awesome.'
  - id: F3
    name_tr: Daveti / teklifi reddetme, özür dileme ve sebep gösterme
    exponents:
    - I'm sorry, but I can't come over because my cousin is coming tomorrow.
    - Sorry, I can't. I have to study for my maths exam.
    - I'd love to, but I'm busy on Saturday.
    - I'm afraid I can't. I'm visiting my grandparents.
    - Unfortunately, I can't join you because I have a piano lesson.
    - I apologise for missing your party.
    responses:
    - That's OK. Maybe next time.
    - No problem. Good luck with your exam!
    - What a pity!
    items:
    - U1-021
    - U1-019
    - U1-002
    - U1-007
    - U1-004
    - U1-016
    - U1-003
    lgs_weight: yüksek
    note_tr: 'Red cümlesi üç parçalıdır: özür/yumuşatma (Sorry / I''d love to, but) + red (I can''t) + sebep (because …, I have to …, I''m busy). W1 kazanımındaki "partiye katılamama mektubu" bu işlevin
      yazılı hâlidir; LGS''de böyle bir e-posta okunup "Why can''t she attend the party?" diye sorulabilir.'
  - id: F4
    name_tr: Basit sorular sorma (bilgi alma, uygunluk sorma)
    exponents:
    - Are you busy tomorrow evening?
    - Are you free on Saturday?
    - What time does the party start?
    - Can you come to my house after school?
    - What's the matter? Why didn't you reply to my message?
    responses:
    - No, not at all. Why?
    - Yes, I am. I have a lot of homework.
    - It starts at 7 p.m.
    items:
    - U1-004
    - U1-009
    - U1-020
    - U1-005
    - U1-046
    lgs_weight: orta
    note_tr: '"Are you busy …?" sorusu çoğu zaman davetin ön hazırlığıdır; ardından Would you like to …? gelir. "No, not at all." burada "hiç değilim" anlamında olumlu bir cevaptır (meşgul değilim, müsaitim).'
  - id: F5
    name_tr: Bir arkadaşı / kişiyi tanımlama (kişilik ve arkadaşlık nitelikleri)
    exponents:
    - What is your best friend like?
    - She's honest and reliable. I can always count on her.
    - He is always there for me.
    - You're fun to be with.
    - We have a lot in common and we get on well with each other.
    - He is always in a hurry.
    - A true friend keeps your secrets.
    responses:
    - She's very caring and supportive.
    - He's a bit stubborn, but he's very loyal.
