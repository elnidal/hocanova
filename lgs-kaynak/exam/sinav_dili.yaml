track:
  name: "Sınav Dili"
  design_tr: >
    Kelime derslerinden ayrı, kısa (3-4 dk) mini dersler. Her ders bir soru ailesini öğretir: kök kartı (İngilizce + Türkçe),
    ne sorduğu, taktik, çözümlü örnek, 2 alıştırma. Ders açıldıktan sonra o kök, kelime günlerindeki Sına ve tekrar sorularında
    (stem_id ile) kullanılmaya başlar; böylece kök hem ayrı öğretilir hem her gün tekrar edilir.
  lessons:
    - {sira: 1, title: "Diyaloğu tamamla", stems: [S01], unlock_after: "Ü1 Gün 3"}
    - {sira: 2, title: "Kim katılıyor? Kim reddediyor?", stems: [S08, S09], unlock_after: "Ü1 Gün 8"}
    - {sira: 3, title: "Metinde var mı, yok mu?", stems: [S02, S03, S04], unlock_after: "Ü1 Gün 14"}
    - {sira: 4, title: "Tablo ve anket okuma", stems: [S06, S13], unlock_after: "Ü2 Gün 9"}
    - {sira: 5, title: "Başlık ve ana fikir", stems: [S05, S14], unlock_after: "Ü2 Gün 15"}
    - {sira: 6, title: "Tarif sırası", stems: [S07], unlock_after: "Ü3 Gün 4"}
    - {sira: 7, title: "Telefonda kim, neden arıyor?", stems: [S11, S10], unlock_after: "Ü4 Gün 3"}
    - {sira: 8, title: "Altı çizili kelime ve eşanlamlılar", stems: [S12], unlock_after: "Ü5 Gün 3"}
