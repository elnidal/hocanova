    Secretary: Of course. I''ll give him the message.


    According to the conversation, which of the following is TRUE?

    A) Mr Kaya is talking to Selin''s mum.

    B) Mr Kaya can''t answer the phone at the moment.

    C) The secretary will call Selin''s mum.

    D) Selin''s mum will call Mr Kaya back later.'
  ikinci: '✅ Cevap: B) Mr Kaya can''t answer the phone at the moment.

