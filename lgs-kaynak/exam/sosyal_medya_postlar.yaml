  hook: 🔎 Bu soru kökünü gördüğünde ne yapmalısın?
  metin: '“Who …? (Who is available for …? / Who enjoys …? / Who can''t …?)”

    = Kim …? (Kim müsait? / Kim … yapmaktan hoşlanır? / Kim arıyor?)'
  ikinci: 'Taktik: Her kişi için bir satırlık not çıkar (+ / −). Telefon diyaloglarında ''Who''s calling?'' arayanı, ''Can I speak to …?'' aranan kişiyi verir.

    Tuzak: Ret cümlesindeki olumlu kelime: ''I''d love to, but I''m busy'' diyen kişi KATILMIYOR.'
  gorsel: Soru kökü büyük, altında Türkçe; 2. slaytta taktik
