  hook: ⏱️ 30 saniyede LGS sorusu — cevabını yorumlara yaz!
  metin: 'Kaan: Ece, ________

    Ece: Sure! I won''t tell anyone. I promise.


    Which of the following completes the dialogue?

    A) can you tell everyone about Selin''s party?

    B) can you keep a secret? I''m planning a surprise party for Selin.

    C) why did you break your promise?

    D) did you enjoy Selin''s party last night?'
  ikinci: '✅ Cevap: B) can you keep a secret? I''m planning a surprise party for Selin.

    ''I won''t tell anyone. I promise.'' bir sır saklama sözüdür. ''tell everyone'' şıkkı ''tell'' kelimesini taşıyor ama Ece''nin cevabıyla ters düşüyor.'
