  metin: 'Kaan: In my free time, I hang out with my friends at the park. I don''t mind doing my homework, but I hate cleaning my room.


    According to the text, which of the following is TRUE?

    A) Kaan enjoys cleaning his room.

    B) Kaan hates doing his homework.

