  hook: 🔎 Bu soru kökünü gördüğünde ne yapmalısın?
  metin: '“Which of the following is an example of …? (an invitation / a refusal / an apology / an excuse / a preference)”

    = Aşağıdakilerden hangisi … örneğidir? (davet / ret / özür / bahane / tercih)'
  ikinci: 'Taktik: İşlev sinyallerini ezberle: Would you like…? = davet · I''d love to, but… = ret · I''m sorry… = özür · because… = gerekçe · I prefer… = tercih · Why don''t we…? = öneri.

    Tuzak: Aynı cümlede iki işlev: ''I''m sorry, I can''t come because I''m ill'' hem özür hem ret hem bahane içerir; kökün tam olarak neyi istediğine bak.'
  gorsel: Soru kökü büyük, altında Türkçe; 2. slaytta taktik
