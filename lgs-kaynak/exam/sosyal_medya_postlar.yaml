    Yer (Duru''nun evi), pastayı yapan (Duru''nun annesi) ve cevap tarihi (Cuma) yazıyor. ''Sunday afternoon'' partinin ne zaman olduğunu söylüyor ama bitiş saatini vermiyor.'
