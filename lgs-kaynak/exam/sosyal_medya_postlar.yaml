  metin: '“Which of the following questions is answered? · Which question can be the missing question?”

    = Aşağıdaki sorulardan hangisi cevaplanmıştır? / Eksik soru hangisidir?'
  ikinci: 'Taktik: Cevaptaki bilginin türüne bak: ''twice a week'' → How often; ''for 20 minutes'' → How long; ''because …'' → Why.

    Tuzak: How long (süre) ↔ How often (sıklık) ↔ How much (miktar / fiyat) karışıklığı.'
