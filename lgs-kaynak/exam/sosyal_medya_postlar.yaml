  metin: '“Which word / phrase can replace the underlined part? · What does the underlined word mean?”

    = Altı çizili kısmın yerine hangisi gelebilir? / Boşluğa hangisi gelir?'
  ikinci: 'Taktik: Şıkları cümleye tek tek yerleştir ve anlamın değişip değişmediğine bak; bilmediğin kelimede bağlamdaki ipucunu (but, because, so) kullan.

    Tuzak: Anlamca yakın ama dilbilgisi uymayan şık: ''I''m keen ___ swimming'' → on; ''fond ___'' → of.'
