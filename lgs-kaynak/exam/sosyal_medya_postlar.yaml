    ''again'' kelimesi Duru''nun gitarı daha önce de unuttuğunu gösterir. ''Selin is angry'' çekici olabilir ama Selin ''Don''t worry'' diyor; ''You can use mine'' da Selin''in gitarı olduğunu gösteriyor.'
