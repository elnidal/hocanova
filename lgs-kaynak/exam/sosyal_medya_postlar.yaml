  ikinci: '✅ Cevap: D) Kaan doesn''t have a problem with doing homework.

    ''I don''t mind'' = sorun etmiyorum. ''Kaan hates doing his homework'' metindeki ''hate'' kelimesini alıp yanlış etkinliğe bağlıyor: Kaan odasını toplamaktan nefret ediyor.'
