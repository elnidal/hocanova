  konu: Friendship
  hook: ⏱️ 30 saniyede LGS sorusu — cevabını yorumlara yaz!
  metin: 'Selin: ________

    Bora: Sure, I''d love to! Where is the party?

    Selin: At my house. It starts at 4 p.m.


    Which of the following completes the dialogue?

    A) Why don''t you like parties?

    B) Did you enjoy the party last week?

    C) Would you like to come to my birthday party on Saturday?

    D) Can you help me with my homework?'
  ikinci: '✅ Cevap: C) Would you like to come to my birthday party on Saturday?

    ''I''d love to!'' bir davete verilen kabuldür ve Bora partinin yerini soruyor. ''Did you enjoy the party last week?'' de partiden söz ediyor ama geçmişi soruyor; ''I''d love to'' ile cevaplanmaz.'
