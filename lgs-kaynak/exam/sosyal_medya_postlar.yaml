  metin: 'Selin is my best friend. She is honest and reliable; she always keeps her promises. She is also very patient. When I have a problem, she listens to me and gives me advice.


    Which of the following is NOT mentioned about Selin?

    A) She is honest.

    B) She gives advice.

    C) She keeps her promises.

    D) She is outgoing.'
  ikinci: '✅ Cevap: D) She is outgoing.

    Metinde honest, keeps her promises ve gives advice geçiyor; ''outgoing'' (dışa dönük) yok. Metinde Selin''in birçok iyi özelliği sayıldığı için outgoing de ''olabilir'' gibi gelir ama yazmıyor.'
