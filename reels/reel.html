<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:Inter,"DejaVu Sans",sans-serif;background:#FFF8EC;color:#1F2A37;position:relative}
.blob{position:absolute;border-radius:50%;filter:blur(2px)}
#b1{width:620px;height:620px;background:#8FD3C5;left:-220px;top:-160px;opacity:.55}
#b2{width:520px;height:520px;background:#F6C85F;right:-200px;top:520px;opacity:.45}
#b3{width:700px;height:700px;background:#F08A7E;left:-260px;bottom:-300px;opacity:.35}
.layer{position:absolute;inset:0}
.brand{position:absolute;top:120px;left:0;right:0;text-align:center}
.brand span{display:inline-block;background:#E05A5A;color:#fff;font-weight:800;font-size:34px;letter-spacing:2px;padding:12px 30px;border-radius:14px}
/* hook */
#hook{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 90px;text-align:center}
#hook .small{font-size:52px;font-weight:700;color:#E05A5A;margin-bottom:28px}
#hook .big{font-size:128px;line-height:1.02;font-weight:900;letter-spacing:-3px}
#hook .timer{margin-top:60px;font-size:60px;font-weight:800;background:#1F2A37;color:#FFF8EC;padding:22px 46px;border-radius:999px}
/* nova */
.nova{position:absolute;left:90px;top:1490px;display:flex;align-items:center;gap:26px;max-width:860px}
.av{width:130px;height:130px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#B8F0E4,#2F9C8A);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:66px;box-shadow:0 8px 0 #1F2A37;flex:none;border:6px solid #1F2A37}
.bubble{background:#fff;border:5px solid #1F2A37;border-radius:30px;padding:24px 32px;font-size:40px;font-weight:600;line-height:1.25;box-shadow:0 8px 0 #1F2A37}
.bubble b{color:#E05A5A}
/* word card */
.counter{position:absolute;top:230px;left:0;right:0;text-align:center;font-size:40px;font-weight:700;color:#6B7280}
.card{position:absolute;left:90px;right:90px;top:320px;background:#fff;border:6px solid #1F2A37;border-radius:44px;box-shadow:0 14px 0 #1F2A37;padding:56px 50px 50px;text-align:center}
.badge{display:inline-block;background:#F6C85F;border:4px solid #1F2A37;border-radius:999px;font-size:34px;font-weight:800;padding:8px 26px;margin-bottom:26px}
.word{font-size:150px;font-weight:900;letter-spacing:-4px;line-height:1}
.opts{position:absolute;left:90px;right:90px;top:820px;display:flex;flex-direction:column;gap:26px}
.opt{background:#fff;border:5px solid #1F2A37;border-radius:28px;font-size:54px;font-weight:700;padding:28px 40px;display:flex;align-items:center;gap:28px;box-shadow:0 8px 0 #1F2A37}
.opt i{font-style:normal;width:74px;height:74px;border-radius:50%;background:#FFF8EC;border:4px solid #1F2A37;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;flex:none}
.opt.ok{background:#3DBE8B;color:#fff}
.opt.ok i{background:#fff;color:#1F2A37}
.ring{position:absolute;right:120px;top:250px;width:150px;height:150px}
.ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:72px;font-weight:900}
.ex{position:absolute;left:90px;right:90px;top:1480px;background:#1F2A37;color:#FFF8EC;border-radius:30px;padding:30px 40px;font-size:44px;line-height:1.3;font-weight:500}
.ex u{text-decoration:none;color:#F6C85F;font-weight:800}
.ex small{display:block;color:#8FD3C5;font-size:32px;font-weight:700;margin-bottom:8px}
/* outro */
#outro{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 90px}
#outro .q{font-size:110px;font-weight:900;line-height:1.05;letter-spacing:-3px}
#outro .s{margin-top:40px;font-size:52px;font-weight:700;color:#E05A5A}
#outro .f{margin-top:80px;font-size:50px;font-weight:800;background:#1F2A37;color:#FFF8EC;padding:26px 50px;border-radius:999px}
#outro .d{margin-top:30px;font-size:40px;font-weight:600;color:#4B5563}
</style></head>
<body>
<div class="blob" id="b1"></div><div class="blob" id="b2"></div><div class="blob" id="b3"></div>
<div class="brand" id="brand"><span>LGS İNGİLİZCE</span></div>

<div class="layer" id="hook">
  <div class="small" id="h1">8. sınıf · Ünite 1 Friendship</div>
  <div class="big" id="h2">Sınavlarda çıkmış 3 kelime</div>
  <div class="timer" id="h3">3 saniyede bil!</div>
</div>

<div class="layer" id="q"></div>

<div class="layer" id="outro">
  <div class="q" id="o1">Kaç tanesini bildin?</div>
  <div class="s" id="o2">Yorumlara yaz: 0, 1, 2 ya da 3</div>
  <div class="f" id="o3">Takip et · @lgsingilizce</div>
  <div class="d" id="o4">Her gün LGS kelimesi + çözümlü soru</div>
</div>

<div class="nova" id="nova"><div class="av">N</div><div class="bubble" id="nb"></div></div>

<script>
const DATA = __DATA__;
const HOOK=2.6, PER=6.6, OUT=3.4;
const TOTAL = HOOK + PER*DATA.length + OUT;
window.TOTAL = TOTAL;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const back=x=>{x=clamp(x);const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const prog=(t,a,d)=>clamp((t-a)/d);
function pop(el,t,a,d=.35,dy=60){const p=prog(t,a,d);el.style.opacity=ease(p);el.style.transform=`translateY(${(1-back(p))*dy}px) scale(${.9+.1*back(p)})`;}
function hide(el){el.style.opacity=0}
const $=id=>document.getElementById(id);

// build question layers
const qRoot=$('q');
DATA.forEach((w,k)=>{
  const L=document.createElement('div');L.className='layer';L.id='w'+k;
  L.innerHTML=`<div class="counter">${k+1} / ${DATA.length}</div>
  <div class="card"><div class="badge">${w.badge}</div><div class="word">${w.word}</div></div>
  <svg class="ring" viewBox="0 0 150 150"><circle cx="75" cy="75" r="62" fill="#fff" stroke="#1F2A37" stroke-width="8"/>
  <circle class="arc" cx="75" cy="75" r="62" fill="none" stroke="#E05A5A" stroke-width="14" stroke-linecap="round" transform="rotate(-90 75 75)" stroke-dasharray="389.6" stroke-dashoffset="0"/></svg>
  <div class="ring"><div class="num">3</div></div>
  <div class="opts">${w.opts.map((o,i)=>`<div class="opt"><i>${'ABCD'[i]}</i>${o}</div>`).join('')}</div>
  <div class="ex"><small>Hikâyeden</small>${w.ex}</div>`;
  qRoot.appendChild(L);
});

window.seek=function(t){
  // hook
  const hk=$('hook');
  if(t<HOOK+.3){hk.style.opacity=1-prog(t,HOOK-.2,.4);pop($('h1'),t,.05);pop($('h2'),t,.25,.45,90);pop($('h3'),t,.75);} else hk.style.opacity=0;
  // nova bubble text by phase
  let nb='', novaOn=false;
  if(t<HOOK){nb='Hazır mısın? Süre <b>3 saniye</b>!';novaOn=true}
  DATA.forEach((w,k)=>{
    const a=HOOK+k*PER, L=$('w'+k), lt=t-a;
    if(lt<0||lt>PER){L.style.opacity=0;return}
    L.style.opacity = 1-prog(lt,PER-.25,.25);
    pop(L.querySelector('.counter'),lt,0,.3,20);
    pop(L.querySelector('.card'),lt,0,.4,80);
    const opts=[...L.querySelectorAll('.opt')];
    opts.forEach((o,i)=>{pop(o,lt,.45+i*.12,.35,50)});
    // countdown 1.2 .. 4.2
    const cd=prog(lt,1.2,3);
    const ringEls=L.querySelectorAll('.ring');
    ringEls.forEach(r=>{r.style.opacity = lt<1.1?0: (lt<4.3?1:1-prog(lt,4.3,.3))});
    L.querySelector('.arc').setAttribute('stroke-dashoffset',389.6*cd);
    const n = lt<1.2?3: Math.max(1,3-Math.floor((lt-1.2)));
    const numEl=L.querySelector('.num');numEl.textContent=n;
    const frac=((lt-1.2)%1+1)%1; numEl.style.transform=`scale(${lt>1.2&&lt<4.2?1+.25*(1-ease(frac/.3)):1})`;
    // reveal at 4.2 ; correct is index w.ans
    const rv=prog(lt,4.2,.25);
    opts.forEach((o,i)=>{
      if(i===w.ans){o.classList.toggle('ok',lt>=4.2);if(lt>=4.2)o.style.transform=`scale(${1+.06*Math.sin(Math.PI*clamp((lt-4.2)/.4))})`;}
      else if(lt>=4.2)o.style.opacity=1-.65*rv;
    });
    const ex=L.querySelector('.ex');
    if(lt>=4.6) pop(ex,lt,4.6,.4,60); else hide(ex);
    if(lt<4.55){novaOn=lt>.6;nb=w.nova}else novaOn=false;
  });
  // outro
  const oa=TOTAL-OUT, ot=t-oa, out=$('outro');
  if(ot>=0){out.style.opacity=1;pop($('o1'),ot,0,.45,90);pop($('o2'),ot,.35);pop($('o3'),ot,.7);pop($('o4'),ot,.9);novaOn=ot>1.1;nb='Bilemediğini <b>kaydet</b>, yarın tekrar bak!'} else out.style.opacity=0;
  const nv=$('nova');$('nb').innerHTML=nb;
  nv.style.opacity=novaOn?1:0;
  nv.style.top = (ot>=0?1500:1490)+'px';
};
seek(0);
</script>
</body></html>
