  - "İyi uyku da çalışmanın parçası. Bu akşam erken yatmaya ne dersin?"
retention_invite:
  day08: "3 gün oldu! 4 dakikalık mini kontrol: Ece'nin partisinden aklında ne kaldı?"
  day15: "Son kontrol! 10 soru, 4 dakika. Ne kadar kalıcı öğrendiğini birlikte görelim."
