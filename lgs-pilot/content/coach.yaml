# Koç mesaj havuzu — günlük dosyalardaki coach/notifications dışında kalan genel durumlar.
# Değişkenler: {name} {streak} {days_left} {learned} {weak} {unit}
# Kurallar: utandıran/korkutan dil yok · seri kaybı baskı aracı değil · ≤ 140 karakter (bildirimler ≤ 90)
schema_version: 1
program: lgs
coach_name: "Hoca Nova"
placement_result:
  baslangic: "Hoş geldin {name}! Sakin sakin, her gün biraz ilerleyeceğiz. Kısa dersler, bol tekrar."
  orta: "Güzel bir başlangıç! Temelin var; şimdi LGS'ye özel kelimeleri ekleyeceğiz."
  ileri: "Vay! Kelimelerin çok iyi. Senin için tempoyu artırıyorum, bol LGS sorusu geliyor."
streak:
  - {at: 3, text: "3 gün üst üste! Alışkanlık böyle başlar 🔥"}
  - {at: 5, text: "5 gün! Friendship ünitesinin pilotu bitti, sen de bitirdin."}
  - {at: 7, text: "Bir haftalık seri! Bu tempoyla sınava çok rahat yetişirsin."}
missed_day:
  - "Dün olmadı, sorun değil. Bugün 3 dakikalık kısa bir tekrarla başlayalım."
