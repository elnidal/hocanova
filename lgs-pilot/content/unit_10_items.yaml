status: taslak, kullanıcı onayı bekliyor
note: 'taslak, kullanıcı onayı bekliyor; hikâye/gün dosyası yazılmayacak (yalnız kelime havuzu), pilot_day yok. meaning_ban: çeviri yasağında meaning_tr yerine bu kökler aranır. exam alanı boş: ingilizcedilbilgisi.net
  10. ünite kelime listesi ve "sınavlarda çıkmış 10. ünite kelimeleri" tablosu erişilemedi (WebFetch hata verdi, başka sitede tablo bulunamadı); tablo yapıştırılırsa doldurulur. Son ünite.'
items:
- id: U10-001
  unit: 10
  theme: Doğal afetler
  display: natural disaster / disaster (natural forces / natural phenomena)
  kind: phrase
  class: core
  meaning_tr: doğal afet / afet, felaket (doğal güçler / doğa olayları)
  priority: 1
  variants:
  - disaster
  - natural disaster
  - natural forces
  - natural phenomena
  - phenomenon
  trap_note: 'phenomenon tekil, phenomena çoğul (Türkçe "fenomen" ile karıştırma); A natural forces için "doğal afetler" demiş: forces = güçler, afet = disaster'
  meaning_ban:
  - afet
  - felaket
  - doğa olay
  - doğal güç
