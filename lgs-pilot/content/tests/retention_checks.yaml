# Kalıcılık kontrolleri — pilot bittikten sonra Gün 8 ve Gün 15'te, ~4 dakika.
# Sorular ders içindekilerle AYNI DEĞİL; yeni bağlam, LGS biçimi. Sonuç: birim başına doğru/yanlış → "biliyor / kararsız / yeni".
schema_version: 1
program: lgs
test: retention
unit: 1
sections:
  - id: day08
    title: "Gün 8 kontrolü"
    questions:
      - {id: rt8-01, type: dialogue_complete, item: U1-026, lgs_like: true, prompt: "<en>Which one completes the dialogue?</en>", stem: "<en>Selin: ________\nElif: I'd love to! Should I bring my skates?</en>", options: ["Would you like to go skating with us on Sunday?", "Did you go skating last week?", "Where did you buy your skates?", "Is skating difficult?"], answer: 0, explain: "Cevapta Elif \"I'd love to!\" ve \"Should I bring my skates?\" diyor; yani bir davet almış. Davet cümlesi: Would you like to go skating with us?"}
      - {id: rt8-02, type: message_infer, item: U1-021, lgs_like: true, prompt: "<en>What is Duru doing?</en>", stem: "<en>Duru: Thanks for asking, but I can't come. I have to finish my project.</en>", options: ["refusing an invitation", "accepting an invitation", "apologising for a mistake", "inviting a friend"], answer: 0, explain: "Duru \"I can't come\" diyerek reddediyor ve sebebini (projesi) söylüyor: refusing an invitation."}
      - {id: rt8-03, type: situation, item: U1-007, lgs_like: true, prompt: "<en>Which one is an excuse?</en>", stem: "<en>Teacher: Why didn't you bring your homework?</en>", options: ["\"My little brother tore it.\"", "\"Here it is.\"", "\"I love homework.\"", "\"Good morning!\""], answer: 0, explain: "Öğretmen ödevi neden getirmediğini soruyor; \"Küçük kardeşim yırttı\" bir bahanedir (excuse)."}
      - {id: rt8-04, type: synonym, item: U1-051, lgs_like: true, prompt: "<en>\"I can count on my parents.\" Which one has the CLOSEST meaning?</en>", options: ["I can depend on my parents.", "I can count my parents.", "I can visit my parents.", "I can call my parents."], answer: 0, explain: "count on = depend on (güvenmek, dayanmak). count my parents ise ebeveynleri saymak olur."}
      - {id: rt8-05, type: trait_match, item: U1-059, lgs_like: true, prompt: "<en>Which word describes Selin best?</en>", stem: "<en>When Selin says \"I'll do it\", she does it. You never have to remind her.</en>", options: ["reliable", "mean", "laid-back", "outgoing"], answer: 0, explain: "\"I'll do it\" dediğinde yapan ve hatırlatmaya gerek bırakmayan kişi güvenilirdir: reliable."}
      - {id: rt8-06, type: message_infer, item: U1-077, lgs_like: true, prompt: "<en>What can we say about the writer?</en>", stem: "<en>\"I broke the window, Mum. I'm sorry. I won't lie to you.\"</en>", options: ["He is honest.", "He is mean.", "He is outgoing.", "He is full."], answer: 0, explain: "Camı kırdığını söylüyor ve yalan söylemeyeceğini belirtiyor: dürüst (honest)."}
      - {id: rt8-07, type: gap_fill, item: U1-055, lgs_like: true, prompt: "<en>Which one completes the sentence?</en>", stem: "<en>Selin is a great friend. I tell her everything because she can ________.</en>", options: ["keep a secret", "break a promise", "refuse an invitation", "make excuses"], answer: 0, explain: "Her şeyi anlattığım iyi bir arkadaş sır tutar: keep a secret."}
      - {id: rt8-08, type: synonym, item: U1-049, lgs_like: true, prompt: "<en>\"Duru backed Bora up.\" Which one has the CLOSEST meaning?</en>", options: ["Duru supported Bora.", "Duru laughed at Bora.", "Duru forgot Bora.", "Duru invited Bora."], answer: 0, explain: "back up = desteklemek. Duru backed Bora up = Duru Bora'yı destekledi."}
      - {id: rt8-09, type: odd_one_out, item: U1-083, lgs_like: true, prompt: "<en>In which sentence does \"mean\" mean \"kaba / cimri\"?</en>", options: ["He was mean to his little sister.", "What does \"loyal\" mean?", "I didn't mean to hurt you.", "These clouds mean rain."], answer: 0, explain: "Bu soruda mean = kaba, cimri. \"He was mean to his little sister\" cümlesi bu anlamı taşır; diğerlerinde mean = anlamına gelmek / niyet etmek."}
      - {id: rt8-10, type: dialogue_complete, item: U1-097, lgs_like: true, prompt: "<en>Which one completes the dialogue?</en>", stem: "<en>Grandma: Have some more soup, dear!\nElif: ________</en>", options: ["Thank you, but I'm full.", "Yes, I'm stuffed, more please.", "Sorry, I'm late.", "I'd love to refuse."], answer: 0, explain: "Büyükannenin ikramına \"Thank you, but I'm full.\" diye nazikçe hayır denir."}
  - id: day15
    title: "Gün 15 kontrolü"
    questions:
      - {id: rt15-01, type: message_infer, item: U1-012, lgs_like: true, prompt: "<en>According to the invitation, which of the following is TRUE?</en>", stem: "<en>You're invited!\nKaan's Pizza Night\nFriday, 7 p.m. · Kaan's house\nBring your favourite game!</en>", options: ["Guests should bring a game.", "The party is on Saturday.", "The party is at a restaurant.", "Kaan is going to cook fish."], answer: 0, explain: "Davetiyede \"Bring your favourite game!\" yazıyor; konuklar oyun getirmeli. Gün Cuma (Friday), yer Kaan'ın evi."}
      - {id: rt15-02, type: dialogue_complete, item: U1-022, lgs_like: true, prompt: "<en>Which one completes the dialogue?</en>", stem: "<en>Selin: How about a bike ride on Sunday?\nBora: ________ I'll fix my bike today.</en>", options: ["Sounds great!", "Sorry, I can't.", "I'm afraid not.", "No, thanks."], answer: 0, explain: "Bisiklet önerisini kabul edip \"I'll fix my bike today\" diyor: Sounds great!"}
      - {id: rt15-03, type: situation, item: U1-002, lgs_like: true, prompt: "<en>Which sentence is an apology?</en>", options: ["\"I'm really sorry for being late.\"", "\"Would you like some tea?\"", "\"You can count on me.\"", "\"That's not fair!\""], answer: 0, explain: "Özür cümlesi \"I'm really sorry for being late.\" (sorry = özür dilemek)."}
      - {id: rt15-04, type: trait_match, item: U1-081, lgs_like: true, prompt: "<en>Which word describes Ali?</en>", stem: "<en>Ali has had the same best friend since he was five. He always stays with his friend, even in bad times.</en>", options: ["loyal", "mean", "unreliable", "selfish"], answer: 0, explain: "Beş yaşından beri aynı arkadaşı ve kötü zamanda bile yanında: sadık (loyal)."}
      - {id: rt15-05, type: gap_fill, item: U1-067, lgs_like: true, prompt: "<en>Which one completes the sentence?</en>", stem: "<en>Mert broke my new toy and said, \"It wasn't me!\" Now I can't ________ him.</en>", options: ["trust", "invite", "thank", "accept"], answer: 0, explain: "Oyuncağı kırıp \"ben değildim\" diyen birine artık güvenemezsin: trust."}
      - {id: rt15-06, type: message_infer, item: U1-054, lgs_like: true, prompt: "<en>Which of the following is TRUE about Bora?</en>", stem: "<en>Bora promised to feed my cat while I was on holiday. When I came back, my cat was happy and healthy.</en>", options: ["He kept his promise.", "He broke his promise.", "He refused to help.", "He made an excuse."], answer: 0, explain: "Kediye bakma sözünü tuttu; kedi sağlıklı ve mutlu: He kept his promise."}
      - {id: rt15-07, type: trait_match, item: U1-070, lgs_like: true, prompt: "<en>Which word describes Ece?</en>", stem: "<en>When her friend was sick, Ece visited her, brought her soup and read books to her.</en>", options: ["caring", "mean", "unfair", "laid-back"], answer: 0, explain: "Hasta arkadaşını ziyaret eden, çorba getiren ve kitap okuyan Ece ilgili ve şefkatlidir: caring."}
      - {id: rt15-08, type: trait_match, item: U1-084, lgs_like: true, prompt: "<en>Which word does NOT describe Kaan?</en>", stem: "<en>Kaan loves parties. He talks to everyone and makes new friends easily.</en>", options: ["shy", "outgoing", "friendly", "sociable"], answer: 0, explain: "Soru Kaan'ı anlatmayan kelimeyi soruyor. Kaan partileri seviyor ve kolay arkadaş ediniyor; shy (utangaç) bunun tersidir."}
      - {id: rt15-09, type: odd_one_out, item: U1-071, lgs_like: true, prompt: "<en>In which sentence does \"fair\" mean \"adil\"?</en>", options: ["Our coach is fair to all players.", "We visited the science fair.", "There is a book fair in the city.", "The fair opens at 10 a.m."], answer: 0, explain: "fair = adil olan cümle: \"Our coach is fair to all players.\" Diğerlerinde fair = fuar."}
      - {id: rt15-10, type: trait_match, item: U1-079, lgs_like: true, prompt: "<en>Which word describes Duru best?</en>", stem: "<en>Duru's bus is late again, but she just smiles and listens to music. Nothing makes her nervous.</en>", options: ["laid-back", "bad-tempered", "jealous", "mean"], answer: 0, explain: "Otobüs yine geç ama Duru gülümseyip müzik dinliyor: rahat (laid-back)."}
