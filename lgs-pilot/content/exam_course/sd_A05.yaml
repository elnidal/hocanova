      Bora was a bit unreliable in the past. He often broke his promises and came late to band practice. But this year he is different. He comes to every practice on time and he always keeps his promises. Now his friends can really count on him.
    prompt: "What is the text mainly about?"
    options:
      - "How Bora has changed"
      - "Bora's drum lessons"
      - "Why band practice is important"
      - "Bora's new friends"
    answer: 0
    explain_tr: "Metin Bora'nın eskiden nasıl olduğunu ve şimdi nasıl değiştiğini anlatıyor ('But this year he is different'). Prova metinde geçiyor ama provanın önemi anlatılmıyor."
    items: [U1-068, U1-050, U1-054, U1-051]
tips:
  - "Önce şıkları oku, sonra metni: her cümlede 'bu hangi şıkkın altına girer?' diye düşün."
  - "Metinde bir kez geçen ayrıntıyı başlık yapan şıkka dikkat: en çekici yanlış odur."
  - "'But …' ile başlayan cümle çoğu zaman metnin asıl konusunu gösterir."
coach:
  start: "Bugün metne kuş bakışı bakıyoruz! Ayrıntılarda boğulmadan tüm metni kapsayan şemsiyeyi bulacağız."
  end: "Süper! Dar, geniş, konu dışı: üç tuzağı da tanıyorsun. Başlık soruları artık senin bölgen!"
