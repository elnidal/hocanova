# LGS Sınav Dili — A05 Başlık ve ana fikir (S05). Doğru cevap her zaman options[0]; uygulama karıştırır.
schema_version: 1
id: SD-A05
module: A
title: "Başlık ve ana fikir"
unlock_after: "Ü2 G15"
minutes: 5
stems: [S05]
units: [1, 2]
intro_tr: "'What is the best title?' ve 'What is the text mainly about?' sorularında metnin her kelimesini anlaman gerekmez. Metnin TAMAMINI kapsayan şıkkı bulmayı öğrenirsen bu soru hızlı bir puandır."
cards:
  - title_tr: "Başlık bir şemsiyedir"
    body_tr: "İyi başlık metindeki bütün cümleleri altına alır. Her şıkkı sor: 'Metindeki cümlelerin hepsi bu başlığın altına sığıyor mu?' Sığmayan cümle varsa şık dar kalmıştır."
    examples_en:
      - "What is the best title for the text?"
      - "What is the text mainly about?"
      - "What is the main idea of the text?"
    signal_words: ["title", "mainly about", "main idea"]
  - title_tr: "Üç yanlış şık türü"
    body_tr: "ÇOK DAR: metindeki tek bir ayrıntıyı başlık yapar (en çekici çeldirici budur). ÇOK GENİŞ: metnin konusunu aşar (Teenagers Around the World). KONU DIŞI: metinde hiç geçmeyen bir konu."
    examples_en:
      - "Text about Kaan's sports  → 'Kaan's Sporty Life' ✓"
      - "'Kaan's Favourite Swimming Pool'  → çok dar ✗"
      - "'Sports Around the World'  → çok geniş ✗"
  - title_tr: "İpuçları: ilk cümle, son cümle, tekrar"
    body_tr: "Konu çoğunlukla ilk cümlede verilir, son cümlede özetlenir. Metinde en çok tekrar eden kelime (music, sport, fashion) da konuyu ele verir."
    signal_words: ["first sentence", "last sentence", "repeated words"]
worked_example:
  id: sd-A05-w
  type: text_infer
  stem_id: S05
  context: |-
    Many teenagers want to keep up with the latest fashion. They buy trendy clothes and share photos of their outfits on social media. But some teens don't care about fashion; they prefer comfortable, casual clothes. In my opinion, everyone should wear what they like.
  prompt: "What is the best title for the text?"
  options:
    - "Teens and Fashion"
    - "How to Take a Good Selfie"
    - "Smart Clothes for School"
    - "The Most Expensive Clothes in the World"
  answer: 0
  explain_tr: "Metin baştan sona gençlerin modaya bakışını anlatıyor. Sosyal medyadan söz edilmesi selfie şıkkını çekici yapıyor ama bu yalnız bir ayrıntı; okul kıyafeti ve pahalı kıyafetler hiç geçmiyor."
  items: [U2-063, U2-062, U2-066, U2-068, U2-064, U2-005]
practice:
