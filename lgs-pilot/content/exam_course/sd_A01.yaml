    answer: 0
    explain_tr: "'Why not?' bir öneriyi kabul eder; top ve park da basketbol önerisine uyar. 'Can you lend me your pen?' de 'Why not?' ile cevaplanabilir ama top ve parkla ilgisi yok."
    items: [U1-008, U1-025]
tips:
  - "Boşluktan SONRAKİ satırı ilk önce oku: cevabın yarısı oradadır."
  - "Şıkları boşluğa tek tek yerleştirip diyaloğu baştan sona sessizce oku; akmayan şıkkı ele."
  - "Konuyla ilgili olmak yetmez: doğru şık konuşmanın İŞLEVİNE (davet, kabul, ret, soru) uymalı."
coach:
