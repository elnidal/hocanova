tips:
  - "Boşluktan SONRAKİ satıra bak: 'What time?', 'Where?' ya da 'I'll bring …' geliyorsa boşlukta kabul vardır."
  - "Would you like some …? = teklif (cevap: Yes, please / No, thanks), Would you like to …? = davet (cevap: I'd love to / Sorry, I can't)."
  - "'I'd love to' tek başına kabul, 'I'd love to, but …' ise rettir; cümlenin sonuna kadar oku."
coach:
  start: "Davet geldi! Bugün kabul etmenin en tatlı yollarını öğreniyoruz. Fıstık bile 'Why not?' diyor."
  end: "Süper! Artık bir davete 'That would be great!' demeyi biliyorsun. Bir sonraki partide görüşürüz."
