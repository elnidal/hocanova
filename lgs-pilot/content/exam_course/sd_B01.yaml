schema_version: 1
id: SD-B01
module: B
title: "Davet etme ve kabul"
unlock_after: "Ü1 sonu"
minutes: 5
stems: [S01, S08, S09, S10]
functions: ["Davet etme ve öneride bulunma", "Daveti / teklifi kabul etme"]
units: [1]
intro_tr: "LGS'de en sık gelen diyalog konusu davettir. Davet cümlesini ve kabul cevabını bir bakışta tanırsan diyalog sorularının yarısı kendiliğinden çözülür."
cards:
  - title_tr: "Davet kalıpları"
    body_tr: "Davet çoğunlukla soru biçimindedir. Would you like to / Do you want to + fiil; How about / What about + -ing ya da isim; Let's + fiil. Dikkat: Would you like SOME juice? (isim) bir teklif, Would you like TO come? (fiil) bir davettir."
    examples_en:
      - "Would you like to come over tomorrow?"
      - "Do you want to join us at the cinema?"
      - "How about going to the park after school?"
      - "What about a film night on Friday?"
    signal_words: ["Would you like to …?", "Do you want to …?", "How about …?", "What about …?", "Let's …"]
  - title_tr: "Kabul kalıpları"
    body_tr: "Kabul cevabı kısa ve olumlu bir sözle başlar (Sure, Yeah, Of course), ardından çoğunlukla bir plan ya da soru gelir (What time? I'll bring the cake.). Sounds + sıfat kalıbında sıfat hep olumludur."
    examples_en:
      - "Sure, that sounds fun!"
      - "I'd love to. What time?"
      - "That would be great!"
      - "Yeah, why not?"
      - "Thanks for the invitation. I'll be there."
    signal_words: ["Sure", "I'd love to.", "Sounds great / fun!", "That would be great.", "Why not?"]
  - title_tr: "İki küçük tuzak"
    body_tr: "'What about you?' öneri değildir; aynı soruyu karşı tarafa geri sorar. 'I'd love to, but …' ise kabul değil, kibar bir RETtir: 'but' kelimesini görünce dur."
    examples_en:
      - "I'm free on Saturday. What about you?"
      - "I'd love to, but I'm busy."
