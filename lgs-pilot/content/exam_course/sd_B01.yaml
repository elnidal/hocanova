  type: dialogue_complete
  stem_id: S01
  context: "Selin: Are you free on Saturday afternoon?\nDuru: Yes, I have nothing to do. Why?\nSelin: ________\nDuru: That would be great! Can I bring Fıstık?"
  prompt: "Which of the following completes the dialogue?"
  options:
    - "Would you like to come over and watch a film?"
    - "Sorry, I can't come to your house."
    - "What about you? Are you busy?"
    - "Thanks for the invitation."
  answer: 0
  explain_tr: "Duru 'That would be great!' diyerek bir daveti kabul ediyor, demek ki boşlukta davet var. 'What about you? Are you busy?' çekici ama Duru zaten boş olduğunu söyledi ve 'That would be great' bir soruya verilecek cevap değil."
  items: [U1-026, U1-005, U1-009, U1-023]
