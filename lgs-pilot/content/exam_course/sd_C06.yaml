    stem_id: S10
    context: "During an earthquake drill at school, a student starts running towards the window."
    prompt: "What should the teacher say?"
    options:
      - "Stay away from the windows! Drop, cover and hold on!"
      - "Open the windows and look outside!"
      - "Run to the lift quickly!"
      - "Stand next to the bookshelf!"
    answer: 0
    explain_tr: "Deprem tatbikatında pencerelerden uzak durulur ve 'çök, kapan, tutun' uygulanır. Diğer üç şık depremde tehlikeli davranışlar."
    items: [U10-019]
  - id: sd-C06-p08
    type: dialogue_complete
    stem_id: S01
    context: |-
      Murat Bey: What do you think will happen if we don't save water?
      Elif: ________
      Murat Bey: Exactly. That's why we should turn off the tap when we brush our teeth.
    prompt: "Which of the following completes the dialogue?"
    options:
      - "I think there will be a water shortage in the future."
      - "I saved a lot of water yesterday."
      - "There was a big flood in our town last year."
      - "I don't agree with you."
    answer: 0
    explain_tr: "Soru gelecekle ilgili bir tahmin istiyor (What … will happen if …?); cevap da 'will' ile bir tahmin vermeli. 'I saved water yesterday' su tasarrufu konusunu taşıyor ama geçmişten söz ediyor, tahmin değil."
    items: [U10-039, U10-040, U10-036, U10-030, U10-041]
tips:
  - "Önce kısa soruları (diyalog, kelime) hızlıca çöz; uzun metin ve tablolara kalan süreyi ayır."
  - "Saatine her 3–4 soruda bir bak; geride kaldıysan takıldığın soruyu işaretleyip geç."
  - "don't have to ve mustn't gibi yakın anlamlı şıklarda cümleyi Türkçeye çevir: 'gerek yok' mu, 'yasak' mı?"
