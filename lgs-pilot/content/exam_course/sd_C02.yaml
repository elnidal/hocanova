      - "Why do you like social media?"
    answer: 0
    explain_tr: "Selin'in sıraladığı her şey internet güvenliği alışkanlığı. 'What is your password?' şifre kelimesiyle çekici ama Selin şifresini söylemiyor, nasıl seçtiğini anlatıyor."
    items: [U5-019, U5-009, U5-010, U5-011]
tips:
  - "Toplam kişi sayısını baştan not et: 'half' ve 'most' kararını ona göre verirsin."
  - "'the most' gördüğünde tablodaki en büyük değeri işaretle; 'all' ve 'none' gördüğünde tek bir istisna arayıp bul."
  - "Cevaptan soru bulurken cevaptaki birime bak: 'a day' süre, 'a week' sıklık olabilir; 'three hours a day' süre, 'three times a day' sıklıktır."
coach:
  start: "Anketörler hazır! Bugün sayılarla konuşuyoruz: yarısı, çoğu, hiçbiri. Hesap makinesine gerek yok, söz."
  end: "Bravo! Yüzdeler, saatler, 'the most': tablolar artık sana sır vermiyor. Anket soruları cebinde!"
