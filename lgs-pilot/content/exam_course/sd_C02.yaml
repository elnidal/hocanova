    type: dialogue_complete
    stem_id: S13
    context: |-
      Murat Bey: ________
      Elif: Mostly for listening to music and watching song videos.
    prompt: "Which of the following can be the missing question?"
    options:
      - "What do you use the Internet for?"
      - "How many hours do you spend online?"
      - "When do you usually go online?"
      - "Do you have a social media account?"
    answer: 0
    explain_tr: "Elif interneti NE İÇİN kullandığını söylüyor (for listening …). 'How many hours …?' internetle ilgili ama süre ister."
    items: [U5-047, U5-002]
  - id: sd-C02-p04
    type: table_graph
    stem_id: S06
    context: |-
      How often do they post on social media?
      Elif: every day · Kaan: once a week · Duru: twice a month · Selin: never · Bora: every day
    prompt: "According to the chart, which of the following is correct?"
    options:
      - "Elif and Bora post more often than Kaan."
      - "Selin posts once a week."
      - "Duru posts more often than Elif."
      - "All of the friends post on social media."
    answer: 0
    explain_tr: "Elif ve Bora her gün, Kaan haftada bir paylaşıyor; ikisi de daha sık. 'All of the friends post' tek kişiyle çöker: Selin hiç paylaşmıyor."
    items: [U5-034, U5-035]
  - id: sd-C02-p05
    type: dialogue_complete
    stem_id: S13
    context: |-
      Duru: ________
      Kaan: About three hours a day. I know it's too much!
    prompt: "Which of the following completes the dialogue?"
    options:
      - "How many hours do you spend online?"
      - "How often do you check your notifications?"
      - "What time do you usually go online?"
      - "Why do you use the Internet?"
    answer: 0
    explain_tr: "'Three hours a day' günlük bir süre; süreyi 'How many hours …?' sorar. 'How often …?' sıklık sorar (every day gibi), kaç saat olduğunu değil."
    items: [U5-044, U5-033]
  - id: sd-C02-p06
