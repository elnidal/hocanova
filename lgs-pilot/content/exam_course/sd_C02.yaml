    options:
      - "The band spends the most time in front of screens on Sunday."
      - "Screen time on Saturday is less than on weekdays."
      - "The band spends five hours a day online during the week."
      - "Screen time is the same every day."
    answer: 0
    explain_tr: "Pazar günü 5 saatle en yüksek değer. 'five hours a day … during the week' metindeki '5' sayısını yanlış günle eşliyor: hafta içi 2 saat."
