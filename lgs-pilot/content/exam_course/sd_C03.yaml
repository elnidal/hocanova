# LGS Sınav Dili — C03 Metin atölyesi: NOT / TRUE / başlık (S02–S05, S14). Doğru cevap her zaman options[0]; uygulama karıştırır.
schema_version: 1
id: SD-C03
module: C
title: "Metin atölyesi: NOT / TRUE / başlık"
unlock_after: "Ü6 sonu"
minutes: 8
stems: [S02, S03, S04, S05, S14]
units: [1, 2, 6]
intro_tr: "LGS'de aynı metne bazen birden çok soru bağlanır: biri 'hangisi yok?', biri 'hangisi doğru?', biri 'en iyi başlık?'. Bu atölyede macera metinleri üzerinde metin köklerini karışık çalışıyoruz."
cards:
  - title_tr: "Kök hangi okuma türünü istiyor?"
    body_tr: "NOT / NOT mentioned → ele yöntemi: bulduğunu işaretle, kalan cevap. TRUE → doğru şık başka kelimelerle söyler. Başlık → metnin tamamı. Çıkarım → metinde bir dayanak cümlesi olmalı. Kökü metinden önce oku ki metni doğru gözle okuyasın."
    signal_words: ["NOT", "TRUE", "title", "mainly about", "infer"]
  - title_tr: "Karşılaştırma ve tercih cümlelerine dikkat"
    body_tr: "Macera metinlerinde çok sık karşılaştırma ve tercih cümlesi olur. Kimin neyi neye tercih ettiğini ters çeviren şıklar en çekici tuzaktır."
    examples_en:
      - "I'd rather go caving than skydiving.  → caving > skydiving"
      - "She prefers canoeing to rafting.  → canoeing > rafting"
      - "Rafting is more exciting than any other sport."
    signal_words: ["would rather … than", "prefer … to", "more … than", "the most"]
  - title_tr: "Olumsuz yapıyı kaçırma"
    body_tr: "'I'm not very brave', 'He wasn't scared', 'Neither!' gibi olumsuz ifadeler anlamı tamamen değiştirir. Şıkta metindeki kelime (brave, scared) olumlu kullanılmışsa iki kez kontrol et."
    examples_en:
      - "Text: I'm not very brave.  Option: Bora is very brave. ✗"
    signal_words: ["not", "never", "neither", "wasn't"]
worked_example:
  id: sd-C03-w
  type: text_infer
  stem_id: S04
  context: |-
    Elif: I'd rather go caving than skydiving. Caves are mysterious and exciting, and I'm scared of heights!
  prompt: "According to the text, which of the following is TRUE?"
  options:
    - "Elif prefers caving to skydiving."
    - "Elif would rather go skydiving."
    - "Elif thinks skydiving is mysterious."
    - "Elif loves high places."
  answer: 0
  explain_tr: "'I'd rather go caving than skydiving' = mağarayı paraşüte tercih ediyor; doğru şık bunu 'prefer … to' ile söylüyor. 'mysterious' metinde var ama mağaralar için, paraşüt için değil."
  items: [U6-036, U6-035, U6-004, U6-006, U6-029]
