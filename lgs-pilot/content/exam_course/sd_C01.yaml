tips:
  - "Kökü okuyunca yöntemi seç: boşluk → alt satır, Who → + / − listesi, durum → Türkçe özet."
  - "Telefon diyaloglarında önce rolleri belirle: arayan, açan, aranan."
  - "'but'tan sonra gelen her zaman ret demek değildir; 'I have to leave at 5.30' gibi bir koşul da olabilir. Cümleyi sonuna kadar oku."
coach:
  start: "Atölye zamanı! Bugün diyalogları karışık çözeceğiz. Kulaklıkları tak, Wrong Number seni arıyor."
  end: "Harika! Telefonda kimin kim olduğunu, kimin geldiğini, ne denmesi gerektiğini biliyorsun. Diyalog ustası!"
