# LGS Sınav Dili — C01 Diyalog atölyesi (S01, S08, S10). Doğru cevap her zaman options[0]; uygulama karıştırır.
schema_version: 1
id: SD-C01
module: C
title: "Diyalog atölyesi"
unlock_after: "Ü4 sonu"
minutes: 7
stems: [S01, S08, S10]
units: [1, 2, 3, 4]
intro_tr: "Dört ünite bitti; LGS'deki diyalog soruları artık senin alanın. Bu atölyede üç diyalog kökünü karışık çözüyoruz: boşluğu tamamla, doğru kişiyi bul, duruma uygun cümleyi seç."
cards:
  - title_tr: "Diyalogda üç soru, üç yöntem"
    body_tr: "Boşluk tamamlama (S01): sonraki satırı oku. Kişi bulma (S08): her kişiye + / − koy. Durum (S10): durumu Türkçe özetle, sonra kalıbı seç. Kökü okuyunca hangi yöntemi kullanacağına karar ver."
    examples_en:
      - "Which of the following completes the dialogue?  → sonraki satır"
      - "Who …?  → + / − listesi"
      - "What does X say in this situation?  → Türkçe özet"
  - title_tr: "Telefonda kim kim?"
    body_tr: "Telefon diyaloglarında üç rol var: ARAYAN (May I speak to …? / This is … calling), TELEFONU AÇAN (Hello? / Who's calling? / Hold on, I'll get her) ve ARANAN (Speaking.). Bir cümleyi kimin söyleyebileceğini bu rollere göre düşün."
    examples_en:
      - "Arayan: Could I speak to Selin, please?"
      - "Açan: Who's calling, please? / I'm afraid she's out."
      - "Aranan: Speaking."
    signal_words: ["calling", "speak to", "Who's calling?", "Speaking.", "Hold on"]
  - title_tr: "Kibar ret yine rettir"
    body_tr: "'I'd love to, but …', 'Thanks for asking, but …', 'I'm afraid I can't' kibar ama RET. Telefonda 'I'm afraid he isn't available' de 'şu an konuşamaz' demektir."
    signal_words: ["but", "I'm afraid", "not available"]
worked_example:
  id: sd-C01-w
  type: dialogue_complete
  stem_id: S01
  context: |-
    Secretary: Good morning, Star Music School. How can I help you?
    Ece: Hello. Could I speak to Mr Aydın, please?
    Secretary: ________ He's in a lesson at the moment.
    Ece: OK. Can I leave a message?
  prompt: "Which of the following completes the conversation?"
  options:
    - "I'm afraid he isn't available."
    - "Hold on, I'll put you through."
    - "Speaking."
    - "Sorry, you have the wrong number."
  answer: 0
  explain_tr: "Sekreter 'He's in a lesson' diyor ve Ece mesaj bırakmak istiyor; Bay Aydın telefona gelemez. 'I'll put you through' bağlayacağını söyler, sonraki satırlarla çelişir."
  items: [U4-020, U4-026, U4-023, U4-014, U4-009, U4-042]
practice:
