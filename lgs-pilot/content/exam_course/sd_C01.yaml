    answer: 0
    explain_tr: "Bora adını ve kim olduğunu söylüyor; demek ki 'Kim arıyor?' diye sorulmuş. 'Where are you calling from?' de bir soru ama cevabı bir yer olmalı."
    items: [U4-026, U4-031]
  - id: sd-C01-p02
    type: text_infer
    stem_id: S08
    context: |-
      Ece: We're having a meeting about the concert on Thursday at 5. Can everyone come?
      Kaan: I'm afraid I can't. I have basketball training.
      Elif: Sure! I'll bring my lyrics.
      Bora: Sounds good, but I have to leave at 5.30.
      Duru: I'd love to, but I'm taking Fıstık to the vet.
      Selin: No problem. I'll be there on time.
    prompt: "Who will NOT come to the meeting?"
    options:
      - "Kaan and Duru"
      - "Kaan, Bora and Duru"
      - "Elif and Selin"
      - "Only Kaan"
    answer: 0
    explain_tr: "Kaan (I'm afraid I can't) ve Duru (I'd love to, but …) gelmiyor. Bora'daki 'but' tuzak: geliyor, yalnız erken ayrılacak."
    items: [U4-023]
  - id: sd-C01-p03
    type: situation
    stem_id: S10
    context: "Selin is talking to Elif on the phone, but the line is bad. She can't understand what Elif is saying."
    prompt: "What does Selin say?"
    options:
