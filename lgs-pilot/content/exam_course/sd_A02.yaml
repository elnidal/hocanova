tips:
  - "Her kişinin yanına + ya da − koy; sonra şıkları bu listeyle karşılaştır."
  - "'but' kelimesini gördüğün an dur: öncesi ne kadar olumlu olursa olsun, cevap çoğunlukla RET'tir."
  - "Kökte NOT varsa (Who will NOT join?) daire içine al; aradığın − işaretliler."
