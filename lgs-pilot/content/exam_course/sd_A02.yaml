# LGS Sınav Dili — A02 Kim katılıyor, kim reddediyor? (S08, S09). Doğru cevap her zaman options[0]; uygulama karıştırır.
schema_version: 1
id: SD-A02
module: A
title: "Kim katılıyor, kim reddediyor?"
unlock_after: "Ü1 G8"
minutes: 5
stems: [S08, S09]
units: [1]
intro_tr: "LGS'de birkaç kişinin davete verdiği cevaplar verilir ve 'Kim geliyor?' ya da 'Hangisi bir ret?' diye sorulur. Kabul ve ret sinyallerini tanıyan, bu soruyu saniyeler içinde çözer."
cards:
  - title_tr: "Kabul sinyalleri"
    body_tr: "Bu kalıplardan biri varsa kişi davete EVET diyor. Ardından genellikle bir soru (What time?) ya da bir teklif (I'll bring …) gelir."
    examples_en:
      - "Sure, I'd love to!"
      - "Why not? I'll bring the drinks."
      - "That would be great!"
      - "Sounds fun! What time?"
    signal_words: ["Sure", "I'd love to!", "Why not?", "That would be great.", "Sounds …!"]
  - title_tr: "Ret sinyalleri ve 'but' kuralı"
    body_tr: "'I'd love to' tek başına kabul, ama arkasından 'but' geliyorsa RET'tir; 'but'tan sonrası bahanedir. Kararsız cevaplar (Maybe, I'm not sure) da kabul sayılmaz."
    examples_en:
      - "I'd love to, but I have a basketball match.  → RET"
      - "Sorry, I can't. I'm visiting my aunt.  → RET"
      - "Maybe. I'm not sure yet.  → kabul değil"
    signal_words: ["but", "Sorry, I can't …", "Maybe", "I'm not sure"]
  - title_tr: "Cümlenin işi ne? (S09)"
    body_tr: "Bazı sorular kişiyi değil cümlenin İŞLEVİNİ sorar: davet (Would you like …?), kabul (Sure!), ret (Sorry, I can't), özür (I'm sorry), bahane (because …), öneri (How about …?). Bir cümle birden çok işlev taşıyabilir; kök tam olarak neyi istiyor, ona bak."
    examples_en:
      - "Would you like to join us?  → invitation"
      - "I can't come because I have to study.  → refusal + excuse"
      - "How about Sunday instead?  → suggestion"
    signal_words: ["invitation", "refusal", "apology", "excuse", "suggestion"]
