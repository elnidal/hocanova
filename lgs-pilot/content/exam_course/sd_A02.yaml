  type: text_infer
  stem_id: S08
  context: |-
    Ece: Band picnic on Saturday! Who can come?
    Kaan: Sounds fun, but I have a match on Saturday.
    Selin: That would be great! I'll be there.
    Duru: Sure! I'll bring Fıstık too.
    Bora: Sorry, I can't. I have to visit my aunt.
  prompt: "Who will NOT join the picnic?"
  options:
    - "Kaan and Bora"
    - "Selin and Duru"
    - "Kaan and Duru"
    - "Only Bora"
  answer: 0
  explain_tr: "Kaan 'Sounds fun' diye başlıyor ama 'but' ile maçını bahane ediyor; Bora da 'Sorry, I can't' diyor. 'Only Bora' çekici, çünkü Kaan'ın olumlu başlangıcı insanı yanıltıyor."
  items: [U1-022, U1-023, U1-021]
