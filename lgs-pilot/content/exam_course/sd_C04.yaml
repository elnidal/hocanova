# LGS Sınav Dili — C04 Çeldirici avı (karışık kökler). Doğru cevap her zaman options[0]; uygulama karıştırır.
schema_version: 1
id: SD-C04
module: C
title: "Çeldirici avı"
unlock_after: "Ü7 sonu"
minutes: 7
stems: [S01, S02, S04, S05, S06, S10, S14]
units: [6, 7]
intro_tr: "LGS'de yanlış şıklar rastgele yazılmaz; her biri belirli bir tuzak türüdür. Tuzakların adını koyabilen öğrenci doğru şıkkı aramaz, yanlışları eler. Bugün turizm metinlerinde çeldirici avına çıkıyoruz."
cards:
  - title_tr: "Tuzak 1: Kelime tekrarı"
    body_tr: "Şık, metindeki kelimeleri AYNEN taşır ama başka bir bilgiye bağlar. Göze tanıdık geldiği için en çok seçilen yanlış budur. Tanıdık kelime görünce 'bu kelime metinde neyle ilgiliydi?' diye sor."
    examples_en:
      - "Text: Visitors buy silver jewellery as souvenirs. It is famous for its stone houses."
      - "Trap: Visitors buy stone houses as souvenirs. ✗"
  - title_tr: "Tuzak 2: Yarı doğru"
    body_tr: "Şıkkın bir parçası doğru, diğer parçası yanlış. 'both', 'and', 'all', 'with …' gibi bağlantılar iki bilgiyi birleştirir; ikisini de kontrol et. Yarısı yanlış olan şık tamamen yanlıştır."
    examples_en:
      - "Ece and Selin both like seaside holidays.  → biri sevmiyorsa ✗"
      - "Duru went to Mardin with Elif last year.  → yıl doğru, kişi yanlış ✗"
    signal_words: ["both", "and", "all", "with"]
  - title_tr: "Tuzak 3: Ters anlam"
    body_tr: "Şık metindeki bilginin tam tersini söyler: crowded ↔ quiet, ancient ↔ modern, has been ↔ has never been. Olumsuz yapılar (not, never, neither) da anlamı ters çevirir."
    examples_en:
      - "Text: The streets were crowded.  Trap: The streets were quiet. ✗"
    signal_words: ["not", "never", "crowded / quiet", "ancient / modern"]
  - title_tr: "Tuzak 4: Konu dışı / dayanaksız"
    body_tr: "Şık kulağa mantıklı gelir ama metinde HİÇ dayanağı yoktur. Genel kültürünle doğru olabilir; LGS'de yalnız metne göre karar verilir. Başlık sorularında 'çok geniş' ve 'çok dar' şıklar da bu ailedendir."
    examples_en:
      - "Text about Mardin  → 'Mardin is a popular ski resort.' ✗ (metinde yok)"
worked_example:
  id: sd-C04-w
  type: text_infer
  stem_id: S04
  context: |-
    Mardin is an ancient city in the south-east of Türkiye. It is famous for its stone houses and historic mosques. Visitors also buy handmade silver jewellery as souvenirs. The best time to visit is spring because summers are very hot.
  prompt: "According to the text, which of the following is TRUE?"
  options:
    - "Summer is not the best season to visit Mardin."
    - "Visitors buy stone houses as souvenirs."
    - "Mardin is famous for its modern buildings."
    - "Mardin is a popular ski resort."
  answer: 0
  explain_tr: "Metin en iyi zamanın ilkbahar olduğunu, yazların çok sıcak olduğunu söylüyor. Çeldiriciler sırayla kelime tekrarı (stone houses + souvenirs), ters anlam (ancient ↔ modern) ve konu dışı (kayak) tuzakları."
  items: [U7-030, U7-056, U7-034, U7-008, U7-043, U7-017]
