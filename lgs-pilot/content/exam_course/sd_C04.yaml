tips:
  - "Bir şıkkı elerken tuzağın ADINI söyle: kelime tekrarı mı, yarı doğru mu, ters anlam mı, konu dışı mı?"
  - "Metindeki kelimelerle dolu şık seni hemen çekiyorsa iki kez kontrol et; doğru şık çoğu zaman başka kelimelerle konuşur."
  - "İki bilgiyi birleştiren şıkta (and, both, with) iki parçayı da ayrı ayrı doğrula."
