    durum: "Okul şenliğinde her masada başka bir şehrin yemeği, müziği ve kıyafeti var."
    lines:
      - { speaker: "Selin", text: "Antep baklavası, Karadeniz horonu, Ege zeybeği… <en>This is {U7-044|cultural diversity}!</en>" }
