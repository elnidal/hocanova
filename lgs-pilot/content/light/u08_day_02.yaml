schema_version: 1
program: lgs
mode: light
unit: 8
day: 2
status: draft
title: "Mutfak işleri ve toparlama"
est_minutes: 7
new_items: [U8-006, U8-007, U8-008, U8-009, U8-010]
steps:
  - item: U8-006
    card:
      example_en: "After dinner, I wash the dishes and my brother dries them."
      example_tr: "Akşam yemeğinden sonra bulaşıkları ben yıkarım, kardeşim kurular."
      note_tr: "dish (tekil) = yemek / tabak; the dishes = bulaşık. do the washing up (İngiliz İngilizcesi) aynı anlamdadır."
    kullan:
      id: u8d02-006-k
      type: gap_fill
      prompt: "<en>Choose the best option.</en>"
      stem: "<en>After dinner, Bora has to ________ the dishes because his sister cooked.</en>"
      options: ["wash", "water", "sweep", "iron"]
      answer: 0
      explain: "Yemekten sonra bulaşık yıkanır: wash the dishes."
    sina:
      id: u8d02-006-s
      type: dialogue_complete
      lgs_like: true
      stem_id: S01
      prompt: "<en>Which of the following completes the dialogue?</en>"
      stem: "<en>Dad: Who is going to do the washing up tonight?\nKaan: ________</en>"
      options: ["I will. I'll wash the dishes.", "I will. I'll wash the car.", "I will. I'll sweep the lawn.", "I will. I'll iron the shirts."]
      answer: 0
      explain: "do the washing up = bulaşık yıkamak; cevap da bulaşıkla ilgili olmalı."
    tekrar:
      id: u8d02-006-t
      type: situation
      lgs_like: true
      stem_id: S09
      prompt: "<en>What does \"the dishes\" mean in \"wash the dishes\"?</en>"
      options: ["Plates, bowls and cups after a meal", "A type of food", "Clean clothes", "Garden tools"]
      answer: 0
      explain: "the dishes = yemekten sonra yıkanacak tabak, kase ve bardaklar."
  - item: U8-007
    card:
      example_en: "I washed the plates and he dried them with a towel."
      example_tr: "Tabakları ben yıkadım, o havluyla kuruladı."
      note_tr: "dry fiil (kurulamak, kurutmak) ve sıfat (kuru) olarak kullanılır."
    kullan:
      id: u8d02-007-k
      type: gap_fill
      prompt: "<en>Choose the best option.</en>"
      stem: "<en>Duru washes the plates and Elif ________ them with a clean towel.</en>"
      options: ["dries", "dirties", "breaks", "fills"]
      answer: 0
      explain: "Havluyla kurulamak: dry."
    sina:
      id: u8d02-007-s
      type: message_infer
      lgs_like: true
      stem_id: S11
      prompt: "<en>What does Selin want?</en>"
      stem: "<en>Selin: I washed all the plates. Now they are wet on the table. Please take a towel and help me.</en>"
      options: ["She wants help to dry the dishes.", "She wants help to cook dinner.", "She wants to go shopping.", "She wants to wash the clothes."]
      answer: 0
      explain: "Tabaklar yıkanmış ve ıslak; havlu alıp yardım istiyor: kurulamak."
    tekrar:
      id: u8d02-007-t
      type: synonym
      lgs_like: true
      stem_id: S12
      prompt: "<en>Which word is the opposite of \"dry\"?</en>"
      options: ["wet", "hot", "clean", "empty"]
      answer: 0
      explain: "dry (kuru) ↔ wet (ıslak)."
  - item: U8-008
    card:
      example_en: "I load the dishwasher after dinner and empty it in the morning."
      example_tr: "Akşam yemeğinden sonra bulaşık makinesini doldururum, sabah boşaltırım."
      note_tr: "empty sıfat \"boş\", fiil \"boşaltmak\"; load = yüklemek, doldurmak."
    kullan:
      id: u8d02-008-k
      type: gap_fill
      prompt: "<en>Choose the best option.</en>"
      stem: "<en>The clean plates are still in the dishwasher. Please ________ it before breakfast.</en>"
      options: ["empty", "dust", "mow", "fold"]
      answer: 0
      explain: "Temiz tabakları çıkarmak = makineyi boşaltmak (empty)."
    sina:
      id: u8d02-008-s
      type: dialogue_complete
      lgs_like: true
      stem_id: S01
      prompt: "<en>Which of the following completes the dialogue?</en>"
      stem: "<en>Mum: The dishwasher is full of clean plates.\nEce: ________ Then I'll put the dirty cups in it.</en>"
      options: ["I'll empty it first.", "I'll load it first.", "I'll sweep it first.", "I'll iron it first."]
      answer: 0
      explain: "Makine temiz tabakla dolu; önce boşaltmak, sonra kirli bardakları yüklemek gerekir."
    tekrar:
      id: u8d02-008-t
      type: odd_one_out
      lgs_like: true
      stem_id: S09
      prompt: "<en>Which is the opposite of \"load the dishwasher\"?</en>"
      options: ["empty the dishwasher", "fill the dishwasher", "buy the dishwasher", "break the dishwasher"]
      answer: 0
      explain: "load (doldurmak) ↔ empty (boşaltmak)."
  - item: U8-009
    card:
      example_en: "Tidy up your room before the guests come."
      example_tr: "Misafirler gelmeden odanı topla."
      note_tr: "tidy sıfat (düzenli) ve fiil (toparlamak); untidy = dağınık; clean up = iyice temizleyip toplamak."
    kullan:
      id: u8d02-009-k
      type: gap_fill
      prompt: "<en>Choose the best option.</en>"
      stem: "<en>Please tidy ________ your room before the guests come.</en>"
      options: ["up", "in", "at", "by"]
      answer: 0
      explain: "\"tidy up\" = toparlamak (phrasal verb)."
    sina:
      id: u8d02-009-s
      type: dialogue_complete
      lgs_like: true
      stem_id: S01
      prompt: "<en>Which of the following completes the dialogue?</en>"
      stem: "<en>Mum: Your room is very untidy!\nBora: ________ I'll do it now.</en>"
      options: ["Sorry, Mum. I'll tidy it up.", "Sorry, Mum. I'll mess it up.", "Thanks, Mum. I'll break it.", "Sorry, Mum. I'll buy it."]
      answer: 0
      explain: "Oda dağınık; özür dileyip toparlayacağını söylemek uygun."
    tekrar:
      id: u8d02-009-t
      type: synonym
      lgs_like: true
      stem_id: S12
      prompt: "<en>Which word is the opposite of \"tidy\"?</en>"
      options: ["untidy", "clean", "quiet", "tiny"]
      answer: 0
      explain: "tidy (düzenli) ↔ untidy (dağınık)."
  - item: U8-010
    card:
      example_en: "What a mess! There are toys all over the floor."
      example_tr: "Ne dağınıklık! Yerin her yerinde oyuncaklar var."
      note_tr: "make a mess = ortalığı dağıtmak (do a mess değil); messy = dağınık."
    kullan:
      id: u8d02-010-k
      type: gap_fill
      prompt: "<en>Choose the best option.</en>"
      stem: "<en>The children played in the kitchen and made a ________ there.</en>"
      options: ["mess", "chore", "task", "duty"]
      answer: 0
      explain: "Ortalığı dağıtmak: make a mess."
    sina:
      id: u8d02-010-s
      type: text_infer
      lgs_like: true
      stem_id: S14
      prompt: "<en>What can we say about the living room?</en>"
      stem: "<en>Kaan's mum: When I came home, there were clothes on the sofa, plates on the floor and a pizza box on the TV.</en>"
      options: ["It was very messy.", "It was very tidy.", "It was very clean.", "It was empty."]
      answer: 0
      explain: "Kanepede kıyafet, yerde tabak: oda çok dağınık (messy)."
    tekrar:
      id: u8d02-010-t
      type: gap_fill
      lgs_like: true
      stem_id: S12
      prompt: "<en>Which one completes the sentence?</en>"
      stem: "<en>Look at my desk! It is so ________. I can't find my pencil.</en>"
      options: ["messy", "tidy", "empty", "clean"]
      answer: 0
      explain: "Kalemi bulamıyorsa masa dağınıktır: messy."
tips:
  - type: tuzak
    refs: [U8-006]
    text: "dish (tekil) yemek ya da tabaktır; the dishes bulaşıktır. \"wash / do the dishes\" gördüğünde \"bulaşık\" düşün."
  - type: kelime_ailesi
    refs: [U8-009, U8-010]
    text: "tidy (düzenli) – untidy (dağınık) – tidy up (toparlamak); mess (dağınıklık) – messy (dağınık)."
