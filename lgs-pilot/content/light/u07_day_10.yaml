  end_good: "Süper! Kültür kelimelerini yerine oturttun 🍯 Yarın yerleri betimliyoruz."
  end_mixed: "Fena değil! {weak} biraz karıştı; yarın tekrarda yeniden karşılaşacağız. 🍯"
notifications:
