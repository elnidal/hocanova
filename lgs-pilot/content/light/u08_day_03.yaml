      answer: 0
      explain: "Süpürgeyle süpürülür (sweep); su ve paspasla silinir (mop)."
  - item: U8-015
    card:
      example_en: "Please dust the shelves. They are full of dust."
      example_tr: "Lütfen rafların tozunu al. Tozla dolular."
      note_tr: "dust isim \"toz\", fiil \"tozunu almak\" (toz yapmak değil!)."
