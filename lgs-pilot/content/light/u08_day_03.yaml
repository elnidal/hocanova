    durum: "Pazar sabahı; Kaan kulaklıkla müzik dinliyor, koridordan gürültülü bir makine yaklaşıyor."
    lines:
      - { speaker: "Kaan'ın annesi", text: "Ayaklarını kaldır! <en>I'm going to {U8-012|vacuum} the carpet.</en>" }
      - { speaker: "Kaan", text: "Anne, pazar sabahı saat sekiz!" }
      - { speaker: "Kaan'ın annesi", text: "Halı saate bakmıyor." }
  - item: U8-013
    durum: "Okul bahçesi sarı yapraklarla dolu; Bora elinde uzun saplı bir fırçayla duruyor."
    lines:
      - { speaker: "Bora", text: "Ceza değil, gönüllüyüm! <en>I {U8-013|sweep} the leaves every Friday.</en>" }
      - { speaker: "Elif", text: "Rüzgâr senden hızlı ama. Az önceki yığın yine dağıldı." }
