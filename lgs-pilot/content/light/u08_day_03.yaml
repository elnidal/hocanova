  - item: U8-015
    durum: "Duru raftaki eski kitabı çekiyor ve üst üste hapşırıyor."
    lines:
      - { speaker: "Duru", text: "Hapşu! Bu rafa en son kim dokundu?" }
      - { speaker: "Duru'nun annesi", text: "Kimse. <en>Please {U8-015|dust} the shelves.</en> Bez orada." }
      - { speaker: "Duru", text: "Bu kitap benden yaşlı; tek bez yetmez." }
