steps:
  - item: U8-011
    card:
      example_en: "I make the bed every morning before school."
      example_tr: "Her sabah okuldan önce yatağımı toplarım."
      note_tr: "make the bed = yatağı toplamak, düzeltmek (do the bed değil)."
    kullan:
      id: u8d03-011-k
      type: gap_fill
      prompt: "<en>Choose the best option.</en>"
      stem: "<en>Every morning, Elif gets up and ________ her bed.</en>"
      options: ["makes", "does", "plays", "sets"]
      answer: 0
      explain: "Yatağı toplamak: make the bed."
    sina:
      id: u8d03-011-s
      type: message_infer
      lgs_like: true
      stem_id: S14
      prompt: "<en>What does Selin do every morning?</en>"
      stem: "<en>Selin: Every morning I wake up at seven, put the pillows in place and pull the sheets straight.</en>"
      options: ["She makes her bed.", "She buys a new bed.", "She cleans the carpet.", "She cooks breakfast."]
      answer: 0
      explain: "Yastıkları yerine koyup çarşafı düzeltmek yatağı toplamaktır."
    tekrar:
      id: u8d03-011-t
      type: situation
      lgs_like: true
      stem_id: S10
      prompt: "<en>Which sentence is correct?</en>"
      options: ["Please make the bed.", "Please do the bed.", "Please cook the bed.", "Please play the bed."]
      answer: 0
      explain: "Kalıp make the bed'dir."
  - item: U8-012
    card:
      example_en: "Dad vacuums the carpets with the vacuum cleaner on Sundays."
      example_tr: "Babam pazar günleri halıları elektrik süpürgesiyle süpürür."
      note_tr: "vacuum = elektrik süpürgesiyle süpürmek; vacuum cleaner = elektrik süpürgesi. Yazımı: tek c, çift u."
    kullan:
      id: u8d03-012-k
      type: gap_fill
      prompt: "<en>Choose the best option.</en>"
      stem: "<en>The carpet is full of dust. Please ________ the carpet with the vacuum cleaner.</en>"
      options: ["vacuum", "mop", "water", "hang"]
      answer: 0
      explain: "Halıyı elektrik süpürgesiyle temizlemek: vacuum."
    sina:
      id: u8d03-012-s
      type: message_infer
      lgs_like: true
      stem_id: S14
      prompt: "<en>What did Ece use?</en>"
      stem: "<en>Ece: Mum asked me to clean the living room. I used a machine to clean the carpet and the sofa.</en>"
      options: ["A vacuum cleaner", "A washing machine", "A cooker", "A dishwasher"]
      answer: 0
      explain: "Halı ve kanepeyi temizleyen makine elektrik süpürgesidir."
    tekrar:
      id: u8d03-012-t
      type: gap_fill
      lgs_like: true
      stem_id: S12
      prompt: "<en>Which one is the correct spelling?</en>"
      options: ["vacuum", "vaccum", "vacum", "vaccuum"]
      answer: 0
      explain: "Doğru yazım: vacuum (tek c, çift u)."
  - item: U8-013
    card:
      example_en: "I sweep the floor with a broom after dinner."
      example_tr: "Akşam yemeğinden sonra süpürgeyle yeri süpürürüm."
      note_tr: "sweep süpürgeyle, vacuum elektrik süpürgesiyle; düzensiz fiil: sweep – swept."
    kullan:
      id: u8d03-013-k
      type: gap_fill
      prompt: "<en>Choose the best option.</en>"
