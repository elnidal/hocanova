  start: "Gün 6: çevre sorunları. Gezegenimizin sorunlarını anlatıyoruz 🌡️"
  end_good: "Harika! Çevre haberlerini rahat okursun 🌡️ Yarın çevre ve doğayı koruma."
  end_mixed: "Fena değil! {weak} biraz karıştı; yarın tekrarda yeniden karşılaşacağız. 🌡️"
notifications:
  morning: "Bugün: küresel ısınma, sera gazı, kirlilik, ormansızlaşma ve kıtlık 🌡️"
  evening: "Greenhouse \"yeşil ev\" mi demek? 🤔"
  review: "Lack mi, luck mı? \"Yağmur eksikliği\" hangisi? ☔"
mini:                     # kısa Türkçe sahne, hedef ifade İngilizce
  - item: U10-026
    durum: "Kasım ortasında Ece okula tişörtle geliyor."
    lines:
      - { speaker: "Ece", text: "Kasımda tişört! <en>It's {U10-026|global warming}.</en>" }
      - { speaker: "Selin", text: "Yoksa montunu yine evde mi unuttun?" }
  - item: U10-027
    durum: "Bora ve Elif güneşe iki kavanoz koymuş; birinin kapağı kapalı, termometresi yüksek."
    lines:
      - { speaker: "Bora", text: "Bu kavanozun içi neden daha sıcak?" }
      - { speaker: "Elif", text: "<en>That's the {U10-027|greenhouse effect}.</en> Yazın arabaya binmek gibi." }
  - item: U10-028
    durum: "Kaan dere kenarında duruyor; suyun üstünde köpük ve plastik şişeler var."
    lines:
      - { speaker: "Kaan", text: "<en>This is water {U10-028|pollution}.</en>" }
      - { speaker: "Selin", text: "Fotoğrafını çek, belediyeye yazalım." }
  - item: U10-029
    durum: "Tepeye giden yolda kütükler sıra sıra duruyor; Selin'in babası arabayı yavaşlatıyor."
    lines:
      - { speaker: "Selin'in babası", text: "Burası yemyeşildi. <en>{U10-029|Deforestation} is a big problem.</en>" }
      - { speaker: "Selin", text: "Okuldaki fidan kampanyasını buraya da getirelim." }
  - item: U10-030
    durum: "Binanın girişinde su kesintisi duyurusu asılı; Ece havluyla duşa gidiyor."
    lines:
      - { speaker: "Ece'nin annesi", text: "<en>There is a water {U10-030|shortage} this summer.</en> Duşu kısa tut." }
      - { speaker: "Ece", text: "Ne kadar kısa?" }
      - { speaker: "Ece'nin annesi", text: "Şarkının nakaratına kadar." }
