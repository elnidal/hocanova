schema_version: 1
program: lgs
mode: light
unit: 10
day: 6
status: draft
title: "Çevre sorunları: ısınma, kirlilik, kıtlık"
est_minutes: 7
new_items: [U10-026, U10-027, U10-028, U10-029, U10-030]
steps:
  - item: U10-026
    card:
      example_en: "Global warming is causing sea levels to rise."
      example_tr: "Küresel ısınma deniz seviyelerinin yükselmesine neden oluyor."
      note_tr: "global warming = küresel ısınma; climate change = iklim değişikliği; warm up = ısınmak."
    kullan:
      id: u10d06-026-k
      type: gap_fill
      prompt: "<en>Choose the best option.</en>"
      stem: "<en>Because of global warming, the Earth is ________ up.</en>"
      options: ["warming", "warm", "warmed", "warms"]
      answer: 0
      explain: "is + fiil-ing: is warming up."
    sina:
      id: u10d06-026-s
      type: text_infer
      lgs_like: true
      stem_id: S04
      prompt: "<en>What is happening because of global warming?</en>"
      stem: "<en>Scientists say global warming is a serious problem. The Earth is getting warmer, so ice is melting and sea levels are rising.</en>"
      options: ["Sea levels are rising.", "The Earth is getting colder.", "Deserts are becoming forests.", "Rainfall is stopping everywhere."]
      answer: 0
      explain: "Buzlar eriyor ve deniz seviyeleri yükseliyor."
      why_wrong:
        - "Metin \"getting warmer\" diyor; tam tersi."
        - "Metinde çöl ve orman geçmiyor."
        - "Metin yağmurun durduğundan söz etmiyor."
    tekrar:
      id: u10d06-026-t
      type: synonym
      lgs_like: true
      stem_id: S12
      prompt: "<en>Which word is closest in meaning to \"global\"?</en>"
      options: ["worldwide", "local", "tiny", "private"]
      answer: 0
      explain: "global = dünya çapında (worldwide)."
      why_wrong:
        - "local yereldir; global'in karşıtı."
        - "tiny çok küçüktür."
        - "private özeldir."
  - item: U10-027
    card:
      example_en: "Greenhouse gases trap heat in the atmosphere."
      example_tr: "Sera gazları atmosferde ısıyı hapseder."
      note_tr: "greenhouse = sera (\"yeşil ev\" değil); greenhouse effect = sera etkisi."
    kullan:
      id: u10d06-027-k
      type: gap_fill
      prompt: "<en>Choose the best option.</en>"
      stem: "<en>Farmers grow tomatoes in a ________ in winter.</en>"
      options: ["greenhouse", "fountain", "janitor", "platform"]
      answer: 0
      explain: "Kışın domates yetiştirilen cam yapı: sera (greenhouse)."
    sina:
      id: u10d06-027-s
      type: text_infer
      lgs_like: true
      stem_id: S04
      prompt: "<en>What do greenhouse gases do?</en>"
      stem: "<en>Burning coal and oil produces greenhouse gases such as carbon dioxide. These gases trap heat and make the Earth warmer.</en>"
      options: ["They trap heat.", "They cool the Earth.", "They make rain.", "They clean the air."]
      answer: 0
      explain: "Metne göre ısıyı hapsedip Dünya'yı ısıtırlar."
      why_wrong:
        - "Metin Dünya'yı ısıttıklarını söylüyor; tam tersi."
        - "Metinde yağmurdan söz edilmiyor."
        - "Metin havayı temizlediğini söylemiyor; kömür ve petrolden çıkıyorlar."
    tekrar:
      id: u10d06-027-t
      type: situation
      lgs_like: true
      stem_id: S09
      prompt: "<en>What is a greenhouse?</en>"
      options: ["A glass building where plants grow", "A house painted green", "A park with trees", "A shop for green clothes"]
      answer: 0
      explain: "greenhouse = bitki yetiştirilen cam yapı (sera)."
      why_wrong:
        - "Yeşile boyalı ev değil; bitkilerin yetiştiği cam yapıdır."
        - "Park açık alandır; cam yapı değildir."
        - "Giyim dükkânı değildir."
  - item: U10-028
    card:
      example_en: "Air pollution is a problem in big cities."
      example_tr: "Hava kirliliği büyük şehirlerde bir sorundur."
      note_tr: "pollute (fiil) → pollution (isim) → polluted (kirli); toxic = zehirli."
    kullan:
      id: u10d06-028-k
      type: gap_fill
      prompt: "<en>Choose the best option.</en>"
      stem: "<en>Some factories ________ the river with dirty water.</en>"
      options: ["pollute", "pollution", "polluted", "polluting"]
      answer: 0
      explain: "Some factories + fiil: pollute (kirletmek)."
    sina:
      id: u10d06-028-s
      type: gap_fill
      lgs_like: true
      stem_id: S12
      prompt: "<en>Which one completes the sentence?</en>"
      stem: "<en>The ________ river is full of rubbish and dirty water.</en>"
      options: ["polluted", "pollution", "pollute", "pollutes"]
      answer: 0
      explain: "\"river\" isminin önüne sıfat gelir: polluted (kirlenmiş)."
      why_wrong:
        - "pollution isimdir; river'dan önce sıfat gerekir."
        - "pollute fiildir; sıfat gerekir."
        - "pollutes çekimli fiildir; sıfat gerekir."
    tekrar:
      id: u10d06-028-t
      type: odd_one_out
      lgs_like: true
      stem_id: S09
      prompt: "<en>Which one is a type of pollution?</en>"
      options: ["Water pollution", "Water fountain", "Water bottle", "Waterfall"]
      answer: 0
      explain: "Su kirliliği bir kirlilik türüdür."
      why_wrong:
        - "Su çeşmesi kirlilik türü değildir."
        - "Su şişesi kirlilik türü değildir."
        - "Şelale doğa güzelliğidir; kirlilik değil."
  - item: U10-029
    card:
      example_en: "People cut down trees, and deforestation causes landslides."
      example_tr: "İnsanlar ağaç keser, ormansızlaşma heyelanlara yol açar."
      note_tr: "deforestation = ormansızlaşma; cut down trees = ağaç kesmek; destroy forests = ormanları yok etmek."
    kullan:
      id: u10d06-029-k
      type: gap_fill
      prompt: "<en>Choose the best option.</en>"
      stem: "<en>Cutting down too many trees causes ________.</en>"
      options: ["deforestation", "recycling", "vaccination", "competition"]
      answer: 0
      explain: "Çok ağaç kesmek ormansızlaşmaya yol açar."
    sina:
      id: u10d06-029-s
      type: text_infer
      lgs_like: true
      stem_id: S04
      prompt: "<en>What can deforestation cause?</en>"
      stem: "<en>In many places, people cut down trees for wood and land. Without trees, the soil slides down the hills during heavy rain.</en>"
      options: ["Landslides", "Rainbows", "Earthquakes", "Tsunamis"]
      answer: 0
      explain: "Ağaçsız toprak yağmurda kayar: heyelan."
      why_wrong:
        - "Gökkuşağı ağaç kesmeyle ilgili değildir."
        - "Depremi plakalar oluşturur; ağaçlar değil."
        - "Tsunami denizde olur; ağaç kesmeyle olmaz."
    tekrar:
      id: u10d06-029-t
      type: situation
      lgs_like: true
      stem_id: S10
      prompt: "<en>Which action is bad for forests?</en>"
      options: ["Cutting down trees without planting new ones", "Planting trees", "Protecting wildlife", "Using less paper"]
      answer: 0
      explain: "Yeni ağaç dikmeden ağaç kesmek ormanlara zarar verir."
      why_wrong:
        - "Ağaç dikmek ormanlar için iyidir."
        - "Vahşi yaşamı korumak ormanlar için iyidir."
        - "Az kâğıt kullanmak daha az ağaç kesilmesini sağlar."
  - item: U10-030
    card:
      example_en: "There is a water shortage in the region. We are running out of water."
      example_tr: "Bölgede su kıtlığı var. Suyumuz tükeniyor."
      note_tr: "run out of + isim = tükenmek; lack of = … eksikliği; shortage = kıtlık."
    kullan:
      id: u10d06-030-k
      type: gap_fill
      prompt: "<en>Choose the best option.</en>"
      stem: "<en>In summer, there is a serious water ________ in some villages.</en>"
      options: ["shortage", "chore", "reward", "square"]
      answer: 0
      explain: "Yetersiz su: water shortage."
    sina:
      id: u10d06-030-s
      type: situation
      lgs_like: true
      stem_id: S10
      prompt: "<en>Which sentence is correct?</en>"
      options: ["We are running out of water.", "We are running out water.", "We are running out to water.", "We are running of out water."]
      answer: 0
      explain: "Kalıp: run out of + isim."
      why_wrong:
        - "run out ile of gerekir: running out of water."
        - "run out ile to kullanılmaz."
        - "Sözcük sırası bozuk: running out of."
    tekrar:
      id: u10d06-030-t
      type: table_graph
      lgs_like: true
      stem_id: S06
      prompt: "<en>According to the chart, which of the following is TRUE?</en>"
      stem: "<en>WATER LEVEL IN THE DAM\nJanuary: 80%\nMarch: 60%\nMay: 40%\nJuly: 15%</en>"
      options: ["The town may have a water shortage in July.", "The dam is full in July.", "The water level rises every month.", "March has the lowest water level."]
      answer: 0
      explain: "Temmuzda su %15'e düşmüş: su sıkıntısı çıkabilir."
      why_wrong:
        - "Temmuzda oran %15; baraj dolu değil, en düşük seviyede."
        - "Sayılar 80'den 15'e iniyor; seviye yükselmiyor, düşüyor."
        - "En düşük oran temmuzda; martta %60 var."
tips:
  - type: tuzak
    refs: [U10-027]
    text: "greenhouse = sera (\"yeşil ev\" değil). greenhouse gases = sera gazları: ısıyı hapseder."
  - type: kelime_ailesi
    refs: [U10-028]
    text: "pollute → pollution → polluted; toxic = zehirli. \"Water pollution\", \"air pollution\" ve \"soil pollution\" üç kirlilik türüdür."
