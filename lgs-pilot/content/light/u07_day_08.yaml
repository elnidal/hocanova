  start: "Gün 8: imparatorlar, fetihler ve keşifler. Tarih kitabını açıyoruz 📜"
  end_good: "Mükemmel! Tarih metinlerini rahat okursun 📜 Yarın miras ve kültür."
  end_mixed: "Fena değil! {weak} biraz karıştı; yarın tekrarda yeniden karşılaşacağız. 📜"
