  end_good: "Harika! Çözüm ve tahmin kalıplarını biliyorsun 🔆 Yarın öneri, neden-sonuç ve görüş."
  end_mixed: "Fena değil! {weak} biraz karıştı; yarın tekrarda yeniden karşılaşacağız. 🔆"
