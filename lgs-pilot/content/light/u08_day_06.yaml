title: "Ev, aile ve harçlık"
est_minutes: 7
new_items: [U8-026, U8-027, U8-028, U8-029, U8-030]
steps:
  - item: U8-026
    card:
      example_en: "I feed the fish every morning."
      example_tr: "Her sabah balıkları beslerim."
      note_tr: "feed = beslemek, yem ya da mama vermek. Düzensiz: feed – fed. food ile aynı aileden."
    kullan:
      id: u8d06-026-k
      type: gap_fill
      prompt: "<en>Choose the best option.</en>"
      stem: "<en>Don't forget to ________ the dog. He is hungry.</en>"
      options: ["feed", "fold", "mow", "mop"]
      answer: 0
      explain: "Aç köpeğe mama vermek: feed."
    sina:
      id: u8d06-026-s
      type: message_infer
      lgs_like: true
      stem_id: S14
      prompt: "<en>What does Duru do for Fıstık?</en>"
      stem: "<en>Duru: Every day before school I fill Fıstık's bowl with food and give him fresh water.</en>"
      options: ["She feeds him.", "She walks him in the park.", "She washes him.", "She sells him."]
      answer: 0
      explain: "Kasesini mamayla doldurup su veriyor: onu besliyor."
      why_wrong:
        - "Park geçmiyor; kaba yiyecek ve su koyuyor."
        - "Yıkamaktan söz edilmiyor; kabını dolduruyor."
        - "Satmak yok; her sabah bakıyor."
    tekrar:
      id: u8d06-026-t
      type: table_graph
      lgs_like: true
      stem_id: S06
      prompt: "<en>According to the chart, which of the following is TRUE?</en>"
      stem: "<en>WHO FEEDS THE PETS?\nMorning: Deniz – the cat\nAfternoon: Arda – the fish\nEvening: Nil – the dog</en>"
      options: ["Nil feeds the dog in the evening.", "Deniz feeds the fish in the morning.", "Arda feeds the cat in the evening.", "Nil feeds the fish in the afternoon."]
      answer: 0
      explain: "Evening satırında Nil ve köpek var: akşam köpeği Nil besliyor."
      why_wrong:
        - "Sabah satırında Deniz var ama hayvan kedi; balık öğleden sonra satırında."
        - "Arda'nın satırında balık ve öğleden sonra yazıyor; kişi, hayvan ve saat karışmış."
        - "Nil akşam satırında ve köpeği besliyor; balık Arda'nın."
  - item: U8-027
    card:
      example_en: "We live in a flat on the third floor."
      example_tr: "Üçüncü kattaki bir dairede yaşıyoruz."
      note_tr: "flat sıfat olarak \"düz\"; ev bağlamında \"apartman dairesi\" (İngiliz İngilizcesi; Amerikan: apartment)."
    kullan:
      id: u8d06-027-k
      type: gap_fill
      prompt: "<en>Choose the best option.</en>"
      stem: "<en>We don't have a house with a garden. We live in a ________ on the fifth floor.</en>"
      options: ["flat", "lawn", "cooker", "dish"]
      answer: 0
      explain: "Beşinci katta yaşamak: apartman dairesi (flat)."
    sina:
      id: u8d06-027-s
      type: message_infer
      lgs_like: true
      stem_id: S14
      prompt: "<en>What kind of home is it?</en>"
      stem: "<en>Ece: Our new home has two bedrooms, a small kitchen and a balcony. It is on the sixth floor, and there is a lift.</en>"
      options: ["A flat", "A palace", "A tent", "A mansion"]
      answer: 0
      explain: "Altıncı kat, asansör, balkon: apartman dairesi."
      why_wrong:
        - "Saray iki yatak odalı ve küçük mutfaklı olmaz."
        - "Çadırda altıncı kat ve asansör olmaz."
        - "mansion büyük konaktır; altıncı katta iki odalı değildir."
    tekrar:
      id: u8d06-027-t
      type: situation
      lgs_like: true
      stem_id: S09
      prompt: "<en>Which word means \"apartment\" in British English?</en>"
      options: ["flat", "square", "port", "resort"]
      answer: 0
      explain: "İngiliz İngilizcesinde apartment = flat."
      why_wrong:
        - "square meydan demektir; ev türü değil."
        - "port liman demektir; ev türü değil."
        - "resort tatil yeridir; apartman dairesi değil."
  - item: U8-028
    card:
      example_en: "All my relatives come to our house on holidays."
      example_tr: "Bayramlarda bütün akrabalarım bize gelir."
      note_tr: "relative = akraba (\"relatif, göreceli\" değil); relatives = akrabalar."
    kullan:
      id: u8d06-028-k
      type: gap_fill
      prompt: "<en>Choose the best option.</en>"
      stem: "<en>My aunts, uncles and cousins are my ________.</en>"
      options: ["relatives", "neighbours", "classmates", "tourists"]
      answer: 0
      explain: "Teyze, amca ve kuzenler akrabadır (relatives)."
    sina:
      id: u8d06-028-s
      type: message_infer
      lgs_like: true
      stem_id: S08
      prompt: "<en>Who is visiting Kaan?</en>"
      stem: "<en>Kaan: This weekend, my grandparents, my uncle and his children are visiting us. We are a big family!</en>"
      options: ["His relatives", "His classmates", "His teachers", "His neighbours"]
      answer: 0
      explain: "Büyükanne-büyükbaba, amca ve çocukları: akrabalar."
      why_wrong:
        - "Gelenler sınıf arkadaşı değil, büyükanne-büyükbaba ve dayı/amca."
        - "Gelenler öğretmen değil, aile büyükleri."
        - "Gelenler komşu değil; \"We are a big family\" diyor."
    tekrar:
      id: u8d06-028-t
      type: odd_one_out
      lgs_like: true
      stem_id: S09
      prompt: "<en>Who is NOT a relative?</en>"
      options: ["A neighbour", "An aunt", "A cousin", "A grandfather"]
      answer: 0
      explain: "Komşu akraba değildir."
      why_wrong:
        - "aunt teyze ya da halandır; akrabandır."
        - "cousin kuzendir; akrabandır."
        - "grandfather dededir; akrabandır."
  - item: U8-029
    card:
      example_en: "I get an allowance of fifty liras every week."
      example_tr: "Her hafta elli lira harçlık alırım."
      note_tr: "allowance burada harçlık (pocket money); allow (izin vermek) ile karıştırma."
    kullan:
      id: u8d06-029-k
      type: gap_fill
      prompt: "<en>Choose the best option.</en>"
      stem: "<en>My parents give me some money every week. It is my ________.</en>"
      options: ["allowance", "permission", "furniture", "laundry"]
      answer: 0
      explain: "Haftalık harçlık: allowance."
    sina:
      id: u8d06-029-s
      type: dialogue_complete
      lgs_like: true
      stem_id: S01
      prompt: "<en>Which of the following completes the dialogue?</en>"
      stem: "<en>Selin: How do you pay for your cinema tickets?\nBora: ________ My parents give me a hundred liras every week.</en>"
      options: ["I use my allowance.", "I use my homework.", "I use my room.", "I use my bed."]
      answer: 0
      explain: "Ailesinin verdiği haftalık para harçlıktır."
      why_wrong:
        - "Ödevle sinema bileti alınmaz."
        - "Oda ile bilet parası ödenmez."
        - "Yatak ile bilet parası ödenmez."
    tekrar:
      id: u8d06-029-t
      type: table_graph
      lgs_like: true
      stem_id: S06
      prompt: "<en>According to the chart, which of the following is TRUE?</en>"
      stem: "<en>WEEKLY ALLOWANCE\nDeniz: 100 liras – tidy the room\nArda: 150 liras – mow the lawn\nNil: 120 liras – feed the cat</en>"
      options: ["Arda gets the biggest allowance.", "Nil gets the smallest allowance.", "Deniz gets an allowance for mowing the lawn.", "Arda and Nil get the same allowance."]
      answer: 0
      explain: "En büyük sayı 150, Arda'nın satırında: en çok harçlığı o alıyor."
      why_wrong:
        - "En küçük sayı 100 ve Deniz'in; Nil 120 lira alıyor."
        - "\"Mow the lawn\" Arda'nın satırında; Deniz odayı topluyor."
        - "Arda 150, Nil 120 lira alıyor; miktarlar farklı."
  - item: U8-030
    card:
      example_en: "My parents gave me a reward for tidying my room."
      example_tr: "Odamı topladığım için ailem bana bir ödül verdi."
      note_tr: "reward bir davranışın karşılığıdır (ev işi yapana ödül); award yarışmada verilen ödüldür."
    kullan:
      id: u8d06-030-k
      type: gap_fill
      prompt: "<en>Choose the best option.</en>"
      stem: "<en>Mum gave Elif a small ________ for helping with the chores: a chocolate.</en>"
      options: ["reward", "chore", "flat", "relative"]
      answer: 0
      explain: "Yardım için verilen küçük hediye ödüldür (reward)."
    sina:
      id: u8d06-030-s
      type: text_infer
      lgs_like: true
      stem_id: S04
      prompt: "<en>What is Kaan's reward?</en>"
      stem: "<en>Kaan did all his chores this week without complaining. His dad said, \"Well done! As a reward, we can go to the cinema on Saturday.\"</en>"
      options: ["Going to the cinema", "Buying a new bike", "Having an extra chore", "Cleaning the car"]
      answer: 0
      explain: "Babası ödül olarak Cumartesi sinemaya gitmeyi öneriyor."
      why_wrong:
        - "Bisiklet alınacağı söylenmiyor; cumartesi sinemaya gidecekler."
        - "Fazladan ev işi ödül değildir; tam tersi."
        - "Araba temizlemek metinde yok."
    tekrar:
      id: u8d06-030-t
      type: situation
      lgs_like: true
      stem_id: S09
      prompt: "<en>Which one is a reward?</en>"
      options: ["A gift for doing a good job", "A punishment for being late", "A bill for a hotel", "A map of the city"]
      answer: 0
      explain: "İyi iş çıkarana verilen hediye ödüldür."
      why_wrong:
        - "punishment cezadır; ödülün karşıtı."
        - "Otel faturası ödül değildir; para ödersin."
        - "Şehir haritası başarı karşılığı verilen bir şey değildir."
