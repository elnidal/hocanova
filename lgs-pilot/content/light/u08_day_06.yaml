      example_en: "I feed the fish every morning."
      example_tr: "Her sabah balıkları beslerim."
      note_tr: "feed = beslemek, yem ya da mama vermek. Düzensiz: feed – fed. food ile aynı aileden."
    kullan:
      id: u8d06-026-k
      type: gap_fill
      prompt: "<en>Choose the best option.</en>"
      stem: "<en>Don't forget to ________ the dog. He is hungry.</en>"
      options: ["feed", "fold", "mow", "mop"]
      answer: 0
      explain: "Aç köpeğe mama vermek: feed."
