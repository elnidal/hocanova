      - { speaker: "Elif", text: "Yine olmadı, hocam." }
      - { speaker: "Murat Bey", text: "Geçen seferden iki soru fazla. <en>Try again, you can do it!</en>" }
      - { speaker: "Elif", text: "<en>He's so {U8-045|encouraging}.</en> Bir test daha çözüyorum." }
