schema_version: 1
program: lgs
mode: light
unit: 9
day: 4
status: draft
title: "Bilgi, hesap ve buluşlar"
est_minutes: 7
new_items: [U9-016, U9-017, U9-018, U9-019, U9-020]
steps:
  - item: U9-016
    card:
      example_en: "Reading books gives us knowledge."
      example_tr: "Kitap okumak bize bilgi kazandırır."
      note_tr: "knowledge sayılamaz: \"knowledges\" yanlış. k okunmaz: /ˈnɒlɪdʒ/ (nolic). know ile aynı aile."
    kullan:
      id: u9d04-016-k
      type: gap_fill
      prompt: "<en>Choose the best option.</en>"
      stem: "<en>She has a lot of ________ about space.</en>"
      options: ["knowledge", "knowledges", "a knowledge", "knowledged"]
      answer: 0
      explain: "knowledge sayılamaz: a lot of knowledge."
    sina:
      id: u9d04-016-s
      type: situation
      lgs_like: true
      stem_id: S10
      prompt: "<en>Which sentence is correct?</en>"
      options: ["Knowledge is power.", "Knowledges are power.", "A knowledge is power.", "Knowledge are power."]
      answer: 0
      explain: "knowledge sayılamaz ve tekil fiil alır: Knowledge is power."
      why_wrong:
        - "knowledge sayılamaz; çoğul olmaz."
        - "knowledge ile a kullanılmaz."
        - "knowledge tekildir: is."
    tekrar:
      id: u9d04-016-t
      type: text_infer
      lgs_like: true
      stem_id: S03
      prompt: "<en>Which of the following is NOT mentioned in the brochure?</en>"
      stem: "<en>THE SCIENCE MUSEUM\nGain knowledge about space, the human body and electricity. Watch short films every hour.\nStudents pay half price.\nClosed on Mondays.</en>"
      options: ["The museum café", "The films", "The price for students", "The closing day"]
      answer: 0
      explain: "Broşürde film, öğrenci fiyatı ve kapalı gün var; kafeden söz edilmiyor."
      why_wrong:
        - "\"Watch short films every hour\" broşürde yazıyor."
        - "\"Students pay half price\" broşürde yazıyor."
        - "\"Closed on Mondays\" broşürde yazıyor."
  - item: U9-017
    card:
      example_en: "I wonder why the sky is blue."
      example_tr: "Gökyüzü neden mavi, merak ediyorum."
      note_tr: "wonder = merak etmek (fiil), harika/mucize (isim). wander = dolaşmak ile karıştırma."
    kullan:
      id: u9d04-017-k
      type: gap_fill
      prompt: "<en>Choose the best option.</en>"
      stem: "<en>I ________ why the moon changes shape. Do you know?</en>"
      options: ["wonder", "wander", "wound", "won"]
      answer: 0
      explain: "Merak etmek: wonder."
    sina:
      id: u9d04-017-s
      type: dialogue_complete
      lgs_like: true
      stem_id: S01
      prompt: "<en>Which of the following completes the dialogue?</en>"
      stem: "<en>Elif: Why is the sea salty?\nDuru: ________ Let's look it up.</en>"
      options: ["I wonder too.", "I wander too.", "I wounded too.", "I wore too."]
      answer: 0
      explain: "\"Ben de merak ediyorum\": I wonder too."
      why_wrong:
        - "wander dolaşmaktır; wonder ile karışıyor."
        - "wounded yaralanmıştır."
        - "wore giymiştir (wear)."
    tekrar:
      id: u9d04-017-t
      type: message_infer
      lgs_like: true
      stem_id: S14
      prompt: "<en>What can we understand about Ece?</en>"
      stem: "<en>Ece: I wonder how bees find their way home. I'm going to read about it tonight.</en>"
      options: ["She wants to learn about bees.", "She knows everything about bees.", "She is afraid of bees.", "She wants to buy some bees."]
      answer: 0
      explain: "\"I wonder\" ve okuyacak olması: arıları öğrenmek istiyor."
      why_wrong:
        - "I wonder biliyorum değil, merak ediyorum demektir."
        - "Korkudan söz etmiyor; merak ediyor."
        - "Satın almaktan değil, okumaktan söz ediyor."
  - item: U9-018
    card:
      example_en: "Use a calculator to calculate the total."
      example_tr: "Toplamı hesaplamak için hesap makinesi kullan."
      note_tr: "calculate = hesaplamak; calculator = hesap makinesi; calculation = hesap."
    kullan:
      id: u9d04-018-k
      type: gap_fill
      prompt: "<en>Choose the best option.</en>"
      stem: "<en>I can't ________ this problem in my head. Please give me a calculator.</en>"
      options: ["calculate", "calculator", "calculation", "calculated"]
      answer: 0
      explain: "can't + fiil: calculate."
    sina:
      id: u9d04-018-s
      type: text_infer
      lgs_like: true
      stem_id: S04
      prompt: "<en>What does a calculator do?</en>"
      stem: "<en>A calculator is a small machine that adds, subtracts, multiplies and divides numbers quickly.</en>"
      options: ["It does maths quickly.", "It makes tea.", "It cleans the floor.", "It tells the weather."]
      answer: 0
      explain: "Metne göre sayıları hızla toplar, çıkarır, çarpar, böler."
      why_wrong:
        - "Çay yapan makine su ısıtıcısıdır."
        - "Yeri süpürge temizler."
        - "Hava durumunu göstermez; sayı işlemi yapar."
    tekrar:
      id: u9d04-018-t
      type: gap_fill
      lgs_like: true
      stem_id: S12
      prompt: "<en>Which one completes the sentence?</en>"
      stem: "<en>She made a small mistake in the ________ and got the wrong answer.</en>"
      options: ["calculation", "calculator", "calculate", "calculating"]
      answer: 0
      explain: "\"in the ...\" isim ister: calculation (hesap)."
      why_wrong:
        - "calculator makinedir; yapılan iş calculation."
        - "calculate fiildir; \"the\" sonrası isim gerekir."
        - "calculating fiil biçimidir; isim gerekir."
  - item: U9-019
    card:
      example_en: "The scientist published her results in a magazine. Gutenberg built the printing press."
      example_tr: "Bilim insanı sonuçlarını bir dergide yayımladı. Gutenberg matbaayı geliştirdi."
      note_tr: "publish = yayımlamak (kitap, makale); print = basmak; printing press = matbaa."
    kullan:
      id: u9d04-019-k
      type: gap_fill
      prompt: "<en>Choose the best option.</en>"
      stem: "<en>The journalist wants to ________ the story in tomorrow's newspaper.</en>"
      options: ["publish", "fold", "dust", "mow"]
      answer: 0
      explain: "Haberi gazetede yayımlamak: publish."
    sina:
      id: u9d04-019-s
      type: text_infer
      lgs_like: true
      stem_id: S04
      prompt: "<en>Why was the printing press important?</en>"
      stem: "<en>Johannes Gutenberg built the printing press in the 15th century. It made books cheaper, so more people could read them.</en>"
      options: ["It made books cheaper.", "It made books rarer.", "It stopped people from reading.", "It made paper expensive."]
      answer: 0
      explain: "Metne göre kitapları ucuzlattı ve daha çok kişi okuyabildi."
      why_wrong:
        - "Metin \"cheaper\" diyor; kitaplar daha az değil, daha çok oldu."
        - "Metin \"more people could read\" diyor; tam tersi."
        - "Metinde pahalı kâğıt geçmiyor."
    tekrar:
      id: u9d04-019-t
      type: table_graph
      lgs_like: true
      stem_id: S06
      prompt: "<en>According to the chart, which of the following is TRUE?</en>"
      stem: "<en>GREAT INVENTIONS\nAbout 1450: printing press\n1876: telephone\n1879: light bulb\n1903: aeroplane</en>"
      options: ["The printing press is the oldest invention in the chart.", "The aeroplane came before the telephone.", "The telephone came in 1450.", "The light bulb is the newest invention in the chart."]
      answer: 0
      explain: "En eski tarih yaklaşık 1450, printing press satırında."
      why_wrong:
        - "1903, 1876'dan sonradır; sıra ters kurulmuş."
        - "Telefonun tarihi 1876; 1450 printing press'in."
        - "En yeni tarih 1903 ve aeroplane'in; ampul 1879."
  - item: U9-020
    card:
      example_en: "The light bulb in my room is broken."
      example_tr: "Odamdaki ampul bozuk."
      note_tr: "light bulb = ampul. bulb tek başına çiçek soğanı da demektir. Ampul 19. yüzyılda icat edildi."
    kullan:
      id: u9d04-020-k
      type: gap_fill
      prompt: "<en>Choose the best option.</en>"
      stem: "<en>It's dark in the room. We need a new ________.</en>"
      options: ["light bulb", "laundry", "furniture", "allowance"]
      answer: 0
      explain: "Karanlık oda için ampul gerekir."
    sina:
      id: u9d04-020-s
      type: situation
      lgs_like: true
      stem_id: S10
      prompt: "<en>Which invention gives us light at night?</en>"
      options: ["The light bulb", "The telephone", "The printing press", "The vaccine"]
      answer: 0
      explain: "Geceleri ışık veren icat ampuldür."
      why_wrong:
        - "Telefon konuşmak içindir."
        - "Printing press kitap basar."
        - "Aşı hastalıktan korur."
    tekrar:
      id: u9d04-020-t
      type: gap_fill
      lgs_like: true
      stem_id: S12
      prompt: "<en>Which one completes the sentence?</en>"
      stem: "<en>Thomas Edison is famous for his work on the electric ________.</en>"
      options: ["bulb", "bomb", "bank", "bone"]
      answer: 0
      explain: "Edison elektrik ampulüyle (electric bulb) anılır."
      why_wrong:
        - "bomb bomba demektir."
        - "bank banka demektir."
        - "bone kemik demektir."
tips:
  - type: tuzak
    refs: [U9-016]
    text: "knowledge sayılamaz: \"knowledges\" yok. Tek parça için: a piece of knowledge / information. Fiili de tekil: Knowledge is power."
  - type: tuzak
    refs: [U9-017]
    text: "wonder (merak etmek) ve wander (dolaşmak) karışır. \"I wonder why …\" = Neden … merak ediyorum."
coach:
  start: "Gün 4: bilgi, merak, hesap ve büyük buluşlar 💡"
  end_good: "Harika! Buluşların dilini öğreniyorsun 💡 Yarın yapay zekâ, kurmak ve tamir."
  end_mixed: "Fena değil! {weak} biraz karıştı; yarın tekrarda yeniden karşılaşacağız. 💡"
notifications:
  morning: "Bugün: bilgi, merak, hesap, matbaa ve ampul 💡"
  evening: "\"Knowledges\" diye bir kelime var mı? 🤔"
  review: "Wonder mı, wander mı? Hangisi merak etmek? 🌌"
mini:                     # kısa Türkçe sahne, hedef ifade İngilizce
  - item: U9-016
    durum: "Kütüphaneye yeni kitaplar geldi; Murat Bey kutuyu masaya koyuyor."
    lines:
      - { speaker: "Murat Bey", text: "<en>{U9-016|Knowledge} is power.</en>" }
      - { speaker: "Kaan", text: "Hocam, güç için tost yetmiyor mu?" }
  - item: U9-017
    durum: "Teneffüste Elif başını kaldırmış gökyüzüne bakıyor."
    lines:
      - { speaker: "Elif", text: "<en>I {U9-017|wonder} why the sky is blue.</en>" }
      - { speaker: "Duru", text: "Ben de Fıstık neden her şeye havlıyor, onu." }
  - item: U9-018
    durum: "Bora kantinde tost, ayran ve çikolatayı tezgâha diziyor."
    lines:
      - { speaker: "Bora", text: "<en>Can you {U9-018|calculate} the total?</en>" }
      - { speaker: "Ece", text: "Gerek yok. Cebinde üç lira var, sonuç belli." }
  - item: U9-019
    durum: "Okul dergisinin yeni sayısı dağıtılıyor; Selin eve koşarak geliyor."
    lines:
      - { speaker: "Selin", text: "<en>They {U9-019|published} my story in the school magazine!</en>" }
      - { speaker: "Emre", text: "Benim rap sözlerimi koymadılar." }
      - { speaker: "Selin", text: "Dergi sessizdir, Emre." }
  - item: U9-020
    durum: "Sınıfın tavanındaki lamba yanıp sönüyor; Yılmaz Amca merdivenle geliyor."
    lines:
      - { speaker: "Yılmaz Amca", text: "<en>The {U9-020|light bulb} is broken.</en>" }
      - { speaker: "Kaan", text: "Ders iptal mi?" }
      - { speaker: "Yılmaz Amca", text: "İki dakikaya yanar, otur." }
