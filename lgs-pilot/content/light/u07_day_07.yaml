    durum: "Efes'te sınıf, mermer sütunların arasında yürüyor."
    lines:
      - { speaker: "Rehber", text: "Bu sokaklar iki bin yıldan daha eski. <en>Ephesus is an {U7-030|ancient} city.</en>" }
      - { speaker: "Bora", text: "İki bin yıl mı? Dedemden bile yaşlı!" }
