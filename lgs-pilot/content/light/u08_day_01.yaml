schema_version: 1
program: lgs
mode: light
unit: 8
day: 1
status: draft
title: "Ev işlerine giriş"
est_minutes: 7
new_items: [U8-001, U8-002, U8-003, U8-004, U8-005]
steps:
  - item: U8-001
    card:
      example_en: "I help my parents with the household chores every weekend."
      example_tr: "Hafta sonları ailemin ev işlerine yardım ederim."
      note_tr: "chore genelde çoğuldur (chores) ve \"do\" ile kullanılır: do the chores (make the chores değil)."
    kullan:
      id: u8d01-001-k
      type: gap_fill
      prompt: "<en>Choose the best option.</en>"
      stem: "<en>On Saturdays, my sister and I ________ the chores together.</en>"
      options: ["do", "make", "play", "take"]
      answer: 0
      explain: "Ev işleri \"do the chores\" ile söylenir."
    sina:
      id: u8d01-001-s
      type: dialogue_complete
      lgs_like: true
      stem_id: S01
      prompt: "<en>Which of the following completes the dialogue?</en>"
      stem: "<en>Ece: Are you free on Saturday?\nSelin: ________ I have to do the household chores in the morning.</en>"
      options: ["Only in the afternoon.", "Yes, all day.", "No, I'm free in the morning.", "Yes, I'm going to the beach in the morning."]
      answer: 0
      explain: "Selin sabah ev işi yapacak; bu yüzden yalnızca öğleden sonra müsait."
      why_wrong:
        - "Selin sabah ev işi yapacak; bütün gün boş değil."
        - "Sabah ev işi varken \"free in the morning\" cümlenin devamıyla çelişir."
        - "Sabah ev işi yapacaksa aynı anda plajda olamaz."
    tekrar:
      id: u8d01-001-t
      type: situation
      lgs_like: true
      stem_id: S09
      prompt: "<en>Which of the following is a household chore?</en>"
      options: ["Washing the dishes", "Watching a film", "Playing basketball", "Listening to music"]
      answer: 0
      explain: "Bulaşık yıkamak bir ev işidir; diğerleri boş zaman etkinliğidir."
      why_wrong:
        - "Film izlemek boş zaman etkinliğidir, ev işi değil."
        - "Basketbol oynamak spordur, ev işi değil."
        - "Müzik dinlemek boş zaman etkinliğidir, ev işi değil."
  - item: U8-002
    card:
      example_en: "Everyone in our family has a task. My duty is to water the plants."
      example_tr: "Ailemizde herkesin bir görevi var. Benim görevim bitkileri sulamak."
      note_tr: "assignment okulda \"ödev, proje görevi\"; duty daha çok vazife (on duty = nöbette)."
    kullan:
      id: u8d01-002-k
      type: gap_fill
      prompt: "<en>Choose the best option.</en>"
      stem: "<en>Our teacher gave us a new ________: write a short story about our holiday.</en>"
      options: ["assignment", "vacuum", "furniture", "janitor"]
      answer: 0
      explain: "Öğretmenin verdiği yazma ödevi: assignment."
    sina:
      id: u8d01-002-s
      type: text_infer
      lgs_like: true
      stem_id: S08
      prompt: "<en>Who has to prepare the meal?</en>"
      stem: "<en>Mum's note: Everyone has a task today. Ali washes the car, Zeynep cooks the lunch, and Dad does the shopping.</en>"
      options: ["Zeynep", "Ali", "Dad", "Mum"]
      answer: 0
      explain: "Yemeği Zeynep pişiriyor."
      why_wrong:
        - "Ali arabayı yıkıyor: \"washes the car\"."
        - "Dad alışverişi yapıyor: \"does the shopping\"."
        - "Mum notu yazan kişi; yemek işi notta Zeynep'e verilmiş."
    tekrar:
      id: u8d01-002-t
      type: synonym
      lgs_like: true
      stem_id: S12
      prompt: "<en>Which word is closest in meaning to \"task\"?</en>"
      options: ["job", "gift", "rule", "holiday"]
      answer: 0
      explain: "task ≈ job (görev, iş)."
      why_wrong:
        - "gift hediye demektir; task yapılacak bir iştir."
        - "rule kural demektir; task yapılacak bir iştir."
        - "holiday tatildir; task bunun tersine bir iştir."
  - item: U8-003
    card:
      example_en: "Dad does the grocery shopping every Friday."
      example_tr: "Babam her cuma market alışverişini yapar."
      note_tr: "do the shopping / do the grocery shopping kalıbı: \"make shopping\" denmez."
    kullan:
      id: u8d01-003-k
      type: gap_fill
      prompt: "<en>Choose the best option.</en>"
      stem: "<en>We have no milk or bread. I'll ________ the grocery shopping after school.</en>"
      options: ["do", "make", "give", "cook"]
      answer: 0
      explain: "Alışveriş yapmak: do the (grocery) shopping."
    sina:
      id: u8d01-003-s
      type: dialogue_complete
      lgs_like: true
      stem_id: S01
      prompt: "<en>Which of the following completes the dialogue?</en>"
      stem: "<en>Mum: We have no eggs or fruit at home.\nSelin: ________ I'll buy them on my way home.</en>"
      options: ["I'll do the grocery shopping.", "I'll go to the cinema.", "I'll call the doctor.", "I'll write a letter."]
      answer: 0
      explain: "Yumurta ve meyve almak market alışverişidir."
      why_wrong:
        - "Sinema yumurta ve meyve eksiğini çözmez."
        - "Doktoru aramanın evdeki eksiklerle ilgisi yok."
        - "Mektup yazmak yumurta ve meyve getirmez."
    tekrar:
      id: u8d01-003-t
      type: gap_fill
      lgs_like: true
      stem_id: S12
      prompt: "<en>Which one completes the sentence?</en>"
      stem: "<en>You can buy bread, milk and eggs when you do the ________ shopping.</en>"
      options: ["grocery", "chore", "cooker", "dust"]
      answer: 0
      explain: "Ekmek, süt, yumurta için yapılan alışveriş: grocery shopping."
      why_wrong:
        - "chore ev işidir; \"chore shopping\" diye bir kalıp yok."
        - "cooker ocak ya da fırındır; alışverişle ilgisi yok."
        - "dust tozdur; ekmek ve süt alışverişini anlatmaz."
  - item: U8-004
    card:
      example_en: "My mother is a good cook. She cooks dinner every evening."
      example_tr: "Annem iyi bir aşçıdır (iyi yemek yapar). Her akşam akşam yemeği pişirir."
      note_tr: "cook hem fiil hem isimdir (aşçı). cooker = ocak, fırın; aşçı DEĞİL!"
    kullan:
      id: u8d01-004-k
      type: gap_fill
      prompt: "<en>Choose the best option.</en>"
      stem: "<en>My father is a very good ________. His soup is delicious.</en>"
      options: ["cook", "cooker", "cooked", "cooking"]
      answer: 0
      explain: "\"a good cook\" = iyi yemek yapan kişi. cooker bir cihazdır."
    sina:
      id: u8d01-004-s
      type: situation
      lgs_like: true
      stem_id: S10
      prompt: "<en>Which sentence is correct?</en>"
      options: ["The cook is making dinner in the kitchen.", "The cooker is making dinner in the kitchen.", "The cooked is making dinner in the kitchen.", "The cooking is making dinner in the kitchen."]
      answer: 0
      explain: "Yemek yapan kişi cook'tur; cooker ocak/fırındır."
      why_wrong:
        - "cooker bir cihazdır; yemek yapan kişi değildir."
        - "cooked fiilin geçmiş biçimidir; özne olamaz."
        - "cooking yemek yapma eylemidir; yemek yapan kişi değildir."
    tekrar:
      id: u8d01-004-t
      type: situation
      lgs_like: true
      stem_id: S09
      prompt: "<en>What is a cooker?</en>"
      options: ["A machine with hot plates used for cooking", "A person who cooks in a restaurant", "A big bowl for soup", "A kind of vegetable"]
      answer: 0
      explain: "cooker = pişirme cihazı (ocak/fırın); aşçı cook'tur."
      why_wrong:
        - "Yemek yapan kişi cook'tur; cooker bir cihazdır."
        - "Çorba kâsesi bowl'dur; cooker değil."
        - "cooker yiyecek değil, mutfak cihazıdır."
  - item: U8-005
    card:
      example_en: "Please set the table. Dinner is ready."
      example_tr: "Lütfen sofrayı kur. Yemek hazır."
      note_tr: "set the table = sofrayı kurmak; clear the table = sofrayı toplamak."
    kullan:
      id: u8d01-005-k
      type: gap_fill
      prompt: "<en>Choose the best option.</en>"
      stem: "<en>Before dinner, Elif puts the plates, forks and glasses on the table. She ________ the table.</en>"
      options: ["sets", "makes", "does", "plays"]
      answer: 0
      explain: "Yemekten önce sofrayı kurmak: set the table."
    sina:
      id: u8d01-005-s
      type: dialogue_complete
      lgs_like: true
      stem_id: S01
      prompt: "<en>Which of the following completes the dialogue?</en>"
      stem: "<en>Mum: Dinner is almost ready.\nDuru: ________ I'll put the plates and forks on the table.</en>"
      options: ["Let me set the table.", "Let me clear the table.", "Let me do the laundry.", "Let me take out the rubbish."]
      answer: 0
      explain: "Tabak ve çatalları masaya koymak sofrayı kurmaktır; clear the table yemekten sonra toplamaktır."
      why_wrong:
        - "clear the table yemekten sonra toplamaktır; yemek daha yenmedi."
        - "Çamaşırın tabak ve çatalla ilgisi yok."
        - "Çöpü çıkarmak tabakları masaya koymak değildir."
    tekrar:
      id: u8d01-005-t
      type: situation
      lgs_like: true
      stem_id: S09
      prompt: "<en>Which expression means \"to put plates and forks on the table before a meal\"?</en>"
      options: ["set the table", "clear the table", "wash the table", "break the table"]
      answer: 0
      explain: "Yemekten önce sofra hazırlamak: set the table."
      why_wrong:
        - "clear the table yemekten sonra masayı toplamaktır."
        - "Masayı yıkamak tabak koymak anlamına gelmez."
        - "break kırmak demektir; sofra hazırlığıyla ilgisi yok."
tips:
  - type: tuzak
    refs: [U8-004]
    text: "cooker aşçı değil, ocak ya da fırındır. Aşçı = cook: \"My mother is a good cook.\""
  - type: tuzak
    refs: [U8-001, U8-003]
    text: "do the chores, do the shopping, do the laundry, do the washing up; ama make the bed, make a mess. Hangisi do, hangisi make? Kalıp olarak ezberle."
coach:
  start: "Yeni ünite: Chores! Bugün ev işlerinin ilk kelimeleri. Eldivenlerini tak 🧤"
  end_good: "Harika! Ev işleri kelimelerinde ilk adımı attın 🧤 Yarın mutfak başlıyor."
  end_mixed: "Fena değil! {weak} biraz karıştı; yarın tekrarda yeniden karşılaşacağız. 🧤"
notifications:
  morning: "Yeni ünite Chores! Bugün: ev işleri, görev, market ve sofra 🧤"
  evening: "\"Cook\" aşçı mı, ocak mı? \"Cooker\" ise? 🍳"
  review: "Ev işleri için hangi fiil: do mu, make mi? 🤔"
mini:                     # kısa Türkçe sahne, hedef ifade İngilizce
  - item: U8-001
    durum: "Cumartesi sabahı Selin'in babası buzdolabına uzun bir liste asıyor; Emre listeyi görünce odasına doğru kayboluyor."
    lines:
      - { speaker: "Selin", text: "Emre, nereye? Bugün herkes <en>{U8-001|household chores}</en> için evde!" }
      - { speaker: "Selin'in babası", text: "Liste uzun ama öğlene biter. Sonra da dondurma." }
  - item: U8-002
    durum: "Murat Bey tahtaya yeni bir proje yazıyor; Kaan elindeki kalemi bırakıyor."
    lines:
      - { speaker: "Murat Bey", text: "<en>Your {U8-002|assignment} is a short poster about your home.</en> Cuma günü isterim." }
      - { speaker: "Kaan", text: "Cuma mı? Hocam, benim poster daha kâğıdını bile seçmedi!" }
  - item: U8-003
    durum: "Ece'nin annesi kapıda elinde bir listeyle; buzdolabında yalnız bir limon kaldı."
    lines:
      - { speaker: "Ece'nin annesi", text: "Süt yok, yumurta yok, ekmek yok. <en>Let's {U8-003|do the grocery shopping}!</en>" }
      - { speaker: "Ece", text: "Arabayı bu sefer ben iteceğim. Çikolata rafının önünden de geçeriz, değil mi?" }
  - item: U8-004
    durum: "Bora mutfakta; tencereden garip bir koku yükseliyor."
    lines:
      - { speaker: "Bora", text: "Annem bu gece nöbette, merak etme dede. <en>I can {U8-004|cook} dinner!</en>" }
      - { speaker: "Dedesi", text: "Ocağı kapat evlat, ben pideciyi arıyorum." }
  - item: U8-005
    durum: "Misafirlere on dakika var; Duru'nun annesi mutfaktan sesleniyor, tabaklar hâlâ dolapta."
    lines:
      - { speaker: "Duru'nun annesi", text: "Duru, geliyorlar! <en>Please {U8-005|set the table}.</en>" }
      - { speaker: "Duru", text: "Tamam, tamam. Çatal solda mıydı, sağda mı?" }
