- id: U9-036
  unit: 9
  theme: Geçmiş, şimdi ve neden–sonuç kalıpları
  display: Who invented / discovered …? – X invented … in (year). (the inventor of …)
  kind: pattern
  class: pattern
  meaning_tr: Kim icat etti / keşfetti? – X … yılında … icat etti. (… mucidi)
  priority: 1
  variants:
  - who invented
  trap_note: 'Who özne ise did kullanılmaz: Who invented the telephone? (Who did invent … yanlış); yıl için in 1876'
  meaning_ban:
  - icat etti
  - keşfetti
  - mucidi
- id: U9-037
  unit: 9
  theme: Geçmiş, şimdi ve neden–sonuç kalıpları
  display: was / were invented / discovered by … (Simple Past Passive, tanıma)
  kind: pattern
  class: pattern
  meaning_tr: … tarafından icat edildi / keşfedildi (geçmiş zaman edilgen)
  priority: 1
  variants:
  - was invented by
  trap_note: 'was / were + V3 (+ by): The telephone was invented by Bell in 1876. Etken: Bell invented the telephone. Tanıma düzeyi (Ü3 Simple Present Passive ile)'
  meaning_ban:
  - edildi
  - tarafından
- id: U9-038
  unit: 9
  theme: Geçmiş, şimdi ve neden–sonuç kalıpları
  display: was born in … / grew up / passed away (died) in … / at the age of …
  kind: pattern
  class: pattern
  meaning_tr: … doğdu / büyüdü / … vefat etti (öldü) / … yaşında
  priority: 1
  variants:
  - childhood
  - pass away
  - was born in
  trap_note: 'be born hep edilgen: I was born in 2012 (I born yanlış); pass away = die (kibar); pass (geçmek) ile karıştırma; childhood = çocukluk'
  meaning_ban:
  - doğdu
  - vefat
  - yaşında
  - büyüdü
  - çocukluk
- id: U9-039
  unit: 9
  theme: Geçmiş, şimdi ve neden–sonuç kalıpları
  display: now / at the moment / currently / these days (Present Continuous)
  kind: pattern
  class: pattern
  meaning_tr: şimdi / şu anda / şu sıralar (şimdiki zaman)
  priority: 1
  variants:
  - currently
  - now / at the moment
  trap_note: 'am / is / are + V-ing: Scientists are working on it at the moment. Geçmişle karşıtlık: In 1928 Fleming discovered …; now scientists are …'
  meaning_ban:
  - şimdi
  - şu anda
  - şu sıra
