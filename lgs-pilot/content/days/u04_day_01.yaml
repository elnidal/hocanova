tips:
  - type: tuzak
    refs: [U4-031]
    text: "Telefonda \"Speaking.\" = \"Benim, buyurun.\" (konuşuyorum demek değil!). Kendini tanıtırken \"I am Ece\" değil, \"This is Ece\" ya da \"It's Ece\" denir. Örnek: \"Hello, Duru speaking.\""
  - type: tuzak
    refs: [U4-011, U2-048]
    text: "pick up Ü2'de \"arabayla almak\" (My dad picks me up) ve \"yerden almak\" demekti. Çalan bir telefon için söylenirse: telefonu açmak. Aynı işi answer the phone da görür."
  - type: tuzak
    refs: [U4-013]
    text: "ring isim olarak \"yüzük\"; fiil olarak telefonun çalması ya da birini telefonla aramak. \"Give me a ring!\" = \"Beni ara!\" Kimse senden yüzük istemiyor. 💍"
  - type: mini_dilbilgisi
    refs: [U4-022]
    text: "Telefon çaldığı ANDA verilen karar will ile kurulur: \"I'll take that!\", \"I'll get her.\" \"I take that\" yanlış olur, çünkü karar o saniyede veriliyor."

