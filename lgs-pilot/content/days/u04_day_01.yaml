story:
  - id: s01
    text: "Yarıyıl tatilinin ilk sabahı, Bursa. Ece teyzesinin evinde bavulunu daha yeni açmıştı ki küçük kardeşi elinde Ece'nin telefonuyla salondan koşa koşa geldi: \"<en>Ece! It's {U4-013|ringing}! {U4-022|I'll take that}!</en>\""
  - id: s02
    text: "Ece telefonu son anda kaptı. Ekranda bilinmeyen bir numara vardı. \"<en>Hello?</en>\" Karşıdan hızlı, neşeli bir kadın sesi geldi: \"<en>Hello! Is that Ece? {U4-031|This is} Sevim, from the cake shop across from the park!</en>\""
  - id: s03
    text: "Sevim Hanım nefes almadan konuşuyordu: \"<en>I saw your video from the cooking contest. Your {U2-019|band} is wonderful! Can you play a mini concert at my shop? On the last Saturday of the holiday, in the evening!</en>\""
  - id: s04
    text: "Ece'nin eli titredi: \"<en>{U4-007|Hold on}, Sevim Hanım! I need my notebook!</en>\" Defter, kalem, üç renk fosforlu kalem… Ece on saniyede hazırdı."
  - id: s05
    text: "\"<en>Yes, we can play! I'm… I'm the manager of the {U2-019|band}!</en>\" Menajer mi? Bunu o an uydurmuştu. Bir zamanlar şarkıcı olmayı kabul etmişti; ama şimdi anlıyordu ki onun yeri mikrofonun başı değil, plan defterinin başıydı."
  - id: s06
    text: "Konuşma biter bitmez sınıf grubuna yazdı: \"<en>BIG NEWS! We have a real concert! Your new manager is on it.</en>\" Yarım saat geçti. İki gri tik. Kimse görmemişti bile."
  - id: s07
    text: "Ece önce Duru'yu denedi. Duru'nun cep telefonu, her tatilde olduğu gibi, sessizdeydi. Ece ev numarasını aradı ve sabırsızca söylendi: \"<en>Come on, Duru, {U4-011|pick up}! {U4-011|Pick up}!</en>\""
  - id: s08
    text: "Hattın öbür ucundan, arkada Mozart çalan bir ses geldi: Duru'nun annesi. \"<en>Hello? {U4-031|Who's calling}, please?</en>\""
  - id: s09
    text: "Ece en kibar sesini takındı: \"<en>Hello! {U4-031|This is Ece}, Duru's friend. {U4-026|May I speak to} Duru, please?</en>\""
  - id: s10
    text: "\"<en>Of course, Ece! {U4-007|Hang on a minute}. {U4-022|I'll get her}.</en>\" Ece uzaklaşan terlik seslerini, sonra salondan gelen sesi duydu: \"<en>Duru! It's for you! It's Ece!</en>\""
  - id: s11
    text: "Duru kanepede, battaniyenin altındaydı; Fıstık da ayak ucunda horluyordu. Duru gözlerini bile açmadı: \"<en>Mum, I'm on holiday. I'm a {U1-079|laid-back} person. I don't {U4-011|pick up} on holidays. It's my rule.</en>\""
  - id: s12
    text: "Annesi ahizeyi kanepenin üstüne bıraktı ve mutfağa döndü. Tam o sırada Fıstık uyandı, ahizeyi ağzına aldı ve kuyruğunu sallayarak salonun ortasına taşıdı."
  - id: s13
    text: "Ece hattın öbür ucunda hızlı hızlı bir soluma duydu: \"<en>Hello? Duru? Is that you?</en>\" Gelen tek ses: \"<en>Woof!</en>\""
  - id: s14
    text: "Ece bir an düşündü, sonra çok ciddi bir sesle: \"<en>Hello, Fıstık. {U4-026|Could I speak to} your owner, please? It's very important.</en>\" Fıstık: \"<en>Woof! Woof!</en>\" Ece: \"<en>Is that a yes or a no?</en>\""
  - id: s15
    text: "Sonunda Duru kanepeden ağır ağır kalktı ve ahizeyi Fıstık'ın ağzından kurtardı: \"<en>Hi. Duru {U4-031|speaking}. Sorry, Fıstık wants to be the manager too.</en>\""
  - id: s16
    text: "Ece her şeyi anlattı: konser, pastane, tatilin son cumartesisi. Duru: \"<en>A concert? Hmm. I don't m…</en>\" Ece: \"<en>Don't say 'I don't mind'! Say yes!</en>\" Duru iç çekti: \"<en>OK. Yes. Can I go back to my sofa now?</en>\""
  - id: s17
    text: "Sıra Bora'daydı. Bora'nın evinde ev telefonunun sesiyle iki kişi birden fırladı: Bora ve dedesi. Bora: \"<en>{U4-022|I'll take that}!</en>\" Dedesi: \"<en>No, no! When it {U4-013|rings}, I {U4-011|answer}. That's the rule in this house!</en>\""
  - id: s18
    text: "Dedesi daha hızlıydı: \"<en>Hello! Bora's grandpa {U4-031|speaking}. Young lady, do you like {U2-024|jazz}?</en>\" Ece şaşırdı: \"<en>Er… hello. {U4-026|Can I speak to} Bora, please?</en>\""
  - id: s19
    text: "Dede: \"<en>Of course. But first, listen to this!</en>\" Ve telefona bir saksafon kaydı tuttu. Tam üç dakika. Ece defterine yazdı: \"<en>Bora's grandpa: loves the saxophone. Very much.</en>\""
  - id: s20
    text: "Sonunda Bora ahizeyi kaptı: \"<en>Sorry, Ece! He does that to everyone. {U4-007|Hang on a sec}, I'm going to my room.</en>\""
  - id: s21
    text: "Bora konseri duyunca önce sevinçle bağırdı, sonra birden sustu: \"<en>A real concert… with real drums? Ece, I don't have drums. Only Mum's {U3-041|pans}!</en>\" Sonra derin bir nefes aldı: \"<en>Don't worry. I'll find some drums. Leave it to me!</en>\""
  - id: s22
    text: "Geriye Kaan kalıyordu. Ece numarayı iki kez denedi. İkisinde de aynı kısa, inatçı ses: düt… düt… düt… Sonunda yazdı: \"<en>Kaan! Give me a {U4-013|ring}! Today!</en>\""
  - id: s23
    text: "Gece yarısı Duru'dan sınıf grubuna tek bir mesaj düştü: \"<en>Good news: Fıstık can {U4-011|answer} now. Bad news: he only speaks Dog.</en>\""

