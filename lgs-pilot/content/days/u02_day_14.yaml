      - "\"Excited\" heyecanlı demek; uykusuz ve kızgın biri için uymaz."
      - "\"Fascinated\" büyülenmiş demek; köpek havlaması Ece'yi büyülemiyor, kızdırıyor."

tips:
  - type: mini_dilbilgisi
    refs: [U2-079, U2-080, U2-081]
    text: "Üç fiil, üç kalıp: recommend + isim (\"I recommend this book.\") · suggest + -ing (\"I suggest watching it.\") · advise + kişi + to (\"He advised me to rest.\"). Dikkat: \"suggest me to…\" yanlış!"
  - type: tuzak
    refs: [U2-081, U1-035]
    text: "advise (fiil, sonu /z/ sesiyle: \"advayz\") ≠ advice (isim, sonu /s/ sesiyle: \"advays\"). \"She advised me.\" ama \"She gave me advice.\""
  - type: kelime_ailesi
    refs: [U2-082, U2-083]
    text: "educate (eğitmek) → education (eğitim) → educational (eğitici) · entertain (eğlendirmek) → entertainment (eğlence) → entertaining (eğlendirici)."
  - type: lgs_taktigi
    refs: [U2-079, U2-080]
    text: "LGS'de \"Can you recommend…?\" sorusunun cevabı genelde \"Try…\", \"You should…\" ya da \"Why don't you…?\" ile başlar. Diyalog tamamlamada bu ipuçlarını ara."

coach:
