story:
  - id: s01
    text: "Pazartesi sabahı. Murat Bey sınıfa girer girmez sordu: \"<en>How is your Teen Life Survey going?</en>\""
  - id: s02
    text: "Ece hemen ayağa kalktı: \"<en>Great! Question 5 is: What do you watch at home? Most people said films.</en>\""
  - id: s03
    text: "Murat Bey gülümsedi: \"<en>Films are great. But today I want to {U2-079|recommend} something different: a documentary called 'Blue Planet'.</en>\""
  - id: s04
    text: "Kaan inledi: \"<en>A documentary? Sir, documentaries are so slow!</en>\" Murat Bey başını salladı: \"<en>Not this one. It's very {U2-082|educational}. You learn about the ocean, and the animals are {U2-077|fascinating}.</en>\""
  - id: s05
    text: "Kaan yine de ikna olmadı: \"<en>But I want something {U2-083|entertaining}. Explosions! Spaceships! Car chases!</en>\""
  - id: s06
    text: "Bora atıldı: \"<en>Like 'Planet Zero'! That film was {U2-074|awesome}!</en>\" Murat Bey kaşını kaldırdı: \"<en>Hmm. Was it {U2-082|educational} too?</en>\" Bora düşündü: \"<en>Well… I learnt that aliens can't sing.</en>\" Sınıf kahkahalara boğuldu."
  - id: s07
    text: "Selin parmak kaldırdı: \"<en>Why not both? Some documentaries are {U2-082|educational} and {U2-083|entertaining} at the same time.</en>\""
  - id: s08
    text: "Murat Bey tahtaya bir soru yazdı: \"<en>Good point, Selin. I {U2-080|suggest} adding a new question to your survey: Do you prefer educational or entertaining programmes?</en>\""
  - id: s09
    text: "Ece soruyu defterine geçirdi, sonra biraz çekinerek sordu: \"<en>Sir, can you {U2-079|recommend} a documentary about {U2-061|fashion}?</en>\""
  - id: s10
    text: "Murat Bey bir an düşündü: \"<en>Yes! 'A Hundred Years of Style'. It shows how {U2-062|trendy} clothes changed from 1920 to today.</en>\""
  - id: s11
    text: "Ece'nin gözleri parladı: \"<en>Perfect! I always {U2-063|keep up with the latest fashion}, but I don't know its history.</en>\""
  - id: s12
    text: "Kaan, Bora'ya fısıldadı: \"<en>Ece is so {U1-038|interested in} clothes. She has a new {U2-066|outfit} every day!</en>\""
  - id: s13
    text: "Ece duydu tabii: \"<en>Not every day! On Mondays I wear {U2-064|casual clothes}. Look: jeans and a hoodie.</en>\""
  - id: s14
    text: "Murat Bey güldü: \"<en>In that documentary, people wear {U2-065|smart clothes} even at the beach. Suits and hats in the sea!</en>\" Bora: \"<en>Now that sounds {U2-083|entertaining}!</en>\""
  - id: s15
    text: "Duru arka sıradan elini kaldırdı: \"<en>Sir, what about books? Can you {U2-079|recommend} a book? A short one, please.</en>\""
  - id: s16
    text: "Murat Bey tahtaya bir kitap adı yazdı: \"<en>This one is about a dog. He travels across Türkiye alone. It's short and very funny.</en>\" Duru ilk kez dik oturdu: \"<en>A dog? OK, I'm listening.</en>\""
  - id: s17
    text: "Ama Kaan ile Selin hâlâ geri adım atmıyordu. Kaan kollarını kavuşturdu: \"<en>You're so {U1-091|stubborn}, Selin!</en>\" Selin: \"<en>Me? You're the {U1-091|stubborn} one!</en>\""
  - id: s18
    text: "Murat Bey araya girdi: \"<en>Can I {U2-081|advise} you both? Don't talk about it now. Watch the documentary first, then talk again.</en>\""
  - id: s19
    text: "Bora parmak kaldırdı: \"<en>Then I {U2-080|suggest} watching it together at school! In the library, with snacks!</en>\" Herkes alkışladı; atıştırmalık kısmı Murat Bey'i pek ikna etmedi."
  - id: s20
    text: "Perşembe öğle arası belgesel kütüphanede izlendi. Ekranda karanlıkta ışık saçan bir balık belirince Kaan yerinden fırladı: \"<en>Wow! A fish with lights! That's {U2-077|fascinating}!</en>\""
  - id: s21
    text: "Film bitince Selin, Kaan'a döndü: \"<en>So? Was it {U2-083|entertaining} or {U2-082|educational}?</en>\" Kaan sırıttı: \"<en>Both! OK, you win.</en>\" Selin: \"<en>See? We have the {U1-042|same opinion} now!</en>\""
  - id: s22
    text: "Kaan, Murat Bey'e döndü: \"<en>Sir, you were right. Next time, please {U2-080|suggest} a film AND a documentary!</en>\""
  - id: s23
    text: "Murat Bey gülümsedi: \"<en>Deal. And I {U2-081|advise} you all to write this in your survey report.</en>\""
  - id: s24
    text: "Akşam Bora sınıf grubuna yazdı: \"<en>My mum always {U2-081|advises} me to read more. Now I have a list from Murat Bey. She's very happy!</en>\" Duru cevap verdi: \"<en>I'm reading the dog book. Page 3. Don't rush me.</en>\""

scene:
  - id: c01
    speaker: Duru
    text: "<en>Sir, can you recommend a good book?</en>"
  - id: c02
    speaker: Murat Bey
    text: "<en>Sure. I suggest reading this one. It's about a dog, and it's very funny.</en>"
  - id: c03
    speaker: Kaan
    text: "<en>Is it educational or entertaining?</en>"
  - id: c04
    speaker: Murat Bey
    text: "<en>Both! And I advise you to read a little every night.</en>"

