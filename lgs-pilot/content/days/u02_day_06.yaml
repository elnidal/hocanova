tips:
  - type: tuzak
    refs: [U2-033]
    text: "train isim olunca tren: \"The train is late.\" Fiil olunca antrenman yapmak: \"The team trains every day.\" trainer = antrenör. İngiliz İngilizcesinde trainers ise spor ayakkabısı demek!"
  - type: tuzak
    refs: [U2-034]
    text: "fit = formda, sağlıklı: \"You look fit!\" Ama fit fiil olunca \"(beden) uymak\" anlamına gelir: \"These jeans don't fit me.\" = Bu kot bana olmuyor."
  - type: mini_dilbilgisi
    refs: [U2-032]
    text: "work out iki kelimelik bir fiil: \"I work out every morning.\" Bitişik yazılan workout ise isim: \"a 30-minute workout\". Dikkat: work tek başına \"çalışmak\" demek; out gelince anlam değişiyor."
  - type: lgs_taktigi
    refs: [U2-036, U2-031]
    text: "Soruda players, team, pass the ball, win together gibi ipuçları varsa cevap team sport. Weights, running machines, coach gibi kelimeler ise seni gym'e götürür."

