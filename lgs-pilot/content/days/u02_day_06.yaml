story:
  - id: s01
    text: "Pazartesi sabahı okul panosunda yeni bir ilan vardı: \"<en>School basketball team: new players wanted! Tryouts on 2 December.</en>\" Kaan ilanı okudu ve gözleri parladı."
  - id: s02
    text: "Kaan: \"<en>I'm {U2-015|crazy about} basketball! This is my big chance!</en>\""
  - id: s03
    text: "Selin: \"<en>Kaan, last week you were crazy about volleyball. And football.</en>\" Kaan: \"<en>So? I love every {U2-036|team sport}. Playing alone is no fun.</en>\""
  - id: s04
    text: "Kaan: \"<en>But the tryouts are in two weeks. I need to get stronger. I'm going to join a {U2-031|gym}!</en>\""
  - id: s05
    text: "O akşam Kaan, iki sokak ötedeki yere yazıldı: <en>City {U2-031|Gym}</en>. Ve tabii ki ilk güne on dakika geç kaldı."
  - id: s06
    text: "Oradaki koç Cem Abi kollarını kavuşturdu: \"<en>So, Kaan. How often do you {U2-032|work out}?</en>\""
  - id: s07
    text: "Kaan: \"<en>{U2-032|Work out}? Hmm… I run to the bus every morning. Does that count?</en>\""
  - id: s08
    text: "Cem Abi: \"<en>OK. Then we'll {U2-033|train} three times a week: legs, arms and a lot of running.</en>\""
  - id: s09
    text: "Ertesi gün Kaan sınıfa robot gibi yürüyerek geldi. Kolları, bacakları, hatta kulakları bile ağrıyordu."
  - id: s10
    text: "Bora: \"<en>What happened to you? You walk like a robot!</en>\" Kaan: \"<en>I {U2-032|worked out} for two hours yesterday. Everything hurts!</en>\""
  - id: s11
    text: "Ece: \"<en>Two hours on the first day? Kaan, {U1-075|you're always in a hurry}!</en>\""
  - id: s12
    text: "Kaan: \"<en>{U2-018|To be honest}, I {U2-014|hate} the leg exercises. But I really want a place on the team.</en>\""
  - id: s13
    text: "Selin: \"<en>My cousin plays basketball. She {U2-033|trains} every day, but only for one hour. Slow and regular.</en>\""
  - id: s14
    text: "Duru kanepe yerine sırasına yayılmıştı: \"<en>I {U2-013|can't stand} running. A {U2-036|team sport}? Too many people, too much shouting. I'm only {U2-016|into} sleeping.</en>\""
  - id: s15
    text: "Bir hafta boyunca Kaan hiç pes etmedi. Hatta bir mucize oldu: iki kez okula zamanında geldi!"
  - id: s16
    text: "Cuma günü Kaan aynanın karşısında çektiği bir fotoğrafı gruba attı: \"<en>Be honest. Do I {U2-034|look fit}? 💪</en>\""
  - id: s17
    text: "Bora: \"<en>You {U2-034|look fit}, buddy! But why are you making that face?</en>\" Kaan: \"<en>I'm showing my muscles!</en>\" Bora: \"<en>Oh. I thought you had a stomachache.</en>\""
  - id: s18
    text: "Elif: \"<en>Your face is so {U1-073|funny} in this photo, Kaan! 😂 But you're really {U2-035|energetic} these days. Yesterday you ran up all five floors!</en>\""
  - id: s19
    text: "Ece: \"<en>I {U2-017|admire} you, Kaan. You go to the {U2-031|gym} at 7 in the morning now. On a school day!</en>\""
  - id: s20
    text: "Ama Selin, her zamanki gibi, işin akıllıca tarafını gördü."
  - id: s21
    text: "Selin: \"<en>Kaan, you can't {U2-033|train} every day before the tryouts. Your body needs a break too.</en>\""
  - id: s22
    text: "Kaan: \"<en>Don't worry. I'm {U1-090|self-disciplined} now. Gym on Monday, Wednesday and Friday. Sleep on the other days!</en>\""
  - id: s23
    text: "Duru: \"<en>Finally, a sports plan I {U2-007|like}: sleep on the other days.</en>\""
  - id: s24
    text: "Cuma akşamı Kaan okul bahçesinde yirmi atış yaptı, on dördü sepete girdi. Telefonuna Cem Abi'den bir mesaj geldi:"
  - id: s25
    text: "\"<en>Great job, Kaan! You {U2-034|look fit} and {U2-035|energetic}. Basketball is a {U2-036|team sport}, so practise passing with your friends too. See you on Monday – on time!</en>\""
  - id: s26
    text: "Kaan: \"<en>On time? Now that's the hard part!</en>\" Selin: \"<en>An {U2-035|energetic} player who is never on time. Classic Kaan.</en>\""

scene:
  - id: c01
    speaker: Cem Abi
    text: "<en>Welcome to the gym, Kaan! How often do you work out?</en>"
  - id: c02
    speaker: Kaan
    text: "<en>Not often. But I want to look fit for the basketball tryouts.</en>"
  - id: c03
    speaker: Cem Abi
    text: "<en>Then we'll train three times a week. Basketball is a team sport, so you need to be fast and energetic.</en>"
  - id: c04
    speaker: Kaan
    text: "<en>Great! Can we start tomorrow… at 10?</en>"

