story:
  - id: s01
    text: "Çarşamba akşamüstü, Ece'nin evi. Kek volkanından beri Ece kararlıydı: bu hafta hiçbir şey kabarmayacak, hiçbir şey taşmayacaktı."
  - id: s02
    text: "Ece: \"<en>Today's plan: Gavurdağı salad. No {U3-040|oven}, no fire, no volcano. Just a big {U3-038|bowl} and a lot of vegetables.</en>\""
  - id: s03
    text: "Selin {U3-050|recipe} kartını tezgâha yapıştırdı ve okudu: \"<en>{U3-048|Ingredients}: tomatoes, cucumbers, an onion, parsley, walnuts, a lemon, salt and black {U3-049|pepper}.</en>\""
  - id: s04
    text: "Elif buzdolabından iki uzun, yeşil şey çıkardı: \"<en>And green {U3-049|peppers}! Every good salad needs a little green {U3-049|pepper}.</en>\""
  - id: s05
    text: "Selin kaşını kaldırdı: \"<en>Green {U3-049|peppers} aren't on the card!</en>\" Elif: \"<en>Now they are!</en>\" Ece'nin annesi gülümseyerek bıçakları dağıttı."
  - id: s06
    text: "Ece'nin annesi: \"<en>Knives only when I'm here, OK? Slowly, please. This isn't a race.</en>\""
  - id: s07
    text: "Selin: \"<en>{U3-052|Step} one. {U3-045|First}, {U3-019|peel} the onion and the cucumbers.</en>\" Ece soğanı eline aldı; iki saniye içinde gözlerinden yaşlar akıyordu."
  - id: s08
    text: "Ece: \"<en>Why is {U3-019|peeling} an onion so emotional?!</en>\" Elif: \"<en>Sing while you work! It helps!</en>\""
  - id: s09
    text: "Selin: \"<en>{U3-045|Then}, {U3-022|slice} the cucumbers. Thin {U3-022|slices}, please, not thick ones.</en>\" Elif salatalıkları kâğıt inceliğinde kesti, bir yandan da şarkı söylüyordu."
  - id: s10
    text: "Tam o sırada kapı çaldı. Gelen Kaan'dı, nefes nefese: \"<en>Hi! I'm not a spy! I just need some salt for my team. Bye! Actually… what are you making? Can I have a {U3-022|slice} of cucumber?</en>\""
  - id: s11
    text: "Ece: \"<en>Kaan, you're {U1-075|always in a hurry}. Sit down and watch. Maybe you'll learn something.</en>\""
  - id: s12
    text: "Selin: \"<en>{U3-045|Next}, {U3-010|chop} the tomatoes and {U3-010|dice} the onion. Very small pieces.</en>\""
  - id: s13
    text: "Kaan: \"<en>{U3-010|Dice}? Like in a board game?</en>\" Elif: \"<en>Yes! Little cubes, like {U3-010|dice}!</en>\""
  - id: s14
    text: "Ece'nin annesi maydanozu aldı: \"<en>I'll {U3-010|chop} the parsley. This knife is very sharp.</en>\" Ece ise minicik küpleri tek tek kontrol ediyordu."
  - id: s15
    text: "Ece: \"<en>Mum, are all the cubes the same size? They must be perfect.</en>\" Annesi: \"<en>Ece, it's a salad, not a maths exam.</en>\""
  - id: s16
    text: "Selin: \"<en>{U3-045|After that}, {U3-025|squeeze} the lemon over the vegetables. Exactly one lemon. I {U2-084|follow the rules}, you know.</en>\""
  - id: s17
    text: "Elif limonu iki avucunun arasına aldı ve bütün gücüyle bastırdı. Fışşş! Limon suyu dosdoğru Kaan'ın gözüne gitti."
  - id: s18
    text: "Kaan: \"<en>My eye! My eye! Who {U3-025|squeezes} a lemon like that?!</en>\" Elif: \"<en>Sorry, sorry! I {U3-025|squeezed} it with love!</en>\""
  - id: s19
    text: "Ece'nin annesi Kaan'ı hemen lavaboya götürdü, gözünü bol suyla yıkadı. Kaan tek gözü kapalı geri geldi: \"<en>I'm OK. I can see… half of the salad.</en>\""
  - id: s20
    text: "Selin: \"<en>{U3-045|Finally}, {U3-021|season} the salad with salt and {U3-049|pepper}.</en>\""
  - id: s21
    text: "Kaan'ın açık kalan tek gözü kocaman oldu: \"<en>{U3-021|Season}? Which season? Is it a winter salad? It's December!</en>\""
  - id: s22
    text: "Selin sadece kaşını kaldırdı. Ece'nin annesi gülerek açıkladı: \"<en>Here it's a verb, Kaan. You {U3-021|season} food with salt and {U3-049|pepper}.</en>\""
  - id: s23
    text: "Derken Kaan'a son salatalığı uzattı: \"<en>Now you. {U3-019|Peel} this cucumber. Slowly. Be {U1-085|patient}.</en>\" Kaan, belki de ilk kez, bir işi acele etmeden bitirdi."
  - id: s24
    text: "Salata hazırdı. Ece üstüne ince limon {U3-022|slice}'ları dizdi ve tam kırk fotoğraf çekti."
  - id: s25
    text: "Elif: \"<en>Next time I'll {U3-025|squeeze} the lemon into the {U3-038|bowl}. Not into people's eyes.</en>\" Kaan tuzunu kaptı ve kapıdan tek gözle el salladı."
  - id: s26
    text: "O gece sınıf grubuna Murat Bey'den bir mesaj düştü: \"<en>Tomorrow we play a game in class. Bring a scarf. Don't ask why. 😄</en>\""

scene:
  - id: c01
    speaker: Kaan
    text: "<en>Spy report! Ece's team made a salad. First, they peeled the onion and the cucumbers.</en>"
  - id: c02
    speaker: Bora
    text: "<en>And then?</en>"
  - id: c03
    speaker: Kaan
    text: "<en>They sliced, chopped and diced everything. Then Elif squeezed a lemon… into my eye!</en>"
  - id: c04
    speaker: Duru
    text: "<en>Did they season it with salt and pepper?</en>"
  - id: c05
    speaker: Kaan
    text: "<en>Yes. With salt and pepper, not with winter. I asked.</en>"

