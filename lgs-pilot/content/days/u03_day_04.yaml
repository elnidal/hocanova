tips:
  - type: tuzak
    refs: [U3-021]
    text: "season herkesin bildiği \"mevsim\"; ama tarifte fiildir: \"Season with salt and pepper.\" = Tuz ve karabiberle tatlandır. Cümle başında emir olarak ve with ile geliyorsa takvimde değil, mutfaktasın!"
  - type: tuzak
    refs: [U3-049]
    text: "pepper hem biber hem karabiber: green / red pepper = biber (sebze), black pepper ya da salt and pepper = karabiber. Pul biber ise chilli flakes."
  - type: tuzak
    refs: [U3-010]
    text: "dice isim olarak oyun zarı; tarifte fiil: küp küp doğramak. Zar küp şeklindedir: \"Dice the onion\" = Soğanı zar gibi küçük küpler hâlinde doğra. chop ise genel doğramak."
  - type: lgs_taktigi
    refs: [U3-019, U3-022, U3-045]
    text: "Tarif sırası sorusunda (S07) sıralama sözcüğü yoksa mantığa bak: soymadan dilimlenmez. \"Before you slice it, peel it.\" cümlesinde yazılış sırası ile yapılış sırası terstir: önce peel, sonra slice!"

coach:
  start: "Ece'nin evinde bıçaklar hazır, salata sırada. Ama Kaan neden kapıda ve neden tek gözü kapalı? 🍋"
  end_good: "Harika! Bugün mutfakta hiçbir şey taşmadı, kimse ağlamadı. Soğan hariç 🧅"
  end_mixed: "İyi iş! {weak} biraz göz yaşarttı ama soğan da öyle yapar. Yarın bir tur daha! 🍋"

notifications:
  morning: "Bugün salata günü. Kaan casusluğa çıkıyor; limondan uzak dursa iyi olur 🍋"
  evening: "Kaan 'season' kelimesini duyunca 'Kış mı?' dedi. Neden mi? Derste 😄"
  review: "Tek soru: 'dice the onion' soğanla zar atmak mı, küp küp doğramak mı? 🎲"

