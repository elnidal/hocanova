story:
  - id: s01
    text: "Bursa, Ece'nin teyzesinin evi, öğleden sonra üç. Ece plan defterini açtı, kalemi kulağının arkasına sıkıştırdı ve ilk prova için herkesi aynı anda grup aramasına çağırdı."
  - id: s02
    text: "Ece: \"<en>OK, team! This is your manager speaking. Our first rehearsal: when can we all {U4-027|meet up}?</en>\""
  - id: s03
    text: "Hatta sesler birer birer belirdi: Urla'dan Selin, Elif ve arkada Pamuk'un havlaması, Bora'nın çıtır çıtır cips sesi, en son da puf koltuğundan Duru'nun esneyişi. Bir tek Kaan yoktu."
  - id: s04
    text: "Selin: \"<en>Kaan's line is {U4-016|engaged}. Again. He's sending a three-minute voice message to somebody, I'm sure.</en>\" Ece: \"<en>I {U4-009|left a message} on his phone this morning. Nothing!</en>\""
  - id: s05
    text: "Ece: \"<en>Fine. We'll start without him. Selin and I are coming home on Saturday morning. So, Saturday at five, at Duru's house? Duru?</en>\""
  - id: s06
    text: "Grubun en {U1-079|laid-back} üyesi hiç kıpırdamadan mırıldandı: \"<en>It's my house. I {U4-021|guess} I can come.</en>\""
  - id: s07
    text: "Ece defterine kocaman harflerle yazdı ve altını iki kez çizdi: \"<en>Great! Saturday, five. That's our {U4-049|decision}!</en>\""
  - id: s08
    text: "Tam o anda Kaan hatta düştü, nefes nefese: \"<en>Sorry, sorry! I'm here! What did I miss? Saturday? Oh no, {U4-023|I'm afraid} I'm not {U4-014|available} on Saturday. I've got a match!</en>\""
  - id: s09
    text: "Selin hiçbir şey söylemedi; yalnızca kaşını kaldırıp defterine bir satır daha yazdı."
  - id: s10
    text: "Ece: \"<en>OK… Sunday at eleven? Come on, team, let's {U4-049|decide} now, please!</en>\""
  - id: s11
    text: "Bora: \"<en>Sunday morning? Sorry. My mum works the night shift on Saturday, so I make breakfast for her on Sunday morning. How about Sunday at four?</en>\""
  - id: s12
    text: "Elif: \"<en>Sunday at four? I {U4-021|guess} that's OK… no, wait! That's Pamuk's bath time at the dog salon! She waits all week for it!</en>\""
  - id: s13
    text: "Ece derin bir nefes aldı: \"<en>{U4-029|We'll meet on Saturday at three, then}?</en>\" Kaan: \"<en>Wait, wait! My match is at two, not at five! I can {U4-027|meet up} at five! Sorry, I'm {U1-075|always in a hurry}. I didn't read the message.</en>\""
  - id: s14
    text: "Bir saniyelik sessizlik. Sonra grubun en {U1-059|reliable} üyesi boğazını temizledi ve defterindeki listeyi okudu."
  - id: s15
    text: "Selin: \"<en>My {U4-010|memo} says: one, Saturday at five. Two, Sunday at eleven. Three, Sunday at four. Four, Saturday at three. And now… Saturday at five. That was our first {U4-049|decision}!</en>\""
  - id: s16
    text: "Hattaki herkes aynı anda güldü, Pamuk bile havladı. Ece: \"<en>Four changes in ten minutes! OK, OK. {U4-029|We'll meet on Saturday at five, then}. Final!</en>\""
  - id: s17
    text: "Duru: \"<en>I {U4-021|guess} I'll be there. It's still my house.</en>\""
  - id: s18
    text: "Kaan: \"<en>Great! I have to go, my coach is on the other line. I'll {U4-001|call you back} in two minutes! {U4-028|Talk to you soon}!</en>\" Selin: \"<en>So… in twenty minutes.</en>\""
  - id: s19
    text: "Selin: \"<en>{U4-028|Thanks for calling}, Ece. See you on Saturday!</en>\" Ece: \"<en>{U4-028|Talk to you soon}, team!</en>\""
  - id: s20
    text: "Aynı akşam Elif'in telefonu titredi. Ekranda kuzeninin adı vardı: kuzeni yarın sabah ailesiyle Ankara'ya taşınıyordu."
  - id: s21
    text: "Kuzeni: \"<en>This is my last night in İzmir. Ankara is so far!</en>\" Elif: \"<en>It's only a phone call away! Let's {U4-008|keep in touch}, OK? Every Sunday!</en>\""
  - id: s22
    text: "Kuzeni: \"<en>Deal. And we can {U4-027|meet up} in the summer. {U4-029|We'll meet at our ice cream shop by the sea, then}!</en>\""
  - id: s23
    text: "Elif: \"<en>{U4-028|Thanks for calling}! {U4-028|Take care}!</en>\" Kuzeni: \"<en>You too. Send me your concert video. And {U4-008|keep in touch}, singer!</en>\""
  - id: s24
    text: "Elif telefonu bıraktı, Pamuk'a sarıldı ve sınıf grubuna yazdı: \"<en>Rule number one in our band: we always {U4-008|keep in touch}. Even with Ankara! 💛</en>\""
  - id: s25
    text: "Gece yarısına doğru Bora'dan tek satırlık bir mesaj geldi: \"<en>Saturday at five. Only one small problem… I don't have a drum kit. 🥁</en>\""

scene:
  - id: c01
    speaker: Ece
    text: "<en>So, when can we meet up for the rehearsal?</en>"
  - id: c02
    speaker: Duru
    text: "<en>I guess I can come on Saturday at five.</en>"
  - id: c03
    speaker: Kaan
    text: "<en>I'm afraid I can't… oh, wait! My match is at two. Five is fine!</en>"
  - id: c04
    speaker: Selin
    text: "<en>That was our first decision. We'll meet on Saturday at five, then.</en>"
  - id: c05
    speaker: Elif
    text: "<en>Great! Thanks for calling, Ece. Talk to you soon!</en>"

