tips:
  - type: mini_dilbilgisi
    refs: [U4-029, U4-049]
    text: "Konuşmanın ortasında verilen karar will ile kurulur: \"We'll meet on Saturday, then.\" Sondaki then \"o hâlde\" demektir ve kararın az önce konuşulanlara dayandığını gösterir. \"We met …\" ise geçmişte kalmış bir buluşmayı anlatır."
  - type: tuzak
    refs: [U4-027]
    text: "meet tek başına \"tanışmak\" da olabilir (Nice to meet you!). meet up ise önceden tanıdığın arkadaşlarla sözleşip bir araya gelmektir: \"Let's meet up after school.\""
  - type: lgs_taktigi
    refs: [U4-028]
    text: "\"Thanks for calling\" diyen kişi telefonu AÇAN kişidir; arayana teşekkür eder. LGS diyaloğunda kimin aradığını bulmak için bu kapanış cümlesi iyi bir ipucudur."
  - type: kelime_ailesi
    refs: [U4-049, U4-021]
    text: "decide (fiil) → decision (isim): make a decision. guess fiil olarak \"tahmin etmek\"tir (Guess my age!); I guess ise cümle başında yumuşak bir \"bence, herhalde\" gibi çalışır."

coach:
  start: "Bugün grup ilk prova için dört kez fikir değiştiriyor. Selin'in defteri hepsini yakalayabilecek mi? 📒"
  end_good: "Harika! Grup dört tur attı, sen bir kez bile şaşmadın. Cumartesi beşte seni de bekliyoruz 🎸"
  end_mixed: "İyi gidiyorsun! {weak} biraz kaydı, dert değil. Selin gibi deftere yaz, yarın bir kez daha bak 📒"

notifications:
  morning: "İlk prova ne zaman? Grup bunu bulmak için dört tur atacak 📅"
  evening: "Ankara'ya taşınan bir kuzen, bir veda ve Bora'dan gece yarısı mesajı 🥁"
  review: "Telefonda vedalaşmanın üç kibar yolunu duydun. Hepsini hatırlıyor musun? 👋"

