tips:
  - type: tuzak
    refs: [U4-018]
    text: "receiver iki anlamlı: mesajın alıcısı (sender ↔ receiver) ve telefonun ahizesi. \"She picked up the receiver\" = Ahizeyi kaldırdı. Fiil pick up / put down ise ahize demektir."
  - type: tuzak
    refs: [U4-030, U1-014]
    text: "matter isim olarak \"madde, konu\" demek. Ama What's the matter? = Ne oldu, neyin var? It doesn't matter (Ü1) ise \"Fark etmez\". Soru mu, cevap mı, ona bak."
  - type: mini_dilbilgisi
    refs: [U4-004]
    text: "contact edat almaz: contact me ✓, contact with me ✗. Edatlı olan get in touch'tır: get in touch with me ✓."
  - type: lgs_taktigi
    refs: [U4-025]
    text: "Durum sorularında önce haberi sınıflandır: hastalık → Get well soon! · kötü haber → I'm sorry to hear that. · iyi haber → Congratulations! / That's great!"

