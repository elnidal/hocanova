story:
  - id: s01
    text: "Cuma akşamüstü, konsere tam bir gün kalmıştı. Ece pastanede Sevim Hanım'la son kontrolleri yapıyordu; Ahmet Amca'nın davul seti köşede, sahnenin kenarında da boş bir masa duruyordu."
  - id: s02
    text: "Sevim Hanım elindeki listeyi okudu: \"<en>The stage is {U4-035|booked} for tomorrow at seven. Selin {U4-037|confirmed} it last week, and this morning the head office called for a final check. The sound technician's {U4-033|appointment} is at five.</en>\""
  - id: s03
    text: "Ece defterine üç tik attı, bir yandan da sandalyeleri saydı. Sevim Hanım güldü: \"<en>Slow down, dear manager! Sit down and {U2-040|rest} for a minute.</en>\""
  - id: s04
    text: "Ece tek eliyle gruba yazdı: \"<en>The concert is ON!</en>\" Ama telefonun otomatik düzeltmesi son anda araya girdi ve Ece ekrana bakmadan telefonu çantasına attı."
  - id: s05
    text: "Birkaç saniye sonra beş telefonda aynı mesaj belirdi: \"<en>The concert is GONE!</en>\""
  - id: s06
    text: "Elif evdeydi; boğazında atkı, elinde bir fincan ıhlamur. Mesajı okudu ve kanepeye yığıldı. Önce Luna Ray'in konseri, şimdi de kendi konseri…"
  - id: s07
    text: "Kaan'ın sesli mesajı gecikmedi; tabii üç dakikalık ve nefes nefese: \"<en>Gone? GONE? Why? Who? I'm coming to the café now! No, wait, I'm at basketball practice…</en>\""
  - id: s08
    text: "Duru'nun telefonu her zamanki gibi sessizdeydi; mesajı ancak yarım saat sonra gördü. Okudu, bir daha okudu. Ece asla bu kadar kısa mesaj atmazdı; onun mesajlarında hep saat ve madde işareti olurdu."
  - id: s09
    text: "Duru kanepede doğruldu: \"<en>Wait. Maybe it's a {U4-051|misunderstanding}.</en>\" Fıstık başını kaldırdı; Duru'dan bu kadar uzun bir cümle duymaya alışık değildi."
  - id: s10
    text: "Sonra tarihî bir an yaşandı: arkadaşlarının telefonlarına bile zor dönen Duru, ilk kez bir arkadaşını kendisi aradı. Elif'i."
  - id: s11
    text: "Elif'in sesi kısık ve titrekti. Duru hemen fark etti: \"<en>Elif? It's Duru. You sound terrible. {U4-030|What's wrong}?</en>\""
  - id: s12
    text: "Elif burnunu çekti: \"<en>Didn't you see Ece's message? The concert is gone. And I've got a sore throat. Mum made a doctor's {U4-033|appointment} for tomorrow morning.</en>\""
  - id: s13
    text: "Duru'nun sesi yumuşadı: \"<en>A sore throat? Oh no, {U4-025|I'm sorry to hear that}. Drink some hot tea with honey.</en>\""
  - id: s14
    text: "Sonra ekledi: \"<en>And {U4-025|get well soon}. But I don't believe that message. Ece's messages are never this short. Let me {U4-004|get in touch} with her first.</en>\""
  - id: s15
    text: "Ece'yi aradı: çaldı, çaldı… Telefon çantanın dibindeydi. Duru pes etmedi ve grubun santrali Selin'i aradı. Selin'de herkesin numarası vardı; pastanenin numarası bile."
  - id: s16
    text: "Pastanede tezgâhtaki eski telefon öttü. Duru, Selin'in öğrettiği gibi başladı: \"<en>Good evening. Sorry to {U4-053|disturb} you, but is Ece there? It's important.</en>\" Sevim Hanım gülümsedi: \"<en>What a {U4-052|polite} young lady! Hold on.</en>\""
  - id: s17
    text: "Sevim Hanım {U4-018|receiver}'ı Ece'ye uzattı. Ece şaşkın şaşkın kulağına götürdü: \"<en>Duru? You're calling me? On the café phone? {U4-030|What's wrong}?</en>\""
  - id: s18
    text: "Duru tek cümleyle özetledi: \"<en>Your message says the concert is GONE. Elif is very sad.</en>\" Ece çantasından telefonunu çıkardı, mesaja baktı ve yüzü bembeyaz oldu: \"<en>Gone?! I wrote ON! It's a {U4-051|misunderstanding}!</en>\""
  - id: s19
    text: "Ece herkesi grup aramasına çağırdı, ama pastanenin içinde ses kesik kesik geliyordu. Kapının önüne çıktı: \"<en>Sorry, the {U4-003|connection} is bad in here. Can you hear me now?</en>\""
  - id: s20
    text: "Ece derin bir nefes aldı: \"<en>Everyone, I {U1-002|apologise}. Duru {U4-004|got in touch} with me just now. The concert is ON. Tomorrow at seven. I'm really sorry, Elif.</en>\""
  - id: s21
    text: "Elif'in sesi bir anda düzeldi, en azından yarı yarıya: \"<en>It's ON? Then my throat is better already!</en>\" Selin güldü: \"<en>Still, drink your tea. {U4-025|Get well soon}, singer!</en>\""
  - id: s22
    text: "Kaan'ın kafası hâlâ karışıktı: \"<en>Wait, wait. Who is the {U4-018|sender} here? Ece or her phone?</en>\""
  - id: s23
    text: "Bora hemen hükmünü verdi: \"<en>Biggest {U4-051|misunderstanding} of the year! The phone is the {U4-018|sender}, and we're all {U4-018|receivers}. So we're angry at the phone, not at Ece!</en>\""
  - id: s24
    text: "Selin: \"<en>And Duru noticed Elif's sad voice first. She's really {U2-086|sensitive}.</en>\" Kaan: \"<en>She {U4-004|contacted} everybody tonight! Duru! {U4-030|What's the matter} with you?</en>\""
  - id: s25
    text: "Hatta kısa bir sessizlik oldu. Duru: \"<en>Nothing's the matter. This concert is important to me. That's all.</en>\" Fıstık bile kıpırdamadı."
  - id: s26
    text: "Sessizliği Kaan bozdu: \"<en>OK, team! Tomorrow I've got practice until half past five. Ece, I'll call you back at six. Exactly at six!</en>\" Telefonda beş kişi aynı anda güldü. Kaan gülmüyordu."

scene:
  - id: c01
    speaker: Ece (mesaj)
    text: "<en>The concert is GONE!</en>"
  - id: c02
    speaker: Duru
    text: "<en>Elif? It's Duru. You sound terrible. What's wrong?</en>"
  - id: c03
    speaker: Elif
    text: "<en>The concert is gone, and I've got a sore throat.</en>"
  - id: c04
    speaker: Duru
    text: "<en>I'm sorry to hear that. Get well soon! But I think it's a misunderstanding. Let me get in touch with Ece.</en>"
  - id: c05
    speaker: Ece
    text: "<en>I'm the sender, but my phone changed the word! The concert is ON!</en>"

