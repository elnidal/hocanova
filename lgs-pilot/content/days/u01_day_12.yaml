story:
  - id: s01
    text: "Salı sabahı. Bora okula erkenden geldi ve doğruca kütüphaneye gitti."
  - id: s02
    text: "Ece ile Selin onu orada buldu. Ece masaya eğildi: \"<en>Bora, can we {U1-035|give you some advice}?</en>\" Bora: \"<en>Do I have a choice?</en>\""
  - id: s03
    text: "Selin karşısına oturdu: \"<en>Kaan made a big mistake. But talk to him. Don't let one {U1-062|secret} end everything.</en>\""
  - id: s04
    text: "Ece de ekledi: \"<en>Think about the good days. He was {U1-037|always there for you}.</en>\""
  - id: s05
    text: "Bora bir süre sustu. Aklına geçen kış geldi: bisikleti bozulmuştu ve Kaan bir ay boyunca her sabah onunla okula yürümüştü. Hem de Kaan, yani sınıfın en geç kalan çocuğu!"
  - id: s06
    text: "Bora sonunda gülümsedi: \"<en>You're right. When my bike broke, he walked with me every morning. He's {U1-037|always there for me}.</en>\""
  - id: s07
    text: "Bu arada koridorun öbür ucunda Kaan, Duru ve Elif'e dert yanıyordu: \"<en>Bora doesn't {U1-020|reply} to my messages. What should I do?</en>\""
  - id: s08
    text: "Duru esnedi ama bu kez çok ciddiydi: \"<en>My {U1-035|advice}? Don't send another message. Go and say sorry. Face to face.</en>\""
  - id: s09
    text: "Elif ekledi: \"<en>And {U1-043|share} something with him. Everybody loves chips!</en>\""
  - id: s10
    text: "Kaan'ın gözleri parladı: \"<en>Chips! Of course! Thanks for the {U1-035|advice}, girls!</en>\""
  - id: s11
    text: "Öğle arası. Bora kantinde oturuyordu. Kaan elinde kocaman bir cips paketiyle masaya yaklaştı."
  - id: s12
    text: "Derin bir nefes aldı: \"<en>Bora, I'm really sorry. I told everyone about your dance class. It was wrong.</en>\""
  - id: s13
    text: "Sonra itiraf etti: \"<en>I couldn't sleep for days. I {U1-016|missed} the bus twice!</en>\" Bora kahkahayı zor tuttu."
  - id: s14
    text: "Kaan paketi uzattı: \"<en>Do you want to {U1-043|share} my chips? Peace?</en>\" Bora paketi aldı: \"<en>Peace. But I'm taking the big ones.</en>\""
  - id: s15
    text: "Kaan kulaklığının bir tekini Bora'ya verdi: \"<en>And let's {U1-043|share} my headphones. Listen to this song!</en>\""
  - id: s16
    text: "Bora şarkıyı dinlerken başını salladı: \"<en>You know what? You {U1-063|supported} me so many times. I can't stay angry with you.</en>\""
  - id: s17
    text: "Kaan heyecanla ayağa fırladı: \"<en>And I'll {U1-063|support} you at your dance show! I'll be in the front row!</en>\" Bora: \"<en>Wait… you want to {U1-003|attend} my show?</en>\" Kaan: \"<en>Of course! I won't {U1-016|miss} it. I'll even come early!</en>\""
  - id: s18
    text: "Selin ile Ece kantinin kapısından izliyordu. Ece fısıldadı: \"<en>Look! They're {U1-064|supporting each other} again.</en>\""
  - id: s19
    text: "Selin memnun bir yüzle kollarını kavuşturdu: \"<en>Good friends {U1-064|support each other}. That's what matters.</en>\""
  - id: s20
    text: "Okuldan sonra ikisi parka gitti. Bora: \"<en>I'm not {U1-004|busy} today. {U1-009|I have nothing to do}.</en>\" Kaan: \"<en>Me neither! Let's {U1-044|spend time} together.</en>\""
  - id: s21
    text: "Duru gruba bir fotoğraf attı: Kaan ve Bora salıncakta, ağızları cips dolu. Altına yazdı: \"<en>Look who's {U1-044|spending time} together again!</en>\""
  - id: s22
    text: "Elif hemen yazdı: \"<en>Can we {U1-015|join} you?</en>\" Kaan: \"<en>Sure! We love {U1-044|spending time} with you all.</en>\""
  - id: s23
    text: "Ece de bir kalp attı: \"<en>You two {U1-064|support each other} like brothers. Don't forget that!</en>\""
  - id: s24
    text: "Akşam herkes parktaydı. Bora hepsine baktı: \"<en>Thanks for {U1-063|supporting} me this week, guys. You're {U1-037|always there for me}.</en>\""
  - id: s25
    text: "Kaan göz kırptı: \"<en>Dance show next Saturday, right? I'll be there.</en>\" Bora: \"<en>You'll be late.</en>\" Kaan: \"<en>Probably!</en>\" İkisi de kahkahayı bastı."

scene:
  - id: c01
    speaker: Duru
    text: "<en>Kaan, here's my advice: say sorry face to face.</en>"
  - id: c02
    speaker: Kaan
    text: "<en>Bora, I'm sorry. Do you want to share my chips?</en>"
  - id: c03
    speaker: Bora
    text: "<en>OK, peace! You're always there for me.</en>"
  - id: c04
    speaker: Selin
    text: "<en>Good friends support each other and spend time together.</en>"

steps:
  - item: U1-035
    sezdir:
      id: d12-035-z
      type: meaning
      context: s08
      prompt: "Hikâyede \"advice\" (give advice) ne anlama geliyordu?"
      options: ["tavsiye (vermek)", "izin (vermek)", "ödev (vermek)", "hediye (vermek)"]
      answer: 0
    kullan:
      id: d12-035-k
      type: gap_fill
      prompt: "Boşluğa uygun olanı seç."
      stem: "<en>My sister always listens to my problems and ________. She tells me what to do.</en>"
      options: ["gives me advice", "tells me lies", "argues with me", "misses the bus"]
      answer: 0
      explain: "Sorunlarımı dinleyen ve ne yapmam gerektiğini söyleyen kardeşim bana tavsiye verir: gives me advice."
    sina:
      id: d12-035-s
      type: dialogue_complete
      lgs_like: true
      prompt: "<en>Which one completes the dialogue?</en>"
      stem: "<en>Bora: I argued with my best friend. What should I do?\nSelin: ________</en>"
      options: ["My advice is to talk to him face to face.", "I argued with him yesterday.", "He has a new bike.", "I'm stuffed, thanks."]
      answer: 0
      explain: "Arkadaşıyla tartışan Bora'ya tavsiye: My advice is to talk to him face to face. (advice = tavsiye)"
