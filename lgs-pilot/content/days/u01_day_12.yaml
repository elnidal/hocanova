tips:
  - type: tuzak
    refs: [U1-035]
    text: "advice sayılamaz! ❌ an advice, ❌ advices. ✓ some advice, a piece of advice. Fiili ise s ile yazılır: advise (tavsiye etmek)."
  - type: tuzak
    refs: [U1-044]
    text: "spend time = zaman geçirmek, ama spend money = para harcamak. Geçmiş hali düzensiz: spent. \"We spent the day in the park.\""
  - type: mini_dilbilgisi
    refs: [U1-043]
    text: "share something WITH someone: \"Kaan shares his chips with Bora.\" Kiminle paylaştığını with ile söyle."
  - type: hafiza_kancasi
    refs: [U1-037]
    text: "\"He's always there for me\" kelimesi kelimesine \"o hep benim için orada\". İhtiyacın olduğu her an, oradaymış gibi gelen kişi. Adres sormuyoruz, kalpten bahsediyoruz!"

coach:
