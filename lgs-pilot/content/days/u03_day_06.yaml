  end_good: "Bravo! Notu eksiksiz okudun. Bora'nın annesi gurur duyardı, Kaan'ın zamanlayıcısı da ⏱️"
  end_mixed: "Güzel gidiyor! {weak} biraz lavaboya kaçtı ama ikinci paket her zaman var. Yarın tekrar! 🍝"

notifications:
  morning: "Bu akşam Bora'da makarna var. Kaan da gelecek… lavabo dikkatli olsun 🍝"
  evening: "Kaan hayatında ilk kez bir zamanlayıcı kurdu. Peki makarna kurtuldu mu? ⏱️"
  review: "How much mı, how many mi? Cevap, sayabilip sayamamanda saklı 🔢"

