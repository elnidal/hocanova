tips:
  - type: tuzak
    refs: [U3-012]
    text: "cover deyince akla kitap kapağı gelir; ama tarifte fiildir: \"Cover the pan.\" = Kabın üstünü ört / kapağını kapat. \"Cover it with a lid.\" kalıbını ezberle."
  - type: tuzak
    refs: [U3-047]
    text: "Türkçedeki tek \"ne kadar\" İngilizcede üçe ayrılır: süre → How long (nine minutes) · sayılamayan miktar ya da fiyat → How much (pasta, water, money) · sayılabilen → How many (plates, eggs). Cevaba bak, soruyu bul!"
  - type: kelime_ailesi
    refs: [U3-015, U3-014]
    text: "-er ile alet: grate (rendelemek) → grater (rende), open → opener (açacak). Ama drain'in aleti farklı bir kelime: strainer (süzgeç)."
  - type: lgs_taktigi
    refs: [U3-002, U3-014, U3-024]
    text: "Tarif sırası mantığı: önce boil, sonra drain, en son sprinkle. Kaynamadan süzülmez, süzülmeden peynir serpilmez; yemek hep en sondadır."

coach:
