story:
  - id: s01
    text: "Cuma akşamı, Bora'nın evi. Annesi gece nöbetine çıkmıştı; dedesi gelmiş, salonda plaktan {U2-024|jazz} dinliyordu."
  - id: s02
    text: "Buzdolabının üstünde annesinin notu vardı. Junior Chef'e pratik olsun diye notu İngilizce yazmıştı. Bora yüksek sesle okudu:"
  - id: s03
    text: "\"<en>1. {U3-002|Boil} some water in the big {U3-041|saucepan}. 2. Cook the pasta for nine minutes. 3. {U3-014|Drain} it in the {U3-014|strainer}.</en>\""
  - id: s04
    text: "\"<en>4. {U3-015|Grate} some cheese and {U3-024|sprinkle} it on top. 5. {U3-012|Cover} the sauce, or it will get cold. Love, Mum ❤️</en>\""
  - id: s05
    text: "Kaan: \"<en>Your mum writes {U3-050|recipes} in English? Cool!</en>\" Bora: \"<en>She says I'm a {U1-059|reliable} cook now. Leave it to me.</en>\""
  - id: s06
    text: "Dedesi mutfak kapısında belirdi: \"<en>I'm the grown-up here, and I'm staying in the kitchen. The hot water is my job. The rest is yours, chefs.</en>\""
  - id: s07
    text: "Kaan: \"<en>{U3-047|How long} do we cook the pasta?</en>\" Bora notu gösterdi: \"<en>Nine minutes. Read the note, chef.</en>\""
  - id: s08
    text: "Kaan telefonunu çıkardı ve hayatında ilk kez bir zamanlayıcı kurdu: 09:00. Duru gözlerine inanamadı: \"<en>Kaan… is that a timer? Are you OK?</en>\" Kaan: \"<en>Junior Chef changes people, mate.</en>\""
  - id: s09
    text: "Bu arada Bora sosa başlamıştı: \"<en>{U3-045|First}, I {U3-004|fry} the onion in a small {U3-041|pan}. {U3-045|Then}, I {U3-020|pour} in the tomatoes and {U3-018|stir}.</en>\""
  - id: s10
    text: "Duru iki yumurta aldı: \"<en>And I'll {U3-026|whisk} some eggs. Plan B: an omelette.</en>\" Bora: \"<en>Plan B? Why?</en>\" Duru: \"<en>In case Kaan happens.</en>\""
  - id: s11
    text: "Kaan: \"<en>I can {U3-013|crack} the eggs!</en>\" Üç ses aynı anda: \"<en>NO!</en>\" Kaan alnına dokundu; o sabahı hâlâ hatırlıyordu."
  - id: s12
    text: "Dokuzuncu dakikada telefon öttü. Kaan yerinden fırladı: \"<en>Time! Time! The pasta is ready!</en>\""
  - id: s13
    text: "Dede ağır kabı iki eliyle lavaboya taşıdı. Kaan da {U3-014|strainer}'ı lavabonun üstünde tutuyordu. Ama ters."
  - id: s14
    text: "Makarna, ters {U3-014|strainer}'ın sırtından kayıp lavaboya gitti. Yarısı."
  - id: s15
    text: "Bora: \"<en>Kaan! It's upside down! We {U3-014|drain} the pasta, we don't feed the sink!</en>\""
  - id: s16
    text: "Duru bir lavaboya, bir kalan makarnaya baktı: \"<en>Important question: {U3-047|how much} pasta is left?</en>\" Bora: \"<en>Half. Maybe less.</en>\""
  - id: s17
    text: "Kaan: \"<en>So, {U3-047|how many} plates can I have?</en>\" Duru: \"<en>Zero. The sink ate yours.</en>\" En yüksek kahkaha Kaan'ınkiydi."
  - id: s18
    text: "Dede: \"<en>Don't worry, I did the same thing at your age. Twice.</en>\" Bora sakin sakin dolabı açtı: \"<en>No problem. One more packet. We'll {U3-002|boil} some more water.</en>\""
  - id: s19
    text: "Kaan bu kez zamanlayıcıyı kimse söylemeden kurdu. Dede: \"<en>The water is {U3-002|boiling}. Go, chef!</en>\""
  - id: s20
    text: "Bora: \"<en>Duru, {U3-012|cover} the sauce, please. It's getting cold.</en>\""
  - id: s21
    text: "Duru: \"<en>{U3-012|Cover} it with what? My hand?</en>\" Bora: \"<en>With the lid, Duru. The lid.</en>\""
  - id: s22
    text: "Kaan özür diler gibi elini kaldırdı: \"<en>Let me {U3-015|grate} the cheese. Give me the {U3-015|grater}!</en>\""
  - id: s23
    text: "Dede: \"<en>Slowly, Kaan. Mind your fingers on the {U3-015|grater}. This isn't a race.</en>\""
  - id: s24
    text: "Bora: \"<en>Now {U3-024|sprinkle} the cheese on top. Just a little, like snow.</en>\" Kaan makarnanın üstüne bembeyaz bir dağ yaptı."
  - id: s25
    text: "Duru: \"<en>That's not {U3-024|sprinkling}, Kaan. That's a mountain.</en>\""
  - id: s26
    text: "Gece onda tabaklar bomboştu. Kaan kanepeye yığıldı: \"<en>I'm {U1-099|stuffed}. Best pasta ever. Even the half in the sink.</en>\""
  - id: s27
    text: "Duru kapıdan çıkarken döndü: \"<en>Tomorrow: pizza at my house. Kaan, you bring the parsley.</en>\" Kaan: \"<en>Easy!</en>\" Dede plağı yeniden çalmaya başladı."

scene:
  - id: c01
    speaker: Kaan
    text: "<en>How long do we boil the pasta, Bora?</en>"
  - id: c02
    speaker: Bora
    text: "<en>Nine minutes. Then we drain it, grate some cheese and sprinkle it on top.</en>"
  - id: c03
    speaker: Duru
    text: "<en>And how much pasta is left after Kaan's strainer show?</en>"
  - id: c04
    speaker: Kaan
    text: "<en>Half! But we cooked more. And Duru covered the sauce with the lid, not with her hand.</en>"

