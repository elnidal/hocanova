story:
  - id: s01
    text: "Çarşamba akşamı saat dokuzda gruptaki altı telefon aynı anda titredi. Ece bir anket açmıştı ve altına bir kural eklemişti: tek kelimelik cevap yetmez."
  - id: s02
    text: "Ece: \"<en>Camp poll! Question 1, just for fun: {U6-036|would you rather} {U6-004|go rafting} or {U6-004|go caving}? Write your answer AND a reason!</en>\""
  - id: s03
    text: "Kaan iki saniyede cevap verdi: \"<en>{U6-004|Rafting}! I {U6-035|prefer} water {U6-035|to} dark holes!</en>\""
  - id: s04
    text: "Ece: \"<en>{U6-037|Why}? Reasons, please!</en>\" Kaan: \"<en>{U6-037|Because} it's fast and wet!</en>\""
  - id: s05
    text: "Bora: \"<en>Caves have bugs. Bugs are {U2-030|annoying}. {U6-036|I'd rather} {U6-004|go rafting} with Kaan than meet a bat in the dark.</en>\""
  - id: s06
    text: "Selin: \"<en>{U6-036|I'd rather} {U6-004|go caving}.</en>\" Ece: \"<en>Why?</en>\" Selin: \"<en>{U6-037|Because} caves don't move. Rivers do. And there's always a guide with you.</en>\""
  - id: s07
    text: "Duru'nun mesajı on dakika sonra geldi: \"<en>Are there sofas in caves?</en>\" Ece: \"<en>No.</en>\" Duru: \"<en>Then {U6-004|rafting}. You sit in a boat.</en>\""
  - id: s08
    text: "Ece: \"<en>Question 2: the zip-line or the canoe? {U6-035|Which one do you prefer}?</en>\""
  - id: s09
    text: "Kaan: \"<en>Zip-line! It's {U6-033|faster than} a canoe, and you fly!</en>\""
  - id: s10
    text: "Selin: \"<en>Canoe. I {U6-035|prefer} my feet near the water {U6-035|to} my feet in the sky.</en>\""
  - id: s11
    text: "Elif oy vermek yerine bir ses kaydı gönderdi. Kayıtta şarkı söylüyordu: \"<en>{U6-036|I'd rather} sing by the campfire, la-la-laaa!</en>\" Ece: \"<en>Elif, that's not an option!</en>\" Elif: \"<en>It is now!</en>\""
  - id: s12
    text: "Ece derin bir nefes aldı ve ankete üçüncü bir seçenek ekledi: \"<en>Option C: Elif's campfire concert.</en>\" Bir dakikada üç oy geldi."
  - id: s13
    text: "Bu sırada Bora gruba geçen yılın sekizinci sınıflarının kamp videosunu attı: \"<en>Look! Last year's camp video. It's really {U6-031|amusing}!</en>\""
  - id: s14
    text: "Videonun altında yüzlerce yorum vardı. Ece ilkini yüksek sesle okudu: \"<en>'So {U6-031|amusing}! The teachers sang by the campfire for an hour… very badly 😂'</en>\""
  - id: s15
    text: "İkinci yorum o kadar neşeli değildi: \"<en>'The food was {U6-032|disappointing}. The pasta was cold.'</en>\""
  - id: s16
    text: "Kaan: \"<en>Cold pasta? That's really {U6-032|disappointing}. {U6-036|I'd rather} eat my shoe.</en>\""
  - id: s17
    text: "Elif: \"<en>Look at minute three! Murat Bey is singing with a guitar! So {U6-031|amusing}!</en>\""
  - id: s18
    text: "Selin videoyu sonuna kadar izledi: \"<en>And look, it rained on day two. The night walk was cancelled. That's {U6-032|disappointing}.</en>\""
  - id: s19
    text: "Ece'nin parmakları ekranın üstünde öylece kaldı: \"<en>Rain?! Rain isn't in my plan!</en>\""
  - id: s20
    text: "Selin: \"<en>Don't worry. I {U2-054|follow the news} every morning. I'll check the weather for camp.</en>\""
  - id: s21
    text: "Duru: \"<en>I {U2-011|don't mind} rain. {U6-036|I'd rather} sleep in the tent anyway.</en>\""
  - id: s22
    text: "Gece yarısına doğru Ece sonuçları paylaştı: \"<en>{U6-004|Rafting} 4, {U6-004|caving} 2. Zip-line 4, canoe 2. Campfire concert: 6!</en>\""
  - id: s23
    text: "Kaan: \"<en>{U6-037|Why} is the concert the winner? {U6-037|Because} it's the only option with marshmallows!</en>\""
  - id: s24
    text: "Ece gülerek telefonu bıraktı ve plan defterini açtı. Yarın için yeni bir dosya hazırlamıştı bile: dört sayfa. Başlığı: \"<en>Camp list – final – final 2</en>\""

scene:
