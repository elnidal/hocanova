tips:
  - type: tuzak
    refs: [U6-004, U1-003]
    text: "go + V-ing kalıbında to yoktur: ❌ go to rafting → ✓ go rafting, go caving. Bir tura katılmak join a tour'dur; attend (Ü1) ise bir etkinliğe, derse katılmaktır."
  - type: tuzak
    refs: [U6-032]
    text: "-ing / -ed farkı: disappointing şeyi anlatır (The food was disappointing). disappointed kişinin hissidir (I was disappointed)."
  - type: tuzak
    refs: [U6-035]
    text: "prefer A to B: ❌ prefer water than caves → ✓ prefer water to caves. prefer'dan sonra V-ing ya da to V gelebilir: I prefer swimming / I prefer to swim."
  - type: tuzak
    refs: [U6-036]
    text: "would rather + yalın fiil: ❌ I'd rather to go / going → ✓ I'd rather go. Kıyas yapılırsa than gelir: I'd rather go rafting than meet a bat."

coach:
  start: "Ece bir anket açtı: nehir mi, mağara mı? Herkes cevap verdi, Elif ise şarkı söyledi 🎤"
