    speaker: Ece
    text: "<en>Would you rather go rafting or go caving? Why?</en>"
  - id: c02
    speaker: Kaan
    text: "<en>Rafting! Because it's fast. I prefer water to dark holes.</en>"
  - id: c03
    speaker: Elif
    text: "<en>I'd rather sing by the campfire!</en>"
  - id: c04
    speaker: Bora
    text: "<en>Last year's camp video is really amusing.</en>"
  - id: c05
    speaker: Selin
    text: "<en>But the rain on day two was disappointing.</en>"

