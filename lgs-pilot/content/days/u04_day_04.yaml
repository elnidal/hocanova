story:
  - id: s01
    text: "Tatilin ilk haftası, sabah dokuz. Bora pijamalarıyla omletini yerken aklına birden cumartesi geldi: tatilde karate dersi var mıydı, yok muydu?"
  - id: s02
    text: "Bora kendi kendine: \"<en>Every Saturday we {U2-038|do karate} with Gül Hanım… but it's the holiday. I'll call her and ask.</en>\""
  - id: s03
    text: "Gül Hanım'ın numarası, salonun panosundan aldığı buruşuk bir kâğıttaydı. Bora bir elinde çatal, öbür elinde telefon: \"<en>OK, let me {U4-005|dial} the number. Zero, five, three, two… seven, eight… or was it seven, seven?</en>\""
  - id: s04
    text: "Tam o sırada çatal yere düştü, Bora eğildi ve parmağı ekranda bir rakam kaydı. Arama gitmişti bile."
  - id: s05
    text: "Bora: \"<en>It's {U4-013|ringing}… Come on, {U4-011|pick up}, please…</en>\""
  - id: s06
    text: "Sonunda hattın öbür ucundan yaşlı, yumuşacık bir ses geldi; arkada da hışırtı: \"<en>Hello? {U4-031|Who's calling}, please?</en>\""
  - id: s07
    text: "Bora en ciddi sesiyle: \"<en>Good morning! {U4-031|This is} Bora. {U4-026|May I speak to} Gül Hanım, please? {U4-024|I'm calling about} the Saturday class.</en>\""
  - id: s08
    text: "Ses: \"<en>{U4-019|Pardon}? It's a {U4-015|bad line}, dear. I can't hear you very well.</en>\""
  - id: s09
    text: "Bora, sesi gitmiyor sandı ve bütün gücüyle bağırdı: \"<en>BORA! KARATE! SATURDAY! Is that {U2-028|loud} enough?</en>\""
  - id: s10
    text: "Ses: \"<en>Karate? On Saturday? Oh dear… {U4-019|Can you repeat that}, please? Slowly, for an old lady.</en>\""
  - id: s11
    text: "Bora her kelimeyi heceleyerek söyledi. Hattın öbür ucunda bir an sessizlik oldu, sonra kıkır kıkır bir gülüş: \"<en>Ha! This is Nermin, dear. There's no Gül Hanım here. And I don't {U2-038|do karate}… not yet!</en>\""
  - id: s12
    text: "Bora'nın kulakları domates gibi kızardı: \"<en>Oh no! {U4-032|Sorry, wrong number}! I'm really, really sorry! Bye-bye!</en>\""
  - id: s13
    text: "Parmağı kırmızı tuşa ışık hızıyla gitti. Telefonu kanepeye fırlattı, yüzünü yastığa gömdü: \"<en>I {U4-006|hung up} on a grandma! I shouted at a grandma! I'm SO {U4-050|embarrassed}!</en>\""
  - id: s14
    text: "Bunu birine anlatmazsa patlayacaktı. Duru'nun cep telefonu her zamanki gibi sessizdeydi; Bora ev telefonunu aradı. Duru'nun annesi: \"<en>Hello? Oh, Bora! {U4-007|Hang on}, {U4-022|I'll get her}.</en>\""
  - id: s15
    text: "Uzaktan bir havlama, bir kanepe gıcırtısı, sonra Duru'nun uykulu sesi: \"<en>Hi. Duru here. Talking… very slowly.</en>\""
  - id: s16
    text: "Bora tek nefeste anlattı: \"<en>I {U4-005|dialled} the {U4-032|wrong number}! It was a {U4-015|bad line}, so I shouted 'KARATE' at a grandma. Then I {U4-006|hung up}. In one second!</en>\""
  - id: s17
    text: "Duru hiç acele etmeden: \"<en>Don't be {U4-050|embarrassed}. Fıstık barks at grandmas every day. You only shouted once.</en>\""
  - id: s18
    text: "Akşam yedide Bora'nın telefonu titredi. Ekranda sabahki numara vardı. Bora telefona baktı, telefon Bora'ya baktı: \"<en>It's her! Should I {U4-011|answer} it? …OK. I'll be brave.</en>\""
  - id: s19
    text: "Hattın öbür ucunda yine o yumuşacık ses: \"<en>Hello? Is this the karate boy? {U4-031|This is} Nermin again. Please don't {U4-006|hang up}, dear!</en>\""
  - id: s20
    text: "Nermin Teyze: \"<en>The line is clear tonight, not a {U4-015|bad line} like this morning. I told my grandson Arda about you. He said: 'Bora? The drummer from the band video?' He's {U2-015|crazy about} that video!</en>\""
  - id: s21
    text: "Bora: \"<en>{U4-019|Pardon}? He knows our band?</en>\" Nermin Teyze: \"<en>Yes! Do you ever play concerts? I can't play the drums, but I can clap!</en>\""
  - id: s22
    text: "Bora: \"<en>We have one on the last Saturday of the holiday! Please come! Wow. I'm not {U4-050|embarrassed} any more… well, only a little.</en>\""
  - id: s23
    text: "Bora sınıf grubuna yazdı: \"<en>Breaking news: we have our first fan! Thanks to a {U4-032|wrong number}. 🥁</en>\""
  - id: s24
    text: "Duru: \"<en>Classic Bora. Next time, {U4-005|dial} slowly.</en>\" Bursa'dan Ece: \"<en>Wait. WHAT fan?! Who? When? I need a list!</en>\""

scene:
  - id: c01
    speaker: Bora
    text: "<en>I dialled the wrong number this morning, and an old lady answered.</en>"
  - id: c02
    speaker: Duru
    text: "<en>And it was a bad line, so you shouted?</en>"
  - id: c03
    speaker: Bora
    text: "<en>Yes! She said 'Pardon?' two times. Then I said 'Sorry, wrong number' and hung up. I was so embarrassed.</en>"
  - id: c04
    speaker: Duru
    text: "<en>But she called back. Now we have our first fan!</en>"

