tips:
  - type: tuzak
    refs: [U4-006, U4-007, U2-004]
    text: "Üç \"hang\" birbirine karışmasın: hang up = telefonu kapatmak, hang on = (hatta) beklemek, hang out = arkadaşlarla takılmak (Ü2). İpucu: up = bitti, on = devam, out = dışarı."
  - type: mini_dilbilgisi
    refs: [U4-050]
    text: "embarrassed kişinin hissidir: \"I'm embarrassed.\" Olayın kendisini anlatırken -ing kullanılır: \"It was an embarrassing call.\" \"I'm embarrassing\" dersen \"Ben utandırıcı biriyim\" demiş olursun!"
  - type: ilginc_bilgi
    refs: [U4-005]
    text: "Eski telefonlarda rakamlar dönen bir kadranın (dial) üzerindeydi; numarayı parmağınla tek tek çevirirdin. Bugün ekrana dokunuyoruz ama İngilizcede hâlâ \"dial a number\" diyoruz."
  - type: lgs_taktigi
    refs: [U4-019, U4-015]
    text: "Diyalogda bir kişi aynı bilgiyi ikinci kez söylüyorsa, boşlukta büyük olasılıkla \"Pardon? / Can you repeat that?\" ya da \"It's a bad line\" vardır. Boşluktan sonraki satır ipucunu verir."

coach:
  start: "Bora bugün tek bir rakamı karıştırıyor. Hattın öbür ucundaki ses kime ait? 📞"
  end_good: "Bravo! Bora'nın parmağı kaydı, seninki hiç kaymadı. Grubun ilk hayranı da senin kadar dikkatli olsun 🥁"
  end_mixed: "Fena değil! {weak} biraz cızırdadı ama hat düzelir. Yarın bir tur daha, bu kez ses net gelecek 📶"

notifications:
  morning: "Bora bugün bir rakamı karıştıracak. Bu, yılın en güzel hatası olabilir 📞"
  evening: "Bir rakam, bir teyze ve grubun ilk hayranı. Bugünkü hikâye seni bekliyor 🥁"
  review: "hang up mı, hang on mu? Biri görüşmeyi bitirir, biri bekletir. Hangisi hangisi? 🤔"

