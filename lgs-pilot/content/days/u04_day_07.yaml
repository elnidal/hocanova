story:
  - id: s01
    text: "Tatilin ikinci haftası, pazartesi sabahı. Duru'nun kapısında kargocu vardı; elinde küçük bir kutu."
  - id: s02
    text: "Duru'nun hayatında ilk kez tek başına seçip internetten aldığı şeydi bu: konser için küçük, kırmızı bir hoparlör. Kutunun üstünde kocaman harflerle yazıyordu: \"<en>ZipZap – free and fast {U4-039|delivery}!</en>\""
  - id: s03
    text: "Elif ve Pamuk prova için erkenden gelmişti. Elif kutunun etrafında zıplıyordu: \"<en>Open it! Open it! Red, like Fıstık's new collar!</en>\""
  - id: s04
    text: "Kutu açıldı. Hoparlör kırmızı değil, fosforlu yeşildi. Duru fişe taktı; Luna Ray yerine kulak tırmalayan bir cızırtı yükseldi."
  - id: s05
    text: "Fıstık kanepenin altına kaçtı. Elif ellerini kulaklarına bastırdı: \"<en>That noise is so {U2-030|annoying}! And it's green! Green!</en>\""
  - id: s06
    text: "Duru kutunun dibindeki kartı okudu: \"<en>A problem with your order? Call our {U4-036|call center} at 0850 555 47 47. Our {U4-038|customer service} team is happy to help.</en>\""
  - id: s07
    text: "Elif telefonunu uzattı: \"<en>I'll call them for you. You never {U4-011|pick up} the phone, you never call anyone…</en>\" Duru telefonu yavaşça geri itti: \"<en>No. It's my speaker. I'll {U4-040|make a complaint}.</en>\""
  - id: s08
    text: "Elif'in ağzı açık kaldı. Duru rakamları tek tek okudu: \"<en>OK. I'm {U4-005|dialling} now. Zero, eight, five, zero… five, five, five… four, seven, seven, four.</en>\""
  - id: s09
    text: "Bir adam neşeyle açtı: \"<en>Pizza Palace, good morning!</en>\" Duru bir an durdu: \"<en>Oh. {U4-032|Sorry, wrong number}.</en>\" Elif karta baktı: son rakamlar yetmiş dört değil, kırk yedi kırk yediydi."
  - id: s10
    text: "Duru hiç bozulmadı: \"<en>No problem. I'll {U4-005|dial} it again. Slowly.</en>\""
  - id: s11
    text: "Bu kez robot gibi bir ses karşıladı onları: \"<en>Welcome to the ZipZap {U4-036|call center}. For orders, press 1. To {U4-041|return or change a product}, press 2.</en>\" Duru 2'ye bastı."
  - id: s12
    text: "Sonunda gerçek bir insan: \"<en>Good morning, ZipZap {U4-038|customer service}, this is Can. {U4-020|How can I help you}?</en>\" Ama arkada yeşil hoparlör hâlâ cızırdıyordu ve Can'ın sesi kesik kesik geliyordu."
  - id: s13
    text: "Can: \"<en>Hello? Sorry, it's a {U4-015|bad line}. I can only hear noise.</en>\" Duru hoparlörün fişini çekti."
  - id: s14
    text: "Duru: \"<en>Is that better? I'd like to {U4-040|report a problem} with my order. The speaker was {U4-039|delivered} this morning, but it's the wrong colour and it doesn't work.</en>\""
  - id: s15
    text: "Tam o sırada Fıstık kanepenin altından ulumaya başladı. Can: \"<en>{U4-019|Pardon}? {U4-019|Can you repeat that}, please?</en>\" Duru, hiç acele etmeden her şeyi baştan anlattı."
  - id: s16
    text: "Can: \"<en>Oh, I'm sorry about that. Don't worry, we can {U4-055|solve} this. Would you like to {U4-041|return} it and get your money back, or {U4-041|change} it for a new one?</en>\""
  - id: s17
    text: "Duru: \"<en>I'd like to {U4-041|change} it, please. A red one. Our band has a concert on Saturday.</en>\" Can: \"<en>Great. {U4-007|Hold on}, please. I'll check.</en>\""
  - id: s18
    text: "Telefondan bir melodi yükseldi. Elif yerinden fırladı: bu, Luna Ray'in yeni şarkısıydı!"
  - id: s19
    text: "Elif: \"<en>Don't {U4-006|hang up}, Duru! It's the chorus!</en>\" Ve telefona eğilip avazı çıktığı kadar şarkıya katıldı."
  - id: s20
    text: "Müzik birden kesildi. Can: \"<en>Hello? Er… is someone singing?</en>\" Elif'in yanakları domates gibi kızardı: \"<en>Oh no. I'm so {U4-050|embarrassed}!</en>\""
  - id: s21
    text: "Can güldü: \"<en>Don't worry, it's my favourite song too! Good news: a new red speaker will be {U4-039|delivered} on Wednesday. You were a very {U1-085|patient} {U4-038|customer}. Have a nice day!</en>\""
  - id: s22
    text: "Görüşme bitince Elif, Duru'ya onu yeni tanıyormuş gibi baktı: \"<en>Duru! You called a stranger, you waited, you said 'please' five times… Who are you?</en>\""
  - id: s23
    text: "Duru kanepeye geri gömüldü: \"<en>I usually {U2-011|don't mind} anything. But this speaker matters to me.</en>\""
  - id: s24
    text: "Akşam sınıf grubuna Duru'dan ömründe yazdığı en uzun mesaj düştü: \"<en>Speaker problem {U4-055|solved}. New one on Wednesday. Red. 🔴</en>\""
  - id: s25
    text: "Ece: \"<en>Wait… Duru called a {U4-036|call center} and {U4-055|solved} a problem? By herself? I'm saving this message forever!</en>\""
  - id: s26
    text: "Kaan: \"<en>Great! Now can I {U4-040|make a complaint} about Duru? She never answers MY calls! 😤</en>\" Duru'nun cevabı tek kelimeydi: \"<en>Wednesday.</en>\""
  - id: s27
    text: "Gece yarısına doğru Murat Bey de yazdı: \"<en>Tomorrow: a new part of your holiday homework. Get ready to visit your grandparents!</en>\""

scene:
  - id: c01
    speaker: Duru
    text: "<en>Hello. I'd like to make a complaint. My speaker was delivered today, but it doesn't work.</en>"
  - id: c02
    speaker: Can
    text: "<en>I'm sorry about that. Would you like to return it or change it?</en>"
  - id: c03
    speaker: Duru
    text: "<en>I'd like to change it for a red one, please.</en>"
  - id: c04
    speaker: Can
    text: "<en>No problem. We can solve this. A new one will be delivered on Wednesday.</en>"

