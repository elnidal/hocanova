tips:
  - type: tuzak
    refs: [U4-041]
    text: "return tek başına \"geri dönmek\"tir (return home). Nesnesi bir ürünse \"iade etmek\" olur: return a product. Bilet söz konusuysa return ticket \"gidiş-dönüş bileti\" demektir, tek yön değil."
  - type: kelime_ailesi
    refs: [U4-039, U4-038]
    text: "deliver (fiil) → delivery (isim): Free delivery! = Ücretsiz teslimat! Kargo yolda: The parcel will be delivered tomorrow. customer → customer service: müşteri → müşteri hizmetleri."
  - type: lgs_taktigi
    refs: [U4-040, U4-055]
    text: "\"Which one is a complaint?\" sorusunda sorun bildiren işaretleri ara: broken, late, doesn't work, wrong colour. Thank you ve Could I book… cümleleri şikâyet değildir. Görüşmenin sonunda Now it works! deniyorsa sorun solved demektir."
  - type: mini_dilbilgisi
    refs: [U4-022, U4-040]
    text: "Konuşma anında verilen karar will ile söylenir: Elif \"I'll call them for you.\" Duru \"No. I'll make a complaint.\" Önceden kurulmuş plan için ise going to: \"I'm going to phone the company tomorrow.\""

