story:
  - id: s01
    text: "Cuma, büyük gün. Tahtada kocaman bir başlık vardı: \"<en>Teen Life Survey: The Results</en>\". Gruplar haftalardır bu an için çalışıyordu."
  - id: s02
    text: "Bora kravat takmıştı. Duru şaşkınlıkla baktı: \"<en>Bora, why are you wearing a tie?</en>\" Bora yakasını düzeltti: \"<en>It's a big day! I want to look {U2-076|impressive}.</en>\""
  - id: s03
    text: "İlk sunum Ece, Selin ve Elif'indi. Ece ilk grafiği gösterdi: \"<en>We asked forty students. {U2-089|All of them} have a phone, and {U2-089|most of them} chat online every day.</en>\""
  - id: s04
    text: "Selin devam etti: \"<en>{U2-089|Half of them}, twenty out of forty, do sports in their free time. Only {U2-089|a few} read books.</en>\""
  - id: s05
    text: "Elif sırıttı: \"<en>And this is my favourite result: {U2-089|none of them} like homework!</en>\" Sınıftan alkış koptu."
  - id: s06
    text: "Sonra film türleri grafiği geldi. Selin: \"<en>{U2-073|Science fiction} is {U2-090|the most popular} genre. Romantic comedy got {U2-090|less than} ten votes.</en>\""
  - id: s07
    text: "Ece hafifçe kızardı: \"<en>Yes… I voted for romantic comedy.</en>\" Kaan arka sıradan bağırdı: \"<en>{U2-073|Science fiction} forever! 'Planet Zero' was {U2-074|awesome}!</en>\""
  - id: s08
    text: "Murat Bey defterine not aldı: \"<en>Very clear charts. That's {U2-075|terrific} work, girls.</en>\""
  - id: s09
    text: "Sıra Kaan, Bora ve Duru'daydı. Bora bilgisayara koştu, tıkladı… ve grafik ekrana ters yansıdı! Sütunlar tavandan sarkıyordu."
  - id: s10
    text: "Bora kıpkırmızı oldu: \"<en>Oh no, this is {U2-078|awful}!</en>\" Duru hiç acele etmeden bilgisayara uzandı ve iki tıkla grafiği düzeltti."
  - id: s11
    text: "Kaan boğazını temizledi: \"<en>Our first question was: What is the most {U2-091|relaxing} free time activity?</en>\""
  - id: s12
    text: "Duru grafiği gösterdi: \"<en>Sleeping got {U2-090|more than} twenty votes. It's the most {U2-091|relaxing} activity. I'm not surprised.</en>\" Bütün sınıf Duru'ya döndü; Duru omuz silkti."
  - id: s13
    text: "Bora ekledi: \"<en>Listening to music is second. And here's something {U2-077|fascinating}: in our school, girls listen to music {U2-090|more than} boys!</en>\""
  - id: s14
    text: "Kaan bir sonraki slayta geçti: \"<en>Our second question: What is the most {U2-092|enjoyable} activity with friends?</en>\""
  - id: s15
    text: "Kaan sütunları tek tek gösterdi: \"<en>Playing football is number one. Dancing is number two. Bora says dancing is very {U2-092|enjoyable}!</en>\" Bora küçük bir tavuk dansı figürü yaptı; bu kez bütün sınıf onunla birlikte dans etti."
  - id: s16
    text: "Duru son sütunu gösterdi: \"<en>And {U2-090|the least popular} activity is… doing homework together. Zero votes.</en>\""
  - id: s17
    text: "Murat Bey ayağa kalktı: \"<en>Both groups did a great job. Your presentations were really {U1-096|exciting}. I learnt a lot about you!</en>\""
  - id: s18
    text: "Selin, Kaan'a döndü: \"<en>Your group was great too. We {U1-064|support each other}, right?</en>\" Kaan güldü: \"<en>Always! Even when the chart is upside down!</en>\""
  - id: s19
    text: "Teneffüste Elif sordu: \"<en>Let's celebrate this weekend! A film night, a concert or a picnic?</en>\" Duru: \"<en>I {U1-018|prefer} my sofa. It's very {U2-091|relaxing}.</en>\""
  - id: s20
    text: "Ece pencereden dışarı baktı: \"<en>The weather is sunny. A picnic in the park would be really {U2-092|enjoyable}!</en>\""
  - id: s21
    text: "Bora parmaklarıyla saydı: \"<en>{U2-089|Most of us} want the park. Sorry, Duru!</en>\" Duru iç çekti: \"<en>Fine. But I'm bringing a pillow.</en>\""
  - id: s22
    text: "Akşam sınıf grubuna Murat Bey'den bir mesaj düştü: \"<en>Great presentations today. Your survey got {U2-090|more than} forty answers. {U2-076|Impressive}!</en>\""
  - id: s23
    text: "Ece telefonuna gülümsedi. Kasımda bir ödevle başlayan şey koca bir sınıf hikâyesine dönüşmüştü: provalar, film geceleri, spor salonu ve Kaan'ın zamanında geldiği o tek sabah."
  - id: s24
    text: "Gece geç saatte grupta son bir fotoğraf belirdi: Fıstık, Duru'nun yastığında mışıl mışıl uyuyordu. Altında Duru'nun notu vardı: \"<en>Fıstık's survey answer: sleeping. Always.</en>\""

scene:
  - id: c01
    speaker: Ece
    text: "<en>We asked forty students. All of them have a phone.</en>"
  - id: c02
    speaker: Selin
    text: "<en>Half of them do sports, but only a few read books.</en>"
  - id: c03
    speaker: Duru
    text: "<en>Sleeping is the most relaxing activity. It got more than twenty votes.</en>"
  - id: c04
    speaker: Kaan
    text: "<en>And football is the most enjoyable activity with friends. Homework is the least popular!</en>"

