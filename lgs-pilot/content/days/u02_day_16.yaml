tips:
  - type: lgs_taktigi
    refs: [U2-089]
    text: "Grafik sorularında oranı düşün: all = %100 · most = yarıdan fazla · half = %50 · a few = küçük bir sayı · none = %0. 40 kişiden 4'ü \"a few\", 30'u \"most\"tur."
  - type: tuzak
    refs: [U2-089, U2-090]
    text: "most of the students = öğrencilerin çoğu · the most popular = en popüler. \"the\" gelince anlam \"en\" olur: the most (en çok) ↔ the least (en az)."
  - type: kelime_ailesi
    refs: [U2-091, U2-092, U2-008]
    text: "relax → relaxing (rahatlatıcı, şey için) → relaxed (rahatlamış, kişi için): \"The music is relaxing. I feel relaxed.\" · enjoy → enjoyable: \"The picnic was enjoyable.\""
  - type: mini_dilbilgisi
    refs: [U2-090]
    text: "more than / less than iki şeyi karşılaştırır: \"Girls listen to music more than boys.\" Sayılabilen isimlerle resmî dilde fewer than da kullanılır: \"fewer than ten votes\"."

