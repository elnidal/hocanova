story:
  - id: s01
    text: "Cumartesi sabahı. Selin saat tam onda Ece'nin kapısındaydı, kucağında balonlarla."
  - id: s02
    text: "Kaan da geldi; sadece kırk dakika geç. \"<en>Sorry! I ran all the way!</en>\""
  - id: s03
    text: "Ece mutfaktayken Selin, Kaan'ın kulağına fısıldadı: \"Ece'ye sürpriz bir video hazırladık. Unutma, Ece bilmeyecek!\""
  - id: s04
    text: "Kaan başparmağını kaldırdı: \"<en>Don't worry. I can {U1-055|keep a secret}!</en>\""
  - id: s05
    text: "Beş dakika sonra Ece salona girdi ve Kaan, heyecandan kıpkırmızı, \"Ece, video çok güzel ol…\" dedi ve sustu."
  - id: s06
    text: "Selin'in bakışı üzerine hemen toparladı: \"<en>Video… games! {U1-008|How about} video games after the cake?</en>\""
  - id: s07
    text: "Ece bir şey anlamadı. Selin gülerek fısıldadı: \"<en>Kaan, you can't {U1-055|keep a secret} for five minutes!</en>\""
  - id: s08
    text: "Kaan omuz silkti: \"<en>Yes, I can! Look, I'm {U1-055|keeping the secret}… right now.</en>\""
  - id: s09
    text: "Saat ikiyi geçiyordu ve Bora hâlâ yoktu. Pasta da yoktu."
  - id: s10
    text: "Kaan söylendi: \"<en>He {U1-050|broke his promise} again! No cake for us!</en>\""
  - id: s11
    text: "Selin de endişeliydi: \"<en>Bora always {U1-050|breaks his promises}.</en>\""
  - id: s12
    text: "Ama Duru kanepeden doğrulup Bora'yı savundu: \"<en>No. I'll {U1-049|back him up}. Give him a chance. He will come.</en>\""
  - id: s13
    text: "Herkes şaşırdı; Duru ilk kez bu kadar hızlı ayağa kalkmıştı."
  - id: s14
    text: "Duru devam etti: \"<en>When I was sick, Bora brought my homework every day. He {U1-049|backed me up}.</en>\""
  - id: s15
    text: "Tam o sırada zil çaldı. Kapıda, terden sırılsıklam Bora vardı; elinde biraz ezilmiş ama kocaman bir pasta."
  - id: s16
    text: "\"<en>I'm sorry I'm late! An old lady in my street had heavy bags. I helped her carry them home.</en>\""
  - id: s17
    text: "Ece'nin annesi gülümsedi: \"<en>What a {U1-070|caring} boy!</en>\""
  - id: s18
    text: "Kaan önce pastaya, sonra Bora'ya baktı: \"<en>You {U1-054|kept your promise}! I can't believe it!</en>\""
  - id: s19
    text: "Bora gururla göğsünü kabarttı: \"<en>I always {U1-054|keep my promises}… sometimes.</en>\" Herkes güldü."
  - id: s20
    text: "Kaan biraz utandı: \"<en>Bora, I'm sorry. I said you {U1-050|broke your promise}. I was wrong.</en>\""
  - id: s21
    text: "Ece, Bora'ya sarıldı: \"<en>Thank you. You {U1-054|kept your promise}, and you were so {U1-070|caring} when you helped that lady.</en>\""
  - id: s22
    text: "Duru'nun da hakkını yememek gerekiyordu; bütün sabah Bora'yı savunmuştu. Ece ona döndü: \"<en>And you were so {U1-092|supportive}, Duru!</en>\""
  - id: s23
    text: "Selin ekledi: \"<en>Real friends are {U1-092|supportive}. They {U1-049|back you up} when others don't.</en>\""
  - id: s24
    text: "Telefon çaldı; arayan Ece'nin babaannesiydi: \"<en>Is everyone happy? Do you need anything, my dear?</en>\" Ece güldü: \"<en>Grandma, you are so {U1-070|caring}!</en>\""
  - id: s25
    text: "Bora fısıldadı: \"Bir sorun var: Hâlâ dans etmeyi bilmiyorum.\" Selin göz kırptı: \"<en>Don't worry. We'll be {U1-092|supportive}. We will all dance badly together!</en>\""
  - id: s26
    text: "Kapı yine çaldı. Komşu kızı Elif gelmişti; elinde Ece'nin gönderdiği {U1-012|INVITATION} vardı."
  - id: s27
    text: "Ece sevindi: \"<en>I'm so happy you {U1-001|accepted} my {U1-012|invitation}!</en>\""
  - id: s28
    text: "Kaan, Elif'e döndü: \"<en>{U1-026|Would you like to} dance with us? Don't worry, Bora can't dance!</en>\" Elif güldü: \"<en>{U1-011|I'd love to}!</en>\""
  - id: s29
    text: "Bora kıpkırmızı oldu ama müzik çoktan başlamıştı. Selin fısıldadı: \"<en>Next year, let's {U1-013|invite} a dance teacher!</en>\""

scene:
  - id: c01
    speaker: Kaan
    text: "<en>Bora is late. I think he broke his promise.</en>"
  - id: c02
    speaker: Duru
    text: "<en>I don't agree. I'll back him up. He always helps people.</en>"
  - id: c03
    speaker: Bora
    text: "<en>Here is the cake! I kept my promise!</en>"
  - id: c04
    speaker: Selin
    text: "<en>Shh! Don't forget the surprise video. Keep the secret!</en>"

