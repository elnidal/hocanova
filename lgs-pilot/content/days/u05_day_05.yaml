title: "Bedava davul"
est_minutes: 10
characters: [Bora, DrumKing_Official, Kaan, Duru, Selin, Ece, Elif, Bora'nın dedesi]
new_items: [U5-005, U5-010, U5-013, U5-017, U5-031, U5-049]

story:
  - id: s01
    text: "Cuma akşamı. Bora odasında yastıkları davul gibi dizmiş, iki kalemle ritim tutuyordu. Ahmet Amca'nın davulu harikaydı ama ödünçtü. Bora'nın en büyük hayali, kendine ait bir davul setiydi."
  - id: s02
    text: "Telefon titredi. Dün akşamki altın davullu profil yine ekrandaydı, adının yanında mavi bir tik: \"<en>DrumKing_Official sent you a {U5-005|friend request}.</en>\""
  - id: s03
    text: "Bora profile baktı: \"<en>2.3 million followers! He's a real drum {U5-031|influencer}! I really {U2-017|admire} drummers like him!</en>\""
  - id: s04
    text: "Parmağı bir saniye bile beklemedi: \"<en>{U5-005|Accept}! Of course!</en>\""
  - id: s05
    text: "Hemen bir mesaj düştü: \"<en>Hi Bora! I watched your band's concert video. Great drummer! I have a special {U1-017|offer} for you: a FREE drum set. 100% {U5-049|discount}! Only for my fans, only today!</en>\""
  - id: s06
    text: "Bora heyecandan Kaan'a sesli mesaj gönderdi: \"<en>Kaan! A famous drum {U5-031|influencer} is my friend now! A hundred percent {U5-049|discount}! I'm getting a real drum kit!</en>\""
  - id: s07
    text: "Kaan, basketbol çantasını kaparken cevap verdi, tabii yine koşarak: \"<en>WOW! Get one for me too! No, wait, I'm late for practice! Bye!</en>\""
  - id: s08
    text: "Mesajın altında kocaman, yanıp sönen kırmızı bir kutu vardı: \"<en>{U5-017|CLICK} HERE TO GET YOUR DRUM SET!</en>\" Bora'nın parmağı yine beklemedi."
  - id: s09
    text: "Açılan sayfanın tepesinde bir geri sayım vardı: \"<en>Your {U5-049|discount} ends in 09:59!</en>\" Altında: \"<en>{U5-006|Log in} with your ClipTube {U5-002|account} to get your prize. No {U5-002|account}? {U5-012|Sign up} here!</en>\""
  - id: s10
    text: "Bora iki kutuyu da saniyesinde doldurdu: \"<en>{U5-009|Username}: bora_drums. {U5-009|Password}: ●●●●●●●●. Easy!</en>\""
  - id: s11
    text: "O arada Bora, davul setinin fotoğrafını grubun Wrong Number sohbetine de atmıştı: \"<en>Look! My new friend is sending me THIS!</en>\" Sonra telefonu sessize aldı. Odaklanması lazımdı."
  - id: s12
    text: "Duru fotoğrafı görür görmez kanepede doğruldu: \"<en>Bora. That photo is from the SoundBox shop's website. I bought my red speaker there. It's their catalogue.</en>\""
  - id: s13
    text: "Duru: \"<en>He isn't a real {U5-031|influencer}. He's a {U5-013|stranger} with a stolen photo.</en>\""
  - id: s14
    text: "Selin: \"<en>Bora, you don't know this person. Please don't {U5-017|click} anything!</en>\""
  - id: s15
    text: "Ece: \"<en>And never give your {U5-010|personal information} to a {U5-013|stranger}!</en>\" Elif: \"<en>{U5-005|Ignore} him, Bora! Please!</en>\""
  - id: s16
    text: "Mesajlar telefonun üstünde birer birer belirip kayboluyordu. Ama telefon sessizdeydi ve Bora'nın gözü yalnız sayfadaydı."
  - id: s17
    text: "Yeni sayfa çıktı: \"<en>Great! Now {U5-024|type} your {U5-010|personal information}: full name, home address, date of birth, school.</en>\""
  - id: s18
    text: "Salonda Bora'nın dedesi her zamanki gibi caz dinliyordu. Annesi gece nöbetindeydi. İki adım ötede dedesi vardı, ama Bora ona hiçbir şey sormadı."
  - id: s19
    text: "Kaan, otobüs durağından son bir mesaj gönderdi: \"<en>Wait, I read the group chat. Bora, stop! Ask an {U2-072|adult} first! Don't give your {U5-010|personal information} to a {U5-013|stranger}!</en>\""
  - id: s20
    text: "Duru: \"<en>And Bora, you never {U5-007|log out} at school, and now this? Call me. Now.</en>\" Ama Bora'nın telefonu hâlâ sessizdeydi."
  - id: s21
    text: "Bora formu doldurmaya başladı: \"<en>Name: Bora… Address: …</en>\" Geri sayım akıyordu: 03:12, 03:11, 03:10…"
  - id: s22
    text: "Son kutu da doldu. Ekranın altında yeşil bir düğme parladı: \"<en>{U5-017|Press} SEND to get your FREE drum set!</en>\""
  - id: s23
    text: "Bora derin bir nefes aldı, gözlerini kapadı ve hayalindeki davul setini düşündü. Salondan dedesinin sesi geldi: \"<en>Bora! Dinner! And a little jazz!</en>\" Parmağı düğmenin üstündeydi…"

scene:
  - id: c01
    speaker: DrumKing_Official
    text: "<en>Hi! I'm a drum influencer. Accept my friend request!</en>"
  - id: c02
    speaker: DrumKing_Official
    text: "<en>Click here for a free drum set. 100% discount, only today!</en>"
  - id: c03
    speaker: Selin
    text: "<en>Bora, he's a stranger! Don't give him your personal information.</en>"
  - id: c04
    speaker: Bora
    text: "<en>Name, address, date of birth… OK, now I just press SEND!</en>"

