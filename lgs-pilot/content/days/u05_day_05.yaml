tips:
  - type: tuzak
    refs: [U5-013]
    text: "stranger = tanımadığın kişi (aynı mahalleden biri bile olabilir). Başka ülkeden gelen kişi foreigner'dır; strange ise \"tuhaf\" anlamında bir sıfattır."
  - type: kelime_ailesi
    refs: [U5-031]
    text: "influence (etki, etkilemek) → influencer (-er: kişi; çok takipçili sosyal medya fenomeni) → influential (-ial: sıfat, etkili). An influential book = etkili bir kitap."
  - type: lgs_taktigi
    refs: [U5-005, U5-010]
    text: "İnternet güvenliği metinlerinde doğru şık genellikle şudur: tanımadığın kişinin friend request'ini ignore et, personal information paylaşma, bir yetişkine söyle. 'Accept' ve 'share your address' içeren şıklar tuzaktır."
  - type: mini_dilbilgisi
    refs: [U5-017, U5-049, U5-010]
    text: "click on a link / click the button; ama press a button (press'ten sonra on gelmez). Örnek: \"Click on the link.\" · \"Press the green button.\""

