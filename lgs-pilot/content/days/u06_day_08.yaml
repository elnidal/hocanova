story:
  - id: s01
    text: "Kampın son gecesi, saat dokuz. Deniz Hoca herkesi çadırların önünde topladı. Herkesin elinde bir {U6-025|flashlight} vardı; Ece'nin elinde iki tane."
  - id: s02
    text: "Deniz Hoca kuralları saydı: \"<en>Stay on the path, stay together and follow my light. Watch your feet. I don't want anybody to {U6-015|fall}.</en>\""
  - id: s03
    text: "Sonra ekledi: \"<en>The path on the right goes to a {U6-039|cliff}. We never go there at night. At every corner, we turn left.</en>\""
  - id: s04
    text: "Orman simsiyahtı. Bora her yaprak hışırtısında zıplıyordu: \"<en>What was that? A bear? A wolf? Is it going to {U6-019|attack} us?</en>\""
  - id: s05
    text: "Selin: \"<en>It's a leaf, Bora. Leaves don't {U6-019|attack} people.</en>\""
  - id: s06
    text: "Grup bir an bir baykuşu dinlemek için durdu ve o sırada Deniz Hoca'nın ışığı virajın arkasında gözden kayboldu. Murat Bey de yanlarındaydı ama o da haritaya bakıp başını kaşıyordu: \"<en>Hmm. Left or right?</en>\""
  - id: s07
    text: "Kaan hemen sağa koşmak istedi. Bora, Kaan'ın arkasına saklandı. Ve Duru… Duru hiç telaşlanmadı. Her zamanki {U1-079|laid-back} haliyle durdu, gözlerini kapattı ve dinledi."
  - id: s08
    text: "Duru: \"<en>Stop. Listen. Water. Deniz Hoca said the stream is on the left. The right goes to the {U6-039|cliff}.</en>\""
  - id: s09
    text: "Duru {U6-025|flashlight}'ını soldaki ağaca tuttu: gövdede küçük, parlayan bir ok vardı. Kaan: \"<en>Duru, you're a genius!</en>\" Duru: \"<en>No. I just read signs. Lying down is my other {U6-047|skill}.</en>\""
  - id: s10
    text: "Elli adım sonra ağaçların arasından tanıdık bir ışık göründü. Deniz Hoca geri dönmüştü: \"<en>There you are! Well done, Duru. Good {U6-047|skills}. Every {U6-048|instructor} needs eyes and ears like yours.</en>\""
  - id: s11
    text: "Kaan, Duru'nun omzuna vurdu: \"<en>We can {U1-051|count on} Duru. Always. Even in the dark.</en>\" Duru esnedi: \"<en>Especially in the dark. It's like sleeping.</en>\""
  - id: s12
    text: "Kamp ateşi çıtırdıyordu. Elif şarkısını söyledi; o şarkı artık her akşamın açılışıydı. Sonra Deniz Hoca ateşin ışığında sesini alçalttı: \"<en>Now, some {U6-029|mysterious} stories.</en>\""
  - id: s13
    text: "Deniz Hoca: \"<en>Far in the north, there is a huge {U6-040|glacier}. It's white and blue, and very, very cold.</en>\""
  - id: s14
    text: "\"<en>Many years ago, two climbers were lost on that {U6-040|glacier} for three days. It was minus thirty degrees. Their fingers {U6-020|got frostbite}, but they didn't give up.</en>\""
  - id: s15
    text: "Bora: \"<en>Did they {U6-014|survive}?</en>\" Deniz Hoca: \"<en>Yes, they {U6-014|survived}. They had warm clothes, the right {U6-047|qualifications} and a plan. In the mountains, cold can cause {U6-021|death}, so experts never go without good equipment.</en>\""
  - id: s16
    text: "Ece uyku tulumunu çenesine kadar çekti: \"<en>{U6-020|Frozen} fingers? I'm never leaving my sleeping bag.</en>\""
  - id: s17
    text: "Kaan: \"<en>Can you {U6-020|get frostbite} here, at our camp?</en>\" Deniz Hoca güldü: \"<en>Not in April, Kaan. Only in {U6-002|extreme} cold.</en>\""
  - id: s18
    text: "\"<en>Some climbers even sleep on a {U6-039|cliff}, in a small bed that hangs on ropes, with an expert team.</en>\" Duru'nun gözleri parladı: \"<en>A hammock on a {U6-039|cliff}…</en>\" Selin: \"<en>No.</en>\""
  - id: s19
    text: "Deniz Hoca: \"<en>And now a legend. Old fishermen say a giant shark lives in a faraway sea. It {U6-019|attacks} boats on full-moon nights.</en>\" Selin: \"<en>Is that true, or just a {U6-029|mysterious} story?</en>\" Deniz Hoca: \"<en>Only a legend. Real sharks rarely {U6-019|attack} people.</en>\""
  - id: s20
    text: "Elif: \"<en>That's so {U2-077|fascinating}! I want to see a {U6-040|glacier} one day… from a warm café!</en>\""
  - id: s21
    text: "Tam o sırada Bora'nın koluna bir şey kondu. Bora yerinden fırladı: \"<en>{U6-019|Attack}! Help!</en>\" Herkes ışıklarını koluna tuttu: orada minicik, kırmızı, benekli bir uğur böceği duruyordu."
  - id: s22
    text: "Duru: \"<en>A {U6-029|mysterious} monster. Very small. Very red. Very {U6-011|dangerous}.</en>\" Bora uğur böceğini dikkatle bir yaprağa bıraktı: \"<en>Sorry, little friend. I was {U2-059|nervous}.</en>\""
  - id: s23
    text: "Murat Bey ateşe bir odun daha attı: \"<en>Tonight there was no {U6-013|accident}, no lost student and no shark. Good work, team.</en>\""
  - id: s24
    text: "Çadıra dönerken Elif, Mia'ya kısa bir mesaj yazdı: \"<en>Tonight: a night walk, a campfire and a red monster!</en>\" Mia'nın cevabı hemen geldi: bir fotoğraf ve altında tek kelime, \"<en>Look!</en>\" Ama ormanda internet o fotoğrafı açmaya yetmedi. Elif yarına kadar bekleyecekti."

