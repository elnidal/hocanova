tips:
  - type: tuzak
    refs: [U6-029]
    text: "mysterious = gizemli, esrarengiz (açıklaması bilinmeyen). Bazı kaynaklar \"gizli\" der ama gizli, saklı = secret: a secret plan ≠ a mysterious light."
  - type: tuzak
    refs: [U6-040]
    text: "glacier karada, dağdan çok yavaş akan dev buz kütlesidir (buzul). Denizde yüzen buz dağı ise iceberg'dür; ikisini karıştırma."
  - type: ilginc_bilgi
    refs: [U6-019]
    text: "Köpekbalıkları insanlara çok nadir saldırır; çoğu köpekbalığı balık ve deniz canlılarıyla beslenir. Asıl tehlikede olan, insanların avladığı köpekbalıklarıdır."
  - type: kelime_ailesi
    refs: [U6-020]
    text: "frost (ayaz, kırağı) + bite (ısırık) = frostbite. get frostbite → geçmişte got frostbite. Ünite 3'teki freeze'in üçüncü hâli frozen = donmuş."

