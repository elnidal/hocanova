tips:
  - type: tuzak
    refs: [U6-015]
    text: "fall = düşmek; geçmiş zamanı fell (He fell and hurt his leg). Amerikan İngilizcesinde fall aynı zamanda sonbahar demektir (İngiliz İngilizcesinde autumn)."
  - type: tuzak
    refs: [U6-047]
    text: "qualification \"özellik\" demek değildir: gereken nitelik, yeterlik, belge demektir (a first-aid qualification). Özellik = feature."
  - type: kelime_ailesi
    refs: [U6-021]
    text: "die (ölmek, fiil) → death (ölüm, isim) → dead (ölü, sıfat). rate of death = ölüm oranı; tablolarda sık çıkar."

