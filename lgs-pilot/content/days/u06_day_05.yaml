story:
  - id: s01
    text: "Cuma sabahı, saat 6.58. Otobüsün motoru çalışıyordu ve Selin on beş dakikadır yerindeydi. Tam kapılar kapanırken Kaan nefes nefese basamaklara atladı: \"<en>Sorry, sorry! Three alarms, one bus!</en>\""
  - id: s02
    text: "Yol iki saat sürdü. Elif şarkı söyledi, Duru uyudu, Ece listesini üç kez kontrol etti. Otobüs gölün kenarındaki kampa vardığında onları uzun boylu, boynunda düdük olan bir adam karşıladı."
  - id: s03
    text: "Murat Bey: \"<en>Good morning, team! This is Deniz Hoca, our camp {U6-048|instructor}.</en>\""
  - id: s04
    text: "Deniz Hoca: \"<en>Welcome! I'm your {U6-048|instructor} for two days. Rule one: {U2-041|pay attention}. Rule two: no {U6-048|instructor}, no activity.</en>\""
  - id: s05
    text: "Kaan'ın eli çoktan havadaydı: \"<en>What {U6-047|qualifications} do you have? Can you do {U6-006|skydiving}?</en>\""
  - id: s06
    text: "Deniz Hoca güldü: \"<en>I have first-aid and climbing-wall {U6-047|qualifications}, and I'm a {U6-007|paragliding} pilot. But at this camp, no sky. Only the ground and the lake.</en>\""
  - id: s07
    text: "Deniz Hoca: \"<en>I have {U6-047|skills}, but you need {U6-047|skills} too: listening, waiting and helping each other.</en>\""
  - id: s08
    text: "Deniz Hoca: \"<en>Most {U6-013|accidents} happen when people don't listen. They are in a hurry, or they forget the rules.</en>\""
  - id: s09
    text: "Deniz Hoca: \"<en>So how do we stop {U6-013|accidents}? {U6-023|Helmets}, {U6-024|ropes}, {U6-026|life jackets}… and no running!</en>\""
  - id: s10
    text: "Tam o sırada Kaan, zip-line'ı yakından görmek için koşar adım yola çıkmıştı. Deniz Hoca'nın düdüğü öttü: \"<en>Kaan! Running near the activity area? That's how {U6-013|accidents} start!</en>\" Kaan olduğu yerde durdu: \"<en>Sorry, sorry!</en>\""
  - id: s11
    text: "Deniz Hoca: \"<en>Now, the climbing wall. What happens if you {U6-015|fall}? Stay {U1-069|calm}. The {U6-024|rope} holds you, and you stay in the air like a spider.</en>\""
  - id: s12
    text: "Bora bir anda bembeyaz oldu ve fısıldadı: \"<en>A spider? Are there spiders here?</en>\" Duru yanında esnedi: \"<en>Only on the wall. Big, colourful plastic ones.</en>\""
  - id: s13
    text: "Selin: \"<en>And what if we {U6-015|fall} into the lake?</en>\" Deniz Hoca: \"<en>Your {U6-026|life jacket} keeps you on top of the water. Then you swim to the boat. And an {U6-048|instructor} is always there.</en>\""
  - id: s14
    text: "Brifingden sonra herkes eşyasını çadırlara yerleştirdi. Akşam yemeğinden önce Elif dergisini açtı; okuma köşesinde karlı bir dağda geçen bir hikâye vardı."
  - id: s15
    text: "Elif okudu: \"<en>'A Night on the Mountain. Aras Demir got lost on a snowy mountain. He {U6-015|fell} and hurt his leg. But he {U6-014|survived} for two nights.'</en>\""
  - id: s16
    text: "Ece: \"<en>How did he {U6-014|survive}?</en>\" Elif: \"<en>He stayed in one place. He had warm clothes, water and a flashlight. On the third night, a rescue team saw his light.</en>\""
  - id: s17
    text: "Ece defterini zafer kazanmış gibi havaya kaldırdı: \"<en>Warm clothes, water, a {U6-025|flashlight}… All on my list!</en>\""
  - id: s18
    text: "Kaan: \"<en>I can {U6-014|survive} anywhere! Two nights? Easy!</en>\" Selin: \"<en>Kaan, you can't {U6-014|survive} one hour without your phone.</en>\""
  - id: s19
    text: "Sayfanın altında küçük bir bilgi notu ve bir tablo vardı. Selin notu okudu: \"<en>'Info: In the mountains, people can {U6-021|die} from the cold. Always take warm clothes and tell an adult your plan.'</en>\""
  - id: s20
    text: "Kaan tabloyu parmağıyla gösterdi: \"<en>Look! The {U6-021|rate of death} in {U6-005|bungee jumping} is very low! It's {U6-033|safer than} people think!</en>\""
  - id: s21
    text: "Deniz Hoca yanlarından geçerken durdu: \"<en>Low, but not zero, Kaan. The {U6-021|rate of death} is low {U6-037|because} good teams don't {U6-012|take risks}.</en>\""
  - id: s22
    text: "Deniz Hoca: \"<en>Tomorrow, the climbing wall. It's {U6-028|challenging}, but you're never alone on it.</en>\" Herkes başını kaldırıp gölün kıyısındaki on iki metrelik duvara baktı."
  - id: s23
    text: "O gece çadırda Bora tavana bakıyordu: \"<en>Duru, I need a good {U1-007|excuse} for tomorrow. 'My cat is sick'?</en>\""
  - id: s24
    text: "Duru uyku tulumunun içinden, gözlerini açmadan cevap verdi: \"<en>You don't have a cat, Bora.</en>\" Bora iç çekti. Bu sefer kedi işe yaramayacaktı."

