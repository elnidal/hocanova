  end_good: "Dedektif rozeti senin! Selin bile bu kadar hızlı çözemezdi. 🕵️"
  end_mixed: "{weak} biraz kaçtı, sorun değil. Kaan da bugün ilk kez durup düşündü; yarın bir tur daha!"

