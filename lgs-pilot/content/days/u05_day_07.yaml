story:
  - id: s01
    text: "Salı akşamı, saat dokuzu beş geçe. Sınıf grubuna bir mesaj düştü ve telefonlar arka arkaya titremeye başladı."
  - id: s02
    text: "Mesajda karlı bir okul bahçesinin fotoğrafı ve kocaman harfler vardı: \"<en>BREAKING NEWS! No school tomorrow because of heavy snow! Share it with everyone! ❄️</en>\" Altında hiç tanınmayan bir hesap adı: @izmir_flash_news."
  - id: s03
    text: "Kaan saniyesinde yazdı: \"<en>YESSS! No school! {U5-059|Why don't we} {U2-058|share it on social media}? My followers must know!</en>\""
  - id: s04
    text: "Selin'in cevabı da aynı hızla geldi: \"<en>Wait, Kaan. Who wrote this? Where does this {U5-042|information} come from?</en>\""
  - id: s05
    text: "Kaan: \"<en>{U5-057|What do you mean}? It's news! There's a photo! A photo can't lie!</en>\""
  - id: s06
    text: "Ece'den bir ekran görüntüsü geldi: \"<en>Er… my weather app says sunny and 18 degrees tomorrow. Is my app {U5-015|broken}?</en>\""
  - id: s07
    text: "Selin'in kaşı ekranın öbür ucundan bile hissediliyordu: \"<en>I {U2-054|follow the news} every morning. There was no snow warning for İzmir. Give me five minutes. I'll {U5-038|do some research}.</en>\""
  - id: s08
    text: "Bora: \"<en>{U5-038|Research}? At nine p.m.? OK, Selin. After my account problem, I don't trust anything on the Internet.</en>\" Hesabını annesiyle geri alalı çok olmamıştı."
  - id: s09
    text: "Selin masasına geçti: \"<en>I'm {U5-023|turning on} my laptop.</en>\" Ekranda bir {U5-016|web browser} belirdi; Selin {U5-022|search engine}'e üç kelime yazdı: \"<en>İzmir snow tomorrow</en>\"."
  - id: s10
    text: "Birkaç saniye sonra gruba yazdı: \"<en>Results: 'A sunny week in İzmir.' 'Snow in İzmir? Very rare!' And look: the same photo is on ten websites. It's from a school in another country, from 2019.</en>\""
  - id: s11
    text: "Elif: \"<en>Wow! Selin, how do you do that?</en>\" Selin: \"<en>Easy. I {U5-022|search for} the news on a {U5-022|search engine}, and then I check two or three websites. Very {U5-046|useful}!</en>\""
  - id: s12
    text: "Selin: \"<en>Next: the school's official website.</en>\" Bora: \"<en>Which {U5-016|browser} do you use? Mine only remembers karate cat videos.</en>\""
  - id: s13
    text: "Okulun sayfası ekrana geldi. Selin: \"<en>I'm {U5-016|browsing} the school website now. It's {U5-020|online} and it's {U5-026|working properly}. There's only one announcement…</en>\""
  - id: s14
    text: "Duyuru tek satırdı: \"<en>Safer Internet Week: Think before you share!</en>\" Grupta kısa bir sessizlik oldu."
  - id: s15
    text: "Duru, kanepesinden bu akşamki ilk mesajını yazdı: \"<en>Maybe we need an {U5-039|expert}. A weather person. A real one.</en>\""
  - id: s16
    text: "Selin bir bağlantı attı: \"<en>Already found one. A weather {U5-039|expert} from the university writes: 'Sunny and warm all week. Snow in İzmir? Not this year.'</en>\""
  - id: s17
    text: "Kaan: \"<en>OK, Detective Selin. One more piece of {U5-042|information}, please. Is the news fake?</en>\""
  - id: s18
    text: "Selin: \"<en>Yes. One unknown account says snow. The {U5-039|experts}, the school website and Ece's app say sun.</en>\" Ece: \"<en>So my app isn't {U5-015|broken}! Good. I'm not buying snow boots tonight.</en>\""
  - id: s19
    text: "İşte o an Kaan itiraf etti. Mesajı kopyalamış, göndermek üzereymiş; parmağı tuşun bir milim üstündeymiş: \"<en>I almost sent it to my basketball team. And to my grandma. And to Murat Bey!</en>\""
  - id: s20
    text: "Duru: \"<en>Your fingers {U1-075|are always in a hurry}, Kaan. Your brain comes later. By bus.</en>\" Kaan güldü; bu kez itiraz edemedi."
  - id: s21
    text: "Kaan: \"<en>Fair. OK, I'm {U5-018|deleting} it. New rule for me: first I {U5-022|search for} it, then I share it.</en>\""
  - id: s22
    text: "Sonra sınıf grubuna, hayatında ilk kez göndermeden önce iki kez okuyarak yazdı: \"<en>Guys, the snow news is FAKE. Selin {U5-038|did research}. There is school tomorrow. Sorry!</en>\""
  - id: s23
    text: "Elif: \"<en>Selin, this was so {U5-046|useful}! You're a real news detective!</en>\" Bora: \"<en>Kaan, who are you? Where is the real Kaan?</en>\""
  - id: s24
    text: "Saat onda Murat Bey de yazdı: \"<en>Well done, Selin. And well done, Kaan, for stopping. Real {U5-042|information} comes from real sources. A {U5-022|search engine} is {U5-046|useful}, but a good question is even better: 'Who wrote this?' And yes, there IS school tomorrow. 😊</en>\""
  - id: s25
    text: "Kaan son sözü yine kaptı: \"<en>Tomorrow I'm writing rule number one for our guide: 'Ask Selin first.'</en>\" Selin kaşını kaldırdı, ama bu kez gülümseyerek."

scene:
  - id: c01
    speaker: Kaan
    text: "<en>Why don't we share the snow news? No school tomorrow!</en>"
  - id: c02
    speaker: Selin
    text: "<en>Wait. I did some research with a search engine. The information is wrong.</en>"
  - id: c03
    speaker: Kaan
    text: "<en>What do you mean? There's a photo!</en>"
  - id: c04
    speaker: Selin
    text: "<en>The photo is old, and a weather expert says it'll be sunny. The school website is more useful than a photo.</en>"

