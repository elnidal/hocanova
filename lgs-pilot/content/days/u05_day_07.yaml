tips:
  - type: tuzak
    refs: [U5-042]
    text: "information sayılamaz: informations ya da an information denmez. some information, a lot of information, a piece of information (bir parça bilgi) doğru biçimlerdir. advice de böyledir."
  - type: mini_dilbilgisi
    refs: [U5-022]
    text: "search for + aradığın şey: I'm searching for my phone. search + yer ise o yerin içini aramaktır: I'm searching my bag (çantamın içine bakıyorum). İnternette: search for information, use a search engine."
  - type: kelime_ailesi
    refs: [U5-016, U2-056]
    text: "browse (fiil) → browser / web browser (program). browse the Internet ile Ü2'deki surf the Internet aynı işi anlatır: sayfadan sayfaya gezinmek."
  - type: lgs_taktigi
    refs: [U5-039, U5-042]
    text: "Okuma metinlerinde Experts say … ya da According to experts … kalıbı sık gelir: ardından gelen cümle metnin güvendiği bilgidir. Haberin kaynağını soran sorularda bu cümleyi işaretle."

