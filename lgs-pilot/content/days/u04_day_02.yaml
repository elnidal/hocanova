title: "Kırk dakika"
est_minutes: 10
characters: [Ece, Kaan, Kaan'ın annesi, Selin, Duru, Bora, Sevim Hanım]
new_items: [U4-001, U4-009, U4-010, U4-014, U4-016, U4-023]

story:
  - id: s01
    text: "Tatilin ikinci sabahı, Bursa. Ece plan defterini açtı. Listede tek bir isim kalmıştı, kırmızı kalemle üç kez daire içine alınmış: Kaan."
  - id: s02
    text: "Ece, Kaan'ın cep numarasını aradı. Yine o kısa, inatçı ses: düt… düt… düt… Ardından robot bir kadın sesi: \"<en>Sorry. The line is {U4-016|engaged}. Please try again later.</en>\""
  - id: s03
    text: "Ece on dakikada bir denedi ve her denemeyi defterine yazdı: \"<en>9.00 – {U4-016|engaged}. 9.10 – {U4-016|engaged}. 9.20 – STILL {U4-016|engaged}! Who is he talking to?!</en>\""
  - id: s04
    text: "Aynı saatlerde İzmir'de Kaan odasında bir aşağı bir yukarı yürüyordu. Tam kırk dakikadır okul takımının koçuyla konuşuyor, yine yedek kalmasına itiraz ediyordu: \"<en>But Coach, I {U2-033|train} three times a week! Why am I a substitute again? It isn't {U1-071|fair}!</en>\""
  - id: s05
    text: "Ece pes etmedi; bu kez Kaan'ların ev telefonunu aradı. Hattın öbür ucundan Kaan'ın annesinin sesi geldi. Ece: \"<en>Hello, {U4-031|this is} Ece, Kaan's friend. {U4-026|Could I speak to} Kaan, please?</en>\""
  - id: s06
    text: "Kaan'ın annesi: \"<en>Oh, hello, Ece! {U4-023|I'm afraid} he isn't {U4-014|available} at the moment. He's on his mobile with his basketball coach. For forty minutes!</en>\""
  - id: s07
    text: "Ece: \"<en>So that's why his line is always {U4-016|engaged}!</en>\" Kaan'ın annesi iç çekti: \"<en>Yes. He's very {U1-004|busy}. He says it's 'the most important call of his life'.</en>\""
  - id: s08
    text: "Kaan'ın annesi: \"<en>Can I {U4-009|take a message}?</en>\" Ece: \"<en>Yes, please! Could you ask him to {U4-001|call me back}? {U1-094|As soon as possible}, please. It's about a concert!</en>\""
  - id: s09
    text: "Kaan'ın annesi telefonu omzuyla kulağının arasına sıkıştırdı; çekmeceden bir kalem, buzdolabının yanından küçük pembe bir kâğıt buldu: \"<en>{U4-007|Hang on}… OK. Let me read it back to you.</en>\""
  - id: s10
    text: "Kâğıda yazdığını yüksek sesle okudu: \"<en>'{U4-010|Memo} for Kaan: Ece called. Concert! Please {U4-001|call her back}.' Is that OK?</en>\" Ece: \"<en>Perfect, thank you!</en>\""
  - id: s11
    text: "Kaan'ın annesi pembe kâğıdı buzdolabının kapağına, pizza dilimi şeklindeki mıknatısın altına sıkıştırdı. Tam o sırada çaydanlık öttü, kapıya kargo geldi ve kâğıt mıknatısın altında öylece kaldı. Kimse ona bir daha bakmadı."
  - id: s12
    text: "Akşam Ece sınıf grubuna yazdı: \"<en>Has anybody talked to Kaan today? I need him for the concert!</en>\""
  - id: s13
    text: "Urla'dan Selin, her zamanki gibi ilk yazan oldu: \"<en>His line was {U4-016|engaged} at ten, at one and at four. I checked. Did you {U4-009|leave a message}?</en>\""
  - id: s14
    text: "Duru: \"<en>Kaan is never {U4-014|available}. It's a fact, like gravity.</en>\" Bora: \"<en>Says the girl who never {U4-011|picks up}. 😄</en>\""
  - id: s15
    text: "Ertesi gün de Kaan'dan ses çıkmadı. Ece bu kez sesli mesaja düştü ve bip sesinden sonra konuştu: \"<en>Kaan, it's Ece. Again. I {U4-009|left a message} with your mum yesterday. Please, please {U4-001|call me back}!</en>\""
  - id: s16
    text: "İki gün sonra Kaan sahadan aç kurt gibi döndü ve buzdolabının kapağını hızla çekti. Pizza mıknatısı yere düştü; altından pembe bir kâğıt süzülüp ayaklarının dibine kondu."
  - id: s17
    text: "Kaan kâğıdı okudu ve gözleri fal taşı gibi açıldı: \"<en>Mum! What's this {U4-010|memo}? When did Ece call?!</en>\" Annesi salondan seslendi: \"<en>Oh no… two days ago! {U4-023|I'm afraid} I forgot. Sorry, love. It was under the pizza!</en>\""
  - id: s18
    text: "Kaan ışık hızıyla Ece'yi aradı. Ece daha 'alo' diyemeden: \"<en>Ece! Sorry, sorry, sorry! I'm {U4-001|calling you back}! I'm two days late, but I'm calling! Blame the pizza {U4-010|memo}!</en>\""
  - id: s19
    text: "Ece: \"<en>Kaan! Your line was {U4-016|engaged} for forty minutes! Who were you talking to?</en>\" Kaan: \"<en>My coach. I'm still a substitute… but now I can play ten minutes in the next match! Ten whole minutes!</en>\""
  - id: s20
    text: "Ece konseri anlattı: pastane, tatilin son cumartesisi, ilk sahne. Kaan: \"<en>A concert? Great! But wait, I'm not {U4-014|available} on match days. Let me check my match list. {U4-001|I'll get back to you}!</en>\" Ve düt… Hat kesildi."
  - id: s21
    text: "Ece telefona bakakaldı, sonra gruba yazdı: \"<en>Kaan {U4-001|called back} after two days. Then he said 'I'll get back to you.' 😐</en>\" Selin: \"<en>So… see you on Friday, Kaan.</en>\""
  - id: s22
    text: "Gece yarısına doğru Ece'nin telefonu bir kez daha titredi. Sevim Hanım'dan sesli mesaj: \"<en>Ece dear, {U4-023|I'm afraid} there's a small problem. The shop is {U4-014|available} on Saturday, but my head office must say yes first. Call me in the morning!</en>\""

scene:
  - id: c01
    speaker: Ece
    text: "<en>Hello, this is Ece. Could I speak to Kaan, please?</en>"
  - id: c02
    speaker: Kaan'ın annesi
    text: "<en>I'm afraid he isn't available at the moment. He's on the phone with his coach. Can I take a message?</en>"
  - id: c03
    speaker: Ece
    text: "<en>Yes, please. Could you ask him to call me back? It's about a concert.</en>"
  - id: c04
    speaker: Kaan'ın annesi
    text: "<en>Of course. I'm writing a memo for him now.</en>"
  - id: c05
    speaker: Kaan
    text: "<en>Ece, sorry! I found the memo two days later! I'll get back to you!</en>"

