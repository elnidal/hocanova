story:
  - id: s01
    text: "Cuma akşamı. Selin sınıf grubuna yazdı: \"<en>Film night at Duru's! Who wants to {U1-005|come over}?</en>\" Bir dakika içinde beş kişi \"<en>Me!</en>\" yazdı."
  - id: s02
    text: "Duru'nun salonu hazırdı: puflar, battaniyeler ve kocaman bir kova patlamış mısır. Fıstık kapıda herkesi tek tek kokladı."
  - id: s03
    text: "Kaan uzaktan kumandayı kaptı: \"<en>I've got the film! It's called 'Planet Zero'. It's {U2-073|science fiction}: spaceships, robots and aliens!</en>\""
  - id: s04
    text: "Ece burnunu kırıştırdı: \"<en>{U2-073|Science fiction} again? I {U1-018|prefer} romantic comedies.</en>\""
  - id: s05
    text: "Selin telefonunu gösterdi: \"<en>I {U2-056|surfed the internet} this afternoon. People say this film is {U2-074|awesome}. Five stars!</en>\""
  - id: s06
    text: "Bora mısır kovasını havaya kaldırdı: \"<en>Wait! First, let's {U2-057|take a selfie}!</en>\" Fotoğrafta herkes vardı… ama Bora'nın yüzü kovanın arkasında kalmıştı."
  - id: s07
    text: "Elif kahkahayı bastı: \"<en>That's {U2-060|ridiculous}, Bora! We can only see your eyebrows!</en>\""
  - id: s08
    text: "Bora hiç bozulmadı: \"<en>It's art. I'm going to {U2-058|share it on social media}.</en>\""
  - id: s09
    text: "Film başladı. Dev bir uzay gemisi bütün ekranı kapladı. Kaan pufundan fırladı: \"<en>Look at that spaceship! It's {U2-074|awesome}!</en>\""
  - id: s10
    text: "Selin gözlüğünü düzeltti: \"<en>The special effects are really {U2-076|impressive}. Everything looks so real.</en>\""
  - id: s11
    text: "Ekranda mor okyanuslar ve şarkı söyleyen ağaçlar belirdi. Elif gözünü kırpmayı unuttu: \"<en>This planet is {U2-077|fascinating}. I can't stop watching!</en>\""
  - id: s12
    text: "Filmin ortasında kahraman bir yanardağın kenarından kaydı. Bora yastığını sıktı: \"<en>I'm so {U2-059|nervous}! Is he going to fall?</en>\""
  - id: s13
    text: "Robot, kahramanı son saniyede yakaladı. Kaan iki kolunu havaya kaldırdı: \"<en>Yes! What a {U2-075|terrific} scene!</en>\""
  - id: s14
    text: "Ece kaşlarını kaldırdı: \"<en>{U2-075|Terrific}? Is that good or bad?</en>\" Selin fısıldadı: \"<en>Very, very good! It sounds like 'terrible', but it isn't.</en>\""
  - id: s15
    text: "Duru ise filmin yarısında pufunda uyuyakalmıştı. Fıstık da ayağının dibinde horluyordu."
  - id: s16
    text: "Sonra uzaylı kral şarkı söylemeye başladı: tiz, cırlak, kulak tırmalayan bir ses. Fıstık uyanıp uludu. Ece kulaklarını kapattı: \"<en>Oh no, that song is {U2-078|awful}!</en>\""
  - id: s17
    text: "Bora güldü: \"<en>{U2-078|Awful}? It's worse than Fıstık's singing!</en>\" Fıstık bir kez daha uludu; sanki itiraz ediyordu."
  - id: s18
    text: "Film bitti. Kaan ışıkları açtı ve oylama başlattı: \"<en>One word for the film. Go!</en>\""
  - id: s19
    text: "Kaan: \"<en>{U2-074|Awesome}!</en>\" Selin: \"<en>{U2-076|Impressive}.</en>\" Elif: \"<en>{U2-077|Fascinating}!</en>\""
  - id: s20
    text: "Ece kollarını kavuşturdu: \"<en>The spaceships were OK, but that song was {U2-078|awful}. And the story was a bit {U1-095|boring}.</en>\""
  - id: s21
    text: "Tam o anda Duru gözlerini açtı: \"<en>What did I miss? Was it {U2-075|terrific}?</en>\" Herkes bir ağızdan: \"<en>You missed the whole film, Duru!</en>\""
  - id: s22
    text: "Gece herkes evine döndü ama grup susmadı. Elif yazdı: \"<en>Is anyone awake? That planet was so {U2-077|fascinating}. Let's {U2-055|chat online} about it!</en>\""
  - id: s23
    text: "Bu arada Bora'nın fotoğrafı beş yüz beğeni almıştı. Altında bir yorum vardı: \"<en>The best {U2-073|science fiction} poster ever: Popcorn Man!</en>\""
  - id: s24
    text: "Bora telefonu göğsüne bastırdı: \"<en>I'm famous! My eyebrows are famous!</en>\" Selin cevap yazdı: \"<en>Five hundred likes? OK, that's {U2-076|impressive}.</en>\""

scene:
  - id: c01
    speaker: Kaan
    text: "<en>What did you think of 'Planet Zero'? I think it was awesome!</en>"
  - id: c02
    speaker: Selin
    text: "<en>The special effects were really impressive.</en>"
  - id: c03
    speaker: Elif
    text: "<en>The purple planet was fascinating. I loved it.</en>"
  - id: c04
    speaker: Ece
    text: "<en>The alien king's song was awful! But the robot scene was terrific.</en>"

