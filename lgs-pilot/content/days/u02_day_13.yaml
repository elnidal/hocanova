tips:
  - type: tuzak
    refs: [U2-075, U2-078]
    text: "terrific ≠ terrible! terrific = müthiş, harika (olumlu) · terrible = korkunç (olumsuz). awful da olumsuzdur: berbat. \"What a terrific day!\" iltifattır, şikâyet değil."
  - type: ilginc_bilgi
    refs: [U2-074, U2-078]
    text: "awesome ve awful aynı kökten gelir: awe (hayranlıkla karışık korku). Zamanla awesome olumlu, awful olumsuz anlam kazandı. İkiz kardeşler ama hiç anlaşamıyorlar!"
  - type: kelime_ailesi
    refs: [U2-076, U2-077]
    text: "impress (etkilemek) → impressive (etkileyici) · fascinate (büyülemek) → fascinating (büyüleyici) → fascinated (büyülenmiş): \"The film was fascinating. I was fascinated.\""
  - type: lgs_taktigi
    refs: [U2-074, U2-076, U2-078]
    text: "LGS'de görüş sorularında önce metnin olumlu mu olumsuz mu olduğuna bak. awesome, terrific, impressive, fascinating (+) · awful, boring (−). Yön belli olunca şıkların yarısı elenir."

coach:
  start: "Cuma akşamı film gecesi! 🍿 Uzay gemileri, robotlar, uzaylılar ve pufta uyuyan Duru. Hazır mısın?"
  end_good: "Süpersin! 🎬 Artık bir filmi altı farklı kelimeyle yorumlayabilirsin. Kaan'ın oylamasında benim kelimem senin için: awesome!"
  end_mixed: "{weak} biraz kafa karıştırdı, çok normal; Duru bütün filmi kaçırdı, sen sadece bir sahneyi! 😄 Yarın tekrar karşılaşacaksınız."

notifications:
  morning: "Bu akşam Duru'da film gecesi! 🍿 Bora'nın fotoğrafında neden sadece kaşları var?"
  evening: "Uzaylı kral şarkı söyledi, Fıstık uludu. Film gecesinin sonu 10 dakikalık derste!"
  review: "Tek soru: terrific iyi bir şey mi, kötü bir şey mi? 🤔"

