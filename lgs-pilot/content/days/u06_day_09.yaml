    refs: [U6-042]
    text: "view isim olarak \"manzara\"dır (a great view), ama fiil olarak \"görmek, izlemek\" demektir (view the photos). scenery de manzara ama sayılamaz: ❌ sceneries → ✓ beautiful scenery."
  - type: kelime_ailesi
    refs: [U6-055]
    text: "explore (fiil, keşfetmek) → explorer (isim, kâşif) → exploration (isim, keşif). Explorers explore new places."
  - type: ilginc_bilgi
    refs: [U6-043]
    text: "Dünyanın en yüksek şelalesi Venezuela'daki Angel Falls (Kerepakupai Merú): su yaklaşık 979 metreden dökülüyor!"

