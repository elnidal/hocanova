story:
  - id: s01
    text: "Pazartesi. Kamptan döneli iki gün olmuştu ama sınıfta herkes hâlâ kampı konuşuyordu. Murat Bey tahtanın yanına kocaman bir dünya haritası astı: \"<en>Dream Adventure Map!</en>\""
  - id: s02
    text: "Murat Bey herkese renkli iğneler dağıttı: \"<en>Choose your dream {U6-041|destination}. Put a pin on the map and tell us about it. What can you {U6-055|explore} there?</en>\""
  - id: s03
    text: "Ece'nin elinde tabii ki üç renk kalemle hazırlanmış bir sunum vardı: \"<en>My {U6-041|destination} is Cappadocia. I want to fly in a hot-air balloon and see the {U6-042|view} from the sky.</en>\""
  - id: s04
    text: "Kaan iğnesini Himalayalar'a sapladı: \"<en>The Himalayas! I want to {U6-009|climb} a real mountain one day. With an instructor, of course!</en>\" Selin kaşını kaldırdı. Kaan: \"<en>What? I {U6-050|improved}! I wait now!</en>\""
  - id: s05
    text: "Selin: \"<en>I'm {U1-038|interested in} nature. My {U6-051|goal} is to see the {U6-043|waterfalls} in Iceland. The {U6-042|scenery} there is like a dream.</en>\""
  - id: s06
    text: "Sıra Duru'ya geldi. İğnesini haritanın küçük, yeşil bir köşesine taktı: \"<en>My dream {U6-041|destination}: a quiet {U6-044|hill} with one tree. And a hammock.</en>\" Kaan: \"<en>That's it? No {U6-001|adventure}?</en>\" Duru: \"<en>A good {U6-042|view}. A good nap. That's my {U6-001|adventure}.</en>\""
  - id: s07
    text: "Bora haritada doğuda, karlı zirvelerin arasından kıvrıla kıvrıla geçen ince bir çizgiyi gösterdi: \"<en>Mine is a {U6-044|mountainous road} in the east. My grandpa has an old photo from there. He says the {U6-042|view} is very {U2-076|impressive}.</en>\""
  - id: s08
    text: "Bora: \"<en>And at the end of the road, I'm going to walk to the top, like at the climbing wall. I {U6-049|succeeded} once, so I can do it again!</en>\" Sınıf alkışladı; Bora bu kez gözlerini kapatmadan bir selfie çekti."
  - id: s09
    text: "Elif telefonunu tahtadaki ekrana bağladı. Ekranda Mia'nın Kanada'dan gönderdiği fotoğraf vardı: yüksek kayalardan aşağı bembeyaz köpüklerle dökülen bir su, ormanın ortasında. Elif: \"<en>Mia sent me this yesterday. It's a {U6-043|waterfall} near her town. Isn't it {U6-030|magnificent}?</en>\""
  - id: s10
    text: "Bütün sınıf aynı anda: \"<en>Wow!</en>\" Murat Bey bile gözlüğünü çıkardı: \"<en>{U6-030|Magnificent} is the right word, Elif. That {U6-043|waterfall} is really {U2-076|impressive}.</en>\""
  - id: s11
    text: "Elif: \"<en>Mia says people go there to {U6-055|explore} the forest. My {U6-051|aim}? To visit her one day and {U6-055|explore} it together.</en>\""
  - id: s12
    text: "Ece hemen menajer moduna geçti: \"<en>Can we {U5-034|post} this photo on our channel? With Mia's permission, of course.</en>\" Elif: \"<en>I'll ask her tonight.</en>\""
  - id: s13
    text: "Akşam Ece'nin telefonuna kuzeni Ege'den bir mesaj düştü. Ege kampa gelmemişti, başka bir okulda okuyordu ama yorumu hazırdı: \"<en>Camp? No phones, cold tents, bugs. I'm sure it was {U6-032|disappointing}.</en>\""
  - id: s14
    text: "Ece cevap yazmadı. Sadece fotoğrafları gönderdi: Bora duvarın en üstünde, zilin yanında; Selin zip-line'da; turuncu yeleklerle göl; kamp ateşi ve Elif."
  - id: s15
    text: "Beş dakika boyunca Ege'den ses çıkmadı. Sonra tek bir mesaj geldi: \"<en>OK… {U6-030|magnificent}.</en>\""
  - id: s16
    text: "Hemen ardından bir mesaj daha: \"<en>Wait. Bora {U6-009|climbed} THAT? Wow. That's real {U6-016|courage}.</en>\""
  - id: s17
    text: "Ege: \"<en>Next year I'm coming. My {U6-041|destination}: your camp. I want to {U6-055|explore} it and {U6-052|gain} some experience.</en>\" Ece: \"<en>Ege, it's our school's camp!</en>\" Ege: \"<en>Details.</en>\""
  - id: s18
    text: "Ertesi sabah haritada on beş iğne vardı. Duru'nunki küçük bir {U6-044|hill}'in tam üstündeydi; yanına da kurşun kalemle minicik bir hamak çizmişti."
  - id: s19
    text: "Murat Bey dersin sonunda elindeki zarfı salladı: \"<en>Tomorrow, one more campfire. Here, in the classroom. And I have some big news.</en>\" Kaan: \"<en>A real fire? In the classroom?</en>\" Murat Bey: \"<en>No, Kaan. A video of a fire. Safety first.</en>\""

