  - id: d13-r07
    type: synonym
    item: U1-028
    lgs_like: true
    prompt: "<en>\"Bora is my buddy.\" Which one is CLOSEST in meaning?</en>"
    options: ["Bora is my friend.", "Bora is my teacher.", "Bora is my cousin.", "Bora is my neighbour."]
    answer: 0
    explain: "buddy = friend (arkadaş)."
    why_wrong:
      - "\"Buddy\" yakın arkadaş için kullanılır; öğretmenle ilgisi yok."
      - "\"Cousin\" kuzen demek; \"buddy\" aile değil arkadaş anlatır."
      - "\"Neighbour\" komşu demek; \"buddy\" ise arkadaş."
  - id: d13-r08
    type: message_infer
    item: U1-047
    lgs_like: true
    prompt: "<en>According to Selin, what is a true friend?</en>"
    stem: "<en>Selin: A true friend doesn't only stay with you in good times. When you have a problem, a true friend is always there.</en>"
    options: ["someone who helps you in bad times too", "someone who is only fun at parties", "someone who always agrees with you", "someone who lives next door"]
    answer: 0
    explain: "Selin'e göre gerçek arkadaş sorun anında da yanında olandır: someone who helps you in bad times too."
    why_wrong:
      - "\"Only\" tuzağı: Selin \"doesn't only stay with you in good times\" diyor."
      - "Metinde her şeye katılmaktan söz edilmiyor; konu zor anda yanında olmak."
      - "Tuzak kelime \"there\": \"always there\" yakın oturmak değil, yanında olmak demek."
  - id: d13-r09
    type: dialogue_complete
    item: U1-048
    lgs_like: true
    prompt: "<en>Which one completes the dialogue?</en>"
    stem: "<en>Elif: I really enjoyed the picnic with you today, Duru.\nDuru: Me too! ________</en>"
    options: ["You're fun to be with.", "You're always late.", "I feel alone with you.", "You're so unreliable."]
    answer: 0
    explain: "Piknikten keyif alan Elif'e Duru \"You're fun to be with.\" (Seninle olmak eğlenceli) der."
    why_wrong:
      - "Duru \"Me too!\" diyerek keyif aldığını söylüyor; ardından eleştiri gelmez."
      - "Birlikte keyif aldığı birine \"I feel alone with you\" denmez."
      - "\"Unreliable\" güvenilmez demek; güzel bir pikniğin ardından bu söylenmez."

tips:
  - type: tuzak
    refs: [U1-052]
    text: "depend on'un iki anlamı var: \"You can depend on me.\" = Bana güvenebilirsin. \"It depends on the weather.\" = Havaya bağlı. Ünitede ilki hedef; yanında kişi varsa çoğunlukla güvenmek."
  - type: kelime_ailesi
    refs: [U1-061, U1-088, U1-057]
    text: "respect (saygı; saygı duymak) → respectful (saygılı) → disrespectful (saygısız). mutual = karşılıklı: mutual respect, mutual friend (ortak arkadaş)."
  - type: kelime_ailesi
    refs: [U1-068]
    text: "rely (güvenmek) → reliable (güvenilir) → unreliable (güvenilmez). un- eki tersini yapar: happy → unhappy, fair → unfair."
  - type: mini_dilbilgisi
    refs: [U1-005]
    text: "come over = birinin evine uğramak: \"Can you come over to my house?\" Kısaca \"Come over!\" de olur. Yer belirtmek için to kullan."

coach:
  start: "Murat Bey ikili proje veriyor. Herkes ortağını seçiyor; peki Kaan'la kim çalışmak ister? 🤔"
  end_good: "Harika! Kaan'ın bile erken geldiği bir günde sen de tam isabet yaptın. ⏰"
  end_mixed: "Güzel çalıştın. {weak} biraz nazlandı; yarın yine karşına çıkacak, o zaman tanıdık gelecek. 😊"

notifications:
  morning: "Murat Bey'den sürpriz: ikili proje! Kaan'ın ortağı kim olacak? 📚"
  evening: "Kaan bir eve davetli ve ilk kez erken geliyor. Bunu görmen lazım! ⏰"
  review: "Tek soru: \"It depends on the weather.\" ile \"Depend on me!\" aynı anlamda mı?"

