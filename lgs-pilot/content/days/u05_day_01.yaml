tips:
  - type: kelime_ailesi
    refs: [U5-036, U5-045]
    text: "addict = bağımlı kişi (isim) · addiction = bağımlılık · addicted = bağımlı (sıfat): \"He is addicted to games.\" Aynı aile mantığı: use (kullanmak) → user (kullanıcı) → usage (kullanım)."
  - type: mini_dilbilgisi
    refs: [U5-044]
    text: "per day = a day = günde: two hours per day / two hours a day. per week = a week = haftada. percent sayıyla tekil kalır: 70 percent (\"70 percents\" değil)."
  - type: lgs_taktigi
    refs: [U5-044, U2-089]
    text: "Grafik sorusunda önce yüzdeleri kelimeye çevir: 100 percent = all, 70–90 percent = most, 50 percent = half, 10–20 percent = a few, 0 percent = none. Sonra şıklardaki iddiayı tek tek kontrol et."
  - type: mini_dilbilgisi
    refs: [U5-047, U5-044]
    text: "İnterneti ne için kullandığını şöyle sorarsın: \"What do you use the Internet for?\" Cevap: \"I use it for music.\" ya da \"I use it for doing homework.\" (for + isim ya da -ing)"

coach:
  start: "Ünite 5 başlıyor! Konser videosu okulu salladı, Murat Bey de tahtaya kocaman bir başlık yazdı. Bakalım Kaan'ın cevabı ne olacak? 📱"
  end_good: "Harika başlangıç! Tablodaki sayıları senden iyi okuyan yok. Yarın Ece büyük bir işe girişiyor: kanal! 🎉"
  end_mixed: "İyi iş! {weak} biraz karıştı, hiç dert değil; Kaan da saymayı yeni öğreniyor. Yarın bir tekrar, sonra kanal! 📱"

notifications:
  morning: "Okul açıldı, herkes aynı videoyu konuşuyor. Murat Bey'in sorusu ise bambaşka! 📱"
  evening: "Kaan internette sadece bir saat mi geçiriyor? Selin saymaya başladı bile. 😄"
  review: "Tek soru: \"three hours per day\" ne demek? 🤔"

