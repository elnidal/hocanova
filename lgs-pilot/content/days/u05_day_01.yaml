story:
  - id: s01
    text: "Şubat ortası, ikinci dönemin ilk pazartesisi. Okulun koridorlarında herkes aynı videoyu konuşuyordu: Wrong Number'ın pastane konseri. Telefonlar elden ele dolaşıyordu."
  - id: s02
    text: "Kaan sınıfa nefes nefese daldı, telefonu havada: \"<en>Guys! 80,000 views! We're famous!</en>\" Ece kaşlarını çattı: \"<en>But who put it on the Internet? Nobody asked us!</en>\""
  - id: s03
    text: "Kapı açıldı, Murat Bey girdi ve her zamanki gibi önce tahtaya büyük harflerle yazdı: \"<en>SAFER INTERNET WEEK</en>\" Sonra sınıfa döndü: \"<en>In two weeks, every team presents an internet guide. Same teams as our Teen Life {U2-003|Survey}.</en>\""
  - id: s04
    text: "\"<en>But first, a quick class {U2-003|survey}. Two questions. One: {U5-047|What do you use the Internet for?} Two: how many hours {U5-044|a day}?</en>\" Herkese birer küçük kâğıt dağıttı."
  - id: s05
    text: "Ece cevabını üç renkli kalemle doldurdu ve yüksek sesle okudu: \"<en>I {U5-047|use the Internet for} music and fashion videos. Two hours {U5-044|per day}. Planned, of course.</en>\""
  - id: s06
    text: "Elif'in cevabı tek kelimeydi: \"<en>Luna Ray!</en>\" Duru ise kâğıdını yarı uykulu doldurdu: \"<en>My internet {U5-045|usage}: videos, lying down. My {U5-040|habit}: lying down.</en>\""
  - id: s07
    text: "Murat Bey gülümsedi: \"<en>Very honest, Duru.</en>\" Duru omuz silkti: \"<en>I'm a {U1-079|laid-back} {U5-045|user}, sir.</en>\""
  - id: s08
    text: "Kaan'ın kâğıdı on saniyede hazırdı. Kendinden emin bir sesle okudu: \"<en>Me? Only one hour {U5-044|per day}!</en>\" Selin kaşını kaldırdı. Kaan sesini biraz alçalttı: \"<en>…per {U4-043|app}.</en>\""
  - id: s09
    text: "Selin, Kaan'ın telefonundaki simgeleri hemen saydı: on iki. \"<en>Twelve {U4-043|apps}, one hour each? That's twelve hours, Kaan! Are you an {U5-036|addict}?</en>\""
  - id: s10
    text: "Kaan elini kalbine koydu: \"<en>Me? An {U5-036|addict}? Never! I'm just… very fast.</en>\" Sınıf kahkahalarla çınladı."
  - id: s11
    text: "Murat Bey kâğıtları topladı ve Selin'le Duru'yu tahtaya çağırdı. Selin sayıyor, Duru tahtaya geçiriyordu; Duru'nun arada bir gözleri kapanıyordu (düşünüyordu, tabii)."
  - id: s12
    text: "On dakika sonra tahtada küçük bir tablo vardı: \"<en>{U5-047|What do we use the Internet for?} Music: 70 {U5-044|percent} · Videos: 65 {U5-044|percent} · Games: 50 {U5-044|percent} · Homework: 40 {U5-044|percent}</en>\""
  - id: s13
    text: "Murat Bey tablonun altına bir satır ekledi: \"<en>Class {U5-037|average}: three hours {U5-044|per day}.</en>\""
  - id: s14
    text: "Elif parmaklarıyla saydı: \"<en>Three hours a day… that's twenty-one hours {U5-044|per week}! Almost a whole day!</en>\""
  - id: s15
    text: "Murat Bey başını salladı: \"<en>Music, homework, videos: they're all OK. But be careful. A {U5-040|habit} can slowly become an {U5-036|addiction}.</en>\""
  - id: s16
    text: "Arka sıradan Bora gururla el kaldırdı: \"<en>Not me, sir. My {U5-045|usage} is very low. I'm under the {U5-037|average}!</en>\""
  - id: s17
    text: "Selin arkasına bile dönmedi: \"<en>Because your phone is always dead, Bora.</en>\" Bora hiç bozulmadı: \"<en>Exactly. It's a healthy {U5-040|habit}.</en>\""
  - id: s18
    text: "Teneffüste Ece defterini açtı. Video o sırada 90 bine çıkmıştı. \"<en>Team, 90,000 people watched us, but it isn't our video. We need our own channel!</en>\""
  - id: s19
    text: "Duru sırasına yaslandı: \"<en>Our own channel? More internet {U5-045|usage}. I'm already above the {U5-037|average}.</en>\" Ece duymadı bile; defterinde yeni bir sayfa açmıştı: \"<en>CHANNEL – TOMORROW!</en>\""
  - id: s20
    text: "Gece yarısı sınıf grubuna Kaan'dan bir mesaj düştü: \"<en>Update: I counted again. It isn't one hour per {U4-043|app}. It's… more. Please don't tell Selin.</en>\""
  - id: s21
    text: "Bir dakika sonra cevap geldi. Selin'den: \"<en>I'm in this group, Kaan.</en>\""

scene:
  - id: c01
    speaker: Murat Bey
    text: "<en>What do you use the Internet for? And how many hours per day?</en>"
  - id: c02
    speaker: Kaan
    text: "<en>Only one hour per day… per app.</en>"
  - id: c03
    speaker: Selin
    text: "<en>Twelve apps? That's twelve hours! Are you an addict?</en>"
  - id: c04
    speaker: Murat Bey
    text: "<en>The class average is three hours per day. Be careful: a habit can become an addiction.</en>"

