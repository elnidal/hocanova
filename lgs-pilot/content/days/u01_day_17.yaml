tips:
  - type: kelime_ailesi
    refs: [U1-095, U1-096]
    text: "-ing şeyi, -ed kişinin hissini anlatır: \"The film was boring. → I was bored.\" · \"The trip was exciting. → I was excited.\" \"I'm boring\" dersen \"Ben sıkıcı biriyim\" demiş olursun!"
  - type: tuzak
    refs: [U1-098, U1-073]
    text: "fun ↔ funny son kez: \"The trip was fun.\" (eğlenceliydi) · \"Bora's sunglasses were funny.\" (komikti). fun isim olarak da kullanılır: \"Have fun!\" = İyi eğlenceler!"
  - type: ilginc_bilgi
    refs: [U1-100]
    text: "thrill = ürperti, büyük heyecan. Buradan thriller (gerilim filmi ya da romanı) kelimesi gelir. thrilling, exciting'in daha güçlüsüdür."
  - type: lgs_taktigi
    refs: [U1-072, U1-086]
    text: "LGS'de soruda NOT görürsen dur ve altını çiz: metinde doğru OLMAYAN şıkkı arıyorsun. Her şıkkı metinle tek tek karşılaştır."

coach:
