story:
  - id: s01
    text: "Cuma. Otobüs saat sekizde kalktı. Peki Kaan? Herkesten önce otobüsteydi, hem de en ön koltukta!"
  - id: s02
    text: "Murat Bey listeyi saydı: \"<en>Everyone is here. Even Kaan! This is going to be a great day.</en>\""
  - id: s03
    text: "İlk durak bilim merkeziydi. Kaan gezegenler salonunda kocaman esnedi: \"<en>Planets, planets, planets… This is so {U1-095|boring}.</en>\""
  - id: s04
    text: "Selin onu bir teraziye doğru itti: \"<en>{U1-095|Boring}? Look! You can see your weight on Mars!</en>\" Kaan teraziye çıktı: Mars'ta sadece on dokuz kilo!"
  - id: s05
    text: "Kaan'ın gözleri parladı: \"<en>OK, that's not {U1-095|boring}. That's cool! I'm moving to Mars.</en>\""
  - id: s06
    text: "Bora bir robot kolunu kumandayla yönetiyordu: \"<en>This is so {U1-096|exciting}! I'm a scientist now!</en>\""
  - id: s07
    text: "Duru ise bir bankta oturmuş, gözleri yarı kapalıydı: \"<en>I'm {U1-069|calm}. I'm enjoying science… from here.</en>\""
  - id: s08
    text: "Elif dinozor iskeletinin önünde durdu: \"<en>What was a T-rex {U1-080|like}? Big teeth, small arms… and not very {U1-085|patient}, I think!</en>\""
  - id: s09
    text: "Öğleden sonra lunapark! Kapıdan girer girmez dev bir hız treni gördüler; raylar neredeyse bulutlara kadar çıkıyordu."
  - id: s10
    text: "Kaan zıpladı: \"<en>The roller coaster! It's the most {U1-100|thrilling} ride in the park!</en>\""
  - id: s11
    text: "Bora yutkundu: \"<en>{U1-100|Thrilling}? It looks… terrifying.</en>\""
  - id: s12
    text: "Selin onu cesaretlendirdi: \"<en>Come on! Rides {U1-080|like} this are {U1-096|exciting}. You'll love it!</en>\""
  - id: s13
    text: "Ece, Bora'nın koluna girdi: \"<en>Don't worry. We'll sit together. It's {U1-098|fun}, I promise!</en>\""
  - id: s14
    text: "Tren tırmandı, tırmandı… ve aşağı! Bora'nın çığlığı bütün lunaparkta yankılandı. Murat Bey aşağıdan el salladı."
  - id: s15
    text: "İndiklerinde Bora'nın saçları dimdik havadaydı: \"<en>That was… {U1-100|thrilling}! Again! Let's go again!</en>\""
  - id: s16
    text: "Duru hız trenine binmedi; çarpışan arabalara bindi ve yavaş yavaş sürdü: \"<en>Roller coasters aren't for me. Bumper cars are {U1-098|fun} enough.</en>\""
  - id: s17
    text: "Kaan arabasıyla Duru'ya çarptı: \"<en>Duru, you drive {U1-080|like} my grandma!</en>\" Duru kılını kıpırdatmadı: \"<en>Thanks. Your grandma is a {U1-069|calm} driver.</en>\""
  - id: s18
    text: "Ece, Elif ve Duru dönme dolaba birlikte bindiler. Salı günkü o küçük sızı çoktan unutulmuştu."
  - id: s19
    text: "Ece en tepede şehre baktı: \"<en>Being with you two is so much {U1-098|fun}.</en>\" Elif gülümsedi: \"<en>{U1-048|You're fun to be with} too, Ece!</en>\""
  - id: s20
    text: "Akşam dönüş yolunda Murat Bey sordu: \"<en>So, what was the best part? The science centre or the amusement park?</en>\""
  - id: s21
    text: "Kaan: \"<en>The science centre was {U1-095|boring}… for five minutes. Then it was {U1-096|exciting}!</en>\""
  - id: s22
    text: "Bora: \"<en>The roller coaster! It changed my {U1-087|personality}. I'm brave now!</en>\" Herkes alkışladı."
  - id: s23
    text: "Murat Bey güldü: \"<en>Bravery is a new {U1-086|personal trait} for you, Bora. Well done!</en>\""
  - id: s24
    text: "Selin ekledi: \"<en>And you were so {U1-085|patient} and {U1-093|understanding} all day, sir. Thirty students, ten hours!</en>\""
  - id: s25
    text: "Otobüs yola koyuldu. Duru, Ece'nin omzunda uyuyakaldı. Ece camdan bakarken düşündü: Bir doğum günü partisiyle başlayan bu sonbahar ona en güzel hediyeyi vermişti: bu gürültülü, dağınık, harika arkadaşları."

scene:
  - id: c01
    speaker: Kaan
    text: "<en>The science centre is boring. Can we go to the amusement park now?</en>"
  - id: c02
    speaker: Selin
    text: "<en>It isn't boring! Look, you can see your weight on Mars. That's exciting!</en>"
  - id: c03
    speaker: Bora
    text: "<en>The roller coaster was thrilling! Let's go again!</en>"
  - id: c04
    speaker: Duru
    text: "<en>I prefer the bumper cars. They're fun, and I can stay calm.</en>"

