story:
  - id: s01
    text: "Çarşamba, okul çıkışı, Duru'nun evi. Ece telefonunu kitap yığınının üstüne dikkatle yerleştirdi ve kaydı başlattı: \"<en>Take ten! This time it must be perfect.</en>\""
  - id: s02
    text: "Elif'in sesi kısılmak üzereydi, Bora'nın kolları kopacak gibiydi. Duru gitarı kucağında kanepeye gömülmüştü; Fıstık da ayak ucunda."
  - id: s03
    text: "Duru tek gözünü açtı: \"<en>Ece, take two was perfect. Take five was perfect. {U2-085|Be realistic}, please.</en>\""
  - id: s04
    text: "Onuncu çekimin sonunda Fıstık tam zamanında havladı ve şarkı bitti. Ece nihayet gülümsedi: \"<en>OK. I'm happy. Now I {U5-025|upload} it to our channel!</en>\""
  - id: s05
    text: "Selin onaylarcasına başını salladı: \"<en>Good. Last time somebody {U5-025|uploaded} our concert without asking us. This time it's our video, on our channel.</en>\""
  - id: s06
    text: "Herkes telefonun başına üşüştü. Ekranda yavaş yavaş dolan bir çubuk: \"<en>{U5-025|Uploading}… 40%… 80%… 100%!</en>\""
  - id: s07
    text: "Elif hemen sordu: \"<en>Can I {U5-034|post} it on my page too?</en>\" Ece elini kaldırdı: \"<en>Wait! First, everybody {U5-030|subscribe} to the channel. We need {U5-030|followers}!</en>\""
  - id: s08
    text: "Bir dakika sonra Ece'nin telefonu ilk kez öttü: \"<en>Ding!</en>\" Ece ekrana atladı: \"<en>A {U5-033|notification}! Our first {U5-030|subscriber}!</en>\""
  - id: s09
    text: "Ekranda bir ad belirdi: \"<en>Nermin_Teyze</en>\". Bora sevinçle bağırdı: \"<en>My first fan! She's faster than all of you!</en>\""
  - id: s10
    text: "Ding! \"<en>New {U5-028|comment} from Arda_10: Bora is the best drummer in the world!!!</en>\" Bora hiçbir şey söylemedi; yalnızca göğsünü biraz daha kabarttı."
  - id: s11
    text: "Ding! \"<en>Murat Bey {U5-028|commented on} your video: Very nice! Now, homework, please.</en>\" Duru kanepeye biraz daha gömüldü."
  - id: s12
    text: "Ece artık her seste telefona sarılıyordu. Selin parmaklarıyla saydı: \"<en>Ece, you checked your {U5-033|notifications} forty times today. Be {U1-085|patient}!</en>\" Ece gözünü ekrandan ayırmadı: \"<en>Forty-one. Shh, a new one!</en>\""
  - id: s13
    text: "Bora telefonunu çıkardı: \"<en>I want to {U5-019|download} the video. Mum works tonight, so Grandpa is at our house. I want to show him.</en>\""
  - id: s14
    text: "Kaan şaşkınlıkla baktı: \"<en>Why {U5-019|download} it? He can watch it on the channel!</en>\" Bora: \"<en>Our internet is very slow at night. And Grandpa likes watching things… ten times.</en>\""
  - id: s15
    text: "Akşam Bora'nın evinde dedesi gözlüklerini taktı ve küçük ekrana eğildi. Bora gururluydu: \"<en>I {U5-019|downloaded} it for you, Grandpa. Look, that's me on drums!</en>\""
  - id: s16
    text: "Dede videoyu tam yedi kez izledi. Sonra kendi telefonunu çıkardı: \"<en>Now, how do I {U5-028|make a comment}? I have an idea for your band.</en>\""
  - id: s17
    text: "Yarım saat sonra Ece'nin telefonu iki kez öttü: \"<en>New {U5-030|subscriber}: JazzGrandpa55 · New {U5-028|comment}: Lovely song! Add some {U2-024|jazz}! A saxophone, maybe?</en>\""
  - id: s18
    text: "Elif gülmekten kırıldı: \"<en>A saxophone? We're a pop-rock band!</en>\" Duru grubun mesajlarına tek satırla katıldı: \"<en>Only rock. Tell him that. Politely.</en>\""
  - id: s19
    text: "Ece sayıları defterine geçirdi: \"<en>Twelve {U5-030|followers}, six {U5-028|comments}! Now, Elif, you can {U5-034|post} it.</en>\" Elif'in cevabı bir saniyede geldi: \"<en>{U5-034|Posted}!</en>\""
  - id: s20
    text: "Kaan da durmadı: \"<en>I'm {U5-034|posting} it too! On my page, in the class group, in my cousin's group, everywhere!</en>\" Selin iç çekti: \"<en>Kaan, you didn't even watch it.</en>\""
  - id: s21
    text: "Gece yarısı Ece hâlâ uyanıktı. Telefon bir kez daha öttü: \"<en>{U5-033|Notification}: Ahmet Amca {U5-028|commented}: My old drums sound great! 👍</en>\""
  - id: s22
    text: "Az sonra sınıf grubunda Duru'dan tek satır belirdi: \"<en>Ece, I got 47 {U5-033|notifications} from you tonight. Our band is famous. Now please sleep.</en>\""

