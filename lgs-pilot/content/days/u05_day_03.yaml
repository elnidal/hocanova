tips:
  - type: tuzak
    refs: [U5-019, U5-025]
    text: "Yön tuzağı: DOWNload = internetten cihazına (aşağı), UPload = cihazından internete (yukarı). Video kanala → upload; oyun telefona → download. Ece videoyu kanala koydu (upload), Bora dedesine göstermek için telefonuna aldı (download)."
  - type: tuzak
    refs: [U5-034]
    text: "post sana \"posta, postalamak\" gibi gelebilir; sosyal medyada ise paylaşmak (fiil) ya da gönderi (isim) demek: I posted a photo. / I like your new post. Yanında on social media, on my page varsa: paylaşmak."
  - type: kelime_ailesi
    refs: [U5-030, U5-028]
    text: "follow → follower (takipçi), subscribe → subscriber (abone): -er/-r eki işi yapan kişiyi verir. comment hem fiil hem isim: comment on a video (yorum yapmak) / a nice comment (yorum)."
  - type: lgs_taktigi
    refs: [U5-034]
    text: "Altı çizili kelime sorusunda her şıkkı cümleye tek tek yerleştir: anlam aynı kalıyorsa doğru şık odur. \"I'm going to share it on my page\" → post: anlam değişmiyor."

coach:
  start: "Bugün Ece ilk videoyu çekiyor… onuncu kez. Sonra telefon bir türlü susmuyor! Kim ne diyecek, hazır mısın? 🎬"
  end_good: "Muhteşem! Ece'nin telefonu kadar hızlıydın. Yarın Bora'nın interneti tam yanlış anda bir sorun çıkarıyor… 🔔"
  end_mixed: "Güzel iş! {weak} biraz karıştı; yönleri karıştırmak çok normal, yukarı mı aşağı mı? Yarın bir kez daha deneriz. 🎬"

notifications:
  morning: "Onuncu çekim! Ece bugün grubun ilk videosunu çekiyor. Peki sonra? 🎬"
  evening: "Ding! Ding! Ding! Ece'nin telefonu bütün gün öttü. Kimden ne geldi? 🔔"
  review: "Tek soru: Videoyu kanala koymak upload mı, download mı? 🤔"

