title: "Kuzen Ege geri döndü"
est_minutes: 10
characters: [Ece, Selin, Duru, Elif, Kaan, Bora, Ege (Ece'nin kuzeni), Ece'nin annesi, Fıstık]
new_items: [U1-074, U1-076, U1-078, U1-082, U1-089, U1-091]

story:
  - id: s01
    text: "Salı. Teneffüste Elif ile Duru yine yan yanaydı: Duru gitar çalıyor, Elif telefonundan köpek videoları gösteriyordu. İkisi bir müzik grubu kurmayı planlıyordu."
  - id: s02
    text: "Ece uzaktan izledi. Üç gündür ikisi hiç ayrılmıyordu: kantinde, otobüste, müzik dersinde. Ece'nin içinde küçük, tuhaf bir sızı vardı."
  - id: s03
    text: "Ece, Selin'e döndü: \"<en>They {U1-044|spend time} together every day. Duru doesn't need me anymore.</en>\""
  - id: s04
    text: "Selin kaşını kaldırdı: \"<en>Ece… are you {U1-078|jealous}?</en>\""
  - id: s05
    text: "\"<en>Me? {U1-078|Jealous}? No! I'm just… watching them. Every minute.</en>\" Selin gülmemek için dudağını ısırdı."
  - id: s06
    text: "Selin, Ece'nin koluna girdi: \"<en>Can I {U1-035|give you some advice}? Don't guess. Talk to Duru.</en>\""
  - id: s07
    text: "Okul çıkışı hepsi okulun yanındaki parka gitti. Parkın önünde Ece'nin annesinin arabası durdu, arka kapı açıldı ve kim indi dersiniz? Kuzen Ege!"
  - id: s08
    text: "Ege daha merhaba demeden telefonunu çıkardı: \"<en>Look at my new phone! And my new shoes! And my new jacket!</en>\" Ece'nin annesi gülümsedi: \"<en>Ege, ask your friends a question too. Don't be so {U1-089|self-centered}!</en>\""
  - id: s09
    text: "Kaan, Bora'ya fısıldadı: \"<en>He only talks about himself. So {U1-089|self-centered}!</en>\" Bora iç geçirdi: \"<en>Last time it was his chips. Now it's his phone.</en>\""
  - id: s10
    text: "Sonra futbol başladı. Ege'nin şutu direğin yanından dışarı gitti; bunu herkes gördü. Ama Ege kollarını havaya kaldırdı: \"<en>Goal!</en>\""
  - id: s11
    text: "Selin: \"<en>Ege, it was out!</en>\" Ege: \"<en>No. It was a goal. I'm not changing my mind.</en>\" Kaan saçlarını tuttu: \"<en>You're so {U1-091|stubborn}!</en>\""
  - id: s12
    text: "On dakika sonra Ege hâlâ \"gol\" diyordu. Bora güldü: \"<en>He's more {U1-091|stubborn} than a cat at bath time!</en>\""
  - id: s13
    text: "Ege burnunu havaya dikti: \"<en>I'm not {U1-091|stubborn}. I'm just always right.</en>\" Herkes güldü; Ege bile."
  - id: s14
    text: "Tam o anda parkın girişinde bir dondurma arabası belirdi. Ege cebine baktı, bir süre düşündü, sonra arabaya yürüdü."
  - id: s15
    text: "Beş dakika sonra elinde yedi külahla döndü: \"<en>One for everyone. I want to {U1-043|share}. I wasn't nice at the party.</en>\""
  - id: s16
    text: "Ece gözlerine inanamadı: \"<en>Ege, that's so {U1-074|generous}!</en>\" Kaan fısıldadı: \"<en>{U1-074|Generous} Ege? Is this a dream?</en>\""
  - id: s17
    text: "Ece, Kaan'a döndü: \"<en>See? He isn't always {U1-089|self-centered}. He can be {U1-074|generous} too. People can change.</en>\""
  - id: s18
    text: "Bu arada küçük bir çocuğun uçurtması ağaca takıldı. Çocuk ağlamaya başlamadan Bora ağaca tırmandı ve uçurtmayı indirdi."
  - id: s19
    text: "Çocuğun annesi: \"<en>Thank you so much! You're very {U1-076|helpful}.</en>\" Selin gülümsedi: \"<en>That's Bora. Remember the old lady and the cake?</en>\""
  - id: s20
    text: "Bora inerken Ege'nin cebinden düşen telefonu da yerden aldı: \"<en>Here's your new phone, Ege.</en>\" Ege şaşırdı: \"<en>Thanks, Bora. You're… really {U1-076|helpful}.</en>\""
  - id: s21
    text: "Elif güldü: \"<en>{U1-074|Generous} Ege, {U1-076|helpful} Bora… What a strange day!</en>\""
  - id: s22
    text: "Dondurmalar bitince Duru, Ece'nin yanına geldi; Fıstık da peşindeydi. \"<en>Ece, you're very quiet today. What's wrong?</en>\""
  - id: s23
    text: "Ece derin bir nefes aldı: \"<en>I'm sorry. I was {U1-078|jealous}. You {U1-044|spend so much time} with Elif now.</en>\""
  - id: s24
    text: "Duru gülümsedi: \"<en>Elif is my new friend. But you're my oldest friend. {U1-037|You're always there for me}.</en>\""
  - id: s25
    text: "Duru, Fıstık'ın başını okşadı: \"<en>{U1-082|Loyalty} is important to me. Just ask Fıstık!</en>\" Fıstık onaylar bir sesle havladı."
  - id: s26
    text: "Elif de koşarak geldi: \"<en>Ece, join our band! You can sing!</en>\" Ece güldü: \"<en>Deal! Friends {U1-064|support each other}. And I {U1-063|support} your band!</en>\""
  - id: s27
    text: "Kaan, Fıstık'a eğildi: \"<en>Fıstık, the king of {U1-082|loyalty}!</en>\""
  - id: s28
    text: "Selin başını salladı: \"<en>Not only Fıstık. Duru's {U1-082|loyalty} is famous too.</en>\" Ece, Duru'ya sarıldı; içindeki sızı çoktan geçmişti."

scene:
  - id: c01
    speaker: Selin
    text: "<en>Are you jealous, Ece?</en>"
  - id: c02
    speaker: Ece
    text: "<en>A little. Duru spends a lot of time with Elif.</en>"
  - id: c03
    speaker: Duru
    text: "<en>Ece, you're my oldest friend. Loyalty is important to me.</en>"
  - id: c04
    speaker: Kaan
    text: "<en>And look! Ege bought ice cream for everyone. He's so generous today!</en>"
  - id: c05
    speaker: Bora
    text: "<en>Yes, but he's still stubborn. That ball was out!</en>"

