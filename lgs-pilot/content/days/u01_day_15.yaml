  end_good: "Harika iş! Ege'nin iki yüzünü de tanıdın: stubborn ama bugün generous. Sen de bugün çok helpful bir öğrenciydin! 🍦"
  end_mixed: "Güzel gidiyorsun! {weak} için üzülme; yarın yine karşına çıkacak ve o zaman çok daha tanıdık gelecek."

