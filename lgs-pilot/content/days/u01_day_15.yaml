tips:
  - type: kelime_ailesi
    refs: [U1-082, U1-078, U1-074, U1-076]
    text: "loyal (sadık) → loyalty (sadakat) · jealous → jealousy (kıskançlık) · generous → generosity (cömertlik) · help → helpful (yardımsever)."
  - type: mini_dilbilgisi
    refs: [U1-078]
    text: "jealous'tan sonra kişi gelirse \"of\" kullan: \"Ece was jealous of Elif.\" (Ece, Elif'i kıskandı.)"
  - type: ilginc_bilgi
    refs: [U1-089]
    text: "self-centered Amerikan yazımı; İngiliz İngilizcesinde self-centred yazılır. İkisi de doğru. self (kendi) + centre (merkez): kendini dünyanın merkezi sanan kişi!"

coach:
