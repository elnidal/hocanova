tips:
  - type: tuzak
    refs: [U5-006, U5-012]
    text: "sign IN = giriş yapmak (log in ile aynı), sign UP = kaydolmak, yeni hesap açmak. Bazı kaynaklar ikisine de \"kaydolmak\" diyor: yanlış! Hafıza kancası: in = içeri gir, up = yeni hesabı kur."
  - type: tuzak
    refs: [U5-024]
    text: "type isim olarak \"tür, çeşit\" demek: What type of music do you like? Fiil olarak klavyeyle yazmak: Type your password. Ardından password, name ya da message geliyorsa yazmaktır."
  - type: lgs_taktigi
    refs: [U5-012, U5-006, U5-007]
    text: "Hesap sorularında önce sor: Hesap var mı? Yoksa → sign up / register. Varsa → log in / sign in. İş bitti mi? → log out / log off. Sınav eş anlamlıyı sever: log off = log out."
  - type: mini_dilbilgisi
    refs: [U5-007, U5-009]
    text: "Alışkanlık Simple Present + sıklık zarfıyla anlatılır: I always log out. Bora never forgets his password. Zarf ana fiilden önce, be'den sonra gelir: Kaan is always in a hurry."

