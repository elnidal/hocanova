story:
  - id: s01
    text: "Salı, okul çıkışı. Kütüphanenin köşesindeki bilgisayarların başında Ece, Elif, Duru, Bora ve Kaan toplanmıştı. Selin yan masada ödevini yapıyor, arada bir başını kaldırıyordu."
  - id: s02
    text: "Ece defterini açtı: \"<en>OK, team. 90,000 views, and it isn't even our video. Today we open our own channel on ClipTube. First, I {U5-012|sign up}.</en>\""
  - id: s03
    text: "Ekranda boş kutular belirdi. Ece her kutuyu özenle doldurdu: \"<en>I {U5-024|type} our name: Wrong Number. {U5-009|Username}: wrongnumber_band. And now a {U5-009|password}. A strong one.</en>\""
  - id: s04
    text: "Elif heyecanla sordu: \"<en>Can all of us use it?</en>\" Ece: \"<en>It's one {U5-002|account} for the whole band. I'm the manager, so I keep the {U5-009|password}.</en>\""
  - id: s05
    text: "Kaan sandalyesini yaklaştırdı: \"<en>And I want my own {U5-002|account}! Let me {U5-012|register} now!</en>\" Ece daha cevap veremeden klavye Kaan'ın önündeydi."
  - id: s06
    text: "Selin kitabından başını kaldırmadan: \"<en>Slow down, Kaan. You're {U1-075|always in a hurry}.</en>\" Kaan: \"<en>I {U5-024|type} very fast. Look!</en>\""
  - id: s07
    text: "Ekranda kocaman harflerle bir karşılama mesajı çıktı: \"<en>Welcome, KANA!</en>\" Kaan donup kaldı: \"<en>Who's Kana?!</en>\" Duru: \"<en>You. You {U5-024|typed} your name wrong.</en>\""
  - id: s08
    text: "Kaan elini salladı: \"<en>{U1-014|It doesn't matter}. Kana is a cool name.</en>\" Ece defterine küçük bir not düştü: \"<en>Kaan = Kana. OK.</en>\""
  - id: s09
    text: "Sonra Ece herkese döndü: \"<en>Now everybody, {U5-006|log in} to your own {U5-002|accounts}. I'll add you to the channel.</en>\" İşte o anda kütüphaneye derin bir sessizlik çöktü."
  - id: s10
    text: "Elif bilgisayara eğildi: \"<en>My {U5-009|password}… 'pamuk123'? No… 'lunaray'? No…</en>\" Üç deneme, üç kırmızı uyarı."
  - id: s11
    text: "Duru gözlerini kapadı: \"<en>Mine is in my head. Somewhere. Give me a minute.</en>\" Bir dakika sonra gözleri hâlâ kapalıydı. Düşünüyordu. Herhalde."
  - id: s12
    text: "Bora ise gururla göğsünü kabarttı: \"<en>I never forget mine. It's 'mycat123'.</en>\" Herkes dönüp ona baktı. Selin bu kez kitabını kapattı: \"<en>Bora. You don't have a cat.</en>\""
  - id: s13
    text: "Bora sırıttı: \"<en>Exactly! Nobody can guess it.</en>\" Elif fısıldadı: \"<en>But now the whole library knows it!</en>\" Bora etrafına bakındı: \"<en>Oh. Well… you can all {U1-055|keep a secret}, right?</en>\""
  - id: s14
    text: "Ece kalemini masaya vurdu: \"<en>Bora, change it. Today.</en>\" Bora: \"<en>OK, OK, tonight. Look, I {U5-006|logged in}. Add me, manager!</en>\""
  - id: s15
    text: "Kaan ise hâlâ ekranla boğuşuyordu: \"<en>Why can't I {U5-006|sign in}? I {U5-024|typed} my {U5-009|password} right!</en>\" Duru tek gözünü açıp ekrana baktı: \"<en>Caps Lock.</en>\""
  - id: s16
    text: "Tam o sırada Bora'nın telefonu titredi: dedesi okulun önünde bekliyordu. Bora çantasını kaptı ve koşarak çıktı. Bilgisayarın ekranında hâlâ onun profili açıktı: \"<en>Hi, Bora!</en>\""
  - id: s17
    text: "Herkesin şaşkın bakışları arasında Duru sandalyesinden kalktı. Evet, kendiliğinden. \"<en>Bora didn't {U5-007|log out}. Now anybody can use his {U5-002|account}.</en>\""
  - id: s18
    text: "Kaan muzipçe gülümsedi: \"<en>Let's change his profile photo to a cat!</en>\" Duru başını iki yana salladı: \"<en>No. Friends don't do that.</en>\" Kaan hemen ellerini kaldırdı: \"<en>Joking! Just joking!</en>\""
  - id: s19
    text: "Duru fareyi aldı, iki saniyede işi bitirdi: \"<en>There. {U5-007|Logged off}.</en>\" Sonra Bora'ya mesaj attı: \"<en>You didn't {U5-007|log out} at school. I did it for you. And please change 'mycat123'.</en>\""
  - id: s20
    text: "Akşam Ece kanal sayfasını bir kez daha açtı: \"<en>Wrong Number · 0 videos.</en>\" Gruba mesaj attı: \"<en>We {U5-012|signed up} today. Tomorrow we film our first video, and it must be perfect! And everybody: always {U5-007|log out} on school computers!</en>\""
  - id: s21
    text: "Gece yarısı Bora'dan bir mesaj geldi: \"<en>Done! New {U5-009|password}. No cats this time.</en>\" Duru: \"<en>Dog?</en>\" Bir dakika sessizlik. Bora: \"<en>…I need to change it again.</en>\""

