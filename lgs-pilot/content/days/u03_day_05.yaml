story:
  - id: s01
    text: "Perşembe, İngilizce dersi. Murat Bey sınıfa kocaman, kapalı bir kutuyla girdi ve tahtaya yazdı: \"<en>JUNIOR CHEF WARM-UP: THE SCARF GAME</en>\""
  - id: s02
    text: "Murat Bey: \"<en>Tie your scarf over your eyes. I'll give you something small. Eat it and tell me the {U3-036|taste}. In English, please!</en>\""
  - id: s03
    text: "Kaan ilk sıraya koşarak geldi, tabii ki. Gözleri bağlıyken Murat Bey avucuna küçük, sarı bir parça bıraktı."
  - id: s04
    text: "Kaan'ın yüzü buruştu, gözleri kısıldı, omuzları kulaklarına kadar çıktı: \"<en>Ugh! It's so {U3-033|sour}! A lemon?!</en>\""
  - id: s05
    text: "Murat Bey: \"<en>Correct! Lemons are very {U3-033|sour}. Next: Selin.</en>\" Selin'in avucuna koyu kahverengi, küçük bir kare geldi."
  - id: s06
    text: "Selin: \"<en>Hmm… chocolate? But it isn't nice. It's {U3-027|bitter}, like my dad's coffee with no sugar.</en>\""
  - id: s07
    text: "Murat Bey: \"<en>Yes! Dark chocolate, ninety percent cocoa. Very {U3-027|bitter}.</en>\" Selin: \"<en>Ninety percent? Who eats that?</en>\" Murat Bey: \"<en>Me. Every day.</en>\""
  - id: s08
    text: "Sıra Bora'ya geldi. Kutu daha açılmadan ağzı açıktı. Çıtır, çıtır… \"<en>Crunchy… {U3-032|salty}… crisps! Cheese and onion! Can I have the bag?</en>\""
  - id: s09
    text: "Murat Bey: \"<en>One crisp, Bora. Too much {U3-032|salty} food isn't good for you.</en>\""
  - id: s10
    text: "Ece'nin avucundaki parça yumuşacık ve pudralıydı: \"<en>Very {U3-035|sweet}… rose {U3-036|flavour}! It's Turkish delight!</en>\""
  - id: s11
    text: "Elif: \"<en>I love {U3-035|sweet} things! Can I be next? Please, please?</en>\" Murat Bey: \"<en>Sorry, Elif. One more person.</en>\""
  - id: s12
    text: "Bütün sınıf arka sıraya döndü. Duru, sandalyesinde yarı uzanmış oturuyordu: sınıfın en {U1-079|laid-back} insanı."
  - id: s13
    text: "Murat Bey: \"<en>Duru, do you want something {U3-035|sweet} or something {U3-033|sour}?</en>\" Duru: \"<en>I {U2-011|don't mind}. Anything.</en>\""
  - id: s14
    text: "Murat Bey kutunun dibinden küçük, parlak, kıpkırmızı bir şey çıkardı. Kaan fısıldadı: \"<en>Oh no. That's a red chilli {U3-049|pepper}…</en>\""
  - id: s15
    text: "Duru minicik bir ısırık aldı. Bir saniye hiçbir şey olmadı. İki saniye. Üçüncü saniyede Duru'nun yüzü o kırmızı şeyle aynı renge döndü."
  - id: s16
    text: "Duru: \"<en>I MIND! I MIND! It's too {U3-034|spicy}! Water! Water!</en>\""
  - id: s17
    text: "Kaan: \"<en>Duru said 'I mind'! Somebody write it on the board!</en>\" Bora ise çantasından bir kutu süt çıkardı: \"<en>Milk is better than water for {U3-034|spicy} food. Trust me, I'm a chef.</en>\""
  - id: s18
    text: "Duru sütü bir dikişte bitirdi, derin bir nefes aldı ve kararını açıkladı: \"<en>Never again. I {U2-013|can't stand} {U3-034|spicy} food. That's final.</en>\""
  - id: s19
    text: "Murat Bey: \"<en>Well done, everybody! {U3-035|Sweet}, {U3-033|sour}, {U3-027|bitter}, {U3-032|salty} and {U3-034|spicy}: five {U3-036|tastes}, five brave students.</en>\""
  - id: s20
    text: "Derken kutudan son bir şey çıktı: bir kek. Murat Bey: \"<en>A prize. I {U3-001|baked} it last night: two {U3-039|cups} of {U3-046|flour}, three eggs and one {U3-042|teaspoon} of {U3-043|baking powder}.</en>\""
  - id: s21
    text: "Selin elini kaldırdı ve ilk gülen o oldu: \"<en>One {U3-042|teaspoon}, not a {U3-042|tablespoon}. I know, I know!</en>\" Murat Bey göz kırptı: \"<en>Everybody learns from a volcano.</en>\""
  - id: s22
    text: "Murat Bey: \"<en>And here's the secret: I {U3-006|preheated} the {U3-040|oven} {U3-045|first}. Ten minutes at 180 degrees.</en>\""
  - id: s23
    text: "Selin keki ısırdı ve onayladı: \"<en>Not {U3-027|bitter}, not {U3-034|spicy}. Just right.</en>\" Bora ikinci parçaya uzanırken: \"<en>The perfect {U3-036|taste}!</en>\""
  - id: s24
    text: "Teneffüste Bora sınıf grubuna yazdı: \"<en>My mum is on night shift tomorrow. Pasta at my place? My grandpa {U1-005|is coming over} too. Leave it to me! 🍝</en>\""
  - id: s25
    text: "Kaan: \"<en>I'm in!</en>\" Duru: \"<en>Only if it isn't {U3-034|spicy}.</en>\""

scene:
  - id: c01
    speaker: Murat Bey
    text: "<en>So, how did the lemon taste, Kaan?</en>"
  - id: c02
    speaker: Kaan
    text: "<en>Very sour! And Selin's dark chocolate was bitter.</en>"
  - id: c03
    speaker: Bora
    text: "<en>My crisps were salty, and Ece's Turkish delight was sweet. Rose flavour!</en>"
  - id: c04
    speaker: Duru
    text: "<en>And my red chilli was too spicy. Now I mind.</en>"

