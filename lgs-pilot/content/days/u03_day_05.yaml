tips:
  - type: tuzak
    refs: [U3-027, U3-034]
    text: "Türkçedeki \"acı\" İngilizcede ikiye ayrılır: kahve, bitter çikolata, ilaç → bitter · biber, acı sos → spicy (ya da hot). Bitter tek başına \"çikolatalı\" demek değildir!"
  - type: tuzak
    refs: [U3-035]
    text: "sweet bir TAT sıfatıdır: \"It's too sweet.\" = Fazla tatlı. Yemekten sonra yenen \"tatlı\" (baklava, sütlaç) için İngilizcede ayrı bir isim var; Gün 9'da tanışacaksın."
  - type: mini_dilbilgisi
    refs: [U3-036]
    text: "taste hem isim (the taste = tat) hem fiildir: \"Taste the soup.\" = Çorbanın tadına bak. \"It tastes good.\" yapısında ardından sıfat gelir (tastes good ✓, tastes well ✗). flavour İngiliz yazımı; Amerikalılar flavor yazar."
  - type: ilginc_bilgi
    refs: [U3-034]
    text: "Biberin yakıcılığını veren madde (kapsaisin) suda neredeyse hiç çözünmez, bu yüzden su pek işe yaramaz. Süt ve yoğurt ise yanmayı daha hızlı yatıştırır."

coach:
  start: "Murat Bey'in kutusunda beş gizem var, gözler kapalı. Duru bugün ilk kez itiraz edecek mi? 🙈"
  end_good: "Süper! Dilin de kelimelerin de keskin. Duru'ya bir bardak süt, sana bir yıldız ⭐"
  end_mixed: "Fena değil! {weak} biraz yaktı ama Bora ne diyor: süt iyi gelir, tekrar daha da iyi. 🥛"

notifications:
  morning: "Bugün gözler kapalı. Murat Bey'in kutusundan ne çıkacak? 🙈"
  evening: "Duru bugün ilk kez 'I mind!' dedi. Sebebi küçücük ve kıpkırmızı 🌶️"
  review: "Kahve 'bitter', kırmızı biber 'spicy'. Peki limon? Cevap tek kelime 🍋"

