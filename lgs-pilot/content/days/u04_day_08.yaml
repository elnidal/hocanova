title: "Çevirmeli telefon"
est_minutes: 10
characters: [Murat Bey, Kaan, Ece, Duru, Selin, Bora, Kaan'ın dedesi, Kaan'ın annesi, Selin'in babaannesi, Bora'nın dedesi]
