story:
  - id: s01
    text: "Salı sabahı Murat Bey sözünü tuttu; sınıf grubuna tatil ödevinin yeni kısmı düştü: \"<en>How did your grandparents {U4-044|communicate} fifty years ago? Ask them {U4-046|face to face}. No phones, please!</en>\""
  - id: s02
    text: "Kaan: \"<en>No phones?! In the phone holiday? Murat Bey, are you OK? 😱</en>\""
  - id: s03
    text: "Ece hemen işe koyuldu: \"<en>Let's {U4-027|meet up} and {U4-049|decide} together. Who can visit which grandparent?</en>\""
  - id: s04
    text: "Selin: \"<en>My dad and I are going to Urla today. I'll ask my grandma.</en>\" Bora: \"<en>My grandpa is coming to our house tonight. Easy!</en>\""
  - id: s05
    text: "Kaan: \"<en>My grandpa has a really old phone. Come with me! {U4-029|We'll meet at my grandpa's at two, then}.</en>\" Duru: \"<en>{U4-021|I guess} I can come. Is there a sofa?</en>\""
  - id: s06
    text: "Saat tam ikide Ece ile Duru, Kaan'ın dedesinin kapısındaydı. Kaan ise iki dakika sonra, tişörtünü ters giymiş hâlde koşarak geldi."
  - id: s07
    text: "Dedesi kapıyı açıp torununa güldü: \"<en>Look at him! {U1-075|He's always in a hurry}, but he's always late. Come in, come in!</en>\""
  - id: s08
    text: "Çaylar gelince dede dolaptan siyah, ağır bir telefon çıkardı. Üstünde ekran yoktu; yalnızca delikli, yuvarlak bir disk vardı."
  - id: s09
    text: "Dede: \"<en>This {U4-048|device} is fifty years old, and it still works!</en>\" Kaan telefonu evirip çevirdi: \"<en>Where's the screen? Where are the {U4-043|applications}? Is it broken?</en>\""
  - id: s10
    text: "Dede: \"<en>No screen, no {U4-043|apps}! You put your finger in a hole and turn it. One number at a time.</en>\""
  - id: s11
    text: "Dede: \"<en>Do you know who {U4-047|invented} the telephone?</en>\" Duru, gözleri yarı kapalı, kanepeden mırıldandı: \"<en>Alexander Graham Bell. In 1876. I read it this morning.</en>\""
  - id: s12
    text: "Kaan: \"<en>You read something? Before noon?</en>\" Dede: \"<en>Right, Duru! A great {U4-047|invention}. But when I was a boy, there was only one phone in our street, at the grocer's.</en>\""
  - id: s13
    text: "Dede: \"<en>Long {U4-045|conversations}? Never! Calls were short and expensive. We {U4-044|communicated} with letters.</en>\""
  - id: s14
    text: "Dede eski bir teneke kutuyu açtı; içi sararmış zarflarla doluydu: \"<en>When I was a student in Ankara, your grandma and I {U4-008|kept in touch} with these. One letter every week!</en>\""
  - id: s15
    text: "Ece'nin gözleri parladı: \"<en>One letter every week? That's so lovely!</en>\" Kaan ise dehşete düşmüştü: \"<en>A week for one message? I can't wait one minute for a reply!</en>\""
  - id: s16
    text: "Dede telefonu Kaan'ın önüne koydu: \"<en>Then try this {U4-048|device}. Call your mum.</en>\" Kaan parmağını ilk deliğe soktu, diski çevirdi; disk tıkır tıkır, kaplumbağa hızıyla geri döndü."
  - id: s17
    text: "Kaan: \"<en>Come on, come on! This is the slowest {U4-048|device} in the world!</en>\""
  - id: s18
    text: "Kaan onuncu rakama geldiğinde kapı açıldı: annesi elinde bir tepsi poğaçayla içeri girdi."
  - id: s19
    text: "Kaan'ın annesi: \"<en>Kaan? Why are you calling me? I'm right here! Let's talk {U4-046|face to face}.</en>\""
  - id: s20
    text: "Herkes kahkahayı bastı. Ece: \"<en>The best phone {U4-045|conversation} in history: zero seconds!</en>\""
  - id: s21
    text: "Akşam Selin'den, Urla'dan bir sesli mesaj geldi: \"<en>My grandma says: 'A phone {U4-045|conversation} was three minutes, because it was expensive. Now you {U2-055|chat online} all day with one {U4-043|application}!'</en>\""
  - id: s22
    text: "Selin: \"<en>And she says: 'Talk {U4-046|face to face} sometimes. It's good for the heart.'</en>\""
  - id: s23
    text: "Bora'nın mesajı geldi: \"<en>My grandpa says: fifty years ago, he called the radio and asked for {U2-024|jazz} songs. That was his favourite way of {U4-044|communication}! 🎷</en>\""
  - id: s24
    text: "Kaan: \"<en>OK, I have an idea. I'll {U4-047|invent} a phone with no waiting!</en>\" Duru: \"<en>It's called a smartphone, Kaan.</en>\""
  - id: s25
    text: "Az sonra gruba Bora'nın telefonundan bir sesli mesaj daha düştü; bu kez konuşan dedesiydi: \"<en>Kids! For your homework: listen to some {U2-024|jazz} tonight. Old and beautiful!</en>\""
  - id: s26
    text: "Bora'nın dedesi: \"<en>OK, I'll stop now. {U4-028|Thanks for calling}… oh wait, nobody called. It's a message! Well, {U4-028|take care}, kids. {U4-028|Talk to you soon}!</en>\""
  - id: s27
    text: "Gece Ece gruba yazdı: \"<en>Homework done, team! Concert on Saturday. I'll send the final plan soon.</en>\" Duru: \"<en>Send it by letter. We'll get it next month.</en>\""

scene:
  - id: c01
    speaker: Murat Bey
    text: "<en>How did your grandparents communicate fifty years ago? Talk to them face to face.</en>"
  - id: c02
    speaker: Kaan'ın dedesi
    text: "<en>This device has no screen and no applications, but it still works!</en>"
  - id: c03
    speaker: Kaan
    text: "<en>This phone is so slow. One day I'll invent a faster one!</en>"
  - id: c04
    speaker: Kaan'ın annesi
    text: "<en>Kaan, I'm right here. Let's have a conversation face to face.</en>"

