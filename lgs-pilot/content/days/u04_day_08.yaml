tips:
  - type: tuzak
    refs: [U4-043]
    text: "application telefon bağlamında \"uygulama\"dır, kısaca app denir: download an app. Ama job application \"iş başvurusu\" demektir. Cümlede phone, download, screen varsa uygulama anlamına bak."
  - type: kelime_ailesi
    refs: [U4-047, U4-044]
    text: "invent (icat etmek) → invention (icat) → inventor (mucit). communicate (iletişim kurmak) → communication (iletişim). Önünde a / the / a great varsa isim hâlini seç: a great invention."
  - type: ilginc_bilgi
    refs: [U4-047]
    text: "Alexander Graham Bell telefonun patentini 1876'da aldı. Telefonla iletilen ilk cümlenin, Bell'in yardımcısına söylediği \"Mr Watson, come here, I want to see you.\" olduğu anlatılır."
  - type: mini_dilbilgisi
    refs: [U4-046]
    text: "face to face kalıbında artikel yoktur: talk face to face (✓), talk a face to the face (✗). Sıfat gibi isimden önce gelince tire alır: a face-to-face conversation."

