    item: U1-030
    prompt: "Boşluğa uygun olanı seç."
    stem: "<en>Ece and Selin have known each other for years. They talk every day and share all their secrets. They are ________.</en>"
    options: ["close friends", "strangers", "enemies", "new neighbours"]
