  - id: d07-r06
    type: gap_fill
    item: U1-033
    prompt: "Boşluğa uygun olanı seç."
    stem: "<en>Ece and Selin met in kindergarten. Their ________ started when they were five.</en>"
    options: ["friendship", "invitation", "excuse", "homework"]
    answer: 0
    explain: "Anaokulunda tanışan iki kişinin arkadaşlığı (friendship) beş yaşında başladı."

tips:
  - type: mini_dilbilgisi
    refs: [U1-039]
    text: "introduce A to B: \"Ece introduced Elif to Kaan.\" Kendini tanıtırken: \"Let me introduce myself.\""
  - type: tuzak
    refs: [U1-038]
    text: "interested in'den sonra fiil gelirse -ing alır: \"I'm interested in playing the guitar.\" Dikkat: interested (ilgilenen kişi) ≠ interesting (ilginç olan şey): \"I'm interested in music. Music is interesting.\""
  - type: kelime_ailesi
    refs: [U1-036, U1-042]
    text: "have a lot in common ↔ have nothing in common (hiç ortak noktası olmamak). same opinion ↔ different opinion (farklı fikir). Zıtlarını da bilirsen LGS'de çeldiriciyi hemen yakalarsın."
  - type: mini_dilbilgisi
    refs: [U1-029]
    text: "chat hem fiil hem isim: \"We chatted for an hour.\" = \"We had a chat for an hour.\" chat → chatted (t iki kez yazılır)."

coach:
  start: "Sınıfa yeni biri geliyor! Ve Duru bir derste ilk kez gözlerini açık tutacak 😮"
  end_good: "Harika! Artık birini tanıştırabilir, ortak noktaları anlatabilirsin. Elif seninle gurur duyar!"
  end_mixed: "İyi iş! {weak} biraz kafa karıştırdı; yarınki tekrar sorularında yine göreceğiz."

notifications:
  morning: "Sınıfta yeni biri var! Duru'nun gözleri neden birden açıldı? 🎸🐶"
  evening: "Kaan'ın telefonu neden yanıyor? Cevap Duru ve Elif'te. 10 dakika 🔥"
  review: "Tek soru: \"We have a lot in common.\" diyen iki kişi birbirine benziyor mu?"

