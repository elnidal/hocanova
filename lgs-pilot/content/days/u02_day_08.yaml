story:
  - id: s01
    text: "Çarşamba, İngilizce dersi. Murat Bey tahtaya anketin yeni bölümünü yazdı: \"<en>Part 2: {U2-043|Daily Routine}</en>\""
  - id: s02
    text: "Murat Bey: \"<en>Each group writes about one person's {U2-043|daily routine}. When do you get up? What do you do after school? Any volunteers?</en>\""
  - id: s03
    text: "Ece'nin grubunda seçim çok kolay oldu. Ece ve Elif aynı anda Selin'i gösterdi."
  - id: s04
    text: "Elif: \"<en>Selin is perfect for this. She's the most {U1-090|self-disciplined} person in our class!</en>\""
  - id: s05
    text: "Selin: \"<en>OK. I {U2-044|always} get up at 6.30. Even on Saturdays.</en>\" Bora: \"<en>Even on Saturdays?! That's scary.</en>\""
  - id: s06
    text: "Selin: \"<en>I {U2-045|regularly} go running before breakfast – on Mondays, Wednesdays and Fridays.</en>\""
  - id: s07
    text: "Selin: \"<en>I {U2-044|usually} walk to school with Ece. We are {U2-044|never} late.</en>\""
  - id: s08
    text: "Kaan: \"<en>{U2-047|Most of the time}, I'm late. Is that a routine too?</en>\" Ece: \"<en>Kaan, that's not a routine. That's a talent.</en>\""
  - id: s09
    text: "Selin: \"<en>After school, my dad {U2-048|picks me up}. He parks in front of the school gate at 3.40 – not 3.39, not 3.41.</en>\""
  - id: s10
    text: "Ece: \"<en>And he plays {U2-025|classical music} in the car. Selin knows every Mozart piece!</en>\""
  - id: s11
    text: "Selin: \"<en>Well, he {U2-046|mostly} listens to {U2-025|classical music}, but on Fridays it's {U2-026|folk music}. Grandad's choice!</en>\""
  - id: s12
    text: "Elif: \"<en>She also reads {U2-045|regularly}. Twenty pages every night before bed!</en>\""
  - id: s13
    text: "Akşamlar ise şöyle geçiyor: ödev, akşam yemeği, kitap. Ama bir sorun var: Selin'in ağabeyi Emre."
  - id: s14
    text: "Selin: \"<en>My brother listens to {U2-027|rap} in his room {U2-047|most of the time}. Very {U2-028|loud} rap.</en>\""
  - id: s15
    text: "Selin: \"<en>Our walls are thin, so the house gets really {U2-029|noisy}. It's so {U2-030|annoying} when I'm studying!</en>\""
  - id: s16
    text: "Bora: \"<en>So what do you do?</en>\" Selin: \"<en>I put on my headphones. {U2-047|Most of the time}, it works.</en>\""
  - id: s17
    text: "Kaan'ın merakı bitmiyordu: \"<en>Selin, do you ever break your routine? Pizza at midnight? A film on a school night?</en>\""
  - id: s18
    text: "Selin biraz düşündü: \"<en>Hmm… I {U2-044|sometimes} watch a film on Friday nights. And I {U2-044|rarely} eat chips.</en>\" Kaan: \"<en>Rarely?! Selin, you're living dangerously!</en>\""
  - id: s19
    text: "Duru: \"<en>My {U2-043|daily routine} is easy: sleep, school, sleep, dinner, sleep.</en>\" Murat Bey güldü: \"<en>Duru, that's a very honest survey answer.</en>\""
  - id: s20
    text: "Son ders bitince bardaktan boşanırcasına yağmur başladı. Kaan'ın şemsiyesi yoktu. Bora'nın da."
  - id: s21
    text: "Selin: \"<en>Don't worry. My dad is {U2-048|picking me up} in five minutes. He can drive you home too.</en>\""
  - id: s22
    text: "Selin'in babası tam 3.40'ta kapıdaydı. Kaan arabaya atladı; Bora ise yerde parlayan bir şey görüp eğildi."
  - id: s23
    text: "Bora: \"<en>Wait! Somebody dropped a pen. Let me {U2-048|pick it up}.</en>\" Selin: \"<en>That's Kaan's pen. {U1-075|He's always in a hurry}. He drops everything!</en>\""
  - id: s24
    text: "Arabada, tahmin ettiğiniz gibi, Mozart çalıyordu. Kaan beş dakikada uyuyakaldı. Selin'in babası gülümsedi: \"<en>Selin, your friends {U2-046|mostly} sleep in my car.</en>\""
  - id: s25
    text: "Selin'in babası: \"<en>My daughter is {U1-059|reliable} like a clock. She {U2-045|regularly} reminds me about my dentist appointments!</en>\""
  - id: s26
    text: "O akşam Selin anket kâğıdına son cümleyi yazdı: \"<en>My days are {U2-046|mostly} the same, but I like them that way.</en>\""

scene:
  - id: c01
    speaker: Murat Bey
    text: "<en>Selin, can you tell us about your daily routine?</en>"
  - id: c02
    speaker: Selin
    text: "<en>Sure. I always get up at 6.30, and I regularly go running before breakfast.</en>"
  - id: c03
    speaker: Kaan
    text: "<en>Who picks you up after school?</en>"
  - id: c04
    speaker: Selin
    text: "<en>My dad. He is never late, and most of the time he plays classical music in the car.</en>"

