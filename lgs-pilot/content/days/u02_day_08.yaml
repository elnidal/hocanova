tips:
  - type: mini_dilbilgisi
    refs: [U2-044]
    text: "Sıklık zarfı ana fiilden önce, be fiilinden (am/is/are) sonra gelir: \"I always get up at 6.30.\" ama \"We are never late.\" Sıra: always (%100) > usually > often > sometimes > rarely > never (%0)."
  - type: tuzak
    refs: [U2-048]
    text: "pick up iki anlamlı: \"Dad picks me up after school.\" (arabayla gelip almak) · \"Bora picked up the pen.\" (yerden almak). Nesne bir zamirse araya girer: \"pick me up\" ✓, \"pick up me\" ✗."
  - type: lgs_taktigi
    refs: [U2-046, U2-047, U2-044]
    text: "Anket tablosu sorularında sayılara bak: 7 günün 7'si = always, 0 = never, çoğunluk = mostly / most of the time. 25 kişiden 18'i bir şeyi seçtiyse \"mostly\" doğru cevaptır."
  - type: kelime_ailesi
    refs: [U2-045]
    text: "regular (düzenli) + -ly = regularly (düzenli olarak). Zıttı: irregular. \"a regular routine\" · \"I regularly go running.\""

