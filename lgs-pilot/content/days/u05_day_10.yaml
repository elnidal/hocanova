story:
  - id: s01
    text: "Pazar akşamı, sunumdan bir gün önce, Bora'nın annesinin nöbeti yoktu. Bora laptopu açtı, biriktirdiği harçlığı masaya koydu: \"<en>Mum, can we buy real drumsticks? My own! Ahmet Amca's drums are great, but his sticks are forty years old.</en>\""
  - id: s02
    text: "Annesi gülümsedi: \"<en>OK, but this time we do it together. Open the {U5-016|browser} and {U5-022|search for} a real music shop. No 'free drum set' pages!</en>\""
  - id: s03
    text: "Bora, DrumStar adlı bir müzik mağazasının sitesini buldu; adres çubuğunda küçük bir kilit vardı. \"<en>{U5-051|Online shopping} with my mum. Last week's Bora can't believe it.</en>\""
  - id: s04
    text: "Sayfada iki çift baget vardı: \"<en>Pro Sticks – 400 TL – {U5-052|refundable} · Star Sticks – 250 TL – 40% off – {U5-052|non-refundable}</en>\""
  - id: s05
    text: "Bora: \"<en>{U5-052|Non-refundable}? What does it mean?</en>\" Annesi: \"<en>It means you can't {U4-041|return} them and get your money back. So choose carefully.</en>\""
  - id: s06
    text: "Bora bir davul öğretmeninin videosunu açtı: \"<en>This drum {U5-039|expert} says Star Sticks are perfect for beginners. Very {U5-046|useful} video. I'm a beginner. Star Sticks!</en>\""
  - id: s07
    text: "Ödeme sayfası açılınca Bora ellerini klavyeden çekti ve sandalyesini geri itti: \"<en>Card details: you, not me. I learned my lesson.</en>\""
  - id: s08
    text: "Annesi kartını çıkardı: \"<en>Name of the {U5-050|cardholder}: that's me. Card number… done.</en>\""
  - id: s09
    text: "Bora gözlerini kapattı: \"<en>Is the {U5-050|expiry date} OK? Is the card still alive?</en>\" Annesi güldü: \"<en>It's alive until 2029. {U5-051|Online shopping} rule one: only the adult types the card details. Now look away!</en>\""
  - id: s10
    text: "Pazartesi sabahı sunum günüydü. Bora yine kravatla gelmişti. Kaan: \"<en>Buddy, are you {U2-059|nervous}?</en>\" Bora: \"<en>Me? No. My tie is {U2-059|nervous}.</en>\""
  - id: s11
    text: "Önce Ece–Selin–Elif ekibi rehberini sundu. Selin sahte haber bölümünü anlattı: \"<en>Before you share news, {U5-038|do research}. Check the school website and read what {U5-039|experts} say.</en>\""
  - id: s12
    text: "Sonra sıra Bora'ya geldi. Tahtaya tek bir kelime yazdı: \"<en>FREE?</en>\" Ve anlatmaya başladı: \"<en>Not long ago, a {U5-013|stranger} promised me a free drum set. I {U5-017|clicked}, and I typed my personal {U5-042|information}. The next morning, my account wasn't mine.</en>\""
  - id: s13
    text: "Bora: \"<en>But I didn't make an excuse. I told my friends and my mum, and we changed my password together.</en>\""
  - id: s14
    text: "Bora: \"<en>Yesterday my mum and I did some {U5-051|online shopping}: my first drumsticks! Only the {U5-050|cardholder} typed the card details. And they're {U5-052|non-refundable}, so I have to love them!</en>\" Sınıf kahkahayı bastı."
  - id: s15
    text: "Alkışlar dinince Murat Bey: \"<en>This is the best example in the class, Bora. Real stories teach more than rules.</en>\""
  - id: s16
    text: "Teneffüste Ece'nin telefonuna iki milyon takipçili bir {U5-031|influencer}'dan mesaj geldi: \"<en>Hi! Love your channel! Post a video with my new energy drink, and I'll pay you 5,000 TL. Deal?</en>\""
  - id: s17
    text: "Kaan'ın gözleri büyüdü: \"<en>5,000! We can buy a real drum set for Bora!</en>\" Bora başını iki yana salladı: \"<en>{U5-056|That's very kind of you, but} no. I've got my sticks now.</en>\""
  - id: s18
    text: "Ece kısa bir mesaj yazdı: \"<en>{U5-056|Thanks for asking, but} we don't do paid ads. Our channel is only for our music. Have a nice day!</en>\""
  - id: s19
    text: "Selin omzunun üstünden okudu: \"<en>Short, clear and {U4-052|polite}. Ten out of ten.</en>\""
  - id: s20
    text: "Son derste Murat Bey tahtaya büyük harflerle yazdı: \"<en>SPRING NATURE CAMP – 2 DAYS</en>\" \"<en>Your parents can buy the bus tickets online. {U5-060|Round-trip} tickets, of course. We're all coming back!</en>\""
  - id: s21
    text: "Kaan: \"<en>Can I get a {U5-060|one-way} ticket? I want to live in the forest!</en>\" Selin kaşını kaldırdı: \"<en>You'll miss the bus anyway. Buy a {U5-060|round-trip} ticket and a good alarm clock.</en>\""
  - id: s22
    text: "Kaan, Duru'ya döndü: \"<en>Duru, live in the forest with me?</en>\" Duru: \"<en>{U5-056|Thanks for asking, but} no. A {U5-060|one-way} ticket to my sofa, please.</en>\""
  - id: s23
    text: "O akşam Ece kanalın sayfasına baktı: \"<en>Subscribers: 1,200 → 3,400</en>\" Gruba yazdı: \"<en>Our subscribers {U5-041|increased} after Bora's story!</en>\""
  - id: s24
    text: "Ama en çok izlenen video, Ece'nin on kez çektiği videolardan biri değildi. Kesintisiz bir canlı provaydı: Fıstık uluyor, Bora'nın bageti havaya uçuyor, Elif gülmekten nakaratı kaçırıyordu. \"<en>Views: 52,000 and {U5-041|increasing}</en>\""
  - id: s25
    text: "Ece önce kaşlarını çattı, sonra kahkahayı bastı: \"<en>Not perfect. But ours. ❤️</en>\" Elif: \"<en>And the kind comments {U5-041|increase} every day!</en>\""
  - id: s26
    text: "Gece yarısı gruba son mesaj Kaan'dan geldi: \"<en>Camp! I'm setting three alarms tonight. Me? Late? Never!</en>\" Duru'nun cevabı tek kelimeydi: \"<en>Sure.</en>\""

