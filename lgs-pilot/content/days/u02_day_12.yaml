story:
  - id: s01
    text: "Pazar öğleden sonra. Grup, parkın karşısındaki küçük pastanede anket sonuçlarına bakıyordu. Kapı açıldı ve içeri iki kişi girdi."
  - id: s02
    text: "Önde Ege vardı: lacivert takım elbise, kravat, ayna gibi parlayan ayakkabılar. Arkasında yine takım elbiseli, uzun boylu genç bir adam."
  - id: s03
    text: "Ece gözlerine inanamadı: \"<en>Ege? Why are you wearing such {U2-067|formal} clothes? It's Sunday!</en>\""
  - id: s04
    text: "Ege burnunu havaya dikti: \"<en>This is my cousin Kerem. He's an {U2-072|adult}. He works in a bank. We only wear {U2-067|formal} clothes now.</en>\""
  - id: s05
    text: "Kerem gülümseyerek herkesle tokalaştı: \"<en>Hi, everyone. Nice to meet you.</en>\" Kaan, Bora'ya fısıldadı: \"<en>A real {U2-072|adult}! With a tie!</en>\""
  - id: s06
    text: "Ege masaya şöyle bir baktı. Sonra gözü Duru'ya takıldı: bol, yumuşacık bir kazak ve tüylü terliğe benzeyen kahverengi botlar."
  - id: s07
    text: "Ege: \"<en>Duru, your clothes are so {U2-070|ordinary}.</en>\" Duru omuz silkti: \"<en>Thanks! They're {U2-068|comfortable}. I'm {U1-079|laid-back}.</en>\""
  - id: s08
    text: "Ece kaşlarını çattı: \"<en>Ege, don't be {U1-083|mean}.</en>\" Selin, Elif'in kulağına eğildi: \"<en>He's acting like a {U2-069|snob}.</en>\""
  - id: s09
    text: "Ege tezgâha baktı: önünde altı kişi bekliyordu. \"<en>A {U2-053|queue}? I {U2-051|hardly ever} wait in a {U2-053|queue}.</en>\""
  - id: s10
    text: "Kerem onu kolundan nazikçe tuttu: \"<en>Ege, everybody waits. Come on.</en>\" İkisi de en arkaya geçti."
  - id: s11
    text: "Beklerken Ege vitrine burun kıvırdı: \"<en>Simit and tea? So {U2-070|ordinary}. In my opinion, a café needs croissants.</en>\""
  - id: s12
    text: "Bora gülmemek için yanağını ısırdı: \"<en>Ege, you're such a {U2-069|snob}! Simit isn't {U2-070|ordinary}. It's the king of food!</en>\""
  - id: s13
    text: "Kerem ise simidinden kocaman bir ısırık aldı ve gözlerini kapadı: \"<en>Mmm! This is {U2-071|pretty} good. Actually, it's great!</en>\""
  - id: s14
    text: "Sonra kravatını gevşetti, ceketini sandalyeye astı: \"<en>Phew! {U2-067|Formal} clothes are for work. They aren't very {U2-068|comfortable}.</en>\""
  - id: s15
    text: "Ege'nin ağzı açık kaldı: \"<en>But you said you {U2-049|rarely} wear jeans!</en>\" Kerem güldü: \"<en>At work, yes. At the weekend I {U2-050|seldom} wear a suit. Today we came from a family lunch.</en>\""
  - id: s16
    text: "Kerem, Duru'nun botlarını gösterdi: \"<en>Those boots look {U2-068|comfortable}. And {U2-071|pretty}, too!</en>\" Duru, Ege'ye zafer dolu bir bakış attı."
  - id: s17
    text: "Elif defterini açtı: \"<en>Kerem, can we ask you our survey questions? We need an {U2-072|adult}!</en>\""
  - id: s18
    text: "Kerem: \"<en>Sure! How often do I read? Every day. I {U2-054|follow the news} on the bus every morning.</en>\" Selin'in gözleri parladı: \"<en>Me too! On my phone, every morning!</en>\""
  - id: s19
    text: "Kerem: \"<en>The gym? {U2-052|Twice a week}. And I play football with my friends on Sundays, in old jeans!</en>\""
  - id: s20
    text: "Ege yavaşça kravatını çıkarıp cebine koydu, simitten küçük bir parça kopardı: \"<en>OK… maybe simit is {U2-071|pretty} good.</en>\" Herkes güldü."
  - id: s21
    text: "Ece kuzeninin omzuna dokundu: \"<en>Ege, you aren't really a {U2-069|snob}. You just wanted to look like Kerem.</en>\" Ege kızardı: \"<en>Maybe a little.</en>\""
  - id: s22
    text: "Kerem göz kırptı: \"<en>Ege, clothes don't make you cool. Being kind and {U1-088|respectful} does.</en>\""
  - id: s23
    text: "Duru ayağını uzattı: \"<en>And {U2-068|comfortable} boots, of course!</en>\" Ege de herkesle birlikte kahkahaya boğuldu."

scene:
  - id: c01
    speaker: Ege
    text: "<en>Duru, your clothes are so ordinary.</en>"
  - id: c02
    speaker: Duru
    text: "<en>Maybe, but they're comfortable. I don't need formal clothes on a Sunday.</en>"
  - id: c03
    speaker: Selin
    text: "<en>Ege, don't be a snob. Look at Kerem!</en>"
  - id: c04
    speaker: Kerem
    text: "<en>I wear a suit at work, but at the weekend I wear jeans. And this simit is pretty good!</en>"

