tips:
  - type: tuzak
    refs: [U2-071]
    text: "pretty iki anlamlı! pretty + isim = güzel, sevimli (a pretty dress). pretty + sıfat/zarf = oldukça (pretty good, pretty long): \"The simit was pretty good.\" = Simit oldukça iyiydi, çok güzel değil!"
  - type: kelime_ailesi
    refs: [U2-068, U2-067]
    text: "comfortable ↔ uncomfortable (rahatsız) · formal ↔ informal (resmi olmayan, gündelik)."
  - type: lgs_taktigi
    refs: [U2-067, U2-064, U2-065]
    text: "formal clothes ≈ smart clothes, zıttı casual clothes. Soruda takım elbise, kravat, düğün, toplantı görürsen cevap büyük ihtimalle formal!"
  - type: ilginc_bilgi
    refs: [U2-068]
    text: "comfortable yazıldığı gibi okunmaz: /ˈkʌmftəbl/, yani \"KAMF-tı-bıl\". Ortadaki \"or\" neredeyse hiç duyulmaz."

coach:
  start: "Ege geri döndü, hem de yanında takım elbiseli bir misafirle! Pastanede bugün tuhaf bir pazar yaşanacak. 🥯"
  end_good: "Harika! Bugün hem pretty'nin iki yüzünü hem de Ege'nin yeni halini tanıdın. Sonuçların pretty good, hatta mükemmel! 🎉"
  end_mixed: "Güzel iş! {weak} biraz zorladı, sorun değil. Ege bile simidi sonunda sevdi; bu kelimeyi de yarın seveceksin! 🥯"

notifications:
  morning: "Ege geri geldi ama yalnız değil! 👔 Yanındaki takım elbiseli adam kim?"
  evening: "Simit mi kruvasan mı? Ege'nin pastane krizi bugünkü derste, 10 dakika. 🥯"
  review: "Tek soru: \"This simit is pretty good.\" Buradaki pretty ne demek?"

