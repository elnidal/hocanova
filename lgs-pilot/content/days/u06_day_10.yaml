tips:
  - type: tuzak
    refs: [U6-034]
    text: "the'yi unutma: ❌ most dangerous sport → ✓ the most dangerous sport. Düzensizler: good → better → the best, bad → worse → the worst. Kısa sıfatta -est (the bravest), uzun sıfatta the most (the most exciting)."
  - type: tuzak
    refs: [U6-056]
    text: "take place kelimesi kelimesine \"yer almak\" değildir: The festival takes place in May = Festival mayısta yapılır. Bir etkinliğe katılmak ise take part in."
  - type: tuzak
    refs: [U6-057]
    text: "pleasure tek başına \"zevk, memnuniyet\" demektir. Teşekküre cevap: My pleasure. ya da You're welcome. ❌ My welcome diye bir kalıp yok."
  - type: ilginc_bilgi
    refs: [U6-045]
    text: "Efes'teki Artemis Tapınağı, Antik Dünyanın Yedi Harikası'ndan biriydi. Bugün yerinde yalnızca tek bir sütun ayakta duruyor."

