story:
  - id: s01
    text: "Salı, İngilizce dersi. Murat Bey perdeleri kapattı ve tahtaya çıtırdayan bir kamp ateşi videosu yansıttı. Sıralar çember oldu; Duru battaniyesini getirmişti bile."
  - id: s02
    text: "Murat Bey: \"<en>Campfire round! Only one question: what was {U6-034|the most exciting thing} you did at camp?</en>\""
  - id: s03
    text: "Kaan ilk atılan oldu, tabii: \"<en>{U6-010|Canoeing}! When the {U6-054|wind} started, we {U6-018|landed} like pilots. That was {U6-034|the most exciting} moment!</en>\""
  - id: s04
    text: "Duru battaniyenin altından: \"<en>I saw the photos. {U6-034|The funniest} moment was you, Kaan, pulling the canoe with me in it.</en>\" Sınıf kahkahalarla çınladı; Kaan da herkesle birlikte güldü."
  - id: s05
    text: "Selin: \"<en>For me, the zip-line. I was scared, but I followed the plan.</en>\" Elif: \"<en>Selin, you were {U6-034|the bravest} person at camp!</en>\""
  - id: s06
    text: "Bora parmağını kaldırdı: \"<en>Excuse me? I went to the top of the wall! I was {U6-034|the bravest}!</en>\" Selin güldü: \"<en>OK. You were {U6-034|the bravest} on the wall, and I was {U6-034|the bravest} on the zip-line.</en>\""
  - id: s07
    text: "Ece: \"<en>And Duru was {U6-034|the calmest} in the dark forest. She found the way!</en>\" Duru: \"<en>I was also {U6-034|the sleepiest}. Every day.</en>\""
  - id: s08
    text: "Murat Bey öksürdü: \"<en>For me, {U6-034|the best} moment was my story about {U6-008|scuba diving}. Under the water you feel the {U6-053|freedom}…</en>\" Bütün sınıf bir ağızdan: \"<en>We know! No phones, only fish!</en>\""
  - id: s09
    text: "Selin ciddileşti: \"<en>I learned one important rule at the lake: always wear a life jacket. People without one can {U6-017|drown}, even good swimmers.</en>\" Murat Bey başıyla onayladı."
  - id: s10
    text: "Tur bittiğinde tahtada uzun bir liste vardı; bu kez Ece'nin değil, bütün sınıfın listesi. Herkes kendinden çok arkadaşlarını anlatmıştı. Murat Bey: \"<en>This is a real team. You {U1-064|support each other}.</en>\""
  - id: s11
    text: "Ece defterine baktı: \"<en>Four pages of plans, and my favourite moment wasn't in them.</en>\" Murat Bey: \"<en>Sometimes a surprise is more {U2-092|enjoyable} than a plan.</en>\""
  - id: s12
    text: "Sonra Murat Bey videoyu durdurdu ve bir e-posta yansıttı: \"<en>Big news! In April, a partner class from abroad is coming to İzmir. They want to see our {U6-045|historic places}. And you are going to be their guides!</en>\""
  - id: s13
    text: "Sınıf bir anda uğuldadı. Kaan: \"<en>Us? Guides? When does it {U6-056|take place}?</en>\""
  - id: s14
    text: "Murat Bey: \"<en>The tour {U6-056|takes place} on a Saturday, at ten o'clock.</en>\" Selin hemen Kaan'a döndü: \"<en>Ten, Kaan. Not ten-thirty.</en>\" Kaan: \"<en>Me? Late? Never!</en>\" Kimse inanmadı."
  - id: s15
    text: "Ece'nin defteri çoktan açılmıştı: \"<en>Kemeraltı, the Clock Tower, the Agora… Which {U6-045|historic structures} do they want to see first? And is there a {U6-045|temple}?</en>\""
  - id: s16
    text: "Murat Bey: \"<en>Good question, Ece. Ephesus is in İzmir too. A very famous {U6-045|temple} was there: the Temple of Artemis.</en>\" Bora: \"<en>Will they eat Turkish food? I can make sütlaç!</en>\""
  - id: s17
    text: "Zil çaldı. Selin kimse istemeden sıraları eski yerine taşımaya yardım etti. Murat Bey: \"<en>Thank you, Selin.</en>\" Selin: \"<en>{U6-057|My pleasure}.</en>\""
  - id: s18
    text: "Kapıda Kaan, Duru'yu durdurdu: \"<en>Thanks for finding the way in the forest, Duru. Really.</en>\" Duru: \"<en>{U6-057|My pleasure}. Now let me sleep.</en>\""
  - id: s19
    text: "Bora da Elif'e döndü: \"<en>Thanks for singing at the campfire every night. It was {U6-034|the best} part of the camp.</en>\" Elif: \"<en>{U6-057|My pleasure}! Next time, you play the drums!</en>\""
  - id: s20
    text: "Ece, Kaan'ın omzuna dokundu: \"<en>Don't worry, Kaan. I'm {U1-093|understanding}. I'll call you at nine on Saturday morning. And at nine-fifteen. And at nine-thirty.</en>\""
  - id: s21
    text: "O akşam Ece'nin defterinde yepyeni bir sayfa vardı: \"<en>İzmir Tour – it {U6-056|takes place} on Saturday at 10.00 – DON'T BE LATE (Kaan!)</en>\" Altı ise bomboştu: misafirler kimdi, hangi ülkeden geliyorlardı? Murat Bey bunu henüz söylememişti."

