story:
  - id: s01
    text: "Çarşamba, son ders. Murat Bey tahtaya kocaman harflerle yazdı: \"<en>YOUR GUIDE: FIVE RULES FOR A {U5-011|SAFE} INTERNET</en>\""
  - id: s02
    text: "Murat Bey: \"<en>Five rules. Short and clear. You have forty minutes. Writing rules is easy, but it's hard to {U5-008|obey} them. Remember yesterday's snow!</en>\" Kaan sırasında biraz küçüldü."
  - id: s03
    text: "Ekipler masaları birleştirdi. Duru defterini açmadan sordu: \"<en>Five? Is that {U5-043|necessary}? Three rules are enough. Then we can rest.</en>\""
  - id: s04
    text: "Murat Bey arkadan geçerken: \"<en>Five, Duru. It's {U5-043|necessary}.</en>\" Duru, kanepesini özleyerek kalemi eline aldı."
  - id: s05
    text: "Bora kâğıdı kendine çekti: \"<en>Rule one is mine. I learned it the hard way: never accept a {U5-005|friend request} from a {U5-013|stranger}.</en>\" Sesi bu kez hiç şakacı değildi."
  - id: s06
    text: "Bora devam etti: \"<en>Rule two: don't {U5-017|click} on strange links. A 100% {U5-049|discount}? {U5-003|Avoid} it! A famous {U5-031|influencer} with a free drum set? Probably not real.</en>\""
  - id: s07
    text: "Duru, birden ciddileşerek ekledi: \"<en>Rule three: never write your {U5-010|personal information} on a website you don't know. And {U1-055|keep your password secret}.</en>\""
  - id: s08
    text: "Bora: \"<en>And if there's a problem, change your password. My mum and I changed mine in five minutes. It's {U5-043|necessary}, believe me.</en>\""
  - id: s09
    text: "Yan masada Ece'nin ekibi de işe koyulmuştu. Ece: \"<en>Our first rule: {U5-008|obey the rules} of every website. Selin, you write it. You're the queen of rules.</en>\""
  - id: s10
    text: "Selin: \"<en>Of course. A good teenager {U2-084|follows the rules}. And a good Internet user {U5-008|obeys} them too.</en>\""
  - id: s11
    text: "Elif'in kaşları çatıldı: \"<en>Rule two: {U5-004|copyright}. Remember our concert video? Someone uploaded it, and nobody asked us first!</en>\""
  - id: s12
    text: "Ece: \"<en>Exactly. Don't post other people's photos or videos without asking. Songs and videos have {U5-004|copyright}: they belong to the people who made them.</en>\""
  - id: s13
    text: "Kaan masasından döndü: \"<en>Wait… so I can't put Luna Ray's new song in my basketball video?</en>\" Elif: \"<en>Not without permission. {U5-004|Copyright}, Kaan!</en>\""
  - id: s14
    text: "Selin: \"<en>Rule three: {U5-003|avoid} using dangerous websites. Use only {U5-011|safe} ones.</en>\""
  - id: s15
    text: "Duru kendinden emin başını salladı: \"<en>I'm good at this. I {U5-003|avoid} a lot of things. Running. Stairs. Monday mornings.</en>\" Kaan: \"<en>And answering the phone!</en>\""
  - id: s16
    text: "Tam o sırada Elif, Kaan'ın masasına küçük bir not uzattı: \"<en>{U5-061|OMG}, our guide is great! Need help? Tell me {U5-061|ASAP}. {U5-061|CU} after school!</en>\""
  - id: s17
    text: "Kaan notu üç kez okudu: \"<en>OK… {U5-058|What does ASAP stand for}?</en>\" Bora: \"<en>Always Sandwiches And Pizza?</en>\""
  - id: s18
    text: "Selin yan masadan, kaşı havada: \"<en>No, Bora. It stands for '{U1-094|as soon as possible}'. And {U5-061|CU} means 'see you'.</en>\""
  - id: s19
    text: "Duru: \"<en>And {U5-061|BTW}? {U5-058|Can you explain} that one too?</en>\" Selin: \"<en>'{U5-053|By the way}.' Kaan writes it in every message.</en>\""
  - id: s20
    text: "Murat Bey bu sohbeti duymuştu tabii. Gülümsedi: \"<en>Good. That can be one of your rules: if you don't understand a message, ask. '{U5-058|What does it mean}?' is a smart question.</en>\""
  - id: s21
    text: "Kaan dördüncü kuralı kendisi yazdı, harf harf: \"<en>Rule four: think before you share. I learned it last night.</en>\""
  - id: s22
    text: "Sonra havalı görünmek için son bir soru sordu: \"<en>Murat Bey, one more question. What does SNS stand for? I see it everywhere.</en>\""
  - id: s23
    text: "Duru hiç düşünmeden: \"<en>Sleepy Nap Society. My club.</en>\" Bütün sınıf güldü; Murat Bey de."
  - id: s24
    text: "Murat Bey: \"<en>Nice try, Duru. Kaan, that's tomorrow's lesson.</en>\" Zil çaldığında iki ekibin rehberinin de başlığı hazırdı."
  - id: s25
    text: "Ece'nin ekibi: \"<en>Stay {U5-011|safe}, stay smart.</en>\" Kaan'ın ekibi, Bora'nın önerisiyle: \"<en>Five Rules from a Boy Who {U5-017|Clicked}.</en>\""
  - id: s26
    text: "Akşam Ece sınıf grubuna bir duyuru attı: \"<en>Tomorrow at 9 p.m.: Elif's first solo song on our channel! 🎤</en>\" Elif'in cevabı üç ünlem işaretiydi."

