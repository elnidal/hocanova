tips:
  - type: tuzak
    refs: [U5-061]
    text: "LOL bazı kelime listelerinde \"Lots of love\" diye geçer; bugün yaygın anlamı \"laughing out loud\" (çok komik, gülüyorum). Sınavda kısaltmalar çoğunlukla stand for ile sorulur: What does BTW stand for?"
  - type: mini_dilbilgisi
    refs: [U5-003]
    text: "avoid + V-ing: Avoid using dangerous sites. \"Avoid to use\" yanlıştır. Aynı kural Ü2'deki enjoy, don't mind, can't stand için de geçerli."
  - type: kelime_ailesi
    refs: [U5-011, U5-043, U5-008, U2-084]
    text: "safe (sıfat) → safety (isim) → unsafe (zıt). necessary ↔ unnecessary. obey the rules = follow the rules: ikisi de aynı anlama gelir, LGS'de birbirinin yerine sorulabilir."
  - type: lgs_taktigi
    refs: [U5-058]
    text: "What does X stand for? sorusunda yardımcı fiil does olduğu için stand -s almaz. Cevapta ise -s gelir: It stands for \"as soon as possible\". \"What is SNS stand for?\" yanlıştır."

