title: "Duru ile Elif'in posteri"
est_minutes: 10
characters: [Duru, Elif, Ece, Selin, Kaan, Bora, Murat Bey]
new_items: [U2-019, U2-020, U2-021, U2-022, U2-023, U2-024]

story:
  - id: s01
    text: "Perşembe sabahı Duru ile Elif sınıfa ellerinde rengârenk bir posterle girdi."
  - id: s02
    text: "Posterde kocaman harflerle yazıyordu: \"<en>NEW {U2-019|BAND}! We need {U2-020|members}! 🎸🎤</en>\""
  - id: s03
    text: "Elif: \"<en>Duru plays the guitar and I sing. Now we need a drummer and a keyboard player.</en>\""
  - id: s04
    text: "Kaan posteri okur okumaz atıldı: \"<en>A {U2-019|band}? Cool! Can I {U1-015|join}? I can play… the triangle.</en>\""
  - id: s05
    text: "Duru: \"<en>Every {U2-020|member} must come to practice on time, Kaan.</en>\" Kaan sessizce bir adım geri çekildi."
  - id: s06
    text: "Selin: \"<en>What {U2-021|genre} of music will you play?</en>\""
  - id: s07
    text: "Sorun tam da burada başladı. Duru: \"<en>{U2-022|Rock music}, of course. Loud guitars!</en>\""
  - id: s08
    text: "Elif: \"<en>{U2-023|Pop music}! People can dance to it. {U2-006|What about you}, Ece?</en>\""
  - id: s09
    text: "Ece: \"<en>{U2-005|In my opinion}, the {U2-021|genre} isn't important. The name is important! And the {U2-019|band} T-shirts!</en>\""
  - id: s10
    text: "Her soruya \"<en>{U1-014|It doesn't matter}</en>\" diyen Duru bu kez geri adım atmadı: \"<en>No {U2-023|pop music}. Only {U2-022|rock music}!</en>\""
  - id: s11
    text: "Elif: \"<en>Duru, you are so {U1-091|stubborn}!</en>\" Duru: \"<en>Thank you.</en>\""
  - id: s12
    text: "Bora araya girdi: \"<en>Why not {U2-024|jazz}? My grandpa listens to {U2-024|jazz} every evening. It's very relaxing.</en>\""
  - id: s13
    text: "Duru ile Elif aynı anda döndü: \"<en>{U2-024|Jazz}?!</en>\" İkisinin de yüzü buruşmuştu."
  - id: s14
    text: "Kaan: \"<en>Look! You have the {U1-042|same opinion} now: nobody wants {U2-024|jazz}!</en>\" Bora omuz silkti: \"<en>My grandpa will be sad.</en>\""
  - id: s15
    text: "Selin ortayı bulan bir öneri getirdi: \"<en>Why don't you mix them? {U2-023|Pop music} with {U2-022|rock} guitars. Lots of {U2-019|bands} do that.</en>\""
  - id: s16
    text: "Elif: \"<en>Pop-rock! I love it!</en>\" Duru biraz düşündü: \"<en>OK… but our first song is pure {U2-022|rock}.</en>\""
  - id: s17
    text: "Murat Bey kapıdan başını uzattı: \"<en>A {U2-019|band}? That's a good question for your {U2-003|survey} too: ask {U2-001|teenagers} about their favourite {U2-021|genre}.</en>\""
  - id: s18
    text: "Ece hemen defterine not aldı: \"<en>New question: What do you listen to in your {U2-002|free time}?</en>\""
  - id: s19
    text: "Teneffüste posterin altına isimler yazılmaya başladı. Bora: \"<en>I can't play anything, but I can be your photographer. Am I a {U2-020|member} now?</en>\""
  - id: s20
    text: "Duru: \"<en>Photographer {U2-020|member}. OK.</en>\" Elif: \"<en>First practice: Saturday, at Duru's house. Fıstık is our first fan!</en>\""
  - id: s21
    text: "Kaan: \"<en>Can I {U2-004|hang out} with you at the practice? I won't bring the triangle.</en>\""
  - id: s22
    text: "Selin: \"<en>{U2-005|I believe} you'll be late, Kaan.</en>\" Kaan: \"<en>Me? Late? Never!</en>\" Selin sadece kaşını kaldırdı."

scene:
  - id: c01
    speaker: Elif
    text: "<en>Our band needs new members! Who can play the drums?</en>"
  - id: c02
    speaker: Selin
    text: "<en>What genre will you play? Rock music or pop music?</en>"
  - id: c03
    speaker: Duru
    text: "<en>Rock music! Only rock!</en>"
  - id: c04
    speaker: Bora
    text: "<en>What about jazz? My grandpa loves it. 🎷</en>"

steps:
  - item: U2-019
    sezdir:
      id: u2d04-019-z
      type: meaning
      context: s02
      prompt: "Hikâyede \"band\" ne anlama geliyordu?"
      options: ["müzik grubu", "yara bandı", "konser bileti", "şarkı sözü"]
      answer: 0
    kullan:
      id: u2d04-019-k
      type: gap_fill
      prompt: "Boşluğa uygun olanı seç."
      stem: "<en>Duru plays the guitar in a ________ with three friends. They practise every Saturday.</en>"
      options: ["band", "team", "film", "shop"]
      answer: 0
      explain: "Müzik yapan grup = band. Spor yapan grup = team."
    sina:
      id: u2d04-019-s
      type: message_infer
      lgs_like: true
      prompt: "<en>According to the poster, which of the following is NOT correct?</en>"
      stem: "<en>NEW BAND – THE SLEEPY CATS\nWe need: a drummer and a keyboard player\nPractice: Saturdays, 2 p.m., at Duru's house\nInterested? Talk to Elif!</en>"
      options: ["The band needs a guitar player.", "The band practises on Saturdays.", "You should talk to Elif.", "They practise at Duru's house."]
      answer: 0
      explain: "Posterde sadece davulcu ve klavyeci aranıyor; gitarcı (Duru) zaten var."
      why_wrong:
        - "Bu bilgi doğru: posterde \"Practice: Saturdays\" yazıyor."
        - "Bu bilgi doğru: \"Interested? Talk to Elif!\" yazıyor."
        - "Bu bilgi doğru: \"at Duru's house\" yazıyor. Soru doğru OLMAYANI istiyor."
