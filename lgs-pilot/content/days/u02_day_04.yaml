tips:
  - type: tuzak
    refs: [U2-019]
    text: "band ≠ bant! Yara bandı İngilizcede plaster'dır. band = müzik grubu. Spor takımı ise team: \"a rock band\" ama \"a football team\"."
  - type: tuzak
    refs: [U2-021]
    text: "genre yerine type da kullanılır: \"What type of music do you like?\" Ama type fiil olarak \"klavyede yazmak\" demektir: \"Type your name here.\""
  - type: kelime_ailesi
    refs: [U2-023]
    text: "pop, popular (popüler, sevilen) kelimesinin kısaltmasıdır. pop music = en çok sevilen, radyoda sık çalan şarkılar."
  - type: ilginc_bilgi
    refs: [U2-024]
    text: "Cazın 1900'lerin başında ABD'nin New Orleans şehrinde doğduğu kabul edilir. Trompetçi Louis Armstrong en ünlü caz müzisyenlerinden biridir."

