story:
  - id: s01
    text: "Cumartesi öğleden sonra, Duru'nun evi. Bugün grubun ilk provası var! Duru gitarını akort ediyor, Elif mikrofonu deniyor. Ece, Selin, Kaan ve Bora seyirci koltuklarında; Fıstık ise kanepede uyuyor."
  - id: s02
    text: "Elif heyecanlı: \"<en>OK, first song! I'm {U2-010|keen on} trying something new today. Ideas?</en>\""
  - id: s03
    text: "Duru: \"<en>Rock, of course! But first, a warm-up: a little {U2-025|classical music}. My mum plays Mozart every morning, and Fıstık sleeps like a baby when he hears it.</en>\""
  - id: s04
    text: "Duru gitarla yavaş, yumuşak bir Mozart parçası çaldı. Fıstık esnedi. Kaan da esnedi."
  - id: s05
    text: "Kaan: \"<en>Nice, but {U2-025|classical music} makes me sleepy too. Something faster, please!</en>\""
  - id: s06
    text: "Selin: \"<en>My grandad is {U2-009|fond of} {U2-026|folk music}. He plays the bağlama every Sunday and sings old songs from his village.</en>\""
  - id: s07
    text: "Elif: \"<en>{U2-026|Folk music}! I know an old song from the Black Sea. Duru, can you play it?</en>\""
  - id: s08
    text: "Duru çalmaya, Elif söylemeye başladı. Bora dayanamadı, kalkıp horon oynamaya çalıştı… ve sehpaya çarptı."
  - id: s09
    text: "Bora yerden doğruldu: \"<en>I {U2-008|enjoy} dancing to {U2-026|folk music}! My dance teacher would be proud.</en>\" Ece: \"<en>Your dance teacher would hide the coffee table!</en>\""
  - id: s10
    text: "Kaan mikrofonu kaptı: \"<en>My turn! I really {U2-007|like} {U2-027|rap}. Listen: 'My name is Kaan, I'm never on time, but every word I say is a rhyme!'</en>\""
  - id: s11
    text: "Kaan avazı çıktığı kadar bağırıyordu. Karşı apartmandaki teyze bile pencereden baktı."
  - id: s12
    text: "Selin ellerini kulaklarına bastırdı: \"<en>Kaan, {U2-027|rap} is fine, but you're so {U2-028|loud}! The microphone is right there!</en>\""
  - id: s13
    text: "O anda Fıstık uyandı ve şarkıya katıldı: Hav! Hav! Hav! Kaan: \"<en>Fıstık, you're a bit {U2-030|annoying} today!</en>\" Duru: \"<en>He's not barking. He's singing backing vocals.</en>\""
  - id: s14
    text: "Ece: \"<en>A dog, a rapper and a guitar… It's really {U2-029|noisy} in here!</en>\""
  - id: s15
    text: "Ve tam o sırada duvarın öbür tarafından bir matkap sesi yükseldi: Vıııızzz! Komşu Ahmet Amca yine raf takıyordu."
  - id: s16
    text: "Elif: \"<en>Oh no, the drill again! That sound is so {U2-030|annoying}!</en>\""
  - id: s17
    text: "Duru: \"<en>Every Saturday: drill, dog, Kaan. This is the {U2-029|noisiest} house in the city.</en>\""
  - id: s18
    text: "Bora: \"<en>Wait, a {U2-029|noisy} drill has a good rhythm. Kaan, rap with it!</en>\" Kaan matkabın ritmine uydu ve yeni bir şarkı uydurdu. Fıstık eşlik etti."
  - id: s19
    text: "Selin artık pes etti: \"<en>Sorry, guys, but I {U2-012|dislike} {U2-028|loud} songs. My ears hurt!</en>\""
  - id: s20
    text: "Duru ise omuz silkti: \"<en>I {U2-011|don't mind} playing with a drill. I'm a {U1-079|laid-back} musician.</en>\""
  - id: s21
    text: "Elif kapıya gidip Ahmet Amca'ya kibarca rica etti. Ahmet Amca güldü: \"<en>Sorry, kids! I know, the drill is {U2-030|annoying}. I'll stop. I {U2-007|like} music too, you know.</en>\""
  - id: s22
    text: "Ahmet Amca: \"<en>When I was your age, I was in a {U2-019|band}! We played {U2-026|folk music} – with guitars, not with drills!</en>\""
  - id: s23
    text: "Elif: \"<en>Thank you for being so {U1-085|patient} with us, Mr Ahmet!</en>\""
  - id: s24
    text: "Sonunda ev sessizleşti. Duru ve Elif, Ahmet Amca'nın gençliğinden kalma o eski şarkıyı yavaşça çaldı. Fıstık bile sustu."
  - id: s25
    text: "Ece alkışladı: \"<en>{U1-022|Sounds great}! That's our first song!</en>\""
  - id: s26
    text: "Kaan: \"<en>And the second song is {U2-027|rap}. But not {U2-028|loud}, I promise!</en>\" Selin: \"<en>Kaan, you can't do quiet!</en>\""
  - id: s27
    text: "Duru gitarını kılıfına koydu: \"<en>Next time, a little {U2-025|classical music} at the end. Fıstık needs his sleep.</en>\""

scene:
  - id: c01
    speaker: Elif
    text: "<en>Thanks for coming to our first practice! Which genre should we play next time?</en>"
  - id: c02
    speaker: Selin
    text: "<en>Folk music or classical music, please. Something soft!</en>"
  - id: c03
    speaker: Kaan
    text: "<en>Rap! But OK, not too loud.</en>"
  - id: c04
    speaker: Duru
    text: "<en>Fine. But the drill next door is still annoying. Our street is so noisy on Saturdays!</en>"

