tips:
  - type: tuzak
    refs: [U2-028, U2-029]
    text: "loud ve noisy ikisi de sesle ilgili ama farklı: loud = sesin kendisi yüksek (a loud voice, loud music, \"Turn it down, it's too loud!\"). noisy = bir yer ya da şey sürekli gürültü yapıyor (a noisy street, a noisy classroom, noisy neighbours)."
  - type: tuzak
    refs: [U2-030, U1-095]
    text: "annoying = sinir bozan şey: \"The drill is annoying.\" Sinirlenen kişi için -ed gelir: annoyed. boring (sıkıcı) / bored (sıkılmış) ile aynı mantık. annoyed'ı yakında ayrıca göreceğiz!"
  - type: lgs_taktigi
    refs: [U2-025, U2-026, U2-027]
    text: "LGS'de tür adı çoğu zaman ipuçlarıyla sorulur: orchestra, Mozart, violin → classical music · bağlama, traditional, village songs → folk music · rhymes, beat, fast words → rap."
  - type: ilginc_bilgi
    refs: [U2-027]
    text: "rap, 1970'lerde New York'un Bronx semtinde doğdu. Partilerde DJ'ler müziği çalarken MC'ler ritmin üzerine kafiyeli sözler söylüyordu."

coach:
  start: "İlk prova günü! Gitar hazır, mikrofon hazır, kanepede bir köpek… Ne ters gidebilir ki? 🎸🐶"
