  - type: kelime_ailesi
    refs: [U6-001, U6-011]
    text: "adventure (macera) → adventurer (maceracı kişi) → adventurous (maceraperest). danger (tehlike, isim) → dangerous (tehlikeli, sıfat)."
  - type: lgs_taktigi
    refs: [U6-038]
    text: "What kind of / What type of …? sorusunun cevabı bir türdür: 'Pop music', 'Extreme sports'. Cevapta sayı, saat ya da yer varsa soru başka bir şeydir (How many, When, Where)."

