story:
  - id: s01
    text: "Pazartesi sabahı Murat Bey sınıfa elinde rengârenk bir broşür destesiyle girdi. Kapakta bir göl, bir orman ve kocaman harflerle bir kamp adı vardı."
  - id: s02
    text: "Murat Bey: \"<en>Spring {U6-001|Adventure} Camp! Two days in the forest, next to a lake. Your parents bought the {U5-060|round-trip} bus tickets online last week.</en>\""
  - id: s03
    text: "Kaan broşürü daha masaya değmeden kaptı: \"<en>A climbing wall! A zip-line! A night walk! This is the {U6-001|adventure} of the year!</en>\""
  - id: s04
    text: "Elif çantasından en sevdiği gençlik dergisini çıkarıp ortadaki sayfayı açtı: \"<en>Perfect timing! There's a quiz in Teen Wave: 'Are you an {U6-003|adrenaline seeker}?' Ten questions. Let's do it!</en>\""
  - id: s05
    text: "Elif ilk soruyu yarışma sunucusu gibi okudu: \"<en>Question one: {U6-038|What kind of} holiday do you like? A: a quiet beach. B: {U6-002|extreme sports} in the mountains.</en>\""
  - id: s06
    text: "Kaan soru bitmeden cevapladı: \"<en>B! Always B! I love {U6-011|danger}!</en>\" Selin yalnızca kaşını kaldırdı."
  - id: s07
    text: "Elif: \"<en>Question two: you try something new. Is a new {U6-027|experience} fun or scary for you?</en>\" Kaan: \"<en>Fun! Every new {U6-027|experience} is fun!</en>\""
  - id: s08
    text: "Selin kalemini düzgünce masaya bıraktı: \"<en>Scary. I like plans. Surprises are not in my plans.</en>\""
  - id: s09
    text: "On soru bitti, puanlar toplandı. Elif dergiyi havaya kaldırdı: \"<en>Kaan: ten out of ten! You're a real {U6-003|adrenaline seeker}!</en>\""
  - id: s10
    text: "Selin: \"<en>Two out of ten. I love plans.</en>\" Ece: \"<en>Four for me. I'm very {U6-001|adventurous}… on paper.</en>\""
  - id: s11
    text: "Bora puanını söylemeden önce biraz bekledi: \"<en>Five. I love {U6-002|extreme sports}… on TV. With snacks.</en>\""
  - id: s12
    text: "Herkes Duru'ya döndü. Duru gözlerini açmadan: \"<en>Zero. Is sleeping an {U6-002|extreme sport}?</en>\" Kaan: \"<en>Duru, you're too {U1-079|laid-back} for this quiz!</en>\""
  - id: s13
    text: "Murat Bey broşür dağıtmayı bıraktı: \"<en>Wait a minute. Kaan, is your answer a good answer for camp? {U6-011|Dangerous} things are not fun at a school camp.</en>\""
  - id: s14
    text: "Murat Bey: \"<en>At our camp, an adult is always with you, and everybody {U2-084|follows the rules}. No exceptions.</en>\""
  - id: s15
    text: "Kaan: \"<en>But a little {U6-011|danger} is {U1-096|exciting}!</en>\" Murat Bey: \"<en>The zip-line is {U1-096|exciting}. {U6-011|Danger} is not.</en>\""
  - id: s16
    text: "Ece plan defterini çoktan açmıştı bile: \"<en>OK, team. {U6-038|What type of} activity do you want at camp? I'm making a list.</en>\""
  - id: s17
    text: "Cevaplar yağmur gibi geldi. Kaan: \"<en>Zip-line!</en>\" Elif: \"<en>Singing by the campfire!</en>\" Bora: \"<en>Anything with no bugs.</en>\""
  - id: s18
    text: "Duru tek kelime söyledi: \"<en>Hammock.</en>\" Ece bunu da ciddi ciddi listeye yazdı."
  - id: s19
    text: "Murat Bey, Selin'in yüzündeki ifadeyi görünce gülümsedi: \"<en>Don't worry, Selin. I'm {U6-027|experienced} at camps. This is my tenth one. And the camp team is very {U6-027|experienced} too.</en>\""
  - id: s20
    text: "Selin: \"<en>Thank you. But I'm totally {U6-027|inexperienced}. I never sleep in a tent.</en>\" Bora: \"<en>Me neither. Tents have bugs.</en>\""
  - id: s21
    text: "Kaan hayal kurmaya başlamıştı bile: \"<en>{U6-038|What kind of} music is good for a night walk? Fast music! Like me!</en>\""
  - id: s22
    text: "Selin saatine baktı: \"<en>The bus leaves at seven a.m., Kaan. Seven.</en>\" Kaan: \"<en>Me? Late? Never! I'm an {U6-003|adrenaline seeker}!</en>\" Selin: \"<en>Being late isn't an {U6-001|adventure}, Kaan.</en>\""
  - id: s23
    text: "O akşam Ece broşürle dergiyi yan yana koydu. Dergideki bir fotoğrafta biri köprüden aşağı atlıyordu. Ece defterine yeni bir sayfa açıp en üste yazdı: \"<en>Fun? Difficulty? {U6-011|Danger}?</en>\" Yarın tahtaya bir tablo çizecekti."

scene:
