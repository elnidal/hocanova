tips:
  - type: tuzak
    refs: [U5-015]
    text: "broken sadece \"kırık\" (kırık bardak, kırık kol) değildir. İnternet, telefon, kulaklık gibi şeyler için \"bozuk, çalışmıyor\" demektir: My internet is broken = It isn't working properly."
  - type: tuzak
    refs: [U5-023]
    text: "Türkçede hem bilgisayarı hem kapıyı \"açarız\". İngilizcede elektrikle çalışan şeyler turn on / turn off ile açılıp kapanır; kapı ve pencere için open / close kullanılır. \"It's off.\" = Kapalı."
  - type: tuzak
    refs: [U5-057, U1-083]
    text: "Ünite 1'deki mean bir sıfattı: cimri, kaba (Don't be mean!). What do you mean? sorusundaki mean ise fiildir: demek istemek, kastetmek. do/does ile soru kuruluyorsa fiildir."
  - type: tuzak
    refs: [U5-059]
    text: "Why don't we…? olumsuz bir soru gibi görünür ama bir öneridir (Let's… ile aynı). LGS diyaloğunda cevabı 'Because…' olmaz; 'Sure! / Great idea!' ya da 'Sorry, I can't…' olur."

coach:
  start: "Ece saat sekizde görüntülü toplantı istiyor ama Bora gelemiyor. Kedi mi suçlu, modem mi? Hadi bakalım 🕵️"
  end_good: "Harika! Duru gibi sakin, adım adım çözdün. Modem yeşil, sen de yeşilsin ✅"
  end_mixed: "Fena değil! {weak} biraz cızırdadı. Fişi yerine tak, yarın bir tur daha deneriz 🔌"

