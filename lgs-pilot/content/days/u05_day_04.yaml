story:
  - id: s01
    text: "Perşembe akşamı, saat yediyi on geçiyordu. Ece plan defterini açmış, kanalın ikinci videosu için on iki maddelik bir liste hazırlamıştı. Liste hazırdı; ekip değil."
  - id: s02
    text: "Ece grubun sohbetine yazdı: \"<en>Team, {U5-059|why don't we} {U2-055|chat online} at eight? A video call, fifteen minutes. We need a plan for video number two!</en>\""
  - id: s03
    text: "Elif: \"<en>Sure! Pamuk is coming too.</en>\" Kaan: \"<en>Yes! I'm always {U5-020|online} anyway. Only one hour {U5-044|per app}, remember?</en>\""
  - id: s04
    text: "Duru'nun cevabı tek kelimeydi: \"<en>Sofa.</en>\" Ece bunu \"evet\" saydı. Sonra Bora'dan, telefonunun son birkaç megabaytıyla gönderilmiş bir mesaj geldi: \"<en>{U1-021|I'm sorry, I can't}. My internet is {U5-015|broken}.</en>\""
  - id: s05
    text: "Grupta üç saniyelik bir sessizlik oldu. Herkes Bora'nın meşhur \"kedim hasta\" günlerini hatırladı. Kaan: \"<en>Is this another {U1-007|excuse}? How's your cat? 😏</en>\""
  - id: s06
    text: "Bora: \"<en>I don't have a cat! And this isn't an {U1-007|excuse}. The internet is really {U5-015|broken}. Nothing opens!</en>\""
  - id: s07
    text: "Ece: \"<en>{U5-057|What do you mean}, Bora? {U5-057|Do you mean} the internet {U4-003|connection}? Or is your laptop {U5-015|broken}?</en>\""
  - id: s08
    text: "Bora: \"<en>The laptop is OK, I think. But my drum videos aren't {U5-026|working properly}. They stop, start, stop… and now, nothing.</en>\""
  - id: s09
    text: "Tam o sırada Duru gruba iki kelime yazdı: \"<en>Calling Bora.</en>\" Bora'nın telefonu çaldı. Kaan grupta çığlık attı: \"<en>Duru is calling someone? With her voice?!</en>\""
  - id: s10
    text: "Duru kanepesinden kalkmadan, her zamanki sakin sesiyle konuştu: \"<en>Don't panic. We'll do it together, step by step. First question: is the modem {U5-023|turned on}? Can you see any lights?</en>\""
  - id: s11
    text: "Bora modemin başına koştu: \"<en>Lights? Nothing. It's dead.</en>\" Duru: \"<en>{U5-057|Do you mean} there are no lights at all? Not even a small one?</en>\""
  - id: s12
    text: "Duru: \"<en>Maybe it's just {U5-023|off}. Now look at your laptop, bottom right. Is there a {U4-003|connection} sign? Does it say {U5-020|online} or {U5-020|offline}?</en>\""
  - id: s13
    text: "Bora: \"<en>It says '{U5-020|Offline}'. In red. Like the end of a sad film.</en>\""
  - id: s14
    text: "Grup sohbetindeki ekip de boş durmuyordu. Selin: \"<en>Look on the bright side, Bora. The class {U5-037|average} is three hours {U5-044|a day}. Tonight you're the perfect student.</en>\""
  - id: s15
    text: "Kaan: \"<en>A whole evening {U5-020|offline}? I can't do that. I'm not an {U5-036|addict}… I just love notifications.</en>\""
  - id: s16
    text: "Ece: \"<en>Checking your phone every five minutes is a {U5-040|habit}, Kaan. A bad one.</en>\" Kaan telefonuna baktı, sonra yine baktı."
  - id: s17
    text: "Duru ise Bora'yı oyalıyordu: \"<en>While you look, a survey question. {U5-047|What do you use the Internet for} at night?</en>\" Bora: \"<en>Drum videos. My mum says our internet {U5-045|usage} is all drums.</en>\""
  - id: s18
    text: "Duru: \"<en>Modems don't often break. Usually they just don't {U5-026|work properly} for a minute. Follow the cable from the modem to the wall.</en>\""
  - id: s19
    text: "Bora kablonun peşinden koltuğun arkasına süründü ve donup kaldı. Prizde modemin fişi yoktu. Onun yerinde Bora'nın kendi telefon şarj aleti duruyordu."
  - id: s20
    text: "Bora: \"<en>Er… guys. I found the problem. It's me.</en>\" Kaan: \"<en>{U5-057|What do you mean}, 'me'?</en>\" Bora: \"<en>At six I pulled out the modem's plug to charge my phone. I {U5-023|turned off} the internet myself.</en>\""
  - id: s21
    text: "Kaan: \"<en>Maybe your cat did it!</en>\" Duru: \"<en>He doesn't have a cat. And Fıstık is here, asleep on my sofa. So, no.</en>\""
  - id: s22
    text: "Bora fişi yerine taktı. Modemin ışıkları teker teker yeşile döndü, laptoptaki kırmızı yazı kayboldu: \"<en>{U5-020|Online}! Everything is {U5-026|working properly} again!</en>\""
  - id: s23
    text: "Saat tam sekizde Bora görüntülü görüşmedeydi, saçları koltuk arkasının tozuyla bembeyaz. Ece listesine on üçüncü maddeyi ekledi: \"<en>13. Check the plug first.</en>\""
  - id: s24
    text: "Elif: \"<en>Duru, you're amazing! {U5-059|Why don't we} call you 'Doctor Modem'?</en>\""
  - id: s25
    text: "Duru esnedi: \"<en>{U5-059|Why don't we} start the meeting? It's eight o'clock. I'm sleepy.</en>\""
  - id: s26
    text: "Görüşme bitmek üzereyken Bora'nın telefonunda yeni bir simge parladı: profil fotoğrafında altın bir davul seti, altında \"DrumKing_Official\" adı. Bora'nın gözleri davul seti kadar parladı, ama simgeye dokunmadı. Henüz."

scene:
  - id: c01
    speaker: Ece
    text: "<en>Why don't we chat online at eight?</en>"
