tips:
  - type: tuzak
    refs: [U1-083]
    text: "mean'in iki anlamı var: \"What does it mean?\" = ne anlama geliyor? ama \"Don't be mean!\" = kaba/cimri olma! LGS bu ikisini karıştırmanı bekler."
  - type: tuzak
    refs: [U1-071]
    text: "fair = adil (\"That's not fair!\") ama book fair = kitap fuarı, science fair = bilim fuarı. Yanında hangi kelime var, ona bak."
  - type: ilginc_bilgi
    refs: [U1-079]
    text: "laid-back kelimesi kelimesine \"arkaya yaslanmış\" demek. Rahat insanı gözünün önüne getir: koltukta geriye yaslanmış, hiçbir şeyi dert etmiyor."
  - type: mini_dilbilgisi
    refs: [U1-097, U1-099]
    text: "full = tok, stuffed = tıka basa tok. Yani stuffed, full'ün abartılı hali. \"I'm full\" kibar, \"I'm stuffed\" daha gündelik."

