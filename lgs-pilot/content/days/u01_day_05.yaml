story:
  - id: s01
    text: "Pastadan sonra herkes salona dağıldı."
  - id: s02
    text: "Duru yine en sevdiği yeri bulmuştu: köşedeki puf. Dünya yansa umurunda değildi. Kaan'ın deyişiyle: \"<en>Duru is the most {U1-079|laid-back} person in the world.</en>\""
  - id: s03
    text: "Sınav haftasında bile Duru'yu telaşlı gören olmamıştı. Selin güldü: \"<en>Exams? Duru doesn't worry. She's so {U1-079|laid-back}!</en>\""
  - id: s04
    text: "Kaan ise tam tersiydi: odaya giren herkesle tanıştı, Elif'e okulu anlattı, Ece'nin babasıyla futbol konuştu."
  - id: s05
    text: "Ece'nin annesi şaşırdı: \"<en>Kaan talks to everyone! He is very {U1-084|outgoing}.</en>\""
  - id: s06
    text: "Elif de Ece'ye fısıldadı: \"<en>Your friend Kaan is so {U1-084|outgoing}. He knows everyone now!</en>\""
  - id: s07
    text: "Bora içini çekti: \"<en>He's {U1-084|outgoing}, and I'm… shy.</en>\""
  - id: s08
    text: "Partinin tek sorunu Ece'nin kuzeni Ege'ydi."
  - id: s09
    text: "Ege kendi cips paketine kimseyi yaklaştırmıyor, bir taneyi bile paylaşmıyordu. Kaan homurdandı: \"<en>Why is he so {U1-083|mean}?</en>\""
  - id: s10
    text: "Kaan bir oyun önerdi: \"<en>{U1-008|How about} a dance contest?</en>\" Herkes bağırdı: \"<en>{U1-022|Sounds fun}!</en>\""
  - id: s11
    text: "Ege burun kıvırdı: \"<en>No, thanks. Dancing is for babies.</en>\" Selin üsteledi: \"<en>Why do you always {U1-019|refuse}? Come on!</en>\""
  - id: s12
    text: "Ege bu kez Bora'nın dansına güldü: \"<en>You dance like a chicken!</en>\" Selin kaşlarını çattı: \"<en>Don't be {U1-083|mean}, Ege. That's not nice.</en>\""
  - id: s13
    text: "Yarışmanın hakemi grubun en {U1-079|LAID-BACK} üyesi Duru'ydu; puftan hiç kalkmadan puan veriyordu."
  - id: s14
    text: "Ege gizlice puan kâğıdına kendi adını yazdı. Elif gördü: \"<en>Hey! That's not {U1-071|fair}!</en>\""
  - id: s15
    text: "Duru gözlerini açtı: \"<en>A judge must be {U1-071|fair}. Ege, you didn't even dance!</en>\""
  - id: s16
    text: "Ege kıvırmaya çalıştı: \"<en>{U1-021|Sorry, I can't} dance. My leg hurts.</en>\" Kaan güldü: \"<en>Another {U1-007|excuse}! Bora, he took your job!</en>\""
  - id: s17
    text: "Sonunda puanlar {U1-071|FAIR} bir şekilde sayıldı ve birinci… Bora oldu! Tavuk dansı herkesi büyülemişti."
  - id: s18
    text: "Pastanın son dilimleri de bitti. Kaan karnını tuttu: \"<en>I'm so {U1-097|full}! I can't eat any more.</en>\""
  - id: s19
    text: "Bora üçüncü dilimini bitirmişti: \"<en>I'm not {U1-097|full}. I'm {U1-099|stuffed}!</en>\""
  - id: s20
    text: "Duru puftan zor doğruldu: \"<en>Me too. I'm {U1-099|stuffed}. Wake me up next year.</en>\""
  - id: s21
    text: "Ece'nin annesi bir tabak meyve getirdi ama kimse dokunamadı: \"<en>Are you all {U1-097|full}?</en>\" Hep bir ağızdan: \"<en>Yes! {U1-099|Stuffed}!</en>\""
  - id: s22
    text: "Tam o sırada Ege, elinde cips paketiyle Ece'nin yanına geldi: \"<en>Ece, I want to {U1-002|apologise}. I was {U1-083|mean} today. Do you want some chips?</en>\""
  - id: s23
    text: "Ece gülümsedi: \"<en>{U1-025|Why not}?</en>\" Kaan fısıldadı: \"<en>Chips for everyone? Now that's {U1-071|fair}!</en>\""
  - id: s24
    text: "Işıklar söndü ve duvarda sürpriz video başladı: bütün arkadaşları Ece'ye tek tek mesaj gönderiyordu."
  - id: s25
    text: "Kaan gururla bağırdı: \"<en>See? I {U1-055|kept the secret}!</en>\" Herkes güldü; kimse ona inanmadı."
  - id: s26
    text: "Ece gözleri dolarak herkese baktı: puftan kalkmayan Duru, durmadan konuşan Kaan, tavuk dansıyla Bora, her zaman yanında olan Selin… \"Bu yıl en güzel hediyem sizsiniz,\" dedi."

scene:
  - id: c01
    speaker: Elif
    text: "<en>Kaan is so outgoing. He talked to everyone at the party!</en>"
  - id: c02
    speaker: Selin
    text: "<en>Yes, and Duru is very laid-back. She never worries.</en>"
  - id: c03
    speaker: Elif
    text: "<en>Ege was mean at first, but he apologised. That was nice of him.</en>"
  - id: c04
    speaker: Bora
    text: "<en>I'm stuffed. I ate three pieces of cake!</en>"

