editor:
  z07: {U3-051: BEKLIYOR, U3-057: BEKLIYOR, U3-059: BEKLIYOR}

mini:                     # deneme (Ü3): uzun hikâye yerine her ifadeye kısa Türkçe sahne, hedef ifade İngilizce
  - item: U3-051
    durum: "Süre doldu; Kaan elinde sıcak porsiyonlarla jüri masasına yürüyor."
    lines:
      - { speaker: "Murat Bey", text: "Bir saat bitti! <en>Now {U3-051|serve} your food to the jury.</en>" }
      - { speaker: "Kaan", text: "İlk porsiyon okul müdürüne… dökmeden, dökmeden!" }
  - item: U3-057
    durum: "Ece, kuzeni Ege'nin önüne pastadan bir dilim koyuyor."
    lines:
      - { speaker: "Ece", text: "Buyur Ege. <en>{U3-057|Enjoy your meal}!</en>" }
      - { speaker: "Ege", text: "Teşekkürler! Eleştirmen gözlüğümü takıyorum." }
  - item: U3-059
    durum: "Ege, Bora'nın sütlacından bir kaşık alıyor."
    lines:
      - { speaker: "Ege", text: "Ben sütlaç sevmem ama… bu bambaşka. Kesinlikle {U3-059|worth trying}!" }
      - { speaker: "Nazmiye Teyze", text: "Bence de. Belki kantin menüsüne bile girer!" }
