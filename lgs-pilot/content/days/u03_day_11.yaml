story:
  - id: s01
    text: "Cuma günü okulun konferans salonu bir restorana dönüşmüştü. Sahnenin üstünde kocaman bir pankart asılıydı: \"<en>JUNIOR CHEF – THE FINAL</en>\""
  - id: s02
    text: "Jüri masasında Murat Bey, Nazmiye Teyze ve sürpriz konuk okul müdürü oturuyordu. Nazmiye Teyze'nin elinde bir not defteri vardı; onu kantinde hiç bu kadar ciddi görmemişlerdi."
  - id: s03
    text: "İzleyicilerin en önünde Ece'nin kuzeni Ege, güneş gözlüğüyle kurulmuştu: \"<en>I'm a food critic, you know. I hope nobody serves {U3-017|mashed} potatoes from a packet.</en>\""
  - id: s04
    text: "Murat Bey düdüğü çaldı: \"<en>Teams, you have one hour. Then you {U3-051|serve} your menu to the jury. And remember: no fried food!</en>\""
  - id: s05
    text: "Ece takımının köşesinde Selin kartı okudu: \"<en>{U3-007|Roast} the chicken with lemon juice…</en>\" ve olduğu yerde kaldı. Limon yoktu! Elif dünkü provada hepsini harcamıştı."
  - id: s06
    text: "Selin hayatında ilk kez kartın dışına çıktı ve Elif'in çantasındaki portakalı aldı: \"<en>No lemon? OK. We'll use this {U3-029|fresh} orange. It's not on the card, but I think it works.</en>\" Ece ile Elif birbirine baktı: Bu gerçekten Selin miydi?"
  - id: s07
    text: "Her iki köşede de bir nöbetçi öğretmen fırın ve ocak işinin başındaydı. Kaan takımının köfteleri pişmeye başlamıştı. Bora zamanlayıcıyı Kaan'a uzattı: \"<en>Forty minutes, buddy. The timer is yours.</en>\""
  - id: s08
    text: "Kaan kollarını kavuşturup camın önüne oturdu: \"<en>No problem. I'm {U1-085|patient} now. Very, very {U1-085|patient}.</en>\" Her dakika gözü biraz daha seğiriyordu."
  - id: s09
    text: "Otuz beşinci dakikada eli kapağa uzandı… ve havada durdu. Kaan zil çalana kadar bekledi. Bora ile Duru aynı anda alkışladı: \"<en>Kaan! You waited!</en>\""
  - id: s10
    text: "O arada Ece pastayı tezgâha koydu ve herkes sustu. Pasta yine eğriydi; yine kocaman bir şapkaya benziyordu."
  - id: s11
    text: "Ece bir an pastaya baktı ve ilk kahkahayı kendisi attı: \"<en>It's a hat again! OK, it's our hat now. Our lucky hat!</en>\""
  - id: s12
    text: "Jüri masasına ilk Ece takımı yürüdü. Ece: \"<en>For the {U3-060|main course}, we {U3-051|serve} {U3-007|roast} chicken with {U3-008|steamed} vegetables. Nothing is fried, so it isn't {U3-030|greasy}.</en>\""
  - id: s13
    text: "Selin devam etti: \"<en>And for {U3-055|dessert}, our lucky hat cake with my grandma's {U3-031|homemade} ice cream.</en>\" Elif her parçayı jüriye uzattı: \"<en>{U3-057|Enjoy your meal}!</en>\""
  - id: s14
    text: "Nazmiye Teyze pastadan bir lokma aldı. Uzun bir sessizlik… \"<en>It looks like a hat, but it's {U3-028|delicious}.</en>\""
  - id: s15
    text: "Murat Bey tavuktan bir çatal aldı ve kaşlarını kaldırdı: \"<en>Orange in the chicken? Unusual, but it's {U3-059|worth trying}. Very {U2-076|impressive}, Selin!</en>\""
  - id: s16
    text: "Sıra Kaan takımına geldi. Duru öne çıktı: \"<en>This is İzmir köftesi, a {U3-063|traditional} {U3-056|dish} from our city. Turkish {U3-054|cuisine} needs time and love.</en>\""
  - id: s17
    text: "Bora devam etti: \"<en>We {U3-005|grilled} the peppers and {U3-007|roasted} the potatoes. No frying! And my rice pudding is our {U3-055|dessert}.</en>\""
  - id: s18
    text: "Kaan tepsiyi iki eliyle jüriye uzattı: \"<en>{U3-057|Enjoy your meal}!</en>\" Tam o anda izleyicilerin arasından beyaz bir top fırladı: Pamuk! Ece'nin annesinin kucağından kurtulmuş, jüri masasına koşuyordu."
  - id: s19
    text: "Kaan bir an sendeledi ama tepsiyi basketbol topu gibi havada yakaladı. Tek bir köfte bile düşmedi. Pamuk ise Nazmiye Teyze'nin önüne oturup kuyruğunu salladı."
  - id: s20
    text: "Elif kıpkırmızı koştu: \"<en>Sorry! I think she wants some köfte too. It's {U3-059|worth trying}, right?</en>\" Bütün salon güldü; Nazmiye Teyze bile."
  - id: s21
    text: "Bora sütlaç kasesini Ege'ye uzattı: \"<en>{U3-057|Enjoy your meal}, Mr Critic!</en>\" Ege bir kaşık aldı ve hiçbir şey demedi. Bir kaşık daha aldı. Bir tane daha…"
  - id: s22
    text: "Derken gözlüğünü çıkardı: \"<en>OK… maybe {U3-031|homemade} is {U2-071|pretty} good. It's {U3-059|worth trying}.</en>\" Bora sırıttı: \"<en>That's your third spoon, critic!</en>\""
  - id: s23
    text: "Murat Bey ayağa kalktı: \"<en>And the winners are… both teams! Ece's team gets the Best Flavour award, and Kaan's team gets the Best Teamwork award!</en>\""
  - id: s24
    text: "Nazmiye Teyze defterini kapattı: \"<en>And Bora, I want your rice pudding in my canteen. From Monday, we {U3-051|serve} it every day!</en>\" Bora gülümsedi: \"<en>Leave it to me.</en>\""
  - id: s25
    text: "Kutlamada Duru gitarını, Elif mikrofonu aldı; Bora iki kaşıkla tencerelerde ritim tuttu. Ece her saniyeyi kaydetti ve videoyu paylaştı."
  - id: s26
    text: "Gece videonun altına bir yorum düştü. Parkın karşısındaki pastanenin sahibi yazmıştı: \"<en>Great music! Can your band play at my cake shop? I'll call you this week.</en>\""
  - id: s27
    text: "Duru yorumu okudu ve tek satır yazdı: \"<en>A real concert? I don't mind… if my sofa comes too.</en>\" Ama birkaç hafta sonra yarıyıl tatili başlıyordu ve herkes bir yere dağılacaktı…"

