tips:
  - type: lgs_taktigi
    refs: [U3-051, U3-045]
    text: "Tarif sırası sorularında serve ve enjoy her zaman en sondadır; peel, wash, chop gibi hazırlık fiilleri ise başta. Sıralama sözcüğü yoksa bu mantıkla ilk ve son adımı hemen bul."
  - type: mini_dilbilgisi
    refs: [U3-051]
    text: "serve kalıpları: serve hot (sıcak servis et) · serve cold (soğuk servis et) · serve with rice (pilavla servis et) · This recipe serves four people (Bu tarif dört kişilik)."
  - type: ilginc_bilgi
    refs: [U3-057]
    text: "Enjoy your meal! = Afiyet olsun! Fransızcadan gelen Bon appétit! de aynı anlamda kullanılır. Kibar cevap: \"Thank you!\" ya da masadakilere \"Thanks, you too!\""
  - type: mini_dilbilgisi
    refs: [U3-059]
    text: "worth'ten sonra fiil -ing alır: worth trying (denemeye değer), worth visiting (görmeye değer), worth watching (izlemeye değer). \"worth to try\" yanlıştır."

