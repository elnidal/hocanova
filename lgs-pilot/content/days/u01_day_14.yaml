    type: message_infer
    item: U1-036
    lgs_like: true
    prompt: "<en>What can we say about Elif and Duru?</en>"
    stem: "<en>Elif: Duru and I both love dogs, we both play the guitar and we both hate Mondays!</en>"
    options: ["They have a lot in common.", "They argue a lot.", "They have nothing to do.", "They don't get on well."]
