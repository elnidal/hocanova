    answer: 0
    explain: "Yeniden arkadaş olup tartışmayı bıraktılar: iyi anlaşıyorlar (get on well)."
  - id: d14-r10
    type: gap_fill
    item: U1-029
    prompt: "Boşluğa uygun olanı seç."
    stem: "<en>Ece and Elif ________ on the phone for two hours last night. They talked about everything!</en>"
    options: ["chatted", "refused", "argued", "apologised"]
    answer: 0
    explain: "İki saat telefonda her şeyi konuştular: chatted (sohbet ettiler)."

tips:
  - type: tuzak
    refs: [U1-080]
    text: "\"What is he like?\" = O nasıl biri? (kişiliğini sorar) → \"He's calm and patient.\" Ama \"What does he like?\" = Neyi sever? → \"He likes football.\" \"What does he look like?\" ise dış görünüşü sorar → \"He's tall.\" Üç soru, üç farklı cevap!"
  - type: ilginc_bilgi
    refs: [U1-085]
    text: "patient sıfat olarak \"sabırlı\", isim olarak \"hasta\" demek: \"The doctor has ten patients today.\" İkisi de Latince \"katlanmak, dayanmak\" anlamındaki pati kökünden gelir."
  - type: kelime_ailesi
    refs: [U1-093, U1-085, U1-087]
    text: "understand → understanding (anlayışlı) · patient → patience (sabır) → impatient (sabırsız) · person → personal → personality."
  - type: hafiza_kancasi
    refs: [U1-069]
    text: "\"Calm down!\" = \"Sakin ol!\" Sınavdan önce kendine fısılda: Calm down, I can do it!"

coach:
  start: "Bugün Elif bir dergi testi getirdi. 📖 Bakalım Duru uyuyor mu, yoksa…"
  end_good: "Süper! Artık \"What is he like?\" sorusuna kendinden emin cevap verebilirsin. Hoca Nova'dan sana bir unvan: The Patient Learner! 🏅"
  end_mixed: "{weak} biraz naz yapıyor, çok normal. Yarın yine karşına çıkacak; ikinci buluşmada daha iyi anlaşırsınız. 😉"

notifications:
  morning: "Elif'in dergisinde bir test var. Kaan'ın sonucu herkesi güldürecek! 📖"
  evening: "Duru uyuyor mu, yoksa başka bir şey mi? Cevap bugünkü derste, 10 dakika."
  review: "Tek soru: \"What is he like?\" ile \"What does he like?\" aynı şeyi mi sorar?"

