story:
  - id: s01
    text: "Cumartesi öğleden sonra, Duru'nun evi. Gitar bugün köşede; tezgâhta kocaman bir {U3-038|bowl} duruyor. Duru'nun annesinin tek bir kuralı var: \"<en>The {U3-040|oven} is mine. Everything else is yours!</en>\""
  - id: s02
    text: "Bugünün görevi pizza. Duru'nun annesi parmaklarıyla saydı: \"<en>{U3-046|Flour}, warm water, yeast, salt and olive oil. We {U3-011|combine} them in the {U3-038|bowl} and make the {U3-044|dough}.</en>\""
  - id: s03
    text: "Ama dolaptaki paket boş çıktı. Duru sabah Kaan'a sesli mesaj atmıştı: \"<en>Kaan, on your way, please buy {U3-037|a bunch of} parsley and a big bag of {U3-046|flour}.</en>\""
  - id: s04
    text: "Zil çaldı. Kapıda nefes nefese Kaan duruyordu. Elinde ne maydanoz vardı ne un paketi: kâğıda sarılmış, rengârenk papatyalar!"
  - id: s05
    text: "Kaan: \"<en>Sorry, sorry! I ran all the way. Here you are: {U3-037|a bunch of} flowers!</en>\" Duru papatyaları aldı ve uzun uzun baktı."
  - id: s06
    text: "Duru: \"<en>Kaan. {U3-046|Flour}. F-L-O-U-R. It's white and it's for the {U3-044|dough}. We can't eat daisies.</en>\" Bora: \"<en>Same sound, different shop!</en>\""
  - id: s07
    text: "Duru'nun annesi gülerek papatyaları vazoya koydu, üst raftan yedek paketi indirdi: \"<en>Kaan, you're {U1-075|always in a hurry}. Please listen to voice messages twice!</en>\""
  - id: s08
    text: "Duru'nun annesi her şeyi tarttı, üç arkadaş da sırayla {U3-038|bowl}'a boşalttı. Bora tahta kaşıkla işe girişti: \"<en>Water, yeast, salt… {U3-011|Combine} them slowly, or the {U3-046|flour} will fly everywhere!</en>\""
  - id: s09
    text: "Kaan tabii ki hızlı davrandı. Beyaz bir bulut yükseldi ve Kaan'ın kaşları bembeyaz oldu. Duru: \"<en>Nice. Now you're a snowman.</en>\""
  - id: s10
    text: "Sıra en zor işe geldi. Duru'nun annesi kollarını sıvadı: \"<en>Now {U3-016|knead} the {U3-044|dough} for ten minutes. Push, fold, turn. Push, fold, turn.</en>\""
  - id: s11
    text: "Kaan otuz saniye dayanabildi: \"<en>Ten minutes? I can't {U3-016|knead} for ten minutes! My arms are dead!</en>\""
  - id: s12
    text: "Duru ise her zamanki gibi {U1-079|laid-back}: yavaş ve düzenli çalışıyordu. \"<en>Relax. {U3-016|Kneading} is like playing the guitar. It's all rhythm.</en>\" Bora hemen tencere kapağıyla davul gibi ritim tuttu."
  - id: s13
    text: "Tam o sırada zil yine çaldı. Gelen Ece'ydi; elinde annesinin yolladığı bir tepsi börek, yanında da elleri cebinde Ege. Ece: \"<en>Hi! Mum sent this for you. Sorry about my cousin… He's staying with us this weekend.</en>\""
  - id: s14
    text: "Ege mutfağa bir jüri üyesi gibi girdi: \"<en>Don't worry, I'm a food critic now. Pizza is easy: you {U3-011|combine} three things and wait.</en>\""
  - id: s15
    text: "Duru'nun annesi ocakta küçük bir cezveye tereyağı koymuştu. Ege burnunu kırıştırdı: \"<en>Butter? Why do you {U3-009|melt} butter? Real Italian chefs use only olive oil.</en>\""
  - id: s16
    text: "Duru'nun annesi göz kırptı: \"<en>{U3-009|Melted} butter with garlic goes on the edges. It's my secret, Mr Critic.</en>\""
  - id: s17
    text: "Sos sırası Bora'daydı. Duru'nun annesi yanından ayrılmadı; Bora bıçağı yavaş ve dikkatli kullandı: \"<en>{U3-019|Peel} the garlic, {U3-010|chop} the onion, {U3-022|slice} the tomatoes. Leave it to me.</en>\""
  - id: s18
    text: "Ege hemen yorumunu yapıştırdı: \"<en>Those tomato {U3-022|slices} are too thick. And you need some {U3-049|black pepper}. {U3-021|Season} the sauce more!</en>\""
  - id: s19
    text: "Ece kuzenine kaşlarını çattı: \"<en>Ege, don't be such a {U2-069|snob}. You can help, you know.</en>\" Ege omuz silkti ve limonlara uzandı."
  - id: s20
    text: "Ege: \"<en>Fine. I'll {U3-025|squeeze} some lemons. Critics make the best lemonade.</en>\""
  - id: s21
    text: "Yarım saat sonra {U3-038|bowl}'daki top iki katına çıkmıştı. Duru'nun annesi: \"<en>Perfect! Now roll the {U3-044|dough} and {U3-023|spread} the sauce on it with a spoon. Not too much!</en>\""
  - id: s22
    text: "Kaan kaşığı kaptı: \"<en>Can I {U3-023|spread} it? I'm very fast!</en>\" Duru: \"<en>Yes. That's the problem.</en>\""
  - id: s23
    text: "Duru'nun annesi son kontrolü yaptı: \"<en>And on top: {U3-037|a pinch of} salt and {U3-037|a handful of} cheese. No more!</en>\""
  - id: s24
    text: "Herkes Ege'nin limonatasına bakarken arkadan bir hışırtı geldi. Fıstık ön ayaklarını tezgâha dayamış, ikinci {U3-044|dough} topunu ağzına almıştı!"
  - id: s25
    text: "Duru ilk kez yıldırım gibi davrandı: \"<en>Fıstık, drop it! Raw {U3-044|dough} is bad for dogs!</en>\" Topu kurtardı ama yarısı yerdeydi, yarısı da Fıstık'ın tüylerinde."
  - id: s26
    text: "Akşam ilk pizza çıktı. Ege bir ısırık aldı: \"<en>Hmm. Not bad… for amateurs. The sauce is {U3-023|spread} nicely and the cheese {U3-009|melts} in your mouth. Can I have another {U3-022|slice}?</en>\""
  - id: s27
    text: "Gece sınıf grubuna Murat Bey'den mesaj düştü: \"<en>Chefs, on Monday I have a new rule for Junior Chef. Get ready! 👨‍🍳</en>\" Kaan: \"<en>A new rule? I hope it's 'No flowers'.</en>\""

scene:
  - id: c01
    speaker: Duru'nun annesi
    text: "<en>Combine the flour, water and yeast in a bowl. Then knead the dough for ten minutes.</en>"
  - id: c02
    speaker: Kaan
    text: "<en>Sorry! You asked for flour, and I bought a bunch of flowers!</en>"
  - id: c03
    speaker: Ege
    text: "<en>Why do you melt butter? I'm a food critic, you know.</en>"
  - id: c04
    speaker: Duru
    text: "<en>Just spread the sauce slowly, Kaan. And Fıstık, that dough isn't for you!</en>"

