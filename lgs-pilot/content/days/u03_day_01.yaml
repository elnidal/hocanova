story:
  - id: s01
    text: "Aralık ortası, pazartesi sabahı. Zilin çalmasına bir dakika kala sınıfın kapısı açıldı ve Kaan nefes nefese içeri daldı. Ama bu kez yüzünde kocaman bir gülümseme vardı."
  - id: s02
    text: "Kaan telefonunu havaya kaldırdı: \"<en>Guys! The basketball results are here! I'm a {U2-020|member} of the school team!</en>\" Bütün sınıf alkışladı."
  - id: s03
    text: "Kaan biraz kızardı: \"<en>Well… I'm on the bench for now. But it's a start!</en>\" Yani yedek oyuncuydu. Bora arkadaşının sırtına vurdu: \"<en>Buddy, that's great news!</en>\""
  - id: s04
    text: "Murat Bey içeri girdi ve her zamanki gibi tahtaya kocaman harflerle yazdı: \"<en>JUNIOR CHEF CONTEST</en>\". \"<en>In three weeks, our school is having a cooking contest. Each team will cook a menu for the judges.</en>\""
  - id: s05
    text: "Murat Bey: \"<en>The judges are Nazmiye Teyze from the canteen, a surprise guest and me.</en>\" Kaan fısıldadı: \"<en>Nazmiye Teyze? She's very serious about her toast!</en>\""
  - id: s06
    text: "Murat Bey devam etti: \"<en>And there's one more rule. You'll write your {U3-050|recipe} in English, on a card. Then everyone can cook it at home.</en>\""
  - id: s07
    text: "Tahtaya örnek bir kart astı: \"<en>Fruit salad for four people. {U3-048|Ingredients}: two apples, two bananas, some grapes and a little honey.</en>\""
  - id: s08
    text: "Ece kartın fotoğrafını çekti. Defteri çoktan açıktı bile; sayfanın başına \"Junior Chef\" yazıp altını iki kez çizdi."
  - id: s09
    text: "Murat Bey kartın boş kalan alt kısmını gösterdi: \"<en>A good card has two parts: the {U3-048|ingredients} and the {U3-052|steps}. Use words like {U3-045|first}, {U3-045|then}, {U3-045|after that} and {U3-045|finally}.</en>\""
  - id: s10
    text: "Teneffüste Murat Bey iki takımı okulun mutfağını görmeye götürdü. Takımlar geçen ayki gibiydi: Ece, Selin ve Elif bir yanda; Kaan, Bora ve Duru öbür yanda."
  - id: s11
    text: "Selin raftan büyük, derin bir {U3-038|bowl} indirdi. Elif şaşkınlıkla baktı: \"<en>Wow, this {U3-038|bowl} is huge! We can make fruit salad for the whole school!</en>\""
  - id: s12
    text: "Bora başka bir {U3-038|bowl} kapıp kafasına geçirdi: \"<en>Look! A chef's helmet!</en>\" Elif hemen telefonunu çıkardı; bu fotoğraf kesin sınıf grubuna gidecekti."
  - id: s13
    text: "Köşede camlı kapaklı, kocaman, beyaz bir {U3-040|oven} duruyordu. Kaan hemen düğmelerine koştu: \"<en>Cool! An old radio! Let's listen to some music!</en>\""
  - id: s14
    text: "Kaan düğmeyi sonuna kadar çevirdi. Müzik yerine içeride turuncu bir ışık yandı. Murat Bey yetişip düğmeyi geri çevirdi: \"<en>Kaan, that's not a radio. It's the {U3-040|oven}! It gets very hot inside.</en>\""
  - id: s15
    text: "Duru hiç istifini bozmadı: \"<en>The {U3-040|oven} has only one radio station, Kaan. Hot FM.</en>\" Kaan da dahil herkes güldü."
  - id: s16
    text: "Murat Bey ciddileşti: \"<en>Rule number one in this kitchen: never use the {U3-040|oven} without an adult. Is that clear?</en>\" Hepsi başını salladı."
  - id: s17
    text: "Sınıfa dönünce Murat Bey sordu: \"<en>Every {U3-050|recipe} is a {U3-052|process}. Kaan, can you tell us your {U2-043|daily routine} like a {U3-050|recipe}?</en>\""
  - id: s18
    text: "Kaan ayağa kalktı, parmaklarıyla saydı: \"<en>Easy! {U3-045|First}, I wake up late. {U3-045|Then}, I run. {U3-045|Finally}, I'm late!</en>\" Sınıf kahkahaya boğuldu."
  - id: s19
    text: "Selin kaşını kaldırdı: \"<en>You missed a {U3-052|step}, Kaan. {U3-045|After that}, you always say: 'Me? Late? Never!'</en>\""
  - id: s20
    text: "Bora da katıldı: \"<en>And the {U3-048|ingredients}: one sleepy boy, two different socks and zero minutes!</en>\" Kaan çorabına baktı: biri mavi, biri yeşildi. \"<en>Hey! It's a real {U3-050|recipe}!</en>\""
  - id: s21
    text: "Ece hemen işe koyuldu: \"<en>OK, team. Meeting at my house on Saturday. I'm making a plan for every {U3-052|step}.</en>\" Bu kez hiçbir şey şapkaya benzemeyecekti."
  - id: s22
    text: "Kaan kendi takımına döndü: \"<en>We need a plan too. Bora, can you cook?</en>\" Bora omuz silkti: \"<en>Me? I can make toast. Sometimes.</en>\""
  - id: s23
    text: "Duru esnedi: \"<en>I can hold the {U3-038|bowl}. That's my job.</en>\" Kaan iç çekti; takımının şefi daha belli değildi."
  - id: s24
    text: "Gece yarısı Ece sınıf grubuna on iki sayfalık bir plan attı. Başlık: \"<en>Operation: No Hat Cake</en>\". Altına Kaan yazdı: \"<en>Ece, I'm {U1-075|always in a hurry}. Can I read only page one?</en>\""

