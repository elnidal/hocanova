tips:
  - type: tuzak
    refs: [U3-050]
    text: "recipe (tarif) ile receipt (fiş, makbuz) birbirine çok benzer. recipe üç hecelidir: \"RE-si-pi\". Recipe mutfakta, receipt kasada!"
  - type: tuzak
    refs: [U3-040]
    text: "Türkçede \"fırın\" iki şey demek: mutfaktaki fırın ve ekmek aldığımız dükkân. İngilizcede ikisi ayrı: oven mutfakta, bakery sokakta (ekmekçi dükkânı)."
  - type: mini_dilbilgisi
    refs: [U3-045, U3-052]
    text: "Sıralama sözcükleri cümle başına gelir ve virgül alır: First, … Then, … After that, … Finally, … Tek başına \"After,\" denmez; \"After that,\" denir. Son adım Finally ile verilir, At last ile değil."
  - type: lgs_taktigi
    refs: [U3-048, U3-050]
    text: "LGS'de tarif metni genelde iki bölümdür: Ingredients (malzeme listesi) ve adımlar. Soruyu okumadan önce bu iki bölümü gözünle ayır; malzeme sorusunun cevabı listede, sıra sorusunun cevabı adımlardadır."

coach:
  start: "Ünite 3 başlıyor! Okulda Junior Chef heyecanı var, Kaan da okulun mutfağında garip bir 'radyo' buldu. Önlüğünü kap! 👩‍🍳"
  end_good: "Harika başlangıç! Kaan'ın sabahı bile artık bir recipe. Yarın Ece'nin evinde ilk deneme var. 🎉"
  end_mixed: "İyi iş! {weak} biraz karıştı, dert değil. Hiçbir recipe ilk denemede kusursuz olmaz; yarın tekrar bakacağız."

notifications:
  morning: "Kaan'dan büyük haber var, Murat Bey de tahtaya kocaman bir şey yazdı! 🏀"
  evening: "Kaan okulun mutfağında bir düğme çevirdi ama müzik çalmadı. Neden? 10 dakikada öğren."
  review: "Tek soru: Kaan sabahını hangi üç İngilizce kelimeyle sıraladı?"

