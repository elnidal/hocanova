tips:
  - type: tuzak
    refs: [U1-073]
    text: "funny = komik, güldüren: \"a funny joke\", \"Bora is funny.\" fun = eğlenceli, keyifli: \"The trip was fun.\" \"The party was funny\" dersen partide gülünç şeyler oldu demiş olursun; eğlenceliyse \"The party was fun.\" Yarın fun'ı ayrıntılı göreceğiz!"
  - type: mini_dilbilgisi
    refs: [U1-017]
    text: "offer + to + fiil: \"Bora offered to help.\" · offer + kişi + şey: \"Can I offer you some cake?\" İsim olarak da kullanılır: \"Thanks for your offer.\""
  - type: hafiza_kancasi
    refs: [U1-094]
    text: "as soon as possible e-postalarda ve mesajlarda kısaca ASAP yazılır: \"Please reply ASAP.\""
  - type: kelime_ailesi
    refs: [U1-090, U1-089]
    text: "self (kendi) + disciplined (disiplinli) = self-disciplined. Dün de aynı kalıbı gördün: self-centered."

