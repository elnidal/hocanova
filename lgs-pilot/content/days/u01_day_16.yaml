title: "Gezi formu nerede?"
est_minutes: 10
characters: [Murat Bey, Kaan, Selin, Bora, Elif, Ece, Duru, Kaan'ın annesi]
new_items: [U1-017, U1-072, U1-073, U1-075, U1-090, U1-094]

story:
  - id: s01
    text: "Çarşamba sabahı Murat Bey sınıfa elinde bir deste kâğıtla girdi."
  - id: s02
    text: "\"<en>Good news! On Friday we're going on a school trip: first the science centre, then the amusement park!</en>\" Sınıf alkışlarla çınladı."
  - id: s03
    text: "Murat Bey kâğıtları dağıttı: \"<en>But first, I need these forms back with your parents' signatures {U1-094|as soon as possible}. Tomorrow, if you can!</en>\""
  - id: s04
    text: "Zil çalınca Kaan formu çantasına tıkıştırdı ve ayakkabı bağcıkları çözük kapıya koştu: \"<en>Bye! I have football, then a birthday party, then… something!</en>\""
  - id: s05
    text: "Selin başını iki yana salladı: \"<en>Kaan {U1-075|is always in a hurry}. I'm sure he'll lose that form.</en>\""
  - id: s06
    text: "Ertesi sabah Kaan sınıfa koşarak daldı. Gömleğinin düğmeleri yanlış iliklenmişti; bir çorabı mavi, öteki kırmızıydı."
  - id: s07
    text: "Elif güldü: \"<en>Why {U1-075|are you always in a hurry}, Kaan?</en>\" Kaan nefes nefese cevap verdi: \"<en>Because I'm always late!</en>\""
  - id: s08
    text: "Kaan çantasını masaya boşalttı: kurşun kalemler, yarım simit, bir futbol çorabı… ama form yok. \"<en>Oh no! Where is it?</en>\""
  - id: s09
    text: "Bora omzuna dokundu: \"<en>Don't panic. I'll {U1-005|come over} tonight and we can look for it together.</en>\""
  - id: s10
    text: "Selin, Kaan'a döndü: \"<en>Did you hear that? Bora {U1-017|offered} to help you. Say thank you!</en>\""
  - id: s11
    text: "Kaan, Bora'ya sarıldı: \"<en>Thanks, mate! I can always {U1-052|depend on} you.</en>\""
  - id: s12
    text: "Murat Bey her şeyi duymuştu: \"<en>Kaan, you're not {U1-068|unreliable}, just… very fast. Bring the form {U1-094|as soon as possible}, please.</en>\""
  - id: s13
    text: "Selin ise formunu o sabah ilk iş teslim etmişti: imzalı, katlanmamış, şeffaf bir dosyada. Gezi için bir liste bile hazırlamıştı: su, şapka, yedek pil. Haftanın bütün ödevlerini de çoktan bitirmişti."
  - id: s14
    text: "Murat Bey listeye baktı: \"<en>Selin, you are so {U1-090|self-disciplined}. You make a plan and you follow it.</en>\""
  - id: s15
    text: "Selin omuz silkti: \"<en>I study at the same time every day, even at weekends.</en>\" Kaan dehşetle baktı: \"<en>Even at weekends? That's too {U1-090|self-disciplined} for me!</en>\""
  - id: s16
    text: "Murat Bey gülümsedi: \"<en>Being {U1-090|self-disciplined} is a great {U1-086|personal trait}, Kaan. Try it!</en>\""
  - id: s17
    text: "Teneffüste Ece ile Elif kıyafet konuşuyordu. Ece cuma günü giyeceklerini dünden beri seçiyordu: beyaz spor ayakkabı, yeni bir ceket, saçında renkli bir toka."
  - id: s18
    text: "Elif hayranlıkla baktı: \"<en>Wow, Ece. You always look so {U1-072|fashionable}!</en>\""
  - id: s19
    text: "Kaan araya girdi: \"<en>Ece is {U1-072|fashionable} even at a picnic! I'm happy when my socks are the same colour.</en>\""
  - id: s20
    text: "Bora çantasından annesinin kocaman pembe güneş gözlüğünü çıkarıp taktı: \"<en>I'm {U1-072|fashionable} too! Look at me!</en>\" Elif kahkahayı bastı: \"<en>Bora, you're so {U1-073|funny}!</en>\""
  - id: s21
    text: "Bora bununla da yetinmedi; sandalyesinde hız treni sesleri çıkararak sağa sola yattı. Duru yarı uykulu mırıldandı: \"<en>He's {U1-073|funny}. He should be on TV.</en>\""
  - id: s22
    text: "Tam o anda Murat Bey içeri girdi. Pembe gözlüğü görünce o da güldü: \"<en>Very {U1-073|funny}, Bora. Now, sit down, please.</en>\""
  - id: s23
    text: "Bora gözlüğü çıkardı, yerine oturdu: \"<en>Sorry, sir!</en>\" Murat Bey göz kırptı: \"<en>Funny and {U1-088|respectful}. Good combination!</en>\""
  - id: s24
    text: "Akşam Bora, dediği saatte Kaan'ın kapısındaydı. Bir saat aradılar; form sonunda futbol çantasındaki kaleci eldiveninin içinden çıktı!"
  - id: s25
    text: "Kaan'ın annesi mutfaktan seslendi: \"<en>Bora, can I {U1-017|offer} you some cake?</en>\" Bora: \"<en>Yes, please! I never say no to cake.</en>\""
  - id: s26
    text: "Kaan güldü: \"<en>Thanks for the {U1-017|offer}, Mum. And thanks, Bora!</en>\" Annesi ikisine baktı: \"<en>You two always listen to each other. That's {U1-057|mutual respect}.</en>\""
  - id: s27
    text: "Annesi formu imzalayıp Kaan'a uzattı: \"<en>Here. Take it to Murat Bey {U1-094|as soon as possible}!</en>\" Kaan: \"<en>Don't worry, Mum. {U1-075|I'm always in a hurry} anyway!</en>\""
  - id: s28
    text: "Ertesi sabah Kaan formu Murat Bey'in masasına bıraktı; ilk kez herkesten önce! \"<en>I {U1-061|respect} people who are always on time. Maybe one day I'll be one of them.</en>\""

scene:
  - id: c01
    speaker: Murat Bey
    text: "<en>Please bring your forms back as soon as possible.</en>"
  - id: c02
    speaker: Selin
    text: "<en>Kaan is always in a hurry. I'm sure he lost his form.</en>"
  - id: c03
    speaker: Bora
    text: "<en>Don't worry, Kaan. I can help you find it. I'll come over tonight.</en>"
  - id: c04
    speaker: Elif
    text: "<en>Ece, you look so fashionable! And Bora, your pink sunglasses are so funny!</en>"

