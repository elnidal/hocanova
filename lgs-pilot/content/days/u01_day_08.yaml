      - "\"Are you tired?\" sorusuna \"What time does it start?\" diye devam edilmez."
  - id: d08-r08
    type: message_infer
    item: U1-012
    lgs_like: true
    prompt: "<en>Which information is NOT in the invitation?</en>"
    stem: "<en>Dear Selin,\nPlease come to our picnic on Saturday at 11 o'clock in the city park. Bring your favourite snack!\nEce</en>"
    options: ["Ece's home address", "the day of the picnic", "the place of the picnic", "the time of the picnic"]
    answer: 0
    explain: "Davetiyede gün, yer ve saat var; Ece'nin ev adresi yazmıyor, yalnızca \"city park\" yazıyor."
    why_wrong:
      - "Gün davetiyede var: \"on Saturday\"."
      - "Yer davetiyede var: \"in the city park\"."
      - "Saat davetiyede var: \"at 11 o'clock\"."
  - id: d08-r09
    type: message_infer
    item: U1-001
    lgs_like: true
    prompt: "<en>What did Bora do?</en>"
    stem: "<en>Bora: Thanks for the invitation, Ece! Of course I'll come to the picnic. I'll bring sandwiches!</en>"
    options: ["He accepted the invitation.", "He refused the invitation.", "He invited Ece to a party.", "He apologised to Ece."]
    answer: 0
    explain: "Davet için teşekkür edip \"I'll come\" diyen Bora daveti kabul etti."
    why_wrong:
      - "Tam tersi: \"Of course I'll come\" daveti kabul eder."
      - "Davet eden Bora değil, Ece; Bora yalnız cevap veriyor."
      - "Mesajda özür yok; Bora \"Thanks for the invitation\" diyerek teşekkür ediyor."

tips:
  - type: mini_dilbilgisi
    refs: [U1-006]
    text: "Do you want to …? ve Would you like to …? ikisi de davet. Do you want to arkadaşlar arasında daha gündelik; Would you like to daha kibar. İkisinden sonra da fiil yalın gelir: \"Do you want to come?\""
  - type: mini_dilbilgisi
    refs: [U1-024]
    text: "What about + isim ya da -ing: \"What about a picnic?\" · \"What about going to the park?\" How about ile aynı şekilde kullanılır."
  - type: tuzak
    refs: [U1-018]
    text: "prefer A to B: \"I prefer picnics to films.\" Karşılaştırırken than değil, to kullanılır!"
  - type: lgs_taktigi
    refs: [U1-023, U1-014, U1-010]
    text: "Teklife \"That would be great!\" ya da \"I would like to…\" diyen kabul ediyor. \"It doesn't matter.\" diyen ise seçimi size bırakıyor: ne kabul ne red, ikisi de olur."

