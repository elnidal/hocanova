title: "Hafta sonu planı"
est_minutes: 10
characters: [Ece, Kaan, Selin, Bora, Duru, Elif]
new_items: [U1-006, U1-024, U1-018, U1-014, U1-010, U1-023]

story:
  - id: s01
    text: "Cuma akşamı. Ece sınıf grubuna bir anket attı: \"<en>Weekend plan! Cinema or picnic? 🎬🧺</en>\""
  - id: s02
    text: "İlk mesaj, her zamanki gibi Kaan'dan geldi: \"<en>{U1-006|Do you want to} see the new superhero film? It starts at three!</en>\""
  - id: s03
    text: "Selin: \"<en>{U1-024|What about} a picnic? It will be sunny on Saturday.</en>\""
  - id: s04
    text: "Plan kraliçesi Ece: \"<en>{U1-024|What about} both? Cinema at ten, picnic at one, ice cream at four!</en>\" Kaan: \"<en>Ece, it's a weekend, not a school day!</en>\""
  - id: s05
    text: "Bora: \"<en>I {U1-018|prefer} the picnic. Cinema tickets are expensive, and I can make sandwiches.</en>\""
  - id: s06
    text: "Kaan: \"<en>I {U1-018|prefer} the cinema. Popcorn! Big screen! No ants!</en>\""
  - id: s07
    text: "Herkes Duru'yu bekledi. Duru'nun mesajı tam dört dakika sonra geldi."
  - id: s08
    text: "Duru: \"<en>{U1-014|It doesn't matter}. Blanket or cinema seat, both are soft.</en>\""
  - id: s09
    text: "Ece güldü: \"<en>Duru, you are the most {U1-079|laid-back} person in this group!</en>\""
  - id: s10
    text: "Elif: \"<en>{U1-010|I would like to} come too! Is that OK?</en>\" Ece: \"<en>Of course! {U1-006|Do you want to} bring Pamuk? Fıstık can come too!</en>\""
  - id: s11
    text: "Elif: \"<en>{U1-023|That would be great}! Pamuk loves picnics.</en>\""
  - id: s12
    text: "Kaan isyan etti: \"<en>This isn't {U1-071|fair}! Dogs can't watch films, so now everybody wants a picnic!</en>\""
  - id: s13
    text: "Selin: \"<en>Let's vote. That's the {U1-071|fair} way.</en>\""
  - id: s14
    text: "Sonuç: piknik 5, sinema 1. Tek sinema oyunun kime ait olduğunu bulmak hiç zor değildi."
  - id: s15
    text: "Kaan: \"<en>OK… {U1-010|I would like to} see the film with someone. Bora?</en>\" Bora: \"<en>Sorry, {U1-028|buddy}. I {U1-018|prefer} sandwiches.</en>\""
  - id: s16
    text: "Ece, Kaan'ı yalnız bırakmadı: \"<en>Kaan, {U1-024|what about} the cinema next weekend? All of us!</en>\" Kaan: \"<en>{U1-023|That would be great}!</en>\""
  - id: s17
    text: "Elif: \"<en>Kaan is so {U1-084|outgoing}. At the picnic, he will make friends with the ducks!</en>\" Kaan: \"<en>Challenge accepted! 🦆</en>\""
  - id: s18
    text: "Sonra sıra yiyeceklere geldi. Bora: \"<en>{U1-010|I would like to} make my famous sandwiches. Five for each person!</en>\""
  - id: s19
    text: "Selin: \"<en>Five? Bora, we will be {U1-099|stuffed}!</en>\" Bora: \"<en>That's the plan.</en>\""
  - id: s20
    text: "Duru: \"<en>I'll be {U1-097|full} after one. Then I'll sleep on the blanket.</en>\""
  - id: s21
    text: "Ece: \"<en>Should I ask my cousin Ege too?</en>\" Kaan: \"<en>Only if he shares his chips. At your party he was so {U1-083|mean}!</en>\""
  - id: s22
    text: "Selin: \"<en>He apologised, Kaan. So, Saturday or Sunday, Duru?</en>\" Duru: \"<en>{U1-014|It doesn't matter}. Every day is a lazy day for me.</en>\""
  - id: s23
    text: "Bora: \"<en>Duru's answer to every question: '{U1-014|It doesn't matter}.'</en>\""
  - id: s24
    text: "Bora: \"<en>Duru, {U1-006|do you want to} play the guitar at the picnic?</en>\" Duru: \"<en>Only lying down.</en>\""
  - id: s25
    text: "Sonunda Selin, babasının herkesi arabayla parka götürebileceğini yazdı. Grup tek ses oldu: \"<en>{U1-023|That would be great}!</en>\""
  - id: s26
    text: "Ece planı sabitledi: \"<en>Saturday, 11 o'clock, the city park. Don't be late, Kaan!</en>\" Kaan: \"<en>Me? Late? Never!</en>\" Kimse inanmadı."

scene:
  - id: c01
    speaker: Kaan
    text: "<en>Do you want to go to the cinema on Saturday?</en>"
  - id: c02
    speaker: Selin
    text: "<en>I prefer a picnic. What about the city park?</en>"
  - id: c03
    speaker: Duru
    text: "<en>It doesn't matter to me. I would like to sleep on a blanket.</en>"
  - id: c04
    speaker: Elif
    text: "<en>A picnic with our dogs? That would be great!</en>"

steps:
  - item: U1-006
    sezdir:
      id: d08-006-z
      type: meaning
      context: s02
      prompt: "Hikâyede \"Do you want to …?\" ne anlama geliyordu?"
      options: ["… ister misin?", "… zorunda mısın?", "… yaptın mı?", "… nefret eder misin?"]
      answer: 0
    kullan:
      id: d08-006-k
      type: gap_fill
      prompt: "Boşluğa uygun olanı seç."
      stem: "<en>A: ________ play basketball with us after school?\nB: Sure, I'd love to!</en>"
      options: ["Do you want to", "Why did you", "Where did you", "How often do you"]
      answer: 0
      explain: "\"Do you want to + fiil\" bir teklif sorusudur; cevap \"Sure, I'd love to!\" ile uyuyor."
    sina:
      id: d08-006-s
      type: situation
      lgs_like: true
      prompt: "<en>What can Ece say to Elif?</en>"
      stem: "<en>Ece is going to the park with her dog. She wants Elif to come with her.</en>"
      options: ["Do you want to come to the park with me?", "Did you go to the park yesterday?", "Where is your dog?", "Why are you at the park?"]
      answer: 0
      explain: "Parka gelmesini isteyen Ece teklif eder: Do you want to come to the park with me?"
      why_wrong:
        - "\"Did you go…yesterday?\" geçmişi sorar; Ece ise Elif'i şimdi davet etmek istiyor."
        - "Köpek Ece'nin yanında; bu soru davet etmez."
        - "Elif henüz parkta değil; bu soru onu parka çağırmıyor."
  - item: U1-024
    sezdir:
      id: d08-024-z
      type: meaning
      context: s03
      prompt: "Hikâyede \"What about …?\" ne anlama geliyordu?"
      options: ["Peki ya …? / … ne dersin?", "… nerede?", "… ne zaman?", "… kimin?"]
      answer: 0
    kullan:
      id: d08-024-k
      type: gap_fill
      prompt: "Boşluğa uygun olanı seç."
      stem: "<en>A: I don't want to watch a film today.\nB: OK. ________ a picnic?</en>"
      options: ["What about", "Who is", "Why was", "How much is"]
      answer: 0
      explain: "\"What about + isim/-ing?\" öneri kalıbıdır: What about a picnic?"
    sina:
      id: d08-024-s
      type: dialogue_complete
      lgs_like: true
      prompt: "<en>Which one completes the dialogue?</en>"
      stem: "<en>Kaan: I'm bored. What can we do?\nSelin: ________\nKaan: Good idea! Let's go.</en>"
      options: ["What about playing basketball?", "I'm not bored.", "Where were you yesterday?", "I have a lot of homework."]
      answer: 0
      explain: "Sıkılan Kaan'a öneri yapılır ve Kaan \"Good idea!\" der: What about playing basketball?"
      why_wrong:
        - "Bu bir öneri değil; Kaan'ın \"Good idea!\" cevabına uymuyor."
        - "Geçmişte nerede olduğunu sormak bir öneri değil; \"Let's go\" ile bağ kurmaz."
        - "Ödevden şikâyet bir öneri değil; ardından \"Good idea!\" denmez."
  - item: U1-018
    sezdir:
      id: d08-018-z
      type: meaning
      context: s05
      prompt: "Hikâyede \"prefer\" ne anlama geliyordu?"
      options: ["tercih etmek", "nefret etmek", "unutmak", "satın almak"]
      answer: 0
    kullan:
      id: d08-018-k
      type: gap_fill
      prompt: "Boşluğa uygun olanı seç."
      stem: "<en>Bora likes films, but he ________ picnics. He thinks they're more fun.</en>"
      options: ["prefers", "hates", "forgets", "breaks"]
      answer: 0
      explain: "Bora filmleri sever ama pikniklerin daha eğlenceli olduğunu düşünür: prefers (tercih eder)."
    sina:
      id: d08-018-s
      type: message_infer
      lgs_like: true
      prompt: "<en>Which of the following is TRUE about Selin?</en>"
      stem: "<en>Selin: The cinema is OK, but picnics are better for me. I love being outside in the sun.</en>"
      options: ["She prefers picnics to the cinema.", "She prefers the cinema to picnics.", "She doesn't like being outside.", "She hates the cinema."]
      answer: 0
      explain: "Selin pikniği sinemadan daha çok seviyor: prefers picnics to the cinema."
      why_wrong:
        - "Sıralama ters çevrilmiş: Selin \"picnics are better for me\" diyor."
        - "Tam tersi: Selin \"I love being outside in the sun\" diyor."
        - "\"Hate\" aşırı bir ifade; Selin sinema için \"OK\" diyor, nefret etmiyor."
  - item: U1-014
    sezdir:
      id: d08-014-z
      type: meaning
      context: s08
      prompt: "Hikâyede \"It doesn't matter.\" ne anlama geliyordu?"
      options: ["Fark etmez.", "Kesinlikle hayır.", "Çok yoruldum.", "Hemen geliyorum."]
      answer: 0
    kullan:
      id: d08-014-k
      type: gap_fill
      prompt: "Boşluğa uygun olanı seç."
      stem: "<en>A: Pizza or burger? Which one do you want?\nB: ________ I like both.</en>"
      options: ["It doesn't matter.", "Sorry, I can't.", "That's not fair.", "I hate both."]
      answer: 0
      explain: "\"I like both\" diyen kişi için fark etmez: It doesn't matter."
    sina:
      id: d08-014-s
      type: message_infer
      lgs_like: true
      prompt: "<en>What does Duru mean?</en>"
      stem: "<en>Duru: Cinema or picnic? I'm happy with both. You choose!</en>"
      options: ["It doesn't matter to her.", "She prefers the cinema.", "She prefers the picnic.", "She doesn't want to come."]
      answer: 0
      explain: "Duru ikisinden de memnun ve \"You choose!\" diyor: fark etmez (It doesn't matter)."
      why_wrong:
        - "Duru bir tercih yapmıyor; \"I'm happy with both\" diyor."
        - "Duru pikniği de seçmiyor; \"You choose!\" diyerek kararı bırakıyor."
        - "Duru gelmek istemediğini söylemiyor; iki seçenekten de memnun."
  - item: U1-010
    sezdir:
      id: d08-010-z
      type: meaning
      context: s10
      prompt: "Hikâyede \"I would like to …\" ne anlama geliyordu?"
      options: ["… isterim.", "… yapamam.", "… yaptım.", "… sevmem."]
      answer: 0
    kullan:
      id: d08-010-k
      type: gap_fill
      prompt: "Boşluğa uygun olanı seç."
      stem: "<en>A: Would you like to join us at the picnic?\nB: Yes, ________ come. Thank you!</en>"
      options: ["I would like to", "I don't want to", "I can't", "I refuse to"]
      answer: 0
      explain: "\"Would you like to join us?\" sorusuna kabul cevabı: Yes, I would like to come."
    sina:
      id: d08-010-s
      type: synonym
      lgs_like: true
      prompt: "<en>\"I would like to visit the science museum.\" Which one is CLOSEST in meaning?</en>"
      options: ["I want to visit the science museum.", "I visited the science museum.", "I don't want to visit the science museum.", "I have to visit the science museum."]
      answer: 0
      explain: "I would like to = I want to (istiyorum)."
      why_wrong:
        - "\"Visited\" geçmiş zaman; \"would like to\" ise şu anki isteği anlatır."
        - "Tam tersi: \"would like to\" istemek demek, istememek değil."
        - "\"Have to\" zorunluluk anlatır; \"would like to\" ise istek anlatır."
  - item: U1-023
    sezdir:
      id: d08-023-z
      type: meaning
      context: s11
      prompt: "Hikâyede \"That would be great.\" ne anlama geliyordu?"
      options: ["Harika olur.", "Hiç sanmıyorum.", "Çok kötü olur.", "Belki sonra."]
      answer: 0
    kullan:
      id: d08-023-k
      type: gap_fill
      prompt: "Boşluğa uygun olanı seç."
      stem: "<en>A: I can help you with your English homework.\nB: Really? ________ Thanks!</en>"
      options: ["That would be great.", "That's not fair.", "It doesn't matter.", "Sorry, I can't."]
      answer: 0
      explain: "Yardım teklifine memnuniyetle verilen cevap: That would be great. (Harika olur.)"
    sina:
      id: d08-023-s
      type: dialogue_complete
      lgs_like: true
      prompt: "<en>Which one completes the dialogue?</en>"
      stem: "<en>Selin: My dad can drive us to the park on Saturday.\nEce: ________</en>"
      options: ["That would be great! Thanks!", "That's not fair!", "I'm stuffed, thanks.", "Why are you so mean?"]
      answer: 0
      explain: "Babasının arabayla götürmesi bir iyilik teklifidir; cevap \"That would be great! Thanks!\""
      why_wrong:
        - "\"That's not fair!\" haksızlığa itiraz eder; iyilik teklifine cevap olmaz."
        - "\"I'm stuffed\" doymak demek; araba teklifiyle ilgisi yok."
        - "Yardım teklif eden birine \"mean\" (kaba) denmez; teklif nazik bir davranış."

