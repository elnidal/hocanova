story:
  - id: s01
    text: "Ertesi sabah, Bursa. Ece daha kahvaltısını bitirmeden Sevim Hanım'ı aradı. Sevim Hanım her zamanki gibi nefes almadan konuşuyordu."
  - id: s02
    text: "Sevim Hanım: \"<en>Good morning, Ece dear! My shop is part of a small chain, you know, so our head office must say yes. Call Mr Aydın there. He's on {U4-017|extension} two-one-four. Bye-bye!</en>\""
  - id: s03
    text: "Sevim Hanım o kadar hızlı konuşmuştu ki Ece'nin üç renkli kalemi yetişememişti. Defterde koca harflerle şu yazıyordu: \"<en>Head office. Mr Aydın. {U4-017|Ext.} 14.</en>\" Baştaki 2 havada kalmıştı."
  - id: s04
    text: "Ece genel merkezin numarasını aradı. Hattın öbür ucundan genel merkezin {U4-042|secretary}'si, çok kibar bir sesle konuştu: \"<en>Good morning, head office. {U4-020|How can I help you}?</en>\""
  - id: s05
    text: "Ece en profesyonel menajer sesini takındı: \"<en>Good morning. {U4-031|This is} Ece, the manager of a young band. {U4-024|I'm calling about} a concert at your shop across from the park.</en>\""
  - id: s06
    text: "{U4-042|Secretary}: \"<en>A concert? How nice! Who would you like to speak to?</en>\" Ece defterine baktı: \"<en>{U4-026|May I speak to} Mr Aydın, please? {U4-017|Extension} fourteen.</en>\""
  - id: s07
    text: "{U4-042|Secretary}: \"<en>Of course. {U4-007|Hold on}, please. I'll {U4-012|put you through}.</en>\" Bir tık sesi geldi, ardından aynı piyano parçası üç kez başa döndü. Ece: \"<en>This music is so {U2-030|annoying}…</en>\""
  - id: s08
    text: "Sonunda arkada kutu sesleri, bir de el arabasının gıcırtısıyla derin ve sakin bir erkek sesi duyuldu: \"<en>Hello, storeroom. Hasan speaking. {U4-020|How can I help you}?</en>\""
  - id: s09
    text: "Ece \"<en>storeroom</en>\" kelimesini duymadı bile. Defterini açtı ve başladı: \"<en>Good morning, Mr Aydın! {U4-024|I'm calling to} ask for your permission. Our band wants to play at your shop on the last Saturday of the holiday!</en>\""
  - id: s10
    text: "Ece tam dört dakika konuştu: şarkılar, saatler, sandalyeler, Bora'nın henüz olmayan davulu, Elif'in sesi, Duru'nun gitarı. Hattın öbür ucundaki adam onu hiç kesmedi; arada yalnızca \"<en>Hmm.</en>\" ve \"<en>Very nice.</en>\" dedi."
  - id: s11
    text: "Sonunda adam nazikçe öksürdü: \"<en>It all sounds wonderful. But {U4-023|I'm afraid} I'm not Mr Aydın. I'm Hasan. I work in the storeroom. This is {U4-017|extension} fourteen. Mr Aydın is on two-one-four.</en>\""
  - id: s12
    text: "Ece'nin yanakları alev alev yandı: \"<en>Oh no! I'm so sorry! I talked for four minutes!</en>\" Hasan Bey güldü: \"<en>No problem. You're my first {U4-002|caller} this week. Usually only the boxes talk to me. I'm a {U1-085|patient} listener.</en>\""
  - id: s13
    text: "Ece: \"<en>You're so kind! You know what? You'll get the first {U1-012|invitation} to our concert!</en>\" Hasan Bey: \"<en>Really? Thank you! Now, let me {U4-012|put you through} to the right {U4-017|extension}.</en>\""
  - id: s14
    text: "Yine bir tık. Bu kez telefonu bambaşka bir ses aldı: \"<en>Aydın speaking. {U4-020|How can I help you}?</en>\""
  - id: s15
    text: "Ece bu sefer kısa ve net konuştu: \"<en>Good morning, Mr Aydın. This is Ece. {U4-024|I'm calling about} the concert at the shop across from the park. Sevim Hanım says we need your permission.</en>\""
  - id: s16
    text: "Aydın Bey: \"<en>Ah, yes! Sevim told me about your band. It's fine with me. On Saturday evening, the stage is yours!</en>\" Ece sandalyesinden fırladı ve odanın ortasında küçük bir zafer dansı yaptı."
  - id: s17
    text: "Aydın Bey: \"<en>And thank you for the {U4-002|call}. Our {U4-042|secretary} will send Sevim Hanım an email today.</en>\""
  - id: s18
    text: "Ece telefonu bırakır bırakmaz sınıf grubuna yazdı: \"<en>GREAT NEWS: head office says YES! Also, the storeroom says hi. 📦</en>\""
  - id: s19
    text: "Selin: \"<en>Wait. The {U4-042|secretary} {U4-012|put you through} to the storeroom?</en>\" Ece: \"<en>Yes, but it was my mistake. I asked for the wrong {U4-017|extension}. But Hasan Bey is coming to our concert now!</en>\""
  - id: s20
    text: "Selin, defterine yeni bir kural ekledi: \"<en>Rule 1: Always write the full number. Rule 2: Be nice to everyone on the phone. You never know!</en>\""
  - id: s21
    text: "En son Bora yazdı: \"<en>Ece, next time let ME make the {U4-002|call}. I never make mistakes with numbers. Never. 😎</en>\""

