tips:
  - type: tuzak
    refs: [U4-017]
    text: "extension okul listelerinde \"ek süre, uzatma\" diye geçebilir. Telefonda bir sayıyla birlikte duyarsan dahili hattır: \"Can you put me through to extension 214?\" (214 numaralı dahiliye bağlar mısınız?)"
  - type: mini_dilbilgisi
    refs: [U4-024]
    text: "Arama nedenini iki yolla söyleyebilirsin: I'm calling about + isim (I'm calling about the concert) ya da I'm calling to + fiil (I'm calling to ask for permission). \"I'm calling about ask\" olmaz."
  - type: mini_dilbilgisi
    refs: [U4-012, U4-001]
    text: "Telefon fiillerinde zamir iki parçanın ARASINA girer: put you through, call me back. \"I'll put through you\" ya da \"call back me\" yanlış olur."
  - type: lgs_taktigi
    refs: [U4-024, U4-002]
    text: "\"Why is X calling?\" sorusunda selamlaşmayı ve hal hatırı atla: amaç çoğu zaman \"I'm calling to … / I'm calling about …\" cümlesindedir. Arayan (caller) da \"This is …\" diye kendini tanıtan kişidir."

