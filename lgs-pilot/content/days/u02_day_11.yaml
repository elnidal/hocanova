story:
  - id: s01
    text: "Cuma. Okul panosunda kocaman bir yazı vardı: \"<en>FRIDAY: NO UNIFORM DAY! Wear your own clothes.</en>\" Bütün okul bir haftadır bu günü konuşuyordu."
  - id: s02
    text: "Ece okul kapısında belirdi: beyaz spor ayakkabılar, bol bir kot pantolon, kısa bir ceket ve saçında renkli bir toka."
  - id: s03
    text: "Elif'in ağzı açık kaldı: \"<en>Wow, Ece! What a nice {U2-066|outfit}!</en>\" Ece bir tur döndü: \"<en>Thanks! I planned this {U2-066|outfit} for a week.</en>\""
  - id: s04
    text: "Selin gülümsedi: \"<en>A week? My {U2-043|daily routine} is simple. I get up at 6.30 and I {U2-044|always} wear the same thing: my uniform!</en>\""
  - id: s05
    text: "Ece: \"<en>I love {U2-061|fashion}. I read blogs about it every night.</en>\""
  - id: s06
    text: "Ece pantolonunu gösterdi: \"<en>I {U2-063|keep up with the latest fashion}. Wide jeans are very {U2-062|trendy} this year!</en>\""
  - id: s07
    text: "Kaan koşarak geldi (geç, tabii ki): basketbol forması, eşofman altı, spor ayakkabı. \"<en>Morning! I'm wearing {U2-064|casual clothes}. Perfect for basketball!</en>\""
  - id: s08
    text: "Duru, kapüşonlusunun cebinden elini çıkarıp el salladı: \"<en>Same here. I {U2-046|mostly} wear {U2-064|casual clothes}. I'm {U1-079|laid-back}.</en>\""
  - id: s09
    text: "Sonra Bora köşeyi döndü ve herkes sustu. Lacivert bir takım elbise, beyaz gömlek, kırmızı bir papyon… Ayakkabıları ayna gibi parlıyordu."
  - id: s10
    text: "Kaan: \"<en>Bora?! Are you going to a wedding?</en>\" Bora yakasını düzeltti: \"<en>No! These are {U2-065|smart clothes}. I want to look {U1-072|fashionable}.</en>\""
  - id: s11
    text: "Ece gülmemek için dudağını ısırdı: \"<en>Bora, {U2-065|smart clothes} are for weddings and dinners. Today is a {U2-064|casual} day!</en>\""
  - id: s12
    text: "Bora omuz silkti: \"<en>My mum says I {U2-044|never} dress up. So today I'm dressing up!</en>\""
  - id: s13
    text: "Murat Bey sınıfa girdi, Bora'yı görünce gözlüğünü düzeltti: \"<en>Good morning, Mr Bora. Do you have a meeting with the head teacher?</en>\" Sınıf kahkahaya boğuldu; en çok da Bora güldü."
  - id: s14
    text: "Murat Bey: \"<en>OK, survey time! Today's question is: Do you {U2-063|keep up with the latest fashion}?</en>\""
  - id: s15
    text: "Elif: \"<en>I do! I follow {U2-062|trendy} singers online and I copy their {U2-066|outfits}.</en>\""
  - id: s16
    text: "Selin: \"<en>Not really. {U2-047|Most of the time}, I {U1-018|prefer} simple clothes.</en>\""
  - id: s17
    text: "Duru: \"<en>{U2-061|Fashion}? I don't follow it. My dog Fıstık is more {U2-062|trendy} than me. He has a new red collar!</en>\""
  - id: s18
    text: "Kaan: \"<en>I buy new clothes once a year. But I wash my basketball shirt {U2-045|regularly}!</en>\" Herkes bir ağızdan: \"<en>We hope so!</en>\""
  - id: s19
    text: "Ece sonuçları yazdı: \"<en>So two people {U2-063|keep up with the latest fashion} and three don't. And Bora's {U2-066|outfit} is the most famous in the school!</en>\""
  - id: s20
    text: "Öğle arasında Bora ceketini çıkardı, papyonu cebine koydu, gömleğinin kollarını sıvadı: \"<en>OK, OK. {U2-065|Smart clothes} are not good for basketball.</en>\""
  - id: s21
    text: "Okul çıkışı Selin'in babasının arabası kapıda bekliyordu. Babası camı indirdi: \"<en>I'm here to {U2-048|pick you up}, Selin. Oh, nice bow tie, Bora!</en>\""
  - id: s22
    text: "Bora papyonu cebinden çıkarıp gururla yeniden taktı: \"<en>Thanks! It's {U2-061|fashion}!</en>\" Ece güldü: \"<en>Bora, you're a star now!</en>\""

