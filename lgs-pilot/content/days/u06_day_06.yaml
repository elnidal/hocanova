title: "Zil kimin için çalıyor?"
est_minutes: 10
characters: [Ece, Kaan, Selin, Bora, Elif, Duru]
new_items: [U6-009, U6-016, U6-049, U6-050, U6-051, U6-052]

story:
  - id: s01
    text: "Bahar kampının ilk tam günü, sabah dokuz. Çam ağaçlarının arasında on metrelik ahşap bir duvar yükseliyordu. Üstü yüzlerce renkli tutamakla kaplıydı, en üstünde de küçük, parlak bir zil asılıydı."
  - id: s02
    text: "Ece dört sayfalık listesinden okudu: \"<en>Nine o'clock: climbing wall. Ten o'clock: zip-line. Twelve o'clock: lunch!</en>\" Kaan çoktan duvarın dibindeydi. Selin iç çekti: \"<en>Kaan is {U1-075|always in a hurry}. Even at camp.</en>\""
  - id: s03
    text: "Deniz Hoca herkesin kaskını ve emniyet kemerini tek tek kontrol etti: \"<en>Safety first. {U2-041|Pay attention}, please. I hold the rope, and you {U6-009|climb}. Nobody {U6-009|climbs} without me.</en>\""
  - id: s04
    text: "Sonra herkese aynı soruyu sordu: \"<en>Everybody needs a {U6-051|goal} today. It can be big or small. What's your {U6-051|aim}?</en>\""
  - id: s05
    text: "Kaan: \"<en>The top! In one minute, {U1-028|buddy}!</en>\" Selin parmağını kaldırdı: \"<en>My {U6-051|aim} is the zip-line. And I'm going first.</en>\""
  - id: s06
    text: "Herkes donup kaldı. Dergideki testten 2/10 alan, \"<en>I love plans.</en>\" diyen Selin mi? Selin omuz silkti: \"<en>I always follow the plan. Today the plan is fear.</en>\""
  - id: s07
    text: "Bora ise duvarın dibinde başını kaldırmış, zile bakıyordu. Normalde cebinde hazır bir bahane olurdu: karın ağrısı, kayıp ayakkabı, olmayan kedi… Bu sefer hiçbirini kullanmadı: \"<en>I'm {U4-054|scared}. Really {U4-054|scared}.</en>\""
  - id: s08
    text: "Deniz Hoca gülümsedi: \"<en>Thank you for telling me, Bora. Saying 'I'm {U4-054|scared}' needs {U6-016|courage} too.</en>\""
  - id: s09
    text: "Deniz Hoca: \"<en>Why don't you choose a smaller {U6-051|goal}? Half the wall, maybe?</en>\" Bora yutkundu: \"<en>Half. OK. Half is my {U6-051|aim}.</en>\""
  - id: s10
    text: "İlk Kaan çıktı. İki dakikada duvarın yarısındaydı, sonra birden durdu: \"<en>Er… which one is next?</en>\" Deniz Hoca aşağıdan seslendi: \"<en>Slow down, Kaan. Slow is safer than fast. Look first, then move. That's how you {U6-050|improve}.</en>\""
  - id: s11
    text: "Ece her tutamağı aşağıdan planladı: \"<en>Blue, then red, then the yellow one…</en>\" Plan işledi; yavaş ama hatasız yukarı çıktı. Kaan da ikinci denemesinde yavaşladı ve zili çaldı."
  - id: s12
    text: "Sıra Bora'daydı. Dizleri jöle gibiydi. Elif aşağıdan bağırdı: \"<en>You can do it, Bora! Be {U6-016|brave}!</en>\" Duru hamaktan tek gözünü açtı: \"<en>Go, Bora.</en>\" Duru için bu uzun bir nutuktu."
  - id: s13
    text: "Bora tutamak tutamak ilerledi ve duvarın tam ortasına geldi: \"<en>Half! I {U6-049|succeeded}! Can I come down now?</en>\""
  - id: s14
    text: "Deniz Hoca ipi sıkıca tutuyordu: \"<en>You can come down. Or you can try one more. You choose.</en>\""
  - id: s15
    text: "Bora önce aşağı baktı, sonra yukarı. Uzun bir sessizlik oldu. \"<en>{U6-036|I'd rather} {U6-009|climb} one more than go down now.</en>\""
  - id: s16
    text: "Bir tutamak daha. Bir tane daha. Aşağıdaki herkes nefesini tutmuştu. Ve sonra… çın! Bora zile dokundu. Kamp alanı alkıştan inledi."
  - id: s17
    text: "Kaan: \"<en>Bora! {U6-037|Why} did you go to the top? Your {U6-051|aim} was half!</en>\" Bora, ipe sıkı sıkı tutunmuş halde: \"<en>{U6-037|Because} going down was scarier than going up!</en>\""
  - id: s18
    text: "Deniz Hoca, Bora'yı ipiyle yavaşça aşağı indirdi: \"<en>Well done. You {U6-052|gained} confidence and {U6-050|improved} very fast. That's real {U6-016|bravery}.</en>\""
  - id: s19
    text: "Saat onda zip-line'ın başında Selin vardı. Kask, kemer, iki kontrol. Gözlerini kapattı ve kaydı. Ağaçların arasından ince bir çığlık yükseldi, sonra bir kahkaha. Aşağıdan Selin'in sesi geldi: \"<en>Plan complete!</en>\""
  - id: s20
    text: "Kaan: \"<en>Selin {U6-049|succeeded} before me? That's not fair! …OK, it's fair.</en>\" Selin: \"<en>I {U6-052|gained} a lot of {U6-027|experience} today. And a new hobby: screaming.</en>\""
  - id: s21
    text: "Öğle yemeğinde Elif telefonundaki fotoğrafları gösterdi. Birinde Bora'nın yüzü zil kadar yuvarlak, gözleri kocaman açıktı. Bora fotoğrafa ilk gülen oldu: \"<en>My face is {U6-031|amusing}, but my legs are heroes.</en>\""
  - id: s22
    text: "Duru hamağından hiç kalkmamıştı: \"<en>The wall? No, thanks. I {U6-035|prefer} my hammock {U6-035|to} any wall.</en>\" Ece: \"<en>Last year's camp video was {U6-032|disappointing}. This year we have a real story!</en>\""
  - id: s23
    text: "Kaan ise şimdiden gelecek yılı planlıyordu: \"<en>Next year I want to {U6-004|go rafting}. Then {U6-004|go caving}! {U6-037|Why}? {U6-037|Because} I love {U6-011|danger}!</en>\" Deniz Hoca: \"<en>With an instructor, Kaan.</en>\""
  - id: s24
    text: "Ece listesine yeni bir satır ekledi: \"<en>9.40 – Bora {U6-049|succeeded}: top of the wall. NOT in the plan!</en>\" Listede ilk kez plansız bir satır vardı ve Ece buna hiç kızmadı."
  - id: s25
    text: "Akşamüstü Deniz Hoca herkesi topladı: \"<en>Every time you try, you {U6-052|gain} something and you {U6-050|improve}. Tomorrow you can {U6-009|climb} again, or try something new: the lake!</en>\""
  - id: s26
    text: "Tam o sırada ağaçların uçları sallanmaya başladı ve Ece'nin listesinin bir sayfası havalandı. Deniz Hoca gökyüzüne baktı, kaşları hafifçe çatıldı. Ece kâğıdın peşinden koştu: \"<en>My plan! Come back!</en>\""

scene:
  - id: c01
    speaker: Deniz Hoca
    text: "<en>What's your aim today? It can be a small goal.</en>"
  - id: c02
    speaker: Bora
    text: "<en>I'm scared. Half the wall is my aim.</en>"
  - id: c03
    speaker: Elif
    text: "<en>You can do it, Bora! Be brave!</en>"
  - id: c04
    speaker: Bora
    text: "<en>I succeeded! I climbed to the top!</en>"
  - id: c05
    speaker: Deniz Hoca
    text: "<en>Well done. You gained confidence and improved very fast.</en>"

