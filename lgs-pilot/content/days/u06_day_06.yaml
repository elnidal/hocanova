tips:
  - type: tuzak
    refs: [U6-009]
    text: "climb'daki b okunmaz: /klaɪm/ (\"klaym\"). climbing \"klayming\", climber \"klaymır\" diye okunur."
  - type: tuzak
    refs: [U6-052]
    text: "Türkçede hepsine \"kazanmak\" deriz ama İngilizcede üç ayrı fiil var: gain deneyim, özgüven, kilo (gain confidence); win yarış, ödül (win a race); earn para (earn money)."
  - type: kelime_ailesi
    refs: [U6-049]
    text: "succeed (fiil, başarmak) → success (isim, başarı) → successful (sıfat, başarılı) → successfully (zarf, başarıyla). I succeeded = I was successful."
  - type: kelime_ailesi
    refs: [U6-016]
    text: "courage ve bravery isimdir (cesaret); brave sıfattır (cesur): Be brave! fearless = korkusuz. Bravery korkmamak değil, korkuya rağmen denemektir."

