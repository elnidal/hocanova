tips:
  - type: kelime_ailesi
    refs: [U2-088, U2-013]
    text: "bear = katlanmak → bearable (katlanılabilir) → unbearable (katlanılmaz). un- olumsuz yapar. \"It's unbearable.\" ≈ \"I can't stand it.\" Bonus: bear isim olarak \"ayı\" demek!"
  - type: tuzak
    refs: [U2-086]
    text: "sensitive ≠ sensible! sensitive = duyarlı, hassas (\"She's sensitive to others' feelings.\") · sensible = mantıklı, akıllıca (\"That's a sensible plan.\")."
  - type: mini_dilbilgisi
    refs: [U2-087, U2-084]
    text: "get high grades = get good marks (İngiliz İngilizcesinde mark da \"not\" demek). Tersi: get low grades. follow the rules'un tersi: break the rules (kuralları çiğnemek)."
  - type: lgs_taktigi
    refs: [U2-084]
    text: "\"Which student does NOT follow the rules?\" gibi sorularda önce kuralları oku, sonra her kişiyi kurallarla tek tek karşılaştır. Kurala aykırı tek kişi cevaptır."

coach:
  start: "Anketin son sayfası! 📝 Bugün Kaan'ın en zor sınavı: ders başlamadan sınıfta olmak."
  end_good: "Bravo! 🎓 Bugünkü beş ifadeyle iyi bir öğrenciyi İngilizce anlatabilirsin. Bir de Kaan'ın zamanında geldiğini gördük; bugün mucizeler günü!"
  end_mixed: "{weak} biraz zorladı ama sorun yok. Murat Bey ne dedi: her gün küçük bir adım. Yarın bir kez daha deneriz! 💪"

notifications:
  morning: "Bora günde 5 dakika çalışıyor ve hedefi büyük. Selin ne diyecek? 📝"
  evening: "Kaan zamanında gelebilecek mi? Mucize 10 dakikalık derste! ⏰"
  review: "Tek soru: \"This homework is unbearable\" = \"I can't stand it\" mı? 🤔"

