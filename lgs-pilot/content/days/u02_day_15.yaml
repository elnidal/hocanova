story:
  - id: s01
    text: "Çarşamba. Anketin son bölümüne gelmişlerdi. Ece soruyu yüksek sesle okudu: \"<en>Last part! Question 9: What makes a good teenager?</en>\""
  - id: s02
    text: "Selin hiç düşünmeden cevap verdi: \"<en>A good teenager {U2-084|follows the rules}. At school, at home, everywhere.</en>\""
  - id: s03
    text: "Tam o sırada kapı açıldı ve Kaan nefes nefese içeri daldı. Ders başlayalı on dakika olmuştu."
  - id: s04
    text: "Ece güldü: \"<en>Kaan, do you {U2-084|follow the rules}? Rule number one: Don't be late!</en>\""
  - id: s05
    text: "Kaan çantasını sıraya bıraktı: \"<en>I always {U2-084|follow the rules}… except that one.</en>\""
  - id: s06
    text: "Sonra Bora söz aldı: \"<en>Question 10: What is your goal this year? Mine is easy. I want to {U2-087|get high grades} in every lesson!</en>\""
  - id: s07
    text: "Selin merakla sordu: \"<en>How many hours do you study a day?</en>\" Bora gururla: \"<en>Five minutes. Sometimes ten.</en>\""
  - id: s08
    text: "Selin derin bir nefes aldı: \"<en>Bora, {U2-085|be realistic}! You can't {U2-087|get high grades} with five minutes a day.</en>\""
  - id: s09
    text: "Bora bir süre düşündü: \"<en>OK, OK. I'll {U2-085|be realistic}: twenty minutes a day. And no phone!</en>\" Herkes alkışladı."
  - id: s10
    text: "Kaan başını sıraya koydu: \"<en>My problem isn't the exams. It's the homework! Three projects, two tests and a survey report. It's {U2-088|unbearable}!</en>\""
  - id: s11
    text: "Elif başını salladı: \"<en>Yes, this week is {U2-088|unbearable}. I'm {U2-071|pretty} tired too.</en>\" Sesi her zamankinden kısıktı."
  - id: s12
    text: "Duru her zamanki gibi pufundaydı ama gözü Elif'teydi. Elif'in en sevdiği şarkıcı konserini iptal etmişti ve Elif sabahtan beri neredeyse hiç konuşmamıştı."
  - id: s13
    text: "Duru çikolatasının yarısını Elif'e uzattı: \"<en>I know you're sad about the concert. Do you want to talk?</en>\" Elif'in yüzünde küçük bir gülümseme belirdi."
  - id: s14
    text: "Ece, Selin'e fısıldadı: \"<en>Duru notices everything. She's very {U2-086|sensitive}.</en>\""
  - id: s15
    text: "Selin anket kâğıdına yazdı: \"<en>Answer to question 9: A good teen is {U2-086|sensitive} to other people's feelings.</en>\""
  - id: s16
    text: "Bu arada Ege de mesajla ankete katıldı: \"<en>A good teen wears {U2-067|formal} clothes, like me and my cousin Kerem!</en>\""
  - id: s17
    text: "Duru telefona bakıp esnedi: \"<en>{U2-067|Formal} clothes? No, thanks. I'm happy in my {U2-068|comfortable} hoodie.</en>\""
  - id: s18
    text: "Bora sırıttı: \"<en>Ege is nicer now, but sometimes he still sounds like a {U2-069|snob}!</en>\" Ece kuzenini savundu: \"<en>He's trying. Remember, he apologised at my party.</en>\""
  - id: s19
    text: "Murat Bey bütün cevapları dinledi: \"<en>So, a good teen is {U1-077|honest}, {U1-076|helpful} and {U2-086|sensitive}. But remember, nobody is perfect. Not even an {U2-072|adult}!</en>\""
  - id: s20
    text: "Kaan şaşırdı: \"<en>Not even you, sir?</en>\" Murat Bey güldü: \"<en>Last week I lost my car keys three times. I'm a very {U2-070|ordinary} man!</en>\""
  - id: s21
    text: "Sonra herkese döndü: \"<en>{U2-085|Be realistic} about your homework. Make a plan, do one task a day, and it won't be {U2-088|unbearable}.</en>\""
  - id: s22
    text: "Kaan o akşam bir plan yaptı. Ve ertesi sabah bir mucize oldu: zil çalmadan Kaan sınıftaydı!"
  - id: s23
    text: "Selin gözlerine inanamadı: \"<en>Kaan! You're on time! Are you OK?</en>\" Kaan: \"<en>New plan. I {U2-084|follow the rules} now, and I want to {U2-087|get high grades} too!</en>\""
  - id: s24
    text: "Bora da sınıf grubuna yazdı: \"<en>Twenty minutes! No phone! I'm a new man!</en>\" Elif hemen cevap verdi: \"<en>Here's a {U1-076|helpful} tip: twenty-one minutes tomorrow!</en>\""

scene:
  - id: c01
    speaker: Ece
    text: "<en>Question 9: What makes a good teenager?</en>"
  - id: c02
    speaker: Selin
    text: "<en>A good teenager follows the rules and is sensitive to other people's feelings.</en>"
  - id: c03
    speaker: Bora
    text: "<en>I want to get high grades, but this homework is unbearable!</en>"
  - id: c04
    speaker: Murat Bey
    text: "<en>Be realistic, Bora. Make a plan and study a little every day.</en>"

