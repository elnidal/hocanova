      - { speaker: "Selin'in dedesi", text: "Önce çorba, sonra köfte; {U3-055|dessert} en sona, yemekten sonra!" }
      - { speaker: "Bora", text: "Ben {U3-055|dessert}'e yer ayırdım; midemin bir köşesi hep boş." }
  - item: U3-058
    durum: "Bora cebinden bir lokum daha çıkarıyor."
    lines:
      - { speaker: "Bora", text: "Şeker, bal, çikolata… ne bulsam yerim. <en>I {U3-058|have a sweet tooth}.</en>" }
      - { speaker: "Selin", text: "Biliyoruz Bora, cebin hiç boş kalmıyor." }
