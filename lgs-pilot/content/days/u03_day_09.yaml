tips:
  - type: hafiza_kancasi
    refs: [U3-055]
    text: "dessert mi desert mi? Tatlıyı hep iki kez istersin: dessert'te iki s var. Tek s'li desert çöl demek. Vurgu da farklı: desSERT (tatlı), DEsert (çöl)."
  - type: tuzak
    refs: [U3-035, U3-055]
    text: "Türkçede \"tatlı\" hem tat hem yiyecek; İngilizcede ayrılır: sweet sıfattır (It's too sweet = fazla tatlı), dessert isimdir (What's for dessert? = Tatlı ne var?)."
  - type: mini_dilbilgisi
    refs: [U3-003]
    text: "freeze düzensiz bir fiildir: freeze – froze – frozen. Freezed denmez: frozen peas (donmuş bezelye), The lake froze last winter."
  - type: kelime_ailesi
    refs: [U3-028]
    text: "delicious / tasty / yummy üçü de lezzetli: delicious en güçlüsü, tasty nötr, yummy samimi ve çocuksu. Dikkat: tasteful \"zevkli\" demek (a tasteful dress); yemek tasty olur."

