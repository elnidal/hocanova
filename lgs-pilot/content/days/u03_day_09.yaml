title: "Babaannenin sırrı"
est_minutes: 10
characters: [Selin, Ece, Elif, Bora, Selin'in babaannesi, Selin'in dedesi]
new_items: [U3-003, U3-028, U3-031, U3-053, U3-055, U3-058]

story:
  - id: s01
    text: "Pazar sabahı, Selin'in babaannesinin evi. Kapıdan girer girmez bağlama sesi duyuldu: Selin'in dedesi her pazar olduğu gibi salonda {U2-026|folk music} çalıyordu. Elif hemen sesiyle ona eşlik etti."
  - id: s02
    text: "Ece, Elif ve Selin defterlerini açtı. Ece'nin katlı pastasının yanına gelecek sır bugün öğrenilecekti. Selin gururluydu: \"<en>My grandma's {U3-031|homemade} ice cream is the best {U3-055|dessert} in İzmir!</en>\""
  - id: s03
    text: "Tam o sırada zil çaldı. Kapıda Bora vardı, elinde kendi kaşığıyla: \"<en>Hello! I heard about the {U3-031|homemade} ice cream. I'm the official taster!</en>\""
  - id: s04
    text: "Elif: \"<en>Bora, you're on the other team!</en>\" Bora: \"<en>I know, I know. But I {U3-058|have a sweet tooth}. I can't stay away from ice cream.</en>\""
  - id: s05
    text: "Babaanne güldü ve onu da içeri aldı: \"<en>Come in, dear. A boy with a {U3-058|sweet tooth} is always welcome in my kitchen.</en>\""
  - id: s06
    text: "Babaanne önlüğünü bağladı: \"<en>So, who is {U3-053|in the mood for} some ice cream today?</en>\" İlk havaya kalkan el, tabii ki Bora'nınkiydi."
  - id: s07
    text: "Babaanne ocağın başına geçti; gençler biraz geride bekledi. \"<en>We {U3-002|boil} the milk, the cream and the sugar together, and we {U3-018|stir} all the time. Slowly, slowly.</en>\""
  - id: s08
    text: "Ece'nin kalemi havada kaldı: \"<en>{U3-047|How much} sugar exactly? {U3-047|How many} grams?</en>\" Babaanne: \"<en>Hmm… a {U3-039|cup}. Maybe a little more. I never measure, dear.</en>\""
  - id: s09
    text: "Ece'nin gözleri büyüdü, Selin'in kaşı havaya kalktı. Babaanne göz kırptı: \"<en>The eyes measure, the hands know.</en>\" Selin bir an düşündü ve defterine yazdı: \"<en>Rule 1: Sometimes there are no rules.</en>\""
  - id: s10
    text: "Süt soğuyunca babaanne hepsini kocaman bir {U3-038|bowl}'a boşalttı: \"<en>Now we {U3-012|cover} the {U3-038|bowl}, and it goes into the {U3-003|freezer}.</en>\""
  - id: s11
    text: "Elif: \"<en>{U3-047|How long} does it stay in the {U3-003|freezer}?</en>\" Babaanne: \"<en>Four hours. But every hour, we take it out and {U3-018|stir} it. That's the secret: no ice, only cream.</en>\""
  - id: s12
    text: "Bora: \"<en>Four hours?! Can't we {U3-003|freeze} it faster? I can't wait four hours!</en>\""
  - id: s13
    text: "Bundan sonrası bir döngüydü. Her saat başı babaanne {U3-038|bowl}'u çıkardı, her saat başı Bora kaşığını uzattı: \"<en>Just to {U3-036|taste}! Mmm… {U3-028|delicious}!</en>\""
  - id: s14
    text: "İkinci saat: \"<en>Just to {U3-036|taste}… so {U3-028|yummy}!</en>\" Üçüncü saat: \"<en>Just to check the sugar… {U3-028|tasty}!</en>\" Bora'nın kaşığı her seferinde biraz daha büyüyordu."
  - id: s15
    text: "Bu arada babaanne süslemeye geçti: \"<en>On top, we {U3-024|sprinkle} some pistachios and {U3-015|grate} a little dark chocolate.</en>\""
  - id: s16
    text: "Elif'e de bir kavanoz vişne düştü. Babaanne: \"<en>These cherries are from my garden. {U3-014|Drain} them well, Elif. We only want the fruit.</en>\""
  - id: s17
    text: "Dördüncü saat. Babaanne {U3-003|freezer}'ı açıp {U3-038|bowl}'u çıkardı. Dibinde ancak üç kaşıklık bir şey kalmıştı."
  - id: s18
    text: "Bütün gözler Bora'ya döndü. Bora kaşığını arkasına sakladı: \"<en>What? I only {U3-036|tasted} it. Four times. Maybe five.</en>\""
  - id: s19
    text: "Selin: \"<en>Bora! Now we have no {U3-055|dessert} for the photo!</en>\" Salondan dedenin sesi geldi: \"<en>And none for me? I'm {U3-053|in the mood for} ice cream too!</en>\""
  - id: s20
    text: "Babaanne hiç kızmadı. Arka odadaki büyük {U3-003|freezer}'dan iki {U3-038|bowl} daha çıkardı: \"<en>I always make three. Grandmas know about boys with a {U3-058|sweet tooth}.</en>\""
  - id: s21
    text: "Ece babaannenin boynuna sarıldı: \"<en>You're so {U1-074|generous}! And this is the most {U3-028|delicious} ice cream in the world.</en>\""
  - id: s22
    text: "Herkes vişneli porsiyonunu aldı; dede bile bağlamayı bırakıp mutfağa geldi. Elif: \"<en>Shop ice cream is OK, but {U3-031|homemade} is a different world!</en>\""
  - id: s23
    text: "Babaanne sordu: \"<en>One more, Bora?</en>\" Bora üçüncü porsiyonunu kaşıklarken ciddi ciddi başını salladı: \"<en>No, thank you. I'm {U1-099|stuffed}. I'm not really {U3-053|in the mood for} {U3-055|dessert} today.</en>\""
  - id: s24
    text: "Elif kahkahayı bastı: \"<en>Bora, that's your third bowl!</en>\" Bora: \"<en>Exactly. I'm not {U3-053|in the mood for} a fourth.</en>\""
  - id: s25
    text: "Akşam Ece gruba yazdı: \"<en>Thursday: {U3-050|recipe} cards and final menus. Friday: the final!</en>\" Kaan: \"<en>And no more {U3-036|tasting} for Bora!</en>\" Bora: \"<en>{U3-047|How many} spoons is 'no more'?</en>\""

scene:
  - id: c01
    speaker: Selin'in babaannesi
    text: "<en>Who is in the mood for some homemade ice cream?</en>"
  - id: c02
    speaker: Bora
    text: "<en>Me! I have a sweet tooth. Dessert is my favourite part of the day.</en>"
  - id: c03
    speaker: Elif
    text: "<en>How long does it stay in the freezer?</en>"
  - id: c04
    speaker: Selin
    text: "<en>Four hours. But Bora tasted it every hour!</en>"
  - id: c05
    speaker: Bora
    text: "<en>Only because it's delicious!</en>"

