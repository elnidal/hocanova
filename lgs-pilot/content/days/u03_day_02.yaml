story:
  - id: s01
    text: "Cumartesi, saat iki, Ece'nin evi. Ece mutfak masasına üç önlük, plan defterini ve bir fotoğraf dizmişti: doğum günündeki o ünlü şapka pastanın fotoğrafı."
  - id: s02
    text: "Ece fotoğrafı ters çevirdi: \"<en>Never again. Today we {U3-001|bake} a perfect cake. No hats!</en>\" Elif kepçeyi mikrofon gibi tuttu: \"<en>Yes, chef!</en>\""
  - id: s03
    text: "Ece'nin annesi de yanlarına geldi: \"<en>I'm right here, girls. I'll help you with the {U3-040|oven}.</en>\""
  - id: s04
    text: "Selin telefonundan okudu: \"<en>{U3-045|First}, {U3-006|preheat} the {U3-040|oven} to 180 degrees.</en>\" Ece'nin annesi düğmeyi çevirdi; camın arkasında turuncu bir ışık yandı. Bu kez kimse onu radyo sanmadı."
  - id: s05
    text: "Elif şaşırdı: \"<en>Why do we {U3-006|heat} it now? The cake isn't ready!</en>\" Selin parmağını kaldırdı: \"<en>Because the {U3-040|oven} must be hot when the cake goes in. That's the rule.</en>\""
  - id: s06
    text: "Selin listeyi yüksek sesle okudu: \"<en>{U3-048|Ingredients}: two {U3-039|cups} of {U3-046|flour}, one {U3-039|cup} of sugar, three eggs, half a {U3-039|cup} of milk and some oil.</en>\""
  - id: s07
    text: "Elif paketi biraz fazla hızlı açtı. Mutfakta beyaz bir bulut yükseldi ve üçü de bir anda bembeyaz oldu. Elif öksürdü: \"<en>Oops! The {U3-046|flour} is everywhere! We look like snowmen!</en>\""
  - id: s08
    text: "Ece hiç gülmedi. Her {U3-039|cup} için masaya eğilip çizgiye tek gözle baktı: \"<en>Exactly one {U3-039|cup}. Not more, not less.</en>\""
  - id: s09
    text: "Sıra son şeye geldi. Selin okudu: \"<en>And the {U3-043|baking powder}: one {U3-042|teaspoon}. It makes the cake rise.</en>\""
  - id: s10
    text: "Tam o sırada Elif kepçe mikrofonuyla Luna Ray'in yeni şarkısına başladı. Selin bir an ona baktı, eli çekmecede küçük olanın yanındaki büyüğünü buldu: \"<en>One {U3-042|tablespoon}… done!</en>\""
  - id: s11
    text: "Ece kek harcını kalıba aldı, annesi de kalıbı {U3-040|oven}'a yerleştirdi: \"<en>Now we {U3-001|bake} it for forty minutes. Don't open the door, girls!</en>\""
  - id: s12
    text: "Üçü de camın önüne dizildi. On dakika… yirmi dakika… Kek kabardı, kabardı, kabarmaya devam etti."
  - id: s13
    text: "Otuzuncu dakikada kek kalıptan taştı ve köpüre köpüre aşağı aktı. Elif bağırdı: \"<en>It's a volcano! Like at the science fair!</en>\""
  - id: s14
    text: "Ece'nin annesi {U3-040|oven}'ı kapatıp kalıbı dikkatle çıkardı. Elif telefonuyla fotoğraf çekti: \"<en>Well, it's very {U2-076|impressive}… for a volcano.</en>\" Ece ellerini yüzüne kapadı: \"<en>Not again! {U3-045|First} a hat, now a volcano!</en>\""
  - id: s15
    text: "Ece'nin annesi kutuya bir göz attı ve gülümsedi: \"<en>Girls, who measured the {U3-043|baking powder}?</en>\""
  - id: s16
    text: "Selin hiç duraksamadan elini kaldırdı: \"<en>Me. {U2-018|To be honest}, I used a {U3-042|tablespoon}, not a {U3-042|teaspoon}. It's my mistake.</en>\""
  - id: s17
    text: "Ece'nin annesi çekmeceden ikisini çıkarıp yan yana tuttu: \"<en>Look: a {U3-042|teaspoon} is small, a {U3-042|tablespoon} is big. It's three times bigger!</en>\""
  - id: s18
    text: "Selin başını eğdi: \"<en>I {U1-002|apologise}, Ece. I always follow the {U3-050|recipe}, and today…</en>\" Ece arkadaşına sarıldı: \"<en>It's OK. You told the truth. That's more important than a cake.</en>\""
  - id: s19
    text: "Elif volkanın kenarından bir parça kopardı, ağzına attı ve gözleri parladı: \"<en>Hmm! It looks strange, but it's really good!</en>\""
  - id: s20
    text: "Ece derin bir nefes aldı ve defterini açtı: \"<en>OK, team. New plan. Tomorrow we {U3-001|bake} again. We {U3-006|preheat} the {U3-040|oven}, Selin reads, I check every {U3-039|cup}…</en>\""
  - id: s21
    text: "\"<en>…and Elif doesn't touch the {U3-046|flour}!</en>\" Elif üstündeki beyaz tozu silkeledi: \"<en>Fair!</en>\""
  - id: s22
    text: "Akşam Selin sınıf grubuna volkan kekin fotoğrafını attı. Altına yazdı: \"<en>Today's lesson: one {U3-042|teaspoon} of {U3-043|baking powder}, not one {U3-042|tablespoon}. 🌋</en>\""
  - id: s23
    text: "Kaan hemen cevap verdi: \"<en>Can I eat the volcano? Tomorrow our team cooks breakfast at Duru's. Bora, can you cook?</en>\""
  - id: s24
    text: "Bora'nın cevabı tam bir saat gecikmeyle geldi: \"<en>Sorry, I can't. My cat is sick.</en>\" Selin tek kelime yazdı: \"<en>Bora. You don't have a cat.</en>\""

scene:
  - id: c01
    speaker: Selin
    text: "<en>First, preheat the oven. Then, we need two cups of flour and one teaspoon of baking powder.</en>"
  - id: c02
    speaker: Elif
    text: "<en>Look! The cake is coming out of the oven! It's a volcano!</en>"
  - id: c03
    speaker: Selin
    text: "<en>It's my mistake. I used a tablespoon, not a teaspoon.</en>"
  - id: c04
    speaker: Ece
    text: "<en>It's OK. Tomorrow we bake it again, and I check every cup!</en>"

