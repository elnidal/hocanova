tips:
  - type: tuzak
    refs: [U3-039]
    text: "cup sadece \"fincan\" değil! Tarifte bir ölçüdür: two cups of flour = iki su bardağı (ölçü) un. Malzeme listesinde cup görürsen ölçü diye oku."
  - type: hafiza_kancasi
    refs: [U3-046]
    text: "flour (un) ve flower (çiçek) aynı okunur: /flaʊə/. Kekin içine çiçek koymuyoruz; tarifte hep un!"
  - type: ilginc_bilgi
    refs: [U3-042]
    text: "İngilizce tariflerde tsp = teaspoon (yaklaşık 5 ml), tbsp = tablespoon (yaklaşık 15 ml). Yani bir tablespoon yaklaşık üç teaspoon eder. Selin'in keki bu yüzden volkana döndü!"
  - type: mini_dilbilgisi
    refs: [U3-046, U3-039, U3-042]
    text: "flour, sugar, milk sayılamaz: \"two flours\" denmez. Miktar ölçüyle verilir: two cups of flour, a teaspoon of sugar, half a cup of milk."

coach:
