  end_good: "Süpersin! Selin'in volkanından sonra artık teaspoon ile tablespoon'u hiç karıştırmazsın. 🌋"
  end_mixed: "Güzel iş! {weak} biraz kabardı ama taşmadı. Selin bile yanlış ölçtü; yarın bir kez daha deneyeceğiz."

