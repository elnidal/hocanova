story:
  - id: s01
    text: "Cumartesi sabahı, saat yedi. Bora hayatında ilk kez bir cumartesi bu kadar erken uyandı. Onu uyandıran alarm değildi: telefonu durmadan ötüyordu."
  - id: s02
    text: "Telefonda kocaman bir sayı: \"<en>63 new {U5-033|notifications}</en>\". İlki Kaan'dandı: \"<en>Bora, why did you {U5-034|post} the karate cat video AGAIN? At four in the morning?!</en>\""
  - id: s03
    text: "Elif: \"<en>And what are these? 'CHEAP SUNGLASSES! BUY NOW!' in five languages! Your {U5-030|followers} are confused!</en>\""
  - id: s04
    text: "Kaan: \"<en>Even Arda {U5-028|commented}: 'Karate boy, are you OK? Why two cats?' 😂</en>\""
  - id: s05
    text: "Bora yataktan fırladı, kullanıcı adını ve parolasını girdi: \"<en>Wrong password.</en>\" Bir daha denedi. Yine aynı kırmızı yazı."
  - id: s06
    text: "Bora: \"<en>I can't {U5-001|access} my account! Somebody changed my password!</en>\" Sonra her şeyi hatırladı: altın davul, yanıp sönen kırmızı kutu, geri sayım, o yeşil düğme… Midesi düğümlendi."
  - id: s07
    text: "Parmakları eski günlerdeki gibi bir mesaja başladı: \"<en>My cat did it…</en>\" Sonra durdu. {U5-018|Delete} tuşuna üç kez dokundu ve gruba bambaşka bir mesaj gönderdi."
  - id: s08
    text: "Bora: \"<en>Guys, I'm really {U4-050|embarrassed}, but I have to be {U1-077|honest}. It was my mistake. {U5-054|I mean}, yesterday I gave my password to that fake {U5-031|influencer}.</en>\""
  - id: s09
    text: "Selin: \"<en>Thank you for telling us so quickly, Bora. That was very {U1-077|honest}.</en>\" Kaan: \"<en>No excuse? No cat? Who are you, and what did you do with Bora?</en>\""
  - id: s10
    text: "Duru'nun mesajı her zamanki gibi kısaydı, ama bu kez saat sekizden önce gelmişti: \"<en>Step one: tell your mum. Now.</en>\""
  - id: s11
    text: "Annesi gece nöbetinden yeni dönmüştü; dedesi de nöbet gecelerindeki gibi salondaydı. Bora mutfağa gitti ve her şeyi en baştan anlattı: altın davul, form, parola."
  - id: s12
    text: "Annesi çay bardağını bıraktı: \"<en>OK. Thank you for telling me. We'll {U4-055|solve} this together. Show me.</en>\""
  - id: s13
    text: "Laptopun başına oturdular. Bora: \"<en>Look at the {U5-021|screen}, Mum. It says: 'Can't {U5-001|access} your account? Click here.' So we click, and then we make a new password.</en>\""
  - id: s14
    text: "Annesi gözlüğünü taktı: \"<en>This {U5-021|screen} is so small… Click? New password? {U5-055|Sorry, I can't follow you}, Bora. Slowly, please. I'm a nurse, not a computer.</en>\""
  - id: s15
    text: "Bora yavaşladı: \"<en>{U5-054|In other words}, a {U5-013|stranger} is using my account. We need a new password, and we have to {U5-018|delete} his posts.</en>\""
  - id: s16
    text: "Annesi bir an düşündü, sonra tam bir hemşire gibi özetledi: \"<en>So your account is sick, and a new password is the medicine?</en>\" Bora: \"<en>Er… no, Mum. But… yes. Exactly.</en>\""
  - id: s17
    text: "Annesi: \"<en>Ah, {U5-055|I got it}! Then let's give it the medicine.</en>\" Az sonra annesinin telefonuna bir kod geldi. Bora: \"<en>Mum, the code is on your {U5-021|screen}. Read it to me, please.</en>\""
  - id: s18
    text: "Bora: \"<en>My old password was 'mydog123'.</en>\" Annesi gözlüğünün üstünden baktı: \"<en>But you don't even have a dog!</en>\""
  - id: s19
    text: "Yeni parola uzundu; içinde rakamlar ve işaretler vardı; ne kedi vardı ne köpek. Bora: \"<en>Yes! I can {U5-001|access} my account again!</en>\""
  - id: s20
    text: "Sonra temizlik başladı: \"<en>Karate cat: {U5-018|deleted}. Sunglasses: {U5-018|deleted}. Five languages: {U5-018|deleted}.</en>\""
  - id: s21
    text: "Dedesi salondan seslendi: \"<en>Too late! I {U5-019|downloaded} the karate cat this morning. I'm watching it for the third time!</en>\""
  - id: s22
    text: "Annesi: \"<en>{U5-053|By the way}, Bora… who is this 'DrumKing'? Is he a real drummer?</en>\" Bora: \"<en>No, Mum. Duru says his photo is from a shop's website.</en>\""
  - id: s23
    text: "Grupta Kaan yine durmuyordu: \"<en>{U5-053|By the way}, the karate cat got 300 new likes this morning. Maybe keep it? 😅</en>\" Selin: \"<en>Kaan.</en>\" Kaan: \"<en>Sorry.</en>\""
  - id: s24
    text: "Selin: \"<en>Bora, use a different password for every account, and never put your name or birthday in it.</en>\" Kaan: \"<en>Different, no names, no birthdays… {U5-055|Sorry, I can't follow you}, Selin. I'm still in bed.</en>\""
  - id: s25
    text: "Öğlene doğru Bora gruba haber verdi: \"<en>I'm going to {U5-025|upload} a short video for my followers. Here's my new {U5-034|post}: 'That wasn't me. I clicked on a free drum set link. {U5-054|In other words}: don't make my mistake!'</en>\""
  - id: s26
    text: "Duru: \"<en>Good job, Bora. Your story goes in our Safer Internet Week guide. {U5-053|By the way}, Fıstık says hello.</en>\""
  - id: s27
    text: "O akşam Kaan, Bora'nın videosunu on iki gruba birden iletti: \"<en>Done! Everybody must see this!</en>\" Selin: \"<en>Did you watch it first?</en>\" Uzun bir sessizlik. Kaan: \"<en>…Not yet.</en>\""

