tips:
  - type: tuzak
    refs: [U4-035]
    text: "book isim olarak \"kitap\"tır; ama ardından a table / a room / a ticket / the stage gelirse fiildir: ayırtmak. \"The stage is booked\" = sahne ayrılmış. Eş anlamlısı reserve, ismi reservation."
  - type: lgs_taktigi
    refs: [U4-053, U4-037]
    text: "Telefon diyaloğunda \"Sorry to disturb you, but…\" diyen kişi arayandır ve bir ricası vardır. \"I'm calling to confirm…\" cümlesi ise \"Why is X calling?\" sorusunun cevabını doğrudan verir."
  - type: kelime_ailesi
    refs: [U4-003, U4-052]
    text: "connect (fiil) → connection (isim): internet connection, bad connection. polite'ın zıttı impolite ya da rude'dur; polite kişi please, thank you, could you kullanır."
  - type: mini_dilbilgisi
    refs: [U4-033]
    text: "appointment ünlüyle başladığı için an alır: make an appointment, have an appointment with the dentist. Saatle birlikte at kullanılır: an appointment at five."

