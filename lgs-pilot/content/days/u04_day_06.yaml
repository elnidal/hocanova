title: "Kırk yıllık davul"
est_minutes: 10
characters: [Bora, Selin, Ahmet Amca, Duru, Ece, Kaan, genel merkezdeki görevliler]
new_items: [U4-003, U4-033, U4-035, U4-037, U4-052, U4-053]

story:
  - id: s01
    text: "Cuma sabahı, saat sekiz. Bora yatağında tavana bakıyordu: prova yarın beşteydi ve grubun davulcusunun hâlâ bir davulu yoktu. Mutfaktaki tencereler ona göz kırpıyor gibiydi."
  - id: s02
    text: "Bora grubun santralini, Urla'daki Selin'i aradı: \"<en>Selin, you know everybody's number. I need a drum kit. Today!</en>\""
  - id: s03
    text: "Selin babaannesinin kahvaltı masasından cevap verdi: \"<en>Ahmet Amca, Duru's neighbour! He played in a {U2-026|folk music} band when he was young. Duru gave me his number for emergencies. You know, Duru never picks up.</en>\""
  - id: s04
    text: "Bora: \"<en>Great! I'll call him now: 'Hey, Ahmet Amca, give me your drums!'</en>\" Selin: \"<en>Stop! Not like that. Be {U4-052|polite}. Start with: 'Good morning. Sorry to {U4-053|disturb} you, but…'</en>\""
  - id: s05
    text: "Selin bir öğretmen gibi devam etti: \"<en>Then say your name and why you're calling. And don't forget 'please' and 'thank you'. {U4-052|Polite} words open doors… and garages.</en>\""
  - id: s06
    text: "Bora aynanın karşısında üç kez prova yaptı. Ne olur ne olmaz diye kırmızı papyonunu bile taktı. Telefonda kimse görmeyecekti, ama olsun."
  - id: s07
    text: "Bora: \"<en>Good morning, Ahmet Amca. This is Bora, Duru's friend. Sorry to {U4-053|disturb} you, but I'm {U4-024|calling about} a drum kit. Do you still have one, please?</en>\""
  - id: s08
    text: "Ahmet Amca kahkahayı bastı: \"<en>You aren't {U4-053|disturbing} me, son! You're the most {U4-052|polite} drummer in İzmir. Yes, my old drum kit is in the garage, under forty years of dust.</en>\""
  - id: s09
    text: "Ahmet Amca: \"<en>We played {U2-026|folk music} with it, but drums don't mind. Rock, pop, jazz… Come at eleven and take it. Look after it, OK?</en>\""
  - id: s10
    text: "Saat on biri bir geçe Bora garajdaydı. Duru, kanepesinden kalkmadan pencereden Bora'nın davulları tek tek taşımasını izledi. Az sonra sınıf grubuna bir fotoğraf düştü: \"<en>I said 'Leave it to me.' I {U1-054|kept my promise}! 🥁</en>\""
  - id: s11
    text: "Bursa'da ise menajer Ece dertliydi: \"<en>Last night I {U4-035|booked} the stage at Sevim's café for the concert next Saturday. I also made an {U4-033|appointment} with the sound technician, next Saturday at five. But there's no email! Nothing!</en>\""
  - id: s12
    text: "Ece: \"<en>My aunt's internet {U4-003|connection} broke in the middle. Now I can't {U4-003|connect} to anything! Maybe our {U4-035|reservation} isn't there!</en>\""
  - id: s13
    text: "Kaan bunu duyar duymaz, kimseye bir şey sormadan pastanenin genel merkezini aradı. Yine koşuyordu, yine nefes nefeseydi."
  - id: s14
    text: "Görevli sakin bir sesle açtı: \"<en>Good morning, head office. {U4-020|How can I help you}?</en>\" Kaan: \"<en>Hey! Is the stage {U4-035|booked} or not? Yes or no? Quick, I've got practice!</en>\""
  - id: s15
    text: "Görevli: \"<en>Er… there's a booking for next Saturday, but nobody {U4-037|confirmed} it. Do you want me to cancel it?</en>\" Kaan, bir yandan ayakkabısını giyerken: \"<en>Yes! I mean, no! I mean… I'm late! Bye!</en>\""
  - id: s16
    text: "İki dakika sonra sınıf grubunda Kaan'dan bir mesaj: \"<en>Good news: I called them. Bad news: I think I said 'Yes, cancel it.' 😬</en>\" Ece'nin çığlığı Bursa'dan Urla'ya kadar duyuldu."
  - id: s17
    text: "Selin babaannesinin bahçesinde vişne ağacının altına koştu; Urla'da telefonun en iyi çektiği yer orasıydı: \"<en>Don't panic. Good {U4-003|connection} here. I'll call them {U1-094|as soon as possible}. Which means now.</en>\""
  - id: s18
    text: "Selin: \"<en>Good morning. Sorry to {U4-053|disturb} you. I'm {U4-024|calling about} the stage for next Saturday evening.</en>\" Görevli güldü: \"<en>Ah, the band! Your last {U4-002|caller} was in a big hurry.</en>\""
  - id: s19
    text: "Hattın öbür ucundaki {U4-042|secretary}: \"<en>Bookings are on {U4-017|extension} 30. Hold on, please. I'll {U4-012|put you through}.</en>\""
  - id: s20
    text: "Selin: \"<en>Hello. Could you {U4-037|confirm} our {U4-035|reservation}, please? The stage next Saturday at seven, and the sound technician's {U4-033|appointment} at five.</en>\""
  - id: s21
    text: "Bu kez başka bir ses cevap verdi, biraz bekletti, sonra: \"<en>Yes, I can see it. Everything is {U4-037|confirmed} now. Don't worry, nobody cancelled anything. Your friend just talked very fast!</en>\""
  - id: s22
    text: "Selin gruba yazdı: \"<en>Stage: {U4-035|booked}. Sound technician's {U4-033|appointment}: next Saturday at five. Everything {U4-037|confirmed}. No email needed. 📋</en>\""
  - id: s23
    text: "Tam o an Ece'nin teyzesinin modemi yeşil yandı ve e-posta da düştü. Ece: \"<en>The internet {U4-003|connection} is back! And here's the email! Selin, you're my hero!</en>\""
  - id: s24
    text: "Kaan: \"<en>So… I helped, right? 😅</en>\" Selin: \"<en>You did, Kaan. You showed us how NOT to call.</en>\""
  - id: s25
    text: "Gece yarısına doğru, hiç beklenmedik birinden, Duru'dan bir mesaj geldi: \"<en>I ordered a speaker for the concert. Online. By myself. It comes on Monday.</en>\" Kaan: \"<en>Duru? Online? By herself? Is she OK?!</en>\""

scene:
  - id: c01
    speaker: Selin
    text: "<en>Be polite, Bora. Start with 'Sorry to disturb you, but…'</en>"
  - id: c02
    speaker: Bora
    text: "<en>Good morning, Ahmet Amca. Sorry to disturb you, but can I borrow your old drum kit?</en>"
  - id: c03
    speaker: Ece
    text: "<en>I booked the stage and made an appointment with the sound technician, but my internet connection broke.</en>"
  - id: c04
    speaker: Selin
    text: "<en>Don't worry. I called the head office, and they confirmed everything.</en>"

