    durum: "Ece takımın kartını yüksek sesle okuyor; Selin limonu sıkıyor."
    lines:
      - { speaker: "Ece", text: "Kart diyor ki: <en>{U3-061|Add} lemon juice {U3-061|to} the chicken.</en> Ne kadar?" }
      - { speaker: "Selin", text: "İki kaşık. Fazlası ekşi olur!" }
  - item: U3-062
    durum: "Bora sütlaç planını anlatıyor; Duru'nun annesi dinliyor."
    lines:
      - { speaker: "Bora", text: "Sütlacın {U3-062|preparation}'ı iki saat sürüyor; o yüzden bu akşam başlıyoruz." }
      - { speaker: "Duru'nun annesi", text: "Ocağın başında ben de olacağım, merak etme." }
  - item: U3-063
    durum: "Murat Bey, Kaan takımının kartını okuyor."
    lines:
      - { speaker: "Murat Bey", text: "İzmir köftesi çok {U3-063|well-known}; Türkiye'de herkes adını bilir." }
      - { speaker: "Duru", text: "Annem hep der ki: yüz yıllık, {U3-063|traditional} bir yemek bu." }
