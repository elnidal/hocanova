tips:
  - type: tuzak
    refs: [U3-056]
    text: "İkisi de \"yemek\" diye çevrilir ama aynı şey değil: dish = tabakta sunulan yemek (a Turkish dish), meal = öğün (three meals a day). Dikkat: do the dishes = bulaşık yıkamak!"
  - type: tuzak
    refs: [U3-061]
    text: "Sınavda en sık çıkan iki tarif fiili put ve add; sorulan şey çoğu zaman edattır: put it into the oven (içine), add the sugar to the milk (-e). \"put it to the oven\" yanlıştır."
  - type: ilginc_bilgi
    refs: [U3-054]
    text: "cuisine Fransızcadan gelir ve \"kuizin\" (/kwɪˈziːn/) diye okunur. Turkish cuisine = Türk mutfağı (yemek kültürü); evdeki mutfak odası ise kitchen."
  - type: kelime_ailesi
    refs: [U3-062, U3-063]
    text: "prepare (hazırlamak) → preparation (hazırlık): \"Preparation starts now.\" · tradition (gelenek) → traditional (geleneksel): \"a traditional dish\"."

