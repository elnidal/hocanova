story:
  - id: s01
    text: "Perşembe sabahı. Junior Chef finaline yalnızca bir gün kalmıştı. Murat Bey tahtaya kocaman harflerle yazdı: \"<en>{U3-050|RECIPE CARDS}: TODAY!</en>\""
  - id: s02
    text: "Murat Bey kuralları bir kez daha hatırlattı: \"<en>Every team needs a {U3-060|main course} and a {U3-055|dessert}. And your {U3-060|main course} must come from Turkish {U3-054|cuisine}!</en>\""
  - id: s03
    text: "Ece takımının kartı çoktan bitmişti: limonlu tavuk ve üç katlı pasta. Selin pastanın kartını virgülüne kadar kontrol etti ve yüksek sesle okudu: \"<en>{U3-009|Melt} the butter and {U3-011|combine} it with the sugar. Then, {U3-061|add} the flour {U3-061|to} the bowl, one cup at a time.</en>\""
  - id: s04
    text: "Ece parmağını kaldırdı: \"<en>And don't forget: {U3-023|spread} the chocolate cream between the layers. Three perfect layers!</en>\" Elif arkadan mırıldandı: \"<en>Perfect… perfect… la la la.</en>\""
  - id: s05
    text: "Kaan takımının kartında ise tek bir satır vardı: \"<en>Our {U3-060|main course}: ???</en>\" Kaan parmaklarını şıklattı: \"<en>Pizza! Everybody loves pizza!</en>\""
  - id: s06
    text: "Bora başını iki yana salladı: \"<en>Pizza is Italian {U3-054|cuisine}, buddy. We need a Turkish {U3-056|dish}.</en>\""
  - id: s07
    text: "Kaan Bora'ya baktı, Bora Duru'ya. Duru her zamanki gibi omuz silkti: \"<en>{U1-014|It doesn't matter}…</en>\""
  - id: s08
    text: "Ama cümlenin gerisi gelmedi. Duru doğruldu ve kimsenin alışık olmadığı kararlı bir sesle konuştu: \"<en>No. It matters. We make my mum's {U3-056|dish}: İzmir köftesi.</en>\""
  - id: s09
    text: "Kaan'ın ağzı açık kaldı; Duru müzik dışında hiçbir konuda bu kadar net konuşmamıştı. Duru devam etti: \"<en>It's a {U3-063|well-known}, {U3-063|traditional} {U3-056|dish} from İzmir. My grandma made it, and her mum made it too.</en>\""
  - id: s10
    text: "Bora hemen atıldı: \"<en>And for {U3-055|dessert}, my rice pudding. Leave it to me.</en>\" Murat Bey kartı okudu ve gülümsedi: \"<en>A very {U3-063|traditional} menu. Good choice!</en>\""
  - id: s11
    text: "Akşam son prova için Duru'nun evinde toplandılar. Duru'nun annesi tezgâhın başındaydı; bıçak ve ocak işi her zamanki gibi onun gözetimindeydi."
  - id: s12
    text: "Kartı o okudu: \"<en>This is the {U3-063|traditional} way, kids. {U3-045|First}, {U3-016|knead} the minced meat with an egg, some bread and {U3-037|a bunch of} parsley.</en>\""
  - id: s13
    text: "Bora kollarını sıvadı; elleri öyle düzenli çalışıyordu ki Kaan şaşırdı. Bora göz kırptı: \"<en>It's like pizza {U3-044|dough}, buddy. You {U3-016|knead} it slowly.</en>\" Duru kanepeden seslendi: \"<en>And Fıstık is in the garden this time.</en>\""
  - id: s14
    text: "Derken Bora sütün başına geçti, kaşığı baget gibi tencerenin kenarına vura vura konuştu: \"<en>{U3-061|Add} the sugar {U3-061|to} the warm milk and stir. Never stop stirring!</en>\""
  - id: s15
    text: "Duru'nun annesi tepsiyi gösterdi: \"<en>Now {U3-061|put} the meatballs and the potatoes {U3-061|into} the {U3-040|oven}. 180 degrees for forty minutes.</en>\" Tam o sırada annesinin telefonu çaldı; tezgâhın öbür ucunda, sırtı dönük konuşmaya başladı."
  - id: s16
    text: "Kaan saate baktı: \"<en>Forty minutes?! The final is tomorrow, not next year!</en>\" Ve kimse görmeden düğmeyi 180'den 250'ye çevirdi."
  - id: s17
    text: "On beş dakika geçmeden {U3-040|oven}'dan gri bir duman yükseldi. Köfteler kömüre dönmüştü. Duru'nun annesi telefonu bırakıp hemen düğmeyi kapattı ve pencereyi açtı."
  - id: s18
    text: "Duru, Kaan'a baktı: \"<en>Kaan, you're {U1-075|always in a hurry}. Even meatballs need time.</en>\""
  - id: s19
    text: "Tam o anda sınıf grubuna Ece'den bir fotoğraf düştü: pastanın ortası çökmüştü. Altında tek satır: \"<en>Three layers… now one layer. 😭</en>\" Selin hemen yazdı: \"<en>Don't panic. We can {U3-062|prepare} a new one tonight.</en>\""
  - id: s20
    text: "Kaan yere çöktü: \"<en>I'm sorry, guys. I ruined our {U3-060|main course}. Maybe you need a new team member.</en>\""
  - id: s21
    text: "Eskiden olsa Bora hemen bir bahane bulurdu. Bu kez Kaan'ın yanına oturdu: \"<en>No way. I was in the room too, so it's my mistake too. We'll {U3-062|prepare} it again. Together.</en>\""
  - id: s22
    text: "Duru da yanlarına çöktü: \"<en>That's what friends do. We {U1-064|support each other}.</en>\""
  - id: s23
    text: "Duru'nun annesi Kaan'a bir önlük uzattı: \"<en>Good. {U3-062|Preparation} starts now. Turkish {U3-054|cuisine} needs time, Kaan. This time the timer decides, not you.</en>\""
  - id: s24
    text: "Gece onda ikinci deneme bitti. Kaan kırk dakika boyunca saatin karşısında nöbetçi gibi oturdu; köfteler bu kez tam kıvamındaydı. Bora gerindi: \"<en>Ten o'clock. This is my fourth {U3-056|meal} today!</en>\""
  - id: s25
    text: "Duru lavaboda yükselen dağa baktı: \"<en>OK. Who's doing the {U3-056|dishes}?</en>\" Kaan ve Bora aynı anda: \"<en>Not me!</en>\""
  - id: s26
    text: "Gece yarısı Ece'den yeni bir fotoğraf geldi: üç kat, dimdik ayakta. \"<en>Cake number two is standing! OK… it looks a bit like a hat. 🎩</en>\""
  - id: s27
    text: "Grupta son mesaj Kaan'dan geldi: \"<en>See you tomorrow at nine. Me? Late? Never!</en>\" Duru tek kelime yazdı: \"<en>Timer.</en>\""

scene:
  - id: c01
    speaker: Duru
    text: "<en>No. It matters. We make my mum's dish. It's a well-known traditional dish from İzmir.</en>"
  - id: c02
    speaker: Duru'nun annesi
    text: "<en>Put the meatballs into the oven and add the sugar to the milk.</en>"
  - id: c03
    speaker: Bora
    text: "<en>We burnt our main course, but we'll prepare it again. Together.</en>"
  - id: c04
    speaker: Ece
    text: "<en>Main course: ready. Dessert: still standing!</en>"

