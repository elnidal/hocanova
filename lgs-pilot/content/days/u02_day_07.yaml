story:
  - id: s01
    text: "Salı, teneffüs. Kaan hâlâ basketbol hayalleri kuruyor ve herkesi peşinden sürüklemeye çalışıyor."
  - id: s02
    text: "Kaan: \"<en>Bora, come to the tryouts with me! Basketball is the best team sport!</en>\" Ece: \"<en>Kaan, don't be so {U1-091|stubborn}. He said no three times.</en>\""
  - id: s03
    text: "Bora: \"<en>In a team, everybody shouts at you when you miss the ball. No, thanks. I want an {U2-037|individual sport}.</en>\""
  - id: s04
    text: "Elif hemen fırsatı yakaladı: \"<en>Or you can play in our {U2-019|band}, not only take photos! We still need a drummer. Be a real {U2-020|member}!</en>\""
  - id: s05
    text: "Bora: \"<en>Me? On drums? OK, why not! But I also need a sport for my body, not only for my ears.</en>\""
  - id: s06
    text: "Selin: \"<en>What about tennis or swimming? They're both {U2-037|individual sports}.</en>\" Bora: \"<en>Swimming? Cold water at 7 a.m.? Never!</en>\""
  - id: s07
    text: "O akşam Bora uzun uzun araştırdı. Gece yarısına doğru gruba bir mesaj düştü:"
  - id: s08
    text: "Bora: \"<en>Big news! From Saturday, I {U2-038|do karate}! 🥋</en>\""
  - id: s09
    text: "Kaan: \"<en>You {U2-038|do karate}? Bora, you fell over a coffee table last week!</en>\""
  - id: s10
    text: "Cumartesi sabahı ilk ders. Hoca Japon bir usta değil, mahalleden Gül Hanım'dı. Çok ciddi görünüyordu."
  - id: s11
    text: "Gül Hanım: \"<en>Welcome! So, why do you want to {U2-038|do karate}?</en>\" Bora: \"<en>To be strong… and to be the coolest person in my class.</en>\""
  - id: s12
    text: "Gül Hanım: \"<en>Rule number one: {U2-041|pay attention}. Watch my hands and watch my feet.</en>\""
  - id: s13
    text: "Isınma sırasında hoparlörden hafif bir müzik geliyordu. Gül Hanım: \"<en>We always warm up to {U2-024|jazz}. It's good for rhythm.</en>\""
  - id: s14
    text: "Bora: \"<en>Can we change the {U2-021|genre}? {U2-022|Rock music} is better for karate!</en>\""
  - id: s15
    text: "Bora hoparlöre bakarken tekmeyi yanlış yöne attı. Yanındaki çocuğun su şişesi havaya uçtu ve tüm su tişörtüne döküldü."
  - id: s16
    text: "Gül Hanım: \"<en>Bora! {U2-041|Pay attention}, please! Your eyes are on the speaker, not on me.</en>\""
  - id: s17
    text: "Islanan çocuk, Mert, tişörtüne baktı. Hiç mutlu görünmüyordu: \"<en>Hey! My T-shirt is all wet now. I'm really {U2-042|annoyed}!</en>\""
  - id: s18
    text: "Bora koşup bir havlu getirdi: \"<en>Sorry, sorry! I'll {U2-041|pay attention} from now on!</en>\" Mert gülümsedi: \"<en>Thanks. You're {U1-076|helpful}… and dangerous.</en>\""
  - id: s19
    text: "Gül Hanım ise çok {U1-085|patient} biriydi: \"<en>I'm not {U2-042|annoyed}, Bora. Everybody makes mistakes in the first lesson.</en>\""
  - id: s20
    text: "Ders bitince Bora eve gitti, kanepeye yığıldı ve gruba yazdı: \"<en>Karate is hard. My legs are dead. I need to {U2-040|rest} for a week!</en>\""
  - id: s21
    text: "Duru: \"<en>Welcome to my world. I {U2-040|rest} every day. I'm a professional.</en>\""
  - id: s22
    text: "Selin: \"<en>Bora, my family is going {U2-039|hiking} in the forest tomorrow. Do you want to come? It's easy and quiet.</en>\""
  - id: s23
    text: "Bora: \"<en>{U2-039|Hiking}? Is there a lot of walking?</en>\" Selin: \"<en>Bora… that's what hiking is!</en>\""
  - id: s24
    text: "Pazar sabahı Bora ormandaydı. Selin'in babası telefonundan {U2-023|pop music} açtı ve en önden yürüdü."
  - id: s25
    text: "Selin'in babası: \"<en>Every hour, we stop and {U2-040|rest} for five minutes. And watch the path – there are tree roots everywhere!</en>\""
  - id: s26
    text: "Bora: \"<en>{U2-039|Hiking} is great! No ball, no team, nobody shouts at me. Just trees and birds!</en>\""
  - id: s27
    text: "Gece yarısı Bora gruba ormandan tam seksen fotoğraf attı. Ece: \"<en>Bora, it's midnight! Eighty photos of trees?! I'm so {U2-042|annoyed}! 😤</en>\" Bora: \"<en>Sorry! But look at photo 47 – a squirrel!</en>\""
  - id: s28
    text: "Bora: \"<en>Karate on Saturdays, hiking on Sundays. I'm an {U2-037|individual sport} person now!</en>\" Kaan: \"<en>And on Mondays?</en>\" Bora: \"<en>Rest!</en>\""

scene:
  - id: c01
    speaker: Kaan
    text: "<en>Bora, why don't you play basketball with us?</en>"
  - id: c02
    speaker: Bora
    text: "<en>I prefer an individual sport. I do karate on Saturdays and I go hiking on Sundays.</en>"
  - id: c03
    speaker: Kaan
    text: "<en>Karate? Do you pay attention to the teacher?</en>"
  - id: c04
    speaker: Bora
    text: "<en>Now I do! Last week a boy got annoyed because of me. Today I just want to rest.</en>"

