tips:
  - type: tuzak
    refs: [U2-040]
    text: "rest fiil olunca dinlenmek: \"I need to rest.\" Ama the rest of = …in geri kalanı: \"the rest of the pizza\" (pizzanın geri kalanı). Başında the varsa dinlenme yok, \"kalan kısım\" var!"
  - type: mini_dilbilgisi
    refs: [U2-038, U2-039]
    text: "Spor fiilleri: do + dövüş sporları ve yoga (do karate, do judo, do yoga) · play + top oyunları (play basketball, play tennis) · go + -ing ile biten etkinlikler (go hiking, go swimming, go skiing)."
  - type: tuzak
    refs: [U2-042, U2-030]
    text: "annoying = sinir bozan; annoyed = sinirlenmiş. \"Mert was annoyed.\" = Mert sinirlendi. \"Mert was annoying.\" deseydik, Mert'in kendisi sinir bozucu olurdu! Kişinin hissi -ed, o hissi veren şey -ing."
  - type: kelime_ailesi
    refs: [U2-041]
    text: "pay attention (to) = dikkat etmek: \"Pay attention to the teacher.\" Burada pay \"ödemek\" değil! attention tek başına da kullanılır: anonslarda \"Attention, please!\" duyarsın."

coach:
