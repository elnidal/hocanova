story:
  - id: s01
    text: "Kampın ikinci sabahı göl ayna gibiydi. Kıyıda yan yana dizilmiş, iki kişilik turuncu {U6-010|canoes} bekliyordu."
  - id: s02
    text: "Deniz Hoca kıyıya bir masa kurmuştu: \"<en>We provide all the safety {U6-022|equipment}. Everybody takes a {U6-026|life jacket} and a {U6-010|paddle}. No {U6-023|helmets} on the lake today.</en>\""
  - id: s03
    text: "Deniz Hoca turuncu yelekleri tek tek dağıttı: \"<en>Why a {U6-026|life jacket}? Because people without one can {U6-017|drown}, even good swimmers. On my lake, it's always on.</en>\""
  - id: s04
    text: "Ece kıyıdaki tabelayı yüksek sesle okudu: \"<en>Most people who {U6-017|drown} in boat accidents are not wearing a {U6-026|life jacket}.</en>\" Bora yeleğinin bütün tokalarını üç kez kontrol etti."
  - id: s05
    text: "Ekipler kuruldu: Ece–Selin, Elif–Duru, Kaan–Bora. Bora daha yeleğini yeni kapatıyordu ama Kaan çoktan oturmuş, {U6-010|paddle}'ı deli gibi sallıyordu."
  - id: s06
    text: "Ama hiçbir yere gitmiyordu. Deniz Hoca güldü: \"<en>Kaan, your {U6-010|canoe} is still on the {U6-024|rope}! And your partner is here, on the beach.</en>\""
  - id: s07
    text: "Deniz Hoca: \"<en>{U6-010|Canoeing} is a team sport. Wait for Bora. Be {U1-085|patient}.</en>\" Kaan: \"<en>{U1-085|Patient}? Sorry, I don't know that word.</en>\""
  - id: s08
    text: "Sonunda bütün ekipler göldeydi. Bora ilk beş dakika {U2-059|nervous} görünüyordu, sonra kendi ritmini buldu: \"<en>Left, right, left, right… it's like drums! I feel the {U6-053|freedom}!</en>\""
  - id: s09
    text: "Yarım saat sonra ağaçların uçları eğilmeye başladı. Su kırış kırış oldu, küçük dalgalar teknelerin yanına vurdu. Ece'nin şapkası kafasından havalanıp kıyıya doğru uçtu."
  - id: s10
    text: "Deniz Hoca düdüğünü çaldı: \"<en>The {U6-054|wind} is getting stronger. Everybody, back to the beach. We {U6-018|land} there, next to the red flag.</en>\""
  - id: s11
    text: "Deniz Hoca'nın sesinde hiç telaş yoktu. Kendi teknesiyle grubun hemen arkasındaydı: \"<en>Stay {U1-069|calm}. Paddle slowly and together. I'm right behind you.</en>\""
  - id: s12
    text: "Elif şarkıyla tempo tuttu: \"<en>The {U6-054|wind} is {U6-054|blowing}, but we are going!</en>\" Duru ritme uydu ve hayatında ilk kez acelesi olan biri gibi göründü."
  - id: s13
    text: "Ekipler birer birer kıyıya vardı. Kaan, pilot anonsu yapar gibi: \"<en>Ladies and gentlemen, safe {U6-018|landing}! Thank you for flying with Kaan Airlines!</en>\""
  - id: s14
    text: "Selin: \"<en>We didn't fly, Kaan. We {U6-018|landed} early because the {U6-054|wind} was too strong. That was the right decision.</en>\""
  - id: s15
    text: "Deniz Hoca: \"<en>Now let's carry the {U6-010|canoes} up the beach. Two people for each one.</en>\" Kaan beklemedi bile. Kendi {U6-010|canoe}'larının ucunu yakaladı ve tek başına çekmeye başladı."
  - id: s16
    text: "Çekti. Asıldı. Yüzü domates gibi kızardı. Turuncu gövde bir santim bile kıpırdamadı. Bora: \"<en>Er, Kaan…</en>\" Kaan: \"<en>Not now! I can do it alone!</en>\""
  - id: s17
    text: "Bora sessizce içini gösterdi. Duru, turuncu yeleğinin içinde, teknenin dibinde mışıl mışıl uyuyordu."
  - id: s18
    text: "Duru tek gözünü açtı: \"<en>Five more minutes. The {U6-054|wind} is nice here.</en>\" Dört kişi birlikte tuttular ve turuncu gövde, içinde Duru'yla, kolayca kumsala çıktı. Kaan: \"<en>OK. A team is faster than Kaan.</en>\""
  - id: s19
    text: "Öğleden sonra yağmur başlayınca herkes büyük çadırda toplandı. Murat Bey gençliğinden bir fotoğraf gösterdi: maskeli, siyah bir {U6-008|wetsuit} içinde gülümseyen genç bir adam. \"<en>I loved {U6-008|scuba diving} when I was at university.</en>\""
  - id: s20
    text: "Murat Bey'in gözleri parladı: \"<en>Under the water you feel the {U6-053|freedom}. No phones, no noise, only fish.</en>\""
  - id: s21
    text: "Kaan: \"<en>Can I go {U6-008|scuba diving} next summer?</en>\" Murat Bey: \"<en>Only with a {U6-008|diving club} and an {U6-048|instructor}. Divers never go alone, because nobody wants to {U6-017|drown}.</en>\""
  - id: s22
    text: "Selin hemen not aldı: \"<en>How much does {U6-008|scuba diving} {U6-046|cost}?</en>\" Murat Bey: \"<en>The {U6-022|equipment} {U6-046|costs} a lot, so beginners usually rent it.</en>\""
  - id: s23
    text: "Elif: \"<en>I feel the {U6-053|freedom} when I sing.</en>\" Duru, battaniyesinin altından: \"<en>I feel it in my hammock.</en>\""
  - id: s24
    text: "Akşam Deniz Hoca bir duyuru yaptı: \"<en>Tomorrow night we have a night walk. Bring your {U6-025|flashlight}!</en>\" Ece çantasından iki {U6-025|flashlight} ve yedek pil çıkardı. Tabii ki."
  - id: s25
    text: "Bora yutkundu: \"<en>A night walk? In the forest? With… bugs?</en>\" Kimse cevap vermedi. Uzaktan bir baykuş öttü."

