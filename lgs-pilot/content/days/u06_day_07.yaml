  - type: ilginc_bilgi
    refs: [U6-008]
    text: "SCUBA aslında bir kısaltma: Self-Contained Underwater Breathing Apparatus, yani dalgıcın kendi havasını taşıdığı su altı solunum aygıtı."
  - type: kelime_ailesi
    refs: [U6-054]
    text: "wind (isim) → windy (sıfat): It's windy today. Rüzgârın fiili blow: The wind is blowing. Geçmiş zaman düzensiz: blow → blew."
  - type: lgs_taktigi
    refs: [U6-017]
    text: "drown ile sink karışmasın: insan ve hayvan için drown (boğulmak), tekne ve gemi için sink (batmak) kullanılır."

