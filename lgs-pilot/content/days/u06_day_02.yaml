story:
  - id: s01
    text: "Salı, öğle arası. Ece tahtaya üç sütunlu bir tablo çizdi ve sütunların başına yazdı: \"<en>FUN | DIFFICULTY | DANGER</en>\". Sınıfta kalan herkes merakla etrafına toplandı."
  - id: s02
    text: "Ece: \"<en>OK, team. Today's question: which activity is {U6-033|more dangerous}? We give points from one to five.</en>\""
  - id: s03
    text: "Elif dergiyi açtı. Bu haftaki özel sayının kapağında havada süzülen insanlar vardı: \"<en>Look! {U6-005|Bungee jumping}! People jump off a bridge, and an elastic cord stops them.</en>\""
  - id: s04
    text: "Kaan: \"<en>Five points for fun! {U6-005|Bungee jumping} is {U6-033|more exciting than} the climbing wall!</en>\""
  - id: s05
    text: "Selin: \"<en>And five points for danger. It's {U6-033|more dangerous than} the climbing wall too.</en>\""
  - id: s06
    text: "Bora sayfayı çevirdi ve yüzü bembeyaz oldu: \"<en>And this is {U6-005|base jumping}. People jump off a tall building and open a {U6-006|parachute}. No, thank you. I'm happy on the ground.</en>\""
  - id: s07
    text: "Kaan bir sonraki fotoğrafı görünce ayağa fırladı: \"<en>{U6-006|Skydiving}! You jump out of a plane and fly like a bird! Murat Bey, can we do {U6-006|skydiving} at camp?</en>\""
  - id: s08
    text: "Murat Bey sınıfın köşesinde kâğıt okuyordu; başını bile kaldırmadı: \"<en>Not at a school camp! Here, have some chocolate. It's {U3-027|bitter}, like my answer.</en>\""
  - id: s09
    text: "Kaan pes etmedi: \"<en>Then {U6-007|paragliding}? You fly slowly. It's {U6-033|safer than} {U6-006|skydiving}!</en>\""
  - id: s10
    text: "Murat Bey: \"<en>{U6-007|Paragliding} isn't on the list either, Kaan. I don't want my students to {U6-012|take risks} in the sky.</en>\""
  - id: s11
    text: "Duru sırasına yaslanmış, gözleri yarı kapalı konuştu: \"<en>I'd like {U6-007|paragliding}. You sit and fly. It's a sofa in the sky.</en>\""
  - id: s12
    text: "Ece puanları tabloya işledi. Bungee satırı kıpkırmızı olmuştu; tırmanma duvarının satırı ise ortalarda bir yerdeydi."
  - id: s13
    text: "Selin: \"<en>Look. The climbing wall is {U6-028|challenging}, but it isn't very dangerous. An adult is always with you.</en>\""
  - id: s14
    text: "Bora: \"<en>{U6-028|Challenging}? For me, the stairs to the second floor are {U6-028|challenging}.</en>\""
  - id: s15
    text: "Kaan göğsünü gere gere: \"<en>I love {U6-012|taking risks}! {U6-012|Risk} is my middle name!</en>\""
  - id: s16
    text: "Selin: \"<en>Kaan, you {U6-012|take risks} every morning. You leave home at 7.58 for an eight o'clock lesson.</en>\" Murat Bey: \"<en>True. Kaan is {U1-075|always in a hurry}.</en>\""
  - id: s17
    text: "Murat Bey sonunda kâğıtlarını bıraktı ve gülümsedi: \"<en>But good sentences, team! 'Safer than', 'more dangerous than'… Just remember: we say '{U6-033|safer}', not 'more safer'!</en>\""
  - id: s18
    text: "Elif: \"<en>For me, singing by the campfire is {U6-033|better than} all of them!</en>\""
  - id: s19
    text: "Ece tabloyu bitirdi ve sonucu sınıfa okudu: \"<en>The climbing wall: a little {U6-028|challenging}, a lot of fun, not much danger.</en>\""
  - id: s20
    text: "Ece: \"<en>So the climbing wall is {U6-033|less dangerous than} {U6-005|bungee jumping} and {U6-033|more fun than} the bus trip!</en>\""
  - id: s21
    text: "Duru: \"<en>And a hammock is {U2-091|relaxing}. Zero {U6-012|risk}.</en>\" Kaan: \"<en>Zero fun!</en>\" Duru: \"<en>Zero problems.</en>\""
  - id: s22
    text: "Zil çaldı. Herkes çıkarken Kaan tahtaya gizlice döndü ve tablonun en altına küçük harflerle bir satır ekledi: \"<en>{U6-006|Skydiving}: 5, 5, 5!!!</en>\""
  - id: s23
    text: "Ece fark etti, satırı sildi ve telefonunu çıkardı: \"<en>OK. Tomorrow, a poll. Everybody votes, and nobody writes on my table!</en>\""

