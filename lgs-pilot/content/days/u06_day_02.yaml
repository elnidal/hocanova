tips:
  - type: tuzak
    refs: [U6-005]
    text: "İkisi de \"atlama\" ama aynı şey değil: bungee jumping'de seni esnek bir ip (elastic cord) durdurur; base jumping'de yüksek bir yapıdan ya da uçurumdan atlayıp paraşüt açarsın."
  - type: tuzak
    refs: [U6-028]
    text: "challenging \"iddialı\" demek değildir. challenging = zorlayıcı, zorlu ama denemeye değer (a challenging game). challenge ise isim: meydan okuma."
  - type: tuzak
    refs: [U6-033]
    text: "Düzensizlere dikkat: good → better, bad → worse. ❌ more safer → ✓ safer. less + sıfat = daha az …: less dangerous than (daha az tehlikeli)."
  - type: mini_dilbilgisi
    refs: [U6-033]
    text: "Tek heceli sıfat -er alır (safe → safer); -y ile biten iki heceli -ier alır (crazy → crazier); uzun sıfatlar more alır (dangerous → more dangerous). Arkasından than gelir."

coach:
  start: "Ece tahtaya bir tablo çizdi, Kaan gözünü gökyüzüne dikti. Murat Bey'in cevabı çikolatası kadar sert 🍫"
  end_good: "Süper! Senin tablonda puanlar: eğlence 5, hata 0 📊"
  end_mixed: "Fena değil! {weak} biraz sallandı. Tabloyu bir daha çizer, yarın tekrar bakarız 📊"

notifications:
  morning: "Köprüden mi, uçaktan mı, hamaktan mı? Ece tabloyu çizdi 📊"
  evening: "Kaan gökyüzüne çıkmak istedi. Murat Bey'in cevabı? 🍫"
  review: "more safer mı, safer mı? Hangisi doğruydu? 🤔"

