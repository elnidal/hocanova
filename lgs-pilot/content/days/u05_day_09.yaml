tips:
  - type: tuzak
    refs: [U5-014]
    text: "attachment e-postadaki ek, yani ekli dosyadır; bazı kaynaklardaki \"eklenti\" çevirisi yanlış (eklenti = add-on). Kalıp: attach a file TO an email."
  - type: kelime_ailesi
    refs: [U5-027]
    text: "blog (yazı sayfası) → blogger (blog yazarı) · vlog = video + blog → vlogger. Ders kitabı sorusu: \"Do you follow any bloggers?\""
  - type: lgs_taktigi
    refs: [U5-035, U5-058]
    text: "SNS = social networking sites. Sınavda kısaltma \"What does SNS stand for?\" diye sorulur; cevap açılımın kendisidir."
  - type: mini_dilbilgisi
    refs: [U5-032]
    text: "Arkadaş İngilizcede make ile edinilir: make new friends, make friends from other countries. \"do friends\" ya da \"take friends\" yanlış."

