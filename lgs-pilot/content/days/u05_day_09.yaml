title: "Kırıcı yorum"
est_minutes: 10
characters: [Elif, Duru, Kaan, Ece, Selin, Bora, Murat Bey, Mia]
new_items: [U5-014, U5-027, U5-029, U5-032, U5-035, U5-048]

story:
  - id: s01
    text: "Perşembe akşamı, saat tam dokuz. Ece kanala yeni videoyu koymuştu: Elif'in tek başına söylediği ilk şarkı. Arda'nın kalpleri, Nermin Teyze'nin alkışları peş peşe geliyordu."
  - id: s02
    text: "Derken videonun altına tanımadıkları bir hesaptan bir yorum düştü: Elif'in şarkı söyleyişiyle alay eden, kırıcı bir yorum. Elif telefonu ters çevirdi ve gruba tek satır yazdı: \"<en>Did you see the new comment? 😔</en>\""
  - id: s03
    text: "Kaan'ın parmakları çoktan klavyedeydi: \"<en>I'm going to {U1-020|reply} right now. Three pages!</en>\""
  - id: s04
    text: "O akşam ilk yazan, her zaman en son ve en kısa yazan Duru oldu: \"<en>Kaan, stop. Don't {U1-020|reply}. Stay {U1-069|calm}. Report it and tell an {U2-072|adult}.</en>\""
  - id: s05
    text: "Kaan: \"<en>Why? Someone has to answer!</en>\" Duru: \"<en>An answer gives them attention. {U5-054|In other words}, you make the fire bigger.</en>\""
  - id: s06
    text: "Ece kanalın menajeriydi ve hiç vakit kaybetmedi: \"<en>I can {U5-001|access} the channel settings. First, a {U5-021|screen}shot. Then I'll report the comment and block the account. I won't {U5-018|delete} anything before the screenshot.</en>\""
  - id: s07
    text: "Selin, Murat Bey'in derste söylediğini hatırladı: \"<en>{U5-035|Social networking sites} have rules about harmful {U5-029|content}. We can use the report button.</en>\""
  - id: s08
    text: "Ece hemen Murat Bey'e bir e-posta yazmaya başladı: \"<en>I'm writing to Murat Bey now. I'll {U5-014|attach} the screenshot.</en>\""
  - id: s09
    text: "Bora: \"<en>{U5-055|Sorry, I can't follow you}. Which screenshot? There are two.</en>\" Ece: \"<en>Both. Two {U5-014|files}, one email.</en>\" Bora: \"<en>OK. And I'm telling my mum, too. I learned it the hard way: tell an adult fast.</en>\""
  - id: s10
    text: "On dakika geçmeden Murat Bey'in e-postası geldi: \"<en>Thank you, Ece. I've got the {U5-014|attachment}. You all did the right thing. The school and I will take care of it tomorrow. Elif, you are not alone.</en>\""
  - id: s11
    text: "Elif o akşam annesine de anlattı. Annesi ona sarıldı; telefonu bir saatliğine kenara koydular ve birlikte en sevdiği Luna Ray şarkısını dinlediler."
  - id: s12
    text: "Gece yarısına doğru gruba Duru'dan bir mesaj daha düştü. Bu kez hiç de kısa değildi: \"<en>Elif, this matters to me. One comment is one person. We're a band, and we {U1-064|support each other}.</en>\""
  - id: s13
    text: "Ertesi sabah Murat Bey derse ciddi bir yüzle girdi ve kimsenin adını vermeden konuştu: \"<en>Sadly, unkind comments are {U5-048|widespread} on {U5-035|social networking sites}. But kindness is everywhere, too. Report, block, and talk to someone.</en>\""
  - id: s14
    text: "Teneffüste Ece telefonunu Elif'e uzattı. Videonun altında yüzlerce yeni mesaj vardı: Brezilya'dan, Japonya'dan, Kenya'dan, Kanada'dan… \"<en>Elif, look! Our followers are {U5-048|worldwide}!</en>\""
  - id: s15
    text: "Mesajlardan biri Kanadalı bir {U5-027|blogger}'dandı, adı Mia'ydı: \"<en>Hi Elif! I write a music {U5-027|blog}. Last year I got a comment like that, too. Your voice is lovely. Keep singing!</en>\""
  - id: s16
    text: "Elif'in gözleri parladı: \"<en>She has a {U5-027|vlog}, too! She sings Luna Ray songs with her ukulele!</en>\""
  - id: s17
    text: "Elif: \"<en>Last night I wanted to {U5-018|delete} the video. This morning I {U5-032|made new friends} in four countries!</en>\""
  - id: s18
    text: "Selin her zamanki gibi defterine yazdı: \"<en>For our guide: one unkind comment, a hundred kind ones. {U5-035|Social networking sites} have two faces.</en>\""
  - id: s19
    text: "Ece kanalın planını da hemen güncelledi: \"<en>New plan for our channel: more happy {U5-029|content}. And the comments stay open – for kind people.</en>\""
  - id: s20
    text: "Kaan bu kez yazmadan önce durdu, düşündü: \"<en>New rule for me: when I'm angry, I don't type. I talk to an adult first.</en>\""
  - id: s21
    text: "Günün gülümseten mesajı Bora'nın dedesindendi; tamamı büyük harflerle: \"<en>ELIF SINGS LIKE A JAZZ STAR! ADD SOME JAZZ!</en>\" Bora: \"<en>Sorry. Grandpa thinks capital letters are louder.</en>\""
  - id: s22
    text: "Akşam Elif, Mia'nın sayfasını annesiyle birlikte okudu; sonra annesinin onayıyla, adresini ya da okulunu yazmadan, kanal hesabından Mia'ya yazdı: \"<en>Thank you so much! I want to {U5-032|make new friends} who love music. {U5-059|Why don't we} sing a song together on our channels one day?</en>\""
  - id: s23
    text: "Mia'nın mesajı bir dakikada geldi: \"<en>Yes! And I'm going to write about you on my {U5-027|blog}: 'How to {U5-032|make new friends} after one bad comment'. 🙂</en>\""
  - id: s24
    text: "Gece Murat Bey sınıf grubuna yazdı: \"<en>{U5-053|By the way}, the guide presentations are on Monday. Selin, please add today's lesson: unkind {U5-029|content} is {U5-048|widespread}, but help is, too. Bora, are you ready to tell your story?</en>\""
  - id: s25
    text: "Bora kalemiyle masaya kısa bir davul solosu attı: \"<en>Leave it to me. And this weekend my mum and I are buying something online – the right way!</en>\""

