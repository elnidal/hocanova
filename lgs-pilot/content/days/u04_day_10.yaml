tips:
  - type: tuzak
    refs: [U4-034]
    text: "Bill bir erkek adı da olabilir; ama the / my / phone ile gelirse fatura (phone bill, electricity bill), restoranda ise hesap: \"Can I have the bill, please?\" = Hesabı alabilir miyim?"
  - type: tuzak
    refs: [U4-054, U1-095]
    text: "-ed kişinin hissi, -ing şeyin etkisi: I'm bored (sıkıldım) ↔ The film is boring (film sıkıcı). \"I'm boring\" dersen \"Ben sıkıcı biriyim\" demiş olursun! bored sınavda en az dört kez çıktı."
  - type: mini_dilbilgisi
    refs: [U4-054]
    text: "Edatlarıyla ezberle: scared of (dogs) · surprised at / by (the news) · bored with (the game). Örnek: Elif was surprised at the big crowd."
  - type: lgs_taktigi
    refs: [U4-031, U4-024, U4-012]
    text: "Telefon sorusunda önce üç kişiyi işaretle: arayan (This is …), aranan (Can I speak to …?) ve aracı (sekreter, anne). Amaç sorusunda cevap çoğunlukla \"I'm calling about / to …\" cümlesindedir."

