      id: u4d10-034-z
      type: meaning
      context: s24
      prompt: "Hikâyede Nermin Teyze konserden sonra \"Can I have the bill, please?\" diye soruyor. \"bill\" ne anlama geliyordu?"
      options: ["hesap (ödenecek tutar)", "menü", "masa", "bahşiş"]
      answer: 0
    kullan:
      id: u4d10-034-k
      type: gap_fill
      prompt: "Boşluğa uygun olanı seç."
      stem: "<en>Mum is not happy. Our phone ________ is very high this month because my brother calls his friends for hours.</en>"
      options: ["bill", "receiver", "appointment", "extension"]
      answer: 0
      explain: "Konuşma ücretinin yazdığı kâğıt phone bill'dir; evde fatura, restoranda hesap anlamına gelir."
    sina:
      id: u4d10-034-s
      type: message_infer
      lgs_like: true
      stem_id: S11
      prompt: "<en>Why is Mr Kaya calling?</en>"
      stem: "<en>Customer service: Good morning. How can I help you?\nMr Kaya: Hello. I'm calling about my electricity bill. It's 3,000 lira this month, but we were on holiday for two weeks! I think there's a mistake.</en>"
      options: ["to complain about a wrong bill", "to book a holiday", "to pay for a concert ticket", "to invite someone to dinner"]
      answer: 0
      explain: "\"I'm calling about my electricity bill … I think there's a mistake\": Bay Kaya faturadaki hatayı bildirmek (şikâyet) için arıyor."
  - item: U4-054
    sezdir:
      id: u4d10-054-z
      type: meaning
      context: s11
      prompt: "Hikâyede Elif sahneye çıkmadan önce \"I'm scared\" diyor. Bu ne anlama geliyordu?"
      options: ["Korkuyorum.", "Yoruldum.", "Acıktım.", "Çok mutluyum."]
      answer: 0
    kullan:
      id: u4d10-054-k
      type: gap_fill
      prompt: "Boşluğa uygun olanı seç."
      stem: "<en>The film was very long and slow. I was really ________, so I fell asleep.</en>"
      options: ["bored", "boring", "exciting", "bore"]
      answer: 0
      explain: "Kişinin hissi -ed ile anlatılır (I was bored); boring filmin özelliğidir, \"I was boring\" \"Ben sıkıcıydım\" demek olur."
    sina:
      id: u4d10-054-s
      type: message_infer
      lgs_like: true
      stem_id: S04
      prompt: "<en>According to the message, which of the following is TRUE about Elif?</en>"
      stem: "<en>Elif's message to her cousin in Ankara: Before the concert, my hands were shaking and I didn't want to go on stage. Then I looked at the café and saw sixty people! I couldn't believe it!</en>"
      options: ["She was scared at first, and then she was surprised.", "She was bored during the concert.", "She was surprised at first, and then she was bored.", "She wasn't scared at all."]
      answer: 0
      explain: "Titreyen eller = korku (scared), \"I couldn't believe it\" = şaşkınlık (surprised); sıkıldığına dair bir ipucu yok."

