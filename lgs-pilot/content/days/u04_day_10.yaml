title: "İlk konser"
est_minutes: 10
characters: [Ece, Elif, Duru, Bora, Kaan, Selin, Sevim Hanım, Nermin Teyze, Arda, Ahmet Amca, Murat Bey]
new_items: [U4-034, U4-054]

story:
  - id: s01
    text: "Tatilin son cumartesi akşamı. Pastanenin camında Ece'nin el yazısıyla bir afiş vardı: \"<en>LIVE MUSIC TONIGHT – 7 P.M.</en>\""
  - id: s02
    text: "Saat tam altıda Ece'nin telefonu titredi. Ekranda Kaan'ın adı vardı. Ece saate baktı, bir daha baktı: 18.00. Ne bir saniye önce, ne bir saniye geç."
  - id: s03
    text: "Kaan: \"<en>Hi Ece! I said I'd call you back at six, and here I am. I always {U1-054|keep my promises}… well, today I do!</en>\""
  - id: s04
    text: "Ece telefonu kulağından uzaklaştırıp ekrana baktı. Gerçekten Kaan'dı. \"<en>Kaan, I'm really {U4-054|surprised}. You're on time!</en>\""
  - id: s05
    text: "Asıl telaş kurabiyelerdeydi: Sevim Hanım'ın konser için ısmarladığı iki yüz kurabiye hâlâ gelmemişti. Tam o sırada kapıda kargocu belirdi: \"<en>{U4-039|Delivery} for Sevim Hanım! Two hundred cookies!</en>\""
  - id: s06
    text: "Duru kırmızı hoparlörü sahneye koyup kabloyu taktı. Ne cızırtı vardı ne fosforlu yeşil: \"<en>Red and quiet. The {U4-036|call center} really {U4-055|solved} the problem.</en>\""
  - id: s07
    text: "Sevim Hanım vitrindeki pastaları diziyordu: \"<en>Good! My {U4-038|customers} are already here, and they all want music.</en>\""
  - id: s08
    text: "Ece defterini kapattı: \"<en>Perfect. Cookies, a red speaker, no {U4-040|complaints}, no {U4-041|returns}. Not tonight!</en>\""
  - id: s09
    text: "Bora, Ahmet Amca'nın eski davul setini sahneye kurmuştu. Ahmet Amca en önde oturuyor, arada bir davula bakıp gençliğini hatırlıyordu."
  - id: s10
    text: "Elif ise mutfak kapısının arkasında, mikrofonu iki eliyle tutmuş, kıpırdamadan duruyordu. Boğazı iyileşmişti ama elleri titriyordu."
  - id: s11
    text: "Elif: \"<en>Duru, I'm {U4-054|scared}. What if my voice goes? What if nobody comes?</en>\" Duru omuz silkti: \"<en>Everybody's {U2-059|nervous} before the first concert. Look at Bora.</en>\""
  - id: s12
    text: "Bora üçüncü dilim pastasını bitiriyordu: \"<en>I'm not {U4-054|scared}. I'm hungry. It's different.</en>\" Elif istemeden güldü."
  - id: s13
    text: "Saat yedide Elif perdenin arasından baktı ve gözleri kocaman açıldı. Bütün masalar doluydu: Murat Bey, Selin ve babası, Bora'nın dedesi, Nazmiye Teyze, bir de genel merkezin deposundan Hasan Bey: Ece ilk davetiyeyi ona söz vermişti…"
  - id: s14
    text: "Elif: \"<en>So many people! I'm so {U4-054|surprised}!</en>\" Ece göz kırptı: \"<en>Of course. I'm your manager, remember?</en>\""
  - id: s15
    text: "İlk şarkıyla birlikte Bora'nın davulu pastaneyi doldurdu. Duru gözleri kapalı çaldı (uyumuyordu, gerçekten!), Elif'in sesi ilk nakaratta yükseldi."
  - id: s16
    text: "Murat Bey alkışlarken Selin'in babasına eğildi: \"<en>Nobody's {U4-054|bored} tonight. Look, even Sevim Hanım is dancing behind the counter!</en>\""
  - id: s17
    text: "Derken gecenin en sakin şarkısı başladı. Elif fısıltı gibi söylüyordu; pastanede çıt çıkmıyordu."
  - id: s18
    text: "Tam o anda Kaan'ın cebinden bütün salonu inleten bir zil sesi yükseldi. Kaan kıpkırmızı oldu ve fısıldadı: \"<en>Sorry, sorry! Hello? This is Kaan.</en>\""
  - id: s19
    text: "Hattın öbür ucunda tanıdık bir ses vardı: \"<en>Hello, dear! It's Nermin. Bora gave me your number for emergencies. This is an emergency: I'm at the door with Arda, but there are no chairs!</en>\""
  - id: s20
    text: "Kaan iki sandalyeyle kapıya koştu. Bora davulun başından el salladı: kapıdaki, onun meşhur hatalı aramasının kahramanı Nermin Teyze'ydi."
  - id: s21
    text: "Şarkı bitince Nermin Teyze ayağa kalktı: \"<en>Lovely! What's the name of your {U2-019|band}, children?</en>\""
  - id: s22
    text: "Dördü birbirine baktı. Bir adları yoktu! Bora mikrofona eğildi: \"<en>We're… {U4-032|Wrong Number}! Because a wrong number brought us our first fan!</en>\""
  - id: s23
    text: "Arda en yüksek sesle alkışladı; Nermin Teyze eliyle kalbini gösterdi. Duru, Elif'e döndü: \"<en>I don't mind the name. It's perfect.</en>\""
  - id: s24
    text: "Konser bitince Nermin Teyze çantasını açtı: \"<en>Can I have the {U4-034|bill}, please? Two lemonades and a cake.</en>\""
  - id: s25
    text: "Sevim Hanım başını salladı: \"<en>No {U4-034|bill} for you tonight. You're the band's first fan! And of course, no {U4-034|bill} for the band!</en>\""
  - id: s26
    text: "Kaan rahat bir nefes aldı: \"<en>Great! Because my phone {U4-034|bill} is already huge. Three-minute voice messages, you know.</en>\""
  - id: s27
    text: "Gece yarısı biri konser videosunu internete koydu. Sabah Duru telefonuna baktı, gözlerini ovuşturdu ve herkese tek satır yazdı: \"<en>Guys. 50,000 views. I'm not sleeping. I'm {U4-054|surprised}.</en>\""

scene:
  - id: c01
    speaker: Kaan
    text: "<en>Hi Ece! I said I'd call you back at six, and here I am!</en>"
  - id: c02
    speaker: Elif
    text: "<en>I'm scared. What if nobody comes?</en>"
  - id: c03
    speaker: Elif
    text: "<en>Wow, so many people! I'm really surprised!</en>"
  - id: c04
    speaker: Bora
    text: "<en>We're Wrong Number! Nobody's bored tonight!</en>"
  - id: c05
    speaker: Sevim Hanım
    text: "<en>No bill for the band tonight!</en>"

