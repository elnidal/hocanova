tips:
  - type: tuzak
    refs: [U3-008]
    text: "steam isim olarak \"buhar\" (the steam from the kettle), fiil olarak \"buharda pişirmek\"tir. Steamed vegetables = buharda pişmiş sebze. Tarif cümlesinin başındaysa fiildir: Steam the broccoli."
  - type: tuzak
    refs: [U3-004, U3-007, U3-005]
    text: "Türkçedeki \"kızartmak\" İngilizcede ayrılır: yağda → fry, fırında (et, sebze) → roast, ızgarada → grill. Pişirme ortamına bak, fiili ona göre seç."
  - type: kelime_ailesi
    refs: [U3-030]
    text: "greasy / oily / fatty üçü de \"yağlı\" ama farkı var: greasy olumsuz, yağ içinde kalmış (greasy chips); oily sıvı yağ içeren (oily fish); fatty hayvansal yağı çok (fatty meat)."
  - type: kelime_ailesi
    refs: [U3-029]
    text: "fresh ↔ stale: taze ekmek fresh bread, bayat ekmek stale bread. Meyve ve sebze bozulmuşsa rotten (çürük) denir."

