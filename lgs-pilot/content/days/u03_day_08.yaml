story:
  - id: s01
    text: "Pazartesi, İngilizce dersi. Murat Bey tahtaya her zamanki gibi kocaman harflerle yazdı: \"<en>NEW RULE: NO {U3-004|DEEP-FRIED} FOOD!</en>\""
  - id: s02
    text: "Murat Bey: \"<en>Chips, {U3-004|fried} chicken, doughnuts… not in Junior Chef. You can {U3-005|grill}, you can {U3-007|roast}, you can {U3-008|steam}. Be creative!</en>\""
  - id: s03
    text: "Sınıfta bir uğultu koptu. En yüksek ses Kaan'dan geldi: \"<en>No chips?! Chips are my favourite food in the world!</en>\""
  - id: s04
    text: "Murat Bey her zamanki sakinliğiyle açıkladı: \"<en>Too much oil, Kaan. {U3-004|Fried} food is often {U3-030|greasy}. I {U2-079|recommend} {U3-008|steamed} vegetables. They're light and healthy.</en>\""
  - id: s05
    text: "Kaan: \"<en>{U3-008|Steamed} vegetables? That sounds so {U1-095|boring}!</en>\" Selin sadece kaşını kaldırdı."
  - id: s06
    text: "Okuldan sonra iki takım birlikte mahalle pazarına uğradı. Ece elinde listeyle en öndeydi; Selin her tezgâhta domatesleri tek tek inceliyordu."
  - id: s07
    text: "Selin: \"<en>Look at the colour and smell them. We only buy {U3-029|fresh} vegetables. That's the rule.</en>\""
  - id: s08
    text: "Pazarcı amca 'Bu sabah köyden geldi!' diyerek herkese birer parça domates uzattı. Ece ısırdı: \"<en>Wow, it's so {U3-035|sweet}! Like a fruit!</en>\""
  - id: s09
    text: "Elif bir limonu kokladı ve yüzünü buruşturdu: \"<en>This one is really {U3-033|sour}. {U3-029|Fresh} lemon juice for my salad!</en>\""
  - id: s10
    text: "Duru bir yaprak roka çiğnedi: \"<en>Rocket is a bit {U3-027|bitter}. I don't mind it.</en>\""
  - id: s11
    text: "Bora ise patates tezgâhının önünden ayrılmıyordu: \"<en>Potatoes! I can {U3-017|mash} them. Soft, warm, perfect.</en>\""
  - id: s12
    text: "Kaan birden parmaklarını şıklattı: \"<en>Wait! I have an idea. {U3-005|Grilled} chips! They aren't {U3-004|fried}, so they're OK!</en>\""
  - id: s13
    text: "Selin: \"<en>Kaan, {U2-085|be realistic}. Chips on a {U3-005|grill}? They'll fall through!</en>\" Kaan: \"<en>Me? Unrealistic? Never!</en>\""
  - id: s14
    text: "Akşam Duru'nun evinde ilk deneme başladı. Duru'nun annesi ocağın başındaydı; onun izni olmadan kimse sıcak bir şeye dokunmuyordu."
  - id: s15
    text: "Duru'nun annesi: \"<en>Let's {U3-007|roast} some vegetables in the {U3-040|oven}: {U3-049|peppers}, carrots and onions. Forty minutes.</en>\""
  - id: s16
    text: "Kaan zamanlayıcıyı kurdu (artık bu onun yeni alışkanlığıydı) ve kendi icadına geçti: patatesleri kalın kalın kesip çizgili döküm tavaya dizdi. \"<en>Look! {U3-005|Grilled} chips, no oil!</en>\""
  - id: s17
    text: "On dakika geçti. Patateslerin dışı simsiyah, içi taş gibiydi. Duru: \"<en>I {U3-036|tasted} one. It's black, hard and very {U3-032|salty}. Did you use the whole salt box?</en>\""
  - id: s18
    text: "Bu arada Bora pişmiş patatesleri büyük bir kaba doldurmuş, çatalla işe girişmişti: \"<en>{U3-017|Mash}, {U3-017|mash}, {U3-017|mash}! I'm a machine!</en>\""
  - id: s19
    text: "Bir çıtırtı duyuldu. Bora'nın elindeki çatal iki büklüm olmuştu: \"<en>Oops. I {U3-017|mashed} the potatoes… and the fork.</en>\""
  - id: s20
    text: "Duru'nun annesi kahkahayı bastı ve dolaptan delikli bir sepet çıkardı: \"<en>Forks are for eating, Bora! And this is for the broccoli. We {U3-008|steam} it for five minutes. No oil, no problem.</en>\""
  - id: s21
    text: "Kaan bir parça brokoliyi isteksizce ağzına attı ve durdu: \"<en>Wait… {U3-008|steamed} broccoli isn't {U1-095|boring}. It's green and crunchy!</en>\""
  - id: s22
    text: "Zamanlayıcı çaldı. Kaan kırk dakika içinde burnunu camın önüne tam on iki kez dayamıştı. Duru'nun annesi tepsiyi çıkardı: \"<en>Perfect! {U3-007|Roasted} vegetables. And don't worry, Duru: nothing {U3-034|spicy}.</en>\""
  - id: s23
    text: "Kaan: \"<en>OK, no {U3-005|grilled} chips. But one day I'll {U3-005|grill} some corn with my dad. Real food on a real {U3-005|grill}!</en>\""
  - id: s24
    text: "Duru kanepeye uzandı: \"<en>No {U3-030|oily} chips, no {U3-030|greasy} fingers. I like this rule.</en>\""
  - id: s25
    text: "Gece sınıf grubuna Murat Bey yazdı: \"<en>Remember, chefs: nothing {U3-030|fatty} or {U3-004|deep-fried}. Healthy and {U3-029|fresh} only!</en>\""
  - id: s26
    text: "Hemen arkasından Selin'in mesajı geldi: \"<en>Ece, Elif: Sunday at my grandma's. She's sharing her secret {U3-050|recipe}! 🤫</en>\" Bora: \"<en>Is it something {U3-035|sweet}? Can I come?</en>\""

scene:
  - id: c01
    speaker: Murat Bey
    text: "<en>No deep-fried food in Junior Chef! You can grill it, roast it or steam it.</en>"
  - id: c02
    speaker: Kaan
    text: "<en>I know chips are greasy. But what about grilled chips? Please?</en>"
  - id: c03
    speaker: Selin
    text: "<en>Be realistic, Kaan. Let's buy fresh vegetables at the market.</en>"
  - id: c04
    speaker: Bora
    text: "<en>And I'll mash the potatoes. Without breaking the fork this time!</en>"

