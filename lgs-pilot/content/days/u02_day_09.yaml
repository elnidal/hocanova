      - { speaker: "Selin", text: "Son unuttuğumda üçüncü sınıftaydım. Hâlâ utanıyorum." }
  - item: U2-052
    durum: "Ece anket tablosuna Kaan'ın cevabını yazıyor."
    lines:
      - { speaker: "Kaan", text: "Salı ve perşembe antrenman var: <en>{U2-052|twice} a week</en>." }
      - { speaker: "Ece", text: "Maç da her ayın son pazarı, yani <en>{U2-052|once} a month</en>." }
  - item: U2-053
    durum: "Teneffüs zili çaldı; herkes kantin tezgâhına üşüştü."
    lines:
      - { speaker: "Kantinci teyze", text: "Çocuklar, itişmeyin! Arka arkaya dizilin, düzgün bir {U2-053|queue} olsun!" }
      - { speaker: "Kaan", text: "Ben en arkadayım... yine." }
  - item: U2-054
    durum: "Murat Bey elinde gazeteyle sınıfa giriyor."
    lines:
      - { speaker: "Murat Bey", text: "Sabah gazeteye, akşam bültene bakarım. <en>I {U2-054|follow the news}.</en>" }
      - { speaker: "Bora", text: "Ben sadece hava durumuna bakıyorum: yağmur var mı, yok mu." }
