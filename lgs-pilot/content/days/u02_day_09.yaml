title: "How often…? Anketin en dürüst bölümü"
est_minutes: 10
characters: [Murat Bey, Ece, Selin, Elif, Kaan, Bora, Duru, Kantinci teyze]
new_items: [U2-049, U2-050, U2-051, U2-052, U2-053, U2-054]

story:
  - id: s01
    text: "Pazartesi. Murat Bey tahtaya anketin yeni bölümünü yazdı: \"<en>Part 3: How often…?</en>\" Gruplar teneffüste bu soruları sınıf arkadaşlarına soracaktı."
  - id: s02
    text: "Ece elinde dosyasıyla hazırdı: \"<en>Question one: How often do you read books, Bora?</en>\" Bora tavana baktı, parmaklarıyla saydı, sonra yine tavana baktı."
  - id: s03
    text: "Bora: \"<en>Hmm… I {U2-049|rarely} read books. Maybe {U2-052|once a year}?</en>\" Elif'in gözleri kocaman oldu: \"<en>Once a year?!</en>\""
  - id: s04
    text: "Bora hemen ekledi: \"<en>But comics count, right? I read comics {U2-052|three times a week}!</en>\" Selin cevabı yazarken gülmemek için kendini zor tuttu."
  - id: s05
    text: "Ece ikinci soruya geçti: \"<en>Question two: Are you on time for school?</en>\" Ama Kaan ortada yoktu. Zil çalalı on dakika olmuştu."
  - id: s06
    text: "Selin kalemini bıraktı: \"<en>Kaan is {U2-051|hardly ever} on time. I can answer this one for him.</en>\""
  - id: s07
    text: "Tam o anda kapı açıldı. Kaan nefes nefese içeri daldı, sırtında kocaman bir çanta: \"<en>Sorry, sorry! {U1-075|I'm always in a hurry}, I know!</en>\""
  - id: s08
    text: "Kaan çantasını yere bıraktı: \"<en>I was at the {U2-031|gym}. I {U2-032|work out} three times a week now. I'm {U2-033|training} for the basketball team!</en>\""
  - id: s09
    text: "Elif kollarını kavuşturdu: \"<en>OK, you {U2-034|look fit}, Kaan. But you're late again!</en>\""
  - id: s10
    text: "Ece dosyasına yazdı: \"<en>Kaan: {U2-051|hardly ever} on time. Gym: {U2-052|three times a week}.</en>\""
  - id: s11
    text: "Duru esnedi: \"<en>I {U2-050|seldom} go to the gym. Actually, never. My sofa is my gym.</en>\""
  - id: s12
    text: "Murat Bey arkadan geçerken durdu: \"<en>'{U2-050|Seldom}'! What a nice word, Duru. It's like 'rarely', but a bit more formal.</en>\""
  - id: s13
    text: "Teneffüs zili çaldı ve herkes kantine koştu. Kantinin önü tıklım tıklımdı. Elif durdu: \"<en>Look at this {U2-053|queue}! It's so long!</en>\""
  - id: s14
    text: "Kaan karnını tuttu: \"<en>I'm so hungry!</en>\" ve sessizce en öne süzülmeye çalıştı. Selin kolundan yakaladı: \"<en>Kaan! Wait in the {U2-053|queue} like everyone else.</en>\""
  - id: s15
    text: "Kaan boynunu büktü, en arkaya geçti. Bora ise ellerini ovuşturdu: \"<en>Good idea! This {U2-053|queue} is perfect for our survey!</en>\""
  - id: s16
    text: "Ece öndeki yedinci sınıf öğrencisine sordu: \"<en>How often do you play a {U2-036|team sport}?</en>\" Çocuk gülümsedi: \"<en>{U2-052|Twice a week}. Football!</en>\""
  - id: s17
    text: "Selin beklerken telefonundan bir şey okuyordu. Elif merakla eğildi: \"<en>What are you reading?</en>\" Selin: \"<en>The news. I {U2-054|follow the news} every morning.</en>\""
  - id: s18
    text: "Bora şaşırdı: \"<en>Every morning? I {U2-049|rarely} {U2-054|follow the news}. I only know the football scores.</en>\""
  - id: s19
    text: "Bora: \"<en>Isn't it {U1-095|boring}?</en>\" Selin: \"<en>Not at all! If you don't {U2-054|follow the news}, you {U1-016|miss} important things.</en>\""
  - id: s20
    text: "Kaan arkadan seslendi: \"<en>I {U2-049|rarely} miss a basketball match on TV. Does that count?</en>\" Selin gözlerini devirdi."
  - id: s21
    text: "Yirmi dakika sonra Kaan nihayet tezgâha ulaştı. Kantinci teyze omuz silkti: \"<en>Sorry, dear. No more toasties!</en>\""
  - id: s22
    text: "Kaan dizlerinin üstüne çöktü: \"<en>This is why I {U2-051|hardly ever} get a toastie. I'm always late!</en>\""
  - id: s23
    text: "Duru sandviçini ikiye böldü: \"<en>Here, take half. You need it, Mr {U2-035|Energetic}.</en>\" Kaan sandviçe bir hazine gibi baktı."
  - id: s24
    text: "Ece dosyasını kapattı: \"<en>Great answers! Bora {U2-049|rarely} reads, Kaan is {U2-051|hardly ever} on time and Duru {U2-050|seldom} goes to the gym.</en>\" Bora: \"<en>Please don't write my name!</en>\""

scene:
  - id: c01
    speaker: Ece
    text: "<en>Survey, part 3: How often do you read books?</en>"
  - id: c02
    speaker: Bora
    text: "<en>I rarely read books. But I read comics three times a week!</en>"
  - id: c03
    speaker: Selin
    text: "<en>And Kaan is hardly ever on time. He was late again today.</en>"
  - id: c04
    speaker: Kaan
    text: "<en>Sorry! And the queue in the canteen was so long. No toasties left!</en>"
  - id: c05
    speaker: Selin
    text: "<en>I follow the news every morning. You should try it, Bora!</en>"

steps:
  - item: U2-049
    sezdir:
      id: u2d09-049-z
      type: meaning
      context: s03
      prompt: "Hikâyede \"rarely\" ne anlama geliyordu?"
      options: ["nadiren", "sık sık", "her zaman", "her gün"]
      answer: 0
    kullan:
      id: u2d09-049-k
      type: gap_fill
      prompt: "Boşluğa uygun olanı seç."
      stem: "<en>Bora doesn't like reading. He ________ reads books, maybe once a year.</en>"
      options: ["rarely", "always", "usually", "often"]
      answer: 0
      explain: "Okumayı sevmeyen kişi yılda bir kez okuyorsa nadiren (rarely) okur."
    sina:
      id: u2d09-049-s
      type: message_infer
      lgs_like: true
      prompt: "<en>Look at Can's week. Which sentence is TRUE?</en>"
      stem: "<en>Can's activities\nplay computer games: every day\ngo swimming: twice a week\nread a book: once a month</en>"
      options: ["Can rarely reads books.", "Can rarely plays computer games.", "Can never goes swimming.", "Can reads a book every day."]
      answer: 0
      explain: "Ayda bir kez kitap okuyan biri için \"rarely\" kullanılır."
      why_wrong:
        - "Bilgisayar oyunu \"every day\"; nadiren değil, her gün."
        - "\"Never\" yanlış; Can \"twice a week\" yüzüyor."
        - "Kitap \"once a month\"; \"every day\" ise oyun satırına ait."
