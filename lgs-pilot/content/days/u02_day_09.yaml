  end_good: "Süpersin! Sen dersleri hardly ever kaçıran, always çalışan birisin. Kaan'a da biraz dakiklik öğretsene! ⏰"
  end_mixed: "Gayet iyi! {weak} biraz kafa karıştırdı ama sorun değil, yarın tekrar karşına çıkacak. Kaan bile sonunda tezgâha ulaştı! 🥪"

