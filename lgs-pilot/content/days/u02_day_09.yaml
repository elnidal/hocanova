tips:
  - type: mini_dilbilgisi
    refs: [U2-049, U2-051, U2-044]
    text: "rarely, seldom, hardly ever da diğer sıklık zarfları gibi ana fiilden önce, be fiilinden sonra gelir: \"Bora rarely reads.\" · \"Kaan is hardly ever on time.\""
  - type: tuzak
    refs: [U2-051]
    text: "hardly ever zaten olumsuz anlam taşır; yanına not koyma! ❌ \"I don't hardly ever eat it.\" ✅ \"I hardly ever eat it.\""
  - type: lgs_taktigi
    refs: [U2-052]
    text: "1 = once, 2 = twice, 3 ve sonrası = three times, four times… Sonuna zaman ekle: once a week, twice a month, three times a year. Takvim tablolarında günleri say!"
  - type: tuzak
    refs: [U2-053]
    text: "queue /kjuː/ okunur, yani sadece \"kyu\". Sondaki \"ueue\" harfleri ayrıca okunmaz. İngilizler queue der, Amerikalılar line."

