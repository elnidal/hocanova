tips:
  - type: tuzak
    refs: [U2-013]
    text: "stand = ayakta durmak, ama can't stand = katlanamamak! Arkasından -ing gelir: \"I can't stand waiting.\" (Beklemeye katlanamam.)"
  - type: lgs_taktigi
    refs: [U2-015, U2-014, U2-013, U2-011]
    text: "Beğeni ölçeği: be crazy about / love (çok olumlu) → like / enjoy / be into → don't mind (ortada) → dislike → hate / can't stand (çok olumsuz). LGS bu sıralamayı tablo ile sorar."
  - type: mini_dilbilgisi
    refs: [U2-016]
    text: "be into gündelik konuşma dilidir: \"I'm into jazz.\" \"Are you into video games?\" Arkasından isim ya da -ing gelir."
  - type: kelime_ailesi
    refs: [U2-018, U1-077]
    text: "Ünite 1'den honest = dürüst. to be honest = dürüst olmak gerekirse. Zıttı: dishonest; isim hâli: honesty."

