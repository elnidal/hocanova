story:
  - id: s01
    text: "Çarşamba sabahı. Anketin yeni bölümü hazırdı ve Ece ilk soruyu daha sınıfın kapısında sordu."
  - id: s02
    text: "Ece: \"<en>What do you {U2-014|hate} doing in the morning?</en>\""
  - id: s03
    text: "Bora gözlerini zor açık tutuyordu: \"<en>I {U2-013|can't stand} getting up early. My alarm rang five times today.</en>\""
  - id: s04
    text: "Kaan: \"<en>Five times? So you {U1-016|missed} the first bus again!</en>\" Bora: \"<en>No. I {U1-016|missed} the second one too.</en>\""
  - id: s05
    text: "Selin: \"<en>{U2-018|To be honest}, I {U2-012|dislike} mornings too, but I'm never late.</en>\""
  - id: s06
    text: "Sıra Kaan'a geldi. Daha soru bitmeden cevap verdi: \"<en>Football! I'm {U2-015|crazy about} football!</en>\""
  - id: s07
    text: "Kaan: \"<en>I play it, I watch it, I dream about it. My bedroom walls are green, like a pitch!</en>\""
  - id: s08
    text: "Elif: \"<en>Kaan is {U2-015|crazy about} football, and I'm {U2-015|crazy about} Luna Ray's songs!</en>\""
  - id: s09
    text: "Elif telefonunun ekranını herkese gösterdi: sahnede mikrofonuyla Luna Ray. Kaan: \"<en>Who's that?</en>\" Elif: \"<en>The singer I {U2-017|admire} most!</en>\""
  - id: s10
    text: "Elif: \"<en>I really {U2-017|admire} her. She writes her own songs and she helps animal shelters.</en>\""
  - id: s11
    text: "Duru: \"<en>I {U2-017|admire} people who write songs. It's hard. I tried once and fell asleep.</en>\""
  - id: s12
    text: "Ece: \"<en>Duru, what are you {U2-016|into} these days?</en>\" Duru: \"<en>I'm {U2-016|into} old rock songs. Guitar solos!</en>\""
  - id: s13
    text: "Elif: \"<en>Really? I'm {U2-016|into} pop. But maybe we can find a middle way…</en>\" Duru ile Elif bakıştı; ikisinin de aklında bir fikir belirmişti."
  - id: s14
    text: "Selin sıradaki soruyu okudu: \"<en>Which school subject do you {U2-014|hate}?</en>\""
  - id: s15
    text: "Kaan: \"<en>I don't {U2-014|hate} any subjects. I {U2-014|hate} homework!</en>\" Murat Bey tam o anda sınıfa girmişti."
  - id: s16
    text: "Murat Bey gülümsedi: \"<en>{U2-018|To be honest}, Kaan, checking homework isn't my favourite thing either.</en>\""
  - id: s17
    text: "Bora cesaretini topladı: \"<en>Sir, is there anything you {U2-013|can't stand}?</en>\""
  - id: s18
    text: "Murat Bey: \"<en>Yes. Students who say 'This is {U1-095|boring}' before the lesson starts.</en>\""
  - id: s19
    text: "Bora ağzını hemen kapattı. Selin fısıldadı: \"<en>He {U2-013|can't stand} that word. Don't say it!</en>\""
  - id: s20
    text: "Ders sonunda Ece sonuçları saydı: \"<en>Three of us {U2-013|can't stand} early mornings, and two of us are {U2-015|crazy about} music.</en>\""
  - id: s21
    text: "Elif: \"<en>{U2-018|To be honest}, this project is more {U1-096|exciting} than I thought.</en>\""
  - id: s22
    text: "Kaan: \"<en>Because it's about us! Everybody is {U2-016|into} talking about themselves.</en>\" Duru ise çoktan başını sıraya koymuştu."

scene:
  - id: c01
    speaker: Ece
    text: "<en>What do you hate doing, Bora?</en>"
  - id: c02
    speaker: Bora
    text: "<en>I can't stand getting up early. To be honest, I hate Monday mornings.</en>"
  - id: c03
    speaker: Kaan
    text: "<en>I'm crazy about football! What about you, Elif?</en>"
  - id: c04
    speaker: Elif
    text: "<en>I'm into pop music. I really admire Luna Ray. 🎤</en>"

