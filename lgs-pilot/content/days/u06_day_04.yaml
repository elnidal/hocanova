story:
  - id: s01
    text: "Perşembe, saat tam 3.40. Selin'in babası okul kapısındaydı; ne 3.39 ne 3.41. Bugün altı kişiyi alışveriş merkezindeki spor mağazasına götürecekti."
  - id: s02
    text: "Ece arabada dört sayfalık listesini açtı: \"<en>Page one: camp {U6-022|equipment}. Number one: a {U6-023|helmet}. Number two: knee {U6-023|pads}. Number three: a {U6-024|rope}…</en>\""
  - id: s03
    text: "Kaan: \"<en>Four pages? We're going for two days, not two years! I'm an {U6-003|adrenaline seeker}. I don't need a list!</en>\""
  - id: s04
    text: "Selin: \"<en>An {U6-003|adrenaline seeker} with no {U6-023|helmet}? That's {U6-011|dangerous}, Kaan.</en>\""
  - id: s05
    text: "Mağazaya girer girmez Kaan raftan kırmızı, parlak bir şey kapıp kafasına geçirdi ve aynaya döndü: \"<en>Look at me! A real {U6-001|adventurer}!</en>\" Ece: \"<en>Red is very {U1-072|fashionable} this spring.</en>\""
  - id: s06
    text: "Bora ise doğruca mağazanın en karanlık köşesine gitti: \"<en>I need a {U6-025|flashlight}. A big one. For bugs. I want to see them before they see me.</en>\""
  - id: s07
    text: "Bora görevliye döndü: \"<en>Excuse me, {U6-046|how much does} this {U6-025|flashlight} {U6-046|cost}?</en>\" Görevli: \"<en>The big one is 300 liras. The small one is 120.</en>\""
  - id: s08
    text: "Selin'in babası cebinden küçük bir defter çıkarıp fiyatları yazdı; tıpkı Selin gibi. Sonra ikisini de yakıp duvara tuttu: \"<en>The big one is {U6-033|more expensive}, but the small one is {U6-033|brighter}. Interesting.</en>\""
  - id: s09
    text: "Duru'yu bir süre kimse görmedi. Sonra mağazanın ortasındaki sergi hamağından bir ses geldi: \"<en>Is this camp {U6-022|equipment}? Then I'm ready.</en>\""
  - id: s10
    text: "Elif başka bir rafın önünde çığlık attı: \"<en>Look, a pink {U6-026|life jacket}! Pamuk has one just like this!</en>\""
  - id: s11
    text: "Ece: \"<en>A {U6-026|life jacket} is on page two. For the lake. No {U6-026|life jacket}, no water activities.</en>\""
  - id: s12
    text: "Kaan etikete uzandı: \"<en>{U6-046|How much does it cost}?</en>\" Görevli: \"<en>This one {U6-046|costs} 650 liras.</en>\""
  - id: s13
    text: "Kaan: \"<en>650?! My football boots {U6-046|cost} less!</en>\""
  - id: s14
    text: "Ece listedeki her şeyi telefonundaki hesap makinesine girdi ve bir an sustu: \"<en>Total for one person: 2,400 liras.</en>\" Mağazada derin bir sessizlik oldu."
  - id: s15
    text: "Selin'in babası: \"<en>Hmm. Wait a minute. I think the camp sent an email last night.</en>\""
  - id: s16
    text: "Selin e-postayı açıp okudu: \"<en>'Dear parents, we provide all {U6-022|safety equipment}: {U6-023|helmets}, {U6-024|ropes} and {U6-026|life jackets}. Students only need a {U6-025|flashlight}, a water bottle and warm clothes.'</en>\""
  - id: s17
    text: "Ece listesine baktı. İlk iki sayfa bir anda boşa gitmişti: \"<en>Two pages… for nothing.</en>\""
  - id: s18
    text: "Elif ona sarıldı: \"<en>Not for nothing! Now we know a lot about camp {U6-022|equipment}. That's a good {U6-027|experience} too!</en>\""
  - id: s19
    text: "Ece gülümseyip sayfayı çevirdi: \"<en>OK. New plan. {U6-038|What kind of} {U6-025|flashlight} do we need?</en>\" Selin'in babası defterini gösterdi: \"<en>A small one. It {U6-046|costs} less, and it's brighter. And today there's a {U5-049|discount}.</en>\""
  - id: s20
    text: "Kaan hâlâ kırmızı şeyi çıkarmamıştı: \"<en>Can I keep this {U6-023|helmet} on? It's my {U6-002|extreme sports} look!</en>\" Görevli: \"<en>Only if you buy it.</en>\" Kaan onu bir saniyede rafa geri koydu."
  - id: s21
    text: "Bora bu arada kalın, sarı bir şeyi omzuna dolamıştı: \"<en>And this {U6-024|rope}? For the climbing wall?</en>\" Selin: \"<en>The camp gives us the {U6-024|ropes}, Bora. Put it back.</en>\""
  - id: s22
    text: "Kasada Ece saydı: \"<en>Six people, six small {U6-025|flashlights}… Wait. Five people. Where's Duru?</en>\" Duru sergi hamağında, kollarını kavuşturmuş, mışıl mışıl uyuyordu."
  - id: s23
    text: "Akşam Kaan gruba yazdı: \"<en>Bus at 7 a.m. tomorrow. Three alarms are ready. Me? Late? Never!</en>\" Selin: \"<en>I'll call you at 6.15. Just in case.</en>\""

