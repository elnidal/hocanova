status: draft
title: "Pas ver, Bora!"
est_minutes: 10
characters: [Kaan, Bora, Ece, Selin, Duru, Elif, Fıstık (köpek)]
new_items: [U1-027, U1-032, U1-031, U1-041, U1-045, U1-046]

story:
  - id: s01
    text: "Bilim fuarının üzerinden bir hafta geçmişti. Cuma, beden eğitimi dersi. Sınıf iki takıma ayrıldı; Kaan ile Bora aynı takımdaydı."
  - id: s02
    text: "Elif kenardan izliyordu: \"<en>On my first day, you {U1-039|introduced} me to them. Are they {U1-030|close friends}?</en>\""
  - id: s03
    text: "Ece gururla anlattı: \"<en>Yes! They {U1-034|get on well} and they {U1-036|have a lot in common}. They're both {U1-038|interested in} football.</en>\""
  - id: s04
    text: "Duru çimenlere uzanmış, gözleri yarı kapalı ekledi: \"<en>But they never have the {U1-042|same opinion} about a match. Never.</en>\""
  - id: s05
    text: "Elif güldü: \"<en>Two good friends with a great {U1-041|relationship}… What could go wrong?</en>\""
  - id: s06
    text: "Maç başladı. Kaan sahada her yere koşuyor, durmadan sesleniyordu: \"<en>Pass! Bora, pass the ball!</en>\""
  - id: s07
    text: "Bora topu bırakmadı; üç kişiyi geçti, şut çekti ve… top direğe çarptı."
  - id: s08
    text: "Kaan ellerini havaya kaldırdı: \"<en>Why didn't you pass? I was free!</en>\" Bora da geri durmadı: \"<en>You weren't free! You never listen!</en>\""
  - id: s09
    text: "Öğretmen düdüğü çaldı ama ikisi hâlâ susmuyordu. Selin içini çekti: \"<en>Oh no. They're {U1-027|arguing} again.</en>\""
  - id: s10
    text: "Elif şaşırdı: \"<en>Do they often {U1-027|argue}?</en>\" Duru esnedi: \"<en>Only about football. And food. And music. And…</en>\""
  - id: s11
    text: "Ama bu kez farklıydı. Soyunma odasında da susmadılar. Kaan: \"<en>You only play for yourself!</en>\" Bora: \"<en>And you only talk!</en>\""
  - id: s12
    text: "Ece araya girdi: \"<en>Please stop {U1-027|arguing}! It's just a game.</en>\" Bora çantasını kaptığı gibi çıktı."
  - id: s13
    text: "Kaan ile Bora'nın {U1-041|RELATIONSHIP}'i ilk kez bu kadar sallantıdaydı. Teneffüste Bora bahçenin en uzak bankına oturdu; kulaklığını taktı, kimseye bakmadı."
  - id: s14
    text: "Selin yanına gitti: \"<en>Are you OK?</en>\" Bora başını iki yana salladı: \"<en>Not really. I {U1-031|feel alone}. Everyone is on Kaan's side.</en>\""
  - id: s15
    text: "Selin bankın ucuna oturdu: \"<en>That's not true. But I understand your {U1-032|feelings}.</en>\""
  - id: s16
    text: "Akşam sınıf grubu bile sessizdi. Duru gruba seslendi: \"<en>Why is everyone so quiet? Doesn't anyone want to {U1-029|chat}?</en>\" Ses çıkaran olmadı; Fıstık bile sessizdi."
  - id: s17
    text: "Kaan odasında telefonunu evirip çeviriyordu. Sonunda Ece'yi aradı: \"<en>Should I {U1-046|text} Bora?</en>\" Ece: \"<en>Of course! {U1-046|Text} him now!</en>\""
  - id: s18
    text: "Kaan'ın parmakları ekranda dolaştı: \"<en>Hey, sorry about the match. Are we OK?</en>\" İki mavi tik. Sonra… hiçbir şey."
  - id: s19
    text: "Yarım saat sonra yeniden denedi: \"<en>I {U1-046|texted} you twice, Bora. Please answer.</en>\" Yine iki mavi tik."
  - id: s20
    text: "Kaan, Ece'yi bir kez daha aradı: \"<en>Why doesn't he answer when I {U1-046|text} him? I have a bad {U1-032|feeling} about this. Now I {U1-031|feel alone} too.</en>\""
  - id: s21
    text: "Ece onu sakinleştirmeye çalıştı: \"<en>Bora has {U1-032|feelings} too. Give him time. You two have a {U1-045|strong bond}.</en>\""
  - id: s22
    text: "Peki {U1-045|STRONG BOND} dedikleri şey, direğe çarpan tek bir şut yüzünden kopar mıydı?"
  - id: s23
    text: "Selin gruba kısa bir not bıraktı: \"<en>Boys, your {U1-041|relationship} is more important than a football match.</en>\""
  - id: s24
    text: "Bora o gece telefonu ters çevirip tavana baktı. Ona sorsalar \"<en>I {U1-031|feel alone}</en>\" derdi; ama asıl derdi o şut değildi…"
  - id: s25
    text: "Asıl sebebi henüz kimse bilmiyordu. Duru ise Fıstık'ın kulağına fısıldadı: \"<en>Don't worry. A {U1-045|strong bond} doesn't break so easily.</en>\""

scene:
  - id: c01
    speaker: Selin
    text: "<en>Kaan and Bora argued after the match. Now Bora feels alone.</en>"
  - id: c02
    speaker: Elif
    text: "<en>Did Kaan text him?</en>"
  - id: c03
    speaker: Ece
    text: "<en>Yes, twice. But Bora didn't reply. I hope their relationship is OK.</en>"
  - id: c04
    speaker: Duru
    text: "<en>Don't worry. They have a strong bond.</en>"

