tips:
  - type: tuzak
    refs: [U1-046]
    text: "text fiil olarak \"mesaj atmak\": \"Text me!\" = Bana mesaj at! İsim olarak ise \"metin\": \"Read the text.\" LGS'de kelimenin cümledeki yerine bak: başında \"I/you/he\" ya da sonunda \"me/him\" varsa büyük ihtimalle fiil."
  - type: kelime_ailesi
    refs: [U1-032, U1-031]
    text: "feel (hissetmek) → feeling (duygu, his). feel alone, feel happy, feel tired… Kalıp: \"hurt someone's feelings\" = birinin kalbini kırmak."
  - type: mini_dilbilgisi
    refs: [U1-027]
    text: "argue WITH someone (biriyle), argue ABOUT something (bir konuda): \"Kaan argued with Bora about the match.\" Edat ikilisini bir arada ezberle."
  - type: hafiza_kancasi
    refs: [U1-045, U1-041]
    text: "bond kelimesini bir ip gibi düşün: iki kişiyi birbirine bağlayan görünmez ip. strong bond = kopmayan, kalın bir ip."

coach:
  start: "Bugün sahada gerginlik var: Kaan ve Bora aynı takımda ama aynı sayfada değil… ⚽ Önce dünkü kelimelere hızlı bir bakış."
  end_good: "Süpersin! Zor anları anlatan kelimeleri de öğrendin. Yarın Bora'nın neden bu kadar kırgın olduğunu öğreneceğiz. 🕵️"
  end_mixed: "Bugün hikâye biraz gergindi, kelimeler de öyle. {weak} yarın tekrar karşına çıkacak; ikinci görüşte hep daha kolay."

notifications:
  morning: "Bir şut, bir direk ve susmayan iki çocuk ⚽ Bugün sahada ne oldu?"
  evening: "İki mavi tik, sıfır ses… Kaan'ın telefonunda neler oluyor? 10 dakika 📱"
  review: "Tek soru: \"Text me!\" cümlesinde text ne demek?"

