tips:
  - type: tuzak
    refs: [U2-059, U2-042]
    text: "nervous \"sinirli\" DEĞİL! nervous = gergin, heyecanlı (sınav öncesi, sahne öncesi). Sinirlenmiş biri için annoyed ya da angry kullanılır."
  - type: hafiza_kancasi
    refs: [U2-056]
    text: "surf the internet: Sörfçü dalgadan dalgaya geçer, sen de sayfadan sayfaya! 🏄"
  - type: ilginc_bilgi
    refs: [U2-057]
    text: "\"selfie\" kelimesi 2013'te Oxford Sözlükleri tarafından yılın kelimesi seçildi."
  - type: mini_dilbilgisi
    refs: [U2-058]
    text: "share + bir şey + on social media: \"I shared my photo on social media.\" Gündelik dilde aynı anlamda post da kullanılır: \"I posted it online.\""

