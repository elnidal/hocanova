story:
  - id: s01
    text: "Cumartesi akşamı. Ece herkesi görüntülü aramaya topladı; anket sorularını bitireceklerdi: \"<en>OK, everyone! Let's {U2-055|chat online} for ten minutes and finish the survey questions.</en>\""
  - id: s02
    text: "Ekranlar tek tek açıldı. Duru kanepede, battaniyenin altındaydı: \"<en>I'm here. I'm just {U2-040|resting}. Saturday is my sofa day.</en>\""
  - id: s03
    text: "Selin'in yanakları kıpkırmızıydı: \"<en>We went {U2-039|hiking} with my dad this morning. Ten kilometres!</en>\""
  - id: s04
    text: "Bora'nın ekranı ise kapkaranlıktı. Sonra birden bembeyaz bir karate kıyafetiyle ekranda belirdi."
  - id: s05
    text: "Bora: \"<en>Look! I just came back from my karate class. I {U2-038|do karate} now! It's an {U2-037|individual sport}. No team, no stress.</en>\""
  - id: s06
    text: "Kaan: \"<en>Cool! But why are you holding your phone up like that?</en>\" Bora: \"<en>I want to {U2-057|take a selfie} in my karate clothes.</en>\""
  - id: s07
    text: "Bora telefonu havaya kaldırdı. İlk fotoğrafta gözleri kapalıydı. İkincisinde sadece alnı vardı. Üçüncüsünde arkada annesi, elinde bir tavayla duruyordu."
  - id: s08
    text: "Bora saçlarını çekiştirdi: \"<en>Why is it so hard to {U2-057|take a selfie}?!</en>\" Kaan kahkahayı bastı: \"<en>Bora, you're so {U1-073|funny}!</en>\""
  - id: s09
    text: "Elif: \"<en>Try a filter! There's one with a cat face.</en>\" Bora denedi: ekranda bıyıklı, kulaklı, karate kuşaklı bir kedi belirdi. Bora'nın hiç olmayan kedisi sonunda ortaya çıkmıştı!"
  - id: s10
    text: "Ece elini alnına vurdu: \"<en>That filter is {U2-060|ridiculous}! A karate cat?</en>\""
  - id: s11
    text: "Bora: \"<en>{U2-060|Ridiculous}? No, it's art! I want to {U2-058|share it on social media} right now.</en>\""
  - id: s12
    text: "Selin parmağını kaldırdı: \"<en>Wait, Bora! {U2-041|Pay attention} to the settings. The whole school can see it.</en>\""
  - id: s13
    text: "Bora'nın parmağı mavi düğmenin üstünde titriyordu. Alnında küçük ter damlaları belirdi."
  - id: s14
    text: "Bora: \"<en>I'm so {U2-059|nervous}! What if nobody likes it?</en>\""
  - id: s15
    text: "Duru battaniyenin altından seslendi: \"<en>Relax. It's just a photo. Why are you {U2-059|nervous}?</en>\""
  - id: s16
    text: "Bu arada Kaan'ın gözleri başka bir yerdeydi. Ece: \"<en>Kaan? Are you listening?</en>\" Kaan: \"<en>Sorry! I'm {U2-056|surfing the internet}. I'm looking for new basketball shoes.</en>\""
  - id: s17
    text: "Ece kaşlarını çattı: \"<en>I'm getting {U2-042|annoyed}, guys! We need to finish the survey!</en>\""
  - id: s18
    text: "Elif'in aklına bir fikir geldi: \"<en>Wait! Let's add new questions: How often do you {U2-056|surf the internet}? Do you {U2-055|chat online} with friends?</en>\""
  - id: s19
    text: "Ece'nin yüzü bir anda aydınlandı: \"<en>Great idea! And: How often do you {U2-057|take a selfie}? Do you {U2-058|share photos on social media}?</en>\""
  - id: s20
    text: "Tam o sırada Bora derin bir nefes aldı ve düğmeye bastı: \"<en>Done! I {U2-058|shared it}. Now I'm really {U2-059|nervous}.</en>\""
  - id: s21
    text: "İki dakika sonra telefon titredi: 1 beğeni, 5 beğeni, 20 beğeni! Murat Bey bile yorum yazmıştı: \"<en>Nice karate cat, Bora! Don't forget the survey. 😄</en>\""
  - id: s22
    text: "Kaan hemen Bora'ya özelden yazdı: \"<en>I'm going to {U1-046|text} you a better filter: karate dinosaur! 🦖</en>\" Bora: \"<en>No, thanks! One {U2-060|ridiculous} photo is enough.</en>\""
  - id: s23
    text: "Selin: \"<en>So our survey has an {U1-096|exciting} new part!</en>\" Ece: \"<en>Yes! Teens online: {U2-055|chatting online}, {U2-056|surfing the internet} and taking selfies.</en>\""
  - id: s24
    text: "Ekranlar teker teker kapandı. Duru hâlâ battaniyenin altındaydı: \"<en>Finally! Now I can {U2-040|rest} again.</en>\""

scene:
  - id: c01
    speaker: Bora
    text: "<en>I took a selfie in my karate clothes. Should I share it on social media?</en>"
  - id: c02
    speaker: Ece
    text: "<en>With that cat filter? It's ridiculous!</en>"
  - id: c03
    speaker: Bora
    text: "<en>I know, but I love it. I'm just a bit nervous. What if nobody likes it?</en>"
  - id: c04
    speaker: Kaan
    text: "<en>Just post it! I'm surfing the internet now. I can like it first.</en>"
  - id: c05
    speaker: Elif
    text: "<en>Let's chat online again tomorrow and finish the survey.</en>"

