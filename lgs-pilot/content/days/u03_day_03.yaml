tips:
  - type: tuzak
    refs: [U3-013]
    text: "crack iki anlamlı! Yumurtayla fiil olarak \"kırmak\": crack an egg. İsim olarak \"çatlak\": a crack on my phone screen. Yumurta görürsen \"kır\" diye çevir."
  - type: tuzak
    refs: [U3-041]
    text: "saucepan \"sos tavası\" değil, saplı tenceredir; içinde çorba da makarna da pişer. (frying) pan ise yağda kızartma yaptığımız tavadır."
  - type: tuzak
    refs: [U3-018]
    text: "Türkçede \"karıştırmak\" bir de \"ayırt edememek\" demek. Bu anlamda mix değil mix up denir: I always mix up these words. Yumurtaları karıştırmak ise mix the eggs."
  - type: kelime_ailesi
    refs: [U3-018, U3-004, U3-041]
    text: "mix (karıştırmak) → mixture (karışım) → mixer (mikser). fry (kızartmak) → fried (kızarmış: fried eggs) → frying pan (kızartma tavası)."

