story:
  - id: s01
    text: "Pazar sabahı, saat dokuz, Duru'nun evi. Masada bir düzine yumurta, süt ve tereyağı vardı. Duru, Bora ve Fıstık hazırdı. Kaan yoktu. Tabii ki."
  - id: s02
    text: "Duru telefonuna baktı. Kaan'dan mesaj: \"<en>On my way! Two minutes!</en>\" Duru telefonu bıraktı: \"<en>That means twenty.</en>\""
  - id: s03
    text: "Duru'nun annesi ocağın başına geçti: \"<en>I'm here for the hot things, kids. You can do the rest.</en>\""
  - id: s04
    text: "Duru, Bora'ya döndü: \"<en>So, your cat was sick yesterday. Is it better today?</en>\" Bora ciddi ciddi başını salladı: \"<en>Much better. It says hello.</en>\""
  - id: s05
    text: "Tam on sekiz dakika geçince kapı çaldı. Kaan içeri daldı; bir çorabı mavi, öbürü turuncuydu. \"<en>Sorry, sorry! Let's go! Quick, quick!</en>\""
  - id: s06
    text: "Kaan telefonundan bir video açıp hızla okudu: \"<en>Omelette. {U3-052|Step} one: {U3-013|crack} three eggs into a {U3-038|bowl}. Easy!</en>\""
  - id: s07
    text: "Kaan bir yumurta kaptı ve acele ile heyecan arasında bir yerde, onu {U3-038|bowl}'un kenarına değil… kendi alnına vurdu. Çat! Yumurtanın sarısı burnundan aşağı akmaya başladı."
  - id: s08
    text: "Fıstık havlayarak etrafında dönmeye başladı. Duru kaşını kaldırdı: \"<en>Wow, Kaan. You can {U3-013|crack} an egg… with your head.</en>\" Kaan da dahil herkes gülmekten iki büküldü."
  - id: s09
    text: "Bora sessizce Kaan'a bir peçete uzattı ve kollarını sıvadı: \"<en>OK. Leave it to me.</en>\""
  - id: s10
    text: "Bir yumurtayı {U3-038|bowl}'un kenarına hafifçe vurdu ve tek eliyle ikiye ayırdı. Bir, iki, üç: tek bir kabuk parçası bile içeri düşmedi. \"<en>You {U3-013|crack} it on the side of the {U3-038|bowl}, buddy. Not on your head.</en>\""
  - id: s11
    text: "Kaan'ın ağzı açık kaldı. Bora bir çatal aldı ve yumurtaları hızlı hızlı çevirmeye başladı: \"<en>Now we {U3-026|whisk} them. Fast, like this, with a fork.</en>\""
  - id: s12
    text: "Kaan çatalı kaptı: \"<en>Let me {U3-026|whisk}! I'm good at fast!</en>\" Öyle hızlı çevirdi ki yumurta köpüğü Duru'nun yanağına sıçradı. Duru: \"<en>Thanks. I always wanted an egg face mask.</en>\""
  - id: s13
    text: "Bora çatalı nazikçe geri aldı: \"<en>Kaan, {U3-026|whisk} slowly. The eggs aren't a basketball.</en>\""
  - id: s14
    text: "Duru'nun annesi ocağı yaktı ve büyük bir {U3-041|pan}'ı ateşin üstüne yerleştirdi. Bora: \"<en>Thanks! A little butter in the {U3-041|pan}, and we wait.</en>\""
  - id: s15
    text: "Bora yumurtaların üstüne bir tutam tuz ve biraz süt attı: \"<en>Duru, can you {U3-018|mix} this, please?</en>\""
  - id: s16
    text: "Duru kaşıkla ağır ağır çevirdi: \"<en>I'm {U3-018|stirring}. Slowly. I'm a {U1-079|laid-back} chef.</en>\" Fıstık da başını sallayarak onu onayladı."
  - id: s17
    text: "Kaan elini uzattı: \"<en>Can I {U3-020|pour}?</en>\" Bora ve Duru aynı anda bağırdı: \"<en>No!</en>\""
  - id: s18
    text: "Duru'nun annesinin gözü üstlerindeydi. Bora: \"<en>Now I {U3-020|pour} the {U3-018|mixture} into the {U3-041|pan}. Not too fast.</en>\" Cızzz! Bütün evi tereyağı kokusu sardı."
  - id: s19
    text: "Kaan yerinde duramıyordu: \"<en>Can we {U3-004|fry} some potatoes too? And sausages? And…</en>\" Bora başını iki yana salladı: \"<en>No, buddy. We {U3-004|fry} the omelette for three minutes. Only three.</en>\""
  - id: s20
    text: "Kaan gözünü saatten ayırmadı: \"<en>Three minutes?! That's so long! Can't we {U3-004|fry} it faster?</en>\" Bora gülümsedi: \"<en>Good food needs time.</en>\""
  - id: s21
    text: "Üç dakika dolunca Bora {U3-041|pan}'ı sapından tutup tek hareketle omleti ikiye katladı ve tabağa kaydırdı. Altın sarısı, kusursuz bir omlet."
  - id: s22
    text: "Duru ilk lokmayı aldı ve uzun uzun çiğnedi. Herkes nefesini tuttu. Duru: \"<en>Bora. This is perfect.</en>\" Duru'dan gelebilecek en büyük övgü buydu."
  - id: s23
    text: "Kaan hâlâ şaşkındı: \"<en>But you said 'Sorry, I can't'! Your cat was sick!</en>\" Bora omuz silkti: \"<en>My mum is a nurse. She leaves home very early, so I make my own breakfast. Every day, for years.</en>\""
  - id: s24
    text: "Duru'nun annesi herkese bardak getirdi: \"<en>I'll {U3-020|pour} the orange juice. Sit down, chefs! Bora, your team can {U1-051|count on} you.</en>\" Bora'nın kulakları pembeleşti; bu kez hiç bahane yoktu."
  - id: s25
    text: "Üç omlet daha yapıldı. Duru kanepeye uzandı: \"<en>I'm {U1-097|full}. I'm the official tester of this team.</en>\""
  - id: s26
    text: "Akşam Bora sınıf grubuna bir fotoğraf attı: altın sarısı bir omlet. Altında: \"<en>Today I {U3-004|fried} the best omelette in İzmir. Chef Bora. My cat says hello.</en>\" Ece'nin cevabı saniyesinde geldi: \"<en>Wait… Bora can cook?! Can he join our team?</en>\" Kaan: \"<en>No way!</en>\""

scene:
  - id: c01
    speaker: Kaan
    text: "<en>Step one: crack three eggs into a bowl. Ouch! Not on my head!</en>"
  - id: c02
    speaker: Bora
    text: "<en>Leave it to me. First, we whisk the eggs. Then, Duru, you mix in some milk.</en>"
  - id: c03
    speaker: Bora
    text: "<en>Now I pour the mixture into the pan, and we fry it for three minutes.</en>"
  - id: c04
    speaker: Duru
    text: "<en>Bora, this omelette is perfect. You're our secret chef!</en>"

