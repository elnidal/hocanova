story:
  - id: s01
    text: "Pazartesi, İngilizce dersi. Murat Bey ödevleri topluyordu."
  - id: s02
    text: "Kaan'ın masasının önünde durdu: \"<en>Kaan, where is your homework?</en>\""
  - id: s03
    text: "Kaan bir an düşündü ve en masum yüz ifadesini takındı: \"<en>My dog ate it, sir.</en>\""
  - id: s04
    text: "Sınıf bir anda buz kesti. Duru başını kaldırdı: \"<en>Kaan, you don't have a dog. I have a dog.</en>\""
  - id: s05
    text: "Murat Bey gözlüğünü düzeltti ve sakin bir sesle konuştu: \"<en>Kaan, please don't {U1-065|tell lies}. Just tell me the truth.</en>\""
  - id: s06
    text: "Kaan kıpkırmızı oldu: \"<en>OK… That was a {U1-056|lie}. I forgot it at home. I'm sorry.</en>\""
  - id: s07
    text: "Murat Bey gülümsedi: \"<en>Thank you. Bring it tomorrow. {U1-058|Promise}?</en>\" Kaan: \"<en>I {U1-058|promise}!</en>\""
  - id: s08
    text: "Arka masadan Bora mırıldandı: \"<en>He {U1-065|tells lies} all the time. Not only about homework.</en>\""
  - id: s09
    text: "Teneffüste Selin, Bora'yı kantinde buldu: \"<en>What do you mean? {U1-024|What about} the football match? Was it really about football?</en>\""
  - id: s10
    text: "Bora bir süre ayakkabılarına baktı, sonra anlattı: Cumartesileri kimseye çaktırmadan dans kursuna gidiyordu. Tavuk dansından sonra gerçekten dans etmeyi öğrenmek istiyordu."
  - id: s11
    text: "\"<en>It was a {U1-062|secret}. Only Kaan knew. And on Friday, the whole football team asked me about my dance class!</en>\""
  - id: s12
    text: "Selin'in gözleri büyüdü: \"<en>So Kaan {U1-066|told your secret to others}?</en>\""
  - id: s13
    text: "Bora başını salladı: \"<en>Yes. And he {U1-058|promised}! He said, 'I'll never {U1-066|tell your secret to others}.'</en>\""
  - id: s14
    text: "Ece de yanlarına gelmişti. Taşlar yerine oturdu: \"<en>So that's why you didn't pass the ball…</en>\""
  - id: s15
    text: "Bora omuz silkti: \"<en>Maybe. I was angry. I didn't want to play with him.</en>\""
  - id: s16
    text: "Selin her zamanki ciddi yüzüyle konuştu: \"<en>{U1-053|Dishonesty} breaks friendships. A {U1-056|lie} is small at first, then it gets bigger and bigger.</en>\""
  - id: s17
    text: "Duru cipsini çiğnerken ekledi: \"<en>Like the dog that ate the homework. A dog that doesn't exist!</en>\" Bora bile gülmeden duramadı."
  - id: s18
    text: "Tam bu anda Kaan kantinin kapısında belirdi. Bora'yı görünce durdu: \"<en>Bora, {U1-006|do you want to} sit with us?</en>\" Bora: \"<en>No, thanks. I {U1-018|prefer} to sit here.</en>\""
  - id: s19
    text: "Kaan, Selin'e döndü: \"<en>{U1-024|What about} you? Are you angry too?</en>\" Selin: \"<en>I'm not angry. But first the homework {U1-056|lie}, then Bora's {U1-062|secret}… {U1-053|Dishonesty} is a big problem, Kaan.</en>\""
  - id: s20
    text: "Kaan yere baktı: \"<en>You're right. I {U1-066|told his secret to others}. It was a big mistake.</en>\""
  - id: s21
    text: "Ece yumuşak bir sesle ekledi: \"<en>You're not a bad person, Kaan. But {U1-053|dishonesty} hurts people.</en>\""
  - id: s22
    text: "Kaan içini çekti: \"<en>I {U1-010|would like to} talk to Bora. But he doesn't want to talk to me.</en>\""
  - id: s23
    text: "Ece: \"<en>Give him a day. And no more {U1-065|telling lies}, OK?</en>\" Kaan elini kalbine koydu: \"<en>I {U1-058|promise}. A real {U1-058|promise} this time.</en>\""
  - id: s24
    text: "Akşam Elif gruba yazdı: \"<en>{U1-006|Do you want to} watch a film on Saturday? All of us?</en>\""
  - id: s25
    text: "Duru: \"<en>{U1-014|It doesn't matter} which film. I'll sleep anyway.</en>\" Ece: \"<en>{U1-023|That would be great}!</en>\""
  - id: s26
    text: "Kaan yalnızca bir kalp gönderdi. Bora hiçbir şey yazmadı ama bu kez grubu sessize de almadı. Belki onun da bir {U1-062|SECRET}'ı vardı: Kaan'ı özlemişti."

