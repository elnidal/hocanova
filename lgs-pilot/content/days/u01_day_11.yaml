tips:
  - type: tuzak
    refs: [U1-056]
    text: "lie = yalan, yalan söylemek: \"Don't lie to me!\" Ama lie down = uzanmak: \"I want to lie down.\" Geçmiş halleri de farklı: yalan söyledi = lied, uzandı = lay. Yanında down varsa yalan değil, kanepe var!"
  - type: mini_dilbilgisi
    refs: [U1-065, U1-066]
    text: "tell a lie, tell the truth, tell a secret: hepsi TELL ile kurulur. ❌ say a lie, ❌ say a secret. Geçmiş hali: told (He told a lie.)"
  - type: kelime_ailesi
    refs: [U1-053]
    text: "honest (dürüst) → dishonest (dürüst olmayan) → dishonesty (sahtekârlık) · honesty (dürüstlük). dis- eki anlamı tersine çevirir: like → dislike."
  - type: lgs_taktigi
    refs: [U1-058]
    text: "promise hem fiil hem isim: \"I promise.\" (söz veriyorum) · \"a promise\" (bir söz). LGS'de keep a promise (tutmak) ve break a promise (bozmak) eşleşmesine dikkat."

coach:
  start: "Bugün Murat Bey'in dersinde bir köpek ödev yiyor… ama ortada köpek yok! 🐶 Önce dünkü kelimeler."
  end_good: "Bravo! Güveni sarsan kelimeleri de öğrendin. Yarın barış zamanı mı? Göreceğiz. 🕊️"
  end_mixed: "{weak} biraz kafa karıştırdı, çok normal; lie gibi kelimeler sinsi olur. Yarın yine karşılaşacaksınız."

notifications:
